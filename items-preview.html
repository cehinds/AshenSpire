<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AshenSpire · Painted Armory</title><link rel="stylesheet" href="styles/base.css"><link rel="stylesheet" href="styles/kit.css"><style>html,body{height:auto!important;min-height:100%;overflow:visible!important}body{overflow:auto!important;background:#14100d;color:#eadfc6}main{max-width:1320px;margin:auto;padding:32px 20px}header{margin-bottom:24px}header p{max-width:68ch;color:#bcac91}h1{color:var(--gold);font-family:Georgia,serif;font-size:36px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.toolbar input,.toolbar select{background:#241c16;color:#eadfc6;border:1px solid var(--line-soft);border-radius:6px;padding:10px;font:inherit;min-height:44px}.preview-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.8fr);gap:24px;align-items:start}.collection{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.collection button{width:100%;background:#241c16;border:1px solid var(--line-soft);border-radius:9px;color:inherit;text-align:left;padding:0;cursor:pointer}.collection button[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}.collection button:focus-visible{outline:2px solid #f7e6a6;outline-offset:3px}.collection .inventory-face{padding:12px;gap:8px}.inventory-detail{grid-template-columns:1fr}.inventory-detail>.inventory-model{width:100%;max-width:380px;justify-self:center}.inventory-item-art{width:5rem!important;height:5rem!important}#detail{position:sticky;top:20px}footer{margin-top:28px;color:#bcac91;font-size:14px}#count{align-self:center;color:#bcac91}@media(max-width:800px){.preview-layout{grid-template-columns:1fr}#detail{position:static;grid-row:1}.collection{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:28px}.collection .inventory-face{grid-template-columns:1fr}.collection .inventory-face>.inventory-item-art,.collection .inventory-face>.ob,.collection .inventory-face>.r-trail{grid-column:1;grid-row:auto}.collection .inventory-item-art{justify-self:center;width:7rem!important;height:7rem!important}}@media(prefers-reduced-motion:no-preference){.collection button{transition:border-color .15s,background .15s}.collection button:hover{background:#30261c}}</style><main><header><div class="as-eyebrow">ASHENSPIRE · ARMORY</div><h1>Steel, leather & weathered gold</h1><p>The complete painted armament collection. Select an item to inspect its artwork and authored equipment stats.</p></header><div class="toolbar"><input id="search" type="search" aria-label="Search armaments" placeholder="Find an armament…"><select id="kind" aria-label="Filter armaments"><option value="all">All armaments</option><option value="weapon">Weapons</option><option value="shield">Shields & off-hand tools</option><option value="staff">Staves & sceptres</option></select><span id="count" role="status"></span></div><div class="preview-layout"><section class="collection" aria-label="Armaments"></section><section id="detail" aria-live="polite"></section></div><footer>Inventory illustrations use a shared painted material palette. Character-held weapon sprites are a separate asset set.</footer></main><script type="module">
import { ARMAMENTS } from './src/content/equipment.js';
import { inventoryItemCardModel, inventoryDetailCardModel } from './src/ui/models/ArmouryModels.js';
import { renderInventoryItemCard, renderInventoryDetailCard } from './src/ui/components/armouryComponents.js';
const rows=ARMAMENTS.map(item=>({key:item.id,id:item.id,name:item.name,item,category:item.kind==='shield'?'Shield':item.kind==='staff'?'Staff':'Weapon',count:1,equippedLabels:[]}));let selected='greatsword';
function draw(){const q=document.querySelector('#search').value.toLowerCase(),kind=document.querySelector('#kind').value;const visible=rows.filter(r=>(kind==='all'||r.item.kind===kind)&&r.name.toLowerCase().includes(q));document.querySelector('#count').textContent=`${visible.length} of ${rows.length} armaments`;document.querySelector('.collection').replaceChildren(...visible.map(row=>{const b=document.createElement('button');b.type='button';b.dataset.item=row.id;b.setAttribute('aria-pressed',String(row.id===selected));b.append(renderInventoryItemCard(inventoryItemCardModel(row,{selected:row.id===selected})));b.onclick=()=>{selected=row.id;draw();document.querySelector(`[data-item="${selected}"]`)?.focus({preventScroll:true})};return b}));const row=rows.find(r=>r.id===selected);const mods=[`Attack ${row.item.attackRating}`,`Defense ${row.item.defenseRating}`,`Weight ${row.item.weight}`];document.querySelector('#detail').replaceChildren(renderInventoryDetailCard(inventoryDetailCardModel({row,art:{kind:'image',value:`assets/equipment/icon_${row.id}.webp`},description:row.item.blurb,mods})));}document.querySelector('#search').oninput=draw;document.querySelector('#kind').onchange=draw;draw();
</script></html>
