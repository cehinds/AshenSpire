<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AshenSpire · Painted Armory</title><link rel="stylesheet" href="styles/base.css"><link rel="stylesheet" href="styles/kit.css"><style>body{overflow:auto!important;background:#14100d;color:#eadfc6}main{max-width:1080px;margin:auto;padding:32px 20px}header{margin-bottom:32px}header p{max-width:65ch;color:#bcac91}h1{color:var(--gold);font-family:Georgia,serif;font-size:36px}.preview-layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px}.collection{display:grid;gap:12px;align-content:start}.collection button{width:100%;background:#241c16;border:1px solid var(--line-soft);border-radius:9px;color:inherit;text-align:left;padding:0}.collection button[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}.inventory-detail{height:100%;grid-template-columns:1fr}.inventory-detail>.inventory-model{width:100%;max-width:380px;justify-self:center}.inventory-item-art{width:5rem!important;height:5rem!important}footer{margin-top:28px;color:#bcac91;font-size:14px}@media(max-width:700px){.preview-layout{grid-template-columns:1fr}h1{font-size:28px}}</style><main><header><div class="as-eyebrow">ASHENSPIRE · ARMORY</div><h1>Steel, leather & weathered gold</h1><p>A first collection of painted armaments, shown in the game's item cards and detail panels. Select an item to inspect it.</p></header><div class="preview-layout"><section class="collection" aria-label="Armaments"></section><section id="detail" aria-live="polite"></section></div><footer>First artwork pass: Greatsword, Kite Shield and Parrying Dagger. Other equipment keeps its existing art.</footer></main><script type="module">
import { ARMAMENTS } from './src/content/equipment.js';
import { inventoryItemCardModel, inventoryDetailCardModel } from './src/ui/models/ArmouryModels.js';
import { renderInventoryItemCard, renderInventoryDetailCard } from './src/ui/components/armouryComponents.js';
const ids=['greatsword','kiteShield','parryDagger'];const rows=ids.map(id=>{const item=ARMAMENTS.find(i=>i.id===id);return {key:id,id,name:item.name,item,category:item.kind==='shield'?'Shield':'Weapon',count:1,equippedLabels:[]}});
function draw(selected){document.querySelector('.collection').replaceChildren(...rows.map(row=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed',String(row.id===selected));b.append(renderInventoryItemCard(inventoryItemCardModel(row,{selected:row.id===selected})));b.onclick=()=>draw(row.id);return b}));const row=rows.find(r=>r.id===selected);document.querySelector('#detail').replaceChildren(renderInventoryDetailCard(inventoryDetailCardModel({row,art:{kind:'image',value:`assets/equipment/icon_${row.id}.webp`},description:row.item.blurb,mods:[]})));}draw(ids[0]);
</script></html>
