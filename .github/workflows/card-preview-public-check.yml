name: card preview public check

# Allow the normal trusted Pages pipeline to finish, then prove this exact revision.
on:
  push:
    branches: ['Feature/CardPreview']
    paths:
      - 'docs/design/card-tag-design/published-card-preview/build.txt'
      - 'docs/design/card-tag-design/published-card-preview/check-public-page.mjs'
      - '.github/workflows/card-preview-public-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: docs/design/card-tag-design/published-card-preview/check-public-page.mjs
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify this revision and approved payload after trusted Pages publication
        run: node docs/design/card-tag-design/published-card-preview/check-public-page.mjs
