# .github/workflows/workbench.yml — the Workbench, the studios it frames and the
# engine export, on the branches and pull requests that touch them.
#
# WHAT IT RUNS: the node --test suites of workbench/, editor/ and ui-studio/
# plus tests/engine-export.test.mjs, tests/build-lock.test.mjs, tests/build-steps.test.mjs,
# tests/write-atomic.test.mjs and tests/shot-match.test.mjs; a full engine export into
# build/engine-export (uploaded as engine-export-<commit>, never committed);
# and workbench/tests/screenshots.mjs, which starts the Workbench with its child
# tools and captures every screen in a real browser (uploaded as
# workbench-screenshots-<commit>; the committed set in
# docs/workbench/screenshots/ is regenerated by hand, see workbench/README.md).
#
# WHERE: a push to a feature/chore/fix branch, or a pull request into `dev`,
# that touches one of the paths below; or by hand (Actions → Run workflow). It
# is about two minutes, inside the fast-check budget for pull requests into dev
# (DEVELOPER.md, *Which checks gate a pull request*).

name: workbench

on:
  push:
    branches: ['feature/**', 'chore/**', 'Chore/**', 'fix/**']
    paths:
      - 'workbench/**'
      - 'editor/**'
      - 'ui-studio/**'
      - 'pose-studio/**'
      - 'content/**'
      - 'src/content/**'
      - '.github/actions/**'
      - 'tools/engine-export.mjs'
      - 'tests/engine-export.test.mjs'
      - 'tools/lib/build-lock.mjs'
      - 'tests/build-lock.test.mjs'
      - 'tests/generated-writer-locks.test.mjs'
      - 'tools/base-cards.mjs'
      - 'tools/game-config.mjs'
      - 'tools/lib/process-tree.mjs'
      - 'tools/lib/build-steps.mjs'
      - 'tools/lib/write-atomic.mjs'
      - 'tools/lib/shot-match.mjs'
      - 'tools/launch.mjs'
      - 'tests/build-steps.test.mjs'
      - 'tests/write-atomic.test.mjs'
      - 'tests/shot-match.test.mjs'
      - 'docs/workbench/**'
      - '.github/workflows/workbench.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'workbench/**'
      - 'editor/**'
      - 'ui-studio/**'
      - 'pose-studio/**'
      - 'content/**'
      - 'src/content/**'
      - '.github/actions/**'
      - 'tools/engine-export.mjs'
      - 'tests/engine-export.test.mjs'
      - 'tools/lib/build-lock.mjs'
      - 'tests/build-lock.test.mjs'
      - 'tests/generated-writer-locks.test.mjs'
      - 'tools/base-cards.mjs'
      - 'tools/game-config.mjs'
      - 'tools/lib/process-tree.mjs'
      - 'tools/lib/build-steps.mjs'
      - 'tools/lib/write-atomic.mjs'
      - 'tools/lib/shot-match.mjs'
      - 'tools/launch.mjs'
      - 'tests/build-steps.test.mjs'
      - 'tests/write-atomic.test.mjs'
      - 'tests/shot-match.test.mjs'
      - 'docs/workbench/**'
      - '.github/workflows/workbench.yml'
  workflow_dispatch:

concurrency:
  group: workbench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The game server the Workbench starts (tools/serve.mjs) serves /assets/ from
# the fetched art packs (docs/EXTERNAL-ASSETS-PLAN.md, step 13), so the
# screenshots fetch all three packs, as coop-hud.yml does.
env:
  ASHEN_ART_SOURCE: cache
  ART_PACKS: all

jobs:
  workbench:
    name: Workbench, studios and engine export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false # the tools read the source tree; no LFS object

      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/fetch-art
        with:
          packs: ${{ env.ART_PACKS }}

      - name: Workbench, editor, UI Studio, engine-export and build-lock tests
        run: node --test workbench/tests/*.test.mjs editor/tests/*.test.mjs ui-studio/tests/*.test.mjs tests/engine-export.test.mjs tests/build-lock.test.mjs tests/generated-writer-locks.test.mjs tests/build-steps.test.mjs tests/write-atomic.test.mjs tests/shot-match.test.mjs

      - name: Engine export
        run: node tools/engine-export.mjs --out build/engine-export

      - uses: ./.github/actions/which-browser

      # Playwright drives the runner's own Chrome; it is installed outside the
      # checkout and never committed (workbench/tests/screenshots.mjs).
      - name: Install Playwright (no browser download)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-audit --no-fund playwright@1.49.1

      - name: Workbench screenshots
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
          CHROME_PATH: /usr/bin/google-chrome
        run: node workbench/tests/screenshots.mjs --out "$RUNNER_TEMP/workbench-screenshots"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-export-${{ github.sha }}
          path: build/engine-export
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/workbench-screenshots
          if-no-files-found: warn
          retention-days: 14

  # The Workbench runs on Windows and macOS too (its launchers, its watcher modes, its
  # process-group stops differ there). Each test is limited to 3 minutes, so one that
  # hangs fails by name instead of the job timing out with no output.
  workbench-os:
    name: Workbench tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false # a Windows-only failure is a finding; do not hide it behind macOS
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Keep checked-out bytes identical to stored bytes
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          lfs: false

      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/fetch-art
        with:
          packs: ${{ env.ART_PACKS }}

      - name: Workbench, editor, UI Studio, engine-export and build-lock tests
        shell: bash
        run: |
          LOG="${RUNNER_TEMP:-/tmp}/workbench-tap.log"
          # --test-reporter=tap pins the format the reader below parses, so it is the
          # same on windows-latest and macos-latest whatever the runner's default is.
          # --test-timeout (8 min) must exceed the engine-export job test's wait for the repo
          # .build-lock: CLI_WAIT_MS (5 min) + 60 s in workbench/tests/server.test.mjs.
          set +e; node --test --test-reporter=tap --test-timeout=480000 workbench/tests/*.test.mjs editor/tests/*.test.mjs ui-studio/tests/*.test.mjs tests/engine-export.test.mjs tests/build-lock.test.mjs tests/generated-writer-locks.test.mjs tests/build-steps.test.mjs tests/write-atomic.test.mjs tests/shot-match.test.mjs 2>&1 | tee "$LOG"; rc=${PIPESTATUS[0]}; set -e
          # The TAP failures (first 10 not-ok lines, each with its preceding subtest
          # name and the 10 lines after it) and the pass/fail totals become annotations.
          # The summary notice is unconditional: with no "# pass" line it says so. The
          # reader has no "|| true", so a reader that breaks fails the step visibly.
          # The exit code of node --test is re-raised below.
          node - "$LOG" "$rc" <<'NODE'
          const fs = require('fs');
          const esc = (s) => s.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          const raw = fs.existsSync(process.argv[2]) ? fs.readFileSync(process.argv[2], 'utf8') : null;
          const lines = (raw || '').split('\n').map((l) => l.replace(/\r$/, ''));
          const grab = (name) => lines.map((l) => l.match(new RegExp('^# ' + name + ' (\\d+)'))).filter(Boolean).pop();
          const pass = grab('pass');
          const fail = grab('fail');
          const summary = pass
            ? `# pass ${pass[1]}, # fail ${fail ? fail[1] : '(no fail line)'}; node --test exit code ${process.argv[3]}`
            : `no "# pass" line found in ${raw === null ? 'a missing log' : lines.length + ' log lines'}; node --test exit code ${process.argv[3]}`;
          console.log(`::notice title=workbench-summary::${esc(summary)}`);
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'workbench-summary: ' + summary + '\n');
          let subtest = '';
          let shown = 0;
          for (let i = 0; i < lines.length && shown < 10; i++) {
            const l = lines[i];
            if (/^\s*# Subtest/.test(l)) { subtest = l.trim(); continue; }
            if (/^\s*not ok\b/.test(l)) {
              const block = lines.slice(i, i + 11).map((x) => x.trimEnd()).join('\n');
              console.log(`::error title=workbench-fail::${esc((subtest ? subtest + '\n' : '') + block)}`);
              shown++;
            }
          }
          NODE
          exit $rc
