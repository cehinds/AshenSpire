name: final focused compiled parity
on:
  push:
    branches: ['worker/FullCombatAudit/final-compiled-parity']
    paths: ['.github/workflows/final-compiled-parity.yml']
permissions:
  contents: read
  actions: read
jobs:
  capture:
    if: github.ref == 'refs/heads/worker/FullCombatAudit/final-compiled-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/browser.mjs
            tools/combat-audit/final-compiled-parity.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify existing immutable standalone archive
        uses: actions/github-script@v8
        with:
          script: |
            const assert=require('node:assert/strict'),fs=require('node:fs'),crypto=require('node:crypto');
            const expected={"run":38720084161,"id":11964178167,"commit":"5be5ec5e219ea10bb99acd08d1c5bbb1c930f4e1","source":"5bec9d014c","ordinal":"1538","archiveSha256":"6b332f6a479f1170b9ccbb1437fd4e7428c3f5796a40efb9f64b8c3a3d7bceea","archiveBytes":50376524,"htmlBytes":79979392};
            const {data:run}=await github.rest.actions.getWorkflowRun({owner:'cehinds',repo:'AshenSpire',run_id:expected.run});
            assert.equal(run.head_sha,expected.commit);
            const {data:artifact}=await github.rest.actions.getArtifact({owner:'cehinds',repo:'AshenSpire',artifact_id:expected.id});
            assert.equal(artifact.workflow_run.id,expected.run);assert.equal(artifact.workflow_run.head_sha,expected.commit);assert.equal(artifact.expired,false);
            const response=await github.rest.actions.downloadArtifact({owner:'cehinds',repo:'AshenSpire',artifact_id:expected.id,archive_format:'zip'});
            const bytes=Buffer.from(response.data),digest=crypto.createHash('sha256').update(bytes).digest('hex');
            assert.equal(bytes.length,expected.archiveBytes);assert.equal(digest,expected.archiveSha256);
            fs.writeFileSync('_existing-standalone.zip',bytes);fs.writeFileSync('_archive-identity.json',JSON.stringify({...expected,artifactName:artifact.name,observedAt:new Date().toISOString()},null,2));
      - run: unzip -q _existing-standalone.zip -d _existing-standalone
      - run: npm install --no-save --package-lock=false playwright
      - name: Two Rogue paid rows and canonical Frost Counter support
        env:
          PARITY_ARTIFACT_IDENTITY: '{"run":38720084161,"id":11964178167,"commit":"5be5ec5e219ea10bb99acd08d1c5bbb1c930f4e1","source":"5bec9d014c","ordinal":"1538","archiveSha256":"6b332f6a479f1170b9ccbb1437fd4e7428c3f5796a40efb9f64b8c3a3d7bceea","archiveBytes":50376524,"htmlBytes":79979392}'
        run: node tools/combat-audit/final-compiled-parity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-focused-compiled-parity-${{ github.sha }}
          path: _final-parity/
          if-no-files-found: error
          retention-days: 14
