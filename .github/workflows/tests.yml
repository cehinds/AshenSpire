# .github/workflows/tests.yml — the test suite and the build-integrity gate.
#
# Two jobs, Linux only, on every PR into dev and every push to dev:
#   tests  — `node --test "tests/*.test.mjs"`: the five scenario tests
#            (solo run, combat rules, co-op, content integrity, UI screens).
#   build  — the shipped artifact is this source: release series, one derived
#            version, shipped files carry their art, mobile twin tree, then a
#            fresh build (the bundler's parse gate runs inside it) that must
#            equal what is committed.
#
# The browser smoke lives in dev-preview.yml; receipts and the About-changelog
# projection are process gates in receipts.yml.

name: tests

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: node test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: ./.github/actions/setup-node

      - name: The five scenario tests
        run: node --test "tests/*.test.mjs"

  build:
    name: build integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: ./.github/actions/setup-node

      - name: Current builds use the 0.7.x.x release series
        run: node tools/release-series.mjs

      - name: One version, derived, and it belongs to this tree
        run: node tools/buildversion.mjs --check

      - name: Root + dist carry their art, and ARE the build
        run: node tools/verify-shipped.mjs

      - name: The mobile art twin tree mirrors assets/ and fits its budget
        run: node tools/mobile-art.mjs --check

      - name: Every asset directory has a CREDITS row and README Legal agrees with the AI disclosure
        run: node tools/credits-check.mjs

      - name: Rebuild the standalone (the bundler refuses a bundle that does not parse)
        run: node tools/launch.mjs --build-only

      - name: The committed artifact equals the fresh build
        run: |
          git --no-pager diff --stat -- AshenSpire.html AshenSpire-mobile.html build dist
          git diff --exit-code -- AshenSpire.html AshenSpire-mobile.html build dist
