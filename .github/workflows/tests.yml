# .github/workflows/tests.yml — every test in the repository, on every push to
# `test` and `release`; core and discovery shards also on every PR into dev and every
# push to dev.
#
# WHY THIS FILE EXISTS. ci.yml holds the whole suite but was dispatch-only
# from 2026-08-01 (cost: a 3-OS matrix, macOS at 10x). dev-preview.yml runs on
# pull requests but carries a hand-picked handful of test files. So on a PR,
# most of tests/ ran nowhere, and eighteen test files had never run in any job;
# four of those had gone red unseen.
#
# WHERE IT RUNS, by the owner's ruling of 2026-09-26: a pull request into `dev`
# is gated by fast checks only (about five minutes or less), and the heavy
# suites run when code is pushed to `test` and `release`.
#   pull_request into dev    — `core` and the four `discovered` shards, which
#                              leave out SLOW_DISCOVERED (--no-slow). Each is
#                              about four minutes or less. `discovered-slow`,
#                              `selftests` (about 6 min) and `parse-gate`
#                              (about 13 min) are skipped by their job-level
#                              `if:`, which reports them as skipped rather than
#                              absent.
#   push to dev              — the same as a pull request, so the merged tree
#                              is read at once: two PRs each green alone can
#                              break together.
#   push to test / release   — every job.
#   workflow_dispatch        — every job, on any ref.
# Nothing was removed: every original check runs on every push
# to `test` and `release`.
#
# SLOW_DISCOVERED (tests/run-node-lanes.mjs) names the four discovered files
# that spawn full simulation runs. They were over half of all discovered-test
# time, and balance-doc alone held one shard at 8m19s (run 38028766946, a
# 9m31s wall on a PR into dev). They run in `discovered-slow`, and in ci.yml's
# discovered shards, which pass neither --no-slow nor --slow-only.
#
# WHAT IT COSTS. Linux only, no LFS (no test here reads an LFS-tracked
# artifact; they are the built HTML files), and 50 commits of history plus
# origin/dev, which zoomunits needs for its merge-base. `pull_request` and
# `push` never share a ref here, so no commit runs twice — the defect ci.yml's
# header measured for `push: ['**']` + `pull_request`.
#
# PARALLEL JOBS, so a slow corpus cannot hold the fast answer hostage and
# no job reads a tree another is mutating:
#   core       — on the lean checkout ci.yml's `test` job uses (no
#                history blobs, no source PNGs; its header has the strace),
#                the art release fetch first (step 12: the suite reads the
#                packs), the engine suite, each
#                tool's verdict on the tree as it stands (tests/run-node.mjs),
#                the no-browser CHANGELOG ordering check with its own
#                known-bads (step 13 retired the `fetch-art --agree` step
#                that followed: the trees it compared with are gone)
#   selftests  — every tool's `--selftest` known-bad corpus (tests/run-node.mjs)
#   parse-gate — the bundler's parse-gate fixtures (tools/bundle.test.mjs). It
#                ran as a second step of `selftests` and, at about twelve
#                minutes, set the run's wall time on its own; alone it runs
#                beside the other two instead of after one of them.
#
# CANCELLATION IS FOR PULL REQUESTS ONLY. A newer push to a PR branch makes the
# older run's answer moot, so it is cancelled. A push to `test` or `release` is
# a promotion, and each promoted tree is its own answer. Not cancelling is not
# enough on its own: GitHub keeps at most one running and one pending run per
# group, and a newer pending run replaces the older one, so in a burst of three
# pushes the middle one went without a run. So a push (and a dispatch) is
# grouped by its SHA, one group per commit, and a pull request by its ref.

name: tests

on:
  pull_request:
    branches: [dev, alternative/dev, 'alternative/**/dev'] # fast core + discovered shards (--no-slow)
  push:
    branches: [dev, test, release, alternative/dev, 'alternative/**/dev', alternative/test, 'alternative/**/test'] # core + discovered shards on dev; see the header
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# STEPS 12 AND 13 (docs/EXTERNAL-ASSETS-PLAN.md): the art trees (assets/,
# assets-mobile/, the fonts, music/, map-detail/ and art/) left this repository
# at step 13; every reader reads the fetched art packs through
# tools/art-source.mjs, which fails (naming the fetch) for a pack that is not
# fetched. Each job that builds, serves or tests the checkout fetches with
# ./.github/actions/fetch-art right after setup-node, and fetches ALL THREE
# packs: the high pack is what /assets/ serves from source (tools/serve.mjs) and
# what the art checks read, as the assets/ tree was before step 13.
# ASHEN_ART_SOURCE=cache is the default behaviour now, kept as a name.
env:
  ASHEN_ART_SOURCE: cache
  ART_PACKS: all

jobs:
  core:
    name: core suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50 # zoomunits (37) reads `git merge-base origin/dev HEAD`
          # The lean checkout ci.yml's `test` job runs this same suite on: no
          # history blobs, and no source PNGs, which no step here opens.
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/art/**/*.png
            !/docs/**/*.png

      - name: The base branch, for the tools that measure against it
        run: git fetch --no-tags --depth=50 origin +refs/heads/dev:refs/remotes/origin/dev

      - uses: ./.github/actions/setup-node
      - name: Install card artwork encoder for conversion tests
        run: |
          python3 -m venv "$RUNNER_TEMP/card-art-python"
          "$RUNNER_TEMP/card-art-python/bin/python" -m pip install Pillow==11.1.0
          echo "$RUNNER_TEMP/card-art-python/bin" >> "$GITHUB_PATH"
      # The art packs, before anything builds, serves or tests this checkout (step 12).
      - uses: ./.github/actions/fetch-art
        env:
          # THE TOKEN RULE IS DEFENCE IN DEPTH, NOT A SECURITY BOUNDARY. The art
          # repository is public, so ART_REPO_TOKEN only raises the API rate limit.
          # Only a push or dispatch of a protected branch (dev, test, release, main)
          # passes it, so a branch that edits tools/fetch-art.mjs alone cannot read
          # it; but anyone who can push a branch can edit this workflow to read any
          # secret. The real fix is the owner's: delete the ART_REPO_TOKEN secret, or
          # move it into a GitHub Environment limited to dev, test, release and main
          # (docs/EXTERNAL-ASSETS-PLAN.md, step 11).
          ART_REPO_TOKEN: ${{ github.event_name != 'pull_request' && contains(fromJSON('["refs/heads/dev","refs/heads/test","refs/heads/release","refs/heads/main"]'), github.ref) && secrets.ART_REPO_TOKEN || '' }}
        with:
          packs: ${{ env.ART_PACKS }}

      - name: Engine suite and each tool's verdict on the tree
        run: node tools/verdict.mjs -- node tests/run-node.mjs --no-selftests --no-discovered

      - name: CHANGELOG receipts run newest first and name builds that exist (no browser)
        if: always() # independent of the step above; a red there must not hide this
        run: node tools/verdict.mjs -- node tools/about-changelog.mjs --check-order

      - name: The ordering check still catches its own known-bads
        if: always()
        run: node tools/verdict.mjs -- node tools/about-changelog.mjs --check-order --selftest

  discovered:
    name: discovered tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['0/4', '1/4', '2/4', '3/4']
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50 # zoomunits (37) reads `git merge-base origin/dev HEAD`
          # Match the heavy discovery lane: retain source and history while
          # leaving unused authoring PNGs out of this test-only checkout.
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/art/**/*.png
            !/docs/**/*.png

      - name: The base branch, for the tools that measure against it
        run: git fetch --no-tags --depth=50 origin +refs/heads/dev:refs/remotes/origin/dev

      - uses: ./.github/actions/setup-node
      - name: Install card artwork encoder for conversion tests
        run: |
          python3 -m venv "$RUNNER_TEMP/card-art-python"
          "$RUNNER_TEMP/card-art-python/bin/python" -m pip install Pillow==11.1.0
          echo "$RUNNER_TEMP/card-art-python/bin" >> "$GITHUB_PATH"
      # The art packs, before anything builds, serves or tests this checkout (step 12).
      - uses: ./.github/actions/fetch-art
        env:
          # THE TOKEN RULE IS DEFENCE IN DEPTH, NOT A SECURITY BOUNDARY. The art
          # repository is public, so ART_REPO_TOKEN only raises the API rate limit.
          # Only a push or dispatch of a protected branch (dev, test, release, main)
          # passes it, so a branch that edits tools/fetch-art.mjs alone cannot read
          # it; but anyone who can push a branch can edit this workflow to read any
          # secret. The real fix is the owner's: delete the ART_REPO_TOKEN secret, or
          # move it into a GitHub Environment limited to dev, test, release and main
          # (docs/EXTERNAL-ASSETS-PLAN.md, step 11).
          ART_REPO_TOKEN: ${{ github.event_name != 'pull_request' && contains(fromJSON('["refs/heads/dev","refs/heads/test","refs/heads/release","refs/heads/main"]'), github.ref) && secrets.ART_REPO_TOKEN || '' }}
        with:
          packs: ${{ env.ART_PACKS }}

      - name: Every discovered test file but the slow ones, partitioned without omissions
        run: node tools/verdict.mjs -- node tests/run-node.mjs --discovered-only --no-slow --shard ${{ matrix.shard }}

  discovered-slow:
    name: discovered tests (slow simulations)
    # SLOW_DISCOVERED (tests/run-node-lanes.mjs): over the dev-PR budget, so it
    # runs on push to test and release (and on dispatch), as `selftests` does.
    if: github.event_name != 'pull_request' && !endsWith(github.ref_name, '/dev') && !(github.event_name == 'push' && github.ref_name == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/art/**/*.png
            !/docs/**/*.png

      - uses: ./.github/actions/setup-node
      # The art packs, before anything builds, serves or tests this checkout (step 12).
      - uses: ./.github/actions/fetch-art
        with:
          packs: ${{ env.ART_PACKS }}

      - name: The slow discovered test files (full simulation runs)
        run: node tools/verdict.mjs -- node tests/run-node.mjs --discovered-only --slow-only

  selftests:
    name: tool self-tests (${{ matrix.group }})
    # About 6 minutes: over the dev-PR budget, so it runs on push to test and
    # release (and on dispatch), not on a pull request into dev.
    if: github.event_name != 'pull_request' && !endsWith(github.ref_name, '/dev') && !(github.event_name == 'push' && github.ref_name == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [link, other]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50 # zoomunits (37) reads `git merge-base origin/dev HEAD`

      - name: The base branch, for the tools that measure against it
        run: git fetch --no-tags --depth=50 origin +refs/heads/dev:refs/remotes/origin/dev

      - uses: ./.github/actions/setup-node
      # The art packs, before anything builds, serves or tests this checkout (step 12).
      - uses: ./.github/actions/fetch-art
        with:
          packs: ${{ env.ART_PACKS }}

      - name: Every tool check still catches its own known-bad corpus
        run: node tools/verdict.mjs -- node tests/run-node.mjs --selftests-only --selftest-group ${{ matrix.group }}

  parse-gate:
    name: bundler parse gate
    # About 13 minutes: runs on push to test and release (and on dispatch),
    # not on a pull request into dev.
    if: github.event_name != 'pull_request' && !endsWith(github.ref_name, '/dev') && !(github.event_name == 'push' && github.ref_name == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node
      # The art packs, before anything builds, serves or tests this checkout (step 12).
      - uses: ./.github/actions/fetch-art
        with:
          packs: ${{ env.ART_PACKS }}

      - name: Parse gate — the bundler's own known-bad fixtures
        run: node tools/bundle.test.mjs
