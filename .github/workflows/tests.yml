# .github/workflows/tests.yml — every test in the repository, on every PR into dev.
#
# WHY THIS FILE EXISTS. ci.yml holds the whole suite but has been dispatch-only
# since 2026-08-01 (cost: a 3-OS matrix, macOS at 10x). dev-preview.yml runs on
# pull requests but carries a hand-picked handful of test files. So on a PR,
# most of tests/ ran nowhere, and eighteen test files had never run in any job;
# four of those had gone red unseen.
#
# WHAT IT COSTS, and why the triggers are these. Linux only, no LFS (no test
# here reads an LFS-tracked artifact; they are the built HTML files), a shallow
# checkout. `pull_request` into dev plus `push` to dev: a feature branch is
# covered by its PR, and the push covers the post-merge tree. The two events
# never share a ref, so no commit runs twice — the defect ci.yml's header
# measured for `push: ['**']` + `pull_request`. ci.yml's own triggers are left
# exactly as the owner set them.
#
# TWO JOBS, ONE RUNNER (tests/run-node.mjs), so a slow corpus cannot hold the
# fast answer hostage and neither job reads a tree the other is mutating:
#   core       — the engine suite, every discovered *.test.mjs, and each tool's
#                verdict on the tree as it stands
#   selftests  — every tool's `--selftest` known-bad corpus, plus the bundler's
#                parse-gate fixtures (tools/bundle.test.mjs, minutes long)

name: tests

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: core suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Engine suite, every discovered test file, and each tool's verdict on the tree
        run: node tools/verdict.mjs -- node tests/run-node.mjs --no-selftests

  selftests:
    name: tool self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Every tool check still catches its own known-bad corpus
        run: node tools/verdict.mjs -- node tests/run-node.mjs --selftests-only

      - name: Parse gate — the bundler's own known-bad fixtures
        run: node tools/bundle.test.mjs
