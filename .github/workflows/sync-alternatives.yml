name: sync alternative branches

on:
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: sync-alternative-branches
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.ref_name == 'test' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      branches: ${{ steps.sync.outputs.branches }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: false
      - uses: ./.github/actions/setup-node
      - name: Fetch current branch tips
        run: git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Set merge identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Preserve variant changes and push existing pairs atomically
        id: sync
        env:
          # Dispatch retries the current promotion, never unpromoted dev work.
          PROMOTED_SHA: ${{ github.event_name == 'push' && github.sha || 'origin/test' }}
        run: node tools/sync-alternatives.mjs --push

  checks:
    needs: sync
    if: needs.sync.outputs.branches != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.sync.outputs.branches) }}
    steps:
      # GITHUB_TOKEN pushes do not trigger push workflows. Explicit dispatches
      # do, without requiring a PAT or bypassing branch protection.
      - name: Start the matching development or test pipelines
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ matrix.branch }}
        shell: bash
        run: |
          set -euo pipefail
          workflows=(dev-preview.yml tests.yml quick-start.yml map-camera.yml tutorial-reach.yml)
          if [[ "$BRANCH" == */test ]]; then
            workflows+=(ci.yml coop-hud.yml windows-installer.yml)
          else
            workflows+=(receipts.yml architecture-sync.yml)
          fi
          failed=0
          for workflow in "${workflows[@]}"; do
            gh workflow run "$workflow" --ref "$BRANCH" || failed=1
          done
          exit "$failed"
