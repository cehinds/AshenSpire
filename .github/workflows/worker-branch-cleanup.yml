name: worker-branch-cleanup

# WHY THIS EXISTS (owner, 2026-10-11). Worker branches are named
# `worker/<parent-topic>/<task>` and pushed to origin so the orchestrator can
# merge them into their parent branch. Once a parent is merged and `dev` is
# promoted to `test`, those origin worker branches are no longer needed.
#
# THE RULE. Delete every origin `worker/**` branch whose tip is an ancestor of
# `origin/test`. Nothing outside `worker/` is ever touched. A worker branch that
# is not yet merged into `test` is kept and listed in the step summary.
#
# BOUNDARY. This only deletes origin worker branch pointers. Local worktrees and
# local worker branches are cleaned up by the session that owns them.

on:
  push:
    branches: [test]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be deleted without deleting anything'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: worker-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Delete origin worker branches merged into test
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/worker/*:refs/remotes/origin/worker/*' '+refs/heads/test:refs/remotes/origin/test'

          deleted=()
          kept=()
          while IFS= read -r b; do
            [ -n "$b" ] || continue
            if git merge-base --is-ancestor "refs/remotes/origin/$b" refs/remotes/origin/test; then
              if [ "$DRY_RUN" = "true" ]; then
                echo "[dry run] would delete worker/$b"
              else
                git push origin --delete "$b"
                echo "deleted worker/$b"
              fi
              deleted+=("$b")
            else
              echo "kept worker/$b (not merged into test)"
              kept+=("$b")
            fi
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/worker/)

          {
            echo "## worker-branch-cleanup"
            echo
            if [ "$DRY_RUN" = "true" ]; then echo "Dry run: nothing was deleted."; echo; fi
            echo "### Deleted (${#deleted[@]})"
            for b in "${deleted[@]+"${deleted[@]}"}"; do echo "- \`worker/$b\`"; done
            echo
            echo "### Kept, not merged into test (${#kept[@]})"
            for b in "${kept[@]+"${kept[@]}"}"; do echo "- \`worker/$b\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
