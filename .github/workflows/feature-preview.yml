name: feature preview

# This dedicated branch publishes a visual card proposal, not a game build.
# The trusted dev Pages collector handles deployment through its sandbox wrapper.
on:
  push:
    branches: ['[Ff][Ee][Aa][Tt][Uu][Rr][Ee]/**', '[Ff][Ii][Xx]/**', '[Cc][Hh][Oo][Rr][Ee]/**']
    paths:
      - '.github/workflows/feature-preview.yml'
      - 'docs/design/card-tag-design/published-card-preview/**'
      - README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate and package the approved standalone card gallery
        run: |
          node docs/design/card-tag-design/published-card-preview/validate-bundle.mjs
          mkdir -p feature-preview
          cp docs/design/card-tag-design/published-card-preview/build.txt feature-preview/AshenSpire.html
          cp docs/design/card-tag-design/published-card-preview/provenance.json feature-preview/provenance.json
          cp docs/design/card-tag-design/published-card-preview/README.md feature-preview/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: feature-preview-${{ github.sha }}
          path: feature-preview/
          if-no-files-found: error
          retention-days: 14
