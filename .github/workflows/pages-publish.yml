# pages-publish — the deploy half of pages-builds, so a merge republishes the site.
#
# WHY THIS FILE EXISTS. #543 split assembly from deployment for a real reason, and
# that reason still holds: on a push, the workflow file THAT PUSH CARRIES is the one
# that runs. A guard written inside it — `github.actor == github.repository_owner`,
# anything — is a guard the pusher can delete in the same commit. So a push-triggered
# job must never hold `pages: write` or an OIDC token, and in pages-builds it does
# not. The cost of that correctness was #553: nothing republished after a merge or a
# promotion, and /dev /test /release served builds from 2026-09-02 04:20Z onward.
#
# HOW THIS FILE IS DIFFERENT FROM A PUSH TRIGGER. `workflow_run` always runs the
# DEFAULT BRANCH's copy of the workflow, whatever branch the run it followed was on.
# A push to `test` cannot rewrite this file's guard, because this file is not read
# from `test`. That is the whole reason the trigger is `workflow_run` and not `push`,
# and it is why the write credential can live here when it could not live there.
#
# IT FAILS CLOSED, AND THAT IS NOT A SETTING. AGENTS.md holds publication as its
# own separate authority that push authority never implies. A first cut of this file
# left the owner's approval to an OPTIONAL environment setting and said both states
# were defensible. They are not: with the setting unturned, merging to `dev` would
# have BEEN the publication decision, which is the exact substitution the invariant
# refuses. Codex called that a P1 on #576 and was right.
#
# So the gate is in this file and it is closed by default. The job does not run
# unless a REPOSITORY VARIABLE says it may:
#
#   Settings → Secrets and variables → Actions → Variables → PAGES_AUTOPUBLISH = PUBLISH
#
# Unset, misspelled, or removed, nothing publishes and no job holding `pages: write`
# ever starts. A repository variable is settable only with admin on the repository,
# so it cannot be reached by branch-controlled code, by a workflow file a push
# carries, or by a write collaborator — which is what makes turning it on an owner
# publication decision rather than a convenience toggle. Turning it off again is how
# publication is withdrawn.
#
# On top of that, and independently, the `github-pages` environment can carry
# required reviewers (Settings → Environments → github-pages), which makes each
# individual publication wait for an approval instead of authorizing the standing
# stream. The variable is the standing authority; the reviewers are the per-act one.
#
# The manual `deploy` job in pages-builds.yml is untouched and remains the forced
# republish for when nothing has been pushed.
#
# COST: this re-assembles rather than reusing the assemble run's artifact, because
# actions/deploy-pages@v4 takes no run id and can only deploy an artifact its OWN run
# uploaded. That is not a workaround: the site is a function of the four branches'
# history, not of any one pushed tree, so building it again from that history is the
# same site by construction — and it re-proves the generator's drift plant before
# anything is published.
name: pages-publish

on:
  workflow_run:
    workflows: [pages-builds]
    types: [completed]

concurrency:
  group: pages-publish
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    # Only a SUCCESSFUL assemble publishes, and only for the four published
    # branches — a cancelled run (pages-builds cancels in-progress on a newer
    # push) and a failed one both stop here rather than deploying a site whose
    # drift plant was never proven.
    #
    # THE FIRST CLAUSE IS THE AUTHORITY AND IT IS EVALUATED BEFORE ANYTHING ELSE:
    # with PAGES_AUTOPUBLISH unset this job never starts, so the `pages: write` and
    # OIDC grants below are never issued. Push authority alone reaches nothing.
    #
    # AND ONLY THE PUSH PATH. workflow_run fires whatever triggered the run it
    # follows, so without this clause the owner's own dispatch would deploy twice
    # — once from pages-builds' `deploy` job and once from here. The dispatch
    # keeps its own job; this file is the push half and nothing else.
    if: >-
      vars.PAGES_AUTOPUBLISH == 'PUBLISH'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && contains(fromJSON('["dev", "test", "release", "main"]'), github.event.workflow_run.head_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pinned to the default branch by name rather than left to the event's
      # default, so the tooling that assembles the site is read from the branch
      # this workflow's own guard lives on, and is never the followed run's tree.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Fetch the four published branches so their history is readable
        run: git fetch --no-tags origin dev test release main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Assemble the site from git history — every listed build proven byte-identical
        run: node tools/verdict.mjs -- node tools/pages-site.mjs --out _site --keep 10
      - name: The generator's own drift plant is still caught
        run: node tools/verdict.mjs -- node tools/pages-site.mjs --selftest
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish the assembled site
        id: deployment
        uses: actions/deploy-pages@v4
