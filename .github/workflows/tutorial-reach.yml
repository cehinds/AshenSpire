# .github/workflows/tutorial-reach.yml — the first-run tutorial's exits, in a
# real browser, on a push to test and on workflow_dispatch.
#
# WHY THIS FILE EXISTS (docs/FINISH.md §6, "The tutorial reachability probe runs
# in CI"). The coach marks (src/ui/components/tutorial.js) are the only thing
# that writes `seenTutorial`: if their buttons are off-screen or covered, the
# veil cannot be dismissed and comes back on reload. `tools/tutorial-reach.mjs`
# is the only check that sees it — real Chromium at eight viewports (--ui-zoom
# 0.64–1.70), real mouse clicks at the buttons' screen coordinates, the ordered
# Escape contract, a resize mid-tutorial, and the real first-run path through
# durable storage, ending in a reload that reads `seenTutorial` back. ci.yml's
# boundary block has said "NO job here runs it" since 2026-07-28; nothing did,
# and on 2026-10-02 it was red at every viewport with nobody watching.
#
# WHERE IT RUNS (owner, 2026-10-11, the stage rules). A pull request into dev
# and a push to dev run only the base smoke (about five minutes), and this file
# is not part of it. It runs on a push to `test` (and `alternative/**/test`) and
# on workflow_dispatch, where the higher-level testing lives. The full sweep is
# ~10 minutes of browser time in one process, so it is SHARDED with the tool's
# own `--only` list into three parallel jobs of a few minutes each; together
# they cover every case the bare `node tools/tutorial-reach.mjs` runs, and a
# shard that names an unknown case exits 2 instead of running nothing.
#
# On a push to `release` it runs only when that tree differs from origin/test (the
# `stage` job decides); the test stage already ran the same code.
#
# A JOB OF ITS OWN, like map-camera.yml and coop-hud.yml: `core` is a no-browser
# lane. It serves the SOURCE tree, so it needs no build and no LFS. With no
# browser the tool throws and the door reads it as HARNESS (exit 2), never as a
# pass. The verdict door requires the tool's counted "N passed, M failed" line.

name: tutorial reach

on:
  push:
    branches: [test, release, 'alternative/**/test']
  workflow_dispatch:

concurrency:
  group: tutorial-reach-${{ github.ref_name }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

# STEPS 12 AND 13 (docs/EXTERNAL-ASSETS-PLAN.md): the art trees (assets/,
# assets-mobile/, the fonts, music/, map-detail/ and art/) left this repository
# at step 13; every reader reads the fetched art packs through
# tools/art-source.mjs, which fails (naming the fetch) for a pack that is not
# fetched. Each job that builds, serves or tests the checkout fetches with
# ./.github/actions/fetch-art right after setup-node, and fetches ALL THREE
# packs: the high pack is what /assets/ serves from source (tools/serve.mjs) and
# what the art checks read, as the assets/ tree was before step 13.
# ASHEN_ART_SOURCE=cache is the default behaviour now, kept as a name.
env:
  ASHEN_ART_SOURCE: cache
  ART_PACKS: all

jobs:
  # ---------------------------------------------------------------------------
  # THE STAGE DECISION. The job below runs unless this is a push to `release`
  # whose tree equals origin/test: a release that carries only the SHA the test
  # stage already ran is not run again. A fix that landed on release directly
  # differs from test and runs. A failed fetch or diff counts as a difference.
  # Pure git, no tool runs here. The same decision as ci.yml's `stage` job.
  # ---------------------------------------------------------------------------
  stage:
    name: stage decision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # Trees only: a sparse checkout of .github and blobless history, so the
      # 2 GB art tree is never fetched for a comparison of tree ids.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/

      - name: Decide whether this workflow runs
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          run=1
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "release" ]; then
            if ! git fetch --no-tags --filter=blob:none origin test:refs/remotes/origin/test; then
              echo "could not fetch origin/test; running"
            elif git diff --quiet origin/test HEAD; then
              run=0
            fi
          fi
          echo "run=$([ "$run" = 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "stage decision: run=$run (event=$EVENT_NAME ref=$REF_NAME)"

  reach:
    name: tutorial reach ${{ matrix.shard.name }} (real browser)
    runs-on: ubuntu-latest
    # Checkout and art preparation count against this budget too. Keep the
    # complete browser shards while matching the exhaustive CI job budget.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: small
            only: smallest,1024x640,1200x730 # `smallest` = 800 x balance.ui.uiScale.gateBelowH
          - name: mid
            only: 1280x800,1366x768,1440x900
          - name: large + first run
            only: 1920x1080,2560x1440,resize,first-run
    needs: stage
    if: needs.stage.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false # serves the checked-out source tree; reads no LFS object

      - uses: ./.github/actions/setup-node
      # The art packs, before anything builds, serves or tests this checkout (step 12).
      - uses: ./.github/actions/fetch-art
        with:
          packs: ${{ env.ART_PACKS }}

      - uses: ./.github/actions/which-browser

      - name: The tutorial's exits are reachable, and seenTutorial survives a reload
        run: node tools/verdict.mjs -- node tools/tutorial-reach.mjs --only "${{ matrix.shard.only }}"
