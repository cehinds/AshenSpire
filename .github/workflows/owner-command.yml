# .github/workflows/owner-command.yml — the AgentOps owner-command live executor.
#
# Turns an "Owner decision" issue into a validated, append-only state change:
# parse the issue form -> validate against the enumerated allowlist, the actor's
# authority, and the compare-and-swap hash -> append one decision event and
# re-seal only the target capsule -> commit to `dev` and report back on the issue.
#
# SECURITY MODEL
# - Opened only: edits never re-run a command. The owner closes and refiles a
#   mistyped decision, producing a new immutable issue event.
# - Owner association + form shape: the job requires OWNER association, the
#   owner-command label, the decision title prefix, and the exact versioned
#   issue-form body. The form marker prevents accidental hand-labelling; it is
#   structural, not cryptographic. Separate agent identity remains the root fix
#   when agents and the human owner share one GitHub account.
# - The actor role is resolved HERE, from the authenticated GitHub identity —
#   never read from the issue body. Nothing an author types can escalate a role.
# - Enumerated only: opsctl rejects any action outside owner-command.json, any
#   unknown field, and any actor not authorized for that action. There is no
#   shell or free-form command field anywhere in the path.
# - Compare-and-swap: a command carrying a stale expected_current_hash is
#   refused rather than applied to state the owner did not see, and the check is
#   repeated immediately before the write so a concurrent change cannot be lost.
# - Least privilege: the token is read-only at the top level; only this job gets
#   `contents: write` (to commit the decision) and `issues: write` (to reply).
# - Writes reach `dev` only. Publication is a separate protected transition:
#   Pages serves `main`, so no decision here can publish anything by itself.

name: owner-command

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: owner-command
  cancel-in-progress: false

jobs:
  execute:
    # Owner-associated "Owner decision" issues only. The body is validated by a
    # separate step before opsctl sees it; the title check is an early reject.
    if: >-
      github.event.issue.author_association == 'OWNER' &&
      contains(github.event.issue.labels.*.name, 'owner-command') &&
      startsWith(github.event.issue.title, '[decision] ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Never trust the control plane we are about to mutate: it must be valid
      # before a decision is applied to it.
      - name: Verify the control plane before deciding
        run: node .agentops/tools/opsctl.mjs verify

      # The body reaches the tool through a file and an env var, never through
      # shell interpolation of untrusted text.
      - name: Capture the issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$ISSUE_BODY" > /tmp/issue-body.md

      - name: Verify owner-decision form shape
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: >-
          node .github/workflows/validate-owner-command-issue.mjs
          --body-file /tmp/issue-body.md

      - name: Validate the command (dry-run first)
        id: dryrun
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set +e
          node .agentops/tools/opsctl.mjs command --dry-run \
            --issue-file /tmp/issue-body.md --actor owner > /tmp/dryrun.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/dryrun.txt

      - name: Report a rejected command
        if: steps.dryrun.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          {
            echo "### Command rejected — nothing was written"
            echo
            echo "The control plane is unchanged. Details:"
            echo
            echo '```'
            cat /tmp/dryrun.txt
            echo '```'
            echo
            echo "A stale \`expected_current_hash\` is the most common cause: copy the"
            echo "current one from the [Owner HUD](https://cehinds.github.io/AshenSpire/hud/)"
            echo "and file a new decision."
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > /tmp/comment.md
          gh issue comment "$ISSUE" --body-file /tmp/comment.md

      - name: Fail the run on a rejected command
        if: steps.dryrun.outputs.code != '0'
        run: exit 1

      - name: Apply the command
        run: |
          node .agentops/tools/opsctl.mjs command --apply \
            --issue-file /tmp/issue-body.md --actor owner | tee /tmp/apply.txt
          node .agentops/tools/opsctl.mjs render
          node .agentops/tools/opsctl.mjs verify

      # The published /hud/ copy is drift-checked against the generated HUD, so
      # it must be refreshed in the same commit.
      - name: Refresh the published HUD copy
        run: cp .agentops/generated/hud/index.html hud/index.html

      - name: Prove the applied state is still sound
        run: |
          node .agentops/tools/opsctl.mjs --selftest
          node .agentops/tools/opsctl.test.mjs
          node .agentops/tools/opsctl.mjs drill

      - name: Commit the decision
        id: commit
        env:
          ISSUE: ${{ github.event.issue.number }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agentops hud review-approval-hub
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "AgentOps owner decision from #${ISSUE}

          Applied through the owner-command path: validated against the
          enumerated allowlist and the compare-and-swap hash, then appended as an
          append-only decision event with the affected capsule re-sealed."
          git push origin HEAD:dev
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report the applied decision
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          SHA: ${{ steps.commit.outputs.sha }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          {
            echo "### Decision applied"
            echo
            echo '```'
            cat /tmp/apply.txt
            echo '```'
            if [ "$CHANGED" = "true" ]; then
              echo
              echo "Committed to \`dev\` as \`${SHA}\`. Verify, selftest, suite and the"
              echo "reconstruction drill all passed on the applied state."
              echo
              echo "The published site serves \`main\`, so this decision reaches it only"
              echo "through an owner-authorized \`dev\` → \`main\` promotion."
            else
              echo
              echo "The decision was valid but produced no file change, so nothing was committed."
            fi
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > /tmp/comment.md
          gh issue comment "$ISSUE" --body-file /tmp/comment.md
