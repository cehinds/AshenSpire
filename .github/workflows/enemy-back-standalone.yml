name: Standalone enemy rear contract
on:
  push:
    branches: ['worker/EnemyBackSprites/standalone-module']
  pull_request:
    paths: ['pose-studio/enemy-back-proposals/**', '.github/workflows/enemy-back-standalone.yml']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            pose-studio/enemy-back-proposals
            art/enemy-back-proposals
            art/enemy-back-motion
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test pose-studio/enemy-back-proposals/standalone/index.test.mjs
      - name: Validate standalone JSON schema
        run: |
          npm install --prefix /tmp/rear-schema ajv@8
          node --input-type=module <<'JS'
          import Ajv from '/tmp/rear-schema/node_modules/ajv/dist/2020.js';
          import { readFileSync } from 'node:fs';
          const root = 'pose-studio/enemy-back-proposals/standalone/';
          const validate = new Ajv({strict: false}).compile(JSON.parse(readFileSync(root+'catalog.schema.json')));
          const catalog = JSON.parse(readFileSync(root+'catalog.json'));
          if (!validate(catalog)) throw new Error(JSON.stringify(validate.errors));
          const invalid = structuredClone(catalog);
          for (const asset of ['art/enemy-back-motion/../evil.png', 'art/enemy-back-motion/actor/../evil.png']) {
            invalid.actors[0].proposals[0].stances.neutral.frames[0].asset = asset;
            if (validate(invalid)) throw new Error('Schema accepted parent path traversal: '+asset);
          }
          JS
