# pages-builds — publish EVERY branch's builds to GitHub Pages, each at its own address.
#
#   /                      the build index across dev, test, release and main
#   /<branch>/             that branch's builds, newest first
#   /<branch>/<ordinal>/   that exact build, playable (byte-identical to the commit's AshenSpire.html)
#   /<branch>/latest/      alias for the branch's newest build
#
# THE WEB EDITION AND THE STORE (docs/EXTERNAL-ASSETS-PLAN.md §4, step 6b). A build
# whose source writes a pack-shaped web edition (build/web, or build/ itself
# from step 8e) is served as that
# edition: its 9.5 MB HTML at /<branch>/<ordinal>/ with an asset-base.json, its
# indexes and objects in ONE store shared by every build (/packs/, /objects/),
# and its light single file kept whole at /<branch>/<ordinal>/download/, which
# the Download links name. /sw.js is the service worker (tools/pages-sw.mjs; its
# kill-switch is the committed SW_KILL there). Older builds keep their shape.
#
# BUILDS THAT ARE NO LONGER COMMITTED ARE REBUILT HERE. Since #1332 (2026-09-26)
# dev commits no built HTML (test, release and main follow on promotion), so git
# names each build (buildordinal.json) but no longer holds it. The assemble step
# passes --build-missing: tools/pages-site.mjs rebuilds each such build from its
# own commit's source (light art on dev, --full-art on test/release/main — the
# tiers dev-preview.yml builds), refuses one whose rebuild moves the committed
# box, and serves the rest at /<branch>/<ordinal>/ and /<branch>/latest/.
# Builds that are still committed are read from git as before, fetching only
# their own LFS objects; one whose object is gone (the coming purge,
# docs/ART-REPO-PLAN.md step 7) is skipped and named, not fatal.
#
# Everything the site served before (/AshenSpire.html, /docs/…) is still served:
# the whole `main` tree is the base of the artifact and the only replaced file is
# the root index.html (main's own is kept at /index-game.html).
#
# PUBLICATION IS SPLIT BY BRANCH. A push to dev or release ASSEMBLES, proves and then
# PUBLISHES the site (dev: owner's ruling 2026-09-05; release: owner's ruling
# 2026-10-11, which reverses the 2026-09-05 refusal for release only). A push to test
# assembles and proves it and stops. A push to main assembles and proves it and stops:
# main is published only by the owner's own dispatch whose `publish` input spells
# PUBLISH (github.actor AND github.triggering_actor are both checked against
# github.repository_owner, so neither a write collaborator's dispatch nor their re-run
# of the owner's dispatch deploys). The automatic paths are `dev` and `release`.
#
# A RELEASE PUBLISHES WITH THE HIGH-RES ART. tools/pages-site.mjs names release (and
# main) in FULL_ART_BRANCHES and fullArtFor() returns true for it, so every release
# build the site rebuilds from source is built with --full-art (the high tier); the
# committed builds of older commits are full editions by construction. dev-preview.yml
# gives release `--full-art` for the same reason (its ART_TIER expression).
#
# THE ENVIRONMENT RULE (ONE-TIME OWNER ACTION, BEFORE A RELEASE PUSH CAN DEPLOY). The
# `github-pages` environment carries a deployment-branch rule, and until it also
# admits `release` GitHub refuses a release deploy at the gate, in about two seconds
# with no steps and no log:
#
#   Branch "release" is not allowed to deploy to github-pages due to environment
#   protection rules.
#
# Settings → Environments → github-pages → Deployment branches: add `release`. A
# workflow cannot read that rule, so this guard and PUBLISH_REQUESTED below have to
# agree with it by hand; they list `release` only because the owner has said so. Until
# the rule admits it, a release push assembles green and its deploy job is refused.
#
# `test` STILL CANNOT PUBLISH. Its branch is not admitted by the environment, and a
# guard that listed it would walk every test run into the gate and turn finished
# work red (measured 2026-09-07 on release `fb299d90`, run 209: assemble green in
# 97s, deploy refused at the gate). To give test the same publish path, the owner adds
# `test` to the environment's deployment branches FIRST, then the guard and
# PUBLISH_REQUESTED below. The owner's dispatch still publishes any branch the
# environment admits, main included.
#
# NOTHING IS LOST BY NOT TRYING. The site is reassembled from git history on every
# run and `tools/pages-site.mjs` walks dev, test, release and main whatever branch
# the run is on, so a dev or release publication already carries every other
# section at its newest commit. What a branch that cannot deploy loses is only the
# ability to TRIGGER a publication — not its place in the published site.
#
# FEATURE-BRANCH BUILDS. Every open pull request into dev whose head is a branch of
# this repository (feature/*, fix/*, chore/*) has its newest playable build at
# branches/<branch>/latest/ (README, Play and download). The assemble job lists the
# open PRs with GITHUB_TOKEN, fetches each one's newest successful dev-preview build
# for its head commit and hands them to tools/pages-site.mjs, which publishes them
# and lists them on the index. A build therefore lives exactly as long as its PR is
# open: a merge arrives as a push to dev, a close as the pull_request_target event
# below, and each publishes a site without it. The deploy job is unchanged. The
# sticky "Playable build" comment is posted by its own job after a successful deploy.
#
# A FAILED OR CANCELLED PREVIEW MUST NOT LEAVE A STALE BUILD LIVE. A completed
# dev-preview run on a feature/, fix/ or chore/ branch wakes assemble and deploy
# whatever its conclusion. The assemble step lists only a preview whose run for the
# PR's CURRENT head sha concluded success (the `select(.head_sha == $sha and
# .conclusion == "success")` filter), so a head whose preview failed has no
# qualifying run and its branch is left out of the site: the stale
# branches/<branch>/latest/ is removed, not kept. Dev, test, release and main keep
# their own publishing conditions; alternative/ previews still publish on success only.
#
# WHY pull_request_target AND NOT pull_request. A closed pull_request run's ref is
# refs/pull/N/merge, which the github-pages environment's branch rule refuses (the
# same gate as test above). pull_request_target runs with the base ref
# refs/heads/dev, which the rule admits. Nothing from the PR is checked out or run:
# the checkout is dev, and the workflow holds read permissions only.
#
# The assemble job still holds no Pages WRITE or OIDC credential (contents: read and
# pages: read only — configure-pages needs to read the site's configuration); the
# write and the token live on the `deploy` job alone, on the `github-pages`
# environment, which can additionally carry required reviewers. What changed is which
# events may REACH that job, not which job holds the credential.
#
# The cost is named rather than discovered: publishing on a push to `dev` or `release`
# is a standing delegation to every future push on either. It was accepted because the
# alternative was measured — the site sat three days and 52 green assemble runs
# behind the game while every one skipped the deploy job.
# ONE-TIME OWNER ACTION before the first deploy: Settings → Pages → Build and
# deployment → Source: "GitHub Actions"; until then the deploy step fails with GitHub's
# own message and the legacy `main:/` source keeps serving.
#
# COST: one assemble run per push to any of the four branches. A run that has
# STARTED is never cancelled — see the concurrency block for why a guess about
# who publishes cost a publication — so a burst of pushes serialises rather than
# killing whatever is mid-flight. A newer arrival does still supersede an older
# QUEUED run, which costs nothing: the site is rebuilt from git history each
# time (deterministic; nothing accumulates), so the newest assembly already
# carries every build a superseded one would have published.
name: pages-builds

on:
  push:
    branches: [dev, test, release, main]
  workflow_run:
    # Successful alternative previews republish through the default dev ref,
    # which is already admitted by the github-pages environment.
    workflows: [dev preview]
    branches: ['alternative/**/dev', 'alternative/**/test', 'feature/**', 'fix/**', 'chore/**']
    types: [completed]
  # A closed PR (merged or not) republishes the site without its branch build. A
  # merge also pushes to dev, which republishes too; the close is what removes a
  # build whose PR was closed unmerged.
  pull_request_target:
    types: [closed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      keep:
        description: newest builds to publish per branch
        default: '10'
      publish:
        description: "type PUBLISH to deploy the assembled site to Pages (owner-exclusive: only the repository owner's dispatch deploys; a push never does)"
        default: ''

concurrency:
  group: pages-builds
  # NO RUN CANCELS ANOTHER, BECAUSE "WILL THIS RUN PUBLISH?" CANNOT BE ANSWERED HERE.
  #
  # One group keeps publications serialised, which is right — two deploys to the
  # same Pages environment must not race. Cancellation is the part that kept
  # losing them.
  #
  # The first version cancelled every run, so a push to main — which assembles
  # and stops by design — killed in-flight dev/test/release runs, including ones
  # already inside `actions/deploy-pages`. The fix for that made the flag ask the
  # same question as the deploy guard: will THIS run publish? A publishing run
  # could still cancel its predecessor, on the reasoning that the newer
  # publication supersedes the older one anyway.
  #
  # That reasoning holds only if the canceller really does publish, and the
  # expression could only GUESS: it read "a push to dev, test or release
  # publishes" off the deploy guard. Measured on 2026-09-07, that premise was
  # false for two of the three. Deployments from `test` and `release` are
  # refused by the `github-pages` environment's branch rule, so their runs die
  # at the environment gate in one second with no steps and no log — 8 of 8,
  # against 9 of 9 successes from `dev`. They were nonetheless counted as
  # publishers and allowed to cancel, and they did: run 213 (test, which cannot
  # publish) cancelled run 212 (dev `c71fdecb`, which would have published
  # 0.5.5.125), leaving the site at 0.5.5.119 — six builds behind. Exactly the
  # rule at the top of this comment, broken by a guess about who publishes.
  #
  # A workflow cannot read the environment's branch rule, so it cannot answer
  # that question correctly — and a guess costs a silent lost publication, which
  # is the one failure this group exists to prevent. So nothing cancels.
  #
  # WHAT `false` ACTUALLY BUYS, measured on the first burst after it landed
  # (23:21–23:23 UTC, 2026-09-07): a run that has STARTED is never killed. Run
  # 215 was mid-flight while three later arrivals came in — 216 (#783's merge),
  # 217 (a publish dispatch) and 218 (#788's merge) — and it kept running.
  # Under the old flag any one of them would have ended it, possibly inside
  # `actions/deploy-pages`.
  #
  # WHAT IT DOES NOT BUY, and the earlier wording here claimed otherwise: it is
  # NOT "every run publishes in turn". A concurrency group holds ONE queued run,
  # so a newer arrival still supersedes an older PENDING one — 216 and 217 were
  # both cancelled while queued, and only 218 waited for 215. That costs nothing
  # here, because the site is reassembled from git history on every run: the
  # newest assembly already carries every build the superseded ones would have
  # published. The guarantee is "the newest publication always lands and no
  # in-flight one is lost", not "each one lands".
  #
  # The cost is named rather than discovered: a burst of pushes serialises
  # instead of collapsing, so the last one waits out the one ahead of it.
  # Wall-clock, not correctness.
  cancel-in-progress: false

# The workflow as a whole holds nothing but read: the Pages and OIDC grants are the
# deploy job's alone (below), never the push-triggered assemble job's.
permissions:
  contents: read

jobs:
  assemble:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || (startsWith(github.event.workflow_run.head_branch, 'feature/') || startsWith(github.event.workflow_run.head_branch, 'fix/') || startsWith(github.event.workflow_run.head_branch, 'chore/'))
    runs-on: ubuntu-latest
    # Bounded: about 20 light rebuilds (~20 s each) plus hydrating the committed
    # builds. A run that needs more than this is broken, not slow.
    timeout-minutes: 45
    # pages: read is what actions/configure-pages needs to read the site's
    # configuration; it deploys nothing. The write and the OIDC token stay on
    # the deploy job alone.
    # actions: read downloads each open PR's dev-preview build; pull-requests: read
    # lists the open PRs. Neither grants a write, and the deploy job keeps its own.
    permissions:
      contents: read
      pages: read
      actions: read
      pull-requests: read
    outputs:
      # Compact JSON array of {pr, dir} for every PR whose preview is in the site this run.
      comment_targets: ${{ steps.previews.outputs.comment_targets }}
    steps:
      - uses: actions/checkout@v5
        with:
          # NO LFS CHECKOUT. Nothing here reads the working tree's LFS files: the
          # generator hydrates only the committed builds it lists
          # (tools/git-artifact.mjs smudges one object on demand), and it rebuilds
          # the uncommitted ones from source. Checking out with LFS pulled every
          # LFS file at the pushed head, and it is a precondition of the LFS purge
          # (docs/ART-REPO-PLAN.md step 7) that this job stop doing so.
          lfs: false
          # Completed alternative previews republish from trusted dev workflow code.
          ref: ${{ (github.event_name == 'workflow_run' || github.event_name == 'pull_request_target') && 'dev' || github.ref }}
          fetch-depth: 0
      # ONE MISSING BRANCH USED TO TAKE DOWN EVERY RUN. `git fetch origin dev
      # test release main` is atomic: `fatal: couldn't find remote ref test`
      # aborts the whole command with exit 128, so when `test` was deleted on
      # 2026-09-04 (GitHub auto-deletes a merged PR's head branch, and the
      # test → release promotion uses `test` AS the head) this job went red on
      # dev, on release and on main — none of which had lost anything.
      #
      # Fetched one at a time, a branch that is gone costs its own line and
      # nothing else. It is NOT swallowed: the missing ones are named here and
      # named again in the assembled summary, because a publish that quietly
      # drops a branch is the failure this whole job exists to prevent.
      - name: Fetch the published branches so their history is readable
        run: |
          set -uo pipefail
          git fetch --prune origin '+refs/heads/alternative/*:refs/remotes/origin/alternative/*' || exit 1
          missing=""
          for b in dev test release main; do
            if git fetch --no-tags origin "$b" 2>/dev/null; then
              echo "  fetched $b"
            else
              echo "  MISSING $b — no such branch on origin"
              missing="$missing $b"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::warning title=A published branch is missing::not on origin:$missing — the site will be assembled without it"
          fi
      - uses: ./.github/actions/setup-node
      # The checkout above takes no LFS, so the committed builds the generator
      # lists are hydrated one object at a time with `git lfs smudge`. Without
      # git-lfs that fails, and the generator throws rather than calling the
      # builds purged — so say it here, first, by name.
      - name: git-lfs is available to hydrate committed builds on demand
        run: git lfs version
      # NO RELEASE-SERIES GATE HERE, and its absence is the point. This workflow
      # runs on pushes to dev, test, release AND main, and it assembles a site
      # out of all four branches' histories — series deliberately mixed, which
      # is why `tools/release-series.mjs` opens by saying archived downloads
      # keep their original versions. Asserting one series in this job asserts
      # it against every branch the job runs on: measured 2026-09-08, test,
      # release and main all read `Expected release 0.6.x, received 0.5.5` and
      # exit 1, which would have taken the ASSEMBLE step down on three of the
      # four — the step that produces the artifact a publication needs. The
      # gate belongs where current builds are made: dev-preview runs it on
      # every push to dev and every PR into dev, and ci.yml on dispatch.
      # ONCE main STOPS COMMITTING ITS BUILD (the LFS budget ran out; dev stopped
      # on 2026-09-26 and main follows on promotion), the stable Play links at the
      # site root have no file in main's tree. Build main from source here and hand
      # it to the generator; while main still tracks its build this does nothing.
      #
      # FROM STEP 11 (docs/EXTERNAL-ASSETS-PLAN.md) main's tree pins its art
      # release in a schema-2 art-release.json. When it does, main's own
      # tools/fetch-art.mjs fetches all three packs (main is the full-art build)
      # into that worktree's ignored .art-cache/ and proves they match main's
      # trees; an older main, whose pin has no packs (or no pin), builds as
      # before. UNDER SCHEMA 2 A FETCH FAILURE BLOCKS PUBLISHING: the step is
      # `set -e`, so a release main cannot fetch stops the stable build. The art
      # repository is public, so the fetch needs no token; one is passed only on
      # a protected branch, and only raises the rate limit (see the env comment
      # below: that rule is defence in depth, not a boundary). A failure names
      # its cause.
      - name: Build main from source when main no longer commits its build
        env:
          # THE TOKEN RULE IS DEFENCE IN DEPTH, NOT A SECURITY BOUNDARY. The art
          # repository is public, so ART_REPO_TOKEN only raises the API rate limit.
          # Only a push or dispatch of a protected branch (dev, test, release, main)
          # passes it, so a branch that edits tools/fetch-art.mjs alone cannot read
          # it; but anyone who can push a branch can edit this workflow to read any
          # secret. The real fix is the owner's: delete the ART_REPO_TOKEN secret, or
          # move it into a GitHub Environment limited to dev, test, release and main
          # (docs/EXTERNAL-ASSETS-PLAN.md, step 11).
          ART_REPO_TOKEN: ${{ contains(fromJSON('["refs/heads/dev","refs/heads/test","refs/heads/release","refs/heads/main"]'), github.ref) && secrets.ART_REPO_TOKEN || '' }}
        run: |
          set -euo pipefail
          if git cat-file -e origin/main:AshenSpire.html 2>/dev/null; then
            echo "main still tracks AshenSpire.html — the generator hydrates it from git"
            exit 0
          fi
          git worktree add --detach "$RUNNER_TEMP/main" origin/main
          # The probe prints `fetch` (schema 2), `legacy` (no pin, or schema 1),
          # or fails: a pin that does not parse, or names a schema this workflow
          # does not know, stops publishing instead of passing as legacy.
          PIN_MODE=$(cd "$RUNNER_TEMP/main" && node -e "
            const fs = require('fs');
            if (!fs.existsSync('art-release.json')) { console.log('legacy'); process.exit(0); }
            let pin;
            try { pin = JSON.parse(fs.readFileSync('art-release.json', 'utf8')); }
            catch (e) { console.error('art-release.json does not parse: ' + e.message); process.exit(2); }
            const schema = pin && pin.schema;
            if (schema === 2) console.log('fetch');
            else if (schema === undefined || schema === 1) console.log('legacy');
            else { console.error('art-release.json names schema ' + JSON.stringify(schema) + ', which this workflow does not know'); process.exit(2); }
          ")
          if [ "$PIN_MODE" = "fetch" ]; then
            # --agree (step 11) proves the cache equals main's trees; a main from
            # after step 13 has no trees, and its fetch-art retired --agree.
            (cd "$RUNNER_TEMP/main" && node tools/fetch-art.mjs --pack all && if [ -d assets-mobile ]; then node tools/fetch-art.mjs --agree --pack all; fi)
          else
            echo "main's art-release.json predates the packs (schema 2) — it builds from its trees, with nothing to fetch"
          fi
          (cd "$RUNNER_TEMP/main" && node tools/launch.mjs --build-only --full-art)
          # The same gate every other build workflow applies: a rebuild that had
          # to rewrite main's committed box is a build main's receipts do not
          # name, and it must not become the stable Play link.
          git -C "$RUNNER_TEMP/main" status --porcelain
          test -z "$(git -C "$RUNNER_TEMP/main" status --porcelain)"
          (cd "$RUNNER_TEMP/main" && node tools/buildversion.mjs --check)
          mkdir -p "$RUNNER_TEMP/main-build"
          # The root alias: the full single file before step 8e, the light single
          # file from it. The mobile file exists only before step 8e retired it;
          # from then on the generator writes /AshenSpire-mobile.html as a redirect.
          cp "$RUNNER_TEMP/main/AshenSpire.html" "$RUNNER_TEMP/main-build/"
          if [ -f "$RUNNER_TEMP/main/AshenSpire-mobile.html" ]; then
            cp "$RUNNER_TEMP/main/AshenSpire-mobile.html" "$RUNNER_TEMP/main-build/"
          fi
          # THE WEB EDITION, where main's source builds one (docs/EXTERNAL-ASSETS-PLAN.md
          # step 6b): the generator serves it at the stable Play links, with its packs
          # and objects in the site's one store, instead of the full single file.
          # Its home was build/web/ (steps 3a–7) and is build/ itself from step 8e.
          if [ -f "$RUNNER_TEMP/main/build/web/AshenSpire.html" ]; then
            cp -r "$RUNNER_TEMP/main/build/web" "$RUNNER_TEMP/main-build/web"
          elif [ -d "$RUNNER_TEMP/main/build/packs" ]; then
            mkdir -p "$RUNNER_TEMP/main-build/web"
            cp -r "$RUNNER_TEMP/main/build/AshenSpire.html" "$RUNNER_TEMP/main/build/asset-base.json" \
              "$RUNNER_TEMP/main/build/packs" "$RUNNER_TEMP/main/build/objects" "$RUNNER_TEMP/main-build/web/"
          fi
          # THE STANDALONE'S PAYLOAD (docs/EXTERNAL-ASSETS-PLAN.md step 12): the
          # launcher copies map-detail/ and music/ beside the single file from the
          # fetched common pack. Handed in with the build, so the stable aliases
          # keep their tiles and score once main's tree no longer carries them
          # (step 13); pages-site uses these only when main's tree lacks the folder.
          for d in map-detail music; do
            if [ -d "$RUNNER_TEMP/main/dist/$d" ]; then cp -r "$RUNNER_TEMP/main/dist/$d" "$RUNNER_TEMP/main-build/$d"; fi
          done
          echo "MAIN_BUILD_ARGS=--main-build $RUNNER_TEMP/main-build" >> "$GITHUB_ENV"
      # FEATURE-BRANCH BUILDS, FETCHED BEFORE THE ASSEMBLE. The list of open PRs is read
      # now and the build for each PR's head commit is taken from its dev-preview run.
      # dev-preview names its artifact from the BASE ref (dev), so a PR's artifact is
      # dev-standalone-<merge commit>: it is found by run id and name prefix, not by the
      # branch. A PR with no successful build for its current head is left out (its
      # last build is not kept past a new push). Any listing or download failure stops
      # the publish: a site built without a branch that should be in it would drop it.
      - name: Fetch each open pull request's playable build (branches/<branch>/latest/)
        id: previews
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/branch-previews"
          entries="$RUNNER_TEMP/branch-preview-entries.jsonl"
          rm -rf "$out"; mkdir -p "$out"; : > "$entries"
          prs=$(gh api --paginate "repos/$REPO/pulls?state=open&base=dev&per_page=100" \
            | jq -r --arg repo "$REPO" '.[] | select(.head.repo.full_name == $repo) | select(.head.ref | test("^(feature|fix|chore)/")) | [.number, .head.ref, .head.sha] | @tsv')
          # THE BRANCH NAME IS THE SITE PATH, unchanged. A name that cannot be one is
          # refused by the same check the generator runs (--branch-dir), named with its
          # PR, and skipped before any download. Nothing is sanitised, so nothing collides.
          while IFS=$'\t' read -r pr ref sha; do
            [ -n "$pr" ] || continue
            if ! safe=$(node tools/pages-site.mjs --branch-dir "$ref"); then
              echo "::warning title=Branch not published::PR #$pr ($ref) is skipped: its branch name cannot be a site path (A-Z a-z 0-9 . _ / - only; no empty, \".\" or \"..\" segment)."
              continue
            fi
            run=$(gh api -X GET "repos/$REPO/actions/workflows/dev-preview.yml/runs" -f event=pull_request -f branch="$ref" -f per_page=30 \
              | jq -r --arg sha "$sha" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")][0].id // empty')
            if [ -z "$run" ]; then
              echo "::notice title=No build yet::PR #$pr ($ref) has no successful dev preview for $sha yet"
              continue
            fi
            name=$(gh api "repos/$REPO/actions/runs/$run/artifacts" \
              --jq '[.artifacts[] | select(.expired | not) | select(.name | startswith("dev-standalone-"))][0].name // empty')
            if [ -z "$name" ]; then
              echo "::error title=Preview artifact missing::PR #$pr: run $run has no dev-standalone artifact"; exit 1
            fi
            gh run download "$run" --repo "$REPO" --name "$name" --dir "$out/$safe"
            jq -cn --arg b "$ref" --arg d "$safe" --argjson pr "$pr" --arg sha "$sha" '{branch: $b, dir: $d, pr: $pr, sha: $sha}' >> "$entries"
            echo "  fetched PR #$pr $ref at $sha"
          done <<< "$prs"
          jq -s '{previews: .}' "$entries" > "$out/previews.json"
          # A run that coalesces several pushes publishes several previews, so the sticky
          # comment goes to every PR whose preview is in the site from this run, not only
          # the PR that triggered it. Compact JSON on one line, so it is safe as an output.
          targets=$(jq -sc '[.[] | {pr: (.pr | tostring), dir: .dir}]' "$entries")
          echo "comment_targets=$targets" >> "$GITHUB_OUTPUT"
          {
            echo "### Feature-branch builds"
            echo
            echo "$(jq -s 'length' "$entries") open pull request(s) into \`dev\` carry a playable build at \`branches/<branch>/latest/\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Assemble the site from git history — committed builds proven byte-identical, uncommitted ones rebuilt from their commit
        # `keep` from a dispatch is clamped here (1..25) and again in the
        # generator: each listed uncommitted build is a rebuild.
        env:
          KEEP_INPUT: ${{ inputs.keep || '10' }}
        run: |
          keep=$(printf '%s' "$KEEP_INPUT" | tr -cd '0-9' | cut -c1-3); keep=${keep:-10}
          if [ "$keep" -lt 1 ]; then keep=1; fi
          if [ "$keep" -gt 25 ]; then keep=25; fi
          node tools/verdict.mjs -- node tools/pages-site.mjs --out _site --keep "$keep" --build-missing "$RUNNER_TEMP/pages-rebuilds" --branch-previews "$RUNNER_TEMP/branch-previews" ${MAIN_BUILD_ARGS:-}
      - name: The generator's own drift plant is still caught
        run: node tools/verdict.mjs -- node tools/pages-site.mjs --selftest ${MAIN_BUILD_ARGS:-}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # SAY WHAT THIS RUN DID, BECAUSE NOBODY WAS BEING TOLD.
      #
      # #553: after #543 correctly took the deploy credential off the push path,
      # nothing republished — and nothing SAID nothing had republished, so /dev
      # /test /release served stale builds for hours with every run green.
      #
      # A first attempt fixed that by publishing automatically behind a repository
      # variable. That was rejected: publishing the site is an owner action, taken
      # deliberately each time, and a standing switch is a delegation to every
      # future push. So this step reports; it does not publish, and nothing here
      # should ever grow the ability to.
      - name: Report what this run did with the site
        env:
          GH_TOKEN: ${{ github.token }}
          # The owner's dispatch is the only run whose `deploy` job will follow, so
          # it is the only run that must NOT be summarised as unpublished — that
          # summary would still be sitting there, contradicting it, after the
          # publication succeeded.
          # MUST MIRROR THE deploy JOB'S `if`. This flag is the only thing that
          # decides whether the summary says "published" or "not published", so a
          # flag narrower than the guard prints "not published" on a run that
          # publishes — the exact silence (#553) this step was added to end.
          # `dev` and `release` on the push path (release by the owner's ruling,
          # 2026-10-11). A run that cannot publish must not claim it will: until the
          # github-pages environment admits `release`, its deploy is refused at the
          # gate — see the header.
          PUBLISH_REQUESTED: ${{ (github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'release')) || (github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion == 'success' || (startsWith(github.event.workflow_run.head_branch, 'feature/') || startsWith(github.event.workflow_run.head_branch, 'fix/') || startsWith(github.event.workflow_run.head_branch, 'chore/')))) || (github.event_name == 'pull_request_target') || (github.event_name == 'workflow_dispatch' && inputs.publish == 'PUBLISH') }}
        run: |
          set -u
          {
            if [ "$PUBLISH_REQUESTED" = "true" ]; then
              echo "### Assembled — publication requested"
              echo
              echo "Nothing is published until the \`deploy\` job succeeds; that job reports the result."
            else
              echo "### Assembled — not published"
            fi
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`$GITHUB_REF_NAME\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Best effort — and BOTH ways it can fail are reported rather than
          # swallowed. The first cut matched `"created_at":"` with no space, which
          # the real response does not have, so the request would succeed and the
          # line would print EMPTY: a blank where a staleness warning belongs looks
          # exactly like a current site, which is this bug's own failure mode
          # reintroduced one level down. jq parses it; a missing field still says
          # UNKNOWN.
          if last=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/builds/latest"); then
            # WHICH TIMESTAMP, AND WHY IT IS NOT created_at. GitHub defines
            # created_at as when the build was CREATED — queued — and updated_at
            # as when it reached its final status. A build that sat queued or ran
            # for minutes therefore published LATER than its created_at says, so
            # dating the site by it backdates the publication and understates
            # staleness by exactly the interval an incident makes longest. The
            # completion time is the one that answers "how old is what I am
            # looking at".
            finished=$(printf '%s' "$last" | jq -r '.updated_at // empty')
            # THE STATUS DECIDES, NOT THE TIMESTAMP. builds/latest returns the
            # newest ATTEMPT whatever became of it, so a build that errored, was
            # cancelled, or is still running comes back carrying timestamps.
            # Printing one as "Last publication" would date the site to a
            # publication that never happened — the same misleading state this
            # summary exists to prevent. Only `built` is a publication.
            state=$(printf '%s' "$last" | jq -r '.status // empty')
            if [ "$state" = "built" ] && [ -n "$finished" ]; then
              echo "Last publication: **$finished** (build completed)" >> "$GITHUB_STEP_SUMMARY"
            elif [ -n "$state" ]; then
              echo "Last publication: **UNKNOWN** — the newest Pages build reports status \`$state\`, not \`built\`, so it did not publish. Treat the site as behind." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Last publication: **the response carried no \`status\`**, so whether the site is current is UNKNOWN — treat it as behind." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Last publication: **could not be read** (needs \`pages: read\`), so whether the site is current is UNKNOWN — treat it as behind." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$PUBLISH_REQUESTED" != "true" ]; then
            {
              echo
              echo "This branch does not publish on a push — only \`dev\` and \`release\` do. To publish this"
              echo "assembly, the repository owner dispatches this workflow with"
              echo "\`publish\` = \`PUBLISH\`; a collaborator's dispatch does not, and no standing"
              echo "setting may stand in for that decision."
              echo
              echo "Nothing is stale because of this. The site is reassembled from git history"
              echo "every run, across dev, test, release and main, so this commit is already in"
              echo "the next publication from \`dev\` or \`release\` whether or not this run publishes."
              if [ "$GITHUB_REF_NAME" = "test" ]; then
                echo
                echo "\`test\` additionally **cannot** deploy: the \`github-pages\`"
                echo "environment's deployment-branch rule admits \`dev\`, \`release\` (once the owner adds it) and \`main\` only, so a"
                echo "dispatch from here would be refused at the environment gate. See the"
                echo "header of \`.github/workflows/pages-builds.yml\` for what to change first."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: assemble
    # TWO WAYS TO PUBLISH, AND ONLY `dev` AND `release` HAVE THE FIRST.
    #
    # Owner's ruling, 2026-09-05: the development branches republish on their own;
    # main needs the owner's say-so. Owner's ruling, 2026-10-11: a push to `release`
    # publishes on its own too, once the github-pages environment admits `release`
    # (the one-time action in the header). This reverses the earlier refusal to
    # automate publication at all — that refusal was paid for on 2026-09-02..05,
    # when the site sat three days and 52 green assemble runs behind the game
    # while every one of them skipped this job. Automatic publication on `dev` is
    # the deliberate cost of that.
    #
    # 1. A PUSH to dev or release publishes. This IS a standing delegation to every
    #    future push on those branches: whoever can push them can reach this job's
    #    Pages credential. That is accepted for the development branch and, by the
    #    owner's 2026-10-11 ruling, for release (which only the owner pushes), and
    #    refused for main.
    #
    #    `test` and `release` were on this line until 2026-09-07 and could never
    #    honour it: the github-pages environment's deployment-branch rule admitted
    #    `dev` and `main` only, so their runs died AT THIS JOB'S ENVIRONMENT GATE
    #    in about two seconds — no steps, no log, a red check on work that was
    #    fine (release `fb299d90`, run 209, PR #795). A guard cannot read that
    #    rule, so it has to agree with it by hand; the header says what to change,
    #    and in which order, before `release` is listed here (owner, 2026-10-11)
    #    and before `test` is.
    #
    # 2. THE OWNER'S OWN DISPATCH publishes any branch, main included. Never a
    #    write collaborator's dispatch (anyone with write may run a workflow, so
    #    the typed PUBLISH alone is not authority; the actor is), and a RE-RUN of
    #    the owner's dispatch by a collaborator keeps the owner as github.actor,
    #    so the actor who triggered THIS attempt must be the owner as well.
    #
    # WHAT THIS DOES NOT PROMISE. Pages serves one site per repository and this
    # one is assembled with main's tree as its base, so any publication carries
    # whatever main holds at that moment. A push to main never publishes itself —
    # that is the guarantee — but main's content does reach the site on the next
    # dev publication after it lands. Closing that would mean
    # pinning the site's main section to the last approved publication, which is
    # a change to how the site is assembled rather than to who may publish it.
    # Merging to main is already owner-only, so what reaches main is the owner's
    # decision before this job ever runs.
    # A feature/fix/chore preview that failed or was cancelled also reaches this job
    # (workflow_run, any conclusion): the current-head check in assemble drops its stale
    # build, so the site never keeps it. Comments stay out of the folded if: block below.
    if: >-
      (
        github.event_name == 'push'
        && (github.ref_name == 'dev' || github.ref_name == 'release')
      ) || (
        github.event_name == 'workflow_run' && (
          github.event.workflow_run.conclusion == 'success'
          || (startsWith(github.event.workflow_run.head_branch, 'feature/') || startsWith(github.event.workflow_run.head_branch, 'fix/') || startsWith(github.event.workflow_run.head_branch, 'chore/'))
        )
      ) || (
        github.event_name == 'pull_request_target'
      ) || (
        github.event_name == 'workflow_dispatch' && inputs.publish == 'PUBLISH'
        && github.actor == github.repository_owner
        && github.triggering_actor == github.repository_owner
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # The publication's own receipt, so the run that published says so rather
      # than leaving the assemble job's summary as the last word on it.
      - name: Record the publication
        run: |
          {
            echo "### Published"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| URL | ${{ steps.deployment.outputs.page_url }} |"
            echo "| Commit | \`$GITHUB_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # THE STICKY "PLAYABLE BUILD" COMMENT. Its own job, so the Pages deploy job keeps
  # its environment and permissions exactly as they were: pull-requests: write is
  # granted here alone, and only after the deploy has succeeded. It runs whenever
  # assemble ran and the deploy succeeded, even when no preview was published this
  # run, because a PR whose current preview was withdrawn still has a comment that
  # now points at a removed path. For each PR:
  #   - published this run (assemble's comment_targets) → upsert the link comment;
  #   - open, same-repo feature/fix/chore into dev, NOT published, with a sticky
  #     comment already → edit that comment to say the preview is withdrawn;
  #   - not published and no sticky comment → nothing. A withdrawn note is never a
  #     new comment.
  # One comment per PR, found by its marker and updated in place on every push.
  # Closed pull requests into dev (the last 14 days) are swept independently of the
  # event: a run that coalesced pushes can miss the close, so the list, not the
  # trigger, decides which closed PR's link is removed.
  comment:
    needs: [assemble, deploy]
    if: needs.assemble.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the playable-build comment on each published PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Branch-derived values reach the shell only through env, never ${{ }} in run.
          TARGETS: ${{ needs.assemble.outputs.comment_targets }}
          # The PR this run closed (pull_request_target, closed), or empty. Its preview is
          # removed with the close, so its own sticky comment is edited to say so.
          CLOSED_PR: ${{ github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.number || '' }}
        run: |
          set -uo pipefail
          # One upsert per PR. A failure on one PR is named and the rest still run; the
          # step fails at the end so no failed comment goes unreported.
          upsert() {
            local pr="$1" dir="$2" url body id
            url="https://cehinds.github.io/AshenSpire/branches/$dir/latest/"
            body=$(printf '<!-- ashen-playable-build -->\nPlayable build: %s\n' "$url")
            id=$(gh api --paginate "repos/$REPO/issues/$pr/comments" \
              --jq '.[] | select(.body | startswith("<!-- ashen-playable-build -->")) | .id' | sed -n '1p') || return 1
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null || return 1
              echo "updated the playable-build comment on PR #$pr"
            else
              gh api -X POST "repos/$REPO/issues/$pr/comments" -f body="$body" > /dev/null || return 1
              echo "posted the playable-build comment on PR #$pr"
            fi
          }
          # A PR whose preview is withdrawn (not published this run) keeps its sticky
          # comment, which would point at a removed path. That comment is edited to say
          # so. Only an existing comment is edited: no comment is created to say it.
          withdraw() {
            local pr="$1" text="$2" id body
            body=$(printf '%s\n' '<!-- ashen-playable-build -->' "$text")
            id=$(gh api --paginate "repos/$REPO/issues/$pr/comments" \
              --jq '.[] | select(.body | startswith("<!-- ashen-playable-build -->")) | .id' | sed -n '1p') || return 1
            if [ -z "$id" ]; then return 0; fi
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null || return 1
            echo "marked the playable-build comment on PR #$pr as withdrawn"
          }
          # Edits the sticky comment only when it still links a preview. A comment already
          # marked removed has no link and is left alone, so this pass is idempotent. Never
          # creates a comment.
          remove_link() {
            local pr="$1" text="$2" id body
            id=$(gh api --paginate "repos/$REPO/issues/$pr/comments" \
              --jq '.[] | select(.body | startswith("<!-- ashen-playable-build -->") and contains("Playable build: https://")) | .id' | sed -n '1p') || return 1
            if [ -z "$id" ]; then return 0; fi
            body=$(printf '%s\n' '<!-- ashen-playable-build -->' "$text")
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null || return 1
            echo "removed the preview link from the playable-build comment on closed PR #$pr"
          }
          failed=0
          declare -A published=()
          rows=$(printf '%s' "${TARGETS:-[]}" | jq -r '.[] | [(.pr | tostring), .dir] | @tsv') || { echo "::error::could not read the comment targets"; exit 1; }
          while IFS=$'\t' read -r pr dir; do
            [ -n "$pr" ] || continue
            published[$pr]=1
            if ! upsert "$pr" "$dir"; then
              echo "::error title=Playable-build comment failed::PR #$pr"
              failed=1
            fi
          done <<< "$rows"
          # The closed PR joins the withdrawal set. A closed PR is not in the open list
          # below, so it is handled here, once, and its comment says the PR is closed.
          if [ -n "$CLOSED_PR" ]; then
            if ! withdraw "$CLOSED_PR" "Preview removed: this pull request is closed."; then
              echo "::error title=Closed-PR comment failed::PR #$CLOSED_PR"
              failed=1
            fi
          fi
          open=$(gh api --paginate "repos/$REPO/pulls?state=open&base=dev&per_page=100" \
            | jq -r --arg repo "$REPO" '.[] | select(.head.repo.full_name == $repo and .base.ref == "dev") | select(.head.ref | test("^(feature|fix|chore)/")) | .number') \
            || { echo "::error::could not list the open pull requests into dev"; exit 1; }
          while read -r pr; do
            [ -n "$pr" ] || continue
            [ -n "${published[$pr]:-}" ] && continue
            if ! withdraw "$pr" "Preview withdrawn: the current commit's build did not succeed; it returns when a build passes."; then
              echo "::error title=Withdrawn-preview comment failed::PR #$pr"
              failed=1
            fi
          done <<< "$open"
          # Closed pull requests into dev, closed in the last 14 days, same repository,
          # feature/fix/chore heads. Paginated, 100 per page.
          since="$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          closed=$(gh api --paginate "repos/$REPO/pulls?state=closed&base=dev&sort=updated&direction=desc&per_page=100" \
            | jq -r --arg repo "$REPO" --arg since "$since" '.[] | select(.closed_at != null and .closed_at >= $since and .head.repo.full_name == $repo and .base.ref == "dev") | select(.head.ref | test("^(feature|fix|chore)/")) | .number') \
            || { echo "::error::could not list the closed pull requests into dev"; exit 1; }
          while read -r pr; do
            [ -n "$pr" ] || continue
            [ -n "${published[$pr]:-}" ] && continue
            if ! remove_link "$pr" "Preview removed: this pull request is closed."; then
              echo "::error title=Closed-PR link removal failed::PR #$pr"
              failed=1
            fi
          done <<< "$closed"
          exit "$failed"
