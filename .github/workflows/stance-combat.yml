name: Stance combat evidence
on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/ward-to-block-cards-qa.mjs'
      - 'tools/ward-to-block-card-text.mjs'
      - '.github/workflows/stance-combat.yml'
      - 'tools/stance-combat-qa.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stance-combat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cards:
    if: github.head_ref == 'feature/WardToBlock' || github.ref_name == 'feature/WardToBlock'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASHEN_ART_SOURCE: cache
      WARD_CARD_QA_OUT: outputs/ward-to-block
      STANCE_QA_OUT: outputs/stance-combat
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          lfs: false
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/fetch-art
        with:
          packs: all
      - uses: ./.github/actions/which-browser
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Targeted card and combat tests
        id: tests
        continue-on-error: true
        run: >-
          node --test tests/stance-lifecycle.test.mjs tests/stance-hit.test.mjs tests/stance-hud.test.mjs
          tests/spell-defense.test.mjs
          tests/spell-defense-ranges.test.mjs tests/counter-return-range.test.mjs
          tests/card-classification.test.mjs tests/combat-reaction-stack.test.mjs
          tests/playing-card-model.test.mjs tests/ability-card-identity.test.mjs
          tests/combat-card-presentation.test.mjs tests/combat-sigils.test.mjs
          tests/combat-expansion-tactics.test.mjs tests/card-surface-consistency.test.mjs
          tests/deck-editor.test.mjs tests/card-art-rendering.test.mjs tests/card-face-text.test.mjs
          tests/combat-expansion-martial.test.mjs tests/combat-impact-flux.test.mjs
          tests/enemy-knowledge-integration.test.mjs tests/combat-reactions.test.mjs
          tests/combat-rounds-live.test.mjs
          tests/card-tag-explanation.test.mjs
      - name: Export exact compact and inspection card text
        id: text
        continue-on-error: true
        run: node tools/ward-to-block-card-text.mjs
      - name: Capture six production views and inspections
        id: capture
        continue-on-error: true
        run: node tools/ward-to-block-cards-qa.mjs
      - name: Capture stance HUD and hit outcomes
        id: stance
        continue-on-error: true
        run: node tools/stance-combat-qa.mjs
      - name: Upload screenshots and exact visible text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stance-combat-${{ github.event.pull_request.head.sha || github.sha }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 14
      - name: Inline screenshot evidence
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readdirSync, readFileSync } from 'node:fs';
          for (const dir of ['outputs/ward-to-block','outputs/stance-combat']) {
          if (existsSync(dir)) {
            for (const file of readdirSync(dir).filter(file => /\.jpe?g$/.test(file)).sort()) {
              const bytes = readFileSync(dir + '/' + file).toString('base64');
              console.log('WARD_IMAGE_START ' + file);
              for (let i = 0; i < bytes.length; i += 16000) console.log('WARD_IMAGE_DATA ' + bytes.slice(i, i + 16000));
              console.log('WARD_IMAGE_END ' + file);
            }
            if (existsSync(dir + '/card-text.json')) {
              const text = JSON.parse(readFileSync(dir + '/card-text.json', 'utf8'));
              console.log('WARD_TEXT_SUMMARY ' + JSON.stringify({ assumptions: text.assumptions, liveExamples: text.liveExamples, cards: text.cards.filter(card => ['fireCounter', 'frostCounter', 'forceCounter', 'crystalBarrier', 'sweepingBlow', 'dodgeRoll'].includes(card.ref.cardId) && !card.ref.upgraded).slice(0,24) }));
            }
            if (existsSync(dir + '/report.json')) console.log('WARD_REPORT ' + readFileSync(dir + '/report.json', 'utf8').replace(/\n/g, ' '));
          }
          }
          NODE
      - name: Require tests and all requested captures
        if: always()
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
          TEXT_RESULT: ${{ steps.text.outcome }}
          CAPTURE_RESULT: ${{ steps.capture.outcome }}
          STANCE_RESULT: ${{ steps.stance.outcome }}
        run: test "$TEST_RESULT" = success && test "$TEXT_RESULT" = success && test "$CAPTURE_RESULT" = success && test "$STANCE_RESULT" = success
