name: Enemy back module QA
on:
  push:
    branches: ['worker/EnemyBackSprites/module', 'worker/EnemyBackSprites/gallery-preview', 'worker/EnemyBackSprites/gallery-content', 'worker/EnemyBackSprites/gallery-final', 'worker/EnemyBackSprites/gallery-130', 'worker/EnemyBackSprites/gallery-motion']
  pull_request:
    branches: ['feature/EnemyBackSprites']
    paths: ['pose-studio/enemy-back-proposals/**', '.github/workflows/enemy-back-module-qa.yml']
permissions:
  contents: read
jobs:
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            pose-studio/enemy-back-proposals
            src
            tools
            workbench
            content
            engine
            editor
            styles
            ui-studio
            index.html
            package.json
            art-manifest.json
            art-release.json
            art/enemy-back-proposals
            art/enemy-back-motion
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build actual static Workbench without external art
        run: node tools/workbench-static.mjs --out /tmp/enemy-back-static --base /qa/workbench/ --no-art
      - name: Verify normalized art hashes
        run: |
          node pose-studio/enemy-back-proposals/integrate-normalized.mjs wyrmAspirant
          node pose-studio/enemy-back-proposals/integrate-normalized.mjs wyrmLord
          node pose-studio/enemy-back-proposals/integrate-normalized.mjs courtDuelist
          node pose-studio/enemy-back-proposals/integrate-normalized.mjs fellWarden
          node pose-studio/enemy-back-proposals/integrate-normalized.mjs furnaceSaint
          node pose-studio/enemy-back-proposals/integrate-normalized.mjs stitchedKing
          node pose-studio/enemy-back-proposals/integrate-normalized.mjs glassRegent
          node pose-studio/enemy-back-proposals/integrate-normalized.mjs marrowOrganist
          node pose-studio/enemy-back-proposals/integrate-normalized.mjs bellKeeper
          node pose-studio/enemy-back-proposals/integrate-normalized.mjs thornMatriarch
          node pose-studio/enemy-back-proposals/integrate-normalized.mjs ashheartDragon
          node pose-studio/enemy-back-proposals/integrate-normalized.mjs blightedValkyrie
          node pose-studio/enemy-back-proposals/integrate-normalized.mjs hollowAstronomer
      - name: Model and Workbench registration contracts
        run: |
          node --test pose-studio/enemy-back-proposals/model.test.mjs pose-studio/enemy-back-proposals/motion.test.mjs
          node --test --test-name-pattern='the registry is well formed|every HTML tool page' workbench/tests/registry.test.mjs
      - name: Install isolated browser tooling
        run: |
          npm install --prefix /tmp/enemy-back-qa playwright
          /tmp/enemy-back-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Production gallery browser checks
        env:
          PLAYWRIGHT_MODULE: /tmp/enemy-back-qa/node_modules/playwright/index.mjs
        run: node pose-studio/enemy-back-proposals/browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enemy-back-module-qa
          path: /tmp/enemy-back-module-qa/
