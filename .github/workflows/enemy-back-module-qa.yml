name: Enemy back module QA
on:
  push:
    branches: ['worker/EnemyBackSprites/module', 'worker/EnemyBackSprites/gallery-preview']
  pull_request:
    branches: ['feature/EnemyBackSprites']
    paths: ['pose-studio/enemy-back-proposals/**', '.github/workflows/enemy-back-module-qa.yml']
permissions:
  contents: read
jobs:
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            pose-studio/enemy-back-proposals
            src
            tools
            workbench
            content
            engine
            styles
            ui-studio
            index.html
            package.json
            art-manifest.json
            art-release.json
            art/enemy-back-proposals/wyrmAspirant
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build actual static Workbench without external art
        run: node tools/workbench-static.mjs --out /tmp/enemy-back-static --base /qa/workbench/ --no-art
      - name: Verify normalized art hashes
        run: node pose-studio/enemy-back-proposals/integrate-normalized.mjs wyrmAspirant
      - name: Model contract
        run: node --test pose-studio/enemy-back-proposals/model.test.mjs
      - name: Install isolated browser tooling
        run: |
          npm install --prefix /tmp/enemy-back-qa playwright
          /tmp/enemy-back-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Production gallery browser checks
        env:
          PLAYWRIGHT_MODULE: /tmp/enemy-back-qa/node_modules/playwright/index.mjs
        run: node pose-studio/enemy-back-proposals/browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enemy-back-module-qa
          path: /tmp/enemy-back-module-qa/
