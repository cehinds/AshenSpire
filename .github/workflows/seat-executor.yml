name: seat executor

# Wakes the seats the control plane says are due, by filing one GitHub issue per
# seat carrying its wake capsule.
#
# The workflow decides NOTHING. `opsctl dispatch` derives every answer from the
# contracts — who is due, who is woken, and what reaches the Owner — so changing
# routing means changing governance JSON, never this file. The workflow's only
# jobs are: refuse to wake anyone from an invalid state, and not file the same
# issue twice.
#
# Seat work is addressed to @claude, so it runs without the Owner present.
# Owner decisions are filed WITHOUT that mention: they are Constantine's alone.

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what would be filed without filing it
        required: false
        default: false
        type: boolean

concurrency:
  group: seat-executor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # An invalid control plane must never wake anyone: a stranded seat, a
      # broken seal or an undeclared escalation class would otherwise be handed
      # to an agent as if it were an instruction.
      - name: Verify control plane
        run: node .agentops/tools/opsctl.mjs verify

      - name: Compute what is due
        id: due
        run: |
          node .agentops/tools/opsctl.mjs dispatch --json > /tmp/dispatch.json
          echo "count=$(jq 'length' /tmp/dispatch.json)" >> "$GITHUB_OUTPUT"
          node .agentops/tools/opsctl.mjs dispatch

      - name: File wake issues
        if: steps.due.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          filed=0; skipped=0

          while read -r entry; do
            ticket=$(jq -r '.ticket'  <<<"$entry")
            kind=$(jq -r '.kind'      <<<"$entry")
            wake=$(jq -r '.wake'      <<<"$entry")
            reason=$(jq -r '.reason'  <<<"$entry")

            # One open issue per ticket, found by a marker in the body rather
            # than by title, so a retitled issue is still recognised and the
            # seat is not woken twice for the same work.
            marker="agentops-dispatch:${ticket}"
            existing=$(gh issue list --state open --search "\"$marker\" in:body" \
                         --json number --jq '.[0].number // empty' || true)
            if [ -n "$existing" ]; then
              echo "skip  $ticket (already open as #$existing)"
              skipped=$((skipped+1)); continue
            fi

            body=/tmp/body-$ticket.md
            {
              if [ "$kind" = "owner-decision" ]; then
                echo "**This one is yours, @cehinds.** The control plane routed it to the Owner; no seat may take it."
              else
                echo "@claude — you are the **$wake** seat for this ticket. Work only inside the authority below."
              fi
              echo
              echo "> $reason"
              echo
              echo '```'
              node .agentops/tools/opsctl.mjs wake --work "$ticket" 2>&1 || echo "(wake failed; run: node .agentops/tools/opsctl.mjs wake --work $ticket)"
              echo '```'
              echo
              echo "<details><summary>Dispatch record</summary>"
              echo
              echo '```json'
              jq '.' <<<"$entry"
              echo '```'
              echo
              echo "</details>"
              echo
              echo "<!-- $marker -->"
              echo
              echo "---"
              echo "_Generated by [Claude Code](https://claude.ai/code)_"
            } > "$body"

            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "--- would file: $ticket ($kind -> $wake) ---"; cat "$body"; continue
            fi

            label=$([ "$kind" = "owner-decision" ] && echo "owner-decision" || echo "seat-wake")
            gh label create "$label" --color BFD4F2 --description "AgentOps dispatch" 2>/dev/null || true
            gh issue create \
              --title "[$wake] $ticket — $( [ "$kind" = "owner-decision" ] && echo "decision needed" || echo "seat wake" )" \
              --body-file "$body" --label "$label"
            filed=$((filed+1))
          done < <(jq -c '.[]' /tmp/dispatch.json)

          echo "filed=$filed skipped=$skipped"
