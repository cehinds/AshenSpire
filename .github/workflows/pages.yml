# .github/workflows/pages.yml — publishes the read-only AgentOps Owner HUD to
# GitHub Pages.
#
# INERT BY DEFAULT. This workflow triggers on `workflow_dispatch` only, so it
# never runs on its own and cannot clobber any existing Pages setup. Publishing
# the HUD is the owner's explicit, manual action: enable Pages (Settings → Pages
# → Source: GitHub Actions), then run this workflow. Until then it does nothing.
#
# SECURITY MODEL
# - Publication is a protected transition (see owner-intent.json →
#   protected_decision_classes: publication / Pages / deployment). Manual
#   dispatch alone is NOT authority. This workflow gates the deploy on the
#   dispatcher being the repository owner, so only the owner can publish:
#     * `authorize` fails the run unless `github.actor == github.repository_owner`
#       — the codified actor check (a foreman dispatch is rejected, not treated
#       as consent); and
#     * the `deploy` job runs inside the `github-pages` environment, so the owner
#       can additionally require an environment reviewer (Settings →
#       Environments → github-pages → Required reviewers) for owner-approved,
#       protected-environment publication. Enabling that reviewer is the
#       recommended second gate and is a repository setting, not workflow code.
#   This mirrors the owner-command doctrine (authorize-release is owner-exclusive
#   and compare-and-swap-checked): publication authenticates the owner alone.
# - Least privilege: the top-level token is read-only; only the `deploy` job is
#   granted `pages: write` + `id-token: write`, inside the protected
#   `github-pages` environment.
# - The published page is a redacted, deterministic projection of validated
#   repository state (see .agentops/tools/opsctl.mjs renderHud): no tokens, no
#   secrets, no write paths. `verify` runs first, so only in-sync state ships.
# - No untrusted PR code executes here (workflow_dispatch only, no pull_request).
# - HARDENING TO APPLY BEFORE ENABLING: pin each `uses:` below to a full commit
#   SHA (e.g. `actions/checkout@<40-char-sha>`). They are left on their current
#   major/patch tags here to match this repository's existing workflow
#   convention and to avoid committing an unverified SHA; SHA-pinning is the
#   recommended final step and changes no behavior.

name: pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Protected-transition gate: publication is owner-exclusive, so a manual
  # dispatch by anyone other than the repository owner fails before any Pages
  # permission is granted. build/deploy depend on this job.
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Only the repository owner may publish the HUD
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ]; then
            echo "::error::Pages publication is an owner-exclusive protected transition (owner-intent.json → protected_decision_classes)."
            echo "Dispatcher '$ACTOR' is not the repository owner '$OWNER'; manual dispatch is not authority."
            exit 1
          fi
          echo "Authorized: publication dispatched by the repository owner '$OWNER'."

  build:
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Only ever publish state that is valid and in sync with its sources.
      - name: Verify the control plane before publishing
        run: node .agentops/tools/opsctl.mjs verify

      # Stage the committed HUD and inject the exact deploying commit SHA into
      # the source-commit placeholder. The committed file keeps the placeholder,
      # so it stays deterministic and drift-gateable.
      - name: Stage the HUD with the source commit
        run: |
          mkdir -p _site
          cp .agentops/generated/hud/index.html _site/index.html
          sed -i "s/__SOURCE_COMMIT__/${GITHUB_SHA}/g" _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
