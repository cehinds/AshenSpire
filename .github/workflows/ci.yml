# DIAGNOSTIC BRANCH ONLY. NEVER MERGE THIS WORKFLOW.
# Manual Windows evidence for the ORIGINAL six Act/picker timing tests.
# The actual repair branch retains its complete CI workflow and all gates.
name: Diagnostic only - Windows Act and picker (never merge)
run-name: Cold diagnostics on ${{ github.ref_name }} (${{ inputs.stage }})

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Compatibility input only; this diagnostic always runs the original Windows timing file'
        type: choice
        options: [all, test, release]
        default: all

permissions:
  contents: read

env:
  ASHEN_ART_SOURCE: cache
  ART_PACKS: all

jobs:
  cold-diagnostics:
    name: Original six tests with cold diagnostics (Windows)
    if: github.ref == 'refs/heads/codex/act-picker-cold-diagnostics'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Initialize diagnostic artifact directory
        shell: pwsh
        run: |
          $taskDir = Join-Path $env:RUNNER_TEMP 'act-picker-cold-diagnostics'
          New-Item -ItemType Directory -Force -Path $taskDir | Out-Null
          "ASHEN_COLD_DIAGNOSTIC_DIR=$taskDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Diagnostic only. Never merge. Ref=$env:GITHUB_REF SHA=$env:GITHUB_SHA Run=$env:GITHUB_RUN_ID Attempt=$env:GITHUB_RUN_ATTEMPT" | Set-Content -LiteralPath (Join-Path $taskDir 'bootstrap.txt')

      # Keep the same bootstrap as the real Windows discovered-test job.
      - name: Keep checked-out bytes identical to stored bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          lfs: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/art/**/*.png
            !/docs/**/*.png
      - uses: ./.github/actions/setup-node
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the existing card artwork encoder
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/card-art-python"
          encoder="$RUNNER_TEMP/card-art-python/Scripts"
          "$encoder/python" -m pip install Pillow==11.1.0
          echo "$encoder" >> "$GITHUB_PATH"
          echo "ASHEN_PYTHON=$("$encoder/python" -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - uses: ./.github/actions/fetch-art
        with:
          packs: ${{ env.ART_PACKS }}

      - name: Profile original timing tests once and preserve their exit code
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $taskProfiles = Join-Path $env:ASHEN_COLD_DIAGNOSTIC_DIR 'profiles'
          New-Item -ItemType Directory -Force -Path $taskProfiles | Out-Null
          # No fixed profile name: Node parent/child profiles must remain distinct.
          & node --cpu-prof --cpu-prof-interval=100 --cpu-prof-dir=$taskProfiles --import ./.github/diagnostics/act-picker-cold.mjs --test --test-reporter=spec --test-concurrency=4 tests/seed-driven-schedule-and-perf.test.mjs 2>&1 | Tee-Object -FilePath (Join-Path $env:ASHEN_COLD_DIAGNOSTIC_DIR 'original-six-tests.log')
          $taskExit = $LASTEXITCODE
          "Native Node exit code: $taskExit" | Set-Content -LiteralPath (Join-Path $env:ASHEN_COLD_DIAGNOSTIC_DIR 'native-exit.txt')
          exit $taskExit

      - name: Always upload logs, source hashes, counters and CPU profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cold-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/act-picker-cold-diagnostics
          if-no-files-found: error
          retention-days: 7
