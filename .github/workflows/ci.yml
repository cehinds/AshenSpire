# .github/workflows/ci.yml — the first workflow this repository has ever had.
#
# Before this file, `git ls-tree <ref> -- .github` was empty at every ref. SOP 3
# has required CI all along, so the rule was not met here — it was UNREAD. Under
# SOP 2's silence guard a run that is absent is `unknown`, and unknown blocks; a
# repo with no workflow has been sitting in `unknown` and reading as green.
#
# SOP 3's four requirements, and where each is honestly met or not:
#
#  1. RUNS ON EVERY PUSH AND PR — → NOT MET since `b55e078`, and PARTLY MET
#     since 2026-09-26. `b55e078` made the `on:` block `workflow_dispatch:`
#     alone: exactly the "workflow_dispatch-only" shape the old text here ruled
#     out while still reading "→ MET". The edit that turned automatic runs off
#     changed `on:` and said so; this header sits fifty lines above it and nobody
#     edited it. That is how a second copy is born — one fact, two homes,
#     nothing checking they agree. EldenSpire#35. Today every job runs on a push
#     to `test` or `release`, and a PR's legs are read at promotion (the `on:`
#     block below states it once). A push to `dev` or a feature branch
#     still fires nothing here: under SOP 2's silence guard that is `unknown`
#     until the tree reaches `test`, and unknown blocks.
#
#     THE STANDING BOUNDARY, and it belongs here rather than on a card. Nothing
#     in this repo is `verified-at` a CI ref while this holds. The permanent
#     loss is requirement 2's four platform claims below: no seat hand-runs
#     `windows-latest` or `macos-latest`, so those four are `unknown` and stay
#     `unknown` — not green, and not red either. Aging is not a fix.
#
#  2. EVERY RUNNER THE CODE MAKES A PLATFORM-SPECIFIC CLAIM ON — this repo makes
#     four, and they are not hypothetical:
#       · run.sh (POSIX, mode 100755) vs run.bat (Windows) — README.md offers both
#       · tools/bundle.mjs splits paths on /[\\/]/ and rebuilds keys with
#         posix.join: an explicit claim about backslash-separated paths
#       · tools/dirorder.mjs claims byte order is identical on every filesystem.
#         This is THE claim that failed: build/AshenSpire.html at 40c5b21 was
#         built on a case-insensitive filesystem (its ASSET_MAP order is
#         case-insensitive collation), so a Linux rebuild differed. windows-latest
#         and macos-latest are literally the runners that produced the defect.
#       · tools/screenshot.mjs carries Windows, macOS and Linux browser paths
#     → the matrix below DECLARES all three runners, and declaring is not
#       running. Gated on requirement 1: while that is NOT MET this reads
#       `unknown`, not MET. The boundary is stated once, under requirement 1 —
#       do not restate it here. See also the honest warning on `reproducible`.
#
#  3. A MACHINE CHECK FOR EACH RULE WE ENFORCE BY HAND — PARTIALLY MET, and I am
#     not going to dress that up. Newly machine-checked here: the shipped artifact
#     root + dist carry their art, both ARE the build, no version-stamped twin is tracked,
#     ?shot= cannot reach a player's save, and — since Vira's sign-off — the
#     dirorder comparator itself, which was a FIFTH hand-enforced rule that I had
#     protected with a comment and left off this list. Still enforced by hand, listed by the
#     `boundary` job so the gap is in the run's own output rather than in a doc:
#     SOP 3's review-lens sign-offs, and SOP 2's ref/domain
#
#     SOP 5's one-version-derived check WAS on that hand-enforced list, in these
#     words: "this repo satisfies SOP 5 by construction — src/content/index.js is
#     the only home and tools/launch.mjs derives it — but NOTHING STOPS a second
#     copy being born, and I did not build that detector." Built 2026-08-15
#     (Sten, with Constantine's ask for a build version on three screens):
#     `tools/buildversion.mjs --check` runs in the `reproducible` job on all
#     three runners (after the build it reads, since 2026-09-26), `--selftest` proves it can fail on six known-bads including the
#     re-typed-version fixture SOP 5 names, and `tools/buildstamp-shot.mjs` in
#     `browser-guard` asks the other half — whether the string is INK on the
#     three screens rather than merely in the DOM. The sentence is EDITED rather
#     than left standing beside its own fix: a boundary that overstates the gap
#     goes false exactly the way one that understates it does.
#
#     (…continuing the still-hand-enforced list interrupted above: and SOP 2's
#     ref/domain resolution guard.)
#
#  4. A NAMED BOUNDARY IN THE RUN'S OWN OUTPUT — the `boundary` job always runs,
#     including on failure, and tools/verify-shipped.mjs and
#     tools/shotguard-probe.mjs each print their own boundary block. A suite that
#     prints only PASS is "green wasn't clearance" shipped as infrastructure.
#
# REMOVAL CONDITION (SOP 1's corollary). This workflow is deleted, not amended,
# when EITHER holds:
#   · the standalone stops being a tracked artifact — when a release workflow
#     attaches it and README.md links the release, the `reproducible` job's
#     player-facing-alias freshness gate is verifying files that no longer exist, and the
#     remaining test legs belong in a smaller workflow;
#   · the repo stops shipping a single-file build at all, which is the premise of
#     every check here.
# It is NOT removed for being red. A red here means a claim in this repo is false
# on some platform, which is the entire reason it exists. See the warning below.

name: ci

on:
  # AUTOMATIC CI DISABLED 2026-08-01, at the repo owner's request — GitHub Actions
  # minutes cost money on private repos, and this workflow is the most expensive
  # one here: a 3-OS matrix on every push to every branch, where Windows bills at
  # 2x and macOS at 10x the Linux rate.
  #
  # It now runs ONLY when started by hand: Actions tab -> "Run workflow".
  # Nothing below this block changed; every job, guard and boundary is intact.
  #
  # DO NOT RE-ENABLE BY RESTORING WHAT WAS HERE. The old text told you to put
  # back `push: branches: ['**']` + `pull_request:`. That pair is a measured
  # defect, not last-known-good: it ran EVERY COMMIT TWICE. The `concurrency`
  # block below does not dedupe them, because `github.ref` is `refs/heads/x` on
  # the push event and `refs/pull/N/merge` on the pull_request event — two
  # groups, two runs, same sha. Measured over 30 runs before the shutoff: 18
  # distinct shas, 12 of which fired both events. EldenSpire#35.
  #
  # WHEN RE-ENABLING IS A DECISION SOMEONE MAKES (it is Constantine's — Tier 2,
  # and nothing here takes it), take these three first. They remove no check and
  # no runner. Each cost is stated because a CI cut with an unstated coverage
  # loss is the receipt problem at the level of the whole gate.
  #
  #   (a) ONE RUN PER COMMIT. `push: branches: [dev, main, release]` +
  #       `pull_request:`. A feature branch is covered by its PR.
  #       COST, and it is not zero: a feature branch with NO PR OPEN gets no CI
  #       at all, and SOP 3 wants CI on every push. The mitigation is SOP 3's own
  #       path — open the draft PR early — which this makes load-bearing rather
  #       than advisory.
  #       ALTERNATIVE, cheaper to write and racier to reason about: leave
  #       `branches: ['**']` and key concurrency to
  #       `${{ github.event.pull_request.number || github.ref }}` so both events
  #       share a group. But `cancel-in-progress: true` then has the two events
  #       cancel each other, and a CANCELLED run is `unknown`, not a result —
  #       you keep one run and cannot say which. Prefer (a).
  #
  #   (b) ONE JOB PER OS, NOT TWO. `test` and `reproducible` are the same 3-OS
  #       matrix with a byte-identical prologue (autocrlf / checkout
  #       fetch-depth:0 / setup-node 22). Merge them: 6 jobs -> 3. Nothing about
  #       WHAT runs changes — only how many times per-job minute-rounding is
  #       applied, and GitHub rounds each job up to a whole minute BEFORE the
  #       runner multiplier (Linux x1, Windows x2, macOS x10). Three fewer jobs
  #       is three fewer roundings, and one of them is a x10.
  #       COST: the `reproducible` steps must then carry `if: always()`, or a
  #       failing engine suite skips the artifact check that used to run in an
  #       independent job. State it in the file or it is a silent loss.
  #
  #   (c) `boundary` IS A WHOLE JOB FOR ONE `echo`. Its own runner, one billable
  #       minute, a few seconds of work.
  #       COST, and it is the reason this is listed LAST rather than as free
  #       money: the block's first line is `upstream results: test=...
  #       reproducible=... browser-guard=...`, and that line exists ONLY because
  #       this is a separate job with `needs:`. A step cannot read its own job's
  #       result, so folding it deletes the one line that is most useful when a
  #       run is red — and it survives a step failure but not a job cancellation.
  #       Cheapest saving, highest information cost. Fold it or keep it on
  #       purpose; do not fold it by reflex.
  #
  # The arithmetic above was measured at `8dfab2c` (run 30348520673, all eight
  # jobs, from the API's own started_at/completed_at). Under SOP 2's drift clause
  # that reading is `unknown (drifted)` against any newer tree — re-measure
  # before anyone commits to a number. Every RATIO here is independent of the
  # allowance; the allowance itself has never been read off this account's
  # billing page by anyone.
  #
  # AUTOMATIC TRIGGERS. By the owner's ruling D7 (2026-09-24): a push to
  # `release`, the one ref whose tree ships, so the 3-OS claims above are read
  # there at least. By the owner's ruling of 2026-09-26 ("the long shipped
  # artifact should be on test and release branches"): a push to `test` as well.
  #   push to test / release   — every job below.
  #   workflow_dispatch        — every job below, on any ref.
  # Pull requests into `dev` do not run this file: re-enabling that is the
  # owner's call (above), and `display-first`'s self-test has not been measured
  # against the five-minute dev-PR budget. `push` names only `test` and
  # `release`, so no commit runs twice. Nothing was removed: every job and step
  # runs, unchanged, on every push to `test` and `release`.
  push:
    branches: [test, release]
  workflow_dispatch:

# A PUSH to `test` or `release` is a promotion, and each promoted tree is its
# own answer: a second push must not cancel the first's 10-60 min run, nor
# replace it while queued (a group holds one pending run). So a push is grouped
# by its SHA, one group per commit, and never cancelled. A DISPATCH is grouped
# by its ref, so a newer dispatch on the same branch supersedes the older one
# and a 3-OS matrix is not paid for twice.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

# NODE 24 ACTIONS. Runs used to warn that actions/checkout@v4 and
# actions/setup-node@v4 execute on Node 20, which is deprecated and was being
# forced onto Node 24. Both were bumped to @v5 (Node 24) in one commit that did
# nothing else, so if a run breaks on the bump the diff says why.

jobs:
  # ---------------------------------------------------------------------------
  # The engine suite and the guards' own self-tests, on all three platforms.
  # These assert nothing about byte-identity, so they are the legs least likely
  # to be red for a reason that is really about the runner.
  # ---------------------------------------------------------------------------
  test:
    name: tests (${{ matrix.os }})
    if: github.event_name != 'pull_request' # heavy: push to test/release, or dispatch
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false # a Windows-only failure is a FINDING; do not hide it
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # Before checkout, deliberately: with autocrlf on (the Windows default) the
      # working tree gets CRLF bytes that were stored as LF, and the bundler reads
      # index.html and the stylesheets verbatim. That would make the build differ
      # on Windows for a reason that has nothing to do with the code. Fixed here
      # rather than with a .gitattributes because I cannot test a .gitattributes
      # on Windows from where I am, and an untested repo-wide line-ending rule is
      # a bigger claim than a runner setting.
      - name: Keep checked-out bytes identical to stored bytes
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          # Nothing in this job reads an LFS object: the built HTML is not
          # committed on dev (it exhausted the LFS budget), and the version checks
          # that read a build moved to `reproducible`, which builds first.
          lfs: false
          fetch-depth: 0 # verify-shipped --selftest reads a known-bad blob from history

      - uses: ./.github/actions/setup-node

      # #12 — THE CI DOOR PROVES ITSELF BEFORE IT JUDGES ANYTHING ELSE.
      # Every checker step below is wrapped in tools/verdict.mjs, which refuses a
      # tool that exits 0 while printing no counted verdict (SILENCE, exit 3) or a
      # verdict counting zero (exit 1). A wrapper nobody has watched fail is the
      # very defect this card names, so its known-bad corpus runs first.
      - name: The verdict door can fail (12 plants, each a real child process)
        run: node tools/verdict.mjs -- node tools/verdict.mjs --selftest

      # AND THE DOOR CANNOT SEE THE WIRING ABOVE ITSELF: a step with no command,
      # or a step whose command was overwritten by a duplicate key, never runs at
      # all and therefore never reaches the door. That is how the first cut of
      # this very PR shipped — `- name: Engine suite` with no `run:` and the door
      # step carrying two. workflow-lint reads this file as text and refuses both.
      - name: The workflow lint can fail (7 plants)
        run: node tools/verdict.mjs -- node tools/workflow-lint.mjs --selftest

      - name: Every workflow step actually runs a command
        run: node tools/verdict.mjs -- node tools/workflow-lint.mjs

      - name: Prompt-library CLI safety plants
        run: node tools/verdict.mjs -- node tools/prompt-library-selftest.mjs

      # THE SUITE'S TWO LANES, ON TWO CHECKOUTS (owner, 2026-10-02: every CI job
      # finishes in 20 minutes or less). `node tests/run-node.mjs` with no flag
      # is exactly `--no-selftests` plus `--selftests-only`; the second half runs
      # in `test-selftests` below, on its own checkout, as run-node's header
      # requires (weapon-card-packages writes a mutant into src/ while it runs).
      - name: Engine suite, every discovered test file, and each tool's verdict on the tree
        run: node tools/verdict.mjs -- node tests/run-node.mjs --no-selftests

      - name: Historical standalone artifacts resolve verified LFS bytes
        run: node tools/git-artifact.test.mjs

      - name: World Journey normalized data and seeded routes
        run: node tests/world-atlas.test.mjs

      # A player met "SOMETHING JUST STOPPED WORKING / ResizeObserver loop
      # completed with undelivered notifications. at :0" over a screen that was
      # working. The banner is the game's one claim that a control died, so a
      # false one costs the whole instrument. Both edges are here: the browser
      # notification raises nothing, and a real uncaught error still raises.
      - name: The failure banner fires for failures and not for notifications
        run: node --test tests/debug-banner.test.mjs

      - name: Fullscreen capability, enter, exit, and refusal states
        run: node tools/verdict.mjs -- node tools/fullscreen-control.mjs

      - name: The fullscreen controller can fail (3 plants)
        run: node tools/verdict.mjs -- node tools/fullscreen-control.mjs --selftest

      - name: Music-only preference and Quick Menu parity
        run: node tools/verdict.mjs -- node tools/music-toggle-parity.mjs

      - name: Music-only parity can fail (11 plants)
        run: node tools/verdict.mjs -- node tools/music-toggle-parity.mjs --selftest

      - name: The mobile art twin tree mirrors assets/ at the policy's sizes and fits its budget
        run: node tools/verdict.mjs -- node tools/mobile-art.mjs --check

      - name: That twin-tree gate catches its own known-bads (9 plants)
        run: node tools/verdict.mjs -- node tools/mobile-art.mjs --selftest

      - name: Every asset directory has a CREDITS row and README Legal agrees with the AI disclosure
        run: node tools/verdict.mjs -- node tools/credits-check.mjs

      - name: The credits check catches its own known-bads (12 plants)
        run: node tools/verdict.mjs -- node tools/credits-check.mjs --selftest

      - name: Shipped-artifact guard — self-test against the known-bad corpus
        # Proves the guard can fail. A guard that has never failed proves nothing,
        # which is exactly what bundle.mjs:435's WARNING was.
        run: node tools/verdict.mjs -- node tools/verify-shipped.mjs --selftest

      - name: Directory order — the corpus history already wrote
        # HERE, in the matrix job, and not in `reproducible`: the claim under test is
        # that the comparator produces the SAME order on every runner, so it belongs
        # on every runner. It also measures the divergence itself — that collation
        # and byte order disagree about the blightHound pair on THIS filesystem's
        # Node — which was reasoned and never run until this step existed.
        run: node tools/verdict.mjs -- node tools/dirorder.mjs --selftest

      - name: Directory order — reinstate the defect five ways, catch each
        # Inverted expectation, the same idiom as shotguard-probe --mutate. Without
        # this the step above is a corpus nobody has watched go red. Case 1 is Vira's
        # exact mutation — the one that put the 40c5b21 key order back with every
        # other leg of this gate green.
        run: node tools/verdict.mjs -- node tools/dirorder.mjs --mutate

      - name: Current builds use the 0.7.x.x release series
        run: node tools/release-series.mjs
      - name: Release series gate rejects older and malformed versions
        run: node tools/release-series.mjs --selftest

  # ---------------------------------------------------------------------------
  # The `--selftests-only` half of the engine suite, on all three platforms, on
  # its own checkout (see run-node.mjs's header). Split from `test` by the
  # owner's 20-minute rule (2026-10-02); together the two jobs run exactly what
  # `node tests/run-node.mjs` ran in one step before.
  # ---------------------------------------------------------------------------
  test-selftests:
    name: tool self-tests (${{ matrix.os }})
    if: github.event_name != 'pull_request' # heavy: push to test/release, or dispatch
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false # a Windows-only failure is a FINDING; do not hide it
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Keep checked-out bytes identical to stored bytes
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          lfs: false
          fetch-depth: 0 # the same history the `test` job's checkout has

      - uses: ./.github/actions/setup-node

      - name: Every tool check still catches its own known-bad corpus
        run: node tools/verdict.mjs -- node tests/run-node.mjs --selftests-only

  # ---------------------------------------------------------------------------
  # The bundler's parse gate, moved out of `test (ubuntu-latest)` into its own
  # parallel job by the owner's 20-minute rule (2026-10-02). Same command, same
  # runner; tests.yml's `parse-gate` runs it too, and neither copy was dropped.
  # ---------------------------------------------------------------------------
  parse-gate:
    name: bundler parse gate
    if: github.event_name != 'pull_request' # heavy: push to test/release, or dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Keep checked-out bytes identical to stored bytes
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          lfs: false # default depth, as tests.yml's parse-gate: the corpus reads no history,
          # and a full-history fetch cost this job 3 of its 16 minutes (run 36981774214)

      - uses: ./.github/actions/setup-node

      - name: Parse gate — the bundler's own known-bad corpus
        # NOTHING RAN THIS FILE, and that is the defect it was written to prevent
        # happening to something else. `tools/bundle.test.mjs` was in no workflow
        # at all, so when the ordinal rule changed under case 1a and the bundle
        # outgrew case 6v's fixed 600 KB cut, three assertions went red and stayed
        # red — a corpus nobody watches rots exactly the way §8's required-coverage
        # list rotted, which is the sentence at the top of case 7.
        #
        # UBUNTU ONLY, and it is a budget, not an oversight: this suite runs the
        # REAL bundler against ~20 disposable checkouts and each one writes a
        # 57 MB artifact — 13-14 minutes on a hosted runner (2026-10-02), which
        # is why it is its own job now rather than a step in `test (ubuntu)`. Its claims are about the gate's REFUSALS,
        # which are platform-independent; the platform claim is dirorder's and
        # `reproducible`'s, and both already run on all three.
        #
        # UNWRAPPED, like the world-atlas step above: the file prints per-case
        # PASS/FAIL lines and exits 1 on any FAIL, but no counted verdict, so the
        # door would read it as SILENCE. Giving it one is a change to this tool's
        # output contract and belongs with whoever wants the wrapper, not with
        # the fix that made the corpus green again.
        run: node tools/bundle.test.mjs

  # ---------------------------------------------------------------------------
  # Is the artifact we ship the artifact this source builds — on every platform?
  #
  # READ THIS BEFORE LOOSENING ANYTHING HERE. If this job is red on
  # windows-latest or macos-latest while green on ubuntu-latest, that is a REAL
  # FINDING: the build is not reproducible across filesystems, which is the
  # defect tools/dirorder.mjs was written to close and which shipped undetected
  # for months. The fix belongs in bundle.mjs or dirorder.mjs. It does NOT belong
  # in this job's expectations, and it is not a reason to drop a runner.
  #
  # Named honestly by its author: I wrote the windows and macos legs and have
  # never watched them run. Until they do, requirement 2 is `unknown` here, not
  # green — and `unknown` blocks.
  # ---------------------------------------------------------------------------
  reproducible:
    name: shipped artifact is this source (${{ matrix.os }}, ${{ matrix.shard }})
    if: github.event_name != 'pull_request' # heavy: push to test/release, or dispatch
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # SHARD COUNTS (owner rule D38, 2026-10-02: every CI job finishes in 20
        # minutes or less). The buildversion corpus is planned by measured cost
        # (tools/buildversion-selftest.mjs, SHARD_COST and planShards), not by
        # index. Windows ran it in 4 shards of 13-36 minutes; Windows is 2.4-5.2x
        # slower than Linux on this corpus, so it takes 12 shards (~2 min of
        # Linux work each), and macOS and Ubuntu take 2. Each runner's digest is
        # recorded by its shard 0 only, so reproducible-agree still compares
        # exactly three. tests/doorplant-shard.test.mjs requires every shard of
        # each runner's count.
        include:
          - { os: ubuntu-latest, shard: '0/2', digest: true }
          - { os: ubuntu-latest, shard: '1/2', digest: false }
          - { os: macos-latest, shard: '0/2', digest: true }
          - { os: macos-latest, shard: '1/2', digest: false }
          - { os: windows-latest, shard: '0/12', digest: true }
          - { os: windows-latest, shard: '1/12', digest: false }
          - { os: windows-latest, shard: '2/12', digest: false }
          - { os: windows-latest, shard: '3/12', digest: false }
          - { os: windows-latest, shard: '4/12', digest: false }
          - { os: windows-latest, shard: '5/12', digest: false }
          - { os: windows-latest, shard: '6/12', digest: false }
          - { os: windows-latest, shard: '7/12', digest: false }
          - { os: windows-latest, shard: '8/12', digest: false }
          - { os: windows-latest, shard: '9/12', digest: false }
          - { os: windows-latest, shard: '10/12', digest: false }
          - { os: windows-latest, shard: '11/12', digest: false }
    steps:
      - name: Keep checked-out bytes identical to stored bytes
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          lfs: false # the build is made here from source; nothing reads LFS
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Build the standalone and refresh root + dist/
        # Light art on dev/test (owner, 2026-09-26); release/main keep the full art.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          ART_TIER: ${{ ((github.base_ref || github.ref_name) == 'release' || (github.base_ref || github.ref_name) == 'main') && '--full-art' || '' }}
        shell: bash # $ART_TIER is an env var; Windows' default shell would not expand it
        run: node tools/verdict.mjs -- node tools/launch.mjs --build-only $ART_TIER

      - name: Root + dist carry their art, and ARE the build
        run: node tools/verdict.mjs -- node tools/verify-shipped.mjs

      - name: The rebuild changed nothing committed — the ordinal on the box is the one committed
        # STALENESS, now that the built HTML is not committed. A pull request
        # commits buildordinal.json (and src/content/changelog.generated.js) from
        # its own rebuild; if the source moved after that rebuild, this build
        # bumps the ordinal and the tree is no longer clean. That is the receipt
        # and the box disagreeing, caught before merge.
        shell: bash
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: One version, derived — SOP 5's detector, which this file said was missing
        # Requirement 3's named gap, closed. The header above used to say "SOP 5's
        # one-version-derived check … NOTHING STOPS a second copy being born, and I
        # did not build that detector"; that sentence is now edited rather than left
        # standing, because a boundary that overstates the gap rots the same way one
        # that understates it does.
        #
        # ON EVERY RUNNER, and that is requirement 2 rather than thoroughness: the
        # digest canonicalizes CRLF, so a Windows checkout and a Linux checkout of one
        # commit must derive the SAME string or the shipped stamp is a fact about a
        # filesystem. This repo has already paid once for that (tools/dirorder.mjs).
        #
        # AFTER THE BUILD, because rows D, E, E2 and F read the bundle and the
        # bundle is no longer committed on dev.
        run: node tools/verdict.mjs -- node tools/buildversion.mjs --check

      - name: …and it can fail — known-bads, each caught by the row that owns it
        # Inverted expectation, the idiom already in this job twice. Includes the
        # fixture SOP 5 asks for by name: a tree that RE-TYPES the version.
        # Windows previously spent 68 minutes here. The shards (matrix above)
        # keep every fixture and its real-tree entry while bounding each
        # runner's work; the plan is by measured cost, so no shard is the heavy one.
        run: node tools/verdict.mjs -- node tools/buildversion-selftest.mjs --shard ${{ matrix.shard }}


      - name: Record this runner's build digests
        if: matrix.digest
        # CROSS-PLATFORM DRIFT, the other half of what the old committed-artifact
        # diff caught. Each runner hashes what it built; `reproducible-agree`
        # requires all three to be identical.
        shell: bash
        run: node -e "const c=require('crypto'),f=require('fs');for(const p of ['build/AshenSpire.html','build/AshenSpire-mobile.html'].filter((p)=>f.existsSync(p)))console.log(c.createHash('sha256').update(f.readFileSync(p)).digest('hex')+'  '+p)" > build-digest-${{ matrix.os }}.txt

      - uses: actions/upload-artifact@v4
        if: matrix.digest
        with:
          name: build-digest-${{ matrix.os }}
          path: build-digest-${{ matrix.os }}.txt
          retention-days: 7

      # THE ART RELEASE IS A BUILD INPUT (docs/EXTERNAL-ASSETS-PLAN.md step 11).
      # art-release.json pins one tag of cehinds/AshenSpire-art with three zips;
      # tools/fetch-art.mjs downloads the ones named, checks each against the pin
      # and art-manifest.json, and unpacks them into .art-cache/ (ignored). The art
      # repository is public (step 10a), so every run fetches, with or without a
      # token, and runs the agreement check. A failure names its cause (token
      # refused, repository unreadable, rate limit, network) on the step and as an
      # annotation.
      # ONE RUNNER PER OS (the `digest` legs), so Windows' twelve shards (and the
      # two each on Linux and macOS) do not download the release once per shard.
      # LAST, so a failed fetch never costs the runner its digest record or
      # another step's verdict.
      - name: Fetch the art packs this build's tier uses
        if: ${{ matrix.digest && !cancelled() }}
        env:
          # THE TOKEN RULE IS DEFENCE IN DEPTH, NOT A SECURITY BOUNDARY. The art
          # repository is public, so ART_REPO_TOKEN only raises the API rate limit.
          # Only a push or dispatch of a protected branch (dev, test, release, main)
          # passes it, so a branch that edits tools/fetch-art.mjs alone cannot read
          # it; but anyone who can push a branch can edit this workflow to read any
          # secret. The real fix is the owner's: delete the ART_REPO_TOKEN secret, or
          # move it into a GitHub Environment limited to dev, test, release and main
          # (docs/EXTERNAL-ASSETS-PLAN.md, step 11).
          ART_REPO_TOKEN: ${{ github.event_name != 'pull_request' && contains(fromJSON('["refs/heads/dev","refs/heads/test","refs/heads/release","refs/heads/main"]'), github.ref) && secrets.ART_REPO_TOKEN || '' }}
          ART_PACKS: ${{ ((github.base_ref || github.ref_name) == 'release' || (github.base_ref || github.ref_name) == 'main') && 'all' || 'light,common' }}
        shell: bash # $ART_PACKS is an env var; Windows' default shell would not expand it
        run: node tools/fetch-art.mjs --pack "$ART_PACKS"

      - name: The fetched packs and the trees agree byte for byte on this OS
        if: ${{ matrix.digest && !cancelled() }}
        env:
          ART_PACKS: ${{ ((github.base_ref || github.ref_name) == 'release' || (github.base_ref || github.ref_name) == 'main') && 'all' || 'light,common' }}
        shell: bash
        run: node tools/verdict.mjs -- node tools/fetch-art.mjs --agree --pack "$ART_PACKS"

  reproducible-agree:
    name: the three runners built the same bytes
    needs: reproducible
    if: github.event_name != 'pull_request' # heavy: push to test/release, or dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-digest-*
          merge-multiple: true
      - name: Every runner's build digests are identical
        run: |
          set -eu
          ls build-digest-*.txt
          cat build-digest-*.txt
          test "$(ls build-digest-*.txt | wc -l)" -eq 3
          test "$(wc -l < "$(ls build-digest-*.txt | head -1)")" -ge 1
          # Every runner built the same files (one line each), and they agree:
          # the union of lines is exactly one runner's lines.
          test "$(cat build-digest-*.txt | sort -u | wc -l)" -eq "$(wc -l < "$(ls build-digest-*.txt | head -1)")"

  # ---------------------------------------------------------------------------
  # The save-overwrite guard needs a real browser: the defect was a URL reaching
  # localStorage, which is unreachable from Node. Ubuntu only — Chrome is
  # preinstalled on that image. The probe exits 2 when the instrument is
  # unavailable, which is red on purpose: `unknown` blocks, and it must never read
  # as a pass. It exits 1 only when a check actually RAN and failed. Those two were
  # the same exit code until run 1 of this workflow taught me otherwise.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # #319 / #248 owns a separate job so an unrelated browser probe cannot fail
  # first and silently skip this exact-head verdict. CI remains manual at the
  # workflow boundary above. The clean edge measures eight cells (two doors,
  # two shapes, two text sizes). The two focused corpora add twenty-four
  # copied-tree browser plants plus two clean baselines, including deliberate 25-second and
  # 30-second timeout defects. That cost is stated because this workflow bills
  # by the minute and silence between dispatches remains UNKNOWN.
  # ---------------------------------------------------------------------------
  display-first:
    name: Fullscreen first through both Settings doors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false # serves the source tree; reads no LFS object
      - uses: ./.github/actions/setup-node

      - name: Fullscreen is first and visible through both Settings doors
        run: node tools/verdict.mjs -- node tools/displayfirst.mjs

      - name: …and that gate can fail — twenty-six same-door browser boots
        run: node tools/verdict.mjs -- node tools/displayfirst.mjs --selftest

  browser-guard:
    # RENAMED 2026-08-21 (#295). It read "?shot= cannot touch a player's save",
    # which was the whole job when it was written and became one of four claims
    # in it. A job name is what a red run shows first; one naming a single check
    # sends the reader to the wrong tool. — Bjorn
    name: the checks that need a real browser
    if: github.event_name != 'pull_request' # heavy: push to test/release, or dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false # the standalone about-changelog opens is built below
      - uses: ./.github/actions/setup-node

      - name: Build the standalone (about-changelog opens build/AshenSpire.html)
        # Light art on dev/test (owner, 2026-09-26); release/main keep the full art.
        env:
          ART_TIER: ${{ ((github.base_ref || github.ref_name) == 'release' || (github.base_ref || github.ref_name) == 'main') && '--full-art' || '' }}
        shell: bash # $ART_TIER is an env var; Windows' default shell would not expand it
        run: node tools/verdict.mjs -- node tools/launch.mjs --build-only $ART_TIER

      - uses: ./.github/actions/which-browser

      - name: Hand-side placement reaches the correct rendered side
        # #16's remaining live half after #306: exercise every legal left/right
        # armament slot through the actual stylesheet and browser compositor.
        run: node tools/verdict.mjs -- node tools/hand-side-probe.mjs

      - name: The hand-side gate can fail — its same-door plants, each caught
        # The selftest copies the real tree, plants each known-bad in the file a
        # real regression would change, and requires the named red from the whole
        # browser door. A green baseline alone is not evidence that this is a gate.
        run: node tools/verdict.mjs -- node tools/hand-side-probe.mjs --selftest

      - name: Unavailable instrument resolves to 2, not to a verdict
        # THIS STEP EXISTS BECAUSE OF RUN 1 OF THIS WORKFLOW. The probe timed out
        # acquiring CDP on a cold runner (15.06s) and exited 1 — reporting "the
        # guard failed" when the truth was "the instrument was not ready"; the
        # identical job passed 66 seconds later on the pull_request event. Three
        # unavailability branches now each resolve to exit 2 (`unknown`, which
        # blocks), and this step triggers all three on purpose in ~3 seconds.
        # Raising a timeout until it stops firing would be the author grading his
        # own guard, which is what this whole branch exists to delete.
        run: node tools/verdict.mjs -- node tools/shotguard-probe.mjs --selftest-unavailable

      - name: Storage gate holds, and a normal boot still saves
        run: node tools/verdict.mjs -- node tools/shotguard-probe.mjs

      - name: The probe can fail — gate defeated on the wire, failures required
        # Inverted expectation. Without this step the step above is a guard that
        # has never failed. (`--defeat-gate` is the same defeat WITHOUT the
        # inversion and exits 1; it is for a human at a terminal, not for here.)
        run: node tools/verdict.mjs -- node tools/shotguard-probe.mjs --mutate

      - name: About changelog projects CHANGELOG.md through the real Settings route
        # #310: about-changelog validated the ordinal column and the About
        # projection but was in no workflow, so nothing ran it. Default mode parses
        # CHANGELOG.md, proves the generated projection has not drifted, and drives
        # the real Settings -> Changelog route in a browser. Lives here, not in the
        # headless `test` job, because the projection check needs a real browser.
        run: node tools/verdict.mjs -- node tools/about-changelog.mjs

      - name: The in-run Load door keeps the run on a newer slot and restarts an abandoned fight
        # Quick Menu -> Load through main.js's own confirmSlotLoad/resumeRun:
        # a newer-build slot is refused with the run still standing, and a
        # fight abandoned mid-combat reloads at turn 1 with the same HP,
        # opening hand and deck (SPEC 3.12, 9 M2).
        run: node tools/verdict.mjs -- node tools/slot-load-door.mjs

      - name: ...and that gate can fail (3 plants)
        run: node tools/verdict.mjs -- node tools/slot-load-door.mjs --selftest

  # ---------------------------------------------------------------------------
  # browser-guard's build-stamp and cold-boot checks, split off by the owner's
  # 20-minute rule (2026-10-02). Same steps, same commands; its own checkout,
  # build and browser.
  # ---------------------------------------------------------------------------
  browser-guard-stamp:
    name: the build stamp and the cold boot in a real browser
    if: github.event_name != 'pull_request' # heavy: push to test/release, or dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false # the standalone is built below
      - uses: ./.github/actions/setup-node

      - name: Build the standalone (the same build browser-guard makes)
        # Light art on dev/test (owner, 2026-09-26); release/main keep the full art.
        env:
          ART_TIER: ${{ ((github.base_ref || github.ref_name) == 'release' || (github.base_ref || github.ref_name) == 'main') && '--full-art' || '' }}
        shell: bash # $ART_TIER is an env var; Windows' default shell would not expand it
        run: node tools/verdict.mjs -- node tools/launch.mjs --build-only $ART_TIER

      - uses: ./.github/actions/which-browser

      - name: The build version is INK on the three screens he named
        # Constantine asked for the build version on the main menu, the map and in
        # combat. `buildversion --check` in the `test` job proves the STRING is
        # derived and singly-homed; that is a fact about source and it is silent
        # about whether anything is drawn. This is the other half, and it needs a
        # browser for the same reason the save guard does: the failure modes are
        # `opacity: 0` and a narrow-layout `display: none`, neither of which is
        # visible from Node.
        run: node tools/verdict.mjs -- node tools/buildstamp-shot.mjs

      - name: …and that gate can fail — six ways to lose the ink, each caught
        # Inverted expectation. Seven whole-program runs — a control and six
        # plants, each with its own served tree and its own browser — measured at
        # 64s on the machine it was written on. Stated rather than guessed,
        # because this workflow bills by the minute and runs by hand; a runner
        # will be slower and that number is not a promise about one.
        run: node tools/verdict.mjs -- node tools/buildstamp-shot.mjs --selftest

      - name: Cold boot owns and consumes the first input before Title exists
        run: node tools/verdict.mjs -- node tools/startup-gate.mjs

  # ---------------------------------------------------------------------------
  # about-changelog's known-bad corpus, sharded two ways by the owner's 20-minute
  # rule (2026-10-02). Its own checkout, build and browser per leg.
  # ---------------------------------------------------------------------------
  browser-guard-changelog:
    name: about-changelog known-bads in a real browser (${{ matrix.shard }})
    if: github.event_name != 'pull_request' # heavy: push to test/release, or dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # tests/doorplant-shard.test.mjs requires every shard of the count here.
        shard: ['0/2', '1/2']
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false # the standalone is built below
      - uses: ./.github/actions/setup-node

      - name: Build the standalone (the same build browser-guard makes)
        # Light art on dev/test (owner, 2026-09-26); release/main keep the full art.
        env:
          ART_TIER: ${{ ((github.base_ref || github.ref_name) == 'release' || (github.base_ref || github.ref_name) == 'main') && '--full-art' || '' }}
        shell: bash # $ART_TIER is an env var; Windows' default shell would not expand it
        run: node tools/verdict.mjs -- node tools/launch.mjs --build-only $ART_TIER

      - uses: ./.github/actions/which-browser

      - name: ...and that gate can fail — parser, model, and #310 ordinal plants
        # Inverted expectation. The #310 half plants four ordinal-column defects,
        # each of which must be CAUGHT — a version-shaped non-ordinal, an ordinal
        # running backward across date groups, out-of-order date groups, and a
        # receipt citing a build that does not exist yet — plus an inverted control
        # proving the legitimate shapes the shipped file already uses still parse.
        # SHARDED, NOT CUT (owner, 2026-10-02): this step took 9-17 minutes. Each
        # leg runs the copied-tree plants at index i mod 2 (a whole-repo copy and
        # a browser child each) plus every in-process corpus; together the legs
        # run every plant, each once.
        run: node tools/verdict.mjs -- node tools/about-changelog.mjs --selftest --shard ${{ matrix.shard }}

  browser-layout-guard:
    name: mobile and combat layout in a real browser
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/which-browser

      - name: Mobile Shrine, combat receipts, Settings lifecycle, and Armoury shortcut
        run: node tools/verdict.mjs -- node tools/screenreach.mjs --only 390x650

      - name: The mobile visual reach gate can fail (13 plants)
        run: node tools/verdict.mjs -- node tools/screenreach.mjs --selftest

  # ---------------------------------------------------------------------------
  # browser-layout-guard's other half, split off by the owner's 20-minute rule
  # (2026-10-02): the menus' scrollbars, the combat action row and the Armoury.
  # Same steps, same commands, in the same order they ran in that job.
  # ---------------------------------------------------------------------------
  browser-layout-hintstrip:
    name: menu scrollbars, combat action row and Armoury in a real browser
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/which-browser

      # No menu paints two scrollbars on one axis. Kept to the shape
      # the pairs actually live at — a door that fits has no bars to nest.
      - name: One scrollbar per axis in every menu
        run: node tools/verdict.mjs -- node tools/doublescroll.mjs --only 900x600

      - name: The double-scrollbar gate can fail (the defect, replanted)
        run: node tools/verdict.mjs -- node tools/doublescroll.mjs --mutate

      # -----------------------------------------------------------------------
      # #295 / D58 — THE INSTRUMENT EXISTED AND WAS IN NOBODY'S LIST.
      #
      # This is the only step in this file added because a gate stayed SILENT
      # rather than because a check was missing, and the distinction is the
      # whole point. tools/hintstrip.mjs was written on 2026-08-18 with six
      # same-door plants and a declared population. On 2026-08-20 PR #224
      # ("unify combat action row", f2acfc9) moved END TURN into an absolutely
      # positioned row that hangs into the strip's band; hintstrip went red at
      # that commit and has been red every day since. THE PR PASSED EXACT-HEAD
      # REVIEW ANYWAY, because the tool that contradicted it was in no list any
      # gate walks — the reviewer's command set is derived by hand (SOP 14 §5a,
      # family repo) and a set derived by hand is a set that can omit.
      #
      # So the defect this step answers is not the overlap. It is that a
      # rendered layout invariant with no list is an invariant only until the
      # next layout change. Vira bisected it to one commit (green c447075, red
      # f2acfc9, red at dev 001c950) and ruled the wiring the real acceptance.
      #
      # ⚠ REPORTING UNTIL #295'S LAYOUT HALF LANDS. THAT CARD OWNS THIS FINDING.
      # A standing red with no named owner stops being a signal and becomes
      # background noise, which is the state a gate does not recover from — so
      # the expiry is written here, beside the step, and it is ENFORCED rather
      # than remembered: the waiver names #295 and the step fails the moment
      # that finding changes in either direction. If you are reading this
      # because the job is red: open #295. If #295 is CLOSED, the fix has landed
      # and the step is telling you to delete the two ids above.
      #
      # ⚠ THE FINDING IS REAL AND IS NOT TO BE "FIXED" HERE.
      # H2 CLEAR fails at two of eight declared cells — 1200x730 Text XL (END
      # TURN, 3368.8 px2, 11.7% of the strip) and 1200x730 with a wide rebound
      # label (2700.3 px2, 10.1%). Both are printed on every run. The layout fix
      # is a separate act on styles/combat.css and is in progress.
      # NOTHING HERE IS TO BE RELAXED, `|| true`'d, OR MOVED TO
      # continue-on-error. Those hide a defect; the waiver above cannot, because
      # it fails when the defect goes away. See the warning at the top of this
      # file — a red means a claim in this repo is false, which is the entire
      # reason it exists.
      #
      # ⚠ THESE TWO STEPS ARE NOT A REDUNDANT PAIR, AND AN EARLIER VERSION OF
      # THIS FILE'S PR BODY CLAIMED THEY WERE. Vira's derivation, from
      # doorplant.mjs:181-186: the selftest finishes by running the tool on an
      # UNPLANTED copy and requiring it green — which IS step 1, re-run. So while
      # the tree is red, a `|| true` on step 1 leaves the job red only because
      # THE SAME CHECK FAILED TWICE; the day the layout is fixed, step 1 goes
      # green, the clean copy exits 0, step 2 goes green, and `|| true` on step 1
      # silences this gate completely. The redundancy evaporates at exactly the
      # moment it would matter, because a green tree is the only state in which a
      # regression can be introduced. THE REAL GUARD IS `tools/gatelist.mjs`,
      # wired into tests/run-node.mjs (67/68): it parses this file, and a
      # swallowed exit status here is red THERE, on a green tree, with no browser
      # and no dispatch.
      #
      # ORDER, AND IT IS THE REVERSE OF THE PAIR ABOVE, DELIBERATELY. The
      # selftest's harness (tools/doorplant.mjs) finishes by running an
      # UNPLANTED copy and requires it green — so while the tree is red the
      # selftest reports RED for the baseline, not for its plants. Running the
      # tree check first means the run's first hintstrip line names the real
      # finding (H2, with its numbers) instead of a baseline complaint a reader
      # has to decode. When the layout is fixed both go green and the order
      # stops mattering.
      # -----------------------------------------------------------------------
      # ⚠ THIS STEP WAS IN REPORTING MODE AND IS NOW BLOCKING. THE WAIVER IS
      # GONE, AND IT REMOVED ITSELF — read this before adding another one.
      #
      # This gate arrived with a known, carded, already-measured defect (#295:
      # the strip overlapped END TURN by 3368.8 px2 at Text XL and 2700.3 px2
      # under a wide rebind). Rather than land red or land relaxed, it landed
      # with a waiver WELDED TO THAT DEFECT in both directions:
      #   · a finding outside the waiver          → the step FAILS (it is new)
      #   · a WAIVED finding that has GONE AWAY   → the step FAILS ("delete the
      #                                             waiver")
      #   · the instrument cannot run             → exit 2, unknown, blocks
      # The note here read: "Removing the two ids when #295's layout half lands
      # is not optional housekeeping — the step fails until you do."
      #
      # IT DID. #295's layout half landed in the same commit as this wiring, on
      # Constantine's ruling that nothing red should ever land — and the first
      # dispatch at that head went RED with `WAIVER STALE — 2 waived finding(s)
      # are GONE`. I had fixed the defect and left the excuse behind; the machine
      # check caught it, not me and not a reviewer. That is the whole argument for
      # an expiring waiver over `|| true` or `continue-on-error`, both of which
      # sever the verdict from the tree permanently and silently: `axisfit`
      # carried "reported, never asserted" over a live bug for months precisely
      # because nothing made its excuse expire (Law 5's enforcement note).
      #
      # THE STEP IS NOW A PLAIN BLOCKING GATE with nothing waived. If a future
      # act needs a waiver here, it needs a card id and it must fail the moment
      # its findings go away — the carve-out is not a standing permission.
      - name: The combat action row's controls are clear of the cards, whole, and touch no other furniture
        # Five checks per cell over eight declared cells (two shapes x three text
        # sizes, plus a rebound-wide-label cell per shape), H4 on the wide cells;
        # a cell that stops being reached is red (H0), never absent, and the
        # number of checks made is asserted against the number owed. BOTH
        # layouts are measured: the row renders on the narrow layout (the retired
        # strip never did), and the phone cell runs under an emulated touch +
        # coarse pointer so the stylesheet's coarse-pointer rules apply. An
        # `unknown` blocks (exit 2) rather than counting toward nothing. (#527)
        run: node tools/verdict.mjs -- node tools/hintstrip.mjs

      # ---- #316's probe, wired because a probe nobody runs is the same defect
      # as a probe that prints without asserting, and this file just carried
      # BOTH within one hour. `gatelist --raw` classed it `linked-but-never-run`
      # alongside 121 other tools; that is the tree's default state and a card of
      # its own, but this one is the named regression probe for a ruling
      # Constantine made and priced, so it does not get to sit in the census
      # while the PR that ships it argues from its output.
      - name: The Armoury arrives with the figure, and one click is the whole cost
        # Two shapes, real Chromium through tools/browser.mjs's CDP path. GATED:
        # the figure arrives whole where the view declares one; CARDS arrives
        # carrying `data-collapsed='1'` on every shape; the fold round-trips; one
        # click opens the strip ABOVE THE FOLD; #305's mirror is exactly one.
        # THAT COLLAPSE CLAUSE IS DELIBERATELY NARROWER THAN IT WAS, and the old
        # wording — "CARDS arrives COLLAPSED on every shape" — was the false half.
        # The check reads the ATTRIBUTE; it never measures whether the strip is on
        # the screen. Planted a `display: block` on the collapsed strip in
        # styles/ui.css and the phone rendered the whole pane on arrival, 344x1007,
        # with `data-collapsed='1'` intact and the tool green at 21/21. A step
        # comment is a coverage claim, so it now claims the state the check holds.
        # The limit itself is printed by the tool's own boundary, every run.
        # REPORTED and deliberately not gated: stripFullyVisible, false at `dev`
        # and at head alike — a pre-existing scroll this change neither adds nor
        # removes.
        run: node tools/verdict.mjs -- node tools/armoury-arrival-figure.mjs

      # NO CAN-FAIL ARM HERE, AND I AM NAMING THE HOLE RATHER THAN IMPLYING ONE.
      # The three gates above this each have a `--selftest` / `--mutate` door.
      # This tool has none. Its two known-bads — an initially-EXPANDED CARDS pane
      # and a strip pushed below the fold — were HAND-PLANTED in the real tree,
      # observed green before the fix and red by name after, on both shapes, and
      # reverted. That is evidence in a PR body, not a gate in this file: nothing
      # here re-runs it. A `--selftest` door is the honest close and it is not
      # built. Until it is, this step proves the tree passes and proves NOTHING
      # about whether the check can still fail — which is exactly the property
      # Vira's finding above says a list cannot assume.

  # ---------------------------------------------------------------------------
  # The hint strip's known-bad corpus, sharded two ways (owner, 2026-10-02:
  # every CI job finishes in 20 minutes or less). tests/doorplant-shard.test.mjs
  # requires this matrix to list every shard of its count.
  # ---------------------------------------------------------------------------
  browser-hintstrip-plants:
    name: hint strip known-bads in a real browser (${{ matrix.shard }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['0/2', '1/2']
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/which-browser

      - name: …and that gate can fail — its known-bads, each through the real door
        # Inverted expectation, the idiom this job already uses three times.
        # One whole-program run per plant plus the unplanted clean edge (the
        # tool declares its own corpus and prints the count — a number typed
        # here would be the second home this block has been trimmed for), each
        # copying the real tree, editing it as FILE BYTES, and booting its own
        # browser: ~15 minutes for eleven plants on the Linux box it was re-aimed
        # on (#527; ~9 for the original six), 12.5-15.2 on a hosted runner. Stated
        # rather than guessed — this workflow bills by the minute and a runner
        # will be slower. SHARDED, NOT CUT (owner, 2026-10-02: every CI job
        # finishes in 20 minutes or less): each matrix leg runs the plants at
        # index i mod 2 plus its own clean edge (tools/doorplant.mjs SHARDS), so
        # the two legs together run every plant, each once.
        # NO WAIVER HERE EITHER, AND THE REASON IT USED TO NEED ONE IS GONE.
        # doorplant's corpus ends on an UNPLANTED copy that must come back GREEN.
        # While the tree carried #295's two findings, that clean edge was red for
        # the TREE's state, so the waiver was what kept this step reporting a
        # plant result rather than a baseline complaint. The tree is green now, so
        # the clean edge is green on its own merits — the stronger state, and it
        # needs no excuse. Every plant is still red by its own named finding.
        run: node tools/verdict.mjs -- node tools/hintstrip.mjs --selftest --shard ${{ matrix.shard }}

  # ---------------------------------------------------------------------------
  browser-startup-plants:
    name: startup gate known-bads in a real browser (${{ matrix.shard }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # tests/doorplant-shard.test.mjs requires every shard of the count here.
        shard: ['0/4', '1/4', '2/4', '3/4']
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/which-browser
      - name: The startup gate can fail by the same rendered door (its plants at index i mod 4)
        # This took 41-46 minutes as one step, one browser boot per plant, run
        # serially. SHARDED, NOT CUT (owner, 2026-10-02: every CI job finishes in
        # 20 minutes or less): each leg runs the plants at index i mod 4 plus its
        # own clean edge (tools/doorplant.mjs SHARDS); the four legs together run
        # every plant, each once.
        run: node tools/verdict.mjs -- node tools/startup-gate.mjs --selftest --shard ${{ matrix.shard }}

  # SOP 3 requirement 4. Always runs, including when everything above is red, so
  # the boundary is never the thing that got cut when the run went bad.
  # ---------------------------------------------------------------------------
  boundary:
    name: what this green does NOT cover
    runs-on: ubuntu-latest
    needs: [test, test-selftests, parse-gate, reproducible, reproducible-agree, browser-guard, browser-guard-stamp, browser-guard-changelog, browser-layout-guard, browser-layout-hintstrip, browser-hintstrip-plants, browser-startup-plants, display-first]
    if: always()
    steps:
      - name: Named boundary
        run: |
          echo "upstream results: test=${{ needs.test.result }} test-selftests=${{ needs['test-selftests'].result }} parse-gate=${{ needs['parse-gate'].result }} reproducible=${{ needs.reproducible.result }} reproducible-agree=${{ needs['reproducible-agree'].result }}"
          echo "  browser-guard=${{ needs['browser-guard'].result }} browser-guard-stamp=${{ needs['browser-guard-stamp'].result }} browser-guard-changelog=${{ needs['browser-guard-changelog'].result }}"
          echo "  browser-layout-guard=${{ needs['browser-layout-guard'].result }} browser-layout-hintstrip=${{ needs['browser-layout-hintstrip'].result }} browser-hintstrip-plants=${{ needs['browser-hintstrip-plants'].result }}"
          echo "  browser-startup-plants=${{ needs['browser-startup-plants'].result }} display-first=${{ needs['display-first'].result }}"
          echo ""
          echo "A GREEN RUN OF THIS WORKFLOW MEANS:"
          # Was "34 engine tests". #10 adds test 35, so the number was wrong the moment
          # this branch existed. Not corrected to 35: this job has no checkout and no
          # node, so it cannot count, and a hardcoded total in a BOUNDARY block goes
          # quietly false every time the suite grows — which is the exact failure this
          # block exists to prevent. The `test` job prints the real count.
          # — Sunna, 2026-07-28, one line in Rune's file, said out loud rather than silently.
          echo "  · the whole engine suite passes on Linux, Windows and macOS"
          echo "    (the count is printed by the suite itself in the \`test\` job, not asserted here)"
          echo "  · a rebuild changes nothing committed (buildordinal.json is this source's), on each runner"
          echo "  · the three runners build byte-identical standalones (reproducible-agree)"
          echo "  · root AshenSpire.html and dist/AshenSpire.html carry their inlined art and ARE that build"
          echo "  · no version-stamped build artifact is tracked in dist/"
          echo "  · ?shot= cannot write to localStorage, and a normal boot still can"
          echo "  · both shipped-artifact guards were shown to FAIL on a known-bad input"
          echo "  · the directory-order comparator sorts the real 40c5b21 sprites listing"
          echo "    into byte order on all three runners, and five reinstatements of the"
          echo "    collation defect were each caught by that corpus"
          echo "  · the browser probe's three UNAVAILABLE branches were each triggered and"
          echo "    each resolved to exit 2 (unknown/blocks), not to a verdict about the gate"
          echo "  · the build version has ONE home, is derived at build time rather than typed,"
          echo "    and derives the same string on all three runners — with known-bads,"
          echo "    including a tree that re-types it, each observed red by its own row"
          echo "  · that version is INK on the main menu, the map and combat, at 390x844 and"
          echo "    1200x730 — pixels, not DOM presence, with six ways to lose the ink caught"
          # #295: the first LAYOUT invariant this workflow has ever run. No count
          # and no cell list here — hintstrip declares its own population and
          # prints it, and a number typed beside the list that owns it is the
          # second-home defect this block has already been trimmed for twice.
          echo "  · the combat action row's CONTROLS (orb, piles, END TURN and its key label — the"
          echo "    contextual strip is retired on combat, #527) are clear of every card, whole, on"
          echo "    screen, and the row touches NO other combat furniture — at every cell hintstrip"
          echo "    declares, the phone cell under a coarse pointer, including one written through"
          echo "    the game's own rebind store; its known-bads are each observed red through the"
          echo "    same door. THIS IS RENDERED GEOMETRY of the controls: the row's empty gutters are"
          echo "    not furniture, and a card dipping into them touching nothing is not measured."
          echo "  · every legal left/right armament slot reaches the correct rendered side"
          echo "    of the viewer-facing figure, with all five same-door known-bads caught"
          # WAS: "...and it is the only rendered claim in this file that is about the
          # GAME's layout." TRUE when Bjorn wrote it, FALSE the moment I added the
          # Armoury step below — a second browser-driven rendered-layout claim in this
          # same job. Codex found it at `b9b3e81`, in the same act that wired the gate
          # in. A boundary that has silently stopped being true is D104 arriving from
          # the other side: there the narrowing lived only in a comment, here the
          # narrowing was real and the world moved out from under it. Same cure —
          # the claim and the coverage change in ONE act, or the green lies.
          # — Sunna, 2026-08-22, wiring the Armoury gate.
          echo "  · the Armoury arrives with the FIGURE WHOLE where a view declares one, CARDS"
          echo "    arrives COLLAPSED on every shape, and ONE click expands it to a box with"
          echo "    AREA above the fold and folds it back — at 1440x860 and 390x844, with"
          echo "    #305's single compositing mirror required as a literal transform, so a"
          echo "    mirror that is DOUBLED or GONE both fail. THIS IS RENDERED GEOMETRY."
          echo "    Its known-bads were hand-planted and are NOT re-run here: this step proves"
          echo "    the tree passes and proves NOTHING about whether the check can still fail."
          echo ""
          echo "IT DOES NOT MEAN:"
          echo "  · that the build stamp is LEGIBLE, or in the right place. The ink gate proves"
