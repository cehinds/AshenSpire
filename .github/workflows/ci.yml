# Cost-bounded CI for untrusted pull requests, merge queue candidates, and
# explicit operator runs. Feature-branch pushes are covered through their PR;
# there is deliberately no duplicate push trigger.
name: ci

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

# Untrusted PR code gets no write token, secrets, environments, OIDC, cache, or
# artifact publication. Never replace pull_request with pull_request_target.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  classify:
    name: classify trusted paths
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      full: ${{ steps.paths.outputs.full }}
      bundle: ${{ steps.paths.outputs.bundle }}
      known_bad: ${{ steps.paths.outputs.known_bad }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify repository-owned paths
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" && "$PR_DRAFT" == "true" ]]; then
            printf 'full=false\nbundle=false\nknown_bad=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf 'full=true\nbundle=true\nknown_bad=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            base="$GROUP_BASE"
            head="$GROUP_HEAD"
          else
            base="$PR_BASE"
            head="$PR_HEAD"
          fi
          git cat-file -e "${base}^{commit}"
          git cat-file -e "${head}^{commit}"
          mapfile -t changed < <(git diff --name-only "$base" "$head")

          bundle=false
          known_bad=false
          for path in "${changed[@]}"; do
            case "$path" in
              index.html|AshenSpire.html|.gitattributes|.github/workflows/ci.yml|src/*|styles/*|content/*|tools/*|build/*|dist/*)
                bundle=true ;;
            esac
            case "$path" in
              .github/workflows/ci.yml|tools/tutorial-reach.mjs|tools/zoomplace.mjs|tools/placement.mjs|tools/doorplant.mjs|tools/browser.mjs|tools/bundle.mjs|tools/launch.mjs|src/ui/components/tutorial.js|src/ui/components/quicknav.js|src/ui/components/flask.js|styles/ui.css|src/ui/fx.js)
                known_bad=true ;;
            esac
          done
          # A merge queue candidate must validate its final combined artifact.
          [[ "$EVENT_NAME" == "merge_group" ]] && bundle=true
          printf 'full=true\nbundle=%s\nknown_bad=%s\n' "$bundle" "$known_bad" >> "$GITHUB_OUTPUT"

  test:
    name: tests and artifact (${{ matrix.os }})
    needs: classify
    if: ${{ needs.classify.outputs.full == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Keep checked-out bytes identical
        run: git config --global core.autocrlf false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false
          package-manager-cache: false
      - name: Engine suite
        run: node tests/run-node.mjs
      - name: Shipped-artifact known-bad corpus
        run: node tools/verify-shipped.mjs --selftest
      - name: Directory-order corpus
        run: node tools/dirorder.mjs --selftest
      - name: Directory-order mutations
        run: node tools/dirorder.mjs --mutate
      - name: Single derived version
        run: node tools/buildversion.mjs --check
      - name: Version known-bads
        run: node tools/buildversion.mjs --selftest
      # These stay visible even if an earlier engine/guard step is red; merging
      # the former two matrices must not silently lose artifact evidence.
      - name: Rebuild standalone and aliases
        if: always()
        run: node tools/launch.mjs --build-only
      - name: Root and dist are the build
        if: always()
        run: node tools/verify-shipped.mjs
      - name: Committed artifact equals this runner's build
        if: always()
        shell: bash
        run: |
          git --no-pager diff --stat -- AshenSpire.html build dist
          git diff --exit-code -- AshenSpire.html build dist

  source-browser:
    name: source browser gates
    needs: classify
    if: ${{ needs.classify.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false
          package-manager-cache: false
      - name: Browser inventory
        shell: bash
        run: |
          found=false
          for p in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [[ -x "$p" ]]; then found=true; echo "found: $p"; "$p" --version; fi
          done
          [[ "$found" == true ]]
      - name: Unavailable browser is unknown and blocks
        run: node tools/shotguard-probe.mjs --selftest-unavailable
      - name: Storage gate
        run: node tools/shotguard-probe.mjs
      - name: Storage known-bad
        run: node tools/shotguard-probe.mjs --mutate
      - name: Build version is ink
        run: node tools/buildstamp-shot.mjs
      - name: Build-version ink known-bads
        run: node tools/buildstamp-shot.mjs --selftest
      - name: Tutorial source route
        run: node tools/tutorial-reach.mjs
      - name: Existing anchored-placement contract
        run: node tools/placement.mjs
      - name: Zoom placement source route
        run: node tools/zoomplace.mjs

  bundle-browser:
    name: shipped bundle browser gates
    needs: classify
    if: ${{ needs.classify.outputs.full == 'true' && needs.classify.outputs.bundle == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false
          package-manager-cache: false
      - name: Build the exact bundle under test
        run: node tools/launch.mjs --build-only
      - name: Tutorial shipped-bundle route
        run: node tools/tutorial-reach.mjs --dist
      - name: Zoom placement shipped-bundle route
        run: node tools/zoomplace.mjs --dist

  known-bads:
    name: browser probes observe known-bad red
    needs: classify
    if: ${{ needs.classify.outputs.full == 'true' && needs.classify.outputs.known_bad == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false
          package-manager-cache: false
      - name: Tutorial source known-bads
        run: node tools/tutorial-reach.mjs --selftest
      - name: Tutorial bundle known-bads
        run: node tools/tutorial-reach.mjs --selftest --dist
      - name: Existing anchored-placement known-bads
        run: node tools/placement.mjs --selftest
      - name: Zoom source known-bad
        run: node tools/zoomplace.mjs --selftest
      - name: Zoom bundle known-bad
        run: node tools/zoomplace.mjs --selftest --dist

  boundary:
    name: required CI result
    needs: [classify, test, source-browser, bundle-browser, known-bads]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce required results and print boundary
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FULL: ${{ needs.classify.outputs.full }}
          BUNDLE: ${{ needs.classify.outputs.bundle }}
          KNOWN_BAD: ${{ needs.classify.outputs.known_bad }}
          TEST_RESULT: ${{ needs.test.result }}
          SOURCE_RESULT: ${{ needs.source-browser.result }}
          BUNDLE_RESULT: ${{ needs.bundle-browser.result }}
          KNOWN_BAD_RESULT: ${{ needs.known-bads.result }}
        run: |
          set -euo pipefail
          printf 'results: classify=%s test=%s source=%s bundle=%s known-bad=%s\n' \
            "$CLASSIFY_RESULT" "$TEST_RESULT" "$SOURCE_RESULT" "$BUNDLE_RESULT" "$KNOWN_BAD_RESULT"
          [[ "$CLASSIFY_RESULT" == success ]]
          if [[ "$FULL" == true ]]; then
            [[ "$TEST_RESULT" == success && "$SOURCE_RESULT" == success ]]
            [[ "$BUNDLE" != true || "$BUNDLE_RESULT" == success ]]
            [[ "$KNOWN_BAD" != true || "$KNOWN_BAD_RESULT" == success ]]
          fi
          echo 'GREEN means engine + artifact checks passed on Linux, Windows, and macOS;'
          echo 'source browser gates passed; relevant shipped-bundle gates passed; and changed'
          echo 'probe doors observed their known-bads red. Draft PRs intentionally classify only.'
          echo 'It does not approve merge or release, judge UX/legibility/balance/content, test'
          echo 'non-Chromium browsers, touch/gamepad/co-op, or replace human review lenses.'
