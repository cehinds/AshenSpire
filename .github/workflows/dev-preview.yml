name: dev preview

# GitHub Pages serves `main`, so `dev` has no hosted URL. This workflow gives
# every push to `dev` (and every PR targeting it) an inspectable artifact of the
# playable build at that exact commit, without deploying or publishing anything.
#
# It is deliberately NOT a deployment: it publishes nothing and touches no ref.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, 'feature/Gameplay/**']
  workflow_dispatch:

concurrency:
  group: dev-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: ./.github/actions/setup-node

      - name: Collect the playable build
        run: |
          set -euo pipefail
          mkdir -p preview
          node tools/readiness-preview-build.mjs preview
          mkdir -p preview/art/readiness-poses
          cp -r art/readiness-poses/inspection preview/art/readiness-poses/inspection
          # TWO SHAPES, AND THE ROOT IS THE FAST ONE.
          #
          # preview/     the de-inlined build: 4.9 MB of HTML beside the art,
          #              which arrives per screen and stays in the browser
          #              cache. This is what a phone should open, and it is
          #              uploaded as the dev-preview artifact.
          # standalone/  the consolidated single file, every asset inlined.
          #              Needs no server — double-click it. Uploaded as its
          #              OWN artifact, dev-standalone; see the upload steps.
          #
          # The root used to be the single file, so opening the preview on a
          # phone meant 57.6 MB before the first frame. --external-art writes
          # AshenSpire.html plus assets/ and map-detail/ into preview/ in one
          # pass, so the copies that used to place those by hand are gone with it.
          node tools/bundle.mjs --external-art --out preview
          cp preview/AshenSpire.html preview/index.html
          # The standalone is uploaded as its OWN artifact rather than nested
          # here — see the two upload steps below for why.
          mkdir -p standalone
          cp AshenSpire.html standalone/AshenSpire.html
          cp AshenSpire-mobile.html standalone/AshenSpire-mobile.html
          mkdir -p preview/art/combat-effects-2026-09-07 preview/assets
          cp -r src preview/src
          cp world-atlas-preview.html preview/
          cp equipment-selection-preview.html preview/
          cp armament-kits-preview.html preview/
          cp tools/serve-preview.mjs preview/serve-preview.mjs
          cp -r styles preview/styles
          cp -r assets/environments preview/assets/
          mkdir -p preview/docs/preview
          cp -r docs/preview/world-atlas preview/docs/preview/
          cp -r docs/preview/combat-ground preview/docs/preview/
          cp -r docs/preview/combat-formation preview/docs/preview/
          cp -r docs/preview/starting-equipment preview/docs/preview/
          cp -r docs/preview/armament-kits preview/docs/preview/
          cp -r pose-studio preview/pose-studio
          cp -r assets/pose-effects preview/assets/
          cp -r art/pose-studio preview/art/
          cp -r art/card-effect-refresh-2026-09-09 preview/art/
          cp -r assets/combat-effects assets/painted-outfits preview/assets/
          cp art/combat-effects-2026-09-07/index.html art/combat-effects-2026-09-07/sprite-catalog.html art/combat-effects-2026-09-07/integrated-tag-mappings.html preview/art/combat-effects-2026-09-07/
          cp -r art/combat-effects-2026-09-07/inspection preview/art/combat-effects-2026-09-07/inspection
          {
            echo "AshenSpire dev preview"
            echo "commit:   ${GITHUB_SHA}"
            echo "ref:      ${GITHUB_REF}"
            echo "built:    $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Open AshenSpire.html locally to play this exact commit."
            echo "For the equipment review, run node serve-preview.mjs in this folder."
            echo "Then open http://127.0.0.1:8318/equipment-selection-preview.html."
            echo "For all 25 armament kits and disposable combat, open http://127.0.0.1:8318/armament-kits-preview.html."
            echo "Use its class and screen-size controls to test hand choices and Continue."
            echo "Equipment screenshots and QA: docs/preview/starting-equipment/index.html."
            echo "Run node pose-studio/server.mjs for the standalone editor at http://127.0.0.1:4318."
            echo "Open Combat-pose-preview.html for the offline readiness outfit gallery."
            echo "Open docs/preview/combat-formation/index.html for turn and formation comparisons."
            echo "Open docs/preview/combat-ground/index.html for all 20 combat fields and phone screenshots."
            echo "Open art/combat-effects-2026-09-07/sprite-catalog.html for all 56 six-frame sets."
            echo "For the interactive card preview, serve this folder over HTTP and open"
            echo "art/combat-effects-2026-09-07/index.html?integrated=1."
            echo "Card/tag assignments and screenshots are in the same art folder."
            echo
            echo "This folder is the DE-INLINED build: serve it and open AshenSpire.html"
            echo "(or run serve-preview.mjs). It needs a server. For the double-clickable"
            echo "single file that needs none, download the dev-standalone artifact from"
            echo "this same run: AshenSpire.html is the full game (~250 MB) and"
            echo "AshenSpire-mobile.html the same build with its art shrunk under 50 MB."
            echo
            echo "This is an inspection artifact, not a deployment. Pages serves main;"
            echo "dev has no hosted URL."
          } > preview/README.txt
          echo "collected $(find preview -type f | wc -l) files"

      # AFTER "Collect the playable build", BECAUSE THAT STEP CREATES preview/.
      # These sat before it on the first cut and CI went red with "no build at
      # preview/AshenSpire.html" — the gate refusing a directory that did not
      # exist yet, which is the right behaviour and the wrong placement.
      #
      # The de-inlined build's art is on disk, not in the HTML, so the guard
      # that reads the shipped file cannot see it. verify-shipped.mjs still
      # covers the single file (its art is inside it, and nothing here changed
      # that); these cover the other shape. Both defects this build actually
      # had — CSS urls rebased to `../../assets/…`, and map-detail never copied
      # — were green on disk, which is why the browser-smoke job carries a
      # third check rather than these two standing alone.
      - name: The de-inlined build carries every asset it will ask for
        run: node tools/verdict.mjs -- node tools/verify-external.mjs --dir preview

      # TWO ARTIFACTS, NOT ONE FOLDER INSIDE ANOTHER.
      #
      # MEASURED on this tree, as downloads — the zipped sizes GitHub actually
      # serves, not the bytes on disk:
      #
      #   one artifact, standalone nested        ~191 MB
      #   dev-preview-<sha>                      ~152 MB
      #   dev-standalone-<sha>                    ~39 MB
      #
      # The split is not a saving for someone who wanted the preview anyway.
      # It is the whole download for someone who wanted the other thing: the
      # double-clickable file was 39 MB of a 191 MB download, and there was no
      # way to ask for only it. Now there is.
      #
      # They stay two DOWNLOADS of one build, not two builds: both come from
      # the same commit in the same job, and the standalone is the same
      # AshenSpire.html that verify-shipped.mjs has already proven is this
      # source. Naming the sha in both makes that visible at the download.
      - uses: actions/upload-artifact@v4
        with:
          name: dev-preview-${{ github.sha }}
          path: preview/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: dev-standalone-${{ github.sha }}
          path: standalone/
          retention-days: 14

  # THE BROWSER SMOKE: the de-inlined build boots, plays and fetches its art
  # over the wire, and a cold boot owns the first input before Title exists.
  # Linux only, one runner, no plant/--selftest arms.
  browser-smoke:
    name: browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/which-browser

      # It builds its own copy because this job does not share a filesystem
      # with `preview`, and the build is cheap without the inlined base64.
      - name: The de-inlined build plays, and its art arrives over the wire
        run: |
          node tools/bundle.mjs --external-art --out build/web
          node tools/verdict.mjs -- node tools/external-play.mjs --dir build/web

      - name: Cold boot owns and consumes the first input before Title exists
        run: node tools/verdict.mjs -- node tools/startup-gate.mjs

      - name: Capture the pose studio on desktop and phone
        run: node tools/pose-studio-capture.mjs --out "${{ runner.temp }}/pose-studio-evidence"

      - uses: actions/upload-artifact@v4
        with:
          name: pose-studio-screenshots
          path: ${{ runner.temp }}/pose-studio-evidence/
          retention-days: 14
