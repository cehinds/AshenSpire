name: dev preview

# GitHub Pages serves `main`, so `dev` has no hosted URL. This workflow gives
# every push to `dev` (and every PR targeting it) an inspectable artifact of the
# playable build at that exact commit, without deploying or publishing anything.
#
# It is deliberately NOT a deployment: it publishes nothing and touches no ref.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: dev-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Combat formations and painted ground
        run: node --test tests/combat-formation.test.mjs tests/environment-art.test.mjs tests/map-detail.test.mjs tests/map-presentation.test.mjs tests/local-map.test.mjs

      - name: World Journey normalized data and seeded routes
        run: node tests/world-atlas.test.mjs

      # #498: 28 plant sites had drifted and only one gate went red — the rest
      # stayed green while unable to fail. This cheap static detector (no
      # execution, no browser, <1s) runs on every PR: any NEW drifted
      # find-string fails here the day the refactor lands, and the checked-in
      # baseline holds the known backlog to exactly itself.
      # THE DE-INLINED BUILD'S ART IS ON DISK, NOT IN THE HTML — so the guard
      # that reads the shipped file cannot see it. verify-shipped.mjs still
      # covers the single file (its art is inside it and nothing here changed
      # that); these two cover the other shape, and they cover it at two
      # depths because a disk check and a browser disagree about what "present"
      # means. Both defects this build actually had — CSS urls rebased to
      # `../../assets/…`, and map-detail never copied — were green on disk.
      - name: The de-inlined build carries every asset it will ask for
        run: node tools/verdict.mjs -- node tools/verify-external.mjs --dir preview
      - name: That gate still catches its own known-bads
        run: node tools/verdict.mjs -- node tools/verify-external.mjs --selftest

      - name: No plant site has drifted beyond the recorded baseline
        run: node tools/plantsites.mjs --check

      # THE ARTIFACT-IDENTITY GATES, AND WHY THEY BELONG HERE RATHER THAN IN
      # THE DISPATCH-ONLY LANE.
      #
      # `dev` went red on these three times on 2026-09-03 — after #575, after
      # #580's merge, and after the #588/#589/#591/#592 batch — and each time
      # the artifact a player is handed was not this source. The third was the
      # worst: build/AshenSpire.html carried two modules that no longer existed
      # in the tree at all.
      #
      # EVERY ONE OF THOSE PULL REQUESTS WAS GREEN ON ITS OWN BRANCH, because
      # the branch rebuilt. A `pull_request` run checks out `refs/pull/N/merge`,
      # so it does test a merge — but the merge against the base AS IT STOOD
      # THEN. Two PRs both green against base X, A merges, and B's green now
      # describes a tree that no longer exists. The tree produced by merging
      # them is the one nobody built, and until now nothing looked at it.
      #
      # The `push: branches: [dev]` half of this workflow is that missing look:
      # it runs on the real post-merge result. It does not PREVENT the drift —
      # preventing it means rebuilding as part of merging, which is a change to
      # how merges are done and not this file's to make — but it turns "found a
      # day later by a seat running a tool by hand" into "red within a minute,
      # on dev, by name".
      #
      # Same reasoning as the plant-site detector above, and the same budget:
      # both are pure reads, no execution and no browser, well under a second,
      # on the runner this job already pays for. The 3-OS matrix in ci.yml stays
      # dispatch-only; nothing here re-enables it or spends a Windows minute.
      - name: Current builds use the 0.6.x.x release series
        run: node tools/release-series.mjs
      - name: Release series gate rejects older and malformed versions
        run: node tools/release-series.mjs --selftest

      - name: The shipped artifact is this source, and the number on it is ours
        run: node tools/buildversion.mjs --check

      - name: The file a player is handed matches the tree that claims it
        run: node tools/verify-shipped.mjs

      # Same budget as the gates above: a pure read, no execution, no browser,
      # well under a second, on the runner this job already pays for. It walks
      # every in-tree module regardless of who imports it, so a rename that
      # leaves one dangling import is red here rather than at runtime.
      #
      # NOT HERE, and the reason is measured rather than assumed: the check that
      # the in-game changelog matches CHANGELOG.md (tools/about-changelog.mjs
      # --check) would be the natural companion, and I put it here first. It
      # SERVES THE TREE AND DRIVES A BROWSER — it exits 127 with no Chrome on
      # PATH, and it took this job red doing exactly that. It stays in ci.yml,
      # under the verdict door, where a browser exists. This lane's rule is not
      # "cheap-looking"; it is no browser, and that tool needs one.
      - name: Every named import in the tree resolves against a real export
        run: node tools/linkcheck.mjs --check

      - name: Combat effect tags, outcomes, and character outlines
        run: node --test tests/combatEffects.test.mjs tests/combatEffectIntegration.test.mjs tests/combatAnimation.test.mjs tests/combatAura.test.mjs tests/combatPose.test.mjs

      - name: Pose studio project schema and event bindings
        run: node --test pose-studio/tests/model.test.mjs

      - name: Collect the playable build
        run: |
          set -euo pipefail
          mkdir -p preview
          node tools/readiness-preview-build.mjs preview
          mkdir -p preview/art/readiness-poses
          cp -r art/readiness-poses/inspection preview/art/readiness-poses/inspection
          # TWO SHAPES, AND THE ROOT IS THE FAST ONE.
          #
          # preview/            the de-inlined build: 4.9 MB of HTML beside the
          #                     art, which arrives per screen and stays in the
          #                     browser cache. This is what a phone should open.
          # preview/standalone/ the consolidated single file, 57.6 MB, every
          #                     asset inlined. Needs no server — double-click it.
          #
          # The root used to be the single file, so opening the preview on a
          # phone meant 57.6 MB before the first frame. --external-art writes
          # AshenSpire.html plus assets/ and map-detail/ into preview/ in one
          # pass, so the copies that used to place those by hand are gone with it.
          node tools/bundle.mjs --external-art --out preview
          cp preview/AshenSpire.html preview/index.html
          mkdir -p preview/standalone
          cp AshenSpire.html preview/standalone/AshenSpire.html
          mkdir -p preview/art/combat-effects-2026-09-07 preview/assets
          cp -r src preview/src
          cp world-atlas-preview.html preview/
          cp equipment-selection-preview.html preview/
          cp tools/serve-preview.mjs preview/serve-preview.mjs
          cp -r styles preview/styles
          cp -r assets/environments preview/assets/
          mkdir -p preview/docs/preview
          cp -r docs/preview/world-atlas preview/docs/preview/
          cp -r docs/preview/combat-ground preview/docs/preview/
          cp -r docs/preview/combat-formation preview/docs/preview/
          cp -r docs/preview/starting-equipment preview/docs/preview/
          cp -r pose-studio preview/pose-studio
          cp -r assets/pose-effects preview/assets/
          cp -r art/pose-studio preview/art/
          cp -r art/card-effect-refresh-2026-09-09 preview/art/
          cp -r assets/combat-effects assets/painted-outfits preview/assets/
          cp art/combat-effects-2026-09-07/index.html art/combat-effects-2026-09-07/sprite-catalog.html art/combat-effects-2026-09-07/integrated-tag-mappings.html preview/art/combat-effects-2026-09-07/
          cp -r art/combat-effects-2026-09-07/inspection preview/art/combat-effects-2026-09-07/inspection
          {
            echo "AshenSpire dev preview"
            echo "commit:   ${GITHUB_SHA}"
            echo "ref:      ${GITHUB_REF}"
            echo "built:    $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Open AshenSpire.html locally to play this exact commit."
            echo "For the equipment review, run node serve-preview.mjs in this folder."
            echo "Then open http://127.0.0.1:8318/equipment-selection-preview.html."
            echo "Use its class and screen-size controls to test hand choices and Continue."
            echo "Equipment screenshots and QA: docs/preview/starting-equipment/index.html."
            echo "Run node pose-studio/server.mjs for the standalone editor at http://127.0.0.1:4318."
            echo "Open Combat-pose-preview.html for the offline readiness outfit gallery."
            echo "Open docs/preview/combat-formation/index.html for turn and formation comparisons."
            echo "Open docs/preview/combat-ground/index.html for all 20 combat fields and phone screenshots."
            echo "Open art/combat-effects-2026-09-07/sprite-catalog.html for all 56 six-frame sets."
            echo "For the interactive card preview, serve this folder over HTTP and open"
            echo "art/combat-effects-2026-09-07/index.html?integrated=1."
            echo "Card/tag assignments and screenshots are in the same art folder."
            echo
            echo "This is an inspection artifact, not a deployment. Pages serves main;"
            echo "dev has no hosted URL."
          } > preview/README.txt
          echo "collected $(find preview -type f | wc -l) files"

      - uses: actions/upload-artifact@v4
        with:
          name: dev-preview-${{ github.sha }}
          path: preview/
          retention-days: 14

  # THE BROWSER GATES THAT NOTHING RAN ON `dev`, AND WHAT THAT COST.
  #
  # PROPOSED, not adopted — this job is the subject of its own pull request and
  # is here to be measured and accepted or rejected, not to be assumed.
  #
  # The gap it closes was paid for on 2026-09-07. #720 landed a reachability
  # regression on `dev`: at a Safari-like 390x650 phone, four combat hand cards
  # cover one another. `screenreach` catches it in 32 seconds — but `screenreach`
  # runs only in ci.yml, which is `workflow_dispatch` only, and the job above
  # runs no browser at all. So #720 merged green, promoted to `test` green, and
  # the regression was invisible at every gate it met. It surfaced two hours and
  # two promotions later, on a hand-dispatched matrix opened for a RELEASE — the
  # last place a defect should first be seen rather than the first.
  #
  # WHY THE GATES AND NOT THEIR SELFTESTS. Each of these tools has a `--selftest`
  # arm that plants known-bads and requires the named red. Those arms are what
  # prove the gate can fail, and they are also almost all of the cost: in ci.yml
  # run 321 the four gates below took 79s between them, while the plant arms in
  # the same job took over 19 minutes — `startup-gate --selftest` alone ran 14m43s
  # for its eighteen plants. Proving a gate can fail is a property of the gate,
  # which changes when the gate changes; measuring the tree is a property of the
  # commit. So the plant arms stay in the dispatched matrix where their cost is
  # deliberate, and the measurements move here where the regressions are.
  #
  # THIS IS NOT A SUBSTITUTE FOR THE MATRIX. Linux only, one runner, no Windows
  # (2x) and no macOS (10x); it proves nothing about cross-platform behaviour or
  # about the gates' own ability to fail. It is the cheapest thing that would
  # have caught #720 on the day it landed.
  #
  # COST: one ubuntu-latest runner, roughly 2 minutes, per push to `dev` and per
  # pull request targeting it — measured from run 321's own step timings:
  #   hand-side-probe            9s
  #   shotguard-probe           26s
  #   startup-gate              72s
  #   screenreach --only         32s
  # plus checkout and node setup. Against that: #720's regression sat undetected
  # across two promotions and cost three dispatched 3-OS matrices to find.
  browser-gates:
    name: the reachability gates a phone would fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Which browser will be used
        run: |
          for p in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            [ -x "$p" ] && echo "found: $p" && "$p" --version
          done
          echo "(the probes exit 2 if none exists — unknown, which blocks)"

      # THE DE-INLINED BUILD, LOADED RATHER THAN INSPECTED. It builds its own
      # copy because this job does not share a filesystem with `preview`, and
      # the build is cheap without the 52.8 MB of base64 the single file carries.
      - name: The de-inlined build plays, and its art arrives over the wire
        run: |
          node tools/bundle.mjs --external-art --out build/web
          node tools/verdict.mjs -- node tools/external-play.mjs --dir build/web

      - name: Hand-side placement reaches the correct rendered side
        run: node tools/verdict.mjs -- node tools/hand-side-probe.mjs

      - name: Storage gate holds, and a normal boot still saves
        run: node tools/verdict.mjs -- node tools/shotguard-probe.mjs

      - name: Cold boot owns and consumes the first input before Title exists
        run: node tools/verdict.mjs -- node tools/startup-gate.mjs

      # SCREENREACH IS DELIBERATELY NOT HERE, AND THIS IS THE RETRACTION OF MY
      # OWN STEP RATHER THAN A GATE BEING SWITCHED OFF.
      #
      # It was added alongside the three above and was the reason this job was
      # proposed at all: it was the gate that caught #720's card overlap. Then
      # it was measured, and the measurement did not support the step.
      #
      # `screenreach` decides "covered" by hit-testing a control's GEOMETRIC
      # CENTRE. Two of its three findings at 390x650 are that test meeting
      # deliberate design rather than a defect:
      #
      #   · the combat hand is a FAN. Cards overlap on purpose. Measured on
      #     `dev`, four of five hand cards report their centre covered by the
      #     NEXT CARD'S `.ctype` badge, while 27 of 81 sampled points on each
      #     card still hit that card — a third of every card exposed, which is
      #     what a fan looks like. The fifth card is 81/81. #720 widened cards
      #     to 157px on a 390px viewport, which moved the centres under the
      #     neighbour; it did not make the hand unusable.
      #   · the creation view toggle is a section header that comes to rest
      #     straddling a scrolling container's clip edge, so its centre lands
      #     0.35px inside `.modal-foot`. `scrollIntoView` puts it fully in view
      #     and the hit test then returns the control itself. The gate already
      #     calls five fully-scrolled-out controls on that same screen "fine";
      #     this one is half-scrolled and called covered.
      #
      # So the step went red on every push to `dev` AND every pull request into
      # it, on all of the work other people had in flight, for a reading the
      # measurements do not support. A standing red that everyone learns to
      # scroll past is worse than the silence this job was meant to end.
      #
      # WHAT WAS NOT DONE. `screenreach` itself is untouched and still runs in
      # ci.yml exactly as before, plants and all — no gate lost any coverage,
      # and nothing was skipped, disabled or quarantined to get a tree green.
      # The three steps above stay because they are green, fast and sound; they
      # were never the problem.
      #
      # WHAT WOULD BRING IT BACK. `screenreach` classifying a control as
      # reachable when a usable region of it is hittable, rather than only its
      # centre pixel — at which point it belongs here, because the #720 card
      # overlap it found is real and the fan is not the whole of it.

      - name: Capture the pose studio on desktop and phone
        run: node tools/pose-studio-capture.mjs --out "${{ runner.temp }}/pose-studio-evidence"

      - uses: actions/upload-artifact@v4
        with:
          name: pose-studio-screenshots
          path: ${{ runner.temp }}/pose-studio-evidence/
          retention-days: 14
