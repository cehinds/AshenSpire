name: Owner scheduler state reconciliation authority
description: Record one exact, no-refill scheduler-state reconciliation authority.
title: "[decision] AS-1001 scheduler state reconciliation "
labels: ["owner-command"]
body:
  - type: markdown
    attributes:
      value: |
        This form records one exact scheduler-state reconciliation authority request.

        Submitting it **only records authority**. It does not acquire or release
        custody, mutate a work lease, dispatch work, refill a seat, mutate a Git
        ref, or retry stale intent. The reconciler must revalidate every guard.

  - type: dropdown
    id: request_schema
    attributes:
      label: Request schema
      description: "Required constant: agentops/scheduler-state-reconciliation-authority/v1."
      options:
        - agentops/scheduler-state-reconciliation-authority/v1
    validations:
      required: true

  - type: dropdown
    id: action
    attributes:
      label: Action
      description: "Required constant: authorize-scheduler-state-reconciliation."
      options:
        - authorize-scheduler-state-reconciliation
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: Target ticket
      description: "Required ticket this authority is recorded against."
      placeholder: AS-1001
    validations:
      required: true

  - type: input
    id: expected_current_hash
    attributes:
      label: Expected current hash
      description: "Required compare-and-swap hash: sha256: followed by 64 lowercase hexadecimal characters."
      placeholder: "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    validations:
      required: true

  - type: input
    id: candidate_oid
    attributes:
      label: Candidate OID
      description: "Required exact reconciler commit; 40 lowercase hexadecimal characters. Must equal Reconciler head."
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true

  - type: input
    id: reconciler_head
    attributes:
      label: Reconciler head
      description: "Required exact reviewed reconciler commit; 40 lowercase hexadecimal characters."
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true

  - type: input
    id: reconciler_tree
    attributes:
      label: Reconciler tree
      description: "Required exact reviewed reconciler tree; 40 lowercase hexadecimal characters."
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true

  - type: input
    id: source_state_oid
    attributes:
      label: Source state OID
      description: "Required exact source scheduler-state commit; 40 lowercase hexadecimal characters."
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true

  - type: input
    id: source_state_tree
    attributes:
      label: Source state tree
      description: "Required exact source scheduler-state tree; 40 lowercase hexadecimal characters."
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true

  - type: input
    id: source_snapshot_sha256
    attributes:
      label: Source snapshot SHA-256
      description: "Required SHA-256 of the source snapshot.json; 64 lowercase hexadecimal characters."
      placeholder: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    validations:
      required: true

  - type: input
    id: source_journal_manifest_sha256
    attributes:
      label: Source journal manifest SHA-256
      description: "Required SHA-256 of the source journal manifest; 64 lowercase hexadecimal characters."
      placeholder: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    validations:
      required: true

  - type: input
    id: source_event_count
    attributes:
      label: Source event count
      description: "Required non-negative base-10 source event count."
      placeholder: "51"
    validations:
      required: true

  - type: input
    id: source_state_version
    attributes:
      label: Source state version
      description: "Required non-negative base-10 source scheduler-state version."
      placeholder: "1"
    validations:
      required: true

  - type: input
    id: canonical_anchor_oid
    attributes:
      label: Canonical anchor OID
      description: "Required exact canonical anchor commit; 40 lowercase hexadecimal characters."
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true

  - type: input
    id: target_state_oid
    attributes:
      label: Target state OID
      description: "Required exact planned target scheduler-state commit; 40 lowercase hexadecimal characters."
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true

  - type: input
    id: target_state_tree
    attributes:
      label: Target state tree
      description: "Required exact planned target scheduler-state tree; 40 lowercase hexadecimal characters."
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true

  - type: input
    id: target_snapshot_sha256
    attributes:
      label: Target snapshot SHA-256
      description: "Required SHA-256 of the planned target snapshot.json; 64 lowercase hexadecimal characters."
      placeholder: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    validations:
      required: true

  - type: input
    id: target_journal_manifest_sha256
    attributes:
      label: Target journal manifest SHA-256
      description: "Required SHA-256 of the planned target journal manifest; 64 lowercase hexadecimal characters."
      placeholder: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    validations:
      required: true

  - type: input
    id: target_event_count
    attributes:
      label: Target event count
      description: "Required non-negative base-10 planned target event count."
      placeholder: "52"
    validations:
      required: true

  - type: input
    id: machine_lease
    attributes:
      label: Machine lease
      description: "Required canonical one-line JSON object with exactly machine_id, lease_epoch, acquired_at, released_at, expires_at, and expected_state_ref_oid."
      placeholder: '{"machine_id":null,"lease_epoch":8,"acquired_at":"2026-08-31T16:41:13.342Z","released_at":"2026-08-31T17:05:45.172Z","expires_at":"2026-08-31T17:05:45.172Z","expected_state_ref_oid":"0123456789abcdef0123456789abcdef01234567"}'
    validations:
      required: true

  - type: input
    id: work_leases
    attributes:
      label: Work leases
      description: "Required canonical one-line JSON array. Each closed object has exactly issue_id, state, assigned_actor, assignment_kind, lease_id, lease_epoch, lease_expiry, lease_machine_id, and base_commit."
      placeholder: '[]'
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      description: "Required constant: release-custody-and-reconcile-work-leases."
      options:
        - release-custody-and-reconcile-work-leases
    validations:
      required: true

  - type: input
    id: not_before
    attributes:
      label: Not before
      description: "Required strict UTC lower bound with seconds and optional milliseconds."
      placeholder: 2026-08-31T17:05:45.172Z
    validations:
      required: true

  - type: input
    id: quiet_window_receipt_hash
    attributes:
      label: Quiet window receipt hash
      description: "Required exact quiet-window receipt hash; 64 lowercase hexadecimal characters."
      placeholder: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    validations:
      required: true

  - type: input
    id: expected_event_count_delta
    attributes:
      label: Expected event count delta
      description: "Required non-negative base-10 planned event-count delta."
      placeholder: "1"
    validations:
      required: true

  - type: dropdown
    id: dispatch_frozen
    attributes:
      label: Dispatch frozen
      description: "Required constant: true."
      options:
        - "true"
    validations:
      required: true

  - type: dropdown
    id: no_refill
    attributes:
      label: No refill
      description: "Required constant: true."
      options:
        - "true"
    validations:
      required: true

  - type: dropdown
    id: no_assignment
    attributes:
      label: No assignment
      description: "Required constant: true."
      options:
        - "true"
    validations:
      required: true

  - type: dropdown
    id: no_dispatch
    attributes:
      label: No dispatch
      description: "Required constant: true."
      options:
        - "true"
    validations:
      required: true

  - type: dropdown
    id: no_external_mutation
    attributes:
      label: No external mutation
      description: "Required constant: true."
      options:
        - "true"
    validations:
      required: true

  - type: dropdown
    id: one_use
    attributes:
      label: One use
      description: "Required constant: true."
      options:
        - "true"
    validations:
      required: true

  - type: input
    id: expires_at
    attributes:
      label: Expires at
      description: "Required strict future UTC expiry with seconds and optional milliseconds."
      placeholder: 2026-09-01T15:10:17Z
    validations:
      required: true

  - type: dropdown
    id: target_ref
    attributes:
      label: Target ref
      description: "Required constant: refs/heads/agentops/scheduler-state."
      options:
        - refs/heads/agentops/scheduler-state
    validations:
      required: true

  - type: input
    id: expected_remote_oid
    attributes:
      label: Expected remote OID
      description: "Required exact remote target-ref OID; 40 lowercase hexadecimal characters."
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true

  - type: dropdown
    id: push_mode
    attributes:
      label: Push mode
      description: "Required constant: non-force-forward-only-cas."
      options:
        - non-force-forward-only-cas
    validations:
      required: true

  - type: dropdown
    id: abort_on_remote_change
    attributes:
      label: Abort on remote change
      description: "Required constant: true."
      options:
        - "true"
    validations:
      required: true
