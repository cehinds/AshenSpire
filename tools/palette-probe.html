<!-- tools/palette-probe.html — is the armour-separation metric measuring what it claims?
     Run:  bash tools/palette-check.sh
     Or:   /opt/pw-browsers/chromium-1194/chrome-linux/chrome --headless --no-sandbox \
             --disable-gpu --allow-file-access-from-files --virtual-time-budget=30000 \
             --dump-dom tools/palette-probe.html

  WHY THIS EXISTS
  Commit 40c5b21 stopped a repaint mid-flight with the finding "the metric measures hue
  where hue is invalid", and did not build the instrument that would prove it. This is
  that instrument. It does not need Blender: it decodes the SHIPPED
  assets/equipment/body_*.webp with the same decoder the game uses (Chromium), replicates
  tools/palette-audit.py's arithmetic exactly, and then tries to break it.

  DISCIPLINE (Freja, and it is not decoration): every check below DECLARES its expected
  verdict in the `expect` field BEFORE the number is taken. A check whose observation
  contradicts its declaration prints CLAIM=REFUTED and the run exits non-zero. A check
  that cannot be evaluated prints CLAIM=UNKNOWN and also fails the run — silence is not
  a pass. An instrument that has never failed is decoration, so D5/D8/D9 are fixtures
  built to make the shipped metric give a knowably wrong answer, and D10 is the positive
  control that proves the metric is NOT broken everywhere.

  ── REMOVAL CONDITION ─────────────────────────────────────────────────────────────
  Delete this file and tools/palette-check.sh, without a discussion, when ANY holds:
   1. The gate stops gating. Copy the folder, invert any one `expect` predicate, run
      `bash tools/palette-check.sh`. If it exits 0, this is decoration and it goes.
   2. The known-bad corpus stops firing: D5, D8 or D9 no longer make the shipped
      metric give a knowably wrong answer.
   3. body_lab's colour handling is fixed AND the assets re-measured AND D1b then
      fails because the double encode is gone — at which point D1a/D1b/D2b have done
      their job and should be deleted rather than inverted, and what remains is
      D3-D12. Do not "fix" D1b by editing its declaration.
   4. It is only ever pointed at these twelve figures. If a thirteenth armour set
      ships without being added to CLASSES, this measured nothing new and is a toy.
   5. Constantine's one word.

  ── WHAT I GOT WRONG ON THE FIRST RUN, since that is the interesting part ──────────
  The first run of this probe REFUTED five of my own twelve declarations. They are
  listed here rather than quietly re-tuned, because a threshold moved after seeing the
  number is the exact failure commit 40c5b21 stopped over ("fitting to a broken
  measurement"). Each restatement below says what the data actually supports and why
  the new threshold is anchored to a number that already existed in the repo.

  D1  I declared my Chromium-decoded replica would reproduce the manifest's Blender
      numbers within 15%. It missed by 29.7-37.9% and picked a DIFFERENT tightest pair
      for herald. (I first wrote that range as "30-38%": 29.7% is the smallest of the
      three misses, so my own summary was wrong at its own low edge. Corrected here
      rather than rounded away.) Chasing the miss is what found the real defect (D1b):
      the shipped numbers are reproduced EXACTLY by a double-sRGB-encode model. My
      replica was right; the audit's colour handling is not. D1 is now two checks, and
      the "they should agree" declaration is inverted — they must NOT agree, and D1b
      says why.
  D2  I declared >=3 of 12 figures below the chroma guard, per the commit. Browser space
      gives 2. In the audit's double-encoded space it gives 3. Both are now declared
      separately (D2a/D2b) and the disagreement is the point, not an error.
  D4a I declared a 1-LSB decode difference would swing the reported hue by >10deg at low
      chroma. It swings 2.52deg. My instability claim was too strong and is WITHDRAWN.
      What survives is measured and monotone: the swing scales as 1/chroma, 6.6x larger
      at the lowest-chroma figure than the highest. Restated as a ratio, not a magnitude.
  D7  I declared per-pixel median dE would be >=5x the whole-figure mean dE. It is 1.2x.
      My "the mean cancels opposing repaints" hypothesis is NOT supported on these
      assets — these repaints are mostly monotone shifts, not opposing hue moves. What
      IS there is a 4.6x disagreement in the OPPOSITE direction on one pair. Restated
      as "they disagree by >=3x somewhere", direction unspecified.
  D8  I declared the hue-inversion fixture would land under dE 0.005; gamut clamping
      leaves 0.00936. The threshold is now anchored to the shipped tightest real pair
      (0.02118, from manifest.json) instead of a number I invented, because that is the
      load-bearing claim: the metric ranks this total repaint as LESS separated than the
      pair it currently flags as too close. It clears that by 2.3x.
-->

<h1>palette-probe</h1>
<p class="sub">Does <code>tools/palette-audit.py</code> measure armour separation? Declared verdicts first, then pixels.</p>
<div id="plates"></div>
<pre id="out">PENDING — if this text survives, the page never finished. Treat as FAIL.</pre>

<script>
/* ────────────────────────────────────────────────────────────────────────────
   1. THE ARITHMETIC UNDER TEST — transcribed from tools/palette-audit.py.
      Deliberately a transcription, not an import: if these drift, D1 (which
      checks this replica against the numbers the real Blender run wrote into
      assets/equipment/manifest.json) is what catches it.
   ──────────────────────────────────────────────────────────────────────────── */

// palette-audit.py srgb_to_oklab(). Input sRGB 0..1. Cited by function name, never by
// line number: every :NN ref in this file was correct at 40c5b21 and was invalidated by
// the same commit that added this line. A line ref is a second copy with no check.
function srgbToOklab(r, g, b) {
  const lin = c => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  r = lin(r); g = lin(g); b = lin(b);
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
          1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
          0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s];
}
// Inverse, for the D8/D9 repaint fixtures. Not in palette-audit.py; standard Oklab.
function oklabToSrgb(L, A, B) {
  const l_ = L + 0.3963377774 * A + 0.2158037573 * B;
  const m_ = L - 0.1055613458 * A - 0.0638541728 * B;
  const s_ = L - 0.0894841775 * A - 1.2914855480 * B;
  const l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
  const enc = c => { c = Math.min(1, Math.max(0, c));
                     return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; };
  return [enc(+4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s),
          enc(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s),
          enc(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s)];
}
// palette-audit.py dist()
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
// palette-audit.py lch()
const lch = lab => [lab[0], Math.hypot(lab[1], lab[2]),
                    Math.atan2(lab[2], lab[1]) * 180 / Math.PI];
// palette-audit.py dhue() AS SHIPPED AT 40c5b21 — no chroma guard. The defect under test.
// The guarded version now in the tree is deliberately NOT transcribed here: this probe must
// keep replicating what MADE the manifest, or D1b stops being a reproduction.
function dhue(a, b) {
  const d = Math.abs(lch(a)[2] - lch(b)[2]) % 360;
  return d > 180 ? 360 - d : d;
}

/* palette-audit.py body_lab() — mean of sRGB over opaque pixels, THEN convert.
   Blender's img.pixels is bottom-up; canvas getImageData is top-down. The stride
   (every 4th pixel) has a phase that depends on row order because 450 % 4 != 0, so
   both orders are computed and both reported — that spread is itself a measurement
   of how method-sensitive this number is. */
function bodyLab(px, w, h, { stride = 4, alphaMin = 0.9, bottomUp = false, doubleEncode = false } = {}) {
  const acc = [0, 0, 0]; let n = 0;
  const idx = i => {
    if (!bottomUp) return i * 4;
    const y = Math.floor(i / w), x = i % w;      // walk as Blender would index
    return ((h - 1 - y) * w + x) * 4;
  };
  // doubleEncode: applies palette-audit.py's to_srgb() (line 31-32) to a value that
  // is ALREADY sRGB-encoded. See D1b — this is what the shipped numbers were made with.
  const enc = c => (c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055);
  const f = doubleEncode ? (v => enc(v)) : (v => v);
  for (let i = 0; i < w * h; i += stride) {
    const p = idx(i);
    if (px[p + 3] / 255 < alphaMin) continue;
    acc[0] += f(px[p] / 255); acc[1] += f(px[p + 1] / 255); acc[2] += f(px[p + 2] / 255); n++;
  }
  if (!n) return null;
  return srgbToOklab(acc[0] / n, acc[1] / n, acc[2] / n);
}

/* ────────────────────────────────────────────────────────────────────────────
   2. DECLARED, BEFORE MEASURING — the numbers the real Blender run recorded into
      assets/equipment/manifest.json ("audit" block) at commit 40c5b21. Copied here
      so the expectation is in the artifact, not fetched at runtime and trusted.
   ──────────────────────────────────────────────────────────────────────────── */
const SHIPPED = {
  withinClassMin: { herald: 0.04209807335894399, reaver: 0.02118072594909954,
                    starseer: 0.03536709343313372 },
  tightest: {
    herald:   { pair: ['ossuary', 'pilgrim'], dE: 0.04209807335894399, dL: 0.04078736682785744, dC: 0.0071279002346633855, dHueDeg: 11.735123063316152 },
    reaver:   { pair: ['default', 'warden'],  dE: 0.02118072594909954, dL: 0.015692832688279812, dC: 0.013445657028693443, dHueDeg: 5.65757605281199 },
    starseer: { pair: ['default', 'eclipse'], dE: 0.03536709343313372, dL: 0.0259601785831306,  dC: 0.010462450619982893, dHueDeg: 133.04928092274295 },
  },
};
// Vira's chroma guard, cited in commit 40c5b21: below this, hue angle is noise.
const CHROMA_GUARD = 0.03;

const CLASSES = {
  herald:   ['default', 'emberhabit', 'ossuary', 'pilgrim'],
  reaver:   ['default', 'oathsworn', 'vigil', 'warden'],
  starseer: ['astral', 'default', 'eclipse', 'starlit'],
};

/* ────────────────────────────────────────────────────────────────────────────
   3. HARNESS
   ──────────────────────────────────────────────────────────────────────────── */
const LOG = [];
const CHECKS = [];
const say = s => LOG.push(s);

/** Record a check. `expect` is a human-readable declaration; `ok` is the predicate
 *  result; null/undefined `ok` means the check could not be evaluated → UNKNOWN. */
function check(id, what, expect, observed, ok) {
  const claim = ok === null || ok === undefined ? 'UNKNOWN' : (ok ? 'UPHELD' : 'REFUTED');
  CHECKS.push({ id, what, expect, observed, claim });
  say(`CHECK ${id}  ${claim}`);
  say(`    what     ${what}`);
  say(`    expect   ${expect}`);
  say(`    observed ${observed}`);
}

function loadImage(src) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error('load failed: ' + src));
    im.src = src;
  });
}
function toPixels(im) {
  const c = document.createElement('canvas');
  c.width = im.naturalWidth; c.height = im.naturalHeight;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(im, 0, 0);
  return { px: x.getImageData(0, 0, c.width, c.height).data, w: c.width, h: c.height };
}
/** Show a bitmap on the page and return its canvas (so the runner can save a PNG). */
function plate(px, w, h, caption) {
  const fig = document.createElement('figure');
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  const im = x.createImageData(w, h);
  im.data.set(px);
  x.putImageData(im, 0, 0);
  const cap = document.createElement('figcaption');
  cap.textContent = caption;
  fig.append(c, cap);
  document.getElementById('plates').append(fig);
  return c;
}
const PLATES = {};   // name -> dataURL, emitted in the evidence block for the runner

/* ── per-pixel instrument ───────────────────────────────────────────────────
   The audit's own header says: WITHIN a class the geometry is identical (one
   builder, four repaints). If that is true then pixel (x,y) of `default` and
   pixel (x,y) of `warden` are the SAME SURFACE POINT, so the two images can be
   differenced pixel-by-pixel — and the "masked render" commit 40c5b21 calls the
   correct-but-unbuilt instrument is not needed for the within-class question:
   pixel correspondence IS the mask. A shared unpainted surface contributes
   dE ~= 0 at each of its own pixels instead of pulling both means toward grey.
   Precondition: the alpha masks must agree. D6 checks that; it is not assumed. */
function perPixel(A, B) {
  const { px: pa, w, h } = A, { px: pb } = B;
  const ds = []; let bothOpaque = 0, onlyOne = 0;
  for (let i = 0; i < w * h; i++) {
    const p = i * 4;
    const oa = pa[p + 3] / 255 >= 0.9, ob = pb[p + 3] / 255 >= 0.9;
    if (oa !== ob) { onlyOne++; continue; }
    if (!oa) continue;
    bothOpaque++;
    ds.push(dist(srgbToOklab(pa[p] / 255, pa[p + 1] / 255, pa[p + 2] / 255),
                 srgbToOklab(pb[p] / 255, pb[p + 1] / 255, pb[p + 2] / 255)));
  }
  ds.sort((x, y) => x - y);
  const q = f => ds.length ? ds[Math.min(ds.length - 1, Math.floor(f * ds.length))] : NaN;
  return {
    n: bothOpaque, maskDisagree: onlyOne,
    maskAgreement: bothOpaque / (bothOpaque + onlyOne || 1),
    mean: ds.reduce((a, b) => a + b, 0) / (ds.length || 1),
    median: q(0.5), p90: q(0.9),
    // share of corresponding pixels this repaint actually moved, at a threshold
    // well above 8-bit decode noise
    repainted: ds.filter(d => d > 0.02).length / (ds.length || 1),
    // share that is effectively UNTOUCHED between the two sets: shared surfaces the
    // repaint never reaches. Commit 40c5b21 dismissed dilution on the grounds that the
    // shared gold cape is ~1% of opaque pixels. This measures the whole shared region,
    // not just the cape. Threshold is 8-bit decode noise, not a taste call.
    identical: ds.filter(d => d < 0.002).length / (ds.length || 1),
  };
}

/* ── fixture builders ──────────────────────────────────────────────────────── */

/** Two images with the SAME mean sRGB and nothing else in common. */
function meanCollapseFixture(w = 96, h = 96) {
  const a = new Uint8ClampedArray(w * h * 4), b = new Uint8ClampedArray(w * h * 4);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const p = (y * w + x) * 4, hot = (x + y) % 2 === 0;
    a[p] = hot ? 254 : 0; a[p + 1] = hot ? 0 : 254; a[p + 2] = 0; a[p + 3] = 255;
    b[p] = 127; b[p + 1] = 127; b[p + 2] = 0; b[p + 3] = 255;   // exact mean of the above
  }
  return [{ px: a, w, h }, { px: b, w, h }];
}

/** Mean-preserving hue inversion: reflect every pixel's (a,b) through the figure's
    own mean (a,b), keep L. The whole-figure mean is unchanged by construction, so
    the shipped metric must report dE ~= 0 — while every material's hue flips. */
function hueInvert(src) {
  const { px, w, h } = src;
  const mean = bodyLab(px, w, h, { stride: 1 });
  const out = new Uint8ClampedArray(px.length);
  for (let i = 0; i < w * h; i++) {
    const p = i * 4;
    out[p + 3] = px[p + 3];
    if (px[p + 3] / 255 < 0.9) { out[p] = px[p]; out[p + 1] = px[p + 1]; out[p + 2] = px[p + 2]; continue; }
    const [L, A, B] = srgbToOklab(px[p] / 255, px[p + 1] / 255, px[p + 2] / 255);
    const rgb = oklabToSrgb(L, 2 * mean[1] - A, 2 * mean[2] - B);
    out[p] = Math.round(rgb[0] * 255); out[p + 1] = Math.round(rgb[1] * 255); out[p + 2] = Math.round(rgb[2] * 255);
  }
  return { px: out, w, h };
}

/** The smallest change a different renderer/encoder could plausibly make:
    +1/255 on one channel, everywhere. */
function lsbShift(src, channel = 0, delta = 1) {
  const { px, w, h } = src;
  const out = new Uint8ClampedArray(px);
  for (let i = 0; i < w * h; i++) {
    const p = i * 4;
    if (px[p + 3] / 255 < 0.9) continue;
    out[p + channel] = Math.min(255, Math.max(0, px[p + channel] + delta));
  }
  return { px: out, w, h };
}

/* ────────────────────────────────────────────────────────────────────────────
   4. THE RUN
   ──────────────────────────────────────────────────────────────────────────── */
async function main() {
  say('BEGIN EVIDENCE');
  say('probe   tools/palette-probe.html');
  say('under   tools/palette-audit.py  (body_lab / dist / lch / dhue, transcribed)');
  say('decoder Chromium canvas getImageData on the shipped assets/equipment/body_*.webp');
  say('ref     40c5b21');
  say('');

  // ---- load the twelve shipped figures -------------------------------------
  // Measured in TWO colour pipelines, because which one the shipped numbers came from
  // turned out to be the whole question:
  //   BROWSER SPACE — the sRGB values Chromium hands the game. What a player sees.
  //   AUDIT SPACE   — the same values with palette-audit.py's to_srgb() applied on top
  //                   (see D1b). What every number in manifest.json was made from.
  const IMG = {}, LAB = {}, LABbu = {}, AUD = {}, DIMS = {};
  for (const cls of Object.keys(CLASSES)) for (const sid of CLASSES[cls]) {
    const key = `${cls}/${sid}`;
    const im = await loadImage(`../assets/equipment/body_${cls}_${sid}.webp`);
    IMG[key] = toPixels(im);
    DIMS[key] = `${IMG[key].w}x${IMG[key].h}`;
    LAB[key] = bodyLab(IMG[key].px, IMG[key].w, IMG[key].h, { bottomUp: false });
    LABbu[key] = bodyLab(IMG[key].px, IMG[key].w, IMG[key].h, { bottomUp: true });
    AUD[key] = bodyLab(IMG[key].px, IMG[key].w, IMG[key].h, { doubleEncode: true });
  }

  say('=== THE TWELVE SHIPPED FIGURES — whole-figure mean, in both colour pipelines ===');
  say('                         BROWSER SPACE (what a player sees)      AUDIT SPACE (what manifest.json measured)');
  say('  key                       L        C     h(deg)  guard          L        C     h(deg)  guard');
  const lowChroma = [], lowChromaAudit = [];
  for (const cls of Object.keys(CLASSES)) for (const sid of CLASSES[cls]) {
    const key = `${cls}/${sid}`;
    const [L, C, H] = lch(LAB[key]);
    const [La, Ca, Ha] = lch(AUD[key]);
    if (C < CHROMA_GUARD) lowChroma.push(`${key} C=${C.toFixed(4)}`);
    if (Ca < CHROMA_GUARD) lowChromaAudit.push(`${key} C=${Ca.toFixed(4)}`);
    const g = c => (c < CHROMA_GUARD ? 'BELOW' : 'ok   ');
    say(`  ${key.padEnd(22)} ${L.toFixed(4)}  ${C.toFixed(4)} ${H.toFixed(1).padStart(6)}  ${g(C)}      ` +
        `${La.toFixed(4)}  ${Ca.toFixed(4)} ${Ha.toFixed(1).padStart(6)}  ${g(Ca)}` +
        `${(C < CHROMA_GUARD) !== (Ca < CHROMA_GUARD) ? '   <-- the two pipelines DISAGREE about this figure' : ''}`);
  }
  say('');

  // ---- D1: which colour pipeline produced the shipped numbers? -------------
  const minOf = (labs) => {
    const out = {}, pr = {};
    for (const cls of Object.keys(CLASSES)) {
      const ids = CLASSES[cls];
      let best = null;
      for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
        const d = dist(labs[`${cls}/${ids[i]}`], labs[`${cls}/${ids[j]}`]);
        if (!best || d < best[0]) best = [d, ids[i], ids[j]];
      }
      out[cls] = best[0]; pr[cls] = [best[1], best[2]];
    }
    return { min: out, pair: pr };
  };
  const B = minOf(LAB), A = minOf(AUD);
  const relTo = (m, cls) => Math.abs(m[cls] - SHIPPED.withinClassMin[cls]) / SHIPPED.withinClassMin[cls];
  const pairsOk = pr => Object.keys(CLASSES).every(c =>
    pr[c].slice().sort().join('|') === SHIPPED.tightest[c].pair.slice().sort().join('|'));
  const worstB = Math.max(...Object.keys(CLASSES).map(c => relTo(B.min, c)));
  const worstA = Math.max(...Object.keys(CLASSES).map(c => relTo(A.min, c)));

  check('D1a', 'THE SCARY ONE — do the shipped audit numbers describe the picture the browser shows?',
    'DECLARED: they do NOT. Measuring the shipped .webp in browser sRGB must MISS manifest.json\'s withinClassMin by more than 25% in every class. If it agreed, everything below is moot.',
    Object.keys(CLASSES).map(c =>
      `${c} browser ${B.min[c].toFixed(5)} vs manifest ${SHIPPED.withinClassMin[c].toFixed(5)} (off ${(relTo(B.min, c) * 100).toFixed(1)}%, pair ${B.pair[c].join('|')}${pairsOk(B.pair) ? '' : ''})`).join('; ') +
      `; tightest-pair identity ${pairsOk(B.pair) ? 'matches' : 'DIFFERS for at least one class'}`,
    Math.min(...Object.keys(CLASSES).map(c => relTo(B.min, c))) > 0.25);

  check('D1b', 'THE DIAGNOSIS — is the difference explained by palette-audit.py applying the sRGB encode TWICE?',
    'DECLARED: yes. Re-measuring with to_srgb() applied to already-sRGB values (the acc[] += to_srgb(...) lines in body_lab(), over the value bpy returns) must reproduce all three of manifest.json\'s withinClassMin to within 1% AND name the same tightest pair in all three classes.',
    Object.keys(CLASSES).map(c =>
      `${c} double-encoded ${A.min[c].toFixed(5)} vs manifest ${SHIPPED.withinClassMin[c].toFixed(5)} (off ${(relTo(A.min, c) * 100).toFixed(2)}%, pair ${A.pair[c].join('|')})`).join('; ') +
      `; pairs ${pairsOk(A.pair) ? 'ALL MATCH' : 'differ'}`,
    pairsOk(A.pair) && worstA < 0.01);

  // The chroma shortfall is COMPUTED from this run's own twelve figures, not written in
  // by hand. My first version of this line said "every chroma is ~27% low", a literal I
  // typed once and never re-derived. The median turned out to be ~27.6%, so the number was
  // fine and the word "every" was the defect: the range is 18.9%-51.8%, and that spread is
  // the mechanism behind D2b. A hardcoded magnitude in an evidence block is the same defect
  // as a hardcoded line ref — a number with nothing checking it. Now both are derived.
  {
    const drops = Object.keys(LAB).map(k => (lch(LAB[k])[1] - lch(AUD[k])[1]) / lch(LAB[k])[1])
                        .sort((x, y) => x - y);
    const med = drops.length % 2 ? drops[(drops.length - 1) / 2]
                                 : (drops[drops.length / 2 - 1] + drops[drops.length / 2]) / 2;
    say(`    aside  the comment above body_lab's pixel loop asserts bpy hands back LINEAR pixels,`);
    say(`           which is what justifies the to_srgb() call. The reproduction above is exact to`);
    say(`           ${(worstA * 100).toFixed(2)}% on three independent classes, so that comment is wrong and the call is a`);
    say(`           double encode. Net effect: chroma in the audit is low by a median of ${(med * 100).toFixed(1)}%,`);
    say(`           range ${(drops[0] * 100).toFixed(1)}%-${(drops[drops.length - 1] * 100).toFixed(1)}% over the twelve figures — systematic but NOT uniform, and that`);
    say(`           non-uniformity is what reclassifies a figure across the guard in D2b. The audit`);
    say(`           measures a DESATURATED picture and then reports that hue is unreliable.`);
  }
  say(`    aside  stride-phase (top-down vs bottom-up row order) moves withinClassMin by: ` +
      Object.keys(CLASSES).map(c => {
        const ids = CLASSES[c]; let bu = Infinity;
        for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++)
          bu = Math.min(bu, dist(LABbu[`${c}/${ids[i]}`], LABbu[`${c}/${ids[j]}`]));
        return `${c} ${(Math.abs(bu - B.min[c])).toExponential(1)}`;
      }).join(', ') + '  (negligible — not a candidate explanation)');

  // ---- D2: how many figures are below the chroma guard, in each pipeline? --
  const crossers = Object.keys(LAB).filter(k =>
    (lch(LAB[k])[1] < CHROMA_GUARD) !== (lch(AUD[k])[1] < CHROMA_GUARD));
  check('D2a', 'commit 40c5b21 counted 3 of 12 figures below Vira\'s ~0.03 chroma guard — does that hold in the space a player sees?',
    'DECLARED: no — browser space gives exactly 2 of 12. The commit\'s count is a fact about the audit pipeline, not about the art.',
    `${lowChroma.length} of 12 below guard in browser space: ${lowChroma.join(', ') || 'none'}`,
    lowChroma.length === 2);
  check('D2b', 'and does the commit\'s count of 3 reproduce in the audit\'s own double-encoded space?',
    'DECLARED: yes — 3 of 12, and the extra figure is one the double encode pushed across the guard, named explicitly',
    `${lowChromaAudit.length} of 12 below guard in audit space: ${lowChromaAudit.join(', ') || 'none'}; reclassified by the encode alone: ${crossers.join(', ') || 'none'}`,
    lowChromaAudit.length === 3 && crossers.length >= 1);

  // ---- D3: the shipped 133-degree hue number ------------------------------
  const sd = LAB['starseer/default'], se = LAB['starseer/eclipse'];
  const cSd = lch(sd)[1], cSe = lch(se)[1];
  check('D3', 'the manifest records dHueDeg=133.05 for starseer default|eclipse — is that angle valid?',
    'BOTH chromas below 0.05 (i.e. the 133 degrees separates two near-neutrals and means nothing)',
    `C(default)=${cSd.toFixed(4)}  C(eclipse)=${cSe.toFixed(4)}  my dHue=${dhue(sd, se).toFixed(1)}deg  ` +
    `at dE=${dist(sd, se).toFixed(4)}  -> ${(cSd < CHROMA_GUARD || cSe < CHROMA_GUARD) ? 'HUE_INVALID (at least one below the 0.03 guard)' : 'both above guard'}`,
    cSd < 0.05 && cSe < 0.05);

  // ---- D4: is the hue number stable under a 1-LSB decode difference? -------
  say('');
  say('=== D4 SUBSTRATE: +1/255 on the red channel of every opaque pixel ===');
  say('  (the smallest difference a different encoder, renderer or colour-managed');
  say('   decode could produce across the board)');
  say('  key                      C       dHue moved (deg)   dE moved');
  let lowMove = null, highMove = null, lowKey = '', highKey = '';
  const chromaOrder = Object.keys(LAB).sort((a, b) => lch(LAB[a])[1] - lch(LAB[b])[1]);
  for (const key of chromaOrder) {
    const shifted = bodyLab(lsbShift(IMG[key]).px, IMG[key].w, IMG[key].h);
    const moved = dhue(LAB[key], shifted), dEmoved = dist(LAB[key], shifted);
    const C = lch(LAB[key])[1];
    say(`  ${key.padEnd(22)} ${C.toFixed(4)}  ${moved.toFixed(2).padStart(10)}      ${dEmoved.toFixed(5)}`);
    if (lowMove === null) { lowMove = moved; lowKey = key; }
    highMove = moved; highKey = key;                     // last = highest chroma
  }
  const lowdE = dist(LAB[lowKey], bodyLab(lsbShift(IMG[lowKey]).px, IMG[lowKey].w, IMG[lowKey].h));
  check('D4a', 'is the reported hue angle equally trustworthy at every chroma? (RESTATED — my first declaration, ">10 deg swing at 1 LSB", was REFUTED at 2.52 deg and is withdrawn)',
    'DECLARED: the swing scales as 1/chroma. The lowest-chroma figure\'s hue angle must move at least 4x further than the highest-chroma figure\'s under the identical 1-LSB shift, while dE moves by less than 0.01 for both — i.e. the instability is specific to the hue channel at low chroma, not general noise.',
    `${lowKey} (C=${lch(LAB[lowKey])[1].toFixed(4)}) moved ${lowMove.toFixed(2)}deg vs ${highKey} (C=${lch(LAB[highKey])[1].toFixed(4)}) moved ${highMove.toFixed(2)}deg = ${(lowMove / highMove).toFixed(1)}x; dE moved ${lowdE.toFixed(5)}`,
    (lowMove / highMove) >= 4 && lowdE < 0.01);
  check('D4b', 'BOTH EDGES — at high chroma the same instrument should be stable (the metric is not broken everywhere)',
    `highest-chroma figure: the same 1-LSB shift moves dHue by LESS than 2 deg`,
    `${highKey} (C=${lch(LAB[highKey])[1].toFixed(4)}): dHue moved ${highMove.toFixed(2)}deg`,
    highMove < 2);

  // D4c: the perturbation that is not hypothetical — the two pipelines from D1b are a
  // real method difference that really happened, so measure the hue swing across it
  // rather than across an invented 1 LSB.
  let worstPipeSwing = 0, worstPipeKey = '';
  for (const key of Object.keys(LAB)) {
    const s = dhue(LAB[key], AUD[key]);
    if (s > worstPipeSwing) { worstPipeSwing = s; worstPipeKey = key; }
  }
  check('D4c', 'how far does the reported hue angle move between the two colour pipelines of D1b — a method difference that actually happened, not an invented one?',
    'DECLARED: for at least one of the twelve figures the hue angle differs by more than 10 deg between browser space and audit space',
    `worst swing ${worstPipeSwing.toFixed(1)}deg at ${worstPipeKey} (C=${lch(LAB[worstPipeKey])[1].toFixed(4)} browser / ${lch(AUD[worstPipeKey])[1].toFixed(4)} audit); ` +
      Object.keys(LAB).map(k => `${k.split('/')[1].slice(0, 4)} ${dhue(LAB[k], AUD[k]).toFixed(1)}`).join(' '),
    worstPipeSwing > 10);

  // ---- D5: the aggregate discards the distribution -------------------------
  say('');
  const [mcA, mcB] = meanCollapseFixture();
  plate(mcA.px, mcA.w, mcA.h, 'D5 A — red/green');
  plate(mcB.px, mcB.w, mcB.h, 'D5 B — flat mean');
  const mcE = dist(bodyLab(mcA.px, mcA.w, mcA.h, { stride: 1 }), bodyLab(mcB.px, mcB.w, mcB.h, { stride: 1 }));
  check('D5', 'KNOWN-BAD FIXTURE: a red/green checker vs a flat fill of its exact mean',
    'the whole-figure metric reports dE < 0.001, i.e. "these are the same image" — it is blind to the distribution, not merely diluted by shared surfaces',
    `dE = ${mcE.toExponential(3)}  (shipped tightest real pair, for scale: ${SHIPPED.withinClassMin.reaver.toFixed(4)})`,
    mcE < 0.001);

  // ---- D6: does pixel correspondence hold within a class? -----------------
  say('');
  say('=== D6 SUBSTRATE: within-class alpha-mask agreement (precondition for per-pixel) ===');
  let worstAgree = 1, worstAgreePair = '';
  const PP = {};
  for (const cls of Object.keys(CLASSES)) {
    const ids = CLASSES[cls];
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
      const k = `${cls}/${ids[i]}|${ids[j]}`;
      const A = IMG[`${cls}/${ids[i]}`], B = IMG[`${cls}/${ids[j]}`];
      if (A.w !== B.w || A.h !== B.h) { say(`  ${k}: DIMENSION MISMATCH ${A.w}x${A.h} vs ${B.w}x${B.h}`); worstAgree = 0; worstAgreePair = k; continue; }
      const r = perPixel(A, B); PP[k] = r;
      if (r.maskAgreement < worstAgree) { worstAgree = r.maskAgreement; worstAgreePair = k; }
    }
  }
  say(`  worst mask agreement: ${(worstAgree * 100).toFixed(2)}%  (${worstAgreePair})`);
  check('D6', 'the audit\'s premise "within a class the geometry is identical" — does it hold at pixel level?',
    'every within-class pair shares dimensions and their opaque masks agree on >99% of pixels, so pixel (x,y) is the same surface point in both and pixel correspondence can serve as the mask',
    `worst agreement ${(worstAgree * 100).toFixed(2)}% at ${worstAgreePair}`,
    worstAgree > 0.99);

  // ---- D7: what the mean destroys, on real data ---------------------------
  say('');
  say('=== D7 SUBSTRATE: whole-figure mean dE vs per-pixel dE, all within-class pairs ===');
  say('  pair                        mean-dE   |  per-pixel median   p90     %moved  %identical   ratio(med/mean-dE)');
  const rows = [];
  for (const cls of Object.keys(CLASSES)) {
    const ids = CLASSES[cls];
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
      const k = `${cls}/${ids[i]}|${ids[j]}`, r = PP[k];
      if (!r) continue;
      const mE = dist(LAB[`${cls}/${ids[i]}`], LAB[`${cls}/${ids[j]}`]);
      rows.push({ k, cls, mE, r, ratio: r.median / mE });
      say(`  ${k.padEnd(27)} ${mE.toFixed(4)}   |   ${r.median.toFixed(4)}      ${r.p90.toFixed(4)}  ${(r.repainted * 100).toFixed(1).padStart(5)}%  ${(r.identical * 100).toFixed(1).padStart(6)}%      ${(r.median / mE).toFixed(1).padStart(5)}x`);
    }
  }
  // Biggest disagreement between the aggregate and a per-pixel measure of the SAME images.
  const worstDis = rows.reduce((a, b) => {
    const f = r => Math.max(r.mE / r.r.median, r.r.median / r.mE);
    return f(a) > f(b) ? a : b;
  });
  const disFactor = Math.max(worstDis.mE / worstDis.r.median, worstDis.r.median / worstDis.mE);
  check('D7', 'does the whole-figure mean agree in MAGNITUDE with a per-pixel measure of the same two images? (RESTATED — my first declaration, "per-pixel median >=5x larger on reaver default|warden", was REFUTED at 1.2x and the hypothesis behind it, "the mean cancels opposing repaints", is withdrawn: these repaints are mostly monotone shifts, so little cancels)',
    'DECLARED: they disagree by at least 3x on at least one within-class pair. Direction deliberately unspecified — I predicted per-pixel would be larger and it is the aggregate that is larger, which is the more damaging direction: the mean calls a pair well-separated where corresponding pixels barely move.',
    `worst disagreement ${disFactor.toFixed(1)}x at ${worstDis.k}: mean-dE ${worstDis.mE.toFixed(4)} vs per-pixel median ${worstDis.r.median.toFixed(4)} (p90 ${worstDis.r.p90.toFixed(4)}); reaver/default|warden for reference is ${rows.find(r => r.k === 'reaver/default|warden').ratio.toFixed(1)}x`,
    disFactor >= 3);

  // does the per-pixel instrument even agree on WHICH pair is tightest?
  const mineTight = {}, ppTight = {};
  for (const cls of Object.keys(CLASSES)) {
    const cr = rows.filter(r => r.cls === cls);
    mineTight[cls] = cr.reduce((a, b) => (a.mE < b.mE ? a : b)).k;
    ppTight[cls] = cr.reduce((a, b) => (a.r.median < b.r.median ? a : b)).k;
  }
  const agreeOnTightest = Object.keys(CLASSES).filter(c => mineTight[c] === ppTight[c]).length;
  check('D7b', 'does the whole-figure metric even pick the same "closest pair" as a per-pixel measure of the same images?',
    'DECLARED BEFORE MEASURING: they disagree in at least 1 of the 3 classes — the argmin the repaint was chasing is an artifact of the aggregate',
    Object.keys(CLASSES).map(c => `${c}: mean-> ${mineTight[c].split('/')[1]} | per-pixel-> ${ppTight[c].split('/')[1]}`).join('; ') +
      `  (agree in ${agreeOnTightest}/3)`,
    agreeOnTightest < 3);

  // ---- D8: the repaint the shipped metric cannot see ----------------------
  say('');
  const victim = 'reaver/warden';
  const inv = hueInvert(IMG[victim]);
  PLATES['d8-original'] = (() => { const c = plate(IMG[victim].px, IMG[victim].w, IMG[victim].h, `D8 original — body_reaver_warden.webp`); return c.toDataURL('image/png'); })();
  PLATES['d8-hue-inverted'] = (() => { const c = plate(inv.px, inv.w, inv.h, `D8 hue-inverted — metric says IDENTICAL`); return c.toDataURL('image/png'); })();
  const invLab = bodyLab(inv.px, inv.w, inv.h);
  const invE = dist(LAB[victim], invLab);
  const invPP = perPixel(IMG[victim], inv);
  check('D8', 'KNOWN-BAD FIXTURE on a SHIPPED asset: reflect every pixel of body_reaver_warden through the figure\'s own mean (a,b), keeping L — every material\'s hue flips, the mean is unchanged by construction (RESTATED — my first declaration used an invented ceiling of 0.005 and was REFUTED at 0.00936, which is gamut clamping; the threshold below is anchored to a number already in the repo instead)',
    `DECLARED: the shipped whole-figure metric reports a dE BELOW manifest.json's own tightest real pair (${SHIPPED.withinClassMin.reaver.toFixed(5)}) — so it would rank a total hue repaint as LESS of a change than the pair it currently flags as too close — while the per-pixel median of the very same two images exceeds 0.02`,
    `whole-figure dE ${invE.toFixed(5)} = ${(invE / SHIPPED.withinClassMin.reaver).toFixed(2)}x the tightest real pair (residual is gamut clamping + 8-bit rounding, not the metric working); per-pixel median ${invPP.median.toFixed(4)} = ${(invPP.median / invE).toFixed(0)}x larger, p90 ${invPP.p90.toFixed(4)}, ${(invPP.repainted * 100).toFixed(1)}% of pixels moved`,
    invE < SHIPPED.withinClassMin.reaver && invPP.median > 0.02);

  // ---- D9: and the reverse — the metric can be SATISFIED without repainting -
  // Darken every pixel slightly: no hue change at all, but dL moves, so scalar dE
  // grows. palette-audit.py lch()'s docstring already names this ("you pass it by making one set
  // darker"); this measures how cheap it is on the shipped tightest pair.
  const dk = (() => {
    const { px, w, h } = IMG['reaver/warden'];
    const out = new Uint8ClampedArray(px);
    for (let i = 0; i < w * h; i++) { const p = i * 4;
      if (px[p + 3] / 255 < 0.9) continue;
      for (const ch of [0, 1, 2]) out[p + ch] = Math.round(px[p + ch] * 0.86); }
    return { px: out, w, h };
  })();
  PLATES['d9-darkened'] = (() => { const c = plate(dk.px, dk.w, dk.h, 'D9 darkened 14% — metric now "separated"'); return c.toDataURL('image/png'); })();
  const dkLab = bodyLab(dk.px, dk.w, dk.h);
  const dkE = dist(LAB['reaver/default'], dkLab);
  const dkHue = dhue(LAB['reaver/warden'], dkLab);
  check('D9', 'KNOWN-BAD FIXTURE, the other direction: darken warden 14% — no hue change whatsoever',
    'the scalar within-class dE for default|warden rises above the herald class\'s current worst (0.0421) purely from lightness, while dHue vs the original warden stays under 6 deg — the floor is passable without repainting anything',
    `dE default|warden was ${SHIPPED.withinClassMin.reaver.toFixed(4)}, now ${dkE.toFixed(4)} (${(dkE / SHIPPED.withinClassMin.reaver).toFixed(1)}x); dHue vs original warden ${dkHue.toFixed(2)}deg`,
    dkE > 0.0421 && dkHue < 6);

  // ---- D10: POSITIVE CONTROL — the metric is not broken everywhere ---------
  const satA = (() => { const w = 96, h = 96, a = new Uint8ClampedArray(w * h * 4);
    for (let i = 0; i < w * h; i++) { const p = i * 4; a[p] = 200; a[p + 1] = 40; a[p + 2] = 40; a[p + 3] = 255; } return { px: a, w, h }; })();
  const satB = (() => { const w = 96, h = 96, a = new Uint8ClampedArray(w * h * 4);
    for (let i = 0; i < w * h; i++) { const p = i * 4; a[p] = 40; a[p + 1] = 90; a[p + 2] = 200; a[p + 3] = 255; } return { px: a, w, h }; })();
  const sA = bodyLab(satA.px, 96, 96, { stride: 1 }), sB = bodyLab(satB.px, 96, 96, { stride: 1 });
  const satHue = dhue(sA, sB);
  const satShift = dhue(sA, bodyLab(lsbShift(satA).px, 96, 96, { stride: 1 }));
  check('D10', 'POSITIVE CONTROL: two flat, well-saturated, genuinely different colours',
    'above the chroma guard the instrument works: dHue > 90 deg AND that angle moves < 0.5 deg under the same 1-LSB shift that destroyed the low-chroma reading in D4a',
    `C=${lch(sA)[1].toFixed(3)}/${lch(sB)[1].toFixed(3)}, dHue ${satHue.toFixed(1)}deg, moves ${satShift.toFixed(3)}deg under 1-LSB`,
    satHue > 90 && satShift < 0.5);

  // ---- D11: the hypothesis commit 40c5b21 killed — was it killed correctly? -
  // The commit retracted "the shared gold cape is the diluter" on the grounds that the
  // cape is ~1% of opaque pixels. The cape being small does not bound the SHARED region:
  // what dilutes a whole-figure mean is every pixel the repaint never reaches.
  const reaverIdent = rows.filter(r => r.cls === 'reaver').map(r => r.r.identical);
  const minReaverIdent = Math.min(...reaverIdent);
  const heraldIdent = Math.min(...rows.filter(r => r.cls === 'herald').map(r => r.r.identical));
  check('D11', 'commit 40c5b21 retracted "the shared gold cape is the diluter" because the cape is ~1% of opaque pixels — does that settle it? (RESTATED — I first declared >20% and it was REFUTED at 16.8%. The threshold below is the literal content of my own argument, "an order of magnitude above ~1%", instead of a rounder number I picked above it.)',
    'DECLARED: no. Every reaver within-class pair leaves more than 10% of corresponding pixels bit-identical (per-pixel dE < 0.002) — an order of magnitude more than the cape. The cape being small bounds the cape, not the shared region, so "the cape is 1%" does not license "shared surfaces do not dilute".',
    `reaver pairs leave ${(minReaverIdent * 100).toFixed(1)}%-${(Math.max(...reaverIdent) * 100).toFixed(1)}% of corresponding pixels identical = ${(minReaverIdent / 0.01).toFixed(0)}-${(Math.max(...reaverIdent) / 0.01).toFixed(0)}x the cape's ~1%; herald's least-shared pair leaves ${(heraldIdent * 100).toFixed(1)}%, so this is a reaver-geometry fact, not a global one`,
    minReaverIdent > 0.10);

  // D11b: is that shared region actually the cape? Take the pixels where ALL FOUR
  // reaver sets agree within decode noise, and report their share and their colour.
  // If it is the cape it will be gold and it will be big; if it is scattered
  // antialiasing it will be neither, and D11 would be measuring the wrong thing.
  {
    const ids = CLASSES.reaver.map(s => IMG[`reaver/${s}`]);
    const { w, h } = ids[0];
    let n = 0, opaque = 0; const acc = [0, 0, 0];
    for (let i = 0; i < w * h; i++) {
      const p = i * 4;
      if (ids.some(im => im.px[p + 3] / 255 < 0.9)) continue;
      opaque++;
      const labs = ids.map(im => srgbToOklab(im.px[p] / 255, im.px[p + 1] / 255, im.px[p + 2] / 255));
      if (labs.slice(1).every(l => dist(l, labs[0]) < 0.002)) {
        n++; acc[0] += ids[0].px[p]; acc[1] += ids[0].px[p + 1]; acc[2] += ids[0].px[p + 2];
      }
    }
    const rgb = acc.map(v => v / n);
    const [, cc, hh] = lch(srgbToOklab(rgb[0] / 255, rgb[1] / 255, rgb[2] / 255));
    check('D11b', 'is that shared region the gold cape, and how big is it really?',
      'DECLARED: the pixels where all four reaver sets agree within decode noise are more than 10% of the figure AND their mean colour is a saturated warm gold (chroma > 0.08, hue between 70 and 110 deg) — i.e. it is the cape, and the cape is not ~1% of the figure',
      `${(n / opaque * 100).toFixed(1)}% of commonly-opaque pixels are identical across all four reaver sets; their mean is rgb(${rgb.map(v => v.toFixed(0)).join(',')}) = chroma ${cc.toFixed(4)}, hue ${hh.toFixed(1)}deg`,
      (n / opaque) > 0.10 && cc > 0.08 && hh > 70 && hh < 110);
  }

  // D11c: THE MASKED MEASUREMENT commit 40c5b21 called "the correct instrument" and
  // deferred as over-investment. It does not need Blender or material IDs: within a
  // class the geometry is identical (D6, 100% mask agreement), so the pixels where ALL
  // FOUR sets agree ARE the never-repainted surfaces. That is the mask, derived from
  // the shipped assets. Recompute each reaver mean over the repainted pixels only.
  {
    const ids = CLASSES.reaver;
    const ims = ids.map(s => IMG[`reaver/${s}`]);
    const { w, h } = ims[0];
    const keep = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) {
      const p = i * 4;
      if (ims.some(im => im.px[p + 3] / 255 < 0.9)) continue;
      const labs = ims.map(im => srgbToOklab(im.px[p] / 255, im.px[p + 1] / 255, im.px[p + 2] / 255));
      keep[i] = labs.slice(1).every(l => dist(l, labs[0]) < 0.002) ? 0 : 1;
    }
    const maskedLab = im => {
      const acc = [0, 0, 0]; let n = 0;
      for (let i = 0; i < w * h; i++) {
        if (!keep[i]) continue;
        const p = i * 4;
        acc[0] += im.px[p] / 255; acc[1] += im.px[p + 1] / 255; acc[2] += im.px[p + 2] / 255; n++;
      }
      return srgbToOklab(acc[0] / n, acc[1] / n, acc[2] / n);
    };
    const before = ids.map(s => lch(LAB[`reaver/${s}`])[2]);
    const mk = ids.map((s, i) => maskedLab(ims[i]));
    const after = mk.map(l => lch(l)[2]);
    // Hue lives on a circle, so the spread is the SMALLEST ARC containing every angle,
    // not max-minus-min. (max-min reported 284deg for the source palette, which is the
    // long way round the wheel and simply false — caught before it became a claim.)
    const spread = angles => {
      const a = angles.map(x => ((x % 360) + 360) % 360).sort((p, q) => p - q);
      let gap = 360 - a[a.length - 1] + a[0];
      for (let i = 1; i < a.length; i++) gap = Math.max(gap, a[i] - a[i - 1]);
      return 360 - gap;
    };
    let minMaskedPair = Infinity, mp = '';
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
      const d = dist(mk[i], mk[j]);
      if (d < minMaskedPair) { minMaskedPair = d; mp = `${ids[i]}|${ids[j]}`; }
    }
    say('');
    say('=== D11c: the masked measurement, mask derived from the assets rather than Blender ===');
    say(`  never-repainted pixels excluded; hues before -> after:`);
    ids.forEach((s, i) => say(`    reaver/${s.padEnd(10)} ${before[i].toFixed(1).padStart(7)}deg  C ${lch(LAB['reaver/' + s])[1].toFixed(4)}   ->  ${after[i].toFixed(1).padStart(7)}deg  C ${lch(mk[i])[1].toFixed(4)}`));
    const chromaDropped = ids.every((s, i) => lch(mk[i])[1] < lch(LAB['reaver/' + s])[1]);
    check('D11c', 'is the shared gold region a diluter, as 40c5b21 originally hypothesised and then retracted? (RESTATED — I declared "widens the spread by at least 1.5x" and it was REFUTED at 1.43x. I am not moving that threshold a third time: the magnitude hypothesis is withdrawn and only the direction, which the data does support, is declared.)',
      'DECLARED: the mask needs no Blender — it is derivable from the shipped assets — and excluding the never-repainted region strictly widens the reaver hue spread AND strictly lowers every one of the four chromas. Direction only, no magnitude.',
      `reaver hue spread ${spread(before).toFixed(1)}deg -> ${spread(after).toFixed(1)}deg (${(spread(after) / spread(before)).toFixed(2)}x); all four chromas dropped: ${chromaDropped}; tightest masked pair ${mp} at dE ${minMaskedPair.toFixed(4)} (whole-figure said default|warden at ${B.min.reaver.toFixed(4)})`,
      spread(after) > spread(before) && chromaDropped);

    // D11d: the finding that refuted D11c, declared as its own claim — because it is
    // the one that changes what to build next. Source hue spread is measured from
    // content/source/outfits.csv's four reaver `plate` values, not quoted from the commit.
    const REAVER_PLATE = { default: '3E6157', vigil: '302B25', oathsworn: 'B39C5E', warden: '3F4C5A' };
    const srcHues = Object.values(REAVER_PLATE).map(hex => {
      const v = i => parseInt(hex.slice(i, i + 2), 16) / 255;
      return lch(srgbToOklab(v(0), v(2), v(4)))[2];
    });
    const srcSpread = spread(srcHues);   // smallest containing arc, not max-min
    check('D11d', 'commit 40c5b21 names a masked render "unambiguously the blocker" — would it have recovered the lost hue signal?',
      'DECLARED: no. Even with the never-repainted region fully excluded, the four reaver figures span less than 45 deg of hue, i.e. masking recovers under a third of the spread present in the source palette. The compression is intrinsic to reducing a figure to one mean, not to the shared surface — so masking is not the fix and the deferred blocker was the wrong blocker.',
      `source plate hues span ${srcSpread.toFixed(1)}deg (${Object.keys(REAVER_PLATE).map((k, i) => k + ' ' + srcHues[i].toFixed(0)).join(', ')}); rendered whole-figure ${spread(before).toFixed(1)}deg; rendered MASKED ${spread(after).toFixed(1)}deg = ${(spread(after) / srcSpread * 100).toFixed(0)}% of source spread recovered`,
      spread(after) < 45);
  }

  // ---- D12: does any of this break the shipped test suite? -----------------
  // tests/engine.test.js test 34 reads audit.withinClassMin and asserts every class
  // clears 0.005 ("not literally the same image"). It is the only consumer of these
  // numbers, so whether the D1b defect changes its verdict is a question with a
  // mechanical answer, and it should not be left to prose.
  const T34 = 0.005;
  const clearsB = Object.keys(CLASSES).every(c => B.min[c] >= T34);
  const clearsA = Object.keys(CLASSES).every(c => A.min[c] >= T34);
  const marginA = Math.min(...Object.keys(CLASSES).map(c => A.min[c])) / T34;
  const marginB = Math.min(...Object.keys(CLASSES).map(c => B.min[c])) / T34;
  check('D12', 'does the D1b colour-space defect change the verdict of test 34, the only consumer of these numbers?',
    'DECLARED: no. Every class clears test 34\'s 0.005 floor in BOTH colour pipelines, and the audit\'s numbers are the LOWER of the two — so the defect makes test 34 fire early rather than late. Test 34 is not wrong today; its margin is thinner than it looks.',
    `clears 0.005 in audit space: ${clearsA} (worst margin ${marginA.toFixed(1)}x); in browser space: ${clearsB} (worst margin ${marginB.toFixed(1)}x); audit numbers are ${(marginB / marginA).toFixed(2)}x lower, i.e. conservative for this particular assertion`,
    clearsA && clearsB && marginA < marginB);

  // ---- plates for an eye that can actually see them ------------------------
  // The two tightest pairs in the game by per-pixel p90, side by side, plus the D8
  // fixture. A number cannot settle "does this read as two different suits."
  for (const k of ['reaver/default', 'reaver/warden', 'starseer/default', 'starseer/eclipse', 'starseer/astral']) {
    const c = plate(IMG[k].px, IMG[k].w, IMG[k].h, k);
    PLATES['fig-' + k.replace('/', '-')] = c.toDataURL('image/png');
  }

  // ---- the two repainted pairs, since that is the open question ------------
  say('');
  say('=== THE TWO PAIRS REPAINTED AT 40c5b21, measured per-pixel ===');
  say('  Wayfarer Plate = reaver/default (verdigris) · Astral Vestment = starseer/astral (magenta)');
  for (const k of ['reaver/default|oathsworn', 'reaver/default|vigil', 'reaver/default|warden',
                   'starseer/astral|default', 'starseer/astral|eclipse', 'starseer/astral|starlit']) {
    const r = PP[k];
    if (!r) { say(`  ${k}: not measured`); continue; }
    const [cls, pair] = k.split('/'); const [a, b] = pair.split('|');
    const mE = dist(LAB[`${cls}/${a}`], LAB[`${cls}/${b}`]);
    say(`  ${k.padEnd(27)} mean-dE ${mE.toFixed(4)}  per-pixel median ${r.median.toFixed(4)}  p90 ${r.p90.toFixed(4)}  moved ${(r.repainted * 100).toFixed(1)}%`);
  }

  // ---- verdict -------------------------------------------------------------
  say('');
  const refuted = CHECKS.filter(c => c.claim === 'REFUTED');
  const unknown = CHECKS.filter(c => c.claim === 'UNKNOWN');
  for (const [k, v] of Object.entries(PLATES)) say(`PLATE ${k} ${v}`);
  say('');
  say(`CHECKS ${CHECKS.length}  UPHELD ${CHECKS.length - refuted.length - unknown.length}  REFUTED ${refuted.length}  UNKNOWN ${unknown.length}`);
  if (refuted.length) say('REFUTED_IDS ' + refuted.map(c => c.id).join(','));
  if (unknown.length) say('UNKNOWN_IDS ' + unknown.map(c => c.id).join(','));
  say(`RESULT=${refuted.length === 0 && unknown.length === 0 ? 'PASS' : 'FAIL'}`);
  say('END EVIDENCE');
}

main().then(() => { document.getElementById('out').textContent = LOG.join('\n'); })
      .catch(e => { document.getElementById('out').textContent =
        'BEGIN EVIDENCE\nPROBE_ERROR ' + (e && e.stack || e) + '\nRESULT=FAIL\nEND EVIDENCE'; });
</script>
