<!doctype html><html lang="en" data-effects="on"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recipient effects runtime QA</title>
<style>body{margin:0;background:#121b21;color:#ecf2f4;font:16px system-ui}header{padding:16px 24px}h1{font-size:24px;margin:0}p{margin:8px 0}#stage{width:1536px;height:1024px;position:relative;transform-origin:top left}.scene,#effect-layer{position:absolute;inset:0;width:100%;height:100%}.combatant{position:absolute}.sprite{position:absolute;inset:0}.sprite canvas{width:100%;height:100%}.combatant-card{position:absolute;inset:-12px;border:1px solid #b8ad9440;border-radius:12px}.actor-label{position:absolute;top:100%;left:-10%;width:120%;text-align:center;color:#fff3d8;background:#121a1cb8}#effect-layer{pointer-events:none}#viewport{overflow:hidden;width:100%}</style>
<header><h1>Recipient effect review</h1><div id="controls" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px">
<label>Action <select id="action"><option>attack</option><option>smash</option><option>sweep</option><option>skill</option><option>casting</option></select></label>
<label>Camp <select id="camp"><option>physical</option><option>spell</option></select></label>
<label>Color <select id="school"><option>none</option><option>fire</option><option>frost</option><option>lightning</option><option>earth</option><option>force</option><option>alteration</option><option>illusion</option><option>divine</option><option>decay</option></select></label>
<label>Range <select id="range"><option>melee</option><option>reach</option></select></label>
<label>Invoker <select id="invoker"><option value="player">Player</option><option value="enemy-1">Enemy</option></select></label>
<label>Recipient <select id="recipient"><option value="enemy-1">Enemy</option><option value="player">Player</option></select></label>
<label>Outcome <select id="outcome"><option>hit</option><option>ward</option><option>evade</option><option>heal</option><option>bleed</option><option>block-hit</option><option>block-break</option><option>poise-hit</option><option>poise-break</option><option>wisdom</option><option>stamina</option><option>mana</option><option>strength</option><option>dexterity</option><option>intelligence</option><option>constitution</option><option>charisma</option><option>precision</option><option>weak</option><option>burn</option></select></label>
<button id="play">Play</button><button id="pause">Pause</button><label>Time <input id="scrub" type="range" min="0" max="1000" value="150"></label><span id="clock"></span><label><input id="fallback" type="checkbox">Debug fallback</label></div><p id="case">Loading actual game artwork…</p></header><div id="viewport"><div id="stage"><canvas class="scene" width="1536" height="1024"></canvas><div id="effect-layer"></div></div></div>
<script type="module">
import { alternativeArtCatalog as art } from '../src/ui/alternativeArtCatalog.js';
import * as renderer from '../src/ui/recipientEffectSprites.js';
import * as model from '../src/model/recipientEffects.js';
import { SETTINGS } from '../src/content/recipientEffectSettings.js';
import { RECIPIENT_EFFECT_ATLAS } from '../src/content/recipientEffectAtlas.js';
import { setBuiltInSource, assetUrl } from '../src/ui/assetmap.js';
const stage=document.querySelector('#stage'),layer=document.querySelector('#effect-layer'),scene=stage.querySelector('.scene');
const image=url=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>resolve(null);i.src=url});
const path=p=>new URL('../'+p,import.meta.url).href;
for(const item of art.scenes['ashen-crown-1'].devices.desktop.layers){const im=await image(path(art.sceneLayers[item.id].path));if(im)scene.getContext('2d').drawImage(im,item.x,item.y,item.width,item.height)}
const definitions=[['player','reaver-default',330,913,318],['enemy-1','fellWarden',825,625,252],['enemy-2','wanderingSoldier',1080,605,226],['enemy-3','blightHound',1335,628,182]];
const actors={};
for(const[id,key,cx,foot,height]of definitions){const def=art.sprites[key],b=def.bounds,width=height*(b[2]-b[0])/(b[3]-b[1]);const host=document.createElement('div');host.className='combatant '+(id==='player'?'player':'enemy');host.style.cssText=`left:${cx-width/2}px;top:${foot-height}px;width:${width}px;height:${height}px`;host.innerHTML='<div class="combatant-card"></div><div class="sprite"><canvas></canvas></div><span class="actor-label">'+id+' · actual game art</span>';stage.insertBefore(host,layer);const sprite=host.querySelector('.sprite'),c=sprite.querySelector('canvas');c.width=Math.ceil(width);c.height=height;const im=await image(path(def.path));if(!im)host.querySelector('.actor-label').textContent=id+' / actor art unavailable';if(im)c.getContext('2d').drawImage(im,b[0]*im.width/def.size[0],b[1]*im.height/def.size[1],(b[2]-b[0])*im.width/def.size[0],(b[3]-b[1])*im.height/def.size[1],0,0,c.width,c.height);actors[id]={sprite,host,box:{left:cx-width/2,top:foot-height,width,height},source:def.path};}
function resize(){const scale=Math.min(1,innerWidth/1536);stage.style.transform=`scale(${scale})`;document.querySelector('#viewport').style.height=1024*scale+'px'}addEventListener('resize',resize);resize();
function artMode(present=true){const map=new Map([['qa/sentinel','data:,art-pack-active']]),artRoot=new URLSearchParams(location.search).get('artRoot');if(present)for(const a of Object.values(RECIPIENT_EFFECT_ATLAS))map.set(a.asset,artRoot?new URL(a.asset,new URL(artRoot,location.href)).href:path(a.asset));setBuiltInSource(map);return present?(artRoot?'explicit local staged art':'pinned/cache art via source server'):'static debug fallback';}
function cardBox(id){const b=actors[id].box;return{left:b.left-12,top:b.top-12,width:b.width+24,height:b.height+24}}
async function show(recipe,{id='enemy-1',frame=1,art=true,label=recipe.shape,duration=10000}={}){renderer.ClearRecipientEffects(layer);artMode(art);if(art)await renderer.PrewarmRecipientEffect(recipe);const a=actors[id];document.querySelector('#case').textContent=label+' · '+artMode(art);renderer.PlayRecipientEffect(layer,a.box,recipe,{actor:a.sprite,cardBox:cardBox(id),targetFacing:id==='player'?'back':'front',sourceBox:actors[recipe.sourceId||document.querySelector('#invoker').value]?.box,frame,duration});return snapshot();}
function snapshot(){return{settings:SETTINGS,actors:Object.fromEntries(Object.entries(actors).map(([id,a])=>[id,{box:a.box,cardBox:cardBox(id),source:a.source}])),effects:[...layer.querySelectorAll('.recipient-effect')].map(n=>({dataset:{...n.dataset},left:parseFloat(n.style.left),top:parseFloat(n.style.top),width:parseFloat(n.style.width),height:parseFloat(n.style.height),planes:[...n.querySelectorAll('canvas')].map(c=>({dataset:{...c.dataset},width:c.width,height:c.height,pixels:(()=>{const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let count=0,y=0;for(let i=3;i<d.length;i+=4)if(d[i]>0){count++;y+=Math.floor(i/4/c.width)}return{count,centerY:count?y/count:null}})()}))}))};}
async function playLayers(recipes,{art=true}={}){renderer.ClearRecipientEffects(layer);artMode(art);if(art)await Promise.all(recipes.map(r=>renderer.PrewarmRecipientEffect(r)));renderer.PlayRecipientEffectLayers(layer,recipes,{anchorFor:id=>actors[id]?.sprite,sourceId:document.querySelector('#invoker').value,targetId:document.querySelector('#recipient').value});}
window.integrationQA={ready:true,model,renderer,SETTINGS,show,snapshot,playLayers,artMode,layer,actors};artMode();document.querySelector('#case').textContent='Ready · actual art + production modules';

let reviewRecipes=[],reviewTime=0,reviewEnd=1000,playTimer=null;
const control=id=>document.getElementById(id);
function reviewInput(){const targetId=control('recipient').value,sourceId=control('invoker').value,outcome=control('outcome').value;const action={sourceId,tags:['camp:'+control('camp').value,'maneuver:'+control('action').value,'range:'+control('range').value,...(control('school').value==='none'?[]:['school:'+control('school').value])]};let event={type:'damageDealt',sourceId,targetId,amount:8,hpRemoved:8};
if(outcome==='ward')event={type:'persistentWardChanged',sourceId,targetId,restored:5};else if(outcome==='evade')event={type:'combatAvoidanceResolved',sourceId,targetId,avoided:true};else if(outcome==='heal')event={type:'healed',sourceId,targetId,amount:5};else if(outcome==='stamina'||outcome==='mana')event={type:outcome==='stamina'?'staminaRecovered':'manaRestored',sourceId,targetId,amount:3};else if(outcome.endsWith('-break'))event={type:outcome==='block-break'?'blockBroken':'poiseBroken',sourceId,targetId};else if(outcome.endsWith('-hit'))event={...event,hpRemoved:0,...(outcome==='block-hit'?{blocked:8}:{poiseAbsorbed:8})};else if(outcome!=='hit')event={type:'statusApplied',sourceId,targetId,status:outcome,stacks:2};
let clips=model.RecipientEffectsForEvent(action,event);if(control('action').value==='sweep'&&outcome==='hit'&&targetId!=='player')clips=clips.map(r=>({...r,mount:'group',targetType:'aoe',targetIds:['enemy-1','enemy-2','enemy-3'],groupKey:'preview-sweep'}));const windup=model.RecipientWindupFor(action,{sourceId});if(windup){clips=clips.map(r=>({...r,delayMs:(r.delayMs||0)+windup.durationMs}));clips.unshift(windup);}return clips;}
async function refresh(){clearInterval(playTimer);reviewRecipes=reviewInput();reviewEnd=Math.max(...reviewRecipes.map(r=>(r.delayMs||0)+r.durationMs),300);control('scrub').max=reviewEnd;artMode(!control('fallback').checked);await Promise.all(reviewRecipes.map(r=>renderer.PrewarmRecipientEffect(r)));await scrub(Math.min(150,reviewEnd));}
async function scrub(ms){reviewTime=Number(ms);renderer.ClearRecipientEffects(layer);artMode(!control('fallback').checked);for(const r of reviewRecipes){const t=reviewTime-(r.delayMs||0);if(t<0||t>=r.durationMs)continue;renderer.PlayRecipientEffectLayers(layer,[{...r,delayMs:0,durationMs:10000}],{anchorFor:id=>actors[id]?.sprite,sourceId:r.sourceId,targetId:r.targetId,frame:Math.min(2,Math.floor(t/r.durationMs*3)),forcePlaceholder:control('fallback').checked});}control('scrub').value=reviewTime;control('clock').textContent=Math.round(reviewTime)+' / '+reviewEnd+' ms';control('case').textContent='Production modules / '+artMode(!control('fallback').checked)+' / exact authored colors and timing';}
control('play').onclick=()=>{clearInterval(playTimer);reviewTime=0;const start=performance.now();playTimer=setInterval(()=>{scrub(Math.min(reviewEnd,performance.now()-start));if(reviewTime>=reviewEnd)clearInterval(playTimer)},30)};
control('pause').onclick=()=>clearInterval(playTimer);control('scrub').oninput=()=>{clearInterval(playTimer);scrub(control('scrub').value)};for(const id of ['action','camp','school','range','invoker','recipient','outcome','fallback'])control(id).onchange=refresh;
async function configure(values={}){for(const[id,value]of Object.entries(values)){const node=control(id);if(!node)throw new Error('Unknown preview control: '+id);if(node.type==='checkbox')node.checked=!!value;else node.value=String(value);}await refresh();return{invoker:control('invoker').value,recipient:control('recipient').value,recipes:reviewRecipes,durationMs:reviewEnd};}
await refresh();window.recipientRuntimePreview={refresh,scrub,configure,get invoker(){return control('invoker').value},get recipient(){return control('recipient').value},get recipes(){return reviewRecipes},get durationMs(){return reviewEnd}};
</script></html>
