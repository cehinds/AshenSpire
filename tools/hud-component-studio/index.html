<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AshenSpire · HUD Component Studio</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='2' y='26' font-size='28' fill='%23d6af68'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="studio.css"></head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark">✦</span><div><strong>HUD Component Studio</strong><small>ASHENSPIRE / VISUAL AUTHORING</small></div></div><div class="history"><button id="undo" title="Undo (Ctrl+Z)">↶ Undo</button><button id="redo" title="Redo (Ctrl+Y)">↷ Redo</button></div><div class="file-actions"><button id="import">Import JSON</button><button id="export">Export JSON</button><button id="exportCss" title="Write CSS token JSON files for the HUD layout">Export CSS JSON ▾</button><button id="importCss" title="Read a CSS token JSON file back into this form factor">Import CSS JSON</button><button id="png">Export PNG ▾</button><button id="reset">Reset ▾</button></div></header>
<nav class="viewbar"><div class="states" id="states" aria-label="Combat views"></div><div class="formfactors" id="formFactors" role="group" aria-label="Form factor"></div><label class="scope"><input type="checkbox" id="allViews"> Edit all views</label><span id="saveStatus">Saved locally</span></nav>
<main class="workspace"><aside class="layers"><div class="panel-title"><strong>Layers</strong><span id="layerCount"></span></div><div class="search-wrap"><input id="search" placeholder="Search components…" aria-label="Search layers"></div><div class="layer-tools"><button id="expandAll">Expand all</button><button id="collapseAll">Collapse all</button></div><div id="tree" class="tree" role="tree"></div><div class="layer-bottom"><button id="addText">+ Text</button><button id="addRect">+ Shape</button><button id="addGroup">+ Group</button></div></aside>
<section class="canvas-panel"><div class="canvas-toolbar"><div><button id="selectTool" class="active" title="Select and move">↖ Select</button><button id="panTool" title="Drag canvas to pan">✥ Pan</button></div><div class="zoom-tools"><button id="zoomOut" aria-label="Zoom out">−</button><button id="fit">Fit</button><button id="zoomIn" aria-label="Zoom in">+</button><span id="zoomLabel">100%</span></div><div class="canvas-options"><label><input id="snap" type="checkbox"> Snap</label><label><input id="outlines" type="checkbox"> Outlines</label><label><input id="reference" type="checkbox"> Reference</label><input id="refOpacity" type="range" min="0" max="1" step=".01" value=".35" aria-label="Reference opacity" title="Reference opacity"></div></div><div id="viewport" class="viewport"><div id="sceneHost"><svg id="scene" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Editable combat HUD"></svg><svg id="selection" xmlns="http://www.w3.org/2000/svg" aria-label="Selection handles"></svg></div><div id="emptyTip">Select a component on the canvas or in Layers.</div><div id="loading" class="loading" role="status"><span>✦</span><strong>Loading scene assets…</strong><small>The canvas will appear when the artwork is ready.</small></div></div><footer class="canvas-footer"><span id="selectionStatus">No selection</span><span>Drag to move · handles to resize · right-click for overlapping layers</span><button id="help">Help</button></footer></section>
<aside class="inspector"><div class="panel-title"><strong>Inspector</strong><span id="scopeLabel">THIS VIEW</span></div><div id="inspector"></div></aside></main>
<div id="popup" class="popup" hidden></div><div id="toast" role="status" class="toast" hidden></div><dialog id="dialog"><form method="dialog"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="dialog-actions"><button value="cancel">Cancel</button><button id="dialogConfirm" value="confirm" class="primary">Confirm</button></div></form></dialog><input id="importFile" type="file" accept="application/json,.json" hidden><input id="importCssFile" type="file" accept="application/json,.json" hidden>
<script src="css-export.js"></script>
<script src="project.js"></script>
<script src="studio.js" defer></script>
</body></html>
