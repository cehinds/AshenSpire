<text x="44" y="688" class="heading" text-anchor="start">Generation contract</text>
<text x="44" y="722" class="body" text-anchor="start">Filter compatible rotations → choose by seeded weights → check all neighbors → backtrack when needed.</text>
<text x="44" y="754" class="body" text-anchor="start">Closed map boundaries · bounded search · no rule relaxation · same seed + same sources = same layout</text>
<text x="44" y="779" class="small" text-anchor="start">Offline prototype data; game rendering, object placement and gameplay wiring are separate integration steps.</text>
