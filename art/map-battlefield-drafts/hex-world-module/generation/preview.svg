<text x="44" y="565" class="body" text-anchor="start">Gold: dirt road       Blue arrows: river flow</text>
<text x="44" y="595" class="small" text-anchor="start">Terrain and route properties match across each shared side.</text>
<text x="648" y="132" class="heading" text-anchor="start">Allowed and rejected connections</text>
<text x="650" y="178" class="body" text-anchor="start">dirt + road</text>
<text x="871" y="178" class="body" text-anchor="start">↔</text>
<text x="905" y="178" class="body" text-anchor="start">dirt + road</text>
<text x="650" y="201" class="small" style="fill:#589a76">MATCH</text>
<text x="650" y="241" class="body" text-anchor="start">dirt + road</text>
<text x="871" y="241" class="body" text-anchor="start">↔</text>
<text x="905" y="241" class="body" text-anchor="start">stone + road</text>
<text x="650" y="264" class="small" style="fill:#c98377">REJECT</text>
<text x="650" y="304" class="body" text-anchor="start">dirt + road</text>
<text x="871" y="304" class="body" text-anchor="start">↔</text>
<text x="905" y="304" class="body" text-anchor="start">dirt only</text>
<text x="650" y="327" class="small" style="fill:#c98377">REJECT</text>
<text x="650" y="367" class="body" text-anchor="start">water + river OUT</text>
<text x="871" y="367" class="body" text-anchor="start">↔</text>
<text x="905" y="367" class="body" text-anchor="start">water + river IN</text>
<text x="650" y="390" class="small" style="fill:#589a76">MATCH</text>
<text x="650" y="430" class="body" text-anchor="start">water + river IN</text>
<text x="871" y="430" class="body" text-anchor="start">↔</text>
<text x="905" y="430" class="body" text-anchor="start">water + river IN</text>
<text x="650" y="453" class="small" style="fill:#c98377">REJECT</text>
<text x="650" y="493" class="body" text-anchor="start">grass</text>
<text x="871" y="493" class="body" text-anchor="start">↔</text>
<text x="905" y="493" class="body" text-anchor="start">forest</text>
