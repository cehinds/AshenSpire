<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AshenSpire · Painted character art</title>
<style>
:root{color-scheme:dark;font-family:system-ui;background:#12110f;color:#ddd4c1}body{margin:0;padding:24px;max-width:1600px;margin:auto}h1{font-family:Georgia;font-size:30px;color:#e9d5a1;margin:0 0 8px}p{color:#aca394}header{margin-bottom:24px}button,select,a{font:inherit;color:inherit}button,select{background:#24211c;border:1px solid #66583e;border-radius:6px;padding:10px 14px;cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #efd178;outline-offset:3px}button[aria-pressed=true]{background:#554527;border-color:#c5a668}nav,.controls{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}main{min-height:65vh}.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:18px}.card{border:1px solid #494131;background:#1c1914;border-radius:8px;padding:16px}.card h2{font-size:17px;margin:0 0 12px}.portrait{width:100%;aspect-ratio:1;object-fit:contain;background:#15130f}.presentations{display:flex;gap:6px}.presentations img{width:48%;object-fit:contain}.combat-row{margin:18px 0;border-bottom:1px solid #494131;padding-bottom:18px}.combat-row h2{font-size:17px}.frames{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}figure{margin:0;background:#191712;border:1px solid #383022;overflow:hidden}figure img{display:block;width:100%;height:auto}figcaption{text-align:center;color:#cdb574;padding:6px;font-size:12px}.player{max-width:600px;margin:auto}.player img{width:100%;display:block}.status{text-align:center}.atlas{width:100%;height:auto}.atlas-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}a{color:#dfc27c}.hint{font-size:13px}@media(max-width:650px){body{padding:14px}.frames{grid-template-columns:repeat(2,1fr)}}
</style>
<header><h1>Painted character collection</h1><p>Sixteen outfits · menu artwork and portraits · compact combat frames</p><p class="hint">Art preview. These assets are not installed in the game.</p></header>
<nav aria-label="Artwork view"><button data-mode="menu" aria-pressed="true">Menu &amp; details</button><button data-mode="combat" aria-pressed="false">Combat frames</button><button data-mode="play" aria-pressed="false">Animation preview</button><button data-mode="library" aria-pressed="false">All source poses</button></nav>
<div class="controls"><label>Class <select id="class"><option value="all">All classes</option><option>rogue</option><option>reaver</option><option>starseer</option><option>herald</option></select></label><label id="outfit-label" hidden>Outfit <select id="outfit"></select></label><label id="action-label" hidden>Action <select id="action"><option value="attack">Attack</option><option value="guard">Guard</option><option value="hit">Hit reaction</option><option value="idle">Idle</option></select></label><button id="pause" hidden>Pause</button><button id="step" hidden>Next frame</button><label id="speed-label" hidden>Speed <select id="speed"><option value="1">Normal</option><option value="0.5">Half speed</option><option value="0.25">Quarter speed</option></select></label></div>
<main id="main" aria-live="polite"></main><script type="module">
const manifest=await fetch('manifest.json').then(r=>r.json()), library=await fetch('library.json').then(r=>r.json());
window.artManifest=manifest;
const main=document.querySelector('#main'),cls=document.querySelector('#class'),outfit=document.querySelector('#outfit'),action=document.querySelector('#action');
let mode='menu',paused=matchMedia('(prefers-reduced-motion: reduce)').matches,cursor=0,last=0,current=null;
const sequences={idle:[['idle',1200]],guard:[['idle',500],['guard',1100],['idle',500]],hit:[['idle',600],['hit',230],['idle',700]],attack:[['idle',650],['attack1',190],['attack2',120],['attack3',140],['attack4',240],['idle',650]]};
function element(tag,attrs={},...children){const n=document.createElement(tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);for(const c of children.flat())n.append(c);return n}
function picture(src,alt,css=''){return element('img',{src,alt,class:css,loading:'eager'})}
function filtered(){return manifest.outfits.filter(o=>cls.value==='all'||o.id.split('-')[0]===cls.value)}
function render(){
 main.replaceChildren();current=null;cursor=0;last=performance.now();
 const rows=filtered();
 for(const id of ['outfit-label','action-label','pause','step','speed-label'])document.getElementById(id).hidden=mode!=='play';
 if(mode==='menu'){const grid=element('div',{class:'menu-grid'});for(const o of rows)grid.append(element('article',{class:'card'},element('h2',{},o.name),picture(o.menu.portrait,o.name+' close-up portrait','portrait'),element('div',{class:'presentations'},picture(o.menu.stand,o.name+' standing pose'),picture(o.menu.detail,o.name+' detail pose'))));main.append(grid)}
 if(mode==='combat'){for(const o of rows)main.append(element('section',{class:'combat-row'},element('h2',{},o.name),element('div',{class:'frames'},o.frames.map(f=>element('figure',{},picture(f.file,o.name+' '+f.pose),element('figcaption',{},f.pose))))))}
 if(mode==='library'){main.append(element('p',{},'Complete original sheets are preserved here, including poses outside the small combat set.'));const grid=element('div',{class:'atlas-list'});for(const f of library.filter(f=>cls.value==='all'||f.classId===cls.value))grid.append(element('article',{class:'card'},element('h2',{},f.title),element('a',{href:f.file,target:'_blank'},picture(f.file,f.title,'atlas'))));main.append(grid)}
 if(mode==='play'){const selected=outfit.value;outfit.replaceChildren(...rows.map(o=>element('option',{value:o.id},o.name)));outfit.value=rows.some(o=>o.id===selected)?selected:rows[0].id;current=rows.find(o=>o.id===outfit.value);main.append(element('section',{class:'player'},element('h2',{},current.name),picture(current.frames[0].file,current.name+' animation frame'),element('p',{class:'status'}),element('p',{class:'hint'},'Frame swaps at fixed scale and ground alignment. Use quarter speed or Next frame to inspect transitions.')));draw()}
}
function draw(){if(!current)return;const pose=sequences[action.value][cursor][0],f=current.frames.find(f=>f.pose===pose);main.querySelector('.player img').src=f.file;main.querySelector('.status').textContent=pose+' · '+(cursor+1)+' / '+sequences[action.value].length}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
cls.onchange=render;outfit.onchange=render;action.onchange=render;
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Play':'Pause';last=performance.now()};
document.querySelector('#pause').textContent=paused?'Play':'Pause';
document.querySelector('#step').onclick=()=>{paused=true;document.querySelector('#pause').textContent='Play';cursor=(cursor+1)%sequences[action.value].length;draw()};
function tick(now){if(current&&!paused&&now-last>=sequences[action.value][cursor][1]/Number(document.querySelector('#speed').value)){cursor=(cursor+1)%sequences[action.value].length;last=now;draw()}requestAnimationFrame(tick)}
render();requestAnimationFrame(tick);
</script></html>
