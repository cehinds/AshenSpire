<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AshenSpire · Starting equipment review</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#100e0b;color:#ebdfc7;font:15px system-ui}header{padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #695334}strong{color:#d0ac5d}select,button,a{font:inherit;background:#282015;color:#ebdfc7;border:1px solid #806638;border-radius:5px;padding:7px}a{text-decoration:none}p{margin:0;color:#baa98c;font-size:13px}iframe{display:block;border:0;width:100%;height:calc(100dvh - 110px);margin:auto}body[data-width=tablet] iframe{max-width:1024px}body[data-width=phone] iframe{max-width:390px}
</style></head><body><header><strong>Starting equipment</strong><label>Class <select id="class"></select></label><label>View <select id="width"><option value="desktop">Desktop</option><option value="tablet">Tablet</option><option value="phone">Phone</option></select></label><button id="reset">Reset choices</button><a id="full" target="_blank">Full-size game ↗</a><p>Choose equipment or Empty Hand, inspect the combat cards, then Continue. These test runs use disposable state.</p></header><iframe id="game" title="Playable starting equipment selector"></iframe><script type="module">
import {contentBundle} from './src/content/index.js';
const game=document.querySelector('#game'),classes=document.querySelector('#class');
for(const cls of contentBundle.classes){const option=document.createElement('option');option.value=cls.id;option.textContent=cls.name;classes.append(option);}
function reset(){const url=`index.html?shot=customize&shotClass=${encodeURIComponent(classes.value)}`;game.src=url;document.querySelector('#full').href=url;}
game.addEventListener('load',()=>{const doc=game.contentDocument;const open=()=>{const face=doc.querySelector('[data-face="equipment"]');if(!face)return false;face.click();doc.querySelector('[data-face="rightHand"]')?.click();doc.querySelector('[data-equipment-section="rightHand"]')?.scrollIntoView({block:'start'});return true;};if(!open()){const observer=new MutationObserver(()=>{if(open())observer.disconnect();});observer.observe(doc,{childList:true,subtree:true});}});
classes.addEventListener('change',reset);document.querySelector('#reset').addEventListener('click',reset);document.querySelector('#width').addEventListener('change',e=>document.body.dataset.width=e.target.value);reset();
</script></body></html>
