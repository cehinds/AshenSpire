<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AshenSpire · Folding Tray Gallery</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/ui.css">
  <style>
    body { min-height:100vh; margin:0; background:radial-gradient(circle at 50% -10%,#33261a 0,#100e0c 52rem); color:var(--parchment); overflow:auto; }
    .gallery { width:min(1380px,calc(100% - 32px)); margin:0 auto; padding:28px 0 56px; }
    .gallery-head { display:flex; justify-content:space-between; gap:20px; align-items:end; padding-bottom:18px; border-bottom:1px solid var(--line); }
    .gallery-head h1 { margin:0; font:700 clamp(2.2rem,4vw,4rem)/1.1 var(--font-display); color:var(--parchment); }
    .gallery-head h1 span, .gallery-head a { color:var(--gold); }
    .gallery-head p { max-width:72rem; margin:.7rem 0 0; color:var(--muted); }
    .gallery-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1.6rem; margin-top:2rem; }
    .tray-gallery-card { min-width:0; border:1px solid var(--line-soft); border-radius:1rem; background:color-mix(in srgb,var(--panel) 86%,transparent); overflow:hidden; }
    .state-label { display:flex; justify-content:space-between; gap:1rem; padding:.8rem 1rem; color:var(--muted); font:1.1rem ui-monospace,monospace; letter-spacing:.08em; text-transform:uppercase; border-bottom:1px solid var(--line-soft); }
    .tray-gallery-cell { display:flex; min-width:0; min-height:18rem; background:#0c0b09; }
    .tray-gallery-cell[data-edge='top'], .tray-gallery-cell[data-edge='bottom'] { flex-direction:column; }
    .tray-gallery-cell[data-edge='right'] { flex-direction:row; justify-content:flex-end; }
    .tray-gallery-cell[data-edge='left'] { flex-direction:row; justify-content:flex-start; }
    .tray-gallery-cell .folding-tray[data-collapsed='0'] { flex:1 1 auto; }
    .tray-gallery-cell .folding-tray[data-collapsed='1'][data-tray-edge='top'],
    .tray-gallery-cell .folding-tray[data-collapsed='1'][data-tray-edge='bottom'] { flex:0 0 auto; }
    .tray-gallery-cell .folding-tray[data-collapsed='1'][data-tray-edge='right'],
    .tray-gallery-cell .folding-tray[data-collapsed='1'][data-tray-edge='left'] { min-height:18rem; }
    .gallery-items { display:grid; gap:.45rem; padding:1rem 0; }
    .gallery-item { display:flex; justify-content:space-between; gap:1rem; padding:.7rem .9rem; border:1px solid var(--line-soft); background:#15110e; color:var(--parchment); }
    .gallery-item small { color:var(--muted); }
    @media (max-width:760px) {
      .gallery-grid { grid-template-columns:1fr; }
      .gallery-head { align-items:start; flex-direction:column; }
    }
  </style>
</head>
<body>
  <main class="gallery">
    <header class="gallery-head">
      <div><h1>Folding <span>Tray</span> gallery</h1><p>All four anchors, folded and unfolded. Each specimen uses the production <code>trayModel</code> and <code>renderTray</code>; click its header to reverse that specimen.</p></div>
      <a href="component-catalog.html">Back to component catalog</a>
    </header>
    <section class="gallery-grid" id="gallery" aria-label="Folding Tray states"></section>
  </main>
  <script type="module">
    import { trayModel } from '../src/ui/models/TrayModels.js';
    import { renderTray } from '../src/ui/components/trayComponents.js';
    import { componentModel } from '../src/ui/models/ComponentModel.js';
    import { UI_COMPONENTS as UI } from '../src/ui/models/UiComponentId.js';

    const host = document.querySelector('#gallery');
    const edges = ['top', 'right', 'bottom', 'left'];
    const records = [];

    function draw(record) {
      record.cell.replaceChildren();
      const itemModel = componentModel(UI.armouryInventory);
      const model = trayModel({
        id: `${record.edge}-${record.initial ? 'open' : 'closed'}`,
        name: `${record.edge.toUpperCase()} TRAY`,
        count: 3,
        itemType: 'item',
        edge: record.edge,
        expanded: record.expanded,
        sortable: record.expanded,
        items: [itemModel],
      });
      const rendered = renderTray(model, {
        onToggle: () => { record.expanded = !record.expanded; draw(record); },
        onSort: () => {},
        renderContent: (content) => {
          content.innerHTML = '<div class="gallery-items"><div class="gallery-item"><span>Wayfarer Plate</span><small>Armour ×1</small></div><div class="gallery-item"><span>Straight Sword</span><small>Weapon ×1</small></div><div class="gallery-item"><span>Gold Sigil</span><small>Relic ×1</small></div></div>';
        },
      });
      record.cell.appendChild(rendered.element);
      record.label.textContent = record.expanded ? 'Unfolded' : 'Folded';
    }

    for (const edge of edges) {
      for (const expanded of [false, true]) {
        const card = document.createElement('article');
        card.className = 'tray-gallery-card';
        card.innerHTML = `<div class="state-label"><strong>${edge} tray</strong><span></span></div><div class="tray-gallery-cell" data-edge="${edge}"></div>`;
        host.appendChild(card);
        const record = { edge, expanded, initial: expanded, cell:card.querySelector('.tray-gallery-cell'), label:card.querySelector('.state-label span') };
        records.push(record);
        draw(record);
      }
    }
  </script>
</body>
</html>
