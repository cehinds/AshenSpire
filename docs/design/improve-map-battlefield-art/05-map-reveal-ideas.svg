="23" fill="#29433f" >Map layers · bottom to top</text><rect x="36" y="736" width="232" height="60" rx="12" fill="#e0e8d9" stroke="none"/><text x="50" y="774" font-size="17" fill="#29433f" >01  Terrain</text><rect x="280" y="736" width="232" height="60" rx="12" fill="#e0e8d9" stroke="none"/><text x="294" y="774" font-size="17" fill="#29433f" >02  Water + roads</text><rect x="524" y="736" width="232" height="60" rx="12" fill="#b4d2b2" stroke="none"/><text x="538" y="774" font-size="17" fill="#29433f" >03  PNG props</text><rect x="768" y="736" width="232" height="60" rx="12" fill="#e0e8d9" stroke="none"/><text x="782" y="774" font-size="17" fill="#29433f" >04  Discovery / fog</text><rect x="1012" y="736" width="232" height="60" rx="12" fill="#e0e8d9" stroke="none"/><text x="1026" y="774" font-size="17" fill="#29433f" >05  Selection + UI</text><text x="36" y="830" font-size="14" fill="#677b71" >Grid and tile labels remain OFF until separately enabled. Diagram colors explain reveal states.</text></g></svg>