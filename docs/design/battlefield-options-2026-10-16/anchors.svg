<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><style>text{font-family:Arial,sans-serif}</style><rect x="0" y="0" width="1440" height="900" rx="0" fill="#17232b" stroke="#17232b"/><text x="42" y="62" font-size="34" fill="#e3edf1" text-anchor="start">COMMON TO ALL OPTIONS</text><text x="42" y="109" font-size="23" fill="#aabfc8" text-anchor="start">Formation row labels A/B/C are independent of option letters A–G.</text><text x="65" y="200" font-size="28" fill="#e3edf1" text-anchor="start">ROW A · enemy back</text><path d="M155 250 L475 250 L385 485 L65 485 Z" fill="#304343" stroke="#9eb9b6" stroke-width="3"/><circle cx="405.8" cy="297.0" r="12" fill="#efc283"/><text x="235" y="535" font-size="26" fill="#efc283" text-anchor="middle">TOP RIGHT</text><text x="525" y="200" font-size="28" fill="#e3edf1" text-anchor="start">ROW B · enemy front</text><path d="M615 250 L935 250 L845 485 L525 485 Z" fill="#304343" stroke="#9eb9b6" stroke-width="3"/><circle cx="592.4000000000001" cy="442.7" r="12" fill="#efc283"/><text x="695" y="535" font-size="26" fill="#efc283" text-anchor="middle">BOTTOM LEFT</text><text x="985" y="200" font-size="28" fill="#e3edf1" text-anchor="start">ROW C · player</text><path d="M1075 250 L1395 250 L1305 485 L985 485 Z" fill="#304343" stroke="#9eb9b6" stroke-width="3"/><circle cx="1161.2" cy="442.7" r="12" fill="#efc283"/><text x="1155" y="535" font-size="26" fill="#efc283" text-anchor="middle">BOTTOM CENTER</text><text x="65" y="640" font-size="25" fill="#e3edf1" text-anchor="start">SCENE</text><text x="65" y="680" font-size="26" fill="#bdd2dd" text-anchor="start">Less zoom, lower ground, visible sky across the upper scene.</text><text x="65" y="748" font-size="25" fill="#e3edf1" text-anchor="start">FIGURES</text><text x="65" y="788" font-size="26" fill="#bdd2dd" text-anchor="start">Foot anchors stay inside cells. Shadow width follows visible art.</text><text x="65" y="855" font-size="24" fill="#e0d3ac" text-anchor="start">Every option: larger vitals, turn label, mini HUD, cards and footer controls.</text></svg>