<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="Verdana, Geneva, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16110c"/><stop offset="1" stop-color="#0d0b08"/>
    </linearGradient>
    <linearGradient id="cardface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241e15"/><stop offset="1" stop-color="#1a1510"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0.12"/><stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <text x="640" y="748" fill="#7a6f5a" font-size="13" text-anchor="middle" font-style="italic">UI mockup — combat screen, 1280×720 reference (annotations in grey-gold are not part of the UI)</text>

  <!-- ============ TOP BAR ============ -->
  <rect x="0" y="0" width="1280" height="56" fill="#171310"/>
  <line x1="0" y1="56" x2="1280" y2="56" stroke="#3a3226" stroke-width="1"/>
  <!-- portrait -->
  <circle cx="38" cy="28" r="21" fill="#2a241c" stroke="#c9a227" stroke-width="2"/>
  <path d="M30 36 q8 -18 16 0 M32 22 a6 6 0 0 1 12 0 v4 h-12 z" fill="#c9a227" opacity="0.85"/>
  <!-- name + HP -->
  <text x="70" y="22" fill="#e8dcc0" font-size="13" font-family="Georgia, serif" letter-spacing="1">VAGABOND</text>
  <rect x="70" y="30" width="190" height="14" rx="4" fill="#241d15" stroke="#3a3226"/>
  <rect x="70" y="30" width="151" height="14" rx="4" fill="#8a1a1a"/>
  <text x="165" y="41" fill="#e8dcc0" font-size="10" text-anchor="middle">62 / 78</text>
  <!-- runes -->
  <circle cx="300" cy="28" r="9" fill="none" stroke="#c9a227" stroke-width="2"/>
  <circle cx="300" cy="28" r="3.5" fill="#c9a227"/>
  <text x="316" y="33" fill="#c9a227" font-size="14">148</text>
  <!-- flasks -->
  <g stroke="#3a3226" stroke-width="1.5">
    <path d="M392 20 h10 v6 l5 8 v6 h-20 v-6 l5 -8 z" fill="#8a1a1a"/>
    <path d="M427 20 h10 v6 l5 8 v6 h-20 v-6 l5 -8 z" fill="#7fa8c9"/>
    <path d="M462 20 h10 v6 l5 8 v6 h-20 v-6 l5 -8 z" fill="#241d15" stroke-dasharray="3 2"/>
  </g>
  <!-- relic strip -->
  <g>
    <rect x="520" y="16" width="24" height="24" rx="5" fill="#241d15" stroke="#c9a227"/>
    <rect x="550" y="16" width="24" height="24" rx="5" fill="#241d15" stroke="#9a8a5a"/>
    <rect x="580" y="16" width="24" height="24" rx="5" fill="#241d15" stroke="#9a8a5a"/>
    <rect x="610" y="16" width="24" height="24" rx="5" fill="#241d15" stroke="#9a8a5a"/>
    <text x="532" y="33" fill="#c9a227" font-size="12" text-anchor="middle">◆</text>
    <text x="562" y="33" fill="#e8dcc0" font-size="12" text-anchor="middle">✦</text>
    <text x="592" y="33" fill="#e8dcc0" font-size="12" text-anchor="middle">☩</text>
    <text x="622" y="33" fill="#e8dcc0" font-size="12" text-anchor="middle">❖</text>
  </g>
  <!-- deck / settings -->
  <rect x="1150" y="14" width="58" height="28" rx="6" fill="#241d15" stroke="#3a3226"/>
  <text x="1179" y="33" fill="#e8dcc0" font-size="11" text-anchor="middle">Deck</text>
  <circle cx="1244" cy="28" r="12" fill="#241d15" stroke="#3a3226"/>
  <text x="1244" y="33" fill="#7a6f5a" font-size="12" text-anchor="middle">⚙</text>

  <!-- ============ ENEMIES ============ -->
  <!-- Enemy 1: Wandering Soldier -->
  <g>
    <!-- intent -->
    <g transform="translate(795,120)">
      <rect x="-34" y="-18" width="68" height="36" rx="8" fill="#1c1610" stroke="#8a1a1a"/>
      <path d="M-22 8 l14 -14 m0 0 l-3 -3 m3 3 l3 -3 m-17 17 l-4 1 1 -4" stroke="#c9502e" stroke-width="2.5" fill="none"/>
      <text x="12" y="7" fill="#e8dcc0" font-size="16" font-weight="bold">7</text>
    </g>
    <!-- silhouette -->
    <g transform="translate(795,230)">
      <path d="M0 -62 a16 16 0 0 1 16 16 v6 h-32 v-6 a16 16 0 0 1 16 -16 z" fill="#2a241c" stroke="#4a4034"/>
      <path d="M-4 -66 h8 l2 -10 h-12 z" fill="#2a241c" stroke="#4a4034"/>
      <path d="M-22 -38 q22 -14 44 0 l6 66 q-28 12 -56 0 z" fill="#2a241c" stroke="#4a4034"/>
      <path d="M24 -34 l10 52" stroke="#4a4034" stroke-width="5"/>
      <path d="M30 -44 l8 14" stroke="#8a8072" stroke-width="3"/>
      <rect x="-40" y="-26" width="14" height="34" rx="4" fill="#1c1610" stroke="#4a4034"/>
    </g>
    <text x="795" y="286" fill="#e8dcc0" font-size="12" text-anchor="middle">Wandering Soldier</text>
    <!-- HP -->
    <rect x="725" y="294" width="140" height="11" rx="3" fill="#241d15" stroke="#3a3226"/>
    <rect x="725" y="294" width="129" height="11" rx="3" fill="#8a1a1a"/>
    <text x="795" y="303" fill="#e8dcc0" font-size="9" text-anchor="middle">24 / 26</text>
    <!-- poise -->
    <rect x="725" y="308" width="140" height="5" rx="2" fill="#241d15"/>
    <rect x="725" y="308" width="56" height="5" rx="2" fill="#c9a227"/>
    <!-- bleed -->
    <rect x="725" y="316" width="140" height="5" rx="2" fill="#241d15"/>
    <rect x="725" y="316" width="82" height="5" rx="2" fill="#c9502e"/>
    <!-- statuses -->
    <g transform="translate(733,332)">
      <circle r="9" fill="#241d15" stroke="#9fc3e8"/><text y="4" fill="#9fc3e8" font-size="9" text-anchor="middle">V</text>
      <circle cx="24" r="9" fill="#241d15" stroke="#c9502e"/><text x="24" y="4" fill="#c9502e" font-size="9" text-anchor="middle">7</text>
    </g>
  </g>

  <!-- Enemy 2: Rot Hound -->
  <g>
    <g transform="translate(1050,180)">
      <rect x="-40" y="-18" width="80" height="36" rx="8" fill="#1c1610" stroke="#8a1a1a"/>
      <path d="M-28 8 l14 -14 m0 0 l-3 -3 m3 3 l3 -3 m-17 17 l-4 1 1 -4" stroke="#c9502e" stroke-width="2.5" fill="none"/>
      <text x="4" y="7" fill="#e8dcc0" font-size="15" font-weight="bold">3×2</text>
    </g>
    <g transform="translate(1050,268)">
      <path d="M-38 6 q-4 -22 16 -26 q10 -14 30 -10 q16 2 20 -8 q8 2 4 12 q10 10 2 24 q-6 14 -30 14 q-30 2 -42 -6 z" fill="#2f2317" stroke="#5a3a24"/>
      <path d="M-30 12 l-2 16 M-8 14 l0 16 M14 14 l2 16 M30 10 l6 14" stroke="#5a3a24" stroke-width="4"/>
      <circle cx="26" cy="-24" r="2.5" fill="#b5541c"/>
      <path d="M-20 -14 q8 6 20 4" stroke="#b5541c" stroke-width="2" fill="none" opacity="0.7"/>
    </g>
    <text x="1050" y="312" fill="#e8dcc0" font-size="12" text-anchor="middle">Rot Hound</text>
    <rect x="995" y="320" width="110" height="11" rx="3" fill="#241d15" stroke="#3a3226"/>
    <rect x="995" y="320" width="52" height="11" rx="3" fill="#8a1a1a"/>
    <text x="1050" y="329" fill="#e8dcc0" font-size="9" text-anchor="middle">7 / 15</text>
    <rect x="995" y="334" width="110" height="5" rx="2" fill="#241d15"/>
    <rect x="995" y="334" width="90" height="5" rx="2" fill="#c9a227"/>
  </g>

  <!-- ============ PLAYER ============ -->
  <g transform="translate(210,360)">
    <path d="M0 -70 a18 18 0 0 1 18 18 v8 h-36 v-8 a18 18 0 0 1 18 -18 z" fill="#332b1f" stroke="#c9a227" stroke-width="1.5"/>
    <path d="M-6 -76 h12 l3 -12 h-18 z" fill="#332b1f" stroke="#c9a227"/>
    <path d="M-26 -42 q26 -16 52 0 l8 78 q-34 14 -68 0 z" fill="#332b1f" stroke="#c9a227" stroke-width="1.5"/>
    <path d="M30 -38 l26 -30 m0 0 l-5 -2 m5 2 l2 5" stroke="#e8dcc0" stroke-width="4" fill="none"/>
    <rect x="-52" y="-30" width="18" height="44" rx="5" fill="#1c1610" stroke="#c9a227"/>
  </g>
  <!-- block badge -->
  <g transform="translate(150,300)">
    <path d="M0 -16 l14 6 v10 q0 12 -14 18 q-14 -6 -14 -18 v-10 z" fill="#7fa8c9" stroke="#0d0b08" stroke-width="1.5"/>
    <text y="8" fill="#0d0b08" font-size="14" font-weight="bold" text-anchor="middle">12</text>
  </g>
  <!-- player HP under feet -->
  <rect x="140" y="448" width="150" height="12" rx="3" fill="#241d15" stroke="#3a3226"/>
  <rect x="140" y="448" width="119" height="12" rx="3" fill="#8a1a1a"/>
  <text x="215" y="458" fill="#e8dcc0" font-size="9" text-anchor="middle">62 / 78</text>
  <!-- stance -->
  <g transform="translate(150,478)">
    <circle r="13" fill="#241d15" stroke="#c9502e" stroke-width="2"/>
    <path d="M0 6 q-7 -5 -3 -12 q2 -4 3 -7 q1 3 3 7 q4 7 -3 12 z" fill="#c9502e"/>
  </g>
  <text x="172" y="482" fill="#c9502e" font-size="11">Bloodflame Stance</text>
  <!-- player statuses -->
  <g transform="translate(150,508)">
    <circle r="9" fill="#241d15" stroke="#c9a227"/><text y="4" fill="#c9a227" font-size="9" text-anchor="middle">S</text>
  </g>
  <text x="170" y="512" fill="#7a6f5a" font-size="10">Strength +2</text>

  <!-- ============ HAND ============ -->
  <!-- card backs left/right of the focused card -->
  <g transform="translate(400,634) rotate(-9)">
    <rect x="-65" y="-91" width="130" height="182" rx="10" fill="url(#cardface)" stroke="#5a5040" stroke-width="2"/>
    <text y="-64" fill="#e8dcc0" font-size="11" text-anchor="middle" font-family="Georgia, serif">Strike</text>
    <circle cx="-48" cy="-72" r="13" fill="#1c1610" stroke="#c9a227" stroke-width="2"/><text x="-48" y="-67" fill="#e8dcc0" font-size="12" text-anchor="middle">1</text>
  </g>
  <g transform="translate(510,622) rotate(-4)">
    <rect x="-65" y="-91" width="130" height="182" rx="10" fill="url(#cardface)" stroke="#5a5040" stroke-width="2"/>
    <text y="-64" fill="#e8dcc0" font-size="11" text-anchor="middle" font-family="Georgia, serif">Quickstep</text>
    <circle cx="-48" cy="-72" r="13" fill="#1c1610" stroke="#c9a227" stroke-width="2"/><text x="-48" y="-67" fill="#e8dcc0" font-size="12" text-anchor="middle">1</text>
  </g>
  <!-- focused card (raised) -->
  <g transform="translate(640,560)">
    <rect x="-78" y="-110" width="156" height="220" rx="12" fill="url(#cardface)" stroke="#c9a227" stroke-width="2.5"/>
    <circle cx="-58" cy="-90" r="16" fill="#1c1610" stroke="#c9a227" stroke-width="2"/>
    <text x="-58" y="-84" fill="#e8dcc0" font-size="15" text-anchor="middle" font-weight="bold">1</text>
    <text y="-84" fill="#e8dcc0" font-size="13" text-anchor="middle" font-family="Georgia, serif">Bloodflame Slash</text>
    <rect x="-62" y="-72" width="124" height="78" rx="6" fill="#14100c" stroke="#3a3226"/>
    <path d="M-30 -10 l44 -44 m0 0 l-8 -3 m8 3 l3 8" stroke="#c9502e" stroke-width="5" fill="none"/>
    <path d="M18 -18 q-8 -6 -4 -14 q2 -4 4 -8 q2 4 4 8 q4 8 -4 14 z" fill="#8a1a1a"/>
    <rect x="-62" y="12" width="124" height="18" rx="4" fill="#2a241c"/>
    <text y="25" fill="#c9a227" font-size="10" text-anchor="middle" letter-spacing="2">ATTACK</text>
    <text y="52" fill="#e8dcc0" font-size="11" text-anchor="middle">Deal 5 damage.</text>
    <text y="70" fill="#e8dcc0" font-size="11" text-anchor="middle">Apply <tspan fill="#c9502e" font-weight="bold">3 Bleed</tspan>.</text>
  </g>
  <g transform="translate(770,622) rotate(4)">
    <rect x="-65" y="-91" width="130" height="182" rx="10" fill="url(#cardface)" stroke="#5a5040" stroke-width="2"/>
    <text y="-64" fill="#e8dcc0" font-size="11" text-anchor="middle" font-family="Georgia, serif">Shield Bash</text>
    <circle cx="-48" cy="-72" r="13" fill="#1c1610" stroke="#c9a227" stroke-width="2"/><text x="-48" y="-67" fill="#e8dcc0" font-size="12" text-anchor="middle">1</text>
  </g>
  <g transform="translate(880,634) rotate(9)">
    <rect x="-65" y="-91" width="130" height="182" rx="10" fill="url(#cardface)" stroke="#7fa8c9" stroke-width="2"/>
    <text y="-64" fill="#e8dcc0" font-size="11" text-anchor="middle" font-family="Georgia, serif">Stomp</text>
    <circle cx="-48" cy="-72" r="13" fill="#1c1610" stroke="#c9a227" stroke-width="2"/><text x="-48" y="-67" fill="#e8dcc0" font-size="12" text-anchor="middle">2</text>
  </g>

  <!-- ============ ENERGY / PILES / END TURN ============ -->
  <g transform="translate(80,600)">
    <circle r="36" fill="#1c1610" stroke="#c9a227" stroke-width="3"/>
    <circle r="28" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.4"/>
    <text y="7" fill="#e8dcc0" font-size="20" text-anchor="middle" font-weight="bold">3/3</text>
  </g>
  <g transform="translate(60,680)">
    <rect x="-24" y="-16" width="48" height="32" rx="6" fill="#241d15" stroke="#3a3226"/>
    <text y="5" fill="#e8dcc0" font-size="13" text-anchor="middle">12</text>
  </g>
  <text x="60" y="712" fill="#7a6f5a" font-size="10" text-anchor="middle">Draw</text>
  <g transform="translate(1224,680)">
    <rect x="-24" y="-16" width="48" height="32" rx="6" fill="#241d15" stroke="#3a3226"/>
    <text y="5" fill="#e8dcc0" font-size="13" text-anchor="middle">5</text>
  </g>
  <text x="1224" y="712" fill="#7a6f5a" font-size="10" text-anchor="middle">Discard</text>
  <g transform="translate(1180,596)">
    <rect x="-70" y="-24" width="140" height="48" rx="10" fill="#241d15" stroke="#c9a227" stroke-width="2"/>
    <text y="6" fill="#c9a227" font-size="15" text-anchor="middle" font-family="Georgia, serif" letter-spacing="1">END TURN</text>
  </g>

  <!-- ============ ANNOTATIONS ============ -->
  <g fill="#7a6f5a" font-size="11" font-style="italic">
    <line x1="795" y1="140" x2="700" y2="92" stroke="#7a6f5a" stroke-width="0.7" stroke-dasharray="3 3"/>
    <text x="560" y="86">intent: exact damage incl. modifiers, hover for detail</text>
    <line x1="868" y1="310" x2="935" y2="380" stroke="#7a6f5a" stroke-width="0.7" stroke-dasharray="3 3"/>
    <text x="905" y="398">poise meter (amber) — fill to Stagger</text>
    <line x1="868" y1="318" x2="935" y2="420" stroke="#7a6f5a" stroke-width="0.7" stroke-dasharray="3 3"/>
    <text x="905" y="438">bleed build-up (red) — bursts at threshold</text>
    <line x1="150" y1="286" x2="230" y2="240" stroke="#7a6f5a" stroke-width="0.7" stroke-dasharray="3 3"/>
    <text x="238" y="238">block badge — expires next turn</text>
    <line x1="640" y1="446" x2="530" y2="420" stroke="#7a6f5a" stroke-width="0.7" stroke-dasharray="3 3"/>
    <text x="330" y="416">hovered card raises ×1.5, numbers live-computed</text>
    <line x1="116" y1="596" x2="180" y2="560" stroke="#7a6f5a" stroke-width="0.7" stroke-dasharray="3 3"/>
    <text x="186" y="556">energy — End Turn pulses if playable cards remain</text>
  </g>
</svg>
