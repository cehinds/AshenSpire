<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<base href="../../../"><title>AshenSpire — starter card paintings</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles/base.css"><link rel="stylesheet" href="styles/ui.css"><link rel="stylesheet" href="styles/kit.css"><link rel="stylesheet" href="styles/responsive-type.css">
<link rel="stylesheet" href="styles/illustrated-cards.css">
<style>
html,body{height:auto;overflow:visible}body{min-height:100vh}
body{margin:0;background:#151716;color:#e4d6bd;font:16px Georgia,serif}main{max-width:1100px;margin:auto;padding:28px 16px}h1{font-size:28px;margin:0 0 10px}p{line-height:1.6;color:#bdbaa9}label{display:inline-flex;gap:12px;align-items:center;margin:12px 0}select{font:inherit;padding:8px;background:#242725;color:#eee0c7;border:1px solid #75654b}.gallery{display:flex;flex-wrap:wrap;justify-content:center;gap:24px;padding-top:20px}.gallery figure{margin:0;width:min(320px,100%)}.gallery .card{width:100%;height:auto;aspect-ratio:360/540;margin:0;transform:none}.gallery figcaption{text-align:center;margin-top:12px;color:#cabb9e}select:focus-visible{outline:2px solid #dfae65;outline-offset:3px}
</style>
</head><body><main>
<h1>Starter card paintings</h1><p>Starstone Pebble · Urgent Heal · Ambush<br>Original paintings in the production card renderer.</p>
<label>Artwork quality <select id="tier"><option value="high">High</option><option value="light">Light / mobile</option></select></label>
<div class="gallery" id="gallery"></div>
</main><script type="module">
import {contentBundle} from './src/content/index.js';
import {createRegistries} from './src/model/registries.js';
import {renderCard} from './src/ui/components/card.js';
import {setHighResSource} from './src/ui/assetmap.js';
const registries=createRegistries(contentBundle);
const entries=[['starstonePebble','starstone-pebble','Starseer'],['urgentHeal','urgent-heal','Herald'],['ambush','ambush','Rogue']];
const tier=document.querySelector('#tier');
function draw(){
 const paths=entries.flatMap(([,slug])=>[512,1024].map(size=>`assets/cards/${slug}-${size}.webp`));
 setHighResSource(tier.value==='light'?new Map(paths.map(path=>[path,path.replace('assets/','assets-mobile/')])):null);
 const gallery=document.querySelector('#gallery');gallery.replaceChildren();
 for(const [cardId,,cls] of entries){const figure=document.createElement('figure');figure.append(renderCard(registries,{cardId},{inspection:false,level:'inspect'}));const caption=document.createElement('figcaption');caption.textContent=cls;figure.append(caption);gallery.append(figure);}
 document.body.dataset.artTier=tier.value;
}
tier.addEventListener('change',draw);draw();
</script></body></html>
