<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210"><title>Selected overhead intent remains; only overhead HP is removed</title><rect x="0" y="0" width="1200" height="210" rx="5" fill="#283437" stroke="#53645f"/><text x="200" y="31" fill="#e7d49e" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">Left: perceived 12 → 8 advantage</text><g transform="translate(200 95) scale(1.25)"><path d="M-16 16L13-17L18-19L17-12L-13 19M-11 3L3 16M-18 16L-12 22" fill="none" stroke="#d6e2df" stroke-width="4" stroke-linecap="round"/><text x="0" y="40" fill="#9dd490" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">8</text></g><text x="600" y="31" fill="#e7d49e" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">Middle: intent and damage hidden</text><g transform="translate(600 95) scale(1.25)"><text x="0" y="14" fill="#e8d3a0" font-family="Georgia,serif" font-size="43" text-anchor="middle">?</text></g><text x="1000" y="31" fill="#e7d49e" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">Right: centered Dodge, small count</text><g transform="translate(1000 95) scale(1.25)"><path d="M-15 9A18 18 0 1 1 17 3M17 3L17-9M17 3L5 0" fill="none" stroke="#d6e2df" stroke-width="4" stroke-linecap="round"/><rect x="9" y="9" width="19" height="19" rx="3" fill="#283231" stroke="#c7b778"/><text x="18.5" y="24" fill="#f1dfad" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">3</text></g><text x="600" y="190" fill="#c9d6ce" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">Selected intent stays overhead. Only overhead HP is removed. Values are illustrative.</text></svg>