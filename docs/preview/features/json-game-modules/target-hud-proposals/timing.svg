<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="510" viewBox="0 0 1440 510"><title>Proposed 500ms detail presentation timing</title><rect x="0" y="0" width="1440" height="510" rx="8" fill="#1c2425" stroke="#596864"/><text x="30" y="40" fill="#e8d4a0" font-family="Arial,sans-serif" font-size="26" text-anchor="start">Proposed timing · one 500ms stability threshold, not cumulative pauses</text><text x="30" y="105" fill="#eee7d6" font-family="Arial,sans-serif" font-size="22" text-anchor="start">Enter</text><text x="175" y="105" fill="#c1cfca" font-family="Arial,sans-serif" font-size="19" text-anchor="start">Hover/focus stays on target</text><rect x="600" y="81" width="500" height="34" rx="2" fill="#536454" stroke="#9db28d"/><rect x="1100" y="81" width="150" height="34" rx="2" fill="#786b49" stroke="#ccb47a"/><text x="600" y="139" fill="#e7e2d5" font-family="Arial,sans-serif" font-size="15" text-anchor="start">0ms</text><text x="1100" y="139" fill="#e8d4a0" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">500ms</text><text x="1265" y="105" fill="#e8d4a0" font-family="Arial,sans-serif" font-size="18" text-anchor="start">Details fade in</text><text x="30" y="210" fill="#eee7d6" font-family="Arial,sans-serif" font-size="22" text-anchor="start">Exit</text><text x="175" y="210" fill="#c1cfca" font-family="Arial,sans-serif" font-size="19" text-anchor="start">Retain details + pointer corridor</text><rect x="600" y="186" width="500" height="34" rx="2" fill="#536454" stroke="#9db28d"/><rect x="1100" y="186" width="150" height="34" rx="2" fill="#786b49" stroke="#ccb47a"/><text x="600" y="244" fill="#e7e2d5" font-family="Arial,sans-serif" font-size="15" text-anchor="start">0ms</text><text x="1100" y="244" fill="#e8d4a0" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">500ms</text><text x="1265" y="210" fill="#e8d4a0" font-family="Arial,sans-serif" font-size="18" text-anchor="start">Details fade out</text><text x="30" y="315" fill="#eee7d6" font-family="Arial,sans-serif" font-size="22" text-anchor="start">Switch</text><text x="175" y="315" fill="#c1cfca" font-family="Arial,sans-serif" font-size="19" text-anchor="start">Keep old panel while new candidate settles</text><rect x="600" y="291" width="500" height="34" rx="2" fill="#536454" stroke="#9db28d"/><rect x="1100" y="291" width="150" height="34" rx="2" fill="#786b49" stroke="#ccb47a"/><text x="600" y="349" fill="#e7e2d5" font-family="Arial,sans-serif" font-size="15" text-anchor="start">0ms</text><text x="1100" y="349" fill="#e8d4a0" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">500ms</text><text x="1265" y="315" fill="#e8d4a0" font-family="Arial,sans-serif" font-size="18" text-anchor="start">Crossfade old → new</text><text x="30" y="409" fill="#dce9dc" font-family="Arial,sans-serif" font-size="22" text-anchor="start">Click: highlight immediately. Gameplay/target clicks never wait for panel presentation.</text><text x="30" y="450" fill="#c1cfca" font-family="Arial,sans-serif" font-size="20" text-anchor="start">Hover/focus inside sprite, connecting corridor, panel or status row keeps the details open.</text><text x="30" y="483" fill="#c1cfca" font-family="Arial,sans-serif" font-size="19" text-anchor="start">Reduced motion: same dwell/grace; instant opacity change. Short fades/crossfades are illustrative (~150ms).</text></svg>