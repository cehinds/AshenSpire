<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<base href="../../../"><title>Layered card art — runtime preview</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="styles/base.css"><link rel="stylesheet" href="styles/ui.css"><link rel="stylesheet" href="styles/kit.css"><link rel="stylesheet" href="styles/responsive-type.css"><link rel="stylesheet" href="styles/illustrated-cards.css">
<style>
html,body{height:auto;overflow:visible}body{margin:0;background:#101318;color:#e0d8c7;font:16px Georgia,serif}main{max-width:1480px;margin:auto;padding:24px}h1{font-size:28px}p{line-height:1.5;color:#aeb7bf}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;margin:24px 0}figure{margin:0;min-width:0}.card{width:100%;height:auto;aspect-ratio:360/540;margin:0;transform:none}figcaption{margin-top:8px;font:13px monospace;color:#c8b894}.crop{position:relative;isolation:isolate;height:240px;overflow:hidden}.crop>img{width:100%;height:100%;object-fit:cover}select{background:#242b35;color:#eee;padding:8px}label{display:block}
</style></head><body><main><h1>Layered card art in the game renderer</h1><p>Approved components, resolved combat tags, and the current card frames. Blue and pale mint projections keep the same small amber scepter. Codes below identify the composition; PNG objects and effects remain independent.</p><label>Card artwork <select id="style"><option>Simple</option><option>Legacy</option></select></label><div class="gallery" id="cards"></div><h2>All ethereal weapons and scepters</h2><div class="gallery" id="weapons"></div></main>
<script type="module">
import {contentBundle} from './src/content/index.js';
import {createRegistries,resolveCard} from './src/model/registries.js';
import {renderCard} from './src/ui/components/card.js';
import {simpleCardArt} from './src/ui/cardArtComposition.js';
import {cardArtLayersHtml} from './src/ui/cardArtLayers.js';
import {applyCardArtStyle} from './src/ui/cardArtStyle.js';
import {layeredCardArtCatalog as catalog} from './src/content/layeredCardArt.generated.js';
import {assetUrl} from './src/ui/assetmap.js';
const data={...contentBundle,cards:[...contentBundle.cards]};
// These fixtures supply authored tags to real production rendering, not name matching.
const fixtures=[
 ['Physical Strike','physical','attack'],['Physical Smash','physical','smash'],['Physical Sweep','physical','sweep'],['Physical Defend','physical','defend'],['Physical Counter','physical','counter'],
 ['Blue Sword','spell','attack','frost'],['Mint Hammer','spell','smash','alteration'],['Blue Scythe','spell','sweep','frost'],['Mint Shield','spell','defend','alteration']
];
for(let i=0;i<fixtures.length;i++){const [name,camp,maneuver,element]=fixtures[i];data.cards.push({...structuredClone(data.cards.find(c=>c.id==='strike')),id:`layered-preview-${i}`,name,kindIds:['classification.attack'],cardTags:[`camp:${camp}`,`maneuver:${maneuver}`,...element?[`element:${element}`]:[]]});}
const reg=createRegistries(data);
function appendCard(ref,label){const d=resolveCard(reg,ref),a=simpleCardArt(d,{registries:reg}),f=document.createElement('figure');f.append(renderCard(reg,ref,{inspection:false,level:'inspect'}));const c=document.createElement('figcaption');c.textContent=`${a?.componentArt?.code||'fallback'} · ${label}`;f.append(c);document.querySelector('#cards').append(f);}
fixtures.forEach(([name],i)=>appendCard({cardId:`layered-preview-${i}`},name));
for(const id of ['starstonePebble','cinderLance','urgentHeal','sanctuaryCleanse'])appendCard({cardId:id},reg.cards.get(id).name);
for(let i=0;i<10;i++) {const c=catalog.compositions[`Y0${i}`],sprites=c.layers.map(l=>({...l,path:catalog.assets[l.assetId].path})),bg=sprites.find(l=>l.id==='background'),f=document.createElement('figure');f.innerHTML=`<div class="crop"><img src="${assetUrl(bg.path)}" alt="">${cardArtLayersHtml({kind:'simple',layers:[],componentArt:{code:c.code,sprites}})}</div><figcaption>${c.label}</figcaption>`;document.querySelector('#weapons').append(f);}
document.querySelector('#style').addEventListener('change',e=>applyCardArtStyle({cardArtStyle:e.target.value}));
</script></body></html>
