<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700"><rect width="1000" height="700" fill="#f5f3ee"/><g font-family="Arial,sans-serif" fill="#282620"><text x="40" y="48" font-size="25" font-weight="bold">HUD layout · proposed structure</text><text x="40" y="80" font-size="15">One growing panel. Relics stay with vitality. Menu always remains accessible.</text><g transform="translate(40 120)"><rect width="375" height="525" rx="18" fill="white" stroke="#282620" stroke-width="2"/><rect x="12" y="12" width="351" height="174" rx="8" fill="#eeece7" stroke="#777" stroke-dasharray="5 4"/><text x="137" y="40" font-size="15">Cinders 50</text><g font-size="14"><text x="26" y="72">HP 54/64</text><text x="26" y="102">MP 1/2</text><text x="26" y="132">SP 2/2</text></g><g fill="#aaa"><rect x="96" y="60" width="99" height="12" rx="5"/><rect x="96" y="90" width="60" height="12" rx="5"/><rect x="96" y="120" width="74" height="12" rx="5"/></g><g fill="white" stroke="#555"><rect x="245" y="56" width="46" height="46" rx="5"/><rect x="299" y="56" width="46" height="46" rx="5"/><circle cx="40" cy="159" r="13"/><circle cx="72" cy="159" r="13"/><circle cx="104" cy="159" r="13"/></g><g font-size="12"><text x="253" y="83">Tools</text><text x="307" y="83">Menu</text><text x="127" y="164">Relics</text></g><text x="130" y="215" font-size="16">‹ Player turn ›</text><text x="138" y="334" font-size="18" fill="#777">Playfield</text><rect x="18" y="437" width="339" height="68" rx="8" fill="#eeece7" stroke="#777"/><text x="36" y="477" font-size="14">Cards / Actions</text><rect x="264" y="451" width="79" height="39" rx="6" fill="white" stroke="#555"/><text x="279" y="476" font-size="13">Potions</text></g><g transform="translate(475 133)"><text y="0" font-size="20" font-weight="bold">Settings → HUD</text><text y="33" font-size="15">Choose which information stays visible.</text><g font-size="17"><text y="85">☑ Vitality and resource bars</text><text y="122">☑ Relics</text><text y="159">☑ Cinders</text><text y="196">☑ Potion controls</text></g><path d="M0 229H460" stroke="#bbb"/><text y="269" font-size="18" font-weight="bold">Potion behavior</text><g font-size="15"><text y="304">Desktop: reveal on hover or keyboard focus.</text><text y="333">Touch: tap Potions to choose a flask.</text><text y="379">Hidden HUD sections leave no empty space.</text><text y="408">Tools and Menu remain reachable.</text><text y="471" fill="#777">Wireframe — final controls follow existing settings.</text></g></g></g></svg>
