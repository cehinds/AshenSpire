<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>Ashen Spire Tag Workbench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: header + status line, tab bar (six tables + Sheet + Check), then the active panel: a toolbar over an editable grid, or the object sheet. */
:root{
  --bg:#f3f1ee; --panel:#fbfaf8; --sunk:#ebe7e2; --fg:#24201d; --muted:#6c645d; --line:#d3cbc3;
  --ember:#b4471f; --teal:#2f6f6a; --ok:#2f7a45; --warn:#9a6a00; --bad:#b3261e;
  --display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171412; --panel:#201b18; --sunk:#2a2420; --fg:#ece6df; --muted:#a39a91; --line:#3f3731;
  --ember:#e2774c; --teal:#5fb3aa; --ok:#6cc48a; --warn:#e0b04a; --bad:#f08a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171412; --panel:#201b18; --sunk:#2a2420; --fg:#ece6df; --muted:#a39a91; --line:#3f3731;
  --ember:#e2774c; --teal:#5fb3aa; --ok:#6cc48a; --warn:#e0b04a; --bad:#f08a80; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0;padding-inline:16px;padding-block:18px 40px;font-size:14px}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:1.65rem;margin:0;letter-spacing:.02em}
.sub{color:var(--muted);margin:3px 0 0;font-size:.88rem;max-width:80ch;line-height:1.45}
.status{font:.78rem var(--mono);color:var(--muted)}
.status b{font-weight:500}
.status .ok{color:var(--ok)} .status .warn{color:var(--warn)} .status .bad{color:var(--bad)}
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line)}
.tab{font:500 .85rem var(--body);background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 10px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--ember)}
.tab .n{font:.72rem var(--mono);color:var(--muted);margin-left:4px}
button,select,input,textarea{font:inherit;color:var(--fg)}
button{font-weight:500;font-size:.8rem;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--ember);border-color:var(--ember);color:#fff}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--ember);outline-offset:1px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.banner{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid var(--warn);border-radius:8px;padding:8px 10px;background:var(--panel)}
.banner.bad{border-color:var(--bad)}
.toolbar .grow{flex:1}
input[type=search],select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
input[type=search]{min-width:0;width:260px;max-width:100%}
.help{font-size:.82rem;color:var(--muted);line-height:1.5;max-width:110ch;margin:0}
.help code,.mono{font-family:var(--mono);font-size:.78rem}
.grid{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-height:68vh}
table{border-collapse:collapse;font-size:.8rem}
th{position:sticky;top:0;z-index:1;background:var(--sunk);text-align:left;font-weight:600;color:var(--muted);padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:0;vertical-align:top}
td.act{padding:3px 4px;white-space:nowrap}
td input{width:100%;border:0;background:transparent;padding:6px 6px;font:inherit;font-size:.8rem;min-width:70px;box-sizing:border-box}
td input:focus{background:var(--sunk);outline:none;box-shadow:inset 0 0 0 1.5px var(--ember)}
td.c-description input,td.c-effect input,td.c-expr input,td.c-tags input{min-width:260px}
td.c-id input{min-width:230px;font-family:var(--mono);font-size:.74rem}
td.c-key input,td.c-parent input,td.c-source input,td.c-target input,td.c-object input{font-family:var(--mono);font-size:.74rem;min-width:150px}
td.c-expr input{font-family:var(--mono);font-size:.76rem}
td.bad input{box-shadow:inset 0 -2px 0 var(--bad)}
td.warn input{box-shadow:inset 0 -2px 0 var(--warn)}
td.out{padding:6px 8px;font:.76rem var(--mono);white-space:nowrap;color:var(--teal)}
td.out.bad{color:var(--bad)} td.out.warn{color:var(--warn)} td.out.note{color:var(--muted)}
.x{border:0;background:none;color:var(--muted);padding:2px 6px;font-size:.9rem}
.x:hover{color:var(--bad)}
.more{padding:10px;text-align:center}
.pill{display:inline-block;font:500 .7rem var(--body);padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.new{color:var(--ember);border-color:var(--ember)} .pill.moved{color:var(--teal);border-color:var(--teal)}
.sheet{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:16px;align-items:start}
@media (max-width:760px){.sheet{grid-template-columns:1fr}}
.cardart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.cardart .img{aspect-ratio:2/3;max-width:100%;border-radius:8px;background:var(--sunk);display:grid;place-items:center;overflow:hidden}
.cardart img{width:100%;height:100%;object-fit:cover}
.cardart h2{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.8rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);font-size:.76rem;overflow-wrap:anywhere}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.box h3{font:600 .9rem var(--body);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.76rem;border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:var(--sunk)}
.chip small{display:block;font:.68rem var(--mono);color:var(--muted)}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.tbl{overflow-x:auto}
.tbl table{width:100%}
.tbl td,.tbl th{padding:5px 8px;font-size:.78rem}
.tbl td.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.issues li{margin:3px 0;font-size:.82rem}
.issues code{font-family:var(--mono);font-size:.76rem}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);max-width:min(760px,92vw);width:100%;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog textarea{width:100%;min-height:260px;box-sizing:border-box;font:.76rem var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:8px}
dialog .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:10px}
.empty{padding:28px;text-align:center;color:var(--muted);line-height:1.6}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.76rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div>
    <h1>Ashen Spire Tag Workbench</h1>
    <p class="sub">Every tag, object, value and formula in one editable set of tables. Formulas reference anything by key in square brackets, for example <code class="mono">[strike.baseDamage] + floor([ar] * 0.25)</code>. Import and export each table as CSV.</p>
    <div class="status" id="status">Connecting…</div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <section id="panel"></section>
</div>

<dialog id="dlg">
  <h3 id="dlg-title" style="margin:0 0 8px;font:600 1rem var(--body)"></h3>
  <p id="dlg-help" class="help" style="margin-bottom:8px"></p>
  <textarea id="dlg-text" spellcheck="false"></textarea>
  <div class="row" id="dlg-actions"></div>
</dialog>
<input type="file" id="file" accept=".csv,text/csv" hidden>

<script>
"use strict";
/* formula-columns:begin */
const FORMULA_COLUMNS=['key','expr','scope','description','status']; /* status: 'proposed' rows have no expression yet */
/* formula-columns:end */
const TABLES = {
  tags:{label:'Tags', key:'id', help:'One row per tag. <b>id</b> is the full path, <b>key</b> the short unique name formulas use. <b>erd</b> names the model it belongs to, <b>school</b> its magic class, <b>related</b> other tag keys (space separated). Text in <b>effect</b> can cite <code>[key]</code>; <b>variables</b> lists the value keys the tag reads, so its numbers live in Values, never in the tag.',
    columns:['id','key','label','parent','erd','school','description','effect','variables','duration','stacking','related','status','liveId','glyph','color'],
    refs:{parent:'tag', school:'tag', related:'tags', variables:'values'}},
  objects:{label:'Objects', key:'id', help:'Cards, weapons, armor and anything else that carries tags. <b>tags</b>, <b>exp</b> are tag keys; <b>grants</b> are object ids; <b>art</b> and <b>artDefault</b> are game asset ids from the Assets table; <b>cost</b> and <b>description</b> can cite <code>[key]</code>. <b>rankMode</b> is <code>list</code> (use the Ranks table) or <code>formula</code> (formulas read <code>[rank]</code>). <code>rankMode=list</code> with <b>maxRank</b> 1 means no rank progression (Dodge).',
    columns:['id','kind','name','erd','cardType','stance','rarity','costResource','cost','tags','skill','exp','grants','art','artDefault','placement','rankMode','maxRank','description'],
    refs:{cardType:'tag', stance:'tag', rarity:'tag', costResource:'tag', skill:'tag', tags:'tags', exp:'tags', grants:'objects', art:'asset', artDefault:'asset'}},
  values:{label:'Values', key:'key', help:'Plain numbers. A value whose key matches a tag key is that tag\'s preview number (for example <code>ar</code> = 24), used when formulas are previewed. <b>scope</b> is the object or area it belongs to.',
    columns:['key','value','unit','scope','description'], refs:{}},
  formulas:{label:'Formulas', key:'key', help:'Expressions over <code>[key]</code> references to values, other formulas, tags with a preview value, and <code>[rank]</code>. Operators <code>+ - * / % ^</code>, comparisons, and <code>min max floor ceil round abs clamp(x,lo,hi) if(cond,a,b)</code>. The result column previews at rank 1.',
    columns:FORMULA_COLUMNS, refs:{}},
  ranks:{label:'Ranks', key:null, help:'Rank progression as a list. Each row changes a value key from that rank on: <code>+1</code>, <code>-0.5</code>, <code>=8</code> or <code>×1.25</code> (also <code>*1.25</code>). Changes add up rank by rank.',
    columns:['object','rank','key','change','note'], refs:{object:'object', key:'value'}},
  assets:{label:'Assets', key:'id', help:'Game art ids, exactly as the game names them (<code>assets/cards/extended/card-strike-512.webp</code>). The game resolves them through <code>assetUrl()</code>. This page cannot load the game\'s art, so <b>preview</b> holds an image you upload here to see it on the Object sheet.',
    columns:['id','category','subcategory','lightPath','lightW','lightH','highPath','highW','highH','bytesHigh','usedBy','preview','tag','liveRef'], refs:{tag:'tag'}, group:'presentation'},
  components:{label:'Components', key:'id', group:'presentation', help:'Every screen, region, component, button, modal, menu and card layer. <b>parent</b> is the containing component, <b>tag</b> its Presentation tag, <b>assetRefs</b> and <b>textKeys</b> what it shows, <b>symbol</b> its icon.',
    columns:['id','label','group','parent','kind','file','selector','wireframe','assetRefs','symbol','textKeys','zLayer','notes','tag','liveRef','cssClasses'], refs:{parent:'component', tag:'tag'}},
  layouts:{label:'Layouts', key:null, group:'presentation', help:'Position and size per device band. <b>band</b> is mobile (phone, up to 600px), tablet (601–1023px), desktop (1024–1439px), wide (1440px and up), all, state or other; <b>breakpoint</b> keeps the original condition. <b>source</b> names the CSS line or the function that computes it.',
    columns:['componentId','breakpoint','band','x','y','w','h','anchor','unit','source','tag','liveRef'], refs:{componentId:'component', tag:'tag'}},
  styles:{label:'Styles', key:null, group:'presentation', help:'One row per styling value: colour, size, font, spacing, radius, shadow, z-order, transition. Edit <b>value</b>; <b>selector</b> and <b>source</b> say where it lives. <b>band</b> is mobile (phone, up to 600px), tablet (601–1023px), desktop (1024–1439px), wide (1440px and up), all, state or other.',
    columns:['componentId','selector','property','value','breakpoint','band','source','tag','liveRef','cssComponentId'], refs:{componentId:'component', tag:'tag'}},
  tokens:{label:'Tokens', key:null, group:'presentation', help:'Shared style variables (CSS custom properties) and their values per theme or scope.', columns:['token','value','theme','file','tag','liveRef'], refs:{tag:'tag'}},
  breakpoints:{label:'Breakpoints', key:'name', group:'presentation', help:'Every size or state condition the layout switches on, and the band it maps to.', columns:['name','condition','file','usedBy','tag','liveRef'], refs:{tag:'tag'}},
  animations:{label:'Animations', key:'id', group:'presentation', help:'Sprite sequences and CSS or scripted animations: frames, fps, duration, loop, anchor, offset, scale.', columns:['id','owner','action','framePattern','frameCount','fps','durationMs','loop','anchor','offsetX','offsetY','scale','flip','source','tag','liveRef'], refs:{tag:'tag'}},
  effects:{label:'Effects', key:'id', group:'presentation', help:'Sprite effects, auras, shadows, glows, floating text, flashes, tints and particles, with anchor, offset, blend and colour.', columns:['id','kind','assetRefs','trigger','anchor','offsetX','offsetY','scale','blend','opacity','color','durationMs','source','tag','liveRef'], refs:{tag:'tag'}},
  resolutions:{label:'Resolutions', key:'tier', group:'presentation', help:'Art tiers and image sizes, and when each is used.', columns:['tier','description','maxWidth','format','usedWhen','source','tag','liveRef'], refs:{tag:'tag'}},
  symbols:{label:'Symbols', key:'id', group:'presentation', help:'Every icon and glyph, its asset and colour, and what it is used for.', columns:['id','glyph','assetRef','shape','color','usedFor','file','tag','liveRef'], refs:{tag:'tag'}},
  combatSymbols:{label:'Combat symbols', key:'tagKey', group:'presentation', help:'One icon per combat concept. <b>placeholder</b> rows borrow the closest existing icon until art is made.', columns:['tagKey','label','currentSymbol','currentAssetRef','suggestedAssetRef','status','assignedAssetRef','tag','liveRef','artBrief','priority'], refs:{tag:'tag'}},
  settings:{label:'Settings', key:'key', group:'presentation', help:'Player settings and game tuning values, with defaults, ranges and where they are read. <b>scope</b> is player or tuning; <b>deviceScope</b> is device (per device: layout, text size, display) or global.', columns:['key','label','group','type','default','options','min','max','step','storage','readBy','file','scope','deviceScope','tag','liveRef'], refs:{tag:'tag'}},
  strings:{label:'Strings', key:'key', group:'presentation', help:'Every label and tooltip. <b>context</b> hardcoded marks text written directly in UI code instead of the shared strings file.', columns:['key','text','tooltip','context','file','tag','liveRef','proposedKey','migrateTo'], refs:{tag:'tag'}},
  relations:{label:'Relations', key:null, help:'Typed links between tags: STRONG_VS, WEAK_VS, BYPASSES, APPLIES, CLEARS, REQUIRES, CONFLICTS_WITH, REFERENCES. <b>value</b> is the multiplier or amount when there is one.',
    columns:['source','relation','target','value','note'], refs:{source:'tag', target:'tag'}},
};
const ORDER = ['tags','objects','values','formulas','ranks','relations','components','layouts','styles','tokens','breakpoints','assets','animations','effects','resolutions','symbols','combatSymbols','settings','strings'];
const CORE = new Set(['tags','objects','values','formulas','ranks','relations']);
const loaded = new Set(); const pending = new Set();
const PAGE = 150;

const state = { data:{}, view:'tags', filter:{}, shown:{}, sheet:null, sheetRank:1 };
for (const t of ORDER) { state.data[t] = {columns:[...TABLES[t].columns], rows:[]}; state.shown[t]=PAGE; }
let db=null, canWrite=true, downloads=null, assetsCap=null, localMode=false;
const dirty=new Set(), saving=new Set(), timers={}, editGen={}; /* editGen[t] counts the edits to table t; a save remembers the count it started with */
/* storage:begin */
/* content-addressed blobs: a blob is {rows} as JSON, named by hashText of that JSON */
const BLOB_MAX=170000, BLOB_ROW_MAX=250000, BLOB_CUT=64, BLOB_FALLBACK=8, GC_AGE_MS=120000;
const TEXT_ENC=new TextEncoder();
function byteLen(s){ return TEXT_ENC.encode(s).length; }
function hash32(s){ let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193); } return h>>>0; }
/* FNV-1a 64-bit over UTF-16 code units, split into two 32-bit words; returns 16 hex digits */
function hashText(s){
  let hi=0xcbf29ce4, lo=0x84222325;
  for(let i=0;i<s.length;i++){
    lo=(lo ^ s.charCodeAt(i))>>>0;
    const p=lo*0x1b3, nlo=p%4294967296, carry=Math.floor(p/4294967296);
    hi=(carry+hi*0x1b3+lo*0x100)%4294967296; lo=nlo;
  }
  return hi.toString(16).padStart(8,'0')+lo.toString(16).padStart(8,'0');
}
/* content-defined cuts: after a row whose hash32 % 64 is 0; when a chunk passes the size cap, cut after the last row
   whose hash32 % 8 is 0 (a fallback candidate), else before the row that overflowed. Every cut depends on row content,
   so one inserted row changes only the chunks around it, even when the rows are wide. */
function chunkRows(rows){
  const out=[]; let cur=[], sizes=[], hs=[], total=12;
  const cut=(n)=>{ out.push(cur.slice(0,n)); cur=cur.slice(n); sizes=sizes.slice(n); hs=hs.slice(n); total=12+sizes.reduce((a,b)=>a+b,0); };
  for(const r of rows){
    const js=JSON.stringify(r), n=byteLen(js)+1;
    cur.push(r); sizes.push(n); hs.push(hash32(js)); total+=n;
    while(total>BLOB_MAX && cur.length>1){
      let c=-1;
      for(let i=cur.length-2;i>=0;i--) if(hs[i]%BLOB_FALLBACK===0){ c=i; break; }
      cut(c>=0? c+1 : cur.length-1);
    }
    if(hs[cur.length-1]%BLOB_CUT===0) cut(cur.length);
  }
  if(cur.length) out.push(cur);
  return out;
}
/* ---------- reader: subscribe to the head, assemble only complete heads ---------- */
const BLOB_RETRY_MS=[250,500];
const tstate={};
const sleepMs=ms=>new Promise(r=>setTimeout(r,ms));
function TS(t){ return tstate[t]||(tstate[t]={seq:0, base:'', blobs:new Map(), latest:undefined, lastSaveAt:0, conflict:null, incomplete:null, legacy:null, legacyDocs:[], unsub:[], partsUnsub:null, parts:new Map()}); }
function headPath(t){ return 'tables/'+t; }
function blobPath(t,h){ return 'tables/'+t+'/blobs/'+h; }
/* a blob head's rev; legacy heads have none, so their base is '' */
/* a blob head's rev; a legacy head gets an identity derived from its JSON, so a later legacy write is a change; absent is '' */
function revOf(h){ if(!h) return ''; if(h.format==='blobs') return h.rev||''; return 'legacy:'+hashText(JSON.stringify(h)); }
function headCols(h,t){ return Array.isArray(h.columns)&&h.columns.length? h.columns : TABLES[t].columns; }
function objectRows(hc, arrs){ return arrs.map(a=>{ const o={}; hc.forEach((c,j)=>{ o[c]=a[j]??''; }); return o; }); }
function adoptRows(t, hc, objs){
  if(dirty.has(t)||saving.has(t)) return;
  const cols=[...hc]; for(const c of TABLES[t].columns) if(!cols.includes(c)) cols.push(c);
  loaded.add(t); pending.delete(t);
  if(JSON.stringify(objs)===JSON.stringify(state.data[t].rows) && JSON.stringify(cols)===JSON.stringify(state.data[t].columns)){ render(); return; }
  state.data[t]={columns:cols, rows:objs};
  rebuild(); setStatus(); render();
}
/* one blob doc; retried twice with backoff when it is missing or unreadable, then null */
async function fetchBlob(t,h){
  for(let i=0;;i++){
    try{ const s=await db.doc(blobPath(t,h)).get(); if(s.exists){ const d=s.data();
      /* the id is the hash of the content: a blob whose content does not hash to its id is treated as missing */
      if(d&&Array.isArray(d.rows)&&hashText(JSON.stringify({rows:d.rows}))===h) return d.rows; } }
    catch(e){ /* counted as missing */ }
    if(i>=BLOB_RETRY_MS.length) return null;
    await sleepMs(BLOB_RETRY_MS[i]);
  }
}
async function assembleBlobs(t,h){
  const ts=TS(t), want=[...new Set(h.blobs||[])], got=new Map(); let missing=null;
  await Promise.all(want.map(async x=>{ const rows=ts.blobs.get(x)||await fetchBlob(t,x); if(rows) got.set(x,rows); else missing=missing||x; }));
  return {missing, got};
}
function stopParts(t){ const ts=TS(t); if(ts.partsUnsub){ ts.partsUnsub(); ts.partsUnsub=null; } ts.parts=new Map(); }
function legacyAssemble(t){
  const ts=TS(t), h=ts.legacy; if(!h||dirty.has(t)||saving.has(t)) return;
  const n=Number(h.parts)||0, hc=headCols(h,t), arrs=[], ids=[];
  for(let i=0;i<n;i++){
    const p=ts.parts.get(i); if(!p) return;
    /* a legacy head with revs lists the rev of each part; a part from another save is still in flight, so wait */
    if(Array.isArray(h.revs) && p.rev!==h.revs[i]){ setStatus('warn','Waiting for every part of '+TABLES[t].label+' to match its head.'); return; }
    ids.push(p.id); arrs.push(...p.rows);
  }
  ts.legacyDocs=ids;
  adoptRows(t, hc, arrs.map(r=>Array.isArray(r)? objectRows(hc,[r])[0] : r));
}
function ensureParts(t){
  const ts=TS(t); if(ts.partsUnsub) return;
  ts.partsUnsub=db.collection('tables/'+t+'/parts').onSnapshot(q=>{
    ts.parts=new Map(q.docs.map(d=>{ const b=d.data()||{}; return [Number(b.index), {id:d.id, rev:b.rev, rows:Array.isArray(b.rows)? b.rows : []}]; }));
    legacyAssemble(t);
  }, e=>setStatus('bad','Lost the live connection to "'+t+'" ('+(e&&e.code)+'). Reload to reconnect.'));
}
async function applyHead(t,h){
  const ts=TS(t), seq=++ts.seq;
  if(!h){ stopParts(t); ts.base=''; ts.blobs=new Map(); ts.legacy=null; ts.incomplete=null; adoptRows(t, TABLES[t].columns, []); return; }
  if(h.format==='blobs'){

    const keyCol=TABLES[t].key, seen=new Map();
    state.data[t].rows.forEach((r,i)=>{
      for(const c of state.data[t].columns){ const m=cellIssue(t,c,r[c]); if(m) out.push({t,i,c,msg:m,row:r}); }
      if(keyCol){ const k=String(r[keyCol]??'').trim(); if(!k) out.push({t,i,c:keyCol,msg:'Empty '+keyCol,row:r}); else if(seen.has(k)) out.push({t,i,c:keyCol,msg:'Duplicate '+keyCol+' "'+k+'"',row:r}); else seen.set(k,1); }
    });
  }
  const tk=new Map(); state.data.tags.rows.forEach((r,i)=>{ const k=String(r.key||''); if(k){ if(tk.has(k)) out.push({t:'tags',i,c:'key',msg:'Duplicate key "'+k+'"',row:r}); tk.set(k,1);} });
  for(const r of state.data.formulas.rows){ const fi=formulaRowIssue(r, evalExpr); if(fi) out.push({t:'formulas',i:state.data.formulas.rows.indexOf(r),c:'expr',msg:fi.msg,row:r,note:!!fi.note}); }
  return out;
}

/* ---------- CSV ---------- */
/* csv:begin */
function toCSV(cols, rows){
  const esc=v=>{ v=v==null?'':String(v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  return [cols.map(esc).join(','), ...rows.map(r=>cols.map(c=>esc(r[c])).join(','))].join('\n')+'\n';
}
function parseCSV(text){
  const rows=[]; let row=[], f='', q=false, i=0; text=String(text).replace(/^﻿/,'');
  while(i<text.length){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i+=2;continue;} q=false; i++; continue;} f+=c; i++; continue; }
    if(c==='"'){q=true;i++;continue;}
    if(c===','){row.push(f);f='';i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(f);rows.push(row);row=[];f='';i++;continue;}
    f+=c;i++;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  const nonEmpty=rows.filter(r=>r.some(x=>x!==''));
  if(!nonEmpty.length) return {columns:[],rows:[]};
  const cols=nonEmpty[0].map(s=>s.trim());
  return {columns:cols, rows:nonEmpty.slice(1).map(r=>{ const o={}; cols.forEach((c,j)=>{ o[c]=coerce(r[j]??''); }); return o; })};
}
function coerce(s){ const raw=String(s), t=raw.trim(); return (/^-?\d+(\.\d+)?$/.test(t) && String(Number(t))===t)? Number(t) : raw; }
/* merges parsed CSV into a table: columns the CSV names are added; merge updates rows by key and adds new ones; replace swaps the rows */
function importRows(tbl, key, parsed, mode){
  for(const c of parsed.columns) if(!tbl.columns.includes(c)) tbl.columns.push(c);
  if(mode==='replace'||!key){ if(mode==='replace') tbl.rows=parsed.rows; else tbl.rows.push(...parsed.rows); }
  else { const at=new Map(tbl.rows.map((r,i)=>[String(r[key]),i])); for(const r of parsed.rows){ const k=String(r[key]??''); if(k&&at.has(k)) Object.assign(tbl.rows[at.get(k)],r); else tbl.rows.push(r); } }
}
/* csv:end */

function renderBanners(p,t){

  p.appendChild(ul);
  const ex=document.createElement('div'); ex.className='toolbar'; ex.style.marginTop='12px';
  ex.append(btn('Export every table as one JSON file',()=>{ if(notLoaded.length){ notLoaded.forEach(ensure); setStatus('warn','Loading every table first; export again when the counts on the tabs fill in.'); render(); return; } const all={}; for(const t of ORDER) all[t]=state.data[t]; offer('ashen-tag-workbench.json', JSON.stringify(all,null,1)); }));
  p.appendChild(ex);
}

/* ---------- import / export ---------- */
async function offer(filename, text){
  if(downloads){ try{ await downloads.save({filename, data:text}); setStatus('ok','Saved '+filename); return; } catch(e){ if(e&&e.code==='declined') return; } }
  openText(filename,'Copy this text and save it as '+filename+'.',text,[['Copy',v=>{ try{ navigator.clipboard.writeText(v).then(()=>setStatus('ok','Copied'),()=>{}); }catch(e){} }]],false);
}
function exportCSV(t){ offer('ashen-'+t+'.csv', toCSV(state.data[t].columns, state.data[t].rows)); }
function importDialog(t){
  const def=TABLES[t];
  openText('Import CSV into '+def.label,'Paste CSV below, or choose a file. The first line must name the columns. Merge updates rows with the same '+(def.key||'content')+' and adds new ones; Replace swaps the whole table.','',[
    ['Choose file…',()=>{ const f=document.getElementById('file'); f.accept='.csv,text/csv'; f.value=''; f.onchange=async()=>{ const file=f.files[0]; if(!file) return; document.getElementById('dlg-text').value=await file.text(); document.getElementById('dlg').showModal(); }; f.click(); }, true],
    ['Merge',v=>applyImport(t,v,'merge')],['Replace',v=>applyImport(t,v,'replace')]],false);
}
function applyImport(t,text,mode){
  if(!editable(t)){ setStatus('warn','This table is not loaded or not editable yet.'); return; }
  const parsed=parseCSV(text); if(!parsed.columns.length){ setStatus('bad','That CSV has no header row.'); return; }
  importRows(state.data[t], TABLES[t].key, parsed, mode);
  markDirty(t); setStatus('ok','Imported '+parsed.rows.length+' rows into '+TABLES[t].label+' ('+mode+')'); render();
}
function openText(title,help,text,actions,keepOpen){
  const d=document.getElementById('dlg'); document.getElementById('dlg-title').textContent=title; document.getElementById('dlg-help').textContent=help;
  const ta=document.getElementById('dlg-text'); ta.value=text; ta.style.minHeight= text||actions.length>2?'260px':'60px';
  const row=document.getElementById('dlg-actions'); row.textContent='';
  for(const [label,fn,stay] of actions){ row.appendChild(btn(label,()=>{ const v=ta.value; if(!stay) d.close(); fn(v); }, label==='Merge'||label==='Add'?'primary':'')); }
  row.appendChild(btn('Close',()=>d.close())); d.showModal(); ta.focus();
}

/* ---------- lazy loading ---------- */
function ensure(t){
  if(loaded.has(t)||pending.has(t)||localMode) return;
  if(!window.__subscribe) return;
  pending.add(t); window.__subscribe(t);
  for(const r of Object.values(TABLES[t].refs||{})){ const dep={tag:'tags',tags:'tags',object:'objects',objects:'objects',value:'values',values:'values',asset:'assets',component:'components'}[r]; if(dep&&dep!==t) ensure(dep); }
}
/* ---------- boot ---------- */
rebuild(); setStatus(); render();
(async()=>{
  const cl=window.claude;
  const [d,u,dl,as]=await Promise.all([cl?.use?.('db')??null, cl?.use?.('user')??null, cl?.use?.('downloads')??null, cl?.use?.('assets')??null]).catch(()=>[null,null,null,null]);
  db=d; downloads=dl; assetsCap=as; render();
  if(!db){ localMode=true; ORDER.forEach(t=>loaded.add(t)); loadLocal(); rebuild(); setStatus('warn','The shared table store is not available here.'); render(); return; }
  if(u){ try{ const w=await u.can('data.write'); if(w===false) canWrite=false; }catch(e){} }
  window.__subscribe=subscribeTable;
  for(const t of ORDER) if(CORE.has(t)) ensure(t);
  if(TABLES[state.view]) ensure(state.view);
})();
</script>
