<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ashen Spire · Reading Desk preview</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/ui.css">
  <link rel="stylesheet" href="styles/kit.css">
  <link rel="stylesheet" href="styles/responsive-type.css">
</head>
<body>
  <main style="padding:24px"><h1>Reading Desk preview</h1><p id="result">An isolated Reaver run. Changes stay in this preview.</p><button id="reopen">Open deck editor</button></main>
  <script type="module">
    import { contentBundle } from './src/content/index.js';
    import { createRegistries } from './src/model/registries.js';
    import { createRunState } from './src/model/state.js';
    import { mountDeckEditor } from './src/ui/screens/deckEditor.js';
    import { setKeyBindings } from './src/ui/input.js';
    import { cardShapeCssProperties, cardLevelCssProperties } from './src/ui/models/CardSizeModel.js';
    for (const [key,value] of Object.entries({...cardShapeCssProperties(),...cardLevelCssProperties()})) document.documentElement.style.setProperty(key,value);
    const registries = createRegistries(contentBundle);
    setKeyBindings(null);
    const run = createRunState({ seed: 7, classId: 'reaver', registries });
    const params = new URLSearchParams(location.search);
    function open() {
      mountDeckEditor(document.body, { registries, run,
        settings: { playInDeckOrder: params.has('ordered') },
        onDone: () => { document.querySelector('#result').textContent = `Saved ${run.deck.length} cards in this isolated preview.`; },
        onCancel: () => { document.querySelector('#result').textContent = 'Canceled. The opening deck and collection were restored.'; },
      });
    }
    document.querySelector('#reopen').addEventListener('click',open);
    open();
  </script>
</body>
</html>
