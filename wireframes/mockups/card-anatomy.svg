<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 580" role="img" aria-labelledby="title desc" font-family="Arial,sans-serif">
<title id="title">Current AshenSpire playing card wireframes</title>
<desc id="desc">The current 5 to 7 playing card at glance, focus, and inspect levels. The name and left-edge cost rail are always visible. Type and footer appear at focus; tags appear at inspect. Absent bands return their space to the card.</desc>
<rect width="840" height="580" fill="#17120f"/>
<text x="420" y="34" fill="#ead4a6" font-size="19" text-anchor="middle">CURRENT PLAYING CARD · THREE DETAIL LEVELS</text>
<g transform="translate(25 0)"><text x="115" y="69" fill="#d6ad62" font-size="19" text-anchor="middle">GLANCE</text><text x="115" y="91" fill="#aa9a7f" font-size="12" text-anchor="middle">152px nominal · 5:7</text><rect x="0" y="130" width="230" height="322" rx="10" fill="#271e17" stroke="#b99959" stroke-width="2"/><rect x="1" y="130.00" width="228" height="35.78" fill="#30251b" stroke="#5c4933" stroke-width=".6"/><text x="115" y="152.88888888888889" fill="#f1e5cd" font-size="15" text-anchor="middle">CARD NAME</text><rect x="1" y="165.78" width="228" height="143.11" fill="#130f0d" stroke="#5c4933" stroke-width=".6"/><text x="124" y="242.33333333333331" fill="#c7b18c" font-size="14" text-anchor="middle">GLYPH / ART</text><text x="10" y="187.77777777777777" fill="#d9b564" font-size="16" text-anchor="start">◆ 1</text><text x="10" y="208.77777777777777" fill="#9bb6a8" font-size="11" text-anchor="start">ϟ / ♦</text><rect x="1" y="308.89" width="228" height="143.11" fill="#2b211a" stroke="#5c4933" stroke-width=".6"/><text x="115" y="341.8888888888889" fill="#e9dcc4" font-size="13" text-anchor="middle">RULES / EFFECTS</text><text x="115" y="362.8888888888889" fill="#a99983" font-size="11" text-anchor="middle">Live rules, fitted to space</text><text x="115" y="486" fill="#aa9a7f" font-size="12" text-anchor="middle">1:4:4 active tracks</text></g>
<g transform="translate(305 0)"><text x="115" y="69" fill="#d6ad62" font-size="19" text-anchor="middle">FOCUS</text><text x="115" y="91" fill="#aa9a7f" font-size="12" text-anchor="middle">280px nominal · 5:7</text><rect x="0" y="130" width="230" height="322" rx="10" fill="#271e17" stroke="#b99959" stroke-width="2"/><rect x="1" y="130.00" width="228" height="32.20" fill="#30251b" stroke="#5c4933" stroke-width=".6"/><text x="115" y="151.1" fill="#f1e5cd" font-size="15" text-anchor="middle">CARD NAME</text><rect x="1" y="162.20" width="228" height="128.80" fill="#130f0d" stroke="#5c4933" stroke-width=".6"/><text x="124" y="231.6" fill="#c7b18c" font-size="14" text-anchor="middle">GLYPH / ART</text><text x="10" y="184.2" fill="#d9b564" font-size="16" text-anchor="start">◆ 1</text><text x="10" y="205.2" fill="#9bb6a8" font-size="11" text-anchor="start">ϟ / ♦</text><rect x="1" y="291.00" width="228" height="128.80" fill="#2b211a" stroke="#5c4933" stroke-width=".6"/><rect x="12" y="303" width="206" height="28" rx="4" fill="#423223"/><text x="115" y="322" fill="#d4ad6a" font-size="12" text-anchor="middle">TYPE BAND</text><text x="115" y="359" fill="#e9dcc4" font-size="13" text-anchor="middle">RULES / EFFECTS</text><text x="115" y="380" fill="#a99983" font-size="11" text-anchor="middle">Live rules, fitted to space</text><rect x="1" y="419.80" width="228" height="32.20" fill="#30251b" stroke="#5c4933" stroke-width=".6"/><text x="115" y="439.90000000000003" fill="#baa582" font-size="10" text-anchor="middle">RARITY                  OWNED</text><text x="115" y="486" fill="#aa9a7f" font-size="12" text-anchor="middle">1:4:4:1 active tracks</text></g>
<g transform="translate(585 0)"><text x="115" y="69" fill="#d6ad62" font-size="19" text-anchor="middle">INSPECT</text><text x="115" y="91" fill="#aa9a7f" font-size="12" text-anchor="middle">320px nominal · 5:7</text><rect x="0" y="130" width="230" height="322" rx="10" fill="#271e17" stroke="#b99959" stroke-width="2"/><rect x="1" y="130.00" width="228" height="32.20" fill="#30251b" stroke="#5c4933" stroke-width=".6"/><text x="115" y="151.1" fill="#f1e5cd" font-size="15" text-anchor="middle">CARD NAME</text><rect x="1" y="162.20" width="228" height="128.80" fill="#130f0d" stroke="#5c4933" stroke-width=".6"/><text x="124" y="231.6" fill="#c7b18c" font-size="14" text-anchor="middle">GLYPH / ART</text><text x="10" y="184.2" fill="#d9b564" font-size="16" text-anchor="start">◆ 1</text><text x="10" y="205.2" fill="#9bb6a8" font-size="11" text-anchor="start">ϟ / ♦</text><rect x="13" y="262" width="90" height="20" rx="4" fill="#3a3425" stroke="#8f7850"/><text x="58" y="276" fill="#d6bd88" font-size="10" text-anchor="middle">TAG CHIPS</text><rect x="1" y="291.00" width="228" height="128.80" fill="#2b211a" stroke="#5c4933" stroke-width=".6"/><rect x="12" y="303" width="206" height="28" rx="4" fill="#423223"/><text x="115" y="322" fill="#d4ad6a" font-size="12" text-anchor="middle">TYPE BAND</text><text x="115" y="359" fill="#e9dcc4" font-size="13" text-anchor="middle">RULES / EFFECTS</text><text x="115" y="380" fill="#a99983" font-size="11" text-anchor="middle">Live rules, fitted to space</text><rect x="1" y="419.80" width="228" height="32.20" fill="#30251b" stroke="#5c4933" stroke-width=".6"/><text x="115" y="439.90000000000003" fill="#baa582" font-size="10" text-anchor="middle">RARITY                  OWNED</text><text x="115" y="486" fill="#aa9a7f" font-size="12" text-anchor="middle">1:4:4:1 active tracks</text></g>
<text x="420" y="528" fill="#c8b99c" font-size="13" text-anchor="middle">Cost rail: action always, stamina/mana when used. Flavor and full reading live outside the face.</text>
<text x="420" y="550" fill="#a99983" font-size="12" text-anchor="middle">Art well currently holds a glyph. This is the shell for the proposed visual artwork.</text>
</svg>
