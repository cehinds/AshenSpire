<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AshenSpire Studio</title><link rel="stylesheet" href="/styles.css"></head>
<body><style>.wb-keep{position:absolute;width:0;height:0;opacity:0}#wb-keep:checked + .wb-retired{display:none}.wb-retired{font:14px/1.45 system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:8px 14px;background:#fff4dc;color:#2b2110;border-bottom:1px solid #e0c58a}.wb-retired a{color:inherit;font-weight:700}.wb-retired small{display:block;opacity:.85}.wb-retired label{margin-left:auto;padding:2px 10px;border:1px solid currentColor;border-radius:4px;cursor:pointer}@media (prefers-color-scheme: dark){.wb-retired{background:#3a2c12;color:#f3e3bf;border-color:#6b5226}}</style><input type="checkbox" id="wb-keep" class="wb-keep"><aside class="wb-retired" role="region" aria-label="Workbench notice"><span>This tool has mostly moved to the Workbench → <a href="http://127.0.0.1:4300/#mod=data">Open in Workbench (Data Studio)</a><small>Still only here: Sprites, Scripts, Relation builder, Codex.</small></span><label for="wb-keep">Keep using this page</label></aside>
  <header><a class="brand" href="#sprites"><span class="mark"></span>AshenSpire <strong>Studio</strong></a><div id="project" class="project">Opening workspace…</div><div class="header-actions"><button id="preview-game">Preview game</button><button id="review" class="primary">Review changes <span id="count">0</span></button></div></header>
  <nav aria-label="Editor sections" id="navigation"></nav>
  <main id="main" tabindex="-1"><p>Opening your game…</p></main>
  <footer><span id="workspace-status">Local workspace</span><span id="status" role="status">Changes are saved with backups</span></footer>
  <dialog id="dialog"><div id="dialog-body"></div><form method="dialog"><button class="dialog-close">Close</button></form></dialog>
  <div id="toast" role="status" hidden></div>
  <input id="import-files" type="file" accept="image/png,image/webp,image/gif,image/jpeg" multiple hidden>
  <script type="module" src="/app.js"></script>
</body></html>
