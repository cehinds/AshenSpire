// src/engine/statuses.js — generic status-model interpreter (SPEC §3.7)
//
// Statuses are CONTENT, not code: this module interprets stackMode, decay
// (none / perTurnEnd / {duration} / onConsume), build-up meters (growthMult +
// onFill), and modifiers consulted by the damage/block math (SPEC §4.2).
// It contains no entity-specific code and never names a status id
// (design law §3.1(2)).
//
// Status instance shape on an entity:
//   entity.statuses[statusId] = { stacks, duration?, meter?: { value, max } }
// Meter statuses keep their build-up points in meter.value; their "stacks"
// (for formulas, predicates, tooltips) IS the meter value.
//
// ctx is the combat context (see engine/combat.js): must provide
// ctx.registries, ctx.emit(type, payload), ctx.enqueue(action),
// ctx.player, ctx.enemies.
//
// Headless: no document/window/localStorage/timers.

function getStatusInstance(entity, statusId) {
  return (entity && entity.statuses && entity.statuses[statusId]) || null;
}

function getStacks(entity, statusId) {
  const inst = getStatusInstance(entity, statusId);
  if (!inst) return 0;
  return inst.meter ? inst.meter.value : inst.stacks || 0;
}

function hasStatus(entity, statusId) {
  return getStacks(entity, statusId) > 0;
}

/**
 * applyStatus(ctx, target, statusId, stacks, source?) — the applyStatus opcode
 * body. Interprets stackMode; feeds meters; refreshes durations; fires
 * meter onFill (SPEC §3.7). Emits statusApplied (and meterFilled on fill).
 */
function applyStatus(ctx, target, statusId, stacks = 1, source = null) {
  const def = ctx.registries.statuses.get(statusId);
  if (!target || !target.alive) return;
  const amount = Math.floor(stacks);
  if (amount <= 0 && def.stackMode !== 'unique') return;

  let inst = target.statuses[statusId];
  if (!inst) {
    inst = target.statuses[statusId] = { stacks: 0 };
    if (def.meter) inst.meter = { value: 0, max: def.meter.max };
  }

  switch (def.stackMode) {
    case 'add':
      if (inst.meter) inst.meter.value += amount;
      else inst.stacks += amount;
      break;
    case 'refresh':
      if (inst.meter) inst.meter.value = Math.max(inst.meter.value, amount);
      else inst.stacks = Math.max(inst.stacks, amount);
      break;
    case 'unique':
      if (inst.meter) inst.meter.value = Math.max(inst.meter.value, 1);
      else inst.stacks = 1;
      break;
    default:
      throw new Error(`Unknown stackMode '${def.stackMode}' on status '${statusId}'`);
  }

  // Re-applying a duration status adds stacks (above) AND refreshes duration.
  if (isDurationDecay(def.decay)) {
    inst.duration = def.decay.duration;
  }

  ctx.emit('statusApplied', {
    targetId: target.id,
    sourceId: source ? source.id : null,
    status: statusId,
    stacks: amount,
    total: getStacks(target, statusId),
  });

  if (inst.meter) checkMeterFill(ctx, target, statusId, def, inst);

// Build-up meter fill loop: emit meterFilled, enqueue onFill effects (owner =
// the entity carrying the meter), reset value (overflow carries), grow the
// threshold by growthMult (rounded up) unless growth is disabled by any
// combatant's meterMaxGrowthDisabled modifier (SPEC §3.7, §4.4).
function checkMeterFill(ctx, entity, statusId, def, inst) {
  let guard = 0;
  while (inst.meter.value >= inst.meter.max) {
    if (++guard > 100) throw new Error(`Meter '${statusId}' fill loop did not terminate`);
    inst.meter.value -= inst.meter.max;

      targetId: entity.id,
      status: statusId,
      threshold: inst.meter.max,

 * decayAtTurnEnd(ctx, entity) — apply per-owner-turn-end decay:
 *   'perTurnEnd'   → −1 stack (expire at 0)
 *   { duration }   → −1 turn (expire at 0; stacks untouched until then)
 *   'none' / 'onConsume' → untouched

function decayAtTurnEnd(ctx, entity) {

    const inst = entity.statuses[statusId];

  return decay !== null && typeof decay === 'object' && typeof decay.duration === 'number';
}

// ---------------------------------------------------------------------------
// Modifier aggregation (SPEC §3.7 → consulted by §4.2 math)
//
// Sources: every status on the entity, plus (for the player) the active
// stance's modifiers. Semantics:
//   *Mult   — flat per status (NOT scaled by stacks); values multiply.
//   *Add    — value × stacks; values sum.
//   flags   — true if any source has them.
//   blockCap— max of declared caps (the most generous wins).
// ---------------------------------------------------------------------------

function* modifierSources(ctx, entity) {
  for (const statusId of Object.keys(entity.statuses)) {
    const def = ctx.registries.statuses.get(statusId);
    if (def.modifiers) yield { modifiers: def.modifiers, stacks: getStacks(entity, statusId) };
  }
  if (entity.kind === 'player' && entity.stanceId) {
    const stance = ctx.registries.stances.get(entity.stanceId);
    if (stance.modifiers) yield { modifiers: stance.modifiers, stacks: 1 };
  }

function getMult(ctx, entity, key) {
  let m = 1;
  for (const src of modifierSources(ctx, entity)) {
    if (typeof src.modifiers[key] === 'number') m *= src.modifiers[key];
  }
  return m;
}

/** Sum of per-stack adders for `key` ('attackDamageAdd', 'blockAdd'). */
function getAdd(ctx, entity, key) {
  let a = 0;
  for (const src of modifierSources(ctx, entity)) {
    if (typeof src.modifiers[key] === 'number') a += src.modifiers[key] * src.stacks;
  }
  return a;
}

/** True if any status/stance on the entity sets boolean modifier `key`. */
function getFlag(ctx, entity, key) {
  for (const src of modifierSources(ctx, entity)) {
    if (src.modifiers[key] === true) return true;
  }
  return false;
}

/** Max declared numeric value for `key` (e.g. blockCap), or null if none. */
function getCap(ctx, entity, key) {
  let cap = null;
  for (const src of modifierSources(ctx, entity)) {
    if (typeof src.modifiers[key] === 'number') {
      cap = cap == null ? src.modifiers[key] : Math.max(cap, src.modifiers[key]);
    }
  }
  return cap;
}

function anyCombatantFlag(ctx, key) {
  if (ctx.player && ctx.player.alive && getFlag(ctx, ctx.player, key)) return true;
  for (const e of ctx.enemies || []) {
    if (e.alive && getFlag(ctx, e, key)) return true;
  }
  return false;
}

// src/engine/triggers.js — event bus + declarative trigger wiring + predicates
// (SPEC §3.6, §3.9, §3.10)
//
// Relics, powers (statuses), stances, and enemy boss phases all hook the
// engine through one declarative form: { on, if?, do, once?, limitPerTurn? }.
// Triggers REACT to events by enqueueing actions; they never mutate directly
// (SPEC §3.9). Trigger sources are scanned live on every emit, so statuses
// applied mid-combat hook up automatically.
//
// Headless: no document/window/localStorage/timers.

const MAX_EMIT_DEPTH = 64;

/**
 * emitEvent(ctx, type, payload) — append to the event log (and the current
 * dispatch buffer), then scan all trigger sources for matches. Returns the
 * event object. Every event carries { type, ...payload }.
 */
function emitEvent(ctx, type, payload = {}) {
  const event = { type, ...payload };
  ctx.eventLog.push(event);
  if (ctx._buffer) ctx._buffer.push(event);
  ctx._emitDepth = (ctx._emitDepth || 0) + 1;
  if (ctx._emitDepth > MAX_EMIT_DEPTH) {
    ctx._emitDepth = 0;
    throw new Error(`Trigger recursion exceeded ${MAX_EMIT_DEPTH} (event '${type}')`);

    scanTriggers(ctx, event);
  } finally {
    ctx._emitDepth -= 1;
  }
  return event;

 * Trigger-state key for an entity's own gates (once / limitPerTurn).
 *
 * Co-op runs every seat through ONE ctx — coopCombat re-points ctx.player at
 * each player in turn — and every player combat entity carries the same
 * id 'player'. Without a per-seat discriminator, one player's once-per-combat
 * relic/stance/status would consume the gate for the whole party. coopCombat

 * keep using the entity id exactly as before. Enemies are genuinely shared and
 * keep their own (already unique) entity ids.

  return entity ? entity.id : 'none';

  const player = ctx.player;

}

function firePhase(ctx, enemy, phase, index, event) {
  const key = `phase:${enemy.id}:${index}`;
  const once = phase.once !== false; // default once for phases
  let st = ctx.triggerState.get(key);
  if (!st) {
    st = { fires: 0, turn: -1, turnFires: 0 };
    ctx.triggerState.set(key, st);
  }
  if (once && st.fires > 0) return;
  if (phase.if && !evalPredicate(ctx, phase.if, { owner: enemy, target: ctx.player, event })) return;
  st.fires += 1;
  for (const eff of phase.do || []) {
    ctx.enqueue({ effect: eff, source: enemy, owner: enemy, target: ctx.player, meta: { event } });
  }
  for (const moveId of phase.unlockMoves || []) {
    if (!enemy.unlockedMoves.includes(moveId)) enemy.unlockedMoves.push(moveId);
  }
}

// ---------------------------------------------------------------------------
// Predicates (SPEC §3.6, closed set, combinable)
// ---------------------------------------------------------------------------

/**
 * evalPredicate(ctx, pred, pctx) → boolean.
 * pctx = { owner?, source?, target?, card?, meta?, event? } — the evaluation
 * context of the gated effect or trigger.
 */
function evalPredicate(ctx, pred, pctx = {}) {
  switch (pred.p) {
    case 'inStance':
      return ctx.player.stanceId === pred.stance;
    case 'hasStatus': {
      const ent = resolveOf(ctx, pctx, pred.of);
      const atLeast = pred.atLeast != null ? pred.atLeast : 1;
      return ent != null && getStacks(ent, pred.status) >= atLeast;
    }
    case 'hasBlock': {
      const ent = resolveOf(ctx, pctx, pred.of);
      return ent != null && ent.block > 0;
    }
    case 'hpBelowPct': {
      const ent = resolveOf(ctx, pctx, pred.of);
      return ent != null && ent.hp <= (ent.maxHp * pred.pct) / 100;
    }
    case 'firstCardThisTurn': {
      const meta = pctx.meta || {};
      if (meta.ordinalThisTurn != null) return meta.ordinalThisTurn === 1;
      return ctx.player.counters.cardsPlayedThisTurn === 0;
    }
    case 'firstAttackThisCombat': {
      const meta = pctx.meta || {};
      if (meta.attackOrdinal != null) return meta.attackOrdinal === 1;
      return ctx.player.counters.attacksPlayedThisCombat === 0;
    }
    case 'cardTypeIs': {
      if (pctx.card) return pctx.card.type === pred.type;
      // Trigger context: the cardPlayed event carries the type.
      return !!pctx.event && pctx.event.cardType === pred.type;
    }
    case 'eventIsAttack':
      return !!pctx.event && pctx.event.isAttack === true;
    case 'eventSourceIsOwner':
      return !!pctx.event && !!pctx.owner && pctx.event.sourceId === pctx.owner.id;
    case 'eventTargetIsOwner':
      return !!pctx.event && !!pctx.owner && pctx.event.targetId === pctx.owner.id;
    case 'eventStatusIs':
      return !!pctx.event && pctx.event.status === pred.status;
    case 'everyNthCardThisCombat': {
      const meta = pctx.meta || {};
      const ordinal = meta.ordinalThisCombat != null ? meta.ordinalThisCombat : ctx.player.counters.cardsPlayedThisCombat;
      return ordinal > 0 && ordinal % pred.n === 0;
    }
    case 'random':
      return ctx.rng.float('misc') * 100 < pred.pct;
    case 'all':
      return pred.preds.every((sub) => evalPredicate(ctx, sub, pctx));
    case 'any':
      return pred.preds.some((sub) => evalPredicate(ctx, sub, pctx));
    case 'not':
      return !evalPredicate(ctx, pred.pred, pctx);
    default:
      throw new Error(`Unknown predicate '${pred.p}'`);
  }
}

function resolveOf(ctx, pctx, of) {
  switch (of) {
    case 'player':
      return ctx.player;
    case 'self':
      return pctx.source || pctx.owner || ctx.player;
    case 'owner':
      return pctx.owner || pctx.source || null;
    case 'enemy':
    case 'target':
      return pctx.target || null;
    default:
      throw new Error(`Predicate 'of' ref '${of}' is not resolvable (use self/owner/player/enemy/target)`);
  }
}

// Sanity: every event name a trigger may declare is in the closed set.



Object.assign(module.exports, { emitEvent, fireOwnerHooks, findEntity, checkPhases, evalPredicate, TRIGGER_EVENTS });

},
"src/engine/mapgen.js": function (module, exports, require) {
// src/engine/mapgen.js — procedural act-map generator (SPEC §3.8, §6)
//
// Faithful to StS's published algorithm: walk N paths bottom-to-top through a
// floors × columns grid (edges may merge, never cross), then type the nodes
// under per-floor rules and adjacency/count constraints with bounded retries.
//
// Pure: generateActMap({ config, rng }) — every knob comes from content
// (content/mapconfig.js); randomness only from the seeded 'map' stream.
// Headless: no document/window/localStorage/timers.

const NODE_TYPES = Object.freeze([
  'monster',
  'event',
  'elite',
  'shrine',
  'merchant',
  'treasure',
  'boss',
]);

const TYPING_RETRIES = 40;

/**
 * generateActMap({ config, rng }) → {
 *   nodes: { [id]: { id, floor, col, type, next: [ids] } },
 *   startIds: [ids on floor 1],
 *   shrineId,                        // the single floor-N shrine (SPEC §6)
 *   bossId,                          // boss node above the shrine
 * }
 *
 * config = { floors, columns, pathCount, typeWeights, floorRules } — see
 * content/mapconfig.js. floorRules = { fixed: {floor: type},
 * noEliteOrShrineBefore, noShrineOn, minReachableElites, minReachableMerchants }.
 */
function generateActMap({ config, rng }) {
  const floors = config.floors;
  const cols = config.columns;
  const rules = config.floorRules || {};
  const nodeId = (floor, col) => `n${floor}_${col}`;

  // ---- 1. Path walk (floors 1..floors-1); floor `floors` is the lone shrine.
  // edges[floor] = Map(fromCol → Set(toCol)) — used for the no-cross rule.
  const pathFloors = floors - 1;
  const edges = Array.from({ length: pathFloors }, () => new Map());
  const usedCols = Array.from({ length: pathFloors + 1 }, () => new Set()); // 1-based floors

  const starts = [];
  for (let p = 0; p < config.pathCount; p++) {
    let col = rng.int('map', 0, cols - 1);
    if (p === 1) {
      let guard = 0;
      while (col === starts[0] && ++guard < 50) col = rng.int('map', 0, cols - 1);
    }
    starts.push(col);
    usedCols[1].add(col);

    for (let floor = 1; floor < pathFloors; floor++) {
      let next = clamp(col + rng.int('map', -1, 1), 0, cols - 1);
      // No-cross rule (StS): if an existing edge from this floor would cross
      // ours, adopt its destination instead (paths merge rather than cross).
      for (const [fromCol, tos] of edges[floor]) {
        for (const toCol of tos) {
          const crosses =
            (fromCol < col && toCol > next) || (fromCol > col && toCol < next);
          if (crosses) next = toCol;
        }
      }
      if (!edges[floor].has(col)) edges[floor].set(col, new Set());
      edges[floor].get(col).add(next);
      col = next;
      usedCols[floor + 1].add(col);
    }
  }

  // ---- 2. Materialize nodes + wire edges.
  const nodes = {};
  const addNode = (floor, col) => {
    const id = nodeId(floor, col);
    if (!nodes[id]) nodes[id] = { id, floor, col, type: null, next: [] };
    return nodes[id];
  };
  for (let floor = 1; floor <= pathFloors; floor++) {
    for (const col of usedCols[floor]) addNode(floor, col);
  }
  for (let floor = 1; floor < pathFloors; floor++) {
    for (const [fromCol, tos] of edges[floor]) {
      const from = nodes[nodeId(floor, fromCol)];
      for (const toCol of tos) {
        const toId = nodeId(floor + 1, toCol);
        if (!from.next.includes(toId)) from.next.push(toId);
      }
    }
  }

  // Single pre-boss shrine row + boss (SPEC §6: floor `floors` is always a
  // lone Shrine; the Boss sits above it).
  const shrine = addNode(floors, Math.floor(cols / 2));
  shrine.type = 'shrine';
  for (const col of usedCols[pathFloors]) {
    nodes[nodeId(pathFloors, col)].next.push(shrine.id);
  }
  const boss = addNode(floors + 1, Math.floor(cols / 2));
  boss.type = 'boss';
  shrine.next.push(boss.id);

  // ---- 3. Node typing under constraints, bounded retries then relax.
  const rollable = Object.values(nodes).filter((n) => n.type === null);
  const fixed = rules.fixed || {};
  for (let attempt = 0; attempt < TYPING_RETRIES; attempt++) {
    for (const node of rollable) node.type = null;
    typeOnce(nodes, rollable, fixed, rules, config.typeWeights, rng, floors);
    if (countType(nodes, 'elite') >= (rules.minReachableElites || 0) &&
        countType(nodes, 'merchant') >= (rules.minReachableMerchants || 0)) {
      return finish(nodes, starts, shrine.id, boss.id, floors);
    }
  }
  // Relax (SPEC §6): force-place what the rolls never produced, on eligible
  // monster nodes (weakest constraint gives way; counts are a hard promise).
  relaxPlace(nodes, 'elite', rules.minReachableElites || 0, rules, rng);
  relaxPlace(nodes, 'merchant', rules.minReachableMerchants || 0, rules, rng);
  return finish(nodes, starts, shrine.id, boss.id, floors);
}

function typeOnce(nodes, rollable, fixed, rules, weights, rng, floors) {
  // Roll floor-by-floor so the adjacency rule can see typed parents.
  const byFloor = [...rollable].sort((a, b) => a.floor - b.floor);
  for (const node of byFloor) {
    if (fixed[node.floor]) {
      node.type = fixed[node.floor];
      continue;
    }
    const parents = Object.values(nodes).filter((p) => p.next.includes(node.id) && p.type);
    node.type = rollType(node, parents, rules, weights, rng);
  }
}

// Weighted roll with per-node hard filters (floor rules + no same non-monster
// type adjacent along an edge — SPEC §6).
function rollType(node, typedParents, rules, weights, rng) {
  const banned = new Set(typedParents.map((p) => p.type).filter((t) => t !== 'monster'));
  const entries = Object.entries(weights).filter(([type, w]) => {
    if (w <= 0) return false;
    if (banned.has(type)) return false;
    if ((type === 'elite' || type === 'shrine') && node.floor < (rules.noEliteOrShrineBefore || 0)) return false;
    if (type === 'shrine' && node.floor === rules.noShrineOn) return false;
    return true;
  });
  if (entries.length === 0) return 'monster';
  const total = entries.reduce((a, [, w]) => a + w, 0);
  let r = rng.float('map') * total;
  for (const [type, w] of entries) {
    r -= w;
    if (r < 0) return type;
  }
  return 'monster';
}

function relaxPlace(nodes, type, min, rules, rng) {
  let have = countType(nodes, type);
  const eligible = Object.values(nodes).filter(
    (n) => n.type === 'monster' &&
      !(type === 'elite' && n.floor < (rules.noEliteOrShrineBefore || 0))
  );
  while (have < min && eligible.length > 0) {
    const idx = Math.floor(rng.float('map') * eligible.length);
    eligible.splice(idx, 1)[0].type = type;
    have++;
  }
}

function countType(nodes, type) {
  return Object.values(nodes).filter((n) => n.type === type).length;
}

function finish(nodes, startCols, shrineId, bossId, floors) {
  const startIds = [...new Set(startCols)].map((col) => `n1_${col}`);
  return { nodes, startIds, shrineId, bossId, floors };
}

function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}


Object.assign(module.exports, { NODE_TYPES, generateActMap });

},
"src/engine/save.js": function (module, exports, require) {
// src/engine/save.js — run persistence with schema + content versioning
// (SPEC §3.12)
//
// Storage is injected so the module stays headless: the UI passes
// window.localStorage; tests pass a plain in-memory stub with the same
// getItem/setItem/removeItem shape. Saves that can't be trusted (unknown
// schemaVersion, corrupt JSON, dangling content ids after a content change)
// are ARCHIVED — moved aside, never silently deleted — and load returns null.

const { serializeRun, deserializeRun } = require("src/model/state.js");
const { createLoadout, stampDeck } = require("src/model/loadout.js");

const RUN_KEY = 'sote_run_v1';
const RUN_ARCHIVE_KEY = 'sote_run_archived';
const META_KEY = 'sote_meta_v1';
const SLOTS = 3; // save slots, one run each
const HISTORY_LIMIT = 20;

// Slot 1 keeps the legacy key (backward compatible: existing saves are slot 1);
// slots 2..N use suffixed keys. All slot-taking methods default to slot 1.
function runKey(slot = 1) {
  return slot === 1 ? RUN_KEY : `${RUN_KEY}_s${slot}`;
}

/**
 * createSaveManager(storage) → { saveRun, loadRun, clearRun, hasRun, slotSummary,
 *                                listSlots, loadMeta, saveMeta, recordResult }
 */
function createSaveManager(storage) {
  if (!storage || typeof storage.getItem !== 'function') {
    throw new Error('createSaveManager requires a storage with getItem/setItem/removeItem');
  }

  function archive(json, reason, slot = 1) {
    storage.setItem(RUN_ARCHIVE_KEY, JSON.stringify({ reason, save: json }));
    storage.removeItem(runKey(slot));
  }

  return {
    /** Persist after every committed choice (SPEC §3.12). Stamps RNG counters. */
    saveRun(run, rng, slot = 1) {
      if (rng) run.streamCounters = rng.getCounters();
      storage.setItem(runKey(slot), serializeRun(run));
    },

    /**
     * loadRun(registries, slot?) → run | null. Refuses and archives: corrupt
     * JSON, unknown schemaVersion, or (on contentVersion mismatch) any deck/
     * relic/flask id that no longer resolves against the current registries.
     */
    loadRun(registries, slot = 1) {
      const json = storage.getItem(runKey(slot));
      if (!json) return null;
      let run;
      try {
        run = deserializeRun(json);
      } catch (e) {
        archive(json, e && e.message ? e.message : 'corrupt save', slot);
        return null;
      }
      if (run.contentVersion !== registries.contentVersion) {
        const dangling =
          (run.deck || []).find((c) => !registries.cards.has(c.cardId)) ||
          (run.relics || []).find((id) => !registries.relics.has(id)) ||
          (run.flasks || []).find((f) => !registries.flasks.has(f.flaskId));
        if (dangling) {
          archive(json, `contentVersion ${run.contentVersion} → ${registries.contentVersion}: dangling id`, slot);
          return null;
        }
        // Ids all still resolve: the run survives the content patch.
        run.contentVersion = registries.contentVersion;
      }
      // A run saved before equipment existed has no loadout. Give it the bare
      // starting one and re-stamp, rather than throwing away someone's climb.
      if (!run.loadout) {
        run.loadout = createLoadout(registries, run.class);
        stampDeck(registries, run);
      }
      return run;
    },

    hasRun(slot = 1) {
      return storage.getItem(runKey(slot)) != null;
    },

    clearRun(slot = 1) {
      storage.removeItem(runKey(slot));
    },

    /**
     * slotSummary(slot?) → a cheap descriptor for the slot picker (no content
     * validation), or null if empty/corrupt. Full validation happens on loadRun.
     */
    slotSummary(slot = 1) {
      const json = storage.getItem(runKey(slot));
      if (!json) return null;
      try {
        const r = JSON.parse(json);
        return {
          slot,
          class: r.class,
          actNumber: r.actNumber,
          floor: r.floor,
          seedString: r.seedString,
          hp: r.hp,
          maxHp: r.maxHp,
          customization: r.customization,
        };
      } catch (e) {
        return null;
      }
    },

    /** listSlots() → [{ slot, summary|null }] for every slot. */
    listSlots() {
      const out = [];
      for (let s = 1; s <= SLOTS; s++) out.push({ slot: s, summary: this.slotSummary(s) });
      return out;
    },

    // ---- meta: settings + last N run results (SPEC §3.12) -------------------
    loadMeta() {
      try {
        const meta = JSON.parse(storage.getItem(META_KEY) || 'null');
        if (meta && typeof meta === 'object') return meta;
      } catch (e) {
        /* fall through to fresh meta */
      }
      return { settings: {}, results: [] };
    },

    saveMeta(meta) {
      storage.setItem(META_KEY, JSON.stringify(meta));
    },

    /** Append a run result (victory, floor, seed, class, …), capped at 20. */
    recordResult(result) {
      const meta = this.loadMeta();
      meta.results.push(result);
      if (meta.results.length > HISTORY_LIMIT) {
        meta.results.splice(0, meta.results.length - HISTORY_LIMIT);
      }
      this.saveMeta(meta);
      return meta;
    },
  };
}

/** Plain in-memory storage stub (tests, or environments without localStorage). */
function createMemoryStorage() {
  const map = new Map();
  return {
    getItem: (k) => (map.has(k) ? map.get(k) : null),
    setItem: (k, v) => map.set(k, String(v)),
    removeItem: (k) => map.delete(k),
  };
}


Object.assign(module.exports, { RUN_KEY, RUN_ARCHIVE_KEY, META_KEY, SLOTS, createSaveManager, createMemoryStorage });

},
"src/engine/encounters.js": function (module, exports, require) {
// src/engine/encounters.js — encounter + reward rolls, shop stock, unknown
// nodes, shrine math (SPEC §3.8, §6)
//
// Procedural systems: seeded algorithms whose every knob comes from content
// (balance.js, encounters/*.js). Pure functions of (registries, rng, args) —
// run mutation is limited to explicitly documented counters (flask pity,
// removal price). Stream usage: encounters → 'enemyAI', card rewards →
// 'cardRewards', relics → 'relicRewards', flasks → 'flaskRewards',
// unknown nodes + events → 'events', shop stock → 'shop', cinders → 'misc'.
//
// Headless: no document/window/localStorage/timers.

const { passiveMult, passiveFlag } = require("src/model/registries.js");

// ---------------------------------------------------------------------------
// Encounters
// ---------------------------------------------------------------------------

/**
 * rollEncounter(registries, rng, { pool, act, exclude }) → encounter id.
 * Weighted pick from the act's pool; `exclude` is the no-repeat window
 * (pass the last 1–2 fought encounter ids). Encounters default to act 1.
 */
function rollEncounter(registries, rng, { pool, act = 1, exclude = [] } = {}) {
  const inActPool = (e) => e.pool === pool && (e.act || 1) === act;
  let candidates = registries.encounters.all().filter((e) => inActPool(e) && !exclude.includes(e.id));
  if (candidates.length === 0) {
    candidates = registries.encounters.all().filter(inActPool);
  }
  if (candidates.length === 0) throw new Error(`No encounters in pool '${pool}' for act ${act}`);
  const total = candidates.reduce((a, e) => a + e.weight, 0);
  let r = rng.float('enemyAI') * total;
  for (const e of candidates) {
    r -= e.weight;
    if (r < 0) return e.id;
  }
  return candidates[candidates.length - 1].id;
}

// ---------------------------------------------------------------------------
// Combat rewards (SPEC §6)
// ---------------------------------------------------------------------------

/** Cinder reward for a combat pool, scaled by runeGainMult passives (floored). */
function rollRuneReward(registries, rng, pool, relicIds) {
  const range = registries.balance.rewards.cinders[pool];
  const base = rng.int('misc', range[0], range[1]);
  return Math.floor(base * passiveMult(registries, relicIds, 'runeGainMult'));
}

/**
 * rollCardRewardIds(registries, rng, { classId, pool, relicIds }) → distinct
 * card ids (rarity-weighted per pool; elites offer +1 with Feral Eye).
 */
function rollCardRewardIds(registries, rng, { classId, pool, relicIds = [], flatRarity = false }) {
  const bal = registries.balance.rewards;
  let count = bal.cardChoices;
  if (pool === 'elite' && passiveFlag(registries, relicIds, 'eliteExtraCardReward')) count += 1;

  const cardPool = registries.classes.get(classId).cardPool;
  // flatRarity (Custom Climb "Chaos Rewards") ignores the pool weighting and
  // gives every rarity equal odds — far more rares than normal.
  const weights = flatRarity
    ? { common: 1, uncommon: 1, rare: 1 }
    : bal.rarityWeights[pool] || bal.rarityWeights.normal;
  const byRarity = {};
  for (const id of cardPool) {
    const def = registries.cards.get(id);
    (byRarity[def.rarity] = byRarity[def.rarity] || []).push(id);
  }
  const rarities = Object.keys(weights).filter((r) => byRarity[r] && byRarity[r].length);
  const total = rarities.reduce((a, r) => a + weights[r], 0);

  const picks = [];
  let guard = 0;
  while (picks.length < count && guard++ < 100) {
    let roll = rng.float('cardRewards') * total;
    let rarity = rarities[rarities.length - 1];
    for (const r of rarities) {
      roll -= weights[r];
      if (roll < 0) {
        rarity = r;
        break;
      }
    }
    const options = byRarity[rarity].filter((id) => !picks.includes(id));
    if (!options.length) continue;
    picks.push(rng.pick('cardRewards', options));
  }
  return picks;
}

/**
 * rollFlaskDrop(registries, rng, run) → flask id | null.
 * StS-style decaying chance: −step on a drop, +step on a miss (clamped),
 * persisted on run.flaskChancePct.
 */
function rollFlaskDrop(registries, rng, run) {
  const bal = registries.balance.rewards;
  if (run.flaskChancePct == null) run.flaskChancePct = bal.flaskDropBasePct;
  const hit = rng.float('flaskRewards') * 100 < run.flaskChancePct;
  if (hit) {
    run.flaskChancePct = Math.max(0, run.flaskChancePct - bal.flaskDropStepPct);
    const pool = registries.flasks.ids();
    return pool.length ? rng.pick('flaskRewards', pool) : null;
  }
  run.flaskChancePct = Math.min(100, run.flaskChancePct + bal.flaskDropStepPct);
  return null;
}

/**
 * rollRelicReward(registries, rng, ownedIds, { rarities }) → relic id | null.
 * Excludes owned relics; default pool is common/uncommon/rare (elite drops);
 * pass ['boss'] for boss rewards.
 */
function rollRelicReward(registries, rng, ownedIds, { rarities = ['common', 'uncommon', 'rare'] } = {}) {
  const pool = registries.relics
    .all()
    .filter((r) => rarities.includes(r.rarity) && !ownedIds.includes(r.id))
    .map((r) => r.id);
  return pool.length ? rng.pick('relicRewards', pool) : null;
}

// ---------------------------------------------------------------------------
// Shop (SPEC §6 prices — all from balance.shop)
// ---------------------------------------------------------------------------

/**
 * buildShopStock(registries, rng, run) → { cards, relics, flasks, removeCost }.
 * cards/relics/flasks: [{ id, cost }]. Deterministic on stream 'shop'.
 */
function buildShopStock(registries, rng, run) {
  const bal = registries.balance.shop;
  const classId = run.class;

  const cardIds = rollShopCards(registries, rng, classId, bal.cardStock);
  const cards = cardIds.map((id) => ({
    id,
    cost: rng.int('shop', ...bal.cardCost[registries.cards.get(id).rarity]),
  }));

  const relicPool = registries.relics
    .all()
    .filter((r) => ['common', 'uncommon', 'rare'].includes(r.rarity) && !run.relics.includes(r.id))
    .map((r) => r.id);
  const relics = [];
  for (let i = 0; i < bal.relicStock && relicPool.length; i++) {
    const id = rng.pick('shop', relicPool);
    relicPool.splice(relicPool.indexOf(id), 1);
    relics.push({ id, cost: rng.int('shop', ...bal.relicCost[registries.relics.get(id).rarity]) });
  }

  const flaskIds = registries.flasks.ids();
  const flasks = [];
  for (let i = 0; i < bal.flaskStock && flaskIds.length; i++) {
    const id = rng.pick('shop', flaskIds);
    flasks.push({ id, cost: rng.int('shop', bal.flaskCost[0], bal.flaskCost[1]) });
  }

  const removeCost = bal.removeBase + bal.removeStep * (run.removesPurchased || 0);
  return { cards, relics, flasks, removeCost };
}

// Shop card pool = the class pool + neutral colorless cards (StS-faithful:
// colorless is sold at Merchants, not offered in standard combat rewards).
// The status/curse colorless are rarity 'special' and excluded here.
const SHOP_RARITIES = ['common', 'uncommon', 'rare'];
function rollShopCards(registries, rng, classId, count) {
  const colorless = registries.cards
    .all()
    .filter((c) => c.class === 'colorless' && SHOP_RARITIES.includes(c.rarity))
    .map((c) => c.id);
  const pool = [...registries.classes.get(classId).cardPool, ...colorless];
  const out = [];
  while (out.length < count && pool.length) {
    const id = rng.pick('shop', pool);
    pool.splice(pool.indexOf(id), 1);
    out.push(id);
  }
  return out;
}

// ---------------------------------------------------------------------------
// Unknown nodes + shrine math
// ---------------------------------------------------------------------------

/**
 * resolveUnknownNode(registries, rng, { seenEvents }) →
 *   { kind: 'event', eventId } | { kind: 'fight'|'shrine'|'treasure' }
 * Odds from balance.unknownNode; events avoid repeats within a run while
 * unseen ones remain. Stream 'events' (SPEC §5.6).
 */
function resolveUnknownNode(registries, rng, { seenEvents = [] } = {}) {
  const odds = registries.balance.unknownNode;
  const total = Object.values(odds).reduce((a, b) => a + b, 0);
  let r = rng.float('events') * total;
  let kind = 'event';
  for (const [k, w] of Object.entries(odds)) {
    r -= w;
    if (r < 0) {
      kind = k;
      break;
    }
  }
  if (kind !== 'event') return { kind };
  let pool = registries.events.ids().filter((id) => !seenEvents.includes(id));
  if (!pool.length) pool = registries.events.ids();
  if (!pool.length) return { kind: 'fight' }; // no events shipped: fall back
  return { kind: 'event', eventId: rng.pick('events', pool) };
}

/** Shrine rest heal (SPEC shrine.healPct × shrineHealMult passives, floored). */
function shrineHealAmount(registries, run) {
  const pct = registries.balance.shrine.healPct;
  const mult = passiveMult(registries, run.relics, 'shrineHealMult');
  return Math.min(run.maxHp - run.hp, Math.floor((run.maxHp * pct * mult) / 100));
}


Object.assign(module.exports, { rollEncounter, rollRuneReward, rollCardRewardIds, rollFlaskDrop, rollRelicReward, buildShopStock, resolveUnknownNode, shrineHealAmount });

},
"src/ui/screens/title.js": function (module, exports, require) {
// src/ui/screens/title.js — animated main menu + save slots (SPEC §7.1, §3.12)

// Ambient animation only (gold-glow pulse, drifting embers) — feedback

function mountTitle(app, { slots, onContinue, onNew, onDelete, onHistory, onSettings, onQuit, onCustom, onLan }) {

  const EMBER_COUNT = { off: 0, low: 3, normal: 7, high: 14 };
  const emberN = EMBER_COUNT[document.documentElement.dataset.ambient] ?? 7;
  const embers = Array.from({ length: emberN }, (_, i) => {

               <span class="slot-title">${esc(summary.className)}</span>
               <span class="slot-meta">Act ${summary.actNumber} · Floor ${summary.floor} · ${summary.hp}/${summary.maxHp} HP</span>
               <span class="slot-seed">SEED ${esc(summary.seedString)}</span>
             </div>
             <div class="slot-actions">
               <button class="slot-continue" data-slot="${slot}">CONTINUE</button>
               <button class="subtle slot-delete" data-slot="${slot}" title="Delete this run">✕</button>
             </div>
           </div>`
        : `<div class="slot empty">
             <div class="slot-info"><span class="slot-tag">SLOT ${slot}</span><span class="slot-empty-label">Empty</span></div>
             <button class="slot-new" data-slot="${slot}">BEGIN A CLIMB</button>
           </div>`
    )
    .join('');

  app.innerHTML = `
    <div class="screen title-screen">
      ${embers}
      <div class="title-stack">
        <h1 class="title-big title-glow">ASHEN SPIRE</h1>
        <p class="subtitle" style="text-align:center">A ROGUELIKE DECKBUILDER</p>
      </div>
      <div class="slot-list">${slotCards}</div>
      <div class="title-menu">
        <button class="subtle" id="lan-play" hidden>FORSAKEN TOGETHER</button>
        <button class="subtle" id="custom-climb">CUSTOM CLIMB</button>
        <button class="subtle" id="run-history">RUN HISTORY</button>
        <button class="subtle" id="settings">SETTINGS</button>
        <button class="subtle" id="quit-game">QUIT</button>
      </div>
      <p style="color:var(--muted);font-size:11px;letter-spacing:.15em">THE EMBER FLOWS UPWARD. FOLLOW IT.</p>
    </div>`;

  app.querySelector('#run-history').addEventListener('click', onHistory);
  app.querySelector('#settings').addEventListener('click', onSettings);
  if (onQuit) app.querySelector('#quit-game').addEventListener('click', onQuit);
  if (onCustom) app.querySelector('#custom-climb').addEventListener('click', onCustom);
  // LAN play only exists when the launcher's server is behind the page — the
  // orchestrator un-hides the button once /api/lan/info answers.
  if (onLan) app.querySelector('#lan-play').addEventListener('click', onLan);
  app.querySelectorAll('.slot-continue').forEach((b) => b.addEventListener('click', () => onContinue(+b.dataset.slot)));
  app.querySelectorAll('.slot-new').forEach((b) => b.addEventListener('click', () => onNew(+b.dataset.slot)));
  // Delete is a two-click, self-resetting confirm (no blocking dialog).
  app.querySelectorAll('.slot-delete').forEach((b) =>

          b.dataset.armed = '0';
          b.textContent = '✕';
          b.classList.remove('armed');
        }
      }, 2500);
    })
  );
}


Object.assign(module.exports, { mountTitle });

"src/ui/components/tooltip.js": function (module, exports, require) {
// src/ui/components/tooltip.js — one shared tooltip, ≤150 ms hover (SPEC §7.3)

let tipEl = null;
let showTimer = null;

function ensure() {
  if (!tipEl) {
    tipEl = document.createElement('div');
    tipEl.id = 'tooltip';
    document.body.appendChild(tipEl);
  }
  return tipEl;
}

function position(x, y) {
  const el = ensure();
  const pad = 14;
  const r = el.getBoundingClientRect();
  let left = x + pad;
  let top = y + pad;
  if (left + r.width > innerWidth - 8) left = x - r.width - pad;
  if (top + r.height > innerHeight - 8) top = y - r.height - pad;
  el.style.left = `${Math.max(4, left)}px`;
  el.style.top = `${Math.max(4, top)}px`;
}

/**
 * attachTooltip(el, contentFn) — contentFn() → HTML string (computed at show
 * time so numbers are always live). Shows on pointer hover AND on the
 * keyboard/gamepad focus cursor (input.js dispatches gpfocus/gpblur when the
 * gp-focus cursor lands on / leaves an element), so controller players get
 * every tooltip a mouse would.
 */
function attachTooltip(el, contentFn) {
  const show = (x, y) => {
    const html = contentFn();
    if (!html) return;
    const t = ensure();
    t.innerHTML = html;
    t.style.display = 'block';
    position(x, y);
  };
  el.addEventListener('pointerenter', (ev) => {
    clearTimeout(showTimer);
    showTimer = setTimeout(() => show(ev.clientX, ev.clientY), 140);
  });
  el.addEventListener('pointermove', (ev) => {
    if (tipEl && tipEl.style.display === 'block') position(ev.clientX, ev.clientY);
  });
  el.addEventListener('pointerleave', () => {
    clearTimeout(showTimer);
    if (tipEl) tipEl.style.display = 'none';
  });
  el.addEventListener('gpfocus', () => {
    clearTimeout(showTimer);
    const r = el.getBoundingClientRect();
    showTimer = setTimeout(() => show(r.right, r.top), 160);
  });
  el.addEventListener('gpblur', hideTooltip);
}

function hideTooltip() {
  clearTimeout(showTimer);
  if (tipEl) tipEl.style.display = 'none';
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
}


Object.assign(module.exports, { attachTooltip, hideTooltip, esc });

},
"src/ui/screens/customize.js": function (module, exports, require) {
// src/ui/screens/customize.js — character creation: class selection, name,
// sigil + tint (cosmetic), keepsake (starting boon), seed.
//
// Everything chosen here lands on run.customization (cosmetics), the class id,
// and one keepsake whose run-level effects apply at run start (content/keepsakes.js).

const { LOCKED_CLASSES } = require("src/content/index.js");
const { KEEPSAKES } = require("src/content/keepsakes.js");
const { PORTRAIT_GLYPHS, PORTRAIT_TINTS, SPRITE_STYLES, tintCss, classGlyph, classSprite, spritesAreEnabled } = require("src/ui/assets.js");
const { esc } = require("src/ui/components/tooltip.js");

function mountCustomize(app, { registries, defaultSeedString, onBack, onStart }) {
  const state = {
    classId: 'reaver',
    name: 'Forsaken',
    glyph: PORTRAIT_GLYPHS[0],
    tint: PORTRAIT_TINTS[0].id,
    spriteStyle: 'rendered',
    keepsakeId: 'none',
  };

  app.innerHTML = `
    <div class="screen customize" style="justify-content:flex-start;overflow-y:auto;gap:16px;padding-top:26px">
      <h2 style="color:var(--gold);font-size:24px;letter-spacing:.2em">PREPARE YOUR FORSAKEN</h2>

      <div style="display:flex;gap:34px;align-items:flex-start">
        <div class="preview-pane" style="display:flex;flex-direction:column;align-items:center;gap:10px">
          <div id="cz-portrait" class="cz-portrait"></div>
          <input id="cz-name" maxlength="16" spellcheck="false" value="Forsaken"
            style="background:var(--panel);border:1px solid var(--line);color:var(--parchment);border-radius:8px;padding:6px 10px;width:150px;text-align:center;font-family:var(--font-display);letter-spacing:.08em">
          <div class="seed-line">Seed <input id="seed-input" maxlength="10" spellcheck="false" value="${esc(defaultSeedString)}"></div>
        </div>

        <div style="display:flex;flex-direction:column;gap:14px;max-width:560px">
          <div><p class="cz-label">CLASS</p><div id="cz-classes" class="class-row"></div></div>
          <div><p class="cz-label">SIGIL</p><div id="cz-glyphs" class="cz-opts"></div></div>
          <div><p class="cz-label">TINT</p><div id="cz-tints" class="cz-opts"></div></div>
          <div><p class="cz-label">SPRITE</p><div id="cz-styles" class="cz-opts"></div></div>
          <div><p class="cz-label">KEEPSAKE</p><div id="cz-keepsakes" class="cz-keepsakes"></div></div>
        </div>
      </div>

      <div style="display:flex;gap:14px">
        <button class="subtle" id="cz-back">Back</button>
        <button id="cz-start">BEGIN THE CLIMB</button>
      </div>
    </div>`;

  const $ = (s) => app.querySelector(s);

  function renderPortrait() {
    const p = $('#cz-portrait');
    p.style.borderColor = tintCss(state.tint);
    p.style.boxShadow = `0 0 34px color-mix(in srgb, ${tintCss(state.tint)} 35%, transparent)`;
    p.innerHTML = '';
    // With sprites on, preview the class figure you'll actually play; otherwise
    // the chosen sigil (which is what combat shows when sprites are off).
    const sprite = spritesAreEnabled() && state.spriteStyle !== 'glyph'
      ? classSprite(state.classId, tintCss(state.tint), state.glyph, state.tint, state.spriteStyle)
      : null;
    if (sprite) p.appendChild(sprite);
    else p.textContent = state.glyph;
  }

  // ---- class row (real classes + locked M3 silhouettes) ----
  const classes = $('#cz-classes');
  for (const cls of registries.classes.all()) {
    const el = document.createElement('div');
    el.className = 'class-pick cz-class';
    el.dataset.classId = cls.id;
    el.innerHTML = `<div class="glyph">${classGlyph(cls.id)}</div><h3>${esc(cls.name)}</h3><p>${esc(cls.description || '')}</p><span class="chip">HP ${cls.maxHp} · ${cls.startingDeck.length} cards</span>`;
    el.addEventListener('click', () => {
      state.classId = cls.id;
      classes.querySelectorAll('.cz-class').forEach((x) => x.classList.toggle('chosen', x === el));
      renderPortrait();
    });
    classes.appendChild(el);
  }
  for (const cls of LOCKED_CLASSES) {
    const el = document.createElement('div');
    el.className = 'class-pick locked';
    el.innerHTML = `<div class="glyph">${classGlyph(cls.id)}</div><h3>${esc(cls.name)}</h3><p>${esc(cls.description)}</p><span class="chip">ARRIVES IN ${esc(cls.milestone)}</span>`;
    classes.appendChild(el);
  }
  classes.querySelector('.cz-class').classList.add('chosen');

  // ---- sigil + tint pickers ----
  const glyphBox = $('#cz-glyphs');
  PORTRAIT_GLYPHS.forEach((g, i) => {
    const b = document.createElement('div');
    b.className = `cz-opt${i === 0 ? ' chosen' : ''}`;
    b.textContent = g;
    b.addEventListener('click', () => {
      state.glyph = g;
      glyphBox.querySelectorAll('.cz-opt').forEach((x) => x.classList.toggle('chosen', x === b));
      renderPortrait();
    });
    glyphBox.appendChild(b);
  });
  const tintBox = $('#cz-tints');
  PORTRAIT_TINTS.forEach((t, i) => {
    const b = document.createElement('div');
    b.className = `cz-opt tint${i === 0 ? ' chosen' : ''}`;
    b.style.background = t.css;
    b.title = t.name;
    b.addEventListener('click', () => {
      state.tint = t.id;
      tintBox.querySelectorAll('.cz-opt').forEach((x) => x.classList.toggle('chosen', x === b));
      renderPortrait();
    });
    tintBox.appendChild(b);
  });

  // ---- sprite style (rendered art / classic silhouette / sigil glyph) ----
  const styleBox = $('#cz-styles');
  SPRITE_STYLES.forEach((st, i) => {
    const b = document.createElement('div');
    b.className = `cz-opt style${i === 0 ? ' chosen' : ''}`;
    b.textContent = st.name;
    b.style.cssText = 'width:auto;padding:0 12px;font-size:12px;letter-spacing:.08em;';
    b.addEventListener('click', () => {
      state.spriteStyle = st.id;
      styleBox.querySelectorAll('.cz-opt').forEach((x) => x.classList.toggle('chosen', x === b));
      renderPortrait();
    });
    styleBox.appendChild(b);
  });

  // ---- keepsakes ----
  const ksBox = $('#cz-keepsakes');
  KEEPSAKES.forEach((ks, i) => {
    const el = document.createElement('div');
    el.className = `cz-keepsake${i === 0 ? ' chosen' : ''}`;
    el.innerHTML = `<span class="ks-icon">${esc(ks.icon)}</span><div><b>${esc(ks.name)}</b><p>${esc(ks.desc)}</p></div>`;
    el.addEventListener('click', () => {
      state.keepsakeId = ks.id;
      ksBox.querySelectorAll('.cz-keepsake').forEach((x) => x.classList.toggle('chosen', x === el));
    });
    ksBox.appendChild(el);
  });

  $('#cz-name').addEventListener('input', (ev) => {
    state.name = ev.target.value.trim() || 'Forsaken';
  });
  $('#cz-back').addEventListener('click', onBack);
  $('#cz-start').addEventListener('click', () => {
    onStart({
      classId: state.classId,
      seedString: $('#seed-input').value.trim(),
      customization: { name: state.name, glyph: state.glyph, tint: state.tint, spriteStyle: state.spriteStyle },
      keepsakeId: state.keepsakeId,
    });
  });

  renderPortrait();
}


Object.assign(module.exports, { mountCustomize });

},

"src/ui/assets.js": function (module, exports, require) {
// src/ui/assets.js — asset lookup + placeholder generator (SPEC §2.4)
//
// Every visual goes through here. M1 ships zero downloaded assets: everything
// renders as the style guide's placeholder recipe (tinted rounded rect +
// glyph + name). Swapping in real art later = mapping an id to a URL here,
// with a CREDITS.md row — no game-code changes.

const { balance } = require("src/content/balance.js");

// Sprite size tiers (the display dimensions each enemy def's `size` selects) are
// data — content/balance.js → ui.spriteTiers. Sizes are generous on purpose: the
// board reads best when sprites fill it, and the whole UI is zoomed to fit the
// window (main.js applyUiScale), so larger base sizes mean a bolder board rather
// than overflow. Values are px-magnitude; emitted as rem (÷10, since :root is
// 62.5% → 1rem = 10px) so sprites track the text-size setting. Shadows stay px.
const SIZE_TIERS = balance.ui.spriteTiers;
const rem = (px) => `${px / 10}rem`;

/**
 * Enemy sprite: the Blender-rendered PNG when it exists
 * (assets/sprites/enemy_<id>.png, tools/sprites-blender.py), else the style
 * guide's placeholder recipe (tinted rounded rect + glyph). New enemies with
 * no render yet fall back automatically — the img error handler swaps in the
 * placeholder, so content can ship art-less.
 */
function enemySprite(enemyDef) {
  const tier = SIZE_TIERS[enemyDef.size || 'medium'];
  const tint = enemyDef.tint || 'var(--line-soft)';
  const el = document.createElement('div');
  const placeholder = () => {
    el.innerHTML = '';
    el.style.cssText = `width:${rem(tier.w)};height:${rem(tier.h)};border-radius:10px;` +
      `background:var(--panel);border:2px solid ${tint};display:flex;align-items:center;` +
      `justify-content:center;font-size:${rem(tier.font)};position:relative;` +
      `box-shadow:0 ${Math.round(tier.h * 0.08)}px 10px rgba(0,0,0,.5);`;
    el.textContent = enemyDef.art || '☠';
  };
  el.style.cssText = `width:${rem(tier.w)};height:${rem(tier.h)};position:relative;` +
    'display:flex;align-items:flex-end;justify-content:center;';
  const img = document.createElement('img');
  img.src = `assets/sprites/enemy_${enemyDef.id}.png`;
  img.alt = enemyDef.name || enemyDef.id;
  img.style.cssText = `width:100%;height:100%;object-fit:contain;` +
    `filter:drop-shadow(0 ${Math.round(tier.h * 0.06)}px 8px rgba(0,0,0,.55));`;
  img.addEventListener('error', placeholder);
  el.appendChild(img);
  return el;
}

// Character customization options (cosmetic — stored on run.customization).
const PORTRAIT_GLYPHS = ['⚔', '🛡', '🔥', '🌙', '☀', '🐺'];
const PORTRAIT_TINTS = [
  { id: 'gold', css: 'var(--gold)', name: 'Goldbough gold' },
  { id: 'ember', css: 'var(--ember)', name: 'Gorefire ember' },
  { id: 'frost', css: 'var(--frost)', name: 'Hoarfrost' },
  { id: 'rot', css: 'var(--rot)', name: 'Crimson blight' },
  { id: 'grace', css: 'var(--grace)', name: 'Lost ember' },
];

// ---- Class character sprites (inline SVG, tinted) --------------------------
// Hand-authored, dependency-free silhouettes — one per class. Togglable in
// Settings; when off, playerSprite falls back to the chosen sigil glyph.
let spritesEnabled = true;
function setSpritesEnabled(on) {
  spritesEnabled = on !== false;
}
function spritesAreEnabled() {
  return spritesEnabled;
}

// Each builder takes a tint (CSS color/var) used for accents and the player's
// chosen sigil, worn as a chest medallion so the customization reads on the
// figure itself (not just the portrait). No sigil → the original plain accent.
// viewBox 110×140, figure standing on a soft shadow.
function sigilMedallion(cx, cy, t, sigil, plainR) {
  if (!sigil) return `<circle cx="${cx}" cy="${cy}" r="${plainR}" fill="${t}"/>`;
  const safe = String(sigil).replace(/[<>&"]/g, '');
  return (
    `<circle cx="${cx}" cy="${cy}" r="8" fill="#14100c" stroke="${t}" stroke-width="1.5"/>` +
    `<text x="${cx}" y="${cy + 0.5}" font-size="11" fill="#e8dcc0" text-anchor="middle" dominant-baseline="central">${safe}</text>`
  );
}

const CLASS_SVG = {
  // Reaver — armored knight, greatsword held point-down, cape behind.
  reaver: (t, sigil) => `
    <svg viewBox="0 0 110 140" xmlns="http://www.w3.org/2000/svg" width="110" height="140">
      <ellipse cx="55" cy="133" rx="28" ry="5" fill="rgba(0,0,0,.45)"/>
      <path d="M30 48 L24 130 L86 130 L80 48 Q55 40 30 48Z" fill="#20190f"/>
      <g fill="#3a3226">
        <path d="M40 56 Q55 48 70 56 L68 118 L42 118Z"/>
        <path d="M36 58 Q31 48 42 46 L46 62Z"/>
        <path d="M74 58 Q79 48 68 46 L64 62Z"/>
      </g>
      <path d="M40 56 Q55 49 70 56" fill="none" stroke="${t}" stroke-width="1.5"/>
      <path d="M44 26 Q55 12 66 26 Q68 40 55 47 Q42 40 44 26Z" fill="#4a4034" stroke="${t}" stroke-width="1.4"/>
      <rect x="53" y="28" width="4" height="16" rx="2" fill="#0e0a08"/>
      <rect x="52.5" y="66" width="5" height="58" rx="1" fill="#b8b0a0"/>
      <rect x="44" y="64" width="22" height="4" rx="2" fill="${t}"/>
      <circle cx="55" cy="61" r="4" fill="${t}"/>
      ${sigilMedallion(55, 84, t, sigil, 5.5)}
    </svg>`,
  // Starseer — robed mage, wide pointed hat, star-topped staff, sparkles.
  starseer: (t, sigil) => `
    <svg viewBox="0 0 110 140" xmlns="http://www.w3.org/2000/svg" width="110" height="140">
      <ellipse cx="55" cy="133" rx="26" ry="5" fill="rgba(0,0,0,.45)"/>

      <path d="M81.7 15 l3.4 7.6 8.3 .8 -6.2 5.6 1.8 8.1 -7.3-4.2 -7.3 4.2 1.8-8.1 -6.2-5.6 8.3-.8z" fill="${t}"/>

    </svg>`,
  // Herald — hooded pilgrim, halo, prayer beads at the waist.
  herald: (t, sigil) => `
    <svg viewBox="0 0 110 140" xmlns="http://www.w3.org/2000/svg" width="110" height="140">
      <ellipse cx="55" cy="133" rx="26" ry="5" fill="rgba(0,0,0,.45)"/>
      <circle cx="55" cy="30" r="16" fill="none" stroke="${t}" stroke-width="2"/>
      <path d="M38 64 L30 130 L80 130 L72 64 Q55 58 38 64Z" fill="#2e1f1f"/>
      <path d="M40 44 Q55 20 70 44 L70 72 Q55 80 40 72Z" fill="#241413"/>
      <path d="M46 50 Q55 41 64 50 L62 68 Q55 72 48 68Z" fill="#0e0a08"/>
      <path d="M40 44 Q55 20 70 44" fill="none" stroke="${t}" stroke-width="1.4"/>

      ${sigilMedallion(55, 84, t, sigil, 3)}
      <path d="M49 95 Q55 105 61 95" fill="none" stroke="${t}" stroke-width="1.4"/>
    </svg>`,
};

// Rendered class sprites (tools/sprites-blender.py → assets/sprites/): one
// transparent PNG per class × accent tint. Missing/unloadable art falls back
// to the inline SVG silhouette, so the single-file dist and file:// play keep
// working with zero configuration. Art credit: procedurally generated in
// Blender by this repo (see CREDITS.md).
// Derived, never restated: the tint slots ARE the customization tints, and the
// classes with rendered art ARE the ones with a silhouette builder. Hand-listing
// them again let the sprite lookup silently drift from the content it serves.
const SPRITE_TINT_IDS = PORTRAIT_TINTS.map((t) => t.id);
const SPRITE_CLASSES = Object.keys(CLASS_SVG);
function renderedSpriteUrl(classId, tintId) {
  if (!SPRITE_CLASSES.includes(classId)) return null;
  const t = SPRITE_TINT_IDS.includes(tintId) ? tintId : 'gold';
  return `assets/sprites/${classId}_${t}.png`;
}

// Player sprite styles: 'rendered' (Blender PNG), 'classic' (inline SVG
// silhouette), 'glyph' (sigil-in-a-panel). Chosen per character.
const SPRITE_STYLES = [
  { id: 'rendered', name: 'Rendered' },
  { id: 'classic', name: 'Classic' },
  { id: 'glyph', name: 'Sigil' },
];

/** A tinted class sprite (rendered PNG, SVG fallback), or null if unknown. */
function classSprite(classId, tint, sigil, tintId, style) {
  const build = CLASS_SVG[classId];
  if (!build) return null;
  const el = document.createElement('div');
  el.className = 'class-sprite';
  el.style.cssText = 'width:15rem;height:19rem;display:flex;align-items:flex-end;justify-content:center;position:relative;';

  const fallbackToSvg = () => {
    el.innerHTML = build(tint, sigil);
    const svg = el.querySelector('svg');
    if (svg) {
      // The class SVGs hardcode a 110×140 viewBox; fill the rem-sized container
      // (viewBox keeps ratio) so the figure reads as boldly as the enemies and
      // tracks the text-size setting.
      svg.setAttribute('width', '100%');
      svg.setAttribute('height', '100%');
    }
  };

  const url = style === 'classic' ? null : renderedSpriteUrl(classId, tintId);
  if (!url) {
    fallbackToSvg();
    return el;
  }
  const img = document.createElement('img');
  img.src = url;
  img.alt = classId;
  img.style.cssText = 'width:100%;height:100%;object-fit:contain;image-rendering:auto;';
  img.addEventListener('error', fallbackToSvg); // dist / file:// → SVG
  el.appendChild(img);
  // The chosen sigil rides the rendered art as a chest medallion overlay.
  if (sigil) {
    const med = document.createElement('span');
    med.textContent = sigil;
    med.style.cssText =
      `position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);` +
      `width:2.2rem;height:2.2rem;border-radius:50%;background:#14100c;border:1.5px solid ${tint};` +
      'display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:#e8dcc0;';
    el.appendChild(med);
  }
  return el;
}

/**
 * The player's combat figure: the class sprite when sprites are enabled (and the
 * class has one), else the chosen sigil glyph in a tinted panel.
 */
function playerSprite(customization = {}, classId) {
  const tint = tintCss(customization.tint);
  const style = customization.spriteStyle || 'rendered';
  if (spritesEnabled && style !== 'glyph' && CLASS_SVG[classId]) {
    return classSprite(classId, tint, customization.glyph, customization.tint, style);
  }
  const el = document.createElement('div');
  el.style.cssText =
    `width:15rem;height:19rem;border-radius:10px;background:#2a2418;border:2px solid ${tint};` +
    'display:flex;align-items:center;justify-content:center;font-size:7rem;position:relative;' +
    `box-shadow:0 10px 12px rgba(0,0,0,.5), inset 0 0 24px rgba(0,0,0,.4);`;
  el.textContent = customization.glyph || '🛡';
  return el;
}

function tintCss(tintId) {
  const t = PORTRAIT_TINTS.find((x) => x.id === tintId);
  return t ? t.css : 'var(--gold)';
}

// Class sigil glyphs come from the class defs (data). main.js registers them at
// boot via setClassGlyphs so classGlyph(id) stays a cheap synchronous lookup for
// its many call sites; unknown classes fall back to the generic sigil.
let classGlyphs = {};
function setClassGlyphs(classes) {
  classGlyphs = {};
  for (const c of classes || []) if (c.glyph) classGlyphs[c.id] = c.glyph;
}
function classGlyph(classId) {
  return classGlyphs[classId] || '❖';
}


Object.assign(module.exports, { enemySprite, PORTRAIT_GLYPHS, PORTRAIT_TINTS, setSpritesEnabled, spritesAreEnabled, SPRITE_STYLES, classSprite, playerSprite, tintCss, setClassGlyphs, classGlyph });

},
"src/ui/screens/customRun.js": function (module, exports, require) {
// src/ui/screens/customRun.js — Custom Climb setup (SPEC §10 ascension seam).
//
// Pick a class, an Ascension level (a preset that stacks difficulty rules), any
// individual difficulty/chaos toggles, a deck mode, and a seed — then hand the
// assembled { classId, seedString, custom } to the orchestrator. Custom runs
// are flagged and kept out of win-rate telemetry (see history.js).

const { DIFFICULTY_MODS, CHAOS_MODS, DECK_MODES, ASCENSION_ORDER, MAX_ASCENSION, activeMods } = require("src/content/customMods.js");
const { classGlyph } = require("src/ui/assets.js");
const { esc } = require("src/ui/components/tooltip.js");

function mountCustomRun(app, { registries, defaultSeedString, onBack, onStart }) {
  const state = {
    classId: registries.classes.all()[0].id,
    ascension: 0,
    mods: {}, // explicit toggles (on top of ascension-enabled rules)
    deckMode: 'standard',
  };

  app.innerHTML = `
    <div class="screen customrun" style="justify-content:flex-start;overflow-y:auto;gap:16px;padding-top:26px">
      <h2 style="color:var(--gold);font-size:24px;letter-spacing:.2em">CUSTOM CLIMB</h2>
      <p class="subtitle">SHAPE YOUR OWN ASCENT — RESULTS ARE KEPT OUT OF WIN-RATE STATS</p>

      <div style="display:flex;flex-direction:column;gap:16px;max-width:680px;width:92%">
        <div><p class="cz-label">CLASS</p><div id="cr-classes" class="class-row" style="flex-wrap:wrap;justify-content:center"></div></div>

        <div>
          <p class="cz-label">ASCENSION <span id="cr-asc-val" style="color:var(--gold)">0</span> / ${MAX_ASCENSION}</p>
          <input id="cr-asc" type="range" min="0" max="${MAX_ASCENSION}" step="1" value="0" style="width:100%;accent-color:var(--gold)">
          <p class="set-note" id="cr-asc-note">No extra difficulty. Slide up to stack the rules below.</p>
        </div>

        <div><p class="cz-label">DIFFICULTY RULES</p><div id="cr-diff" class="mod-grid"></div></div>
        <div><p class="cz-label">CHAOS</p><div id="cr-chaos" class="mod-grid"></div></div>
        <div><p class="cz-label">STARTING DECK</p><div id="cr-deck" class="mod-grid"></div></div>

        <div class="seed-line">Seed <input id="cr-seed" maxlength="10" spellcheck="false" value="${esc(defaultSeedString)}"></div>
      </div>

      <div style="display:flex;gap:14px;padding-bottom:24px">
        <button class="subtle" id="cr-back">Back</button>
        <button id="cr-start">BEGIN THE CLIMB</button>
      </div>
    </div>`;

  const $ = (s) => app.querySelector(s);

  // ---- class picks ----
  const classes = $('#cr-classes');
  for (const cls of registries.classes.all()) {
    const el = document.createElement('div');
    el.className = 'class-pick cr-class';
    el.dataset.classId = cls.id;
    el.innerHTML = `<div class="glyph">${classGlyph(cls.id)}</div><h3>${esc(cls.name)}</h3><span class="chip">HP ${cls.maxHp}</span>`;
    el.addEventListener('click', () => {
      state.classId = cls.id;
      classes.querySelectorAll('.cr-class').forEach((x) => x.classList.toggle('chosen', x === el));
    });
    classes.appendChild(el);
  }
  classes.querySelector('.cr-class').classList.add('chosen');

  // ---- ascension slider (enables the first N difficulty rules) ----
  const ascLabel = $('#cr-asc-val');
  const ascNote = $('#cr-asc-note');
  const asc = $('#cr-asc');
  asc.addEventListener('input', () => {
    state.ascension = Number(asc.value);
    ascLabel.textContent = state.ascension;
    const enabled = ASCENSION_ORDER.slice(0, state.ascension)
      .map((id) => DIFFICULTY_MODS.find((m) => m.id === id).label)
      .join(', ');
    ascNote.textContent = state.ascension ? `Enables: ${enabled}.` : 'No extra difficulty. Slide up to stack the rules below.';
    refreshModChips();
  });

  // ---- mod toggle grids ----
  function modChip(m) {
    const el = document.createElement('button');
    el.className = 'mod-chip';
    el.dataset.mod = m.id;
    el.innerHTML = `<b>${esc(m.label)}</b><span>${esc(m.desc)}</span>`;
    el.addEventListener('click', () => {
      if (el.classList.contains('forced')) return; // locked on by the ascension level
      state.mods[m.id] = !state.mods[m.id];
      refreshModChips();
    });
    return el;
  }
  const diffBox = $('#cr-diff');
  const chaosBox = $('#cr-chaos');
  DIFFICULTY_MODS.forEach((m) => diffBox.appendChild(modChip(m)));
  CHAOS_MODS.forEach((m) => chaosBox.appendChild(modChip(m)));

  // Reflect both explicit toggles and ascension-enabled rules; ascension-forced
  // rules show as "locked on" (can't be turned off below the slider level).
  function refreshModChips() {
    const eff = activeMods(state);
    const forced = new Set(ASCENSION_ORDER.slice(0, state.ascension));
    app.querySelectorAll('.mod-chip').forEach((el) => {
      const id = el.dataset.mod;
      el.classList.toggle('on', !!eff[id]);
      el.classList.toggle('forced', forced.has(id));
    });
  }

  // ---- deck mode ----
  const deckBox = $('#cr-deck');
  DECK_MODES.forEach((m, i) => {
    const el = document.createElement('button');
    el.className = `mod-chip${i === 0 ? ' on' : ''}`;
    el.dataset.deck = m.id;
    el.innerHTML = `<b>${esc(m.label)}</b><span>${esc(m.desc)}</span>`;
    el.addEventListener('click', () => {
      state.deckMode = m.id;
      deckBox.querySelectorAll('.mod-chip').forEach((x) => x.classList.toggle('on', x === el));
    });
    deckBox.appendChild(el);
  });

  $('#cr-back').addEventListener('click', onBack);
  $('#cr-start').addEventListener('click', () => {
    onStart({
      classId: state.classId,
      seedString: $('#cr-seed').value.trim(),
      custom: { ascension: state.ascension, mods: { ...state.mods }, deckMode: state.deckMode },
    });
  });

  refreshModChips();
}


Object.assign(module.exports, { mountCustomRun });

},
"src/ui/screens/draft.js": function (module, exports, require) {
// src/ui/screens/draft.js — Custom Climb "Draft" deck builder.
//
// Presents `rounds` rounds of `choices` cards from the class pool; the player
// picks one each round to add to their starting deck. Deterministic on the
// run's rng (stream 'cardRewards'), so a seed drafts the same offers.

const { renderCard } = require("src/ui/components/card.js");
const { createCardInstance, createIdGen } = require("src/model/state.js");

function mountDraft(app, { registries, classId, rng, rounds = 3, choices = 3, onDone }) {
  const pool = registries.classes.get(classId).cardPool.slice();
  const idGen = createIdGen('df');
  const picked = [];
  let round = 0;

  function renderRound() {
    // Offer `choices` distinct cards from the remaining pool.
    const offer = [];
    const local = pool.slice();
    for (let i = 0; i < choices && local.length; i++) {
      const id = rng.pick('cardRewards', local);
      local.splice(local.indexOf(id), 1);
      offer.push(id);
    }

    app.innerHTML = `
      <div class="screen" style="gap:18px">
        <h2 style="color:var(--gold);font-size:24px;letter-spacing:.15em">DRAFT YOUR DECK</h2>
        <p class="subtitle">PICK ${round + 1} OF ${rounds} — CHOOSE A CARD TO ADD</p>
        <div class="grid draft-grid" style="justify-content:center"></div>
        <p class="set-note">Drafted so far: <b id="draft-count">${picked.length}</b></p>
      </div>`;

    const grid = app.querySelector('.draft-grid');
    for (const id of offer) {
      const el = renderCard(registries, { instanceId: `preview_${id}`, cardId: id, upgraded: false }, {});
      el.addEventListener('click', () => {
        picked.push(createCardInstance(id, false, idGen));
        // Remove one copy from the pool so later rounds skew fresh.
        const idx = pool.indexOf(id);
        if (idx >= 0) pool.splice(idx, 1);
        round += 1;
        if (round >= rounds) onDone(picked);
        else renderRound();
      });
      grid.appendChild(el);
    }
  }

  renderRound();
}


Object.assign(module.exports, { mountDraft });

},
"src/ui/components/card.js": function (module, exports, require) {
// src/ui/components/card.js — DOM card renderer (mockup: card-anatomy.svg)
//
// All numbers shown come from the engine: in combat, previewCard tokens
// (live math, SPEC §3.13); outside combat, the card's own literal values via
// computeTokenBindings. No math happens here.

const { resolveCard } = require("src/model/registries.js");
const { computeTokenBindings } = require("src/model/validate.js");
const { attachTooltip, esc } = require("src/ui/components/tooltip.js");
const { balance } = require("src/content/balance.js");
const { tagsFor } = require("src/content/tags.js");

/** Static token values straight off the def (for reward/pile/deck views). */
function staticTokens(def) {
  const tokens = {};
  for (const b of computeTokenBindings(def.effects || [])) {
    const v = (def.effects[b.index] || {})[b.field];
    if (typeof v === 'number') tokens[b.token] = v;
  }
  return tokens;
}

function fillTemplate(def, tokens, baseTokens) {
  let html = esc(def.textTemplate);
  html = html.replace(/\{([A-Za-z][\w.]*)\}/g, (m, tok) => {
    const v = tokens[tok];
    if (v == null) return m;
    let cls = 'val';
    if (baseTokens && typeof baseTokens[tok] === 'number') {
      if (v > baseTokens[tok]) cls += ' up';
      else if (v < baseTokens[tok]) cls += ' down';
    }
    return `<span class="${cls}">${v}</span>`;
  });
  // Light keyword coloring for readability.
  html = html
    .replace(/\b(Bleed|Crimson Blight|Staggered|Poise)\b/g, '<span class="st-bleed">$1</span>')
    .replace(/\b(Exhaust|Ethereal|Innate|Retain|Unplayable)\b/g, '<span class="kw">$1</span>');
  return html;
}

/**
 * renderCard(registries, ref, opts) → element.
 *   ref  — { cardId, upgraded, instanceId? }
 *   opts — { preview?    (previewCard result → live numbers),
 *            affordable? (bool; greys out when false),
 *            small?      (scale for reward/pile grids) }
 */
function renderCard(registries, ref, opts = {}) {
  const def = resolveCard(registries, ref);
  const el = document.createElement('div');
  el.className = `card rarity-${def.rarity} cls-${def.class} type-${def.type}${ref.upgraded ? ' upgraded' : ''}`;
  // Type presentation is data (balance.ui.cardTypes): corner radii carry the
  // type (attack squarest → power roundest) and each type owns its banner
  // colour. Renaming a label here never touches engine logic.
  const ty = balance.ui.cardTypes[def.type];
  if (ty) {
    el.style.setProperty('--card-type-color', ty.color);
    el.style.setProperty('--card-radius', `${ty.radius}px`);
    el.style.setProperty('--card-art-radius', `${ty.art}px`);
  }
  // The class motif hue is DATA (class def cardTint), handed to CSS as a var so
  // adding a class brings its own card colour with no stylesheet edit. Colorless
  // cards have no owning class, so they fall back to the neutral frame.
  const owner = registries.classes.has(def.class) ? registries.classes.get(def.class) : null;
  if (owner && owner.cardTint) el.style.setProperty('--card-tint', owner.cardTint);
  if (opts.affordable === false) el.classList.add('unaffordable');
  if (ref.instanceId) el.dataset.instanceId = ref.instanceId;
  el.dataset.cardId = def.id;

  const tags = tagsFor(def.id);
  const base = staticTokens(def);
  const tokens = opts.preview ? { ...base, ...opts.preview.tokens } : base;
  const cost = opts.preview ? (opts.preview.costIsX ? 'X' : opts.preview.cost) : def.cost;

  el.innerHTML =
    `<div class="cost">${esc(cost)}</div>` +
    `<div class="cname">${esc(def.name)}</div>` +
    `<div class="art">${esc(def.icon || '❖')}</div>` +
    `<div class="ctype">${esc((ty && ty.label) || def.type.toUpperCase())}</div>` +
    // Subtypes: authored in content/source/cardTagging.csv. Untagged cards
    // render nothing here, so the layout is unchanged for them.
    (tags.length
      ? `<div class="ctags">${tags
          .map((t) => `<span class="ctag" style="--tag-color:#${esc(t.color)}" title="${esc(t.blurb)}">${esc(t.glyph)} ${esc(t.label)}</span>`)
          .join('')}</div>`
      : '') +
    `<div class="ctext">${fillTemplate(def, tokens, base)}</div>`;

  // opts.tooltipFn overrides the default tooltip (e.g. Smith upgrade preview).
  attachTooltip(el, () => (opts.tooltipFn ? opts.tooltipFn() : cardTooltip(registries, def, tokens)));
  if (opts.small) {
    el.style.transform = 'scale(0.92)';
  }
  return el;
}

/**
 * Tooltip HTML previewing what a card becomes when Smithed: current text in
 * muted, upgraded text below with changed values highlighted green/red (the
 * same up/down coloring cards use in play). All numbers come from the defs.
 */
function upgradePreviewHtml(registries, ref) {
  const base = resolveCard(registries, { cardId: ref.cardId, upgraded: false });
  const upg = resolveCard(registries, { cardId: ref.cardId, upgraded: true });
  const baseTokens = staticTokens(base);
  const upgTokens = { ...baseTokens, ...staticTokens(upg) };
  let html = `<div class="tt-title">${esc(base.name)} → ${esc(base.name)}+</div>`;
  html += `<div style="color:var(--muted)">${fillTemplate(base, baseTokens, null)}</div>`;
  html += `<div style="margin-top:6px">${fillTemplate(upg, upgTokens, baseTokens)}</div>`;
  if (upg.cost !== base.cost) html += `<div class="tt-kw">Cost <b>${esc(base.cost)}</b> → <b>${esc(upg.cost)}</b></div>`;
  return html;
}

function cardTooltip(registries, def, tokens) {
  let html = `<div class="tt-title">${esc(def.name)} — ${esc(def.type)}, cost ${esc(def.cost)}</div>`;
  html += `<div>${fillTemplate(def, tokens, null)}</div>`;
  // Nested keyword + status tooltips (SPEC §7.3).
  const lines = [];
  for (const kw of def.keywords || []) {
    if (registries.keywords.has(kw)) {
      const k = registries.keywords.get(kw);
      lines.push(`<b>${esc(k.name)}</b> — ${esc(k.tooltip)}`);
    }
  }
  for (const eff of def.effects || []) {
    if (eff.op === 'applyStatus' && registries.statuses.has(eff.status)) {
      const s = registries.statuses.get(eff.status);
      if (s.tooltip) lines.push(`<b>${esc(s.name)}</b> — ${esc(s.tooltip)}`);
    }
    if (eff.op === 'enterStance' && registries.stances.has(eff.stance)) {
      const s = registries.stances.get(eff.stance);
      if (s.tooltip) lines.push(`<b>${esc(s.name)}</b> — ${esc(s.tooltip)}`);
    }
  }
  if (def.flavor) lines.push(`<i>${esc(def.flavor)}</i>`);
  if (lines.length) html += `<div class="tt-kw">${lines.join('<br>')}</div>`;
  return html;
}


Object.assign(module.exports, { staticTokens, renderCard, upgradePreviewHtml });

},
"src/content/tags.js": function (module, exports, require) {
// src/content/tags.js — card subtype tags, indexed for lookup.
//
// The primary card type (attack / skill / power) is engine-load-bearing and
// frozen. Tags are the layer beneath it: what KIND of attack, which school a
// skill belongs to. They are authored as two spreadsheets and compiled by
// tools/content-build.mjs:
//
//   content/source/cardTags.csv     the registry — id, label, colour, glyph
//   content/source/cardTagging.csv  which cards carry which tags
//
// Tagging a card is a CSV row, never a code change. Nothing here mutates the
// card defs, so the validated content bundle is untouched and a bad tag shows
// up as a test failure rather than a silently missing chip.

const { cardTags } = require("src/content/generated/cardTags.js");
const { cardTagging } = require("src/content/generated/cardTagging.js");

/** All registered tags, in authoring order. */
const TAGS = cardTags;

const BY_ID = new Map(cardTags.map((t) => [t.id, t]));

// cardId → [tagId]. The CSV coerces a single value to a string and a
// pipe-separated one to an array, so normalise both to an array here.
const BY_CARD = new Map(
  cardTagging.map((row) => [
    row.cardId,
    row.tags === '' ? [] : (Array.isArray(row.tags) ? row.tags : [row.tags]),
  ])
);

/** tagsFor(cardId) → [{ id, label, color, glyph, blurb }] (empty when untagged). */
function tagsFor(cardId) {
  return (BY_CARD.get(cardId) || []).map((id) => BY_ID.get(id)).filter(Boolean);
}

/** Raw tag ids for a card — for validation and future synergy predicates. */
function tagIdsFor(cardId) {
  return BY_CARD.get(cardId) || [];
}

/** Every card id that carries a given tag (e.g. "all Blade cards"). */
function cardsWithTag(tagId) {
  const out = [];
  for (const [cardId, ids] of BY_CARD) if (ids.includes(tagId)) out.push(cardId);
  return out;
}

function hasTag(id) {
  return BY_ID.has(id);
}


Object.assign(module.exports, { TAGS, tagsFor, tagIdsFor, cardsWithTag, hasTag });
