<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ashen Spire</title>
  <style data-src="styles/base.css">
/* styles/base.css — palette, reset, typography (GDD §7, sprite style guide) */

:root {
  --bg: #0d0b08;
  --bg-raise: #171310;
  --panel: #241d15;
  --line: #3a3226;
  --line-soft: #4a4034;
  --parchment: #e8dcc0;
  --muted: #7a6f5a;
  --gold: #c9a227;
  --accent-rgb: 201, 162, 39; /* --gold as rgb, for glow/halo alpha (swapped by accent theme) */
  --blood: #8a1a1a;
  --rot: #b5541c;
  --frost: #7fa8c9;
  --grace: #9fc3e8;
  --ember: #c9502e;
  --green: #7fd97f;
  --font-display: 'Cinzel', Georgia, 'Times New Roman', serif;
  --font-body: Inter, 'Segoe UI', system-ui, sans-serif;
}

/* Accessibility: high contrast raises text/line contrast by swapping tokens. */
body.hi-contrast {
  --parchment: #fdf6e6;
  --muted: #a89571;
  --line: #6a5b43;
  --line-soft: #85714f;
}
body.hi-contrast .set-note, body.hi-contrast .card .ctext, body.hi-contrast .cz-keepsake p { color: #cdbf9e; }

/* Accessibility: text size is set on the root element (main.js applyDisplaySettings
   → html font-size %). Because all type + component dimensions are rem, one root
   value rescales the whole UI proportionally — S/M/L/XL. Compounds with --ui-zoom
   (which additionally scales the px-kept hairlines/radii). */

/* Accessibility: colorblind-friendly semantic remap (Okabe-Ito hues chosen to
   stay distinguishable under deuteranopia/protanopia — danger→vermillion,
   heal→bluish-green, frost→sky, blight→orange, bleed→reddish-purple). */
body.cb-safe {
  --blood: #d55e00;
  --ember: #d55e00;
  --green: #009e73;
  --frost: #56b4e9;
  --grace: #56b4e9;
  --rot: #e69f00;
}
body.cb-safe .card .ctext .st-bleed { color: #cc79a7; }

/* Accessibility: readable headings swap the decorative serif for the UI sans. */
body.readable-ui { --font-display: var(--font-body); }

/* Ambient effects: 'off' also stills the title glow pulse; 'high' brightens it. */
:root[data-ambient='off'] .title-glow { animation: none; text-shadow: 0 0 20px rgba(var(--accent-rgb), 0.2); }
:root[data-ambient='high'] .title-glow { animation-duration: 2.2s; }

* { margin: 0; padding: 0; box-sizing: border-box; }

/* Root sizing anchor: 62.5% makes 1rem = 10px, so every rem in the stylesheets
   maps to px÷10 at rest. The text-size setting overrides this % on <html> to
   grow/shrink all rem-based type + dimensions at once (main.js). */
html { height: 100%; overflow: hidden; font-size: 62.5%; }

/* UI size: the whole app is zoomed by --ui-zoom (Settings → UI size / Auto, set
   in main.js). Sizing uses PERCENT heights (not vh) everywhere below `body` so
   they resolve against the zoomed box and stay exactly viewport-sized — scaling
   up never overflows, scaling down still fills. (vh ignores zoom, which is what
   used to overflow.) */
body {
  background: radial-gradient(ellipse 60% 40% at 70% 10%, rgba(201, 162, 39, 0.06), transparent),
    linear-gradient(#16110c, var(--bg));
  color: var(--parchment);
  font-family: var(--font-body);
  font-size: 1.4rem;
  overflow: hidden;
  user-select: none;
  zoom: var(--ui-zoom, 1);
  width: 100%;
  height: 100%;
}

#app { height: 100%; display: flex; flex-direction: column; }

h1, h2, h3, .display { font-family: var(--font-display); letter-spacing: 0.08em; }

button {
  font-family: var(--font-display);
  letter-spacing: 0.1em;
  background: var(--panel);
  color: var(--gold);
  border: 2px solid var(--gold);
  border-radius: 10px;
  padding: 1rem 2.6rem;
  font-size: 1.5rem;
  cursor: pointer;
  transition: background 120ms, transform 120ms;
}
button:hover { background: #2e2517; }
button:disabled { border-color: var(--line); color: var(--muted); cursor: default; }
button.subtle { border-color: var(--line-soft); color: var(--parchment); font-size: 1.2rem; padding: 0.6rem 1.4rem; }

.bar {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow: hidden;
}
.bar > .fill { position: absolute; inset: 0; right: auto; transition: width 200ms; }
.bar > .label {
  position: relative; z-index: 1; text-align: center; font-size: 1rem;
  line-height: 1; padding: 0.2rem 0; color: var(--parchment); text-shadow: 0 1px 2px #000;
}

/* ---------- screen transitions (every mount fades in) ---------- */
#app > * { animation: screenIn 240ms ease-out; }
@keyframes screenIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

/* Accessibility: honor reduced-motion for ALL animation (GDD §6). */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* Manual override from Settings — applies regardless of the OS preference. */
.reduced-motion, .reduced-motion *, .reduced-motion *::before, .reduced-motion *::after {
  animation-duration: 0.01ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: 0.01ms !important;
}

  </style>
  <style data-src="styles/ui.css">
/* styles/ui.css — tooltips, cards, modals, screens shared chrome */

/* ---------- tooltip ---------- */
#tooltip {
  position: fixed; z-index: 1000; max-width: 28rem; pointer-events: none;
  background: #14100c; border: 1px solid var(--gold); border-radius: 8px;
  padding: 1rem 1.2rem; font-size: 1.2rem; line-height: 1.5; color: var(--parchment);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.7); display: none;
}
#tooltip .tt-title { color: var(--gold); font-family: var(--font-display); font-size: 1.3rem; margin-bottom: 0.4rem; }
#tooltip .tt-kw { border-top: 1px solid var(--line); margin-top: 0.6rem; padding-top: 0.6rem; color: var(--muted); }
#tooltip .tt-kw b { color: var(--parchment); }

/* ---------- card ---------- */
.card {
  position: relative; width: 14rem; height: 19.6rem; border-radius: var(--card-radius, 10px);
  background: linear-gradient(#241e15, #1a1510);
  border: 2px solid #5a5040; color: var(--parchment);
  display: flex; flex-direction: column; align-items: center;
  padding: 2.6rem 0.8rem 0.8rem; cursor: pointer; flex-shrink: 0;
  transition: transform 140ms, box-shadow 140ms, border-color 140ms;
}
.card.rarity-uncommon { border-color: var(--frost); }
.card.rarity-rare { border-color: var(--gold); }
.card.rarity-special { border-color: #6a3a7a; }
.card .cost {
  position: absolute; top: -1rem; left: -1rem; width: 3rem; height: 3rem;
  border-radius: 50%; background: #1c1610; border: 2px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 1.4rem; color: var(--parchment);
}
.card.unaffordable { filter: grayscale(0.7) brightness(0.7); }
.card .cname { font-family: var(--font-display); font-size: 1.15rem; text-align: center; line-height: 1.15; min-height: 2.6rem; }
.card.upgraded .cname { color: var(--green); }
.card .art {
  width: 11.6rem; height: 6.6rem; margin: 0.3rem 0; border-radius: var(--card-art-radius, 6px);
  background: #14100c; border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center; font-size: 3.4rem;
}
.card .ctype {
  width: 11.6rem; border-radius: 4px; background: #2a241c; color: var(--gold);
  font-size: 0.9rem; letter-spacing: 3px; text-align: center; padding: 0.3rem 0;
  font-family: var(--font-display);
}
.card .ctext { font-size: 1.1rem; text-align: center; line-height: 1.4; margin-top: 0.6rem; }
.card .ctext .kw { color: var(--gold); }
.card .ctext .st-bleed { color: var(--ember); font-weight: 600; }
.card .ctext .val { font-weight: 700; }
.card .ctext .val.up { color: var(--green); }
.card .ctext .val.down { color: var(--ember); }


/* ---------- card TYPE: geometry + banner colour --------------------------- */
/* Type reads as SHAPE first — attack squarest and chamfered, power roundest,
   skill between (radii come from balance.ui.cardTypes as --card-radius /
   --card-art-radius). Each type also owns its banner colour, kept to that one
   small element so it doesn't fight rarity (border), class (wash) or accent
   (chrome). */
.card .ctype {
  color: var(--card-type-color, var(--gold));
  background: color-mix(in srgb, var(--card-type-color, var(--gold)) 15%, #2a241c);
}
/* Attack: clipped top-left / bottom-right, so the frame reads like an edge. */
.card.type-attack .art {
  clip-path: polygon(0.8rem 0, 100% 0, 100% calc(100% - 0.8rem), calc(100% - 0.8rem) 100%, 0 100%, 0 0.8rem);
}
.card.type-attack .ctype {
  clip-path: polygon(0.5rem 0, 100% 0, calc(100% - 0.5rem) 100%, 0 100%);
}
/* Skill: the neutral middle — plain rounded banner. */
.card.type-skill .ctype { border-radius: 4px; }
/* Power: fully rounded, with a keep-line inside the art to read as ongoing. */
.card.type-power .ctype { border-radius: 999px; }
.card.type-power .art { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--card-type-color) 40%, transparent); }


/* Card subtypes (content/source/cardTagging.csv). A quiet strip under the type
   banner — each chip takes its own registered colour, kept low-contrast so the
   card's primary reads (name, numbers) still win the eye. */
.card .ctags {
  display: flex; flex-wrap: wrap; gap: 0.3rem; justify-content: center;
  margin-top: 0.3rem; line-height: 1;
}
.card .ctag {
  font-size: 0.8rem; letter-spacing: 0.04em; white-space: nowrap;
  color: var(--tag-color, var(--muted));
  border: 1px solid color-mix(in srgb, var(--tag-color, var(--muted)) 45%, transparent);
  background: color-mix(in srgb, var(--tag-color, var(--muted)) 12%, transparent);
  border-radius: 3px; padding: 0.1rem 0.35rem;
}

/* ---------- card colour motif (Settings → Display → Card motif) ------------ */
/* Two independent axes, both player-chosen:
     class  → --card-tint, set per card from the class def's cardTint (data, so
              a new class brings its own hue with no edit here)
     accent → --gold / --accent-rgb, already themed by the accent setting
   The mode lives on :root[data-card-motif] and the wash depth on
   --card-motif-strength, so switching is a re-paint with no re-render.
   Colorless cards carry no --card-tint and keep the neutral frame. */
:root { --card-motif-strength: 0.10; }

/* wash — the class tints the card body; rarity keeps the border. */
:root[data-card-motif='wash'] .card[style*='--card-tint']::before {
  content: ''; position: absolute; inset: 0; border-radius: 8px; pointer-events: none;
  background: var(--card-tint); opacity: var(--card-motif-strength);
}
/* (The banner used to take the accent here. The card TYPE owns it now — see
   the type block above — so the motif leaves it alone and the two systems
   stop fighting over the same element.) */

/* accent — your accent takes the border; rarity demotes to a corner pip so it
   stays readable, and the class shows as a large watermark sigil. */
:root[data-card-motif='accent'] .card { border-color: var(--gold); }
:root[data-card-motif='accent'] .card::after {
  content: ''; position: absolute; top: 5px; right: 5px; width: 9px; height: 9px;
  border-radius: 50%; background: var(--line-soft); pointer-events: none;
}
:root[data-card-motif='accent'] .card.rarity-uncommon::after { background: var(--frost); }
:root[data-card-motif='accent'] .card.rarity-rare::after { background: var(--gold); }
:root[data-card-motif='accent'] .card.rarity-special::after { background: #6a3a7a; }
:root[data-card-motif='accent'] .card[style*='--card-tint']::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: var(--card-tint); opacity: calc(var(--card-motif-strength) * 1.3);
  -webkit-mask-image: radial-gradient(circle at 50% 52%, #000 38%, transparent 72%);
  mask-image: radial-gradient(circle at 50% 52%, #000 38%, transparent 72%);
}

/* band — a class stripe along the top and an accent rule under the art. */
:root[data-card-motif='band'] .card[style*='--card-tint']::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
  background: var(--card-tint); pointer-events: none;
}
:root[data-card-motif='band'] .card .art { border-bottom: 2px solid var(--gold); }

/* ---------- modal / pile viewer ---------- */
.modal-veil {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); z-index: 500;
  display: flex; align-items: center; justify-content: center;
}
.modal {
  background: var(--bg-raise); border: 1px solid var(--gold); border-radius: 12px;
  max-width: 90rem; max-height: 80vh; padding: 2.2rem; overflow: auto;
}
.modal h2 { color: var(--gold); font-size: 1.6rem; margin-bottom: 1.4rem; }
.modal .grid { display: flex; flex-wrap: wrap; gap: 1.4rem; }

/* ---------- in-run tabbed overlay ---------- */
.overlay-modal { width: 76rem; max-width: 92vw; height: 74vh; display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.overlay-head { display: flex; align-items: center; justify-content: space-between; gap: 1.2rem; padding: 1.2rem 1.6rem; border-bottom: 1px solid var(--line); background: var(--panel); }
.overlay-tabs { display: flex; gap: 0.6rem; flex-wrap: wrap; }
.overlay-tabs .ov-tab {
  padding: 0.7rem 1.4rem; border-radius: 8px 8px 0 0; font-size: 1.2rem; letter-spacing: 0.05em;
  background: transparent; border: 1px solid transparent; color: var(--muted); cursor: pointer;
}
.overlay-tabs .ov-tab:hover { color: var(--parchment); }
.overlay-tabs .ov-tab.on { color: var(--gold); border-color: var(--line); border-bottom-color: transparent; background: var(--bg-raise); }
.overlay-actions { display: flex; gap: 0.8rem; align-items: center; }
.overlay-body { flex: 1; overflow: auto; padding: 1.8rem; }
.overlay-body .grid { display: flex; flex-wrap: wrap; gap: 1.2rem; justify-content: center; }
.ov-relic-grid { display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 0.8rem; }
.ov-relic { display: flex; gap: 1rem; align-items: flex-start; padding: 0.8rem 1rem; background: var(--panel); border: 1px solid var(--line-soft); border-radius: 8px; }
.ov-relic-ic { font-size: 2rem; flex-shrink: 0; }
.ov-relic b { color: var(--parchment); font-size: 1.3rem; }
.ov-relic p { color: var(--muted); font-size: 1.1rem; margin-top: 0.2rem; line-height: 1.4; }
.ov-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem 2.2rem; max-width: 52rem; }
.ov-stat { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line-soft); padding: 0.6rem 0; }
.ov-stat span { color: var(--muted); font-size: 1.2rem; }
.ov-stat b { color: var(--parchment); font-size: 1.2rem; }
.set-cat { color: var(--gold); font-size: 1.2rem; letter-spacing: 0.15em; text-transform: uppercase; margin: 1.4rem 0 0.4rem; }
.set-cat:first-child { margin-top: 0; }
.subtle.danger { border-color: var(--blood); color: var(--ember); }
.subtle.danger:hover { background: rgba(140, 30, 30, 0.25); border-color: var(--ember); }
.ov-save-actions { display: flex; flex-direction: column; gap: 1rem; align-items: stretch; margin-top: 1.4rem; max-width: 32rem; }
.ov-save-actions button { text-align: left; padding: 1.1rem 1.6rem; }

/* ---------- boss-intro title card ---------- */
.boss-intro {
  position: fixed; inset: 0; z-index: 650; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse 70% 50% at 50% 46%, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.88));
  animation: bi-veil 480ms ease-out;
}
.boss-intro .bi-stack { text-align: center; animation: bi-rise 700ms cubic-bezier(0.2, 0.8, 0.3, 1); }
.boss-intro .bi-tag {
  color: var(--muted); font-family: var(--font-display); font-size: 1.3rem;
  letter-spacing: 0.5em; margin-bottom: 1.4rem;
}
.boss-intro .bi-name {
  color: var(--gold); font-size: 5.4rem; letter-spacing: 0.12em; line-height: 1.15;
  max-width: 80vw; text-shadow: 0 0 34px rgba(var(--accent-rgb), 0.55), 0 2px 10px #000;
}
.boss-intro .bi-rule {
  width: 34rem; max-width: 60vw; height: 1px; margin: 2rem auto 0;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  animation: bi-rule 900ms ease-out;
}
.boss-intro.bi-out { animation: bi-fade 460ms ease-in forwards; }
@keyframes bi-veil { from { opacity: 0; } }
@keyframes bi-rise { from { opacity: 0; transform: translateY(16px) scale(0.97); } }
@keyframes bi-rule { from { transform: scaleX(0.2); opacity: 0; } }
@keyframes bi-fade { to { opacity: 0; } }

/* ---------- command log (Settings → Advanced) ---------- */
.debug-modal { width: 72rem; max-width: 94vw; }
.debug-log-body {
  margin-top: 1rem; max-height: 46vh; overflow: auto; user-select: text;
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 1rem 1.2rem; font-family: Consolas, monospace; font-size: 1.1rem;
  line-height: 1.55; color: var(--parchment); white-space: pre-wrap; word-break: break-word;
}

/* ---------- keyboard / gamepad focus cursor ---------- */
.gp-focus {
  outline: 3px solid var(--gold) !important; outline-offset: 2px;
  box-shadow: 0 0 16px rgba(var(--accent-rgb), 0.6) !important; border-radius: 6px;
}
.map-node.gp-focus circle { stroke: var(--gold) !important; stroke-width: 4 !important; }
.reduced-motion .gp-focus { box-shadow: none !important; }

/* ---------- contextual control-hint bar ---------- */
.hint-bar {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 0.6rem; z-index: 40;
  display: flex; gap: 1.4rem; pointer-events: none; white-space: nowrap;
  padding: 0.4rem 1.2rem; border-radius: 10px; max-width: 96vw; overflow: hidden;
  background: rgba(12, 10, 7, 0.62); border: 1px solid var(--line-soft);
  font-size: 1.1rem; color: var(--muted); letter-spacing: 0.04em;
}
.hint-bar.hint-combat { top: 5.8rem; bottom: auto; } /* under the 5.2rem topbar; combat's bottom is full */
.hint-bar .hint { display: inline-flex; align-items: center; gap: 0.5rem; }
.hint-bar kbd {
  font-family: var(--font-body); font-size: 1rem; min-width: 1.5rem; text-align: center;
  padding: 0.1rem 0.5rem; border-radius: 4px; color: var(--parchment);
  background: var(--panel); border: 1px solid var(--gold);
}
/* Controller glyphs read as rounded buttons. */
.hint-bar.hint-pad kbd { border-radius: 999px; padding: 0.1rem 0.7rem; }
body.hide-hints .hint-bar { display: none; }

/* ---------- controls / rebinds ---------- */
.rebind-list { display: flex; flex-direction: column; }
.rebind-row .rebind-ctl { display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }
.pad-btn {
  min-width: 6.2rem; text-align: center; padding: 0.4rem 0.8rem; border-radius: 6px;
  background: var(--panel); border: 1px solid var(--gold); color: var(--gold);
  font-size: 1.2rem; font-variant-numeric: tabular-nums;
}
.rebind-btn.listening { border-color: var(--ember); color: var(--ember); animation: pulse-gold 0.7s ease-in-out infinite alternate; }
.pad-live { color: var(--green); font-size: 1.1rem; }
.pad-off { color: var(--muted); font-size: 1.1rem; }

/* ---------- custom climb ---------- */
.mod-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.8rem; }
.mod-chip {
  text-align: left; padding: 0.8rem 1.2rem; border-radius: 8px; cursor: pointer;
  background: var(--panel); border: 1px solid var(--line-soft); color: var(--parchment);
  display: flex; flex-direction: column; gap: 0.2rem; transition: border-color 140ms, background 140ms;
}
.mod-chip b { font-size: 1.2rem; }
.mod-chip span { font-size: 1.05rem; color: var(--muted); line-height: 1.35; }
.mod-chip:hover { border-color: var(--gold); }
.mod-chip.on { background: rgba(201, 162, 39, 0.16); border-color: var(--gold); }
.mod-chip.on b { color: var(--gold); }
.mod-chip.forced { cursor: not-allowed; opacity: 0.85; }
.mod-chip.forced::after { content: 'ASCENSION'; font-size: 0.8rem; letter-spacing: 0.12em; color: var(--ember); margin-top: 0.2rem; }
.customrun .cz-label { color: var(--muted); font-size: 1.1rem; letter-spacing: 0.18em; margin-bottom: 0.6rem; }
.draft-grid { gap: 1.6rem; }
.hx-custom { display: inline-block; margin-left: 0.6rem; padding: 0.1rem 0.5rem; border-radius: 4px; font-size: 0.9rem; letter-spacing: 0.08em; background: rgba(201, 162, 39, 0.18); border: 1px solid var(--gold); color: var(--gold); }
.farewell { gap: 2.2rem; }
.farewell .title-big { opacity: 0.9; }

/* ---------- generic screens ---------- */
.screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.8rem; padding: 2.4rem; }
.screen .title-big { font-size: 4.4rem; color: var(--gold); text-align: center; text-shadow: 0 0 40px rgba(201, 162, 39, 0.35); }
.screen .subtitle { color: var(--muted); letter-spacing: 0.3em; font-size: 1.2rem; }
.seed-line { color: var(--muted); font-size: 1.2rem; }
.seed-line input {
  background: var(--panel); border: 1px solid var(--line); color: var(--parchment);
  border-radius: 6px; padding: 0.4rem 0.8rem; width: 11rem; font-family: monospace; text-align: center;
}

.class-row { display: flex; gap: 1.8rem; }
.class-pick {
  width: 19rem; padding: 1.6rem; border: 2px solid var(--line-soft); border-radius: 12px;
  background: var(--panel); cursor: pointer; text-align: center; transition: border-color 150ms, transform 150ms;
}
.class-pick:hover { border-color: var(--gold); transform: translateY(-3px); }
.class-pick.locked { opacity: 0.45; cursor: default; }
.class-pick.locked:hover { border-color: var(--line-soft); transform: none; }
.class-pick .glyph { font-size: 4.4rem; margin-bottom: 0.8rem; }
.class-pick h3 { color: var(--gold); font-size: 1.5rem; margin-bottom: 0.6rem; }
.class-pick p { font-size: 1.1rem; color: var(--muted); line-height: 1.5; }

/* ---------- act backdrop ---------- */
/* One rendered plate per act (tools/backdrops-blender.py → assets/bg/*.webp,
   ~4 KB each; tools/bundle.mjs base64s them into the standalone build). The
   plate is geometry only — the bloom around the Goldbough is the ::after
   radial-gradient below, so it stays perfectly smooth, costs no bytes, and
   picks up the player's accent colour. Sits behind everything, never eats
   clicks. */
.backdrop {

  background-position: center 38%; background-size: cover; background-repeat: no-repeat;
  opacity: 0.55;
}
.backdrop::after {
  content: ''; position: absolute; left: 50%; top: 20%; width: 46rem; height: 46rem;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(var(--accent-rgb), 0.30), rgba(var(--accent-rgb), 0.10) 38%, transparent 68%);
  animation: backdropGlow 7s ease-in-out infinite alternate;

/* Keep the board legible over art: a floor-to-mid scrim under the combatants. */
.backdrop::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(13, 11, 8, 0.30) 0%, rgba(13, 11, 8, 0.10) 38%, rgba(13, 11, 8, 0.82) 100%);
}

/* ---------- battlefield ---------- */
/* The combatants sit ON the backdrop, so the field is a positioned layer above
   it and the rows are pulled up out of the old dead space at the top. */
.field { flex: 1; display: flex; align-items: stretch; position: relative; z-index: 1; }
.player-zone {
  width: 32%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  padding-bottom: 2.6rem; gap: 0.6rem;
}
.enemy-row {
  flex: 1; display: flex; align-items: flex-end; justify-content: space-evenly;
  padding-bottom: 2.6rem; gap: 1rem;
}

.combatant { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; position: relative; }
.combatant .sprite { position: relative; display: flex; align-items: flex-end; justify-content: center; }
.combatant .meters { width: 13rem; display: flex; flex-direction: column; gap: 0.3rem; }
.combatant .hpbar { height: 1.2rem; }
.combatant .hpbar .fill { background: var(--blood); }
.combatant .poisebar { height: 0.6rem; }
.combatant .poisebar .fill { background: var(--gold); }
.combatant .poisebar.full .fill { animation: pulse-gold 600ms infinite alternate; }
.combatant .bleedbar { height: 0.6rem; }
.combatant .bleedbar .fill { background: var(--ember); }
.combatant .nm { font-size: 1.2rem; }
.combatant.dead { opacity: 0.25; filter: grayscale(1); pointer-events: none; }

/* Likely-target glow: a tinted, slightly-larger clone of the sprite sits behind
   the real one (which is kept on top), so the target reads as a colored,
   glowing silhouette — red for an enemy, blue for a self/buff target. */
.combatant .sprite > *:not(.aim-silho) { position: relative; z-index: 1; }
.aim-silho {
  position: absolute; left: 50%; bottom: 0; z-index: 0; pointer-events: none;
  transform: translateX(-50%) scale(1.16); transform-origin: center bottom;
  filter: blur(2px); opacity: 0.9;
  animation: aimGlow 900ms ease-in-out infinite alternate;
}
.aim-silho > * { box-shadow: none !important; }
@keyframes aimGlow { from { opacity: 0.5; } to { opacity: 0.95; } }
.reduced-motion .aim-silho { animation: none; filter: blur(1px); opacity: 0.8; }
.combatant.player.armed { cursor: pointer; }

.enemy .sprite { cursor: pointer; }
.enemy.targetable .sprite { outline: 2px dashed var(--gold); outline-offset: 6px; border-radius: 10px; }
.enemy.hover-target .sprite { outline-style: solid; }

.block-badge {
  position: absolute; left: -1.4rem; bottom: 3.4rem; z-index: 2;
  width: 3.4rem; height: 3.8rem; display: flex; align-items: center; justify-content: center;
  background: var(--frost); color: #0d0b08; font-weight: 800; font-size: 1.4rem;
  clip-path: polygon(50% 0, 100% 22%, 100% 62%, 50% 100%, 0 62%, 0 22%);
}

.statuses { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; min-height: 2.2rem; max-width: 15rem; }
.status-icon {
  position: relative; width: 2.2rem; height: 2.2rem; border-radius: 50%;
  background: var(--panel); border: 1.5px solid var(--muted);
  display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: default;
}
.status-icon .stk {
  position: absolute; right: -0.5rem; bottom: -0.5rem; font-size: 0.9rem; font-weight: 700;
  background: #14100c; border-radius: 6px; padding: 0 0.3rem; border: 1px solid var(--line);
}
.stance-chip {
  display: flex; align-items: center; gap: 0.6rem; font-size: 1.2rem; color: var(--ember);
  border: 1px solid var(--ember); border-radius: 14px; padding: 0.3rem 1rem;
}
.stance-chip.bulwark { color: var(--frost); border-color: var(--frost); }

/* ---------- intents ---------- */
.intent {
  display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem;
  background: #1c1610; border: 1.5px solid var(--blood); border-radius: 9px;
  padding: 0.4rem 1rem; font-weight: 700; font-size: 1.4rem; cursor: default;
}
.intent.block { border-color: var(--frost); }
.intent.buff { border-color: var(--gold); }
.intent.debuff { border-color: #6a3a7a; }
.intent.staggered { border-color: var(--gold); color: var(--gold); }
.intent.delayed { border-style: dashed; }
.intent .ic { font-size: 1.3rem; }

/* ---------- keyboard shortcut hints (SPEC §7.3) ---------- */
/* Positional quick-play badge: a square gray keycap straddling the card's
   top-center edge (approved look — coin placement, square, gray). Static per
   slot: leftmost card is always 1 … then Q for the 10th. Hidden while a
   gamepad drives (body.pad-mode, kept live by refreshHintBars). */
.card .key-hint {
  position: absolute; top: -1rem; left: 50%; transform: translateX(-50%); z-index: 3;
  min-width: 2rem; height: 2rem; padding: 0 0.4rem; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  background: #2b2b28; border: 1.5px solid #8d887c; color: #d8d3c4;
  font-family: var(--font-body); font-weight: 700; font-size: 1.1rem;
  pointer-events: none; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
}
body.pad-mode .card .key-hint { display: none; }

/* Flask quick-use badge on the top-bar flask icons (F/G/H or pad glyphs). */
.flask-slot { position: relative; }
.flask-slot .flask-key {
  position: absolute; bottom: -0.7rem; left: 50%; transform: translateX(-50%);
  min-width: 1.4rem; padding: 0 0.3rem; border-radius: 3px; text-align: center;
  background: #2b2b28; border: 1px solid #8d887c; color: #d8d3c4;
  font-family: var(--font-body); font-weight: 700; font-size: 0.9rem; line-height: 1.3rem;
  pointer-events: none;
}
body.pad-mode .flask-slot .flask-key { border-radius: 999px; }
.enemy-key {
  position: absolute; top: 0.2rem; left: 0.2rem; z-index: 3;
  min-width: 1.7rem; height: 1.7rem; padding: 0 0.3rem; border-radius: 4px;
  background: var(--gold); color: #1c1610; font-family: monospace; font-weight: 700; font-size: 1.1rem;
  display: flex; align-items: center; justify-content: center; pointer-events: none;
  box-shadow: 0 0 8px rgba(201, 162, 39, 0.5);
}

/* ---------- hand + controls ---------- */
.hand-area { height: 23rem; flex-shrink: 0; position: relative; display: flex; align-items: flex-end; justify-content: center; }
.hand { display: flex; align-items: flex-end; justify-content: center; height: 100%; padding-bottom: 1rem; }

.hand .card:hover, .hand .card.selected {

  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.8);
}
.hand .card.selected { border-color: var(--parchment); }

.energy-orb {
  position: absolute; left: 3.4rem; bottom: 6.6rem; width: 6.8rem; height: 6.8rem; border-radius: 50%;
  background: #1c1610; border: 3px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.9rem; font-weight: 800; box-shadow: 0 0 24px rgba(201, 162, 39, 0.25);
}
.end-turn { position: absolute; right: 3.4rem; bottom: 7.6rem; }
.end-turn .et-key {
  font-family: var(--font-body); font-size: 1rem; margin-left: 0.7rem; vertical-align: 1px;
  padding: 0.1rem 0.6rem; border-radius: 4px; color: var(--parchment);
  background: var(--panel); border: 1px solid var(--gold);
}
.end-turn.pulse { animation: pulse-gold 700ms infinite alternate; }

.pile {
  position: absolute; bottom: 1.2rem; width: 5.2rem; height: 4rem; border-radius: 8px;
  background: var(--panel); border: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 1.3rem; cursor: pointer; z-index: 20;
}
.pile small { font-size: 0.85rem; color: var(--muted); letter-spacing: 0.08em; }
.pile.draw { left: 1.6rem; }
.pile.discard { right: 1.6rem; }
.pile.exhaust { right: 8.2rem; opacity: 0.85; }

#target-arrow { position: fixed; z-index: 400; pointer-events: none; }

/* ---------- fx ---------- */
.fx-layer { position: absolute; inset: 0; pointer-events: none; z-index: 300; overflow: hidden; }
.float-num {
  position: absolute; font-family: var(--font-display); font-weight: 800; font-size: 2.5rem;
  color: var(--parchment);
  /* A dark outline keeps numbers legible over any sprite. */
  text-shadow: 0 0 3px #000, 0 0 3px #000, 0 2px 5px #000;
  transform-origin: center bottom;
  animation: num-pop 540ms cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
}
.float-num.dmg { color: #ff8f6b; }
.float-num.small { font-size: 2rem; }
.float-num.heavy { font-size: 3.4rem; }
.float-num.crit { font-size: 4.4rem; color: #ffc861; text-shadow: 0 0 4px #000, 0 0 10px rgba(201, 162, 39, 0.7), 0 2px 6px #000; }
.float-num.blk { color: var(--frost); }
.float-num.heal { color: var(--green); }
.float-num.burst { color: var(--ember); font-size: 3.6rem; }

.reduced-motion .float-num { animation: float-up 260ms ease-out forwards; }
.fx-banner {
  position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%);
  font-family: var(--font-display); font-size: 3rem; letter-spacing: 0.3em; color: var(--gold);
  text-shadow: 0 0 30px rgba(201, 162, 39, 0.7); animation: banner-pop 300ms ease-out forwards;
}
.fx-banner.blood { color: var(--ember); }
.fx-banner.turn { font-size: 2.4rem; color: var(--parchment); text-shadow: 0 0 24px rgba(230, 220, 195, 0.5); }
.combat.shake { animation: shake 200ms; }

/* ---------- paced playback: one actor at a time (SPEC §7.4) ---------- */
/* Attack lunge: enemies step left toward the player, the player steps right. */
.enemy .sprite.act-attack { animation: lunge-left 280ms ease-out; }
.player .sprite.act-attack { animation: lunge-right 280ms ease-out; }
.sprite.act-move { animation: act-step 260ms ease-out; }
@keyframes lunge-left {
  0% { transform: none; }
  35% { transform: translateX(-26px) scale(1.06); filter: brightness(1.25); }
  100% { transform: none; }
}
@keyframes lunge-right {
  0% { transform: none; }
  35% { transform: translateX(26px) scale(1.06); filter: brightness(1.25); }
  100% { transform: none; }
}
@keyframes act-step {
  0% { transform: none; }
  40% { transform: translateY(-8px) scale(1.05); filter: brightness(1.35) drop-shadow(0 0 12px rgba(201, 162, 39, 0.55)); }
  100% { transform: none; }
}
.reduced-motion .sprite.act-attack,
.reduced-motion .sprite.act-move { animation: none; }

/* Hit reaction: the victim flashes AND recoils away from the blow — enemies are
   knocked right (struck from the player's side), the player left. A heavy hit
   (≥15, the same threshold as screen shake) recoils further with a tilt. */
.sprite.hitflash > :first-child { animation: hitflash 200ms ease-out; }
.enemy .sprite.hitflash > :first-child { animation: hit-enemy 220ms cubic-bezier(0.25, 0.8, 0.35, 1); }
.player .sprite.hitflash > :first-child { animation: hit-player 220ms cubic-bezier(0.25, 0.8, 0.35, 1); }
.enemy .sprite.hitflash.hit-heavy > :first-child { animation: hit-enemy-heavy 340ms cubic-bezier(0.25, 0.8, 0.35, 1); }
.player .sprite.hitflash.hit-heavy > :first-child { animation: hit-player-heavy 340ms cubic-bezier(0.25, 0.8, 0.35, 1); }
@keyframes hitflash {
  0% { filter: brightness(2.1) saturate(1.8); transform: translateX(4px); }
  100% { filter: none; transform: none; }
}
@keyframes hit-enemy {
  0% { filter: brightness(2.1) saturate(1.8); }
  30% { transform: translateX(13px); }
  100% { filter: none; transform: none; }
}
@keyframes hit-player {
  0% { filter: brightness(2.1) saturate(1.8); }
  30% { transform: translateX(-13px); }
  100% { filter: none; transform: none; }
}
@keyframes hit-enemy-heavy {
  0% { filter: brightness(2.3) saturate(1.9); }
  28% { transform: translateX(26px) rotate(5deg); }
  60% { transform: translateX(6px) rotate(1deg); }
  100% { filter: none; transform: none; }
}
@keyframes hit-player-heavy {
  0% { filter: brightness(2.3) saturate(1.9); }
  28% { transform: translateX(-26px) rotate(-5deg); }
  60% { transform: translateX(-6px) rotate(-1deg); }
  100% { filter: none; transform: none; }
}
/* Death: a slower dissolve — sag, drain, blur to ash. */
.sprite.crumble > :first-child { animation: crumble 550ms ease-in forwards; }
@keyframes crumble {
  40% { opacity: 0.7; filter: grayscale(0.6) blur(1px); }
  to { opacity: 0.12; transform: translateY(14px) scale(0.9); filter: grayscale(1) blur(3px); }
}

/* Attack impact: a slashing arc sweeping across the victim. */
.fx-slash {
  position: absolute; width: 6.4rem; height: 6.4rem; margin: -3.2rem 0 0 -3.2rem;
  border-radius: 50%; border-top: 3px solid #f3e9cf; border-right: 3px solid transparent;
  pointer-events: none; filter: drop-shadow(0 0 6px rgba(201, 162, 39, 0.8));
  animation: slash-sweep 260ms ease-out forwards;
}
@keyframes slash-sweep {
  from { transform: rotate(calc(var(--rot, 0deg) - 90deg)) scale(0.55); opacity: 0; }
  25% { opacity: 1; }
  to { transform: rotate(calc(var(--rot, 0deg) + 70deg)) scale(1.2); opacity: 0; }
}

/* Cast flourish (skills/powers/buff moves) + stagger star. */
.fx-glyph {
  position: absolute; margin-left: -1.1rem; pointer-events: none;
  color: var(--grace); font-size: 2.2rem; text-shadow: 0 0 10px currentColor;
  animation: glyph-pop 430ms ease-out forwards;
}
@keyframes glyph-pop {
  from { transform: scale(0.4); opacity: 0; }
  30% { opacity: 1; }
  to { transform: scale(1.6) translateY(-14px); opacity: 0; }
}

/* Fully blocked hit: frost spark, armor held. */
.fx-spark {
  position: absolute; margin-left: -1rem; pointer-events: none;
  color: var(--frost); font-size: 2rem; text-shadow: 0 0 8px currentColor;
  animation: spark-pop 300ms ease-out forwards;
}
@keyframes spark-pop {
  from { transform: scale(0.5); opacity: 0; }
  40% { opacity: 1; }
  to { transform: scale(1.5); opacity: 0; }
}

/* Stagger: the figure teeters. */
.sprite.wobble > :first-child { animation: wobble 550ms ease-in-out; }
@keyframes wobble {
  0%, 100% { transform: rotate(0); }
  20% { transform: rotate(6deg); }
  40% { transform: rotate(-5deg); }
  60% { transform: rotate(3deg); }
  80% { transform: rotate(-2deg); }
}
.relic.proc { animation: relicProc 300ms ease-out; }
@keyframes relicProc {
  0% { transform: scale(1.45); box-shadow: 0 0 18px var(--gold); }
  100% { transform: none; }
}
.energy-orb.pulse { animation: orbPulse 240ms ease-out; }
@keyframes orbPulse {
  0% { transform: scale(1.18); box-shadow: 0 0 34px rgba(201, 162, 39, 0.6); }
  100% { transform: none; }
}
.card-ghost {
  position: fixed; z-index: 700; pointer-events: none;
  transition: transform 220ms ease-in, opacity 220ms ease-in;
}
.stance-flare {
  position: absolute; width: 18rem; height: 18rem; border-radius: 50%;
  pointer-events: none; animation: flare 300ms ease-out forwards;
}
@keyframes flare {
  0% { opacity: 0.7; transform: scale(0.4); }
  100% { opacity: 0; transform: scale(1.4); }
}

@keyframes float-up { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-42px); } }
/* Punchy number: snap in with an overshoot, settle, then rise and fade. */
@keyframes num-pop {
  0% { opacity: 0; transform: translateY(6px) scale(0.5); }
  16% { opacity: 1; transform: translateY(0) scale(1.22); }
  30% { transform: translateY(-2px) scale(1); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-48px) scale(1); }
}
@keyframes banner-pop { 0% { opacity: 0; letter-spacing: 0.6em; } 30% { opacity: 1; } 100% { opacity: 0; letter-spacing: 0.25em; } }
@keyframes shake { 0%, 100% { transform: translate(0); } 25% { transform: translate(4px, -3px); } 50% { transform: translate(-4px, 2px); } 75% { transform: translate(3px, 3px); } }
@keyframes pulse-gold { from { box-shadow: 0 0 6px rgba(201, 162, 39, 0.3); } to { box-shadow: 0 0 22px rgba(201, 162, 39, 0.8); } }

/* ---- rendered sprites: idle bob + death fade (solo + co-op boards) -------- */
@keyframes sprite-idle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.combatant .sprite > img { animation: sprite-idle 3.1s ease-in-out infinite; }
.combatant.enemy .sprite > img { animation-duration: 2.6s; }
.combatant:nth-child(2) .sprite > img { animation-delay: -0.9s; }
.combatant:nth-child(3) .sprite > img { animation-delay: -1.7s; }
.combatant:nth-child(4) .sprite > img { animation-delay: -2.3s; }
.reduced-motion .combatant .sprite > img { animation: none; }
.combatant.dead .sprite > img, .combatant.down .sprite > img { transition: filter 400ms, opacity 400ms; }

/* styles/map.css — act map screen (mockup: docs/mockups/map-screen.svg) */

.mapscreen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

}
.mapscreen .map-scroll.grabbing { cursor: grabbing; }
.mapscreen .map-scroll::-webkit-scrollbar { width: 1.2rem; height: 1.2rem; }
.mapscreen .map-scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 3px solid transparent; background-clip: padding-box; }
.mapscreen .map-scroll::-webkit-scrollbar-thumb:hover { background: var(--gold); background-clip: padding-box; }
/* Canvas centers the (possibly smaller-than-viewport) svg horizontally. */
.mapscreen .map-canvas { display: flex; justify-content: center; min-width: min-content; min-height: min-content; }

/* zoom controls */
.map-zoom { position: absolute; right: 1.4rem; bottom: 1.4rem; display: flex; flex-direction: column; gap: 0.6rem; z-index: 5; }

}
@keyframes reachStroke { from { stroke-opacity: 0.7; } to { stroke-opacity: 1; } }

}
@keyframes haloPulse {

}

.map-node.revealed circle { stroke-dasharray: 5 3; }

.map-edge { stroke: var(--line-soft); stroke-width: 2; fill: none; }

body.map-compact .map-header .nm { display: none; }

initInput({ getSettings: () => saves.loadMeta().settings || {} });

// All presentation config is data (content/balance.js → balance.ui): accent
// palettes, UI zoom scale, text sizes. Code never embeds these numbers.
const UI = registries.balance.ui;
const ACCENTS = UI.accents;

// Apply persisted display settings at boot (defaults: sprites on, motion normal).
let lastMusicFolder;
// UI size — the whole app is zoomed by `body.style.zoom` so every fixed-px
// element (cards, sprites, map nodes, menus) scales together. "Auto" flexes the
// zoom with the window against a design baseline so the board fills big screens
// and shrinks to fit small ones; S–XL are fixed overrides. Legacy numeric values
// ('90'/'100'…) still resolve. Clamped so it never gets unusably tiny/huge.
const UI_NAMED = UI.uiScale.named;

function computeAutoZoom() {
  if (typeof window === 'undefined') return 1;
  const z = UI.uiScale;
  const fit = Math.min(window.innerWidth / z.designW, window.innerHeight / z.designH);
  return Math.max(z.min, Math.min(z.max, Math.round(fit * 100) / 100));
}

function resolveZoom(uiScale) {
  const key = String(uiScale == null ? 'auto' : uiScale).toLowerCase();
  if (key === 'auto') return computeAutoZoom();
  if (UI_NAMED[key] != null) return UI_NAMED[key];
  // Anything else (incl. legacy numeric '90'/'100'/'110'/'125') is Auto: the
  // settings UI displays such values as Auto, so behaving as fixed zoom made
  // the control look dead ("scaling stopped working").
  return computeAutoZoom();
}

function applyUiScale(settings) {
  const z = resolveZoom(settings.uiScale);
  // Set as a CSS var so base.css can compensate the body's width/height for the
  // zoom (avoids the zoom×100vh overflow). Any leftover inline zoom is cleared.
  document.body.style.zoom = '';
  document.documentElement.style.setProperty('--ui-zoom', String(z));
}

// Re-flex Auto sizing whenever the window changes. Only recomputes for Auto and
// only touches the zoom, so it's cheap. Also re-applies shortly after boot and
// on `load` — some environments report tiny window dims until layout settles,
// which would otherwise freeze Auto at the clamp floor.
let uiResizeTimer = null;
function reflexAutoScale() {
  const s = (saves.loadMeta().settings) || {};
  if (String(s.uiScale == null ? 'auto' : s.uiScale).toLowerCase() === 'auto') applyUiScale(s);
}
if (typeof window !== 'undefined') {
  window.addEventListener('resize', () => {
    clearTimeout(uiResizeTimer);
    uiResizeTimer = setTimeout(reflexAutoScale, 150);
  });
  window.addEventListener('load', reflexAutoScale);
  setTimeout(reflexAutoScale, 300);
}

function applyDisplaySettings(settings) {
  setSpritesEnabled(settings.useSprites !== false);
  document.body.classList.toggle('reduced-motion', settings.reducedMotion === true);
  document.body.classList.toggle('hi-contrast', settings.highContrast === true);
  // Text size sets the root font-size %; because all type + component dimensions
  // are rem, one value rescales the whole UI (base.css). Legacy boolean largeText
  // maps to L. Stacks with --ui-zoom (which additionally scales px hairlines).
  const TEXT_SIZES = UI.textSize;
  const tKey = TEXT_SIZES[settings.textSize] ? settings.textSize
    : (settings.largeText === true ? 'L' : 'M');
  document.documentElement.style.fontSize = TEXT_SIZES[tKey];
  document.body.classList.toggle('no-shake', settings.screenShake === false);
  // Card colour motif: mode on the root as a data attr, wash depth as a var, so
  // switching is a re-paint with no re-render. Both defaults live in balance.ui.
  const motif = UI.cardMotifModes.includes(settings.cardMotif) ? settings.cardMotif : UI.cardMotif;
  document.documentElement.dataset.cardMotif = motif;
  const strengths = UI.cardMotifStrength;
  const sKey = strengths[settings.cardMotifStrength] != null ? settings.cardMotifStrength : 'normal';
  document.documentElement.style.setProperty('--card-motif-strength', String(strengths[sKey]));
  document.body.classList.toggle('cb-safe', settings.colorblindSafe === true);
  document.body.classList.toggle('reduce-flashes', settings.reduceFlashes === true);
  document.body.classList.toggle('readable-ui', settings.readableHeadings === true);
  document.body.classList.toggle('hide-hints', settings.controlHints === false);
  document.body.classList.toggle('map-compact', settings.mapHeaderDensity === 'compact');
  document.body.classList.toggle('hide-header-relics', settings.mapHeaderRelics === false);
  document.body.classList.toggle('hide-header-seed', settings.mapHeaderSeed === false);
  // Ambient effects level → data attr read by the title screen (ember count) + CSS.
  const amb = ['off', 'low', 'normal', 'high'].includes(settings.ambient) ? settings.ambient : 'normal';
  document.documentElement.dataset.ambient = amb;
  // Accent theme → CSS variables on the root (falls back to gold).
  const accent = ACCENTS[settings.accent] || ACCENTS.gold;
  const root = document.documentElement.style;
  root.setProperty('--gold', accent.hex);
  root.setProperty('--accent-rgb', accent.rgb);
  // UI size — zoom the whole app (see applyUiScale). Auto flexes with the window.
  applyUiScale(settings);
  setAnimSpeed(settings.animSpeed || 'normal');
  audio.setVolumes(settings);
  // Re-point external music only when the folder actually changed (avoids
  // re-fetching the manifest on every unrelated settings tweak).
  const folder = settings.musicFolder || '';
  if (folder !== lastMusicFolder) {
    lastMusicFolder = folder;
    audio.configureMusic({ folder });
  }
}
applyDisplaySettings(saves.loadMeta().settings);

// ---- run state ----------------------------------------------------------------
let run = null;
let rng = null;
let activeSlot = 1; // which save slot the current run persists to (SPEC §3.12 + slots)

// Autosave the current run to its slot (after every committed choice).
function persist() {
  saves.saveRun(run, rng, activeSlot);
  sendLanStatus();
}

// ---- Forsaken Together (LAN) -------------------------------------------------
// The run is server-authoritative (the launcher owns it via tools/session.mjs);
// the browser is a thin client that renders snapshots and sends intents. Solo
// play never touches any of this.
let inCoop = false;

// A no-op in solo (kept so persist() stays simple); the co-op client, not the
// orchestrator, owns the LAN socket and rendering.
function sendLanStatus() { /* server-authoritative co-op needs no client push */ }
function dropLanLink() { inCoop = false; }

function showLobby() {
  audio.music('title');
  mountLobby(app, {
    registries,
    defaultSeedString: randomSeedString(),
    onBack: () => showTitle(),
    onStart: ({ conn, myId, myIds }) => {
      inCoop = true;
      mountCoop(app, { registries, conn, myId, myIds, onLeave: () => showTitle() });
    },
  });
}

function randomSeedString() {
  return seedToString((Math.random() * 0xffffffff) >>> 0);
}

function newRun({ classId, seedString, customization, keepsakeId, custom, slot = 1 }) {
  activeSlot = slot;
  let seed;
  try {
    seed = seedFromString(seedString || randomSeedString());
  } catch (e) {
    seed = seedFromString(randomSeedString()); // invalid chars → fresh seed
  }
  run = createRunState({ seed, classId, registries });
  run.seedString = seedToString(seed);
  run.customization = customization || { name: 'Forsaken', glyph: '⚔', tint: 'gold' };
  run.custom = custom || { ascension: 0, mods: {}, deckMode: 'standard' };
  run.stats = { fightsWon: 0, damageDealt: 0, damageTaken: 0 };
  run.path = [];
  run.seenEvents = [];
  run.lastEncounters = [];
  rng = createRng(seed);

  // Keepsake: a one-time bundle of run-level effects (content/keepsakes.js).
  const keepsake = KEEPSAKES.find((k) => k.id === keepsakeId);
  if (keepsake && keepsake.effects.length) {
    executeRunEffects({ run, registries, rng }, keepsake.effects);
  }

  // Custom Climb: alternate starting decks + start-of-run rule effects.
  const deckMode = run.custom.deckMode || 'standard';
  const mods = activeMods(run.custom);
  if (deckMode === 'sealed') {
    run.deck = createDeck(sealedDeckIds(classId), createIdGen('rc'));
  } else if (deckMode === 'draft') {
    run.deck = createDeck(draftBaseIds(), createIdGen('rc'));
  }
  if (mods.cursedStart) run.deck.push(...createDeck(['guilt'], createIdGen('cx')));
  if (mods.hoarder) run.cinders += registries.balance.customMods.hoarderCinders;

  if (deckMode === 'draft') return showDraft(); // picks, then proceeds to the map
  startClimb();
}

// After the deck is finalized (incl. any draft), generate the map and go.
function startClimb() {
  buildActMap();
  persist();
  showMap();
}

// Sealed: keep a small basic core, fill the rest with random pool cards.
function sealedDeckIds(classId) {
  const pool = registries.classes.get(classId).cardPool.slice();
  const ids = ['strike', 'strike', 'strike', 'strike', 'defend', 'defend', 'defend'];
  for (let i = 0; i < 3 && pool.length; i++) {
    const id = rng.pick('misc', pool);
    pool.splice(pool.indexOf(id), 1);
    ids.push(id);
  }
  return ids;
}
function draftBaseIds() {
  return ['strike', 'strike', 'strike', 'strike', 'defend', 'defend', 'defend'];
}

// Generate the current act's map and pre-roll every '?' node (stream
// 'events') so outcomes are seed-determined and the Sealstone Key can
// reveal them (SPEC §6).
// Endless Spire: acts past 3 loop back through acts 1-3 content, harder each
// cycle (combatMods). All content lookups go through contentAct(); the real
// run.actNumber keeps counting up for labels, saves, and history.
function endlessOn() {
  return !!(run.custom && activeMods(run.custom).endless);
}
function contentAct() {
  return endlessOn() ? endlessActInfo(run.actNumber).contentAct : run.actNumber;
}

function buildActMap() {
  run.mapGraph = generateActMap({ config: registries.mapConfig(contentAct()), rng });
  const assigned = [];
  for (const node of Object.values(run.mapGraph.nodes)) {
    if (node.type === 'event') {
      node.resolved = resolveUnknownNode(registries, rng, { seenEvents: assigned });
      if (node.resolved.kind === 'event') assigned.push(node.resolved.eventId);
    }
  }
}

// Between acts: ember holds the spire together a little longer.
function advanceAct() {
  run.actNumber += 1;
  run.floor = 0;
  run.mapNodeId = null;
  run.path = [];
  run.lastEncounters = [];
  // Full heal between acts — halved under the "Scarce Embers" custom rule.
  if (run.custom && activeMods(run.custom).lessHealing) {
    run.hp = Math.min(run.maxHp, run.hp + Math.floor((run.maxHp - run.hp) * registries.balance.customMods.lessHealingMult));
  } else {
    run.hp = run.maxHp;
  }
  buildActMap();
  persist();
  showMap();
}

function resumeRun(slot = 1) {
  activeSlot = slot;
  run = saves.loadRun(registries, slot);
  if (!run) return showTitle();
  rng = createRng(run.seed, run.streamCounters);
  if (run.combatEntered && run.combatEntered.encounterId) {
    // Mid-combat save: restart that combat from its start (SPEC §3.12).
    enterCombat(run.combatEntered.nodeId, run.combatEntered.encounterId, { resuming: true });
  } else if (run.shopStock) {
    showShop();
  } else {
    showMap();
  }
}

// ---- screens --------------------------------------------------------------------
function showTitle() {
  audio.music('title');
  run = null;
  dropLanLink(); // a LAN session spans one run; back at the title it's over
  const slots = saves.listSlots().map(({ slot, summary }) => ({
    slot,
    summary: summary && {
      ...summary,
      className: registries.classes.has(summary.class) ? registries.classes.get(summary.class).name : summary.class,
    },
  }));
  mountTitle(app, {
    slots,
    onContinue: (slot) => resumeRun(slot),
    onNew: (slot) => showCustomize(slot),
    onDelete: (slot) => {
      saves.clearRun(slot);
      showTitle();
    },
    onHistory: showHistory,
    onSettings: showSettings,
    onQuit: quitGame,
    onCustom: () => {
      const empty = slots.find((s) => !s.summary);
      showCustomRun(empty ? empty.slot : 1);
    },
    onLan: showLobby,
  });
  // Forsaken Together needs the launcher's server behind the page.
  lanInfo().then((info) => {
    const btn = app.querySelector('#lan-play');
    if (info && btn) btn.hidden = false;
  });
}

function showSettings() {
  openSettings({
    meta: saves.loadMeta(),
    onChange: (changed) => {
      const meta = saves.loadMeta();
      Object.assign(meta.settings, changed);
      saves.saveMeta(meta);
      applyDisplaySettings(meta.settings);
    },
  });
}

function showHistory() {
  mountHistory(app, { meta: saves.loadMeta(), onBack: showTitle });
}

// Quit the game entirely. In a real browser tab window.close() is usually
// blocked (the tab wasn't script-opened), so we stop the game and show a
// graceful "safe to close" screen; in a standalone/launcher window the close
// succeeds. Any in-progress run is persisted first, so nothing is lost.
function quitGame() {
  if (run) persist();
  audio.stopMusic();
  run = null;
  app.innerHTML = `
    <div class="screen farewell">
      <h1 class="title-big">THE EMBER GUTTERS</h1>
      <p class="subtitle" style="text-align:center">Your climb is saved. You may close this window.</p>
      <button class="subtle" id="farewell-back">Return to title</button>
    </div>`;
  const closeTimer = setTimeout(() => {
    try {
      window.close();
    } catch (e) {
      /* browser blocked it — the farewell screen stands in */
    }
  }, 120);
  const back = app.querySelector('#farewell-back');
  if (back) {
    back.addEventListener('click', () => {
      clearTimeout(closeTimer); // changed their mind before the window closed
      showTitle();
    });
  }
}

// The in-run tabbed overlay (Deck / Relics / Stats / Settings), shared by the
// map and combat screens via their onMenu callback.
function showOverlay(initialTab = 'deck') {
  if (!run) return;
  openOverlay({
    registries,
    run,
    meta: saves.loadMeta(),
    initialTab,
    onSettingsChange: (changed) => {
      const meta = saves.loadMeta();
      Object.assign(meta.settings, changed);
      saves.saveMeta(meta);
      applyDisplaySettings(meta.settings);
      if (changed.bindings) setBindings(changed.bindings);
      if (changed.keyBindings) setKeyBindings(changed.keyBindings);
    },
    onSave: () => {
      persist();
      return activeSlot;
    },
    onQuit: () => {
      persist(); // the run is resumable from its slot via Continue
      showTitle();
    },
    onExit: quitGame, // "Quit Game" — leave the app entirely
  });
}

// A run-history record (SPEC §3.12) — enriched so the history screen can show
// class, progress, and per-class win rates.
function runResult(victory) {
  return {
    victory,
    seed: run.seedString,
    class: run.class,
    className: registries.classes.get(run.class).name,
    act: run.actNumber,
    floor: run.floor,
    fightsWon: run.stats.fightsWon,
    damageDealt: run.stats.damageDealt,
    damageTaken: run.stats.damageTaken,
    name: run.customization && run.customization.name,
    custom: isCustomRun(run.custom),
    ascension: (run.custom && run.custom.ascension) || 0,
  };
}

function showCustomize(slot = 1) {
  mountCustomize(app, {
    registries,
    defaultSeedString: randomSeedString(),
    onBack: showTitle,
    onStart: (config) => newRun({ ...config, slot }),
  });
}

function showCustomRun(slot = 1) {
  mountCustomRun(app, {
    registries,
    defaultSeedString: randomSeedString(),
    onBack: showTitle,
    onStart: (config) => newRun({ ...config, slot }),
  });
}

// Draft deck builder (Custom Climb): pick cards, then start the climb.
function showDraft() {
  mountDraft(app, {
    registries,
    classId: run.class,
    rng,
    onDone: (picks) => {
      run.deck.push(...picks);
      startClimb();
    },
  });
}

function showMap() {
  audio.music('map');
  mountMap(app, {
    registries,
    run,
    meta: saves.loadMeta(),
    onPick: enterNode,
    onSettings: showSettings,
    onMenu: showOverlay,
    onSave: () => {
      persist();
      return activeSlot;
    },
  });
}

function enterNode(nodeId) {
  sfx.play('nodeTravel');
  const node = run.mapGraph.nodes[nodeId];
  run.mapNodeId = nodeId;
  run.path.push(nodeId);
  run.floor = node.floor;

  let kind = node.type;
  if (kind === 'event') {
    const res = node.resolved || { kind: 'fight' };
    if (res.kind === 'event') {
      run.seenEvents.push(res.eventId);
      persist();
      return showEvent(res.eventId);
    }
    kind = res.kind; // fight | shrine | treasure
  }

  switch (kind) {
    case 'monster':
    case 'fight':
      return startFight('normal', nodeId);
    case 'elite':
      return startFight('elite', nodeId);
    case 'boss':
      return startFight('boss', nodeId);
    case 'shrine':
      persist();
      return showRest();
    case 'merchant': {
      const stock = buildShopStock(registries, rng, run);
      const pm = shopPriceMult();
      if (pm !== 1) {
        for (const kind of ['cards', 'relics', 'flasks']) {
          for (const item of stock[kind]) item.cost = Math.ceil(item.cost * pm);
        }
        stock.removeCost = Math.ceil(stock.removeCost * pm);
      }
      run.shopStock = stock;
      persist();
      return showShop();
    }
    case 'treasure': {
      const relicId = rollRelicReward(registries, rng, run.relics);
      return mountRewards(app, {
        registries,
        run,
        rewards: { relicId, title: 'TREASURE' },
        onDone: () => {
          persist();
          showMap();
        },
      });
    }
    default:
      throw new Error(`Unknown node kind '${kind}'`);
  }
}

// ---- combat ------------------------------------------------------------------------
// Custom Climb combat rules → generic createCombat options for a given pool.
function combatMods(pool) {
  const mods = run.custom ? activeMods(run.custom) : {};
  let hpMult = 1;
  const enemyStatuses = [];
  const playerStatuses = [];
  const cm = registries.balance.customMods;
  if ((pool === 'elite' || pool === 'boss') && mods.toughElites) hpMult *= cm.toughElitesHpMult;
  if (pool === 'boss' && mods.bigBosses) hpMult *= cm.bigBossesHpMult;
  if (mods.deadlyEnemies) enemyStatuses.push({ status: 'strength', stacks: 1 });
  if (mods.glassCannon) playerStatuses.push({ status: 'glassCannon', stacks: 1 });
  if (mods.endless) {
    const { loop } = endlessActInfo(run.actNumber);
    if (loop > 0) {
      hpMult *= 1 + ENDLESS_HP_PER_LOOP * loop;
      enemyStatuses.push({ status: 'strength', stacks: ENDLESS_STR_PER_LOOP * loop });
    }
  }
  return { hpMult, enemyStatuses, playerStatuses };
}

function startFight(pool, nodeId) {
  // "Elite Gauntlet" chaos rule promotes ordinary monster nodes to elites.
  if (pool === 'normal' && run.custom && activeMods(run.custom).allElite) pool = 'elite';
  const encounterId = rollEncounter(registries, rng, { pool, act: contentAct(), exclude: run.lastEncounters });
  if (pool === 'normal') {
    run.lastEncounters.push(encounterId);
    if (run.lastEncounters.length > 2) run.lastEncounters.shift();
  }
  enterCombat(nodeId, encounterId);
}

function enterCombat(nodeId, encounterId, { resuming = false } = {}) {
  run.combatEntered = { nodeId, encounterId };
  if (!resuming) persist(); // counters BEFORE the combat → reload restarts it identically
  const enc = registries.encounters.get(encounterId);
  audio.music(enc.pool === 'boss' ? 'boss' : enc.pool === 'elite' ? 'elite' : 'combat');
  const cm = combatMods(enc.pool);
  const combat = createCombat({
    registries,
    rng,
    player: {
      classId: run.class,
      maxHp: run.maxHp,
      hp: run.hp,
      deck: run.deck,
      relicIds: run.relics,
      flasks: run.flasks,
      loadout: run.loadout,
    },
    enemyIds: enc.enemies,
    hpMult: cm.hpMult,
    enemyStatuses: cm.enemyStatuses,
    // `self.*` mods (Strength from an oathsworn set, Regen from a warm habit)
    // enter through the same door Custom Climb buffs already used — the engine
    // has no equipment code, only statuses applied at combat start.
    playerStatuses: [...cm.playerStatuses, ...runMods(registries, run.loadout, run.class).startStatuses],
  });
  const label =
    enc.pool === 'boss'
      ? registries.enemies.get(enc.enemies[0]).name.toUpperCase()
      : enc.pool === 'elite'
        ? `ELITE · FLOOR ${run.floor}`
        : `ACT ${run.actNumber} · FLOOR ${run.floor}`;
  mountCombat(app, {
    registries,
    run,
    combat,
    label,
    onEnd: (result, endedCombat) => onCombatEnd(result, endedCombat, enc),
    onSettings: showSettings,
    onMenu: showOverlay,
    showTutorial: !saves.loadMeta().settings.seenTutorial,
    onTutorialDone: () => {
      const meta = saves.loadMeta();
      meta.settings.seenTutorial = true;
      saves.saveMeta(meta);
    },
  });
  // Boss fights open on a name splash (skippable; not repeated on reload-resume).
  if (enc.pool === 'boss' && !resuming) {
    showBossIntro(
      { name: registries.enemies.get(enc.enemies[0]).name, act: run.actNumber },
      { hold: shotState === 'boss' }
    );
  }
}

function onCombatEnd(result, combat, enc) {
  run.flasks = combat.player.flasks; // drunk flasks stay drunk
  // A weapon swapped mid-fight stays swapped: combat works on copies of the
  // deck's instances, so the run's own copies need the new numbers stamped in.
  stampDeck(registries, run);

  if (result !== 'victory') {
    audio.stopMusic();
    sfx.play('youDied');
    run.hp = 0;
    sendLanStatus({ dead: true });
    saves.clearRun(activeSlot);
    saves.recordResult(runResult(false));
    return mountGameOver(app, { registries, game: run, victory: false, onTitle: showTitle, onHistory: showHistory });
  }

  run.hp = combat.player.hp;
  run.stats.fightsWon += 1;
  run.combatEntered = null;

  if (enc.pool === 'boss') {
    // Endless Spire: no summit — the climb loops until death.
    if (run.actNumber >= 3 && !endlessOn()) {
      // The Blighted Valkyrie falls: the Sovereign Ember is restored.
      audio.music('victory');
      sendLanStatus({ victory: true });
      saves.clearRun(activeSlot);
      saves.recordResult(runResult(true));
      return mountGameOver(app, { registries, game: run, victory: true, onTitle: showTitle, onHistory: showHistory });
    }
    // Act boss down: boss rewards, then the climb continues.
    const bossRewards = {
      title: `${registries.enemies.get(enc.enemies[0]).name.toUpperCase()} FALLS`,
      cinders: rollRuneReward(registries, rng, 'boss', run.relics),
      cardIds: rollCardRewardIds(registries, rng, { classId: run.class, pool: 'boss', relicIds: run.relics, flatRarity: chaosRewardsOn() }),
      relicId: rollRelicReward(registries, rng, run.relics, { rarities: ['boss'] }),
    };
    return mountRewards(app, {
      registries,
      run,
      rewards: bossRewards,
      onDone: () => advanceAct(),
    });
  }

  const rewards = {
    title: enc.pool === 'elite' ? 'ELITE VANQUISHED' : 'VICTORY',
    cinders: rollRuneReward(registries, rng, enc.pool, run.relics),
    cardIds: rollCardRewardIds(registries, rng, { classId: run.class, pool: enc.pool, relicIds: run.relics, flatRarity: chaosRewardsOn() }),
    flaskId: rollFlaskDrop(registries, rng, run),
    relicId: enc.pool === 'elite' ? rollRelicReward(registries, rng, run.relics) : null,
  };
  mountRewards(app, {
    registries,
    run,
    rewards,
    onDone: () => {
      persist();
      showMap();
    },
  });
}

// Custom Climb helpers used across nodes.
function chaosRewardsOn() {
  return !!(run.custom && activeMods(run.custom).chaosRewards);
}
function shopPriceMult() {
  const mods = run.custom ? activeMods(run.custom) : {};
  let m = 1;

// deeper screens without interaction. `fx` poses the combat FX frozen
// mid-animation (negative animation-delay + paused) so the transient slash /
// glyph / spark / recoil effects are photographable. Normal boots unaffected.
const shotState = new URLSearchParams(location.search).get('shot');

function poseFxShowcase() {
  const layer = document.querySelector('.fx-layer');
  const enemies = [...document.querySelectorAll('.combatant.enemy .sprite')];
  const player = document.querySelector('.combatant.player .sprite');
  if (!layer || !enemies.length || !player) return;
  const put = (cls, text, anchor, atMs, extra) => {
    const lr = layer.getBoundingClientRect();
    const ar = anchor.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = cls;
    if (text) el.textContent = text;
    el.style.left = `${ar.left - lr.left + ar.width / 2 + ((extra && extra.dx) || 0)}px`;
    el.style.top = `${ar.top - lr.top + ar.height * 0.4 + ((extra && extra.dy) || 0)}px`;
    el.style.animationDelay = `-${atMs}ms`; // jump mid-animation…
    el.style.animationPlayState = 'paused'; // …and hold the frame
    layer.appendChild(el);
  };
  const e0 = enemies[0];
  const e1 = enemies[1] || enemies[0];
  put('fx-slash', '', e0, 120);
  put('float-num crit', '-26', e0, 200, { dy: -34 });
  put('fx-spark', '✦', e1, 140);
  put('float-num blk small', 'BLOCKED', e1, 220, { dy: -30 });
  put('fx-glyph', '✦', player, 170);
  // Victim recoil held mid-knockback; the second enemy teeters (stagger).
  e0.classList.add('hitflash', 'hit-heavy');
  if (e0.firstElementChild) {
    e0.firstElementChild.style.animationDelay = '-95ms';
    e0.firstElementChild.style.animationPlayState = 'paused';
  }
  if (e1 !== e0) {
    e1.classList.add('wobble');
    if (e1.firstElementChild) {
      e1.firstElementChild.style.animationDelay = '-110ms';
      e1.firstElementChild.style.animationPlayState = 'paused';
    }
  }
}

//
// Class identity: STARSTONE COMBOS — the 2nd+ spell each turn is empowered.

"src/content/scripts.js": function (module, exports, require) {
// src/content/scripts.js — budgeted escape hatch (SPEC §3.1(6))
//
// Registry of named custom behaviors for what the DSL cannot express.
// Budget: < 5% of content objects may reference a script, and every entry
// needs a comment justifying why the DSL couldn't do it. If a script pattern
// appears twice, promote it to a DSL primitive (engine PR).

const scripts = {
  /**
   * Wondrous Draught: "Gain the effects of two DIFFERENT random flasks."
   * Why a script: the DSL has no way to reference another entity's effect
   * list dynamically ("a random flask's effects") — that's meta-content
   * selection, not effect composition. Everything the picked flasks DO still
   * runs through the ordinary DSL/queue.
   */
  wondrousDraught(ctx, action) {
    const pool = ctx.registries.flasks
      .all()
      .filter((f) => f.id !== 'wondrousDraught' && !usesScript(f));
    if (pool.length === 0) return;
    const first = ctx.rng.pick('misc', pool);
    const rest = pool.filter((f) => f.id !== first.id);
    const picks = rest.length ? [first, ctx.rng.pick('misc', rest)] : [first];
    for (const flask of picks) {
      for (const eff of flask.effects || []) {
        ctx.enqueue({ effect: eff, source: action.source, owner: action.owner, target: action.target, meta: action.meta || {} });
      }
    }
  },
};

function usesScript(def) {
  return (def.effects || []).some((e) => typeof e.script === 'string');
}


Object.assign(module.exports, { scripts });

},
"src/content/equipment.js": function (module, exports, require) {
// src/content/equipment.js — armaments, armour, slots, and the mod vocabulary.
//
// Five spreadsheets feed this file and nothing else does:
//
//   content/source/weapons.csv       every armament (weapon / shield / staff)
//   content/source/outfits.csv       every armour set (an outfit IS a set)
//   content/source/equipSlots.csv    what you can wear, and when you may swap
//   content/source/equipMods.csv     what a mod string is allowed to say
//   content/source/equipTargets.csv  which card each mod prefix rewrites
//
// This module only NORMALISES them — the CSV compiler coerces a single value
// to a string and a pipe-separated one to an array, so every list-shaped
// column has to be forced back to an array exactly once, here. No balance
// numbers and no behaviour live in this file; see model/loadout.js for what
// the mods actually do.

const { weapons } = require("src/content/generated/weapons.js");
const { outfits } = require("src/content/generated/outfits.js");
const { equipSlots } = require("src/content/generated/equipSlots.js");
const { equipMods } = require("src/content/generated/equipMods.js");
const { equipTargets } = require("src/content/generated/equipTargets.js");

/** '' → [], 'a' → ['a'], ['a','b'] → ['a','b']. */
function list(v) {
  if (v === '' || v == null) return [];
  return Array.isArray(v) ? v : [v];
}

function normPiece(row) {
  return { ...row, tags: list(row.tags), mods: list(row.mods) };
}

/** Every armament: weapons, shields and staves, in authoring order. */
const ARMAMENTS = weapons.map(normPiece);

/** Every armour set. `id` is unique per class, not globally — key by both. */
const ARMOUR = outfits.map((row) => ({ ...normPiece(row), kind: 'armor' }));

/** Slot definitions, ordered. */
const SLOTS = equipSlots
  .map((row) => ({ ...row, kinds: list(row.kinds) }))
  .sort((a, b) => a.order - b.order);

/** The registered modifier fields, keyed by field name. */
const MOD_FIELDS = new Map(equipMods.map((m) => [m.field, m]));

const ARMAMENT_BY_ID = new Map(ARMAMENTS.map((a) => [a.id, a]));
const SLOT_BY_ID = new Map(SLOTS.map((s) => [s.id, s]));

function armamentById(id) {
  return ARMAMENT_BY_ID.get(id) || null;
}

function slotById(id) {
  return SLOT_BY_ID.get(id) || null;
}

/** Armour sets belonging to one class, in authoring order. */
function armourForClass(classId) {
  return ARMOUR.filter((o) => o.classId === classId);
}

/** The set a class starts in — the one row per class with no unlock. */
function startingArmour(classId) {
  return armourForClass(classId).find((o) => o.unlock === '') || null;
}

/** Armour is keyed by (classId, id) because ids repeat across classes. */
function armourById(classId, id) {
  return armourForClass(classId).find((o) => o.id === id) || null;
}

/** Which armaments may go in a slot, by the slot's `kinds` gate. */
function armamentsForSlot(slotId) {
  const slot = slotById(slotId);
  if (!slot) return [];
  return ARMAMENTS.filter((a) => slot.kinds.includes(a.kind));
}

/**
 * The card a mod prefix rewrites for a given class, e.g.
 * cardForTarget('power', 'herald') → 'urgentHeal'. Class-specific rows win
 * over the '*' fallback.
 */
function cardForTarget(target, classId) {
  const exact = equipTargets.find((t) => t.target === target && t.classId === classId);
  if (exact) return exact.cardId;
  const any = equipTargets.find((t) => t.target === target && t.classId === '*');
  return any ? any.cardId : null;
}

/** Every mod prefix that resolves to a card (for validation and tests). */
const CARD_TARGETS = [...new Set(equipTargets.map((t) => t.target))];


Object.assign(module.exports, { ARMAMENTS, ARMOUR, SLOTS, MOD_FIELDS, armamentById, slotById, armourForClass, startingArmour, armourById, armamentsForSlot, cardForTarget, CARD_TARGETS });

},

"src/model/validate.js": function (module, exports, require) {
// src/model/validate.js — content validation (SPEC §3.14)
//
// Runs at boot in dev mode and from the test page. Checks, across ALL content:
//   1. Schema conformance (fields, types, enums; unknown fields fail loudly).
//   2. Every id cross-reference resolves (no dangling ids).
//   3. Every opcode, formula op, trigger event, and predicate is in the
//      closed sets of SPEC §3.4–§3.6.
//   4. Every text-template token binds, and every player-visible literal
//      numeric effect has a token (SPEC §3.13) — enforced for cards + relics.
//   5. scripts.js budget report: script-using content stays < 5% of content.
//
// Headless: no document/window/localStorage/timers.

const { SCHEMAS, OPCODES, EFFECT_SPECS, TARGETS, TRIGGER_EVENTS, PREDICATES, CARD_TYPES, MODIFIER_KEYS, REGISTRY_TYPES } = require("src/model/schemas.js");
const { FORMULA_OPS, FORMULA_OF, isFormula } = require("src/model/formulas.js");

// Ops whose value binds to a text-template token; token name = op name,
// except applyStatus which binds under its status id (SPEC §3.13).
const TOKENIZABLE_OPS = Object.freeze([
  'damage',
  'block',
  'heal',
  'loseHp',
  'applyStatus',
  'poiseDamage',
  'draw',
  'gainEnergy',
  'addCinders',
  'loseMaxHpPct',
]);

// Ops whose LITERAL numeric value MUST have a bound token in the template
// (a player-visible number with no token is a validation error).
const REQUIRED_TOKEN_OPS = Object.freeze([
  'damage',
  'block',
  'heal',
  'loseHp',
  'applyStatus',
  'poiseDamage',
  'draw',
  'gainEnergy',
]);

const KNOWN_BUNDLE_KEYS = new Set([
  ...REGISTRY_TYPES,
  'version',
  'contentVersion',
  'balance',
  'mapConfigs',
  'scripts',
  'equipment',
]);

/**
 * computeTokenBindings(effects) → [{ token, index, field, op, literal }]
 *
 * Deterministic binding of template tokens to opcode values, in effect order.
 * The first occurrence of a token base binds as `{base}`, repeats as
 * `{base.2}`, `{base.3}` ... (SPEC §3.13). `hits` on a damage op binds as
 * `{hits}` (then `{hits.2}` ...). Shared by validation, previewCard, and the UI.
 */
function computeTokenBindings(effects) {
  const counts = {};
  const out = [];
  const push = (base, index, field, op, literal) => {
    counts[base] = (counts[base] || 0) + 1;
    const token = counts[base] === 1 ? base : `${base}.${counts[base]}`;
    out.push({ token, index, field, op, literal });
  };
  (effects || []).forEach((eff, i) => {
    if (!eff || typeof eff !== 'object' || typeof eff.op !== 'string') return;
    if (!TOKENIZABLE_OPS.includes(eff.op)) return;
    const field = eff.op === 'applyStatus' ? 'stacks' : eff.op === 'loseMaxHpPct' ? 'pct' : 'amount';
    const base = eff.op === 'applyStatus' ? eff.status : eff.op;
    if (typeof base !== 'string') return; // malformed; schema pass reports it
    push(base, i, field, eff.op, typeof eff[field] === 'number');
    if (eff.op === 'damage' && eff.hits != null) {
      push('hits', i, 'hits', eff.op, typeof eff.hits === 'number');
    }
  });
  return out;
}

function extractTemplateTokens(template) {
  const tokens = [];
  const re = /\{([A-Za-z][\w.]*)\}/g;
  let m;
  while ((m = re.exec(template)) !== null) tokens.push(m[1]);
  return tokens;
}

/**
 * validateContent(bundle) → { ok, errors: [{ path, msg }], scriptReport }.
 * `bundle` is the raw content bundle (same shape createRegistries takes).
 */
function validateContent(bundle) {
  const errors = [];
  const err = (path, msg) => errors.push({ path, msg });
  const b = bundle || {};

  for (const key of Object.keys(b)) {
    if (!KNOWN_BUNDLE_KEYS.has(key)) err(key, `Unknown content bundle key '${key}'`);
  }

  // ---- collect id sets for cross-reference checks -------------------------
  const ids = { scripts: new Set(Object.keys(b.scripts || {})) };
  for (const type of REGISTRY_TYPES) {
    ids[type] = new Set();
    const defs = b[type] || [];
    if (!Array.isArray(defs)) {
      err(type, `Bundle key '${type}' must be an array of defs`);
      continue;
    }
    defs.forEach((def, i) => {
      if (!def || typeof def.id !== 'string') err(`${type}[${i}]`, 'Def missing string id');
      else if (ids[type].has(def.id)) err(`${type}.${def.id}`, `Duplicate id '${def.id}'`);
      else ids[type].add(def.id);
    });
  }

  const vctx = { ids, err };

  // ---- schema walks --------------------------------------------------------
  const typeToSchema = {
    cards: SCHEMAS.card,
    relics: SCHEMAS.relic,
    statuses: SCHEMAS.status,
    stances: SCHEMAS.stance,
    keywords: SCHEMAS.keyword,
    enemies: SCHEMAS.enemy,
    encounters: SCHEMAS.encounter,
    events: SCHEMAS.event,
    flasks: SCHEMAS.flask,
    classes: SCHEMAS.class,
  };
  for (const type of REGISTRY_TYPES) {
    const defs = Array.isArray(b[type]) ? b[type] : [];
    defs.forEach((def) => {
      const path = `${type}.${(def && def.id) || '?'}`;
      walkSchema(def, typeToSchema[type], path, vctx);
    });
  }

  if (b.balance != null && (typeof b.balance !== 'object' || Array.isArray(b.balance))) {
    err('balance', 'balance must be a plain object of constants');
  }
  // balance.poise is engine-consulted data: { growthMult?, onFill? } (see ENGINE-API.md)
  if (b.balance && b.balance.poise) {
    const p = b.balance.poise;
    if (p.growthMult != null && typeof p.growthMult !== 'number') err('balance.poise.growthMult', 'must be a number');
    if (p.onFill != null) validateEffects(p.onFill, 'balance.poise.onFill', vctx);
  }

  if (b.mapConfigs != null) {
    if (typeof b.mapConfigs !== 'object' || Array.isArray(b.mapConfigs)) {
      err('mapConfigs', 'mapConfigs must be an object keyed by act number');
    } else {
      for (const act of Object.keys(b.mapConfigs)) {
        walkSchema(b.mapConfigs[act], SCHEMAS.mapConfig, `mapConfigs.${act}`, vctx);
      }
    }
  }

  // ---- entity-specific cross checks ----------------------------------------
  for (const card of b.cards || []) {
    const path = `cards.${card.id}`;
    if (typeof card.class === 'string' && card.class !== 'colorless' && !ids.classes.has(card.class)) {
      err(`${path}.class`, `class '${card.class}' is neither a class id nor 'colorless'`);
    }
    validateCardTemplates(card, path, err);
  }

  for (const relic of b.relics || []) {
    validateRelicTemplate(relic, `relics.${relic.id}`, err);
  }

  for (const enemy of b.enemies || []) {
    const path = `enemies.${enemy.id}`;
    const moveIds = new Set(Object.keys(enemy.moves || {}));
    if (enemy.firstMove != null && !moveIds.has(enemy.firstMove)) {
      err(`${path}.firstMove`, `firstMove '${enemy.firstMove}' is not one of this enemy's moves`);
    }
    for (const [pi, phase] of (enemy.phases || []).entries()) {
      for (const mv of phase.unlockMoves || []) {
        if (!moveIds.has(mv)) err(`${path}.phases[${pi}].unlockMoves`, `unlockMoves '${mv}' is not one of this enemy's moves`);
      }
      if (phase.on === 'hpBelowPct' && typeof phase.pct !== 'number') {
        err(`${path}.phases[${pi}]`, "phases with on:'hpBelowPct' require a numeric pct");
      }
    }
  }

  // ---- scripts budget (SPEC §3.1(6), §3.14(5)) -----------------------------
  const scriptUsers = [];
  let totalObjects = 0;
  for (const type of REGISTRY_TYPES) {
    for (const def of b[type] || []) {
      totalObjects++;
      if (usesScript(def)) scriptUsers.push(`${type}.${def.id}`);
    }
  }
  const scriptPct = totalObjects === 0 ? 0 : (scriptUsers.length / totalObjects) * 100;
  if (scriptPct >= 5) {
    err('scripts', `scripts budget exceeded: ${scriptUsers.length}/${totalObjects} content objects (${scriptPct.toFixed(1)}%) use scripts (must stay < 5%). Users: ${scriptUsers.join(', ')}`);
  }
  const scriptReport = {
    count: scriptUsers.length,
    total: totalObjects,
    pct: scriptPct,
    users: scriptUsers,
  };

  return { ok: errors.length === 0, errors, scriptReport };
