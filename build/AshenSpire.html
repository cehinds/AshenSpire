    }
  }

  function renderHand() {
    const hand = $('.hand');
    hand.innerHTML = '';
    const handList = disp ? disp.hand : combat.piles.hand;
    const n = handList.length;
    handList.forEach((inst, i) => {
      // disp.hand is a pre-dispatch snapshot; on a combat-ending play the engine
      // strands the in-flight card in no pile (finishCombat clears the queue),
      // so previewCard can no longer resolve it. Render such cards inert instead
      // of letting the throw wedge the timeline (this froze the game on the
      // killing blow).
      let pv = null;
      try {
        pv = previewCard(combat, inst.instanceId);
      } catch (e) {
        console.warn('[combat] hand card not previewable (stale snapshot):', inst.instanceId);
      }
      const affordable = !!pv && combat.player.energy >= (pv.costIsX ? 0 : pv.cost) && !isUnplayable(inst);
      const el = renderCard(registries, inst, pv ? { preview: pv, affordable } : { affordable });
      const spread = Math.min(6, n) * 1.2;
      el.style.transform = `rotate(${(i - (n - 1) / 2) * (spread / Math.max(n - 1, 1))}deg) translateY(${Math.abs(i - (n - 1) / 2) * 6}px)`;
      el.style.zIndex = i;
      if (inst.instanceId === selected || inst.instanceId === selfArm) el.classList.add('selected');
      // Positional quick-play key badge: 1–9 then Q, tied to the slot not the
      // card. Hidden while a gamepad drives (body.pad-mode via refreshHintBars).
      if (i < 10) {
        const hint = document.createElement('span');
        hint.className = 'key-hint';
        hint.textContent = i < 9 ? i + 1 : 'Q';
        el.appendChild(hint);
      }
      if (pv) wireCardInput(el, inst, pv, affordable);
      hand.appendChild(el);
    });
  }

  function isUnplayable(inst) {
    return (resolveCard(registries, inst).keywords || []).includes('unplayable');
  }

  function renderControls() {
    $('.energy-orb').textContent = `${combat.player.energy}/${combat.player.energyMax}`;
    // The bound key (or pad button) rides on the End Turn button itself, so the
    // shortcut is discoverable without reading the hint bar. Tracks rebinds.
    const etKey = hasGamepad() ? padLabel('endTurn') || keyLabel('endTurn') : keyLabel('endTurn');
    $('.end-turn').innerHTML = `END TURN <kbd class="et-key">${esc(etKey)}</kbd>`;
    const anyPlayable = combat.piles.hand.some((inst) => {
      const def = resolveCard(registries, inst);
      if ((def.keywords || []).includes('unplayable')) return false;
      return combat.player.energy >= (def.cost === 'X' ? 0 : def.cost);
    });
    $('.end-turn').classList.toggle('pulse', combat.player.energy > 0 && anyPlayable);
    $('.pile.draw .n').textContent = combat.piles.draw.length;
    $('.pile.discard .n').textContent = combat.piles.discard.length;
    const ex = $('.pile.exhaust');
    ex.style.display = combat.piles.exhaust.length ? '' : 'none';
    ex.querySelector('.n').textContent = combat.piles.exhaust.length;
  }

  // ---------- input: click-to-target + drag (SPEC §7.3, both modes) ----------
  function wireCardInput(el, inst, pv, affordable) {
    let dragGhost = null;
    let dragging = false;
    let suppressClick = false; // a finished drag must not double-fire as a click
    let startX = 0;
    let startY = 0;

    el.addEventListener('pointerdown', (ev) => {
      if (busy || !affordable || ev.button !== 0) return;
      startX = ev.clientX;
      startY = ev.clientY;
      const onMove = (mv) => {
        if (!dragging && Math.hypot(mv.clientX - startX, mv.clientY - startY) > 12) {
          dragging = true;
          hideTooltip();
          dragGhost = el.cloneNode(true);
          dragGhost.style.cssText += 'position:fixed;z-index:600;pointer-events:none;opacity:.9;transform:scale(1.1);';
          document.body.appendChild(dragGhost);
        }
        if (dragging && dragGhost) {
          dragGhost.style.left = `${mv.clientX - 70}px`;
          dragGhost.style.top = `${mv.clientY - 100}px`;
        }
      };
      const onUp = (up) => {
        removeEventListener('pointermove', onMove);
        removeEventListener('pointerup', onUp);
        if (dragGhost) dragGhost.remove();
        if (!dragging) return; // plain click handled by 'click'
        dragging = false;
        suppressClick = true; // whatever happens next, this drag is not a click
        const under = document.elementFromPoint(up.clientX, up.clientY);
        const enemyBox = under && under.closest ? under.closest('.enemy:not(.dead)') : null;
        if (pv.needsTarget) {
          if (enemyBox) playCard(inst.instanceId, enemyBox.dataset.eid);
        } else if (under && under.closest && under.closest('.field')) {
          playCard(inst.instanceId, null);
        }
      };
      addEventListener('pointermove', onMove);
      addEventListener('pointerup', onUp);
    });

    el.addEventListener('click', (ev) => {
      if (suppressClick) {
        suppressClick = false;
        return;
      }
      if (busy || !affordable || dragging) return;
      if (pv.needsTarget) {
        selected = selected === inst.instanceId ? null : inst.instanceId;
        selfArm = null;
        render();
        if (selected) focusTargeting();
      } else if (ev.isTrusted) {
        // Real mouse click on a self/buff card → play immediately.
        playCard(inst.instanceId, null);
      } else {
        // Synthetic click from keyboard/gamepad Confirm → arm the blue confirm.
        armSelf(inst.instanceId);
      }
    });
  }

  // Cancel targeting with right-click / Esc.
  combatEl.addEventListener('contextmenu', (ev) => {
    if (selected || selectedFlask != null || selfArm) {
      ev.preventDefault();
      selected = null;
      selectedFlask = null;
      selfArm = null;
      render();
    }
  });
  // Keyboard shortcuts (SPEC §7.3): Esc cancels targeting; 1–9 select/play the
  // Nth card (or, while targeting, pick the Nth living enemy); E ends the turn.
  const keyHandler = (ev) => {
    // Self-clean if the combat screen was torn down (e.g. Save & Quit mid-fight)
    // — the listener lives on window, so it must detach when its DOM is gone.
    if (!app.querySelector('.combat')) {
      removeEventListener('keydown', keyHandler);
      return;
    }
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const tag = (ev.target && ev.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (overlayIsOpen()) return; // the overlay owns input while open

    // Dedicated (rebindable) overlay keys: Menu → Deck, plus jump-to-tab keys.
    for (const [id, tab] of [['menu', 'deck'], ['deck', 'deck'], ['relics', 'relics'], ['stats', 'stats']]) {
      if (matchAction(ev, id)) {
        ev.preventDefault();
        if (onMenu) onMenu(tab);
        return;
      }
    }

    if (ev.key === 'Escape') {
      if (selected || selectedFlask != null || selfArm) {
        selected = null;
        selectedFlask = null;
        selfArm = null;
        hideTooltip();
        render();
        focusHandDefault();
      }
      return;
    }
    if (busy || combat.result || combat.phase !== 'player') return;

    if (matchAction(ev, 'endTurn')) {
      ev.preventDefault();
      $('.end-turn').click();
      return;
    }

    // Flask quick-use (F/G/H by default, rebindable; pads route through the
    // same bound keys). Drinks immediately, or enters aim mode when targeted.
    for (let slot = 0; slot < 3; slot++) {
      if (matchAction(ev, `flask${slot + 1}`)) {
        ev.preventDefault();
        const f = combat.player.flasks[slot];
        if (!f) return;
        const fdef = registries.flasks.get(f.flaskId);
        if (fdef.targeted) {
          selectedFlask = slot;
          selected = null;
          selfArm = null;
          render();
          focusTargeting();
        } else {
          useFlask(slot, null);
        }
        return;
      }
    }

    // Positional card keys: 1–9 then Q for the 10th (hand caps at 10). The key
    // is tied to the SLOT, not the card — leftmost is always 1.
    const cardIdx = /^[1-9]$/.test(ev.key) ? Number(ev.key) - 1 : ev.key === 'q' || ev.key === 'Q' ? 9 : -1;
    if (cardIdx >= 0) {
      ev.preventDefault();
      // Targeting mode: a NUMBER picks the Nth living enemy (Q never targets).
      if ((selected || selectedFlask != null) && cardIdx < 9) {
        const enemy = combat.enemies.filter((e) => e.alive)[cardIdx];
        if (!enemy) return;
        if (selected) playCard(selected, enemy.id);
        else useFlask(selectedFlask, enemy.id);
        return;
      }
      // Selection mode: play the Nth hand card (auto-target a lone enemy).
      const inst = combat.piles.hand[cardIdx];
      if (!inst) return;
      const pv = previewCard(combat, inst.instanceId);
      const affordable = combat.player.energy >= (pv.costIsX ? 0 : pv.cost) && !isUnplayable(inst);
      if (!affordable) return;
      if (pv.needsTarget) {
        const living = combat.enemies.filter((e) => e.alive);
        if (living.length === 1) playCard(inst.instanceId, living[0].id);
        else {
          selected = inst.instanceId;
          selectedFlask = null;
          render();
          focusTargeting();
        }
      } else {
        playCard(inst.instanceId, null);
      }
    }
  };
  addEventListener('keydown', keyHandler);

  // ---------- actions ----------
  function trackStats(events) {
    for (const e of events) {
      if (e.type === 'damageDealt' && e.sourceId === 'player') run.stats.damageDealt += e.amount;
      if (e.type === 'hpLost' && e.targetId === 'player') run.stats.damageTaken += e.amount;
    }
  }

  function useFlask(slot, targetId) {
    if (busy || combat.result) {
      dlog('ignored', `useFlask slot=${slot}`, { busy, result: combat.result, phase: combat.phase });
      return;
    }
    selectedFlask = null;
    selected = null;
    hideTooltip();
    disp = takeSnapshot();
    let out;
    try {
      out = dispatch(combat, { type: 'useFlask', slot, targetId: targetId || undefined });
    } catch (err) {
      console.warn("[combat] dispatch rejected:", err && err.message);
      dlog('rejected', `useFlask slot=${slot}`, err && err.message);
      disp = null;
      render();
      return;
    }
    dlog('dispatch', `useFlask slot=${slot}${targetId ? ' -> ' + targetId : ''}`, { events: out.events.length });
    sfx.play('flask');
    busy = true;
    afterDispatch(out.events);
  }

  function afterDispatch(events) {
    // Nothing between here and playTimeline may prevent the timeline from
    // starting: busy is already true, and only the timeline's finish releases
    // it (and fires onEnd on victory/defeat). A render throw here once froze
    // the game permanently on the killing blow.
    try {
      trackStats(events);
      render(); // hand/energy react now; bars render from the pre-dispatch snapshot
    } catch (e) {
      console.warn('[combat] post-dispatch render failed:', e && e.message);
    }
    playTimeline(
      events,
      {
        ...fxCtx,
        onBeatApplied: (beat) => {
          applyBeatToDisp(beat);
          renderTopbar();
          renderPlayer();
          renderEnemies();
          renderHand();
          renderControls();
        },
        onFlush: () => {
          disp = null;
          render();
        },
      },
      () => {
        disp = null;
        render();
        busy = false;
        if (combat.result) {
          removeEventListener('keydown', keyHandler);
          setTimeout(() => onEnd(combat.result, combat), 350);
        } else {
          focusHandDefault(); // land on the leftmost playable card for kb/pad
        }
      }
    );
  }

  // Ghost the played card flying toward its target (≤220 ms, purely cosmetic).
  function flyCard(instanceId, targetId) {
    const cardEl = app.querySelector(`.hand .card[data-instance-id="${instanceId}"]`);
    if (!cardEl) return;
    const dest = (targetId && fxCtx.anchorFor(targetId)) || fxCtx.anchorFor('player');
    const from = cardEl.getBoundingClientRect();
    const to = dest ? dest.getBoundingClientRect() : from;
    const ghost = cardEl.cloneNode(true);
    ghost.className = `${cardEl.className} card-ghost`;
    ghost.style.left = `${from.left}px`;
    ghost.style.top = `${from.top}px`;
    ghost.style.width = `${from.width}px`;
    ghost.style.margin = '0';
    document.body.appendChild(ghost);
    requestAnimationFrame(() => {
      const dx = to.left + to.width / 2 - (from.left + from.width / 2);
      const dy = to.top + to.height / 2 - (from.top + from.height / 2);
      ghost.style.transform = `translate(${dx}px, ${dy}px) scale(0.35) rotate(6deg)`;
      ghost.style.opacity = '0';
    });
    setTimeout(() => ghost.remove(), 260);
  }

  function playCard(instanceId, targetId) {
    if (busy || combat.result) {
      const why = { busy, result: combat.result, phase: combat.phase };
      console.debug('[combat] playCard ignored:', JSON.stringify(why));
      dlog('ignored', `playCard ${instanceId}`, why);
      return;
    }
    if (targetId) lastTargetId = targetId; // remembered for the next card's aim
    selected = null;
    selectedFlask = null;
    selfArm = null;
    clearAim();
    hideTooltip();
    flyCard(instanceId, targetId);
    disp = takeSnapshot();
    let out;
    try {
      out = dispatch(combat, { type: 'playCard', cardInstanceId: instanceId, targetId: targetId || undefined });
    } catch (err) {
      console.warn("[combat] dispatch rejected:", err && err.message);
      dlog('rejected', `playCard ${instanceId}`, err && err.message);
      disp = null;
      render(); // illegal input: show nothing, just resync (ENGINE-API §12)
      return;
    }
    dlog('dispatch', `playCard ${instanceId}${targetId ? ' -> ' + targetId : ''}`, { events: out.events.length, result: combat.result });
    sfx.play('cardPlay');
    busy = true;
    afterDispatch(out.events);
  }

  $('.end-turn').addEventListener('click', () => {
    if (busy || combat.result || combat.phase !== 'player') {
      const why = { busy, result: combat.result, phase: combat.phase };
      console.debug('[combat] endTurn ignored:', JSON.stringify(why));
      dlog('ignored', 'endTurn', why);
      return;
    }
    selected = null;
    selectedFlask = null;
    hideTooltip();
    disp = takeSnapshot();
    let out;
    try {
      out = dispatch(combat, { type: 'endTurn' });
    } catch (err) {
      console.warn("[combat] dispatch rejected:", err && err.message);
      dlog('rejected', 'endTurn', err && err.message);
      disp = null;
      return;
    }
    dlog('dispatch', 'endTurn', { events: out.events.length });
    busy = true;
    afterDispatch(out.events);
  });

  $('.pile.draw').addEventListener('click', () => openPileModal(registries, 'Draw pile', combat.piles.draw, { shuffleForDisplay: true }));
  $('.pile.discard').addEventListener('click', () => openPileModal(registries, 'Discard pile', combat.piles.discard));
  $('.pile.exhaust').addEventListener('click', () => openPileModal(registries, 'Exhaust pile', combat.piles.exhaust));
  // Settings lives inside the Menu overlay (Settings tab) — one button, one home.
  if (onMenu) $('#combat-menu').addEventListener('click', () => onMenu('deck'));

  render();

  // Keep the target glow in sync with focus/hover: the field's class attributes
  // change as the cursor (gp-focus) or pointer (hover-target) moves; a full
  // render() also re-applies it. Observing attributes only (childList untouched)
  // avoids feedback from our own inserted silhouette node.
  const field = $('.field');
  if (field && typeof MutationObserver !== 'undefined') {
    const aimObs = new MutationObserver(() => {
      if (aimScheduled) return;
      aimScheduled = true;
      setTimeout(() => {
        aimScheduled = false;
        if (app.querySelector('.combat')) refreshAim();
      }, 0);
    });
    aimObs.observe(field, { attributes: true, attributeFilter: ['class'], subtree: true });
  }
  focusHandDefault();

  // Combat-start events (relic triggers, opening draw) get a quick pass too.
  animateEvents(combat.eventLog.filter((e) => e.type === 'relicTriggered'), fxCtx, () => {});

  // First-run guided callouts (SPEC §9 M4) — once per player, over a live board.
  if (showTutorial) mountTutorial(app, { onDone: () => onTutorialDone && onTutorialDone() });
}


Object.assign(module.exports, { mountCombat });

},
"src/ui/components/piles.js": function (module, exports, require) {
// src/ui/components/piles.js — pile viewer modal (SPEC §7.2)
//
// Draw-pile views are display-shuffled (Math.random is fine here — pure
// presentation, never game state) so pile inspection leaks no order info,
// like StS.

const { renderCard } = require("src/ui/components/card.js");

function openPileModal(registries, title, cards, { shuffleForDisplay = false } = {}) {
  const veil = document.createElement('div');
  veil.className = 'modal-veil';
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `<h2>${title} (${cards.length})</h2>`;
  const grid = document.createElement('div');
  grid.className = 'grid';

  let list = [...cards];
  if (shuffleForDisplay) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
  }
  for (const inst of list) {
    grid.appendChild(renderCard(registries, inst, { small: true }));
  }
  if (!list.length) {
    const empty = document.createElement('div');
    empty.style.cssText = 'color:var(--muted);padding:20px;';
    empty.textContent = 'Empty.';
    grid.appendChild(empty);
  }
  modal.appendChild(grid);
  veil.appendChild(modal);
  veil.addEventListener('click', (ev) => {
    if (ev.target === veil) veil.remove();
  });
  document.body.appendChild(veil);
  return veil;
}


Object.assign(module.exports, { openPileModal });

},
"src/ui/fx.js": function (module, exports, require) {
// src/ui/fx.js — feedback effects (SPEC §7.4)
//
// Rules: every animation ≤300 ms; queued events play ≤80 ms apart; a click
// skips to end-state; shake ≤4 px only for hits ≥15; Bleed bursts and
// Staggers get the loud treatment (they're the theme).

const { sfx } = require("src/ui/sfx.js");
const { dlog } = require("src/ui/debuglog.js");

const STEP_MS = 80;

// ---------------------------------------------------------------------------
// Animation speed (settings-driven; 'instant' collapses paced playback to the
// classic fast-float behavior — also forced by reducedMotion).
// ---------------------------------------------------------------------------

const ANIM_SPEEDS = {
  slow: { beatMs: 700, stepMs: 140, lungeMs: 340 },
  normal: { beatMs: 400, stepMs: 90, lungeMs: 260 },
  fast: { beatMs: 180, stepMs: 45, lungeMs: 160 },
  instant: null,
};

let animSpeed = 'normal';
function setAnimSpeed(v) {
  animSpeed = ANIM_SPEEDS[v] === undefined ? 'normal' : v;
}
function getAnimSpeed() {
  return animSpeed;
}

let pending = [];
let flushRequested = false;

// The whole UI is scaled by --ui-zoom (main.js applyUiScale). getBoundingClientRect
// returns POST-zoom (visual) pixels, but a child's `style.left` is interpreted in
// the layer's PRE-zoom local space — so a raw visual offset lands at offset×zoom,
// pulling anchored FX toward the origin (worse the further right the target). This
// converts an anchor's on-screen box into the layer's local coordinates so FX land
// exactly on their target regardless of zoom.
function anchorLocalBox(layer, anchor) {
  const lr = layer.getBoundingClientRect();
  const ar = anchor.getBoundingClientRect();
  const z = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ui-zoom')) || 1;
  return {
    left: (ar.left - lr.left) / z,
    top: (ar.top - lr.top) / z,
    width: ar.width / z,
    height: ar.height / z,
  };
}

/** Spawn a floating number over an anchor element. */
function floatNum(layer, anchor, text, cls) {
  if (!layer || !anchor) return;
  const b = anchorLocalBox(layer, anchor);
  const el = document.createElement('div');
  el.className = `float-num ${cls}`;
  el.textContent = text;
  el.style.left = `${b.left + b.width / 2 - 14 + (Math.random() * 26 - 13)}px`;
  el.style.top = `${b.top + b.height * 0.25}px`;
  layer.appendChild(el);
  setTimeout(() => el.remove(), 600);
}

// Damage magnitude → size tier: crit (big hits pop hardest), heavy, normal, chip.
function dmgClass(amount) {
  if (amount >= 25) return 'dmg crit';
  if (amount >= 15) return 'dmg heavy';
  if (amount < 6) return 'dmg small';
  return 'dmg';
}

/** Spawn a transient effect element (slash arc, cast glyph, block spark…). */
function spawnFx(layer, anchor, cls, ms, text) {
  if (!layer || !anchor) return;
  const b = anchorLocalBox(layer, anchor);
  const el = document.createElement('div');
  el.className = cls;
  if (text) el.textContent = text;
  el.style.left = `${b.left + b.width / 2}px`;
  el.style.top = `${b.top + b.height * 0.4}px`;
  el.style.setProperty('--rot', `${Math.round(Math.random() * 50 - 25)}deg`);
  layer.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

function banner(layer, text, cls = '') {
  if (!layer) return;
  const el = document.createElement('div');
  el.className = `fx-banner ${cls}`;
  el.textContent = text;
  layer.appendChild(el);
  setTimeout(() => el.remove(), 320);
}

function shake(combatEl) {
  if (!combatEl) return;
  // Honor the Screen shake setting (and reduced motion, which also drops it).
  if (document.body.classList.contains('no-shake') || document.body.classList.contains('reduced-motion')) return;
  combatEl.classList.remove('shake');
  void combatEl.offsetWidth; // restart animation
  combatEl.classList.add('shake');
}

// Add a short-lived CSS class (restarting its animation if already present).
function flash(el, cls, ms = 300) {
  if (!el) return;
  // Photosensitivity: suppress bright impact/proc flashes when asked. Damage
  // numbers and HUD updates (which carry the actual info) are unaffected.
  if (document.body.classList.contains('reduce-flashes')) return;
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), ms);
}

// Radial flare over an anchor (stance entries, big procs).
function flare(layer, anchor, color) {
  if (!layer || !anchor) return;
  const b = anchorLocalBox(layer, anchor);
  const el = document.createElement('div');
  el.className = 'stance-flare';
  el.style.left = `${b.left + b.width / 2 - 90}px`;
  el.style.top = `${b.top + b.height / 2 - 90}px`;
  el.style.background = `radial-gradient(circle, ${color} 0%, transparent 65%)`;
  layer.appendChild(el);
  setTimeout(() => el.remove(), 320);
}

/**
 * animateEvents(events, ctx, done)
 *   ctx = { layer, combatEl, anchorFor(entityId) → element|null }
 * Events are staggered STEP_MS apart; clicking anywhere flushes instantly.
 */
function animateEvents(events, ctx, done) {
  flushRequested = false;
  pending = events.filter((e) => visualFor(e) !== null);
  const skip = () => {
    flushRequested = true;
  };
  addEventListener('pointerdown', skip, { once: true, capture: true });

  let i = 0;
  const step = () => {
    while (flushRequested && i < pending.length) {
      // Flushed: fire remaining sounds silently-fast, no visuals backlog.
      i++;
    }
    if (i >= pending.length) {
      removeEventListener('pointerdown', skip, { capture: true });
      if (done) done();
      return;
    }
    const fn = visualFor(pending[i]);
    if (fn) fn(ctx);
    i++;
    setTimeout(step, STEP_MS);
  };
  step();
}

// ---------------------------------------------------------------------------
// Paced playback — one actor at a time (SPEC §7.4 extension).
//
// Groups a dispatch's event log into "beats": each card play, flask use, and
// enemy move is its own beat, played as actor animation → effect visuals →
// numbers → HUD update (ctx.onBeatApplied), before the next actor moves.
// Turn boundaries become banner beats. Click skips to the end state.
// ---------------------------------------------------------------------------

function groupBeats(events) {
  const beats = [];
  let cur = { actorId: null, banner: null, kind: null, events: [] };
  const push = () => {
    if (cur.events.length || cur.banner || cur.actorId) beats.push(cur);
  };
  for (const e of events) {
    switch (e.type) {
      case 'cardPlayed':
        push();
        cur = { actorId: 'player', banner: null, kind: e.cardType === 'attack' ? 'attack' : 'act', events: [e] };
        break;
      case 'flaskUsed':
        push();
        cur = { actorId: 'player', banner: null, kind: 'act', events: [e] };
        break;
      case 'enemyMoveStarted':
        push();
        cur = { actorId: e.sourceId, banner: null, kind: e.kind === 'attack' ? 'attack' : 'act', events: [e] };
        break;
      case 'enemyTurnStart':
        push();
        cur = { actorId: null, banner: 'ENEMY TURN', kind: 'banner', events: [e] };
        break;
      case 'playerTurnStart':
        push();
        cur = { actorId: null, banner: 'YOUR TURN', kind: 'banner', events: [e] };
        break;
      case 'cardDrawn':
        // Draws fire just before 'playerTurnStart' — split them out of the
        // last enemy beat so the hand refills as its own step.
        if (cur.actorId && cur.actorId !== 'player' && cur.kind !== 'draw') {
          push();
          cur = { actorId: null, banner: null, kind: 'draw', events: [] };
        }
        cur.events.push(e);
        break;
      default:
        cur.events.push(e);
    }
  }
  push();
  return beats;
}

/**
 * playTimeline(events, ctx, done)
 *   ctx = animateEvents ctx + {
 *     onBeatApplied(beat)  — apply this beat's events to the display state
 *                            (HP/block bars, hand, statuses) AFTER its visuals,
 *     onFlush()            — skip: jump display to true final state,
 *   }
 * Uses the module anim speed; 'instant' (or reducedMotion) falls back to
 * animateEvents' classic behavior (final state + fast floats).
 */
// Debug lifecycle counters (window.__fx) — cheap, used to diagnose stuck-busy
// reports: every timeline must end in exactly one finish (done/watchdog/flush).
const dbg = typeof window !== 'undefined' ? (window.__fx = { open: 0, finished: 0, watchdog: 0 }) : {};

function playTimeline(events, ctx, done) {
  const speed = ANIM_SPEEDS[animSpeed];
  const reduced = document.body.classList.contains('reduced-motion');
  if (!speed || reduced) {
    if (ctx.onFlush) ctx.onFlush();
    animateEvents(events, ctx, done);
    return;
  }
  dbg.open = (dbg.open || 0) + 1;

  const beats = groupBeats(events);
  let flushed = false;
  let finished = false;
  const skip = () => {
    flushed = true;
  };
  addEventListener('pointerdown', skip, { once: true, capture: true });
  const finish = () => {
    if (finished) return;
    finished = true;
    dbg.finished = (dbg.finished || 0) + 1;
    clearTimeout(watchdog);
    removeEventListener('pointerdown', skip, { capture: true });
    if (done) done();
  };
  // Safety net: however playback ends (or a re-render throws mid-beat), never
  // leave the caller's `busy` flag stuck — force completion after a bounded
  // wall-clock budget. This is what prevents the "cards stop responding" hang.
  const budget = 2000 + beats.length * (speed.beatMs + speed.lungeMs + 4 * speed.stepMs);
  const watchdog = setTimeout(() => {
    dbg.watchdog = (dbg.watchdog || 0) + 1;
    console.warn('[fx] watchdog forced timeline completion');
    dlog('fx', 'watchdog forced timeline completion', { open: dbg.open, finished: dbg.finished });
    try {
      if (ctx.onFlush) ctx.onFlush();
    } catch (e) {
      /* ignore */
    }
    finish();
  }, budget);

  const safe = (fn) => {
    try {
      if (fn) fn();
    } catch (e) {
      /* a render/visual error must not break the chain */
    }
  };

  let bi = 0;
  const nextBeat = () => {
    if (finished) return;
    if (flushed) {
      safe(() => ctx.onFlush && ctx.onFlush());
      finish();
      return;
    }
    if (bi >= beats.length) {
      finish();
      return;
    }
    const beat = beats[bi++];

    if (beat.banner) {
      safe(() => banner(ctx.layer, beat.banner, 'turn'));
      safe(() => ctx.onBeatApplied && ctx.onBeatApplied(beat));
      setTimeout(nextBeat, Math.max(260, speed.beatMs));
      return;
    }

    // 1) actor animation (lunge for attacks, glow-step otherwise)
    const actorEl = beat.actorId ? ctx.anchorFor(beat.actorId) : null;
    if (actorEl) safe(() => flash(actorEl, beat.kind === 'attack' ? 'act-attack' : 'act-move', speed.lungeMs));

    // 2) after the wind-up, the beat's effect visuals + numbers, staggered
    const visuals = beat.events.map((e) => visualFor(e, beat.kind)).filter(Boolean);
    // Cast flourish: non-attack actors (skills, powers, buff moves) flare a
    // glyph as their wind-up — attacks get the slash arc on impact instead.
    if (actorEl && beat.kind !== 'attack' && beat.events.length) {
      safe(() => spawnFx(ctx.layer, actorEl, 'fx-glyph', 450, '✦'));
    }
    const windup = actorEl ? Math.round(speed.lungeMs * 0.55) : 0;
    setTimeout(() => {
      let vi = 0;
      const stepV = () => {
        if (finished) return;
        if (flushed) {
          nextBeat();
          return;
        }
        if (vi < visuals.length) {
          const v = visuals[vi++];
          safe(() => v(ctx));
          setTimeout(stepV, speed.stepMs);
          return;
        }
        // 3) HUD updates for this beat, 4) inter-beat breath
        safe(() => ctx.onBeatApplied && ctx.onBeatApplied(beat));
        setTimeout(nextBeat, speed.beatMs);
      };
      stepV();
    }, windup);
  };
  nextBeat();
}

function visualFor(e, beatKind) {
  switch (e.type) {
    case 'damageDealt':
      // Fully blocked: a frost spark and a BLOCKED float — the armor held, so
      // no flinch, no shake, no slash.
      if (e.amount === 0 && e.blocked > 0) {
        return (ctx) => {
          sfx.play('block');
          const anchor = ctx.anchorFor(e.targetId);
          spawnFx(ctx.layer, anchor, 'fx-spark', 320, '✦');
          floatNum(ctx.layer, anchor, 'BLOCKED', 'blk small');
        };
      }
      return (ctx) => {
        sfx.play('hit');
        const anchor = ctx.anchorFor(e.targetId);
        const heavy = e.amount >= 15;
        floatNum(ctx.layer, anchor, `-${e.amount}`, dmgClass(e.amount));
        // Attack impacts slash; the victim flashes + recoils (CSS); heavy hits
        // recoil further (hit-heavy) and kick the screen.
        if (beatKind === 'attack') spawnFx(ctx.layer, anchor, 'fx-slash', 300);
        flash(anchor, 'hitflash', heavy ? 380 : 220);
        if (heavy) {
          flash(anchor, 'hit-heavy', 380);
          shake(ctx.combatEl);
        }
      };
    case 'blockGained':
      return e.amount > 0
        ? (ctx) => {
            sfx.play('block');
            floatNum(ctx.layer, ctx.anchorFor(e.targetId), `+${e.amount}`, 'blk');
          }
        : null;
    case 'hpLost':
      return e.cause === 'effect'
        ? (ctx) => floatNum(ctx.layer, ctx.anchorFor(e.targetId), `-${e.amount}`, 'burst')
        : null; // attack damage already shown by damageDealt
    case 'healed':
      return e.amount > 0
        ? (ctx) => {
            sfx.play('heal');
            floatNum(ctx.layer, ctx.anchorFor(e.targetId), `+${e.amount}`, 'heal');
          }
        : null;
    case 'meterFilled':
      return e.status === 'bleed'
        ? (ctx) => {
            sfx.play('bleedBurst');
            banner(ctx.layer, 'BLEED BURST', 'blood');
          }
        : null;
    case 'enemyStaggered':
      return (ctx) => {
        sfx.play('stagger');
        banner(ctx.layer, 'STAGGERED');
        const anchor = ctx.anchorFor(e.targetId);
        flash(anchor, 'wobble', 600); // poise broken: the whole figure teeters
        spawnFx(ctx.layer, anchor, 'fx-glyph', 450, '✦');
        shake(ctx.combatEl);
      };
    case 'enemyDied':
      return (ctx) => {
        sfx.play('enemyDeath');
        const anchor = ctx.anchorFor(e.targetId);
        floatNum(ctx.layer, anchor, '✝', 'dmg heavy');
        if (anchor) anchor.classList.add('crumble');
      };
    case 'stanceEntered':
      return (ctx) => {
        sfx.play('stance');
        const color = e.stance === 'bulwark' ? 'rgba(127,168,201,.55)' : 'rgba(201,80,46,.55)';
        flare(ctx.layer, ctx.anchorFor('player'), color);
      };
    case 'relicTriggered':
      return (ctx) => {
        sfx.play('relic');
        if (ctx.relicAnchor) flash(ctx.relicAnchor(e.relicId), 'proc', 320);
      };
    case 'energySpent':
    case 'energyGained':
      return (ctx) => {
        if (ctx.orb) flash(ctx.orb(), 'pulse', 260);
      };
    default:
      return null;
  }
}


Object.assign(module.exports, { ANIM_SPEEDS, setAnimSpeed, getAnimSpeed, anchorLocalBox, animateEvents, playTimeline });

},
"src/ui/sfx.js": function (module, exports, require) {
// src/ui/sfx.js — sound hooks (SPEC §7.4; §11: audio assets are a v1 non-goal)
//
// Every feedback moment calls sfx.play(id). v1 ships NO audio, so play() makes
// no sound — but the hooks already exist at every call site (cardPlay, hit,
// block, bleedBurst, stagger, enemyDeath, heal, stance, relic, flask, shrine,
// buy, victory, youDied). That means an audio layer plugs in with zero call-site
// changes: assign `sfx.sink = (id) => ...` (a WebAudio synth or sample bank).
//
// `recent` is a small ring buffer of the ids fired — it lets tests and QA verify
// the wiring is live without shipping any audio.

const sfx = {
  sink: null, // future audio layer plugs in here; null = silent (v1)
  recent: [], // last fired hook ids (bounded), for verification
  play(id) {
    this.recent.push(id);
    if (this.recent.length > 32) this.recent.shift();
    if (this.sink) this.sink(id);
  },
};


Object.assign(module.exports, { sfx });

},
"src/ui/components/tutorial.js": function (module, exports, require) {
// src/ui/components/tutorial.js — first-run combat callouts (SPEC §7.4, §9 M4)
//
// A one-time guided overlay (≤4 dismissible callouts) shown on the player's
// first combat. Spotlights each key element and explains it; the "seen" flag is
// persisted in meta settings (main.js) so it never shows twice. Steps whose
// target isn't on screen (e.g. a Staggered enemy has no intent) are skipped.

const STEPS = [
  { sel: '.energy-orb', title: 'Energy', text: 'Three energy each turn. Cards cost energy to play — spend it wisely.' },
  { sel: '.enemy-row .intent', title: 'Enemy intent', text: 'Enemies telegraph their next move. The number is the exact damage they will deal to you.' },
  { sel: '.hand .card', title: 'Play cards', text: 'Click a card or press 1–9. Attacks need a target — click an enemy, or drag the card onto it.' },
  { sel: '.end-turn', title: 'End your turn', text: 'Done? End Turn (or press E). Unspent energy and most Block are lost at your next turn.' },
];

function mountTutorial(root, { onDone }) {
  const steps = STEPS.filter((s) => root.querySelector(s.sel));
  if (!steps.length) return onDone();

  const veil = document.createElement('div');
  veil.className = 'tut-veil';
  veil.innerHTML = `
    <div class="tut-spot"></div>
    <div class="tut-bubble">
      <div class="tut-title"></div>
      <p class="tut-text"></p>
      <div class="tut-row">
        <button class="subtle tut-skip">Skip</button>
        <button class="tut-next"></button>
      </div>
    </div>`;
  root.appendChild(veil);

  const spot = veil.querySelector('.tut-spot');
  const bubble = veil.querySelector('.tut-bubble');
  let i = 0;

  function show() {
    const step = steps[i];
    const target = root.querySelector(step.sel);
    if (!target) return next(); // vanished between filter and show
    const r = target.getBoundingClientRect();
    const pad = 8;
    spot.style.left = `${r.left - pad}px`;
    spot.style.top = `${r.top - pad}px`;
    spot.style.width = `${r.width + pad * 2}px`;
    spot.style.height = `${r.height + pad * 2}px`;
    veil.querySelector('.tut-title').textContent = step.title;
    veil.querySelector('.tut-text').textContent = step.text;
    veil.querySelector('.tut-next').textContent = i === steps.length - 1 ? 'Got it' : `Next (${i + 1}/${steps.length})`;

    const bubbleW = 300;
    const bubbleH = 160;
    bubble.style.left = `${Math.max(12, Math.min(r.left, window.innerWidth - bubbleW - 12))}px`;
    bubble.style.top =
      r.bottom + 20 + bubbleH < window.innerHeight ? `${r.bottom + 20}px` : `${Math.max(12, r.top - bubbleH - 12)}px`;
  }

  function next() {
    i += 1;
    if (i >= steps.length) finish();
    else show();
  }

  function finish() {
    veil.remove();
    onDone();
  }

  veil.querySelector('.tut-next').addEventListener('click', next);
  veil.querySelector('.tut-skip').addEventListener('click', finish);
  show();
}


Object.assign(module.exports, { mountTutorial });

},
"src/ui/screens/reward.js": function (module, exports, require) {
// src/ui/screens/reward.js — post-combat / treasure rewards (SPEC §6, §7.1)
//
// Rewards arrive pre-rolled by engine/encounters.js (deterministic streams);
// this screen only presents them. Skipping the card is a visible affordance
// (deck discipline, GDD §5). Cinders/relic/flask apply immediately; the flask
// is lost with a note if all slots are full.

const { renderCard } = require("src/ui/components/card.js");
const { esc } = require("src/ui/components/tooltip.js");
const { sfx } = require("src/ui/sfx.js");
const { isEngaged, focusFirst } = require("src/ui/input.js");

function mountRewards(app, { registries, run, rewards, onDone }) {
  const lines = [];
  if (rewards.cinders) {
    run.cinders += rewards.cinders;
    lines.push(`<span style="color:var(--gold)">+${rewards.cinders} cinders</span> (${run.cinders} total)`);
  }
  if (rewards.relicId) {
    run.relics.push(rewards.relicId);
    const def = registries.relics.get(rewards.relicId);
    lines.push(`Relic: <b>${esc(def.icon || '◆')} ${esc(def.name)}</b> — ${esc(def.textTemplate.replace(/[{}]/g, ''))}`);
  }
  if (rewards.flaskId) {
    const def = registries.flasks.get(rewards.flaskId);
    if (run.flasks.length < (registries.balance.flaskSlots || 3)) {
      run.flasks.push({ flaskId: rewards.flaskId });
      lines.push(`Flask: <b>${esc(def.icon || '🧪')} ${esc(def.name)}</b>`);
    } else {
      lines.push(`<span style="color:var(--muted)">A ${esc(def.name)} — but your flask slots are full. It stays in the mud.</span>`);
    }
  }

  sfx.play('victory');
  app.innerHTML = `
    <div class="screen">
      <h2 style="color:var(--gold);font-size:26px">${esc(rewards.title || 'VICTORY')}</h2>
      ${lines.map((l) => `<p style="font-size:14px">${l}</p>`).join('')}
      ${rewards.cardIds && rewards.cardIds.length ? '<p class="subtitle">CHOOSE A CARD</p><div class="reward-row"></div>' : ''}
      <button class="subtle" id="reward-continue">${rewards.cardIds && rewards.cardIds.length ? 'Skip the card' : 'CONTINUE'}</button>
    </div>`;

  const row = app.querySelector('.reward-row');
  if (row) {
    for (const cardId of rewards.cardIds) {
      const el = renderCard(registries, { cardId, upgraded: false }, {});
      el.addEventListener('click', () => {
        run.deck.push({ instanceId: `r${run.deck.length}_${cardId}`, cardId, upgraded: false });
        onDone(cardId);
      });
      row.appendChild(el);
    }
  }
  app.querySelector('#reward-continue').addEventListener('click', () => onDone(null));

  // Smart default (keyboard/gamepad): land on the first card to choose, else the
  // Continue button.
  if (isEngaged()) setTimeout(() => focusFirst('.reward-row .card') || focusFirst('#reward-continue'), 0);
}


Object.assign(module.exports, { mountRewards });

},
"src/ui/screens/rest.js": function (module, exports, require) {
// src/ui/screens/rest.js — Shrine of Emberlight: Rest (heal) or Smith (upgrade)
// (SPEC §7.1; heal math from engine/encounters.js shrineHealAmount)

const { shrineHealAmount } = require("src/engine/encounters.js");
const { passiveFlag, resolveCard } = require("src/model/registries.js");
const { renderCard, upgradePreviewHtml } = require("src/ui/components/card.js");
const { esc } = require("src/ui/components/tooltip.js");
const { sfx } = require("src/ui/sfx.js");

function mountRest(app, { registries, run, onDone, healMult = 1 }) {
  const heal = Math.floor(shrineHealAmount(registries, run) * healMult);
  const noRest = passiveFlag(registries, run.relics, 'shrineNoRest');
  const upgradable = run.deck.filter((c) => !c.upgraded && registries.cards.get(c.cardId).upgrade);

  app.innerHTML = `
    <div class="screen">
      <h2 style="color:var(--gold);font-size:26px">SHRINE OF EMBER</h2>
      <p class="subtitle">THE GOLD LIGHT HOLDS, FOR NOW</p>
      <div class="class-row">
        <div class="class-pick${noRest ? ' locked' : ''}" id="rest-opt">
          <div class="glyph">♨</div>
          <h3>Rest</h3>
          <p>${noRest ? 'The Wyrm Heart will not let you rest.' : `Heal ${heal} HP (${run.hp} → ${Math.min(run.maxHp, run.hp + heal)}/${run.maxHp}).`}</p>
        </div>
        <div class="class-pick${upgradable.length ? '' : ' locked'}" id="smith-opt">
          <div class="glyph">⚒</div>
          <h3>Smith</h3>
          <p>${upgradable.length ? 'Upgrade a card, permanently.' : 'Nothing left to upgrade.'}</p>
        </div>
      </div>
      <div id="smith-grid" class="deck-strip" style="display:none;max-width:900px"></div>
    </div>`;

  if (!noRest) {
    app.querySelector('#rest-opt').addEventListener('click', () => {
      run.hp = Math.min(run.maxHp, run.hp + heal);
      sfx.play('shrine');
      onDone(`Rested: +${heal} HP.`);
    });
  }
  if (upgradable.length) {
    app.querySelector('#smith-opt').addEventListener('click', () => {
      const grid = app.querySelector('#smith-grid');
      if (grid.style.display !== 'none') return;
      grid.style.display = 'flex';
      grid.style.gap = '14px';
      grid.style.flexWrap = 'wrap';
      grid.style.justifyContent = 'center';
      for (const inst of upgradable) {
        // Hover/focus a candidate to preview exactly what the upgrade changes.
        const el = renderCard(registries, inst, { small: true, tooltipFn: () => upgradePreviewHtml(registries, inst) });
        el.addEventListener('click', () => {
          inst.upgraded = true;
          sfx.play('shrine');
          onDone(`Smithed: ${esc(resolveCard(registries, inst).name)}.`);
        });
        grid.appendChild(el);
      }
    });
  }
}


Object.assign(module.exports, { mountRest });

},
"src/ui/screens/shop.js": function (module, exports, require) {
// src/ui/screens/shop.js — the wandering merchant (SPEC §7.1; prices from
// balance.shop via engine/encounters.js buildShopStock)
//
// The stock lives on run.shopStock (rolled once on first entry and saved),
// so a reload restores the exact same shelves — SPEC §3.11 determinism.

const { renderCard } = require("src/ui/components/card.js");
const { attachTooltip, esc } = require("src/ui/components/tooltip.js");
const { sfx } = require("src/ui/sfx.js");
const { isEngaged, focusFirst } = require("src/ui/input.js");

function mountShop(app, { registries, run, onLeave, onChanged }) {
  const stock = run.shopStock;
  const slotsFree = () => run.flasks.length < (registries.balance.flaskSlots || 3);

  function render() {
    app.innerHTML = `
      <div class="screen" style="justify-content:flex-start;overflow-y:auto;gap:14px;padding-top:28px">
        <h2 style="color:var(--gold);font-size:24px">THE WANDERING MERCHANT</h2>
        <p class="subtitle">"I'VE CLIMBED HIGHER THAN YOU. I CAME BACK. DRAW YOUR OWN CONCLUSIONS."</p>
        <p style="color:var(--gold)">Cinders: <b>${run.cinders}</b> · HP ${run.hp}/${run.maxHp}</p>
        <div class="reward-row" id="shop-cards"></div>
        <div class="class-row" id="shop-items"></div>
        <div class="class-row">
          <div class="class-pick${run.cinders >= stock.removeCost && run.deck.length > 1 ? '' : ' locked'}" id="remove-opt">
            <div class="glyph">✂</div><h3>Remove a card</h3><p>${stock.removeCost} cinders. The deck remembers what you cut.</p>
          </div>
        </div>
        <div id="remove-grid" class="deck-strip" style="display:none;max-width:900px"></div>
        <button id="leave-shop">LEAVE</button>
      </div>`;

    const cardsRow = app.querySelector('#shop-cards');
    stock.cards.forEach((item, i) => {
      const wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:6px';
      const el = renderCard(registries, { cardId: item.id, upgraded: false }, { small: true });
      const tag = document.createElement('span');
      tag.className = 'mini';
      tag.textContent = `${item.cost} cinders`;
      tag.style.color = run.cinders >= item.cost ? 'var(--gold)' : 'var(--muted)';
      if (run.cinders >= item.cost) {
        el.addEventListener('click', () => {
          run.cinders -= item.cost;
          run.deck.push({ instanceId: `s${run.deck.length}_${item.id}`, cardId: item.id, upgraded: false });
          stock.cards.splice(i, 1);
          sfx.play('buy');
          onChanged();
          render();
        });
      } else {
        el.classList.add('unaffordable');
      }
      wrap.appendChild(el);
      wrap.appendChild(tag);
      cardsRow.appendChild(wrap);
    });

    const items = app.querySelector('#shop-items');
    stock.relics.forEach((item, i) => {
      const def = registries.relics.get(item.id);
      items.appendChild(shopItem(`${def.icon || '◆'} ${def.name}`, def.textTemplate.replace(/[{}]/g, ''), item.cost, run.cinders >= item.cost, () => {
        run.cinders -= item.cost;
        run.relics.push(item.id);
        stock.relics.splice(i, 1);
        sfx.play('buy');
        onChanged();
        render();
      }));
    });
    stock.flasks.forEach((item, i) => {
      const def = registries.flasks.get(item.id);
      const can = run.cinders >= item.cost && slotsFree();
      items.appendChild(shopItem(`${def.icon || '🧪'} ${def.name}`, slotsFree() ? def.textTemplate : 'Flask slots full.', item.cost, can, () => {
        run.cinders -= item.cost;
        run.flasks.push({ flaskId: item.id });
        stock.flasks.splice(i, 1);
        sfx.play('buy');
        onChanged();
        render();
      }));
    });

    if (run.cinders >= stock.removeCost && run.deck.length > 1) {
      app.querySelector('#remove-opt').addEventListener('click', () => {
        const grid = app.querySelector('#remove-grid');
        if (grid.style.display !== 'none') return;
        grid.style.display = 'flex';
        grid.style.flexWrap = 'wrap';
        grid.style.gap = '14px';
        grid.style.justifyContent = 'center';
        run.deck.forEach((inst, idx) => {
          const el = renderCard(registries, inst, { small: true });
          el.addEventListener('click', () => {
            run.cinders -= stock.removeCost;
            run.deck.splice(idx, 1);
            run.removesPurchased = (run.removesPurchased || 0) + 1;
            stock.removeCost = registries.balance.shop.removeBase + registries.balance.shop.removeStep * run.removesPurchased;
            sfx.play('buy');
            onChanged();
            render();
          });
          grid.appendChild(el);
        });
      });
    }

    app.querySelector('#leave-shop').addEventListener('click', onLeave);
  }

  function shopItem(title, desc, cost, affordable, onBuy) {
    const el = document.createElement('div');

    el.innerHTML = `<h3 style="font-size:13px">${esc(title)}</h3><p>${esc(desc)}</p><span class="chip" style="color:${affordable ? 'var(--gold)' : 'var(--muted)'}">${cost} cinders</span>`;
    if (affordable) el.addEventListener('click', onBuy);
    return el;
  }

  render();

  // Smart default (keyboard/gamepad): land on the first purchasable card, else
  // the Leave button.
  if (isEngaged()) setTimeout(() => focusFirst('#shop-cards .card') || focusFirst('#leave-shop'), 0);
}


Object.assign(module.exports, { mountShop });

},
"src/ui/screens/event.js": function (module, exports, require) {
// src/ui/screens/event.js — Unknown-node events (SPEC §5.6, §7.1)
//
// Choices run through executeRunEffects (the same DSL as everything else).
// A startCombat effect sets run.combatEntered; the orchestrator (main.js)
// launches it after the result text.

const { executeRunEffects } = require("src/engine/actions.js");
const { esc } = require("src/ui/components/tooltip.js");
const { isEngaged, focusFirst } = require("src/ui/input.js");

function mountEvent(app, { registries, run, rng, eventId, onDone }) {
  const def = registries.events.get(eventId);

  function meets(requires) {
    if (!requires) return true;
    if (typeof requires.cinders === 'number' && run.cinders < requires.cinders) return false;
    return true;
  }

  app.innerHTML = `
    <div class="screen" style="gap:20px">
      <div class="event-art" style="font-size:56px">${esc(def.art || '❖')}</div>
      <h2 style="color:var(--gold);font-size:24px">${esc(def.name).toUpperCase()}</h2>
      <p style="max-width:560px;text-align:center;line-height:1.7;color:var(--parchment)">${esc(def.text)}</p>
      <div id="choices" style="display:flex;flex-direction:column;gap:10px;min-width:420px"></div>
    </div>`;

  const box = app.querySelector('#choices');
  def.choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'subtle';
    btn.style.fontSize = '13px';
    btn.style.animationDelay = `${i * 70}ms`; // staggered entrance
    btn.textContent = choice.label;
    if (!meets(choice.requires)) {
      btn.disabled = true;
      btn.textContent += ' (cannot afford)';
    } else {
      btn.addEventListener('click', () => {
        executeRunEffects({ run, registries, rng }, choice.effects);
        showResult(choice.resultText);
      });
    }
    box.appendChild(btn);
  });

  // Smart default (keyboard/gamepad): land on the first available choice.
  if (isEngaged()) setTimeout(() => focusFirst('#choices button'), 0);

  function showResult(text) {
    box.innerHTML = '';
    const p = document.createElement('p');
    p.style.cssText = 'max-width:560px;text-align:center;line-height:1.7;color:var(--muted);font-style:italic';
    p.textContent = text;
    const cont = document.createElement('button');
    cont.textContent = run.combatEntered ? 'STEEL YOURSELF' : 'CONTINUE';
    cont.addEventListener('click', onDone);
    box.appendChild(p);
    box.appendChild(cont);
    if (isEngaged()) setTimeout(() => focusFirst('#choices button'), 0);
  }
}


Object.assign(module.exports, { mountEvent });

},

"src/ui/screens/history.js": function (module, exports, require) {
// src/ui/screens/history.js — run history + aggregate win rates (SPEC §3.12, §9 M4)
//
// Reads the last 20 run results recorded by save.recordResult (sote_meta_v1)
// and shown most-recent-first. Also surfaces the win-rate telemetry the M3
// balance notes call for: overall and per-class win %.

const { esc } = require("src/ui/components/tooltip.js");

function mountHistory(app, { meta, onBack }) {
  const results = (meta.results || []).slice().reverse(); // most recent first
  // Win-rate telemetry counts STANDARD runs only — custom climbs are excluded
  // so their modifiers can't skew the balance numbers (SPEC §10).
  const standard = results.filter((r) => !r.custom);
  const customCount = results.length - standard.length;
  const total = standard.length;
  const wins = standard.filter((r) => r.victory).length;
  const pct = total ? Math.round((wins / total) * 100) : 0;

  // Per-class win/run tallies (the balance telemetry payoff) — standard only.
  const byClass = {};
  for (const r of standard) {
    const k = r.className || r.class || '—';
    const b = (byClass[k] = byClass[k] || { runs: 0, wins: 0 });
    b.runs += 1;
    if (r.victory) b.wins += 1;
  }
  const classLine = Object.entries(byClass)
    .map(([k, b]) => `${esc(k)} ${b.wins}/${b.runs}`)
    .join('  ·  ');

  const rows = results
    .map((r) => {
      const outcome = r.victory
        ? '<span class="hx-win">RUNE RESTORED</span>'
        : '<span class="hx-loss">YOU PERISHED</span>';
      const reached = r.victory
        ? `Act ${r.act || 3} cleared`
        : `Act ${r.act || 1} · Floor ${r.floor != null ? r.floor : '—'}`;
      const tag = r.custom
        ? `<span class="hx-custom" title="Custom Climb — excluded from win rate">CUSTOM${r.ascension ? ` A${r.ascension}` : ''}</span>`
        : '';
      return `<tr>
        <td>${outcome}</td>
        <td>${esc(r.className || r.class || '—')}${tag}</td>
        <td>${reached}</td>
        <td class="hx-num">${r.fightsWon != null ? r.fightsWon : '—'}</td>
        <td class="hx-seed">${esc(r.seed || '')}</td>
      </tr>`;
    })
    .join('');

  const customNote = customCount ? ` · ${customCount} CUSTOM (not counted)` : '';
  const body = results.length
    ? `<p class="subtitle">${total} STANDARD RUN${total === 1 ? '' : 'S'} · ${wins} WON · ${pct}% WIN RATE${customNote}</p>
       <p class="hx-byclass">${classLine}</p>
       <div class="hx-wrap">
         <table class="hx-table">
           <thead><tr><th>Outcome</th><th>Class</th><th>Reached</th><th>Fights</th><th>Seed</th></tr></thead>
           <tbody>${rows}</tbody>
         </table>
       </div>`
    : `<p class="subtitle" style="margin-top:24px">NO RUNS RECORDED YET</p>
       <p style="color:var(--muted);font-size:12px">The spire remembers those who climb it.</p>`;

  app.innerHTML = `
    <div class="screen" style="justify-content:flex-start;gap:14px;padding-top:44px">
      <h1 class="title-big" style="font-size:32px">RUN HISTORY</h1>
      ${body}
      <button id="hx-back">BACK</button>
    </div>`;

  app.querySelector('#hx-back').addEventListener('click', onBack);
}


Object.assign(module.exports, { mountHistory });

},
"src/ui/components/intro.js": function (module, exports, require) {
// src/ui/components/intro.js — boss-intro title card (SPEC §7.4 feel).
//
// A full-screen name splash when a boss fight begins: act tag, the boss's name
// in the display serif with a gold glow, a thin rule. Auto-dismisses after a
// beat; any click or key skips it. Reduced-motion collapses the animation (the
// global kill) but the card still reads. `hold` freezes it mid-animation for
// screenshots (?shot=boss).

const { esc } = require("src/ui/components/tooltip.js");

function showBossIntro({ name, act }, { hold = false } = {}) {
  const veil = document.createElement('div');
  veil.className = 'boss-intro';
  veil.innerHTML = `
    <div class="bi-stack">
      <div class="bi-tag">ACT ${Number(act) || 1} · BOSS</div>
      <h1 class="bi-name">${esc(String(name || 'THE UNNAMED').toUpperCase())}</h1>
      <div class="bi-rule"></div>
    </div>`;
  document.body.appendChild(veil);

  if (hold) {
    // Screenshot mode: jump mid-animation and freeze.
    veil.querySelectorAll('*').forEach((el) => {
      el.style.animationDelay = '-600ms';
      el.style.animationPlayState = 'paused';
    });

  }

  timer = setTimeout(close, 2300);
  veil.addEventListener('pointerdown', close);
  addEventListener('keydown', onKey, true);
  return veil;
}


Object.assign(module.exports, { showBossIntro });
