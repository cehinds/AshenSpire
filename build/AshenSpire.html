"src/ui/screens/map.js": function (module, exports, require) {
// src/ui/screens/map.js — the act map (SPEC §7.1, mockup: map-screen.svg)
//
// Full act visible; only edge-connected nodes from the current position are
// clickable; traveled path in gold. With the Sealstone Key passive, '?'
// nodes render their pre-rolled resolution (dashed ring marks a reveal).

const { passiveFlag } = require("src/model/registries.js");
const { attachTooltip, esc } = require("src/ui/components/tooltip.js");
const { overlayIsOpen } = require("src/ui/components/overlay.js");
const { matchAction, isEngaged, focusFirst } = require("src/ui/input.js");
const { hintBarHtml } = require("src/ui/components/hints.js");
const { classGlyph, tintCss } = require("src/ui/assets.js");
const { nodeIcon, nodeBlurb, actTitle } = require("src/ui/uiContent.js");

const COL_X = 95;
const ROW_H = 46;

// Map zoom levels (%) selectable in-view and defaulted from settings.
const ZOOM_STEPS = [1, 1.15, 1.3, 1.5, 1.75, 2];
function defaultZoom(meta) {
  const pct = Number(((meta && meta.settings) || {}).mapZoom);
  const z = pct ? pct / 100 : 1.15;
  // Snap to the nearest step so +/- stays on the ladder.
  return ZOOM_STEPS.reduce((a, b) => (Math.abs(b - z) < Math.abs(a - z) ? b : a), 1.15);
}

function mountMap(app, { registries, run, meta, onPick, onSave, onSettings, onMenu }) {
  const map = run.mapGraph;
  const nodes = Object.values(map.nodes);
  const maxFloor = Math.max(...nodes.map((n) => n.floor));
  const width = 7 * COL_X + 60;
  const height = (maxFloor + 1) * ROW_H + 30;
  const x = (col) => 60 + col * COL_X;
  const y = (floor) => height - floor * ROW_H;
  let zoom = defaultZoom(meta);

  const reachable = new Set(run.mapNodeId ? map.nodes[run.mapNodeId].next : map.startIds);
  const traveled = new Set(run.path || []);
  const reveal = passiveFlag(registries, run.relics, 'revealUnknown');

  // ---- edges (a traveled edge = consecutive pair in run.path) ----
  let edgeSvg = '';
  const path = run.path || [];
  for (const n of nodes) {
    for (const toId of n.next) {
      const to = map.nodes[toId];
      const ia = path.indexOf(n.id);
      const isTraveled = ia >= 0 && path[ia + 1] === toId;
      edgeSvg += `<line class="map-edge${isTraveled ? ' traveled' : ''}" x1="${x(n.col)}" y1="${y(n.floor)}" x2="${x(to.col)}" y2="${y(to.floor)}"/>`;
    }
  }

  const cz = run.customization || {};
  const hpPct = Math.max(0, Math.min(100, Math.round((run.hp / Math.max(1, run.maxHp)) * 100)));
  const className = registries.classes.get(run.class).name;
  const heroName = (cz.name || className).toUpperCase();
  const hasRelics = run.relics.length > 0;
  const hasFlasks = run.flasks.length > 0;

  app.innerHTML = `
    <div class="mapscreen">
      <header class="topbar map-header">
        <div class="portrait" style="border-color:${tintCss(cz.tint)}">${esc(cz.glyph || classGlyph(run.class))}</div>
        <div class="who">
          <span class="nm">${esc(heroName)} · ${esc(className.toUpperCase())}</span>
          <div class="bar hpbar"><div class="fill" style="width:${hpPct}%"></div><div class="label">HP ${run.hp} / ${run.maxHp}</div></div>
        </div>
        <span class="mh-stat cinders">⛁ ${run.cinders}</span>
        <span class="mh-stat mh-prog">${run.actNumber > 3 ? `Act ${run.actNumber}` : `Act ${run.actNumber} / 3`} · Floor ${run.floor} / ${map.floors}</span>
        <span class="mh-stat mh-seed" title="Run seed">SEED ${esc(run.seedString)}</span>
        <div class="mh-actions">
          <button class="topbar-btn" id="map-legend" title="Map legend">?</button>
          <button class="topbar-btn" id="open-menu" title="Menu (M)">☰</button>
        </div>
        <div class="map-legend-pop" hidden>
          <div><span class="ic">⚔</span>Monster</div>
          <div><span class="ic">?</span>Unknown</div>
          <div><span class="ic" style="color:var(--ember)">☠</span>Elite</div>
          <div><span class="ic" style="color:var(--gold)">♨</span>Shrine of Emberlight</div>
          <div><span class="ic" style="color:var(--grace)">⚖</span>Merchant</div>
          <div><span class="ic" style="color:var(--gold)">▣</span>Treasure</div>
        </div>
      </header>
      <div class="map-substrip${hasFlasks ? '' : ' no-flasks'}"${hasRelics || hasFlasks ? '' : ' hidden'}>
        <div class="mh-flasks"></div>
        ${hasFlasks && hasRelics ? '<span class="mh-div"></span>' : ''}
        <div class="relics mh-relics"></div>
      </div>
      <div class="map-scroll">
        <div class="map-canvas">
          <svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
            <text x="${width / 2}" y="24" text-anchor="middle" fill="var(--gold)" font-size="17" letter-spacing="4" font-family="Georgia,serif">${actTitle(run.actNumber)}</text>
            ${edgeSvg}
            <g id="map-nodes"></g>
          </svg>
        </div>
        <div class="map-zoom">
          <button class="zbtn" id="zoom-out" title="Zoom out">−</button>
          <button class="zbtn" id="zoom-reset" title="Reset / center">⊙</button>
          <button class="zbtn" id="zoom-in" title="Zoom in">+</button>
        </div>
      </div>
      ${hintBarHtml('map')}
    </div>`;

  const g = app.querySelector('#map-nodes');
  for (const n of nodes) {
    const isReachable = reachable.has(n.id);
    let shownType = n.type;
    let revealed = false;
    if (n.type === 'event' && reveal && n.resolved) {
      shownType = n.resolved.kind === 'event' ? 'event' : n.resolved.kind;
      revealed = n.resolved.kind !== 'event';
    }
    const cls = [
      'map-node',
      shownType,
      traveled.has(n.id) || n.id === run.mapNodeId ? 'visited' : '',
      n.id === run.mapNodeId ? 'current' : '',
      isReachable ? 'reachable' : '',
      revealed ? 'revealed' : '',
    ].filter(Boolean).join(' ');
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    el.setAttribute('class', cls);
    const r = n.type === 'boss' ? 20 : 15;
    // Reachable nodes get a rhythmic pulsing halo so the next choices read at
    // a glance; the halo is inert when reduced-motion is set (CSS handles it).
    const halo = isReachable ? `<circle class="node-halo" cx="${x(n.col)}" cy="${y(n.floor)}" r="${r + 6}"/>` : '';
    el.innerHTML = `${halo}<circle cx="${x(n.col)}" cy="${y(n.floor)}" r="${r}"/><text x="${x(n.col)}" y="${y(n.floor)}">${nodeIcon(shownType)}</text>`;
    if (isReachable) el.addEventListener('click', () => onPick(n.id));
    attachTooltip(el, () => nodeTooltip(shownType, n, revealed));
    g.appendChild(el);
  }

  const strip = app.querySelector('.mh-relics');
  for (const rid of run.relics) {
    const def = registries.relics.get(rid);
    const el = document.createElement('div');
    el.className = 'relic';
    el.textContent = def.icon || '◆';
    attachTooltip(el, () => `<div class="tt-title">${esc(def.name)}</div>${esc(def.textTemplate.replace(/[{}]/g, ''))}`);
    strip.appendChild(el);
  }

  const flaskWrap = app.querySelector('.mh-flasks');
  for (const f of run.flasks) {
    const def = registries.flasks.get(f.flaskId);
    const el = document.createElement('span');
    el.className = 'mh-flask';
    el.textContent = def.icon || '🧪';
    attachTooltip(el, () => `<div class="tt-title">${esc(def.name)}</div>${esc(def.textTemplate || '')}`);
    flaskWrap.appendChild(el);
  }

  if (onMenu) app.querySelector('#open-menu').addEventListener('click', () => onMenu('deck'));

  // Legend "?" popover: opens on click; a one-shot outside-click listener closes
  // it (added only while open, so it never leaks across screens).
  const legendBtn = app.querySelector('#map-legend');
  const legendPop = app.querySelector('.map-legend-pop');
  legendBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const opening = legendPop.hidden;
    legendPop.hidden = !opening;
    if (opening) {
      const off = (ev) => {
        if (ev.target !== legendBtn && !legendPop.contains(ev.target)) {
          legendPop.hidden = true;
          document.removeEventListener('click', off, true);
        }
      };
      document.addEventListener('click', off, true);
    }
  });

  // ---- zoom + centering (SPEC §7.1 map UX) ----
  const scroll = app.querySelector('.map-scroll');
  const svgEl = app.querySelector('.map-scroll svg');

  // The svg scales by setting its pixel width/height (viewBox unchanged), so
  // the scroll container grows and native scrollbars appear.
  function applyZoom(center) {
    svgEl.style.width = `${width * zoom}px`;
    svgEl.style.height = `${height * zoom}px`;
    if (center) centerOnCurrent();
  }

  // Scroll so the current node sits in the middle of the viewport. At run
  // start there is no current node yet, so frame the reachable start nodes
  // (their centroid) — the requested default framing.
  function centerOnCurrent() {
    let fx;
    let fy;
    if (run.mapNodeId && map.nodes[run.mapNodeId]) {
      const f = map.nodes[run.mapNodeId];
      fx = x(f.col);
      fy = y(f.floor);
    } else {
      const rs = nodes.filter((n) => reachable.has(n.id));
      if (!rs.length) return;
      fx = rs.reduce((a, n) => a + x(n.col), 0) / rs.length;
      fy = rs.reduce((a, n) => a + y(n.floor), 0) / rs.length;
    }
    scroll.scrollTop = Math.max(0, fy * zoom - scroll.clientHeight / 2);
    scroll.scrollLeft = Math.max(0, fx * zoom - scroll.clientWidth / 2);
  }

  function setZoom(next, keepCenter = true) {
    zoom = Math.min(ZOOM_STEPS[ZOOM_STEPS.length - 1], Math.max(ZOOM_STEPS[0], next));
    applyZoom(keepCenter);
  }
  const stepZoom = (dir) => {
    const i = ZOOM_STEPS.findIndex((z) => Math.abs(z - zoom) < 0.001);
    const ni = Math.min(ZOOM_STEPS.length - 1, Math.max(0, (i < 0 ? 1 : i) + dir));
    setZoom(ZOOM_STEPS[ni]);
  };
  app.querySelector('#zoom-in').addEventListener('click', () => stepZoom(1));
  app.querySelector('#zoom-out').addEventListener('click', () => stepZoom(-1));
  app.querySelector('#zoom-reset').addEventListener('click', () => centerOnCurrent());

  // Ctrl/⌘ + wheel zooms toward the pointer-ish center; plain wheel scrolls.
  scroll.addEventListener(
    'wheel',
    (ev) => {
      if (!(ev.ctrlKey || ev.metaKey)) return;
      ev.preventDefault();
      stepZoom(ev.deltaY < 0 ? 1 : -1);
    },
    { passive: false }
  );

  // Drag-to-pan (in addition to scrollbars).
  let panning = false;
  let sx = 0;
  let sy = 0;
  let sl = 0;
  let st = 0;
  scroll.addEventListener('pointerdown', (ev) => {
    if (ev.target.closest('.map-node.reachable') || ev.target.closest('.map-zoom')) return;
    panning = true;
    sx = ev.clientX;
    sy = ev.clientY;
    sl = scroll.scrollLeft;
    st = scroll.scrollTop;
    scroll.classList.add('grabbing');
  });
  addEventListener('pointermove', (ev) => {
    if (!panning) return;
    scroll.scrollLeft = sl - (ev.clientX - sx);
    scroll.scrollTop = st - (ev.clientY - sy);
  });
  addEventListener('pointerup', () => {
    panning = false;
    scroll.classList.remove('grabbing');
  });

  // Keyboard: M opens the menu overlay; + / − / 0 zoom; the overlay owns Esc
  // while open. Removed when the screen is torn down (app.innerHTML replaced).
  const mapKeys = (ev) => {
    if (!app.querySelector('.mapscreen')) {
      removeEventListener('keydown', mapKeys);
      return;
    }
    if (overlayIsOpen()) return;
    const tag = (ev.target && ev.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (matchAction(ev, 'menu') || matchAction(ev, 'deck')) {
      if (onMenu) onMenu('deck');
    } else if (matchAction(ev, 'relics')) {
      if (onMenu) onMenu('relics');
    } else if (matchAction(ev, 'stats')) {
      if (onMenu) onMenu('stats');
    } else if (ev.key === '+' || ev.key === '=') {
      stepZoom(1);
    } else if (ev.key === '-' || ev.key === '_') {
      stepZoom(-1);
    } else if (ev.key === '0') {
      centerOnCurrent();
    }
  };
  addEventListener('keydown', mapKeys);

  applyZoom(false);
  // Auto-center the camera on the current node. The flex container may report
  // height 0 until layout settles (the header/sub-strip above it size first), so
  // center on the first non-zero size via a ResizeObserver, with a timeout
  // backstop. Smart default: land the cursor on a reachable next node (only once
  // the player is using keyboard/gamepad, so mouse players get no stray ring).
  function centerAndFocus() {
    centerOnCurrent();
    if (isEngaged()) focusFirst('.map-node.reachable');
  }
  if (scroll.clientHeight > 0) {
    centerAndFocus();
  } else if (typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(() => {
      if (scroll.clientHeight > 0) {
        centerAndFocus();
        ro.disconnect();
      }
    });
    ro.observe(scroll);
  }
  // Backstop in case the observer never fires (e.g. instant layout): re-center
  // shortly after mount. Cheap and idempotent.
  setTimeout(centerAndFocus, 120);
}

function nodeTooltip(type, node, revealed) {
  let t = `<div class="tt-title">Floor ${node.floor}</div>${nodeBlurb(type)}`;
  if (revealed) t += '<br><i>Revealed by the Sealstone Key.</i>';
  return t;
}


Object.assign(module.exports, { mountMap });

},
"src/ui/components/overlay.js": function (module, exports, require) {
// src/ui/components/overlay.js — the in-run tabbed overlay menu (SPEC §7.2).
//
// One overlay hosts every in-run menu as a tab: Deck, Relics & Flasks, Stats
// (run telemetry), and Settings. Opened from a button or hotkey on the map and
// in combat; combat is turn-based, so it needs no real "pause". Esc / the ✕ /
// clicking the veil closes it.

const { renderCard } = require("src/ui/components/card.js");
const { renderSettings } = require("src/ui/screens/settings.js");
const { renderControls } = require("src/ui/screens/controls.js");
const { attachTooltip, esc } = require("src/ui/components/tooltip.js");
const { isEngaged, focusFirst } = require("src/ui/input.js");

let openVeil = null;
let escHandler = null;

/** True if the overlay is currently open (so callers can route Esc/hotkeys). */
function overlayIsOpen() {
  return !!openVeil;
}

function closeOverlay() {
  if (openVeil) {
    openVeil.remove();
    openVeil = null;
  }
  if (escHandler) {
    removeEventListener('keydown', escHandler, true);
    escHandler = null;
  }
}

/**
 * openOverlay({ registries, run, meta, onSettingsChange, onSave, initialTab })
 * onSave (optional) → returns the slot number saved to (adds a Save action).
 */
function openOverlay({ registries, run, meta, onSettingsChange, onSave, onQuit, onExit, initialTab = 'deck' }) {
  closeOverlay();
  const settings = meta.settings || (meta.settings = {});

  const hasSave = !!(onSave || onQuit || onExit);
  const TABS = [
    { id: 'deck', label: `Deck (${run.deck.length})` },
    { id: 'relics', label: 'Relics & Flasks' },
    { id: 'stats', label: 'Stats' },
    ...(hasSave ? [{ id: 'save', label: 'Save' }] : []),
    { id: 'settings', label: 'Settings' },
    { id: 'controls', label: 'Controls' },
  ];

  const veil = document.createElement('div');
  veil.className = 'modal-veil';
  veil.innerHTML = `
    <div class="modal overlay-modal">
      <div class="overlay-head">
        <div class="overlay-tabs">
          ${TABS.map((t) => `<button class="ov-tab" data-tab="${t.id}">${t.label}</button>`).join('')}
        </div>
        <div class="overlay-actions">
          <button class="subtle" id="ov-close" title="Close (Esc)">✕</button>
        </div>
      </div>
      <div class="overlay-body"></div>
    </div>`;
  document.body.appendChild(veil);
  openVeil = veil;

  const body = veil.querySelector('.overlay-body');

  function selectTab(id) {
    veil.querySelectorAll('.ov-tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === id));
    body.innerHTML = '';
    if (id === 'deck') renderDeck(body);
    else if (id === 'relics') renderRelics(body);
    else if (id === 'stats') renderStats(body);
    else if (id === 'save') renderSave(body);
    else if (id === 'settings') renderSettings(body, { settings, onChange: onSettingsChange || (() => {}) });
    else if (id === 'controls') renderControls(body, { settings, onChange: onSettingsChange || (() => {}) });
  }

  function renderDeck(container) {
    const grid = document.createElement('div');
    grid.className = 'grid';
    if (!run.deck.length) {
      grid.innerHTML = '<div style="color:var(--muted);padding:20px">Empty.</div>';
    } else {
      for (const inst of run.deck) grid.appendChild(renderCard(registries, inst, { small: true }));
    }
    container.appendChild(grid);
  }

  function renderRelics(container) {
    const wrap = document.createElement('div');
    wrap.className = 'ov-relics';
    const rTitle = document.createElement('h3');
    rTitle.className = 'set-cat';
    rTitle.textContent = `Relics (${run.relics.length})`;
    wrap.appendChild(rTitle);
    const rGrid = document.createElement('div');
    rGrid.className = 'ov-relic-grid';
    for (const rid of run.relics) {
      const def = registries.relics.get(rid);
      const el = document.createElement('div');
      el.className = 'ov-relic';
      el.innerHTML = `<span class="ov-relic-ic">${esc(def.icon || '◆')}</span><div><b>${esc(def.name)}</b><p>${esc((def.textTemplate || '').replace(/[{}]/g, ''))}</p></div>`;
      rGrid.appendChild(el);
    }
    if (!run.relics.length) rGrid.innerHTML = '<div style="color:var(--muted)">None yet.</div>';
    wrap.appendChild(rGrid);

    const fTitle = document.createElement('h3');
    fTitle.className = 'set-cat';
    fTitle.textContent = `Flasks (${run.flasks.length})`;
    wrap.appendChild(fTitle);
    const fGrid = document.createElement('div');
    fGrid.className = 'ov-relic-grid';
    for (const f of run.flasks) {
      const def = registries.flasks.get(f.flaskId);
      const el = document.createElement('div');
      el.className = 'ov-relic';
      el.innerHTML = `<span class="ov-relic-ic">${esc(def.icon || '🧪')}</span><div><b>${esc(def.name)}</b><p>${esc(def.textTemplate || '')}</p></div>`;
      fGrid.appendChild(el);
    }
    if (!run.flasks.length) fGrid.innerHTML = '<div style="color:var(--muted)">None.</div>';
    wrap.appendChild(fGrid);
    container.appendChild(wrap);
  }

  // Save tab: save to the current slot, save-and-quit to title, or quit the app.
  // (In-run slot switching is intentionally left to the title's Continue.)
  function renderSave(container) {
    const wrap = document.createElement('div');
    wrap.className = 'ov-save-tab';
    wrap.innerHTML = `
      <h3 class="set-cat">Save</h3>
      <p class="set-note" style="max-width:420px">Your climb is written to its save slot. You can resume it later from the title screen's Continue.</p>
      <div class="ov-save-actions">
        ${onSave ? '<button class="subtle" id="ovs-save">Save now</button>' : ''}
        ${onQuit ? '<button class="subtle" id="ovs-quit">Save &amp; Quit to Title</button>' : ''}
        ${onExit ? '<button class="subtle danger" id="ovs-exit">Quit Game</button>' : ''}
      </div>`;
    container.appendChild(wrap);
    const s = wrap.querySelector('#ovs-save');
    if (s && onSave) {
      s.addEventListener('click', () => {
        const slot = onSave();
        s.textContent = slot ? `Saved · Slot ${slot}` : 'Saved';
        setTimeout(() => (s.textContent = 'Save now'), 1500);
      });
    }
    const q = wrap.querySelector('#ovs-quit');
    if (q && onQuit) q.addEventListener('click', () => { closeOverlay(); onQuit(); });
    const e = wrap.querySelector('#ovs-exit');
    if (e && onExit) e.addEventListener('click', () => { closeOverlay(); onExit(); });
  }

  function renderStats(container) {
    const s = run.stats || {};
    const cls = registries.classes.get(run.class);
    const rows = [
      ['Forsaken', (run.customization && run.customization.name) || cls.name],
      ['Class', cls.name],
      ['Seed', run.seedString],
      ['Act', run.actNumber > 3 ? `${run.actNumber} (endless)` : `${run.actNumber} / 3`],
      ['Floor', run.floor],
      ['HP', `${run.hp} / ${run.maxHp}`],
      ['Cinders', run.cinders],
      ['Fights won', s.fightsWon || 0],
      ['Damage dealt', s.damageDealt || 0],
      ['Damage taken', s.damageTaken || 0],
      ['Deck size', run.deck.length],
      ['Relics', run.relics.length],
    ];
    const el = document.createElement('div');
    el.className = 'ov-stats';
    el.innerHTML = rows
      .map(([k, v]) => `<div class="ov-stat"><span>${esc(String(k))}</span><b>${esc(String(v))}</b></div>`)
      .join('');
    container.appendChild(el);
  }

  veil.querySelectorAll('.ov-tab').forEach((b) => b.addEventListener('click', () => selectTab(b.dataset.tab)));
  veil.querySelector('#ov-close').addEventListener('click', closeOverlay);
  veil.addEventListener('click', (e) => {
    if (e.target === veil) closeOverlay();
  });

  // Esc closes the overlay, captured before screen-level key handlers see it.
  escHandler = (ev) => {
    if (ev.key === 'Escape') {
      ev.preventDefault();
      ev.stopPropagation();
      closeOverlay();
    }
  };
  addEventListener('keydown', escHandler, true);

  selectTab(TABS.some((t) => t.id === initialTab) ? initialTab : 'deck');

  // Smart default (keyboard/gamepad): land on the active tab so arrows can move
  // to its content or across tabs, rather than leaving focus nowhere.
  if (isEngaged()) setTimeout(() => focusFirst('.ov-tab.on') || focusFirst('.ov-tab'), 0);

  return veil;
}


Object.assign(module.exports, { overlayIsOpen, closeOverlay, openOverlay });

},
"src/ui/screens/settings.js": function (module, exports, require) {
// src/ui/screens/settings.js — settings controls (SPEC §7)
//
// Rows are declarative and grouped into categories. `renderSettings` builds the
// controls into any container and wires change events, so the same controls
// back both the standalone modal (openSettings) and the in-run overlay's
// Settings tab. Each row declares its default so stored settings stay sparse.
// `onChange({key:value})` lets the orchestrator persist + apply immediately.

const { openDebugLog } = require("src/ui/debuglog.js");
const { AUDIO_DEFAULTS } = require("src/ui/audio.js");
const { balance } = require("src/content/balance.js");

const UI_DEFAULTS = balance.ui;

const ROWS = [
  { cat: 'Display', key: 'useSprites', def: true, label: 'Character sprites',
    note: 'Show a drawn class figure in combat instead of your chosen sigil.' },
  { cat: 'Display', key: 'animSpeed', type: 'choice', def: 'normal',
    choices: ['slow', 'normal', 'fast', 'instant'], label: 'Combat pacing',
    note: 'How deliberately actions play out — one actor at a time, or instant.' },
  { cat: 'Display', key: 'mapZoom', type: 'choice', def: '115',
    choices: ['100', '115', '130', '150'], label: 'Map zoom %',
    note: 'Default zoom when the act map opens. In-map + / − buttons override per view.' },
  { cat: 'Display', key: 'accent', type: 'choice', def: 'gold',
    choices: ['gold', 'crimson', 'frost', 'verdant', 'violet'], label: 'Accent color',
    note: 'Tint the interface — highlights, borders, focus ring, and glow.' },
  { cat: 'Display', key: 'uiScale', type: 'choice', def: 'Auto',
    choices: ['Auto', 'S', 'M', 'L', 'XL'], label: 'UI size',
    note: 'Auto flexes the whole interface with your window; S–XL is a fixed override.' },
  { cat: 'Display', key: 'cardMotif', type: 'choice', def: UI_DEFAULTS.cardMotif,
    choices: UI_DEFAULTS.cardMotifModes, label: 'Card motif',
    note: 'Colour cards by their class. Wash tints the card body; Accent puts your accent on the border and moves rarity to a corner pip; Band adds a class stripe. Off keeps every card the same frame.' },
  { cat: 'Display', key: 'cardMotifStrength', type: 'choice', def: 'normal',
    choices: ['subtle', 'normal', 'strong'], label: 'Motif strength',
    note: 'How strongly the class colour tints a card.' },
  { cat: 'Display', key: 'screenShake', def: true, label: 'Screen shake',
    note: 'Camera kick on heavy hits and staggers. Off keeps combat steady.' },
  { cat: 'Display', key: 'ambient', type: 'choice', def: 'normal',
    choices: ['off', 'low', 'normal', 'high'], label: 'Ambient effects',
    note: 'Drifting embers and the title-screen glow. Off is the calmest.' },
  { cat: 'Display', key: 'controlHints', def: true, label: 'Control hints',
    note: 'Show the bar of keyboard shortcuts along the bottom of the map and combat.' },
  { cat: 'Display', key: 'mapHeaderDensity', type: 'choice', def: 'comfortable',
    choices: ['comfortable', 'compact'], label: 'Map header',
    note: 'Comfortable shows your name and full stats; Compact tightens the bar.' },
  { cat: 'Display', key: 'mapHeaderRelics', def: true, label: 'Relics in map header',
    note: 'Show your relic icons in the map header bar.' },
  { cat: 'Display', key: 'mapHeaderSeed', def: true, label: 'Seed in map header',
    note: 'Show the run seed in the map header bar.' },
  { cat: 'Display', key: 'fullscreen', type: 'action', def: false, label: 'Fullscreen',
    note: 'Fill the screen (also toggles with F11 in most browsers).' },

  { cat: 'Audio', key: 'muteAudio', def: false, label: 'Mute all audio',
    note: 'Silence music and sound effects.' },
  { cat: 'Audio', key: 'musicVolume', type: 'range', def: AUDIO_DEFAULTS.musicVolume, label: 'Music volume',
    note: 'Ambient score for the title, map, and battles. Defaults to 0 (muted) while testing — raise it to hear the score.' },
  { cat: 'Audio', key: 'sfxVolume', type: 'range', def: AUDIO_DEFAULTS.sfxVolume, label: 'Sound effects',
    note: 'Hits, blocks, bleed bursts, UI.' },
  { cat: 'Audio', key: 'musicFolder', type: 'text', def: '', label: 'Music folder',
    placeholder: 'e.g. music/ or https://…',
    note: 'Folder/URL with a manifest.json mapping combat/boss/shop/rest/… to track files. Empty = built-in generated score.' },

  { cat: 'Accessibility', key: 'reducedMotion', def: false, label: 'Reduced motion',
    note: 'Calm ambient effects, drop the map pulse, and shorten animations.' },
  { cat: 'Accessibility', key: 'highContrast', def: false, label: 'High contrast',
    note: 'Brighter text and stronger borders throughout for readability.' },
  { cat: 'Accessibility', key: 'textSize', type: 'choice', def: 'M',
    choices: ['S', 'M', 'L', 'XL'], label: 'Text size',
    note: 'Scale all interface text and sizing together (sets the root size). M is default; L/XL aid readability. Stacks with UI size.' },
  { cat: 'Accessibility', key: 'colorblindSafe', def: false, label: 'Colorblind-friendly',
    note: 'Shift danger/heal/blight/frost colors to a more distinguishable palette.' },
  { cat: 'Accessibility', key: 'reduceFlashes', def: false, label: 'Reduce flashes',
    note: 'Suppress bright impact and proc flashes (photosensitivity). Damage numbers stay.' },
  { cat: 'Accessibility', key: 'readableHeadings', def: false, label: 'Readable headings',
    note: 'Use the plain UI font for titles instead of the decorative serif.' },
  { cat: 'Advanced', key: 'commandLog', type: 'button', btn: 'Open', label: 'Command log',
    note: 'The recent commands and results between the interface and the engine. Copy it into a bug report if the game misbehaves.' },
];

const CATEGORIES = ['Display', 'Audio', 'Accessibility', 'Advanced'];

// Resolve a stored value against its default (defaults keep settings sparse).
function valueOf(settings, row) {
  return row.def ? settings[row.key] !== false : settings[row.key] === true;
}

function rowHtml(settings, r) {
  if (r.type === 'text') {
    const val = typeof settings[r.key] === 'string' ? settings[r.key] : r.def;
    return `<div class="set-row set-row-wide">
        <div><b>${r.label}</b><p class="set-note">${r.note}</p></div>
        <input type="text" class="set-text" spellcheck="false" data-key="${r.key}" value="${(val || '').replace(/"/g, '&quot;')}" placeholder="${r.placeholder || ''}">
      </div>`;
  }
  if (r.type === 'range') {
    const val = typeof settings[r.key] === 'number' ? settings[r.key] : r.def;
    return `<div class="set-row">
        <div><b>${r.label}</b><p class="set-note">${r.note}</p></div>
        <div class="range-wrap">
          <input type="range" class="set-range" min="0" max="100" step="5" value="${val}" data-key="${r.key}">
          <span class="range-val" data-for="${r.key}">${val}</span>
        </div>
      </div>`;
  }
  if (r.type === 'button') {
    return `<div class="set-row">
        <div><b>${r.label}</b><p class="set-note">${r.note}</p></div>
        <button class="subtle" data-btn="${r.key}">${r.btn || 'Open'}</button>
      </div>`;
  }
  if (r.type === 'choice') {
    const cur = r.choices.includes(settings[r.key]) ? settings[r.key] : r.def;
    const opts = r.choices
      .map((c) => `<button class="choice${c === cur ? ' on' : ''}" data-key="${r.key}" data-val="${c}">${c.toUpperCase()}</button>`)
      .join('');
    return `<div class="set-row">
        <div><b>${r.label}</b><p class="set-note">${r.note}</p></div>
        <div class="choice-group">${opts}</div>
      </div>`;
  }
  // 'action' rows (e.g. fullscreen) render as a live toggle reflecting state.
  const on = r.type === 'action' ? isFullscreen() : valueOf(settings, r);
  return `<div class="set-row">
      <div><b>${r.label}</b><p class="set-note">${r.note}</p></div>
      <button class="toggle ${on ? 'on' : ''}" data-key="${r.key}"${r.type === 'action' ? ' data-action="1"' : ''} role="switch" aria-checked="${on}">
        <span class="knob"></span>
      </button>
    </div>`;
}

function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}

function toggleFullscreen() {
  const el = document.documentElement;
  if (isFullscreen()) {
    (document.exitFullscreen || document.webkitExitFullscreen || (() => {})).call(document);
  } else {
    (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
  }
}

/**
 * renderSettings(container, { settings, onChange, grouped })
 * Fills `container` with the settings controls and wires change events.
 * grouped=true adds category headers.
 */
function renderSettings(container, { settings, onChange, grouped = true }) {
  let html = '';
  if (grouped) {
    for (const cat of CATEGORIES) {
      const rows = ROWS.filter((r) => r.cat === cat);
      html += `<h3 class="set-cat">${cat}</h3>` + rows.map((r) => rowHtml(settings, r)).join('');
    }
  } else {
    html = ROWS.map((r) => rowHtml(settings, r)).join('');
  }
  container.innerHTML = html;

  container.querySelectorAll('.set-text').forEach((input) => {
    // Commit on change/blur (not each keystroke) so we don't re-fetch a manifest
    // mid-type.
    const commit = () => {
      settings[input.dataset.key] = input.value.trim();
      onChange({ [input.dataset.key]: input.value.trim() });
    };
    input.addEventListener('change', commit);
    input.addEventListener('blur', commit);
  });

  container.querySelectorAll('.set-range').forEach((slider) => {
    slider.addEventListener('input', () => {
      const val = Number(slider.value);
      const out = container.querySelector(`.range-val[data-for="${slider.dataset.key}"]`);
      if (out) out.textContent = val;
      settings[slider.dataset.key] = val;
      onChange({ [slider.dataset.key]: val });
    });
  });

  container.querySelectorAll('[data-btn="commandLog"]').forEach((btn) => {
    btn.addEventListener('click', openDebugLog);
  });

  container.querySelectorAll('.choice').forEach((btn) => {
    btn.addEventListener('click', () => {
      btn.parentElement.querySelectorAll('.choice').forEach((b) => b.classList.toggle('on', b === btn));
      settings[btn.dataset.key] = btn.dataset.val;
      onChange({ [btn.dataset.key]: btn.dataset.val });
    });
  });

  container.querySelectorAll('.toggle').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (btn.dataset.action) {
        toggleFullscreen();
        // Reflect the new state shortly after the API resolves.
        setTimeout(() => {
          const on = isFullscreen();
          btn.classList.toggle('on', on);
          btn.setAttribute('aria-checked', String(on));
        }, 60);
        return;
      }
      const now = !btn.classList.contains('on');
      btn.classList.toggle('on', now);
      btn.setAttribute('aria-checked', String(now));
      settings[btn.dataset.key] = now;
      onChange({ [btn.dataset.key]: now });
    });
  });
}

function openSettings({ meta, onChange }) {
  const settings = meta.settings || (meta.settings = {});
  const veil = document.createElement('div');
  veil.className = 'modal-veil';
  veil.innerHTML = `
    <div class="modal settings-modal">
      <h2>Settings</h2>
      <div class="set-body"></div>
      <div class="set-actions"><button id="set-close">Done</button></div>
    </div>`;
  document.body.appendChild(veil);
  renderSettings(veil.querySelector('.set-body'), { settings, onChange });

  const close = () => veil.remove();
  veil.addEventListener('click', (e) => {
    if (e.target === veil) close();
  });
  veil.querySelector('#set-close').addEventListener('click', close);
}


Object.assign(module.exports, { renderSettings, openSettings });

},
"src/ui/debuglog.js": function (module, exports, require) {
// src/ui/debuglog.js — in-game command log (Settings → Advanced → Command log).
//
// A ring buffer of everything the UI asks the engine to do and everything that
// comes back: dispatches, rejections, ignored inputs, timeline lifecycle, and
// uncaught page errors. Exists so a stuck game can be diagnosed from inside the
// game — open the log, read the last commands, copy them into a bug report.

const MAX_ENTRIES = 300;
const entries = [];

/** Append one entry: dlog('dispatch', 'playCard strike_3 -> e1', {events: 12}) */
function dlog(kind, msg, data) {
  let detail = '';
  if (data !== undefined) {
    try {
      detail = typeof data === 'string' ? data : JSON.stringify(data);
    } catch (e) {
      detail = String(data);
    }
  }
  entries.push({ time: new Date(), kind, msg, detail });
  if (entries.length > MAX_ENTRIES) entries.splice(0, entries.length - MAX_ENTRIES);
}

function getEntries() {
  return entries;
}

// Uncaught errors are invisible in most consoles players look at — capture them
// into the log so "it just stopped working" becomes a stack trace.
if (typeof window !== 'undefined') {
  window.addEventListener('error', (ev) => {
    dlog('ERROR', String(ev.message || 'uncaught error'), ev.error && ev.error.stack ? String(ev.error.stack).split('\n').slice(0, 4).join(' | ') : '');
  });
  window.addEventListener('unhandledrejection', (ev) => {
    dlog('ERROR', 'unhandled promise rejection', String((ev.reason && ev.reason.stack) || ev.reason).slice(0, 300));
  });
}

function formatEntry(e) {
  const hh = String(e.time.getHours()).padStart(2, '0');
  const mm = String(e.time.getMinutes()).padStart(2, '0');
  const ss = String(e.time.getSeconds()).padStart(2, '0');
  return `${hh}:${mm}:${ss} [${e.kind}] ${e.msg}${e.detail ? ' :: ' + e.detail : ''}`;
}

/** The whole log as copyable text (plus live engine/fx state header). */
function logText() {
  const fx = typeof window !== 'undefined' && window.__fx ? JSON.stringify(window.__fx) : 'n/a';
  const c = typeof window !== 'undefined' ? window.__combat : null;
  const state = c ? `phase=${c.phase} result=${c.result} hand=${c.piles.hand.length} energy=${c.player.energy}` : 'no combat';
  const head = `AshenSpire command log — ${new Date().toISOString()}\nstate: ${state}\ntimelines: ${fx}\n---`;
  return [head, ...entries.map(formatEntry)].join('\n');
}

/** Open the log viewer modal (usable over the in-run overlay). */
function openDebugLog() {
  const veil = document.createElement('div');
  veil.className = 'modal-veil';
  veil.style.zIndex = '700'; // above the in-run overlay
  veil.innerHTML = `
    <div class="modal debug-modal">
      <h2>COMMAND LOG</h2>
      <p class="set-note">The last ${MAX_ENTRIES} commands and results between the interface and the engine, newest at the bottom. Copy this into a bug report if the game misbehaves.</p>
      <pre class="debug-log-body"></pre>
      <div class="set-actions" style="gap:8px">
        <button class="subtle" id="dbg-copy">Copy</button>
        <button class="subtle" id="dbg-refresh">Refresh</button>
        <button id="dbg-close">Close</button>
      </div>
    </div>`;
  document.body.appendChild(veil);

  const body = veil.querySelector('.debug-log-body');
  const fill = () => {
    body.textContent = logText();
    body.scrollTop = body.scrollHeight;
  };
  fill();

  veil.querySelector('#dbg-refresh').addEventListener('click', fill);
  veil.querySelector('#dbg-copy').addEventListener('click', async () => {
    const btn = veil.querySelector('#dbg-copy');
    try {
      await navigator.clipboard.writeText(logText());
      btn.textContent = 'Copied';
    } catch (e) {
      // Clipboard blocked (e.g. file://): select the text for manual copy.
      const range = document.createRange();
      range.selectNodeContents(body);
      const sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      btn.textContent = 'Select+Ctrl C';
    }
    setTimeout(() => (btn.textContent = 'Copy'), 1500);
  });
  const close = () => veil.remove();
  veil.querySelector('#dbg-close').addEventListener('click', close);
  veil.addEventListener('click', (e) => {
    if (e.target === veil) close();
  });
}


Object.assign(module.exports, { dlog, getEntries, logText, openDebugLog });

},
"src/ui/audio.js": function (module, exports, require) {
// src/ui/audio.js — procedural WebAudio engine (SPEC §7.4 audio).
//
// Hybrid design (per product decision): every sound and music bed is SYNTHESIZED
// in code today (zero assets, zero licensing), but each id also has a slot in a
// manifest so a real .ogg/.mp3 can replace it later with no call-site change —
// if `MANIFEST[id]` names a URL that loads, the sample plays instead of the synth.
//
// Wiring: `initAudio()` returns an engine; main.js sets `sfx.sink = engine.sfx`
// and calls `engine.music(context)` as screens mount. The AudioContext starts
// suspended (autoplay policy) and resumes on the first user gesture.

const { balance } = require("src/content/balance.js");
const { SFX_MANIFEST, MUSIC_MANIFEST, SCALES, BEDS } = require("src/content/music.js");

// Default levels for a profile that has never touched the sliders — one source,
// shared with ui/screens/settings.js.
const AUDIO_DEFAULTS = balance.ui.audio;

// Contexts that can be backed by external audio files. A manifest maps each to
// a list of file paths (see configureMusic); missing/failed loads fall back to
// the procedural bed above.
const MUSIC_CONTEXTS = Object.keys(BEDS);

function initAudio(settings = {}) {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return silentEngine();

  const ctx = new Ctx();
  const master = ctx.createGain();
  const musicBus = ctx.createGain();
  const sfxBus = ctx.createGain();
  musicBus.connect(master);
  sfxBus.connect(master);
  master.connect(ctx.destination);

  const state = {
    // Defaults are data (content/balance.js → ui.audio), shared with the
    // settings sliders. They used to live in two files and could silently
    // disagree: this fallback is what an unset setting actually resolves to
    // (settings are stored sparse), while the row `def` only drew the slider.
    musicVol: clampVol(settings.musicVolume, AUDIO_DEFAULTS.musicVolume),
    sfxVol: clampVol(settings.sfxVolume, AUDIO_DEFAULTS.sfxVolume),
    muted: settings.muteAudio === true,
    context: null, // current music bed key
    nodes: [], // live music nodes to tear down on switch
    timer: null,
    pulseTimer: null, // rhythmic low-thump layer (battle beds)
    sampleCache: new Map(),
    folder: '', // external music folder/URL
    tracks: {}, // context → [track urls] from the folder manifest
    mediaEl: null, // currently-playing external <audio>, if any
    mediaSources: new WeakMap(), // <audio> → MediaElementSource (one per element)
  };
  applyGains();

  function applyGains() {
    const m = state.muted ? 0 : 1;
    master.gain.value = 0.9 * m;
    musicBus.gain.value = state.musicVol / 100;
    sfxBus.gain.value = state.sfxVol / 100;
  }

  // The context begins suspended; the first gesture resumes it.
  function resume() {
    if (ctx.state === 'suspended') ctx.resume();
  }
  ['pointerdown', 'keydown'].forEach((ev) =>
    addEventListener(ev, resume, { once: false, capture: true })
  );

  // ---- SFX -----------------------------------------------------------------
  function sfx(id) {
    if (state.muted || state.sfxVol <= 0) return;
    resume();
    if (SFX_MANIFEST[id]) {
      playSample(SFX_MANIFEST[id], sfxBus);
      return;
    }
    synthSfx(id);
  }

  const now = () => ctx.currentTime;

  function tone({ type = 'sine', freq, to, t0 = 0, dur, peak = 0.6, bus = sfxBus }) {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    const start = now() + t0;
    o.frequency.setValueAtTime(freq, start);
    if (to != null) o.frequency.exponentialRampToValueAtTime(Math.max(1, to), start + dur);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(peak, start + Math.min(0.02, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g).connect(bus);
    o.start(start);
    o.stop(start + dur + 0.02);
  }

  function noise({ dur, peak = 0.5, t0 = 0, hp = 400, lp = 6000, bus = sfxBus }) {
    const frames = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, frames, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < frames; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / frames);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const hpF = ctx.createBiquadFilter();
    hpF.type = 'highpass';
    hpF.frequency.value = hp;
    const lpF = ctx.createBiquadFilter();
    lpF.type = 'lowpass';
    lpF.frequency.value = lp;
    const g = ctx.createGain();
    const start = now() + t0;
    g.gain.setValueAtTime(peak, start);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    src.connect(hpF).connect(lpF).connect(g).connect(bus);
    src.start(start);
    src.stop(start + dur + 0.02);
  }

  // One recipe per feedback hook. Kept short and characterful (dark fantasy).
  function synthSfx(id) {
    switch (id) {
      case 'cardPlay':
        tone({ type: 'triangle', freq: 520, to: 380, dur: 0.12, peak: 0.35 });
        break;
      case 'hit':
        noise({ dur: 0.16, peak: 0.5, hp: 300, lp: 4200 });
        tone({ type: 'square', freq: 150, to: 60, dur: 0.14, peak: 0.35 });
        break;
      case 'block':
        tone({ type: 'sine', freq: 320, to: 520, dur: 0.14, peak: 0.4 });
        noise({ dur: 0.08, peak: 0.2, hp: 2000 });
        break;
      case 'bleedBurst':
        tone({ type: 'sawtooth', freq: 220, to: 70, dur: 0.5, peak: 0.5 });
        noise({ dur: 0.4, peak: 0.35, hp: 200, lp: 2600 });
        break;
      case 'stagger':
        tone({ type: 'square', freq: 90, to: 40, dur: 0.35, peak: 0.5 });
        noise({ dur: 0.22, peak: 0.4, hp: 120, lp: 1800 });
        break;
      case 'enemyDeath':
        tone({ type: 'sawtooth', freq: 240, to: 30, dur: 0.6, peak: 0.45 });
        break;
      case 'heal':
        tone({ type: 'sine', freq: 480, to: 720, dur: 0.4, peak: 0.35 });
        tone({ type: 'sine', freq: 720, to: 960, dur: 0.4, peak: 0.2, t0: 0.06 });
        break;
      case 'stance':
        tone({ type: 'triangle', freq: 300, to: 600, dur: 0.3, peak: 0.4 });
        break;
      case 'relic':
        tone({ type: 'sine', freq: 880, to: 1320, dur: 0.25, peak: 0.3 });
        break;
      case 'flask':
        tone({ type: 'sine', freq: 640, to: 400, dur: 0.18, peak: 0.3 });
        break;
      case 'shrine':
        tone({ type: 'sine', freq: 392, to: 588, dur: 0.6, peak: 0.3 });
        break;
      case 'buy':
        tone({ type: 'triangle', freq: 700, to: 1050, dur: 0.16, peak: 0.35 });
        break;
      case 'nodeTravel':
        tone({ type: 'triangle', freq: 300, to: 460, dur: 0.14, peak: 0.3 });
        break;
      case 'uiClick':
        tone({ type: 'square', freq: 420, to: 420, dur: 0.04, peak: 0.18 });
        break;
      case 'victory':
        [392, 494, 587, 784].forEach((f, i) => tone({ type: 'triangle', freq: f, dur: 0.5, peak: 0.32, t0: i * 0.12 }));
        break;
      case 'youDied':
        tone({ type: 'sawtooth', freq: 160, to: 40, dur: 1.2, peak: 0.5 });
        break;
      default:
        tone({ type: 'sine', freq: 440, to: 440, dur: 0.05, peak: 0.15 });
    }
  }

  // ---- Music ---------------------------------------------------------------
  function stopMusic(fade = 0.6) {
    if (state.timer) {
      clearInterval(state.timer);
      state.timer = null;
    }
    if (state.pulseTimer) {
      clearInterval(state.pulseTimer);
      state.pulseTimer = null;
    }
    // Stop an external track if one is playing.
    if (state.mediaEl) {
      const el = state.mediaEl;
      state.mediaEl = null;
      try {
        el.onended = null;
        el.onerror = null;
        el.pause();
      } catch (e) {
        /* ignore */
      }
    }
    const t = now();
    for (const n of state.nodes) {
      try {
        n.gain.gain.cancelScheduledValues(t);
        n.gain.gain.setValueAtTime(n.gain.gain.value, t);
        n.gain.gain.exponentialRampToValueAtTime(0.0001, t + fade);
        n.osc.stop(t + fade + 0.05);
      } catch (e) {
        /* already stopped */
      }
    }
    state.nodes = [];
  }

  const pickRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];

  function drone(freq, gain) {
    const o = ctx.createOscillator();
    const o2 = ctx.createOscillator();
    const g = ctx.createGain();
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 700;
    o.type = 'sawtooth';
    o2.type = 'sawtooth';
    o.frequency.value = freq;
    o2.frequency.value = freq * 1.005; // slight detune = movement
    g.gain.setValueAtTime(0.0001, now());
    g.gain.exponentialRampToValueAtTime(gain, now() + 1.5);
    // slow filter LFO for an evolving pad
    const lfo = ctx.createOscillator();
    const lfoG = ctx.createGain();
    lfo.frequency.value = 0.07;
    lfoG.gain.value = 260;
    lfo.connect(lfoG).connect(lp.frequency);
    o.connect(lp);
    o2.connect(lp);
    lp.connect(g).connect(musicBus);
    o.start();
    o2.start();
    lfo.start();
    state.nodes.push({ osc: o, gain: g }, { osc: o2, gain: g }, { osc: lfo, gain: g });
  }

  function music(context) {
    if (state.context === context) return;
    state.context = context;
    stopMusic();
    const bed = BEDS[context];
    if (!bed || state.muted) return;
    resume();
    // Prefer an external track for this context if the folder provided any;
    // fall back to a procedural variant on missing/unplayable files.
    const ext = state.tracks[context];
    if (ext && ext.length) {
      playExternal(context, ext);
      return;
    }
    playProcedural(context, bed);
  }

  // Stream a random track from the context's list; when it ends, play another
  // (fresh random pick → variety). Any load/decode error → procedural bed.
  function playExternal(context, urls) {
    const url = pickRandom(urls);
    let el;
    try {
      el = new Audio(url);
      el.crossOrigin = 'anonymous';
      el.preload = 'auto';
      if (!state.mediaSources.has(el)) {
        const src = ctx.createMediaElementSource(el);
        src.connect(musicBus);
        state.mediaSources.set(el, src);
      }
    } catch (e) {
      return playProcedural(context, BEDS[context]);
    }
    el.addEventListener('ended', () => {
      if (state.context === context) playExternal(context, urls);
    });
    el.addEventListener('error', () => {
      if (state.context === context) {
        state.mediaEl = null;
        playProcedural(context, BEDS[context]);
      }
    });
    const p = el.play();
    if (p && p.catch) p.catch(() => {}); // autoplay-block is handled by resume()
    state.mediaEl = el;
  }

  function playProcedural(context, bed) {
    const variant = pickRandom(bed.variants);
    if (bed.drone) drone(variant.root / 2, 0.12 * bed.gain);
    const scale = SCALES[variant.scale];
    const lift = variant.lift || 3;
    let step = 0;
    const playNote = () => {
      const deg = scale[(step * lift + (step % 2 ? 2 : 0)) % scale.length];
      const oct = step % 4 === 0 ? 2 : 1;
      const freq = variant.root * oct * Math.pow(2, deg / 12);
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = variant.wave || 'triangle';
      o.frequency.value = freq;
      const t = now();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16 * bed.gain, t + 0.08);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
      o.connect(g).connect(musicBus);
      o.start(t);
      o.stop(t + 1.9);
      // Every few notes, lay a soft harmony a perfect fifth above — adds body
      // and variety without a second melodic line to manage.
      if (step % 3 === 1) {
        const h = ctx.createOscillator();
        const hg = ctx.createGain();
        h.type = 'sine';
        h.frequency.value = freq * 1.4983; // ~perfect fifth
        hg.gain.setValueAtTime(0.0001, t);
        hg.gain.exponentialRampToValueAtTime(0.07 * bed.gain, t + 0.12);
        hg.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
        h.connect(hg).connect(musicBus);
        h.start(t);
        h.stop(t + 1.7);
      }
      step++;
    };
    playNote();
    state.timer = setInterval(playNote, variant.cadence);

    // Battle beds get a rhythmic low thump — a heartbeat under the melody. It
    // pulses at roughly two beats per melodic note, so tenser (faster-cadence)
    // variants throb harder. Tears down with the rest via state.pulseTimer.
    if (bed.pulse) {
      const thump = () => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        const t = now();
        o.frequency.setValueAtTime(variant.root / 2, t);
        o.frequency.exponentialRampToValueAtTime(variant.root / 3, t + 0.18);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.22 * bed.gain, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
        o.connect(g).connect(musicBus);
        o.start(t);
        o.stop(t + 0.36);
      };
      thump();
      state.pulseTimer = setInterval(thump, Math.max(420, variant.cadence / 2));
    }
  }

  /**
   * configureMusic({ folder }) — point the engine at a folder/URL of music.
   * Fetches `<folder>/manifest.json` mapping context → [file paths], e.g.
   *   { "combat": ["combat/track1.mp3", "combat/track2.mp3"], "boss": [...] }
   * Relative entries resolve against the folder; each context then plays a
   * random track from its list, looping to a fresh pick. No folder / no
   * manifest / unreachable files → the procedural score is used. Re-applied
   * live restarts the current context so a new folder takes effect at once.
   */
  async function configureMusic({ folder } = {}) {
    state.folder = folder || '';
    state.tracks = {};
    if (folder) {
      try {
        const base = String(folder).replace(/\/+$/, '');
        const res = await fetch(`${base}/manifest.json`);
        if (res.ok) {
          const m = await res.json();
          for (const key of MUSIC_CONTEXTS) {
            const list = m[key];
            if (Array.isArray(list) && list.length) {
              state.tracks[key] = list.map((f) => (/^(https?:)?\/\//.test(f) || f.startsWith('/') ? f : `${base}/${f}`));
            }
          }
        }
      } catch (e) {
        state.tracks = {}; // fall back entirely to procedural
      }
    }
    // Re-trigger the current context so the new source is used immediately.
    if (state.context && !state.muted) {
      const c = state.context;
      state.context = null;
      music(c);
    }
  }

  // ---- samples (manifest override path) ------------------------------------
  async function loadSample(url) {
    if (state.sampleCache.has(url)) return state.sampleCache.get(url);
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('missing');
      const buf = await ctx.decodeAudioData(await res.arrayBuffer());
      state.sampleCache.set(url, buf);
      return buf;
    } catch (e) {
      state.sampleCache.set(url, null); // remember the miss; fall back to synth
      return null;
    }
  }
  async function playSample(url, bus) {
    const buf = await loadSample(url);
    if (!buf) return;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(bus);
    src.start();
  }

  // ---- settings applied live ----------------------------------------------
  function setVolumes({ musicVolume, sfxVolume, muteAudio } = {}) {
    if (musicVolume != null) state.musicVol = clampVol(musicVolume, state.musicVol);
    if (sfxVolume != null) state.sfxVol = clampVol(sfxVolume, state.sfxVol);
    if (muteAudio != null) state.muted = !!muteAudio;
    applyGains();
    if (state.muted) stopMusic(0.3);
    else if (state.context) {
      const c = state.context;
      state.context = null;
      music(c);
    }
  }

  return { sfx, music, stopMusic, setVolumes, configureMusic, resume, isReal: true };
}

function clampVol(v, dflt) {
  const n = Number(v);
  if (!isFinite(n)) return dflt;
  return Math.max(0, Math.min(100, n));
}

// No-WebAudio fallback: a no-op engine so callers never branch.
function silentEngine() {
  return { sfx() {}, music() {}, stopMusic() {}, setVolumes() {}, configureMusic() {}, resume() {}, isReal: false };
}


Object.assign(module.exports, { AUDIO_DEFAULTS, initAudio });

},
"src/content/music.js": function (module, exports, require) {
// src/content/music.js — the procedural score, as data (SPEC §3.1(4)).
//
// The synth engine (src/ui/audio.js) knows how to PLAY a bed; what the beds
// are is content. Adding a mood or a new screen's music is a data edit here,
// with no change to the engine — same rule the cards and enemies follow.
//
// Sample manifests sit here too: naming a file for an id makes the engine play
// that sample instead of synthesizing, and a missing/failed load falls back to
// the synth, so this stays safe to point at art that doesn't exist yet.

// A real build can point these at files; missing/failed loads fall back to synth.
const SFX_MANIFEST = {
  // cardPlay: 'assets/sfx/card.ogg',  ← example: drop a file here to override
};
const MUSIC_MANIFEST = {
  // combat: 'assets/music/combat.ogg',
};

// Minor / phrygian-ish scales (semitone offsets from the root) per mood.
const SCALES = {
  calm: [0, 3, 5, 7, 10, 12, 15],

  dread: [0, 2, 3, 7, 8, 10, 12],

// calmer sets; Boss/Elite their own darker ones.
// Each variant may also set `wave` (oscillator timbre) and `lift` (melodic

const BEDS = {

    { root: 123.47, scale: 'dread', cadence: 1300, wave: 'square', lift: 2 },
    { root: 146.83, scale: 'tense', cadence: 1400, wave: 'triangle', lift: 4 },
    { root: 138.59, scale: 'tense', cadence: 1250, wave: 'sawtooth', lift: 3 },
    { root: 130.81, scale: 'veiled', cadence: 1350, wave: 'triangle', lift: 5 },
    { root: 155.56, scale: 'dread', cadence: 1200, wave: 'square', lift: 2 },

  elite: { drone: true, gain: 0.55, pulse: true, variants: [

"src/ui/screens/controls.js": function (module, exports, require) {
// src/ui/screens/controls.js — the Controls tab: rebind each action's keyboard
// key AND gamepad button (SPEC §7.3).
//
// Every rebindable action shows two chips: its keyboard key and its gamepad
// button. Click a "Rebind" to arm it, then press a key / pad button. Bindings
// persist in settings.keyBindings + settings.bindings and apply live via
// onChange({ keyBindings } / { bindings }). Confirm's keyboard key is fixed
// (Enter always activates the cursor); everything else is rebindable.

const { ACTIONS, getBindings, getKeyBindings, keyLabel, captureNextButton, cancelCapture, captureNextKey, cancelKeyCapture } = require("src/ui/input.js");
const { padName } = require("src/ui/uiContent.js");

// Standard-mapping button labels (navigator gamepad "standard" layout).
// Button names come from the shared PAD_BUTTONS table (uiContent.js) — this
// screen shows the readable word, the hint bar shows the compact glyph.
const btnName = padName;

function renderControls(container, { settings, onChange }) {
  const padConnected =
    typeof navigator !== 'undefined' && navigator.getGamepads
      ? Array.from(navigator.getGamepads()).some(Boolean)
      : false;

  container.innerHTML = `
    <h3 class="set-cat">Navigation</h3>
    <p class="set-note" style="max-width:520px">
      Move the focus cursor with the <b>arrow keys</b>, <b>D-pad</b>, or <b>left stick</b>;
      activate with <b>Enter</b> / <b>A</b>. In combat, number keys <b>1–9</b> select cards and targets.
    </p>
    <h3 class="set-cat">Bindings ${padConnected ? '<span class="pad-live">● pad connected</span>' : '<span class="pad-off">(no pad detected)</span>'}</h3>
    <div class="rebind-list"></div>
    <p class="set-note" style="margin-top:10px">Click a <b>Rebind</b>, then press a key or controller button. Arrow keys / D-pad always navigate.</p>`;

  const list = container.querySelector('.rebind-list');
  const bindings = getBindings();
  const keyBindings = getKeyBindings();

  for (const a of ACTIONS) {
    const rebindableKey = !!a.defKey; // Confirm's key (Enter) is fixed
    const row = document.createElement('div');
    row.className = 'set-row rebind-row';
    row.innerHTML = `
      <div><b>${a.label}</b></div>
      <div class="rebind-ctl">
        ${
          rebindableKey
            ? `<span class="pad-btn key-btn" data-keyfor="${a.id}">${keyLabel(a.id)}</span>
               <button class="subtle rebind-btn rebind-key" data-action="${a.id}">Key</button>`
            : `<span class="pad-btn">${a.keyHint || '—'}</span>`
        }
        <span class="pad-btn" data-for="${a.id}">${btnName(bindings[a.id])}</span>
        <button class="subtle rebind-btn rebind-pad" data-action="${a.id}">Pad</button>
      </div>`;
    list.appendChild(row);
  }

  let capturing = null; // the armed <button>, or null
  const reset = (btn, label) => {
    btn.textContent = label;
    btn.classList.remove('listening');
  };

  // Gamepad rebinds.
  list.querySelectorAll('.rebind-pad').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (capturing) {
        cancelCapture();
        cancelKeyCapture();
        reset(capturing, capturing.classList.contains('rebind-key') ? 'Key' : 'Pad');
        if (capturing === btn) {
          capturing = null;
          return;
        }
      }
      capturing = btn;
      btn.textContent = 'Press…';
      btn.classList.add('listening');
      captureNextButton((buttonIndex) => {
        const id = btn.dataset.action;
        const next = { ...getBindings(), [id]: buttonIndex };
        settings.bindings = next;
        onChange({ bindings: next });
        const badge = container.querySelector(`.pad-btn[data-for="${id}"]`);
        if (badge) badge.textContent = btnName(buttonIndex);
        reset(btn, 'Pad');
        capturing = null;
      });
    });
  });

  // Keyboard rebinds.
  list.querySelectorAll('.rebind-key').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (capturing) {
        cancelCapture();
        cancelKeyCapture();
        reset(capturing, capturing.classList.contains('rebind-key') ? 'Key' : 'Pad');
        if (capturing === btn) {
          capturing = null;
          return;
        }
      }
      capturing = btn;
      btn.textContent = 'Press…';
      btn.classList.add('listening');
      captureNextKey((key) => {
        const id = btn.dataset.action;
        const next = { ...getKeyBindings(), [id]: key };
        settings.keyBindings = next;
        onChange({ keyBindings: next });
        const badge = container.querySelector(`.key-btn[data-keyfor="${id}"]`);
        if (badge) badge.textContent = keyLabel(id);
        reset(btn, 'Key');
        capturing = null;
      });
    });
  });
}


Object.assign(module.exports, { renderControls });

},
"src/ui/input.js": function (module, exports, require) {
// src/ui/input.js — unified keyboard + gamepad navigation (SPEC §7.3).
//
// Two layers that make every screen playable without a mouse:
//   1. A focus cursor over interactive elements (buttons, cards, reachable map
//      nodes, tabs, toggles, targetable enemies…). Arrow keys / D-pad / left
//      stick move it spatially; Enter / A activates the focused element.
//   2. A gamepad poller (started only while a pad is connected — no idle loop)

"src/ui/components/hints.js": function (module, exports, require) {
// src/ui/components/hints.js — the contextual control-hint bar (SPEC §7.3).
//
// A thin, unobtrusive strip pinned to the bottom of the map and combat screens
// that lists the currently-bound keys for the dedicated overlay/zone actions, so
// the rebindable D/R/T/M/E keys are discoverable. Labels come from the live
// keyLabel() binding, so they reflect rebinds. The whole bar is hidden by CSS
// when the "Control hints" setting is off (body.hide-hints).

const { keyLabel, padLabel, hasGamepad, actionShort } = require("src/ui/input.js");

// Which action chips each context shows, in reading order — ids only. The
// labels come from the ACTIONS registry (actionShort), so this can't drift from
// the actions it points at and a new action is a one-place edit. All of these
// carry a rebindable keyboard key (keyLabel returns a real key, never '—').
const CHIPS = {
  combat: ['endTurn', 'deck', 'relics', 'stats', 'menu'],
  map: ['deck', 'relics', 'stats', 'menu'],
  // While aiming a card/flask, the combat bar swaps to the two live choices.
  targeting: ['confirm', 'cancel'],
};

// Combat sets 'targeting' while a card/flask is aimed; null restores the
// default chips. The bar rebuilds in place.
let hintMode = null;
function setHintMode(mode) {
  if (mode === hintMode) return;
  hintMode = mode;
  refreshHintBars();
}

// Show controller glyphs when a gamepad is connected, keyboard keys otherwise.
function chipsHtml(context, pad) {
  const set = context === 'combat' && hintMode === 'targeting' ? CHIPS.targeting : CHIPS[context];
  return (set || [])
    .map((id) => {
      const key = pad ? padLabel(id) || keyLabel(id) : keyLabel(id);
      return `<span class="hint"><kbd>${key}</kbd>${actionShort(id)}</span>`;
    })
    .join('');
}

/** HTML for the hint bar in a given context ('combat' | 'map'). */
function hintBarHtml(context) {
  const chips = CHIPS[context] || [];
  if (!chips.length) return '';
  const pad = hasGamepad();
  return `<div class="hint-bar hint-${context}${pad ? ' hint-pad' : ''}" role="presentation" aria-hidden="true">${chipsHtml(context, pad)}</div>`;
}

/** Rebuild any visible hint bars in place — called when a pad (dis)connects. */
function refreshHintBars() {
  const pad = hasGamepad();
  // Keyboard-only affordances (card quick-play badges) hide while a pad drives.
  document.body.classList.toggle('pad-mode', pad);
  document.querySelectorAll('.hint-bar').forEach((bar) => {
    const context = bar.classList.contains('hint-combat') ? 'combat' : bar.classList.contains('hint-map') ? 'map' : null;
    if (!context) return;
    bar.classList.toggle('hint-pad', pad);
    bar.innerHTML = chipsHtml(context, pad);
  });
  // The End Turn button carries its own key chip — keep it in sync too.
  const etKey = document.querySelector('.end-turn .et-key');
  if (etKey) etKey.textContent = pad ? padLabel('endTurn') || keyLabel('endTurn') : keyLabel('endTurn');
}

if (typeof window !== 'undefined') {
  window.addEventListener('gamepadconnected', refreshHintBars);
  window.addEventListener('gamepaddisconnected', refreshHintBars);
}


Object.assign(module.exports, { setHintMode, hintBarHtml, refreshHintBars });

},
"src/ui/screens/combat.js": function (module, exports, require) {
// src/ui/screens/combat.js — the combat screen (SPEC §7.2–7.4, mockup:

const { hintBarHtml, setHintMode } = require("src/ui/components/hints.js");
const { dlog } = require("src/ui/debuglog.js");

function mountCombat(app, { registries, run, combat, label, onEnd, showTutorial, onTutorialDone, onSettings, onMenu }) {
  app.innerHTML = `
    <div class="combat">
      <header class="topbar">
        <div class="portrait" style="border-color:${tintCss(run.customization && run.customization.tint)}">${esc((run.customization && run.customization.glyph) || classGlyph(run.class))}</div>

      </header>

      </div>
      <div class="hand-area">

        <div class="hand"></div>

      </div>

      <div class="pile discard"><span class="n"></span><small>DISCARD</small></div>

      </svg>

  const $ = (sel) => app.querySelector(sel);
  const combatEl = $('.combat');
  if (typeof window !== 'undefined') window.__combat = combat; // debug handle
  const fxCtx = {
    layer: $('.fx-layer'),
    combatEl,
    anchorFor: (id) => app.querySelector(`[data-eid="${id}"] .sprite`) || app.querySelector(`[data-eid="${id}"]`),
    relicAnchor: (relicId) => app.querySelector(`[data-relic-id="${relicId}"]`),
    orb: () => app.querySelector('.energy-orb'),
  };

  let selected = null; // card instanceId in click-targeting mode
  let selectedFlask = null; // flask slot index awaiting a target
  let selfArm = null; // self/buff card armed for a confirm (keyboard/gamepad)
  let busy = false; // animating / resolving
  let lastTargetId = null; // remember the last enemy aimed at (keyboard/pad QoL)
  let aimScheduled = false; // debounce for the aim-highlight observer

  // Entering targeting mode: move the focus cursor onto an enemy so keyboard /
  // gamepad players confirm a target next, not wander into the top bar. Prefer
  // the last enemy they attacked (if still alive), else the first living one.
  function focusTargeting() {

    if (!living.length) return;
    const pref = (lastTargetId && living.find((e) => e.id === lastTargetId)) || living[0];

  }

  // ---- likely-target highlight (SPEC §7.3) ----------------------------------
  // A tinted, slightly-enlarged clone of the prospective target's sprite sits
  // behind it, so the target you're about to hit glows red (an enemy) or blue
  // (self/buff). Follows mouse hover and keyboard/pad focus. Works for the SVG
  // player figure (recolor fills) and emoji-box enemies (solid colored box).
  const AIM_RED = '#e0463c';
  const AIM_BLUE = '#4d94e0';

  function tintClone(spriteWrap, color) {
    const src = spriteWrap.firstElementChild;
    if (!src) return null;
    const clone = src.cloneNode(true);
    const svg = clone.matches && clone.matches('svg') ? clone : clone.querySelector && clone.querySelector('svg');
    if (svg) {
      svg.querySelectorAll('*').forEach((n) => {
        const f = n.getAttribute && n.getAttribute('fill');
        const s = n.getAttribute && n.getAttribute('stroke');
        if (f && f !== 'none') n.setAttribute('fill', color);
        if (s && s !== 'none') n.setAttribute('stroke', color);
      });
    } else if (clone.style) {
      clone.style.background = color;
      clone.style.borderColor = color;
      clone.style.color = 'transparent';
      clone.style.boxShadow = 'none';
    }
    return clone;
  }

  function clearAim() {
    app.querySelectorAll('.aim-silho').forEach((n) => n.remove());
    app.querySelectorAll('.combatant.aiming').forEach((n) => n.classList.remove('aiming', 'aim-enemy', 'aim-self'));
  }

  function setAim(combatantEl, kind) {
    const spriteWrap = combatantEl.querySelector('.sprite');
    if (!spriteWrap) return;
    const clone = tintClone(spriteWrap, kind === 'self' ? AIM_BLUE : AIM_RED);
    if (!clone) return;
    const holder = document.createElement('div');
    holder.className = 'aim-silho';
    holder.appendChild(clone);
    spriteWrap.insertBefore(holder, spriteWrap.firstChild);
    combatantEl.classList.add('aiming', kind === 'self' ? 'aim-self' : 'aim-enemy');
  }

  // The single prospective target right now: an armed self-card → the player
  // (blue); an enemy-targeting card → the hovered or focused enemy (red).
  function currentAim() {
    if (selfArm) {
      const p = $('.combatant.player');
      return p ? { el: p, kind: 'self' } : null;
    }
    if (selected || selectedFlask != null) {
      const el = $('.combatant.enemy.hover-target') || $('.combatant.enemy.gp-focus');
      return el ? { el, kind: 'enemy' } : null;
    }
    return null;
  }

  function refreshAim() {
    const want = currentAim();
    const cur = $('.combatant.aiming');
    if ((want && cur === want.el && cur.querySelector('.aim-silho')) || (!want && !cur)) return;
    clearAim();
    if (want) setAim(want.el, want.kind);
  }

  // Arm a self/buff card: highlight the player blue and wait for a second
  // Confirm (keyboard/gamepad). Mouse plays such cards on the first click.
  function armSelf(instanceId) {

    selectedFlask = null;
    hideTooltip();
    render();
    if (selfArm) focusFirst('.combatant.player');
    refreshAim();

  // Land the cursor on the leftmost playable card at the start of your turn —
  // only once the player has actually used keyboard/gamepad (mouse users never
  // get an unrequested focus ring).
  function focusHandDefault() {
    if (!isEngaged() || busy || combat.result || combat.phase !== 'player') return;
    if (selected || selectedFlask != null || selfArm) return;
    if (!focusFirst('.hand .card:not(.unaffordable)')) focusFirst('.hand .card');
  }

  // Display snapshot for paced playback (SPEC §7.4): while a timeline plays,
  // bars/hand render from this pre-dispatch copy, advanced beat by beat, so
  // the HUD updates one actor at a time instead of jumping to the outcome.
  let disp = null;
  const dv = (ent) => (disp && disp.ents[ent.id]) || ent;
  function takeSnapshot() {
    const ents = {
      player: { hp: combat.player.hp, block: combat.player.block, alive: true },
    };
    for (const e of combat.enemies) ents[e.id] = { hp: e.hp, block: e.block, alive: e.alive };

  }
  function findInst(instanceId) {
    for (const pile of ['hand', 'draw', 'discard', 'exhaust']) {
      const c = combat.piles[pile].find((x) => x.instanceId === instanceId);
      if (c) return c;
    }
    return null;
  }
  function applyBeatToDisp(beat) {
    if (!disp) return;
    for (const e of beat.events) {
      const t = e.targetId && disp.ents[e.targetId];
      switch (e.type) {
        case 'damageDealt':
          if (t) t.block = Math.max(0, t.block - e.blocked);
          break;
        case 'hpLost':
          if (t) t.hp = Math.max(0, t.hp - e.amount);
          break;
        case 'healed':
          if (t) t.hp = Math.min(t.hp + e.amount, (getEntity(combat, e.targetId) || {}).maxHp || t.hp + e.amount);
          break;
        case 'blockGained':
          if (t) t.block += e.amount;
          break;
        case 'enemyDied':
          if (t) {
            t.alive = false;
            t.hp = 0;
          }
          break;
        case 'cardDrawn': {
          const inst = findInst(e.cardInstanceId);
          if (inst && !disp.hand.some((c) => c.instanceId === inst.instanceId)) disp.hand.push(inst);
          break;
        }
        case 'cardPlayed':
        case 'cardDiscarded':
        case 'cardExhausted': {
          const i = disp.hand.findIndex((c) => c.instanceId === e.cardInstanceId);
          if (i >= 0) disp.hand.splice(i, 1);
          break;
        }
      }
    }
  }

  // ---------- rendering ----------
  function render() {
    renderTopbar();
    renderPlayer();
    renderEnemies();
    renderHand();
    renderControls();
    refreshAim(); // re-apply the target glow after the board rebuilds
    // Hint bar context: while aiming, show Confirm/Cancel instead of zone keys.
    setHintMode(selected || selectedFlask != null || selfArm ? 'targeting' : null);
  }

  function renderTopbar() {
    const p = combat.player;
    const pv = dv(p);
    const hp = $('.topbar .hpbar');
    hp.querySelector('.fill').style.width = `${(pv.hp / p.maxHp) * 100}%`;
    hp.querySelector('.label').textContent = `${pv.hp} / ${p.maxHp}`;

    relics.innerHTML = '';
    for (const rid of p.relicIds) {

      const el = document.createElement('div');
      el.className = 'relic';
      el.dataset.relicId = rid;
      el.textContent = def.icon || '◆';
      attachTooltip(el, () => `<div class="tt-title">${esc(def.name)}</div>${esc(def.textTemplate.replace(/[{}]/g, ''))}`);
      relics.appendChild(el);

    flasks.innerHTML = '';
    p.flasks.forEach((f, slot) => {
      const def = registries.flasks.get(f.flaskId);
      const el = document.createElement('div');
      el.className = 'relic flask-slot';
      el.style.cursor = 'pointer';
      if (selectedFlask === slot) el.style.borderColor = 'var(--parchment)';
      el.textContent = def.icon || '🧪';

      }
      attachTooltip(el, () => `<div class="tt-title">${esc(def.name)}</div>${esc(def.textTemplate || '')}${def.targeted ? '<br><i>Click, then choose a target.</i>' : '<br><i>Click to drink.</i>'}`);
      el.addEventListener('click', () => {

        if (def.targeted) {

  }

  function statusRow(entity) {
    const row = document.createElement('div');
    row.className = 'statuses';
    for (const [sid, inst] of Object.entries(entity.statuses)) {
      const def = registries.statuses.get(sid);
      const stacks = inst.meter ? inst.meter.value : inst.stacks;
      const el = document.createElement('div');
      el.className = 'status-icon';
      el.style.borderColor = def.tint || 'var(--muted)'; // status-pip accent (data: status def)
      el.innerHTML = `${esc(def.icon || '?')}<span class="stk">${stacks}</span>`;
      attachTooltip(el, () => {
        let extra = '';
        if (inst.meter) extra = `<br>Build-up: ${inst.meter.value} / ${inst.meter.max}`;
        if (inst.duration != null) extra += `<br>Turns left: ${inst.duration}`;

  function meterBars(entity) {
    const v = dv(entity);
    const wrap = document.createElement('div');
    wrap.className = 'meters';
    const hp = document.createElement('div');

        attachTooltip(bl, () => `<div class="tt-title">${esc(bleedDef.name)}</div>${bleedInst.meter.value} / ${bleedInst.meter.max}. ${esc(bleedDef.tooltip || '')}`);
        wrap.appendChild(bl);
      }
    }
    return wrap;
  }

  function blockBadge(entity) {
    const v = dv(entity);
    if (v.block <= 0) return null;
    const b = document.createElement('div');
    b.className = 'block-badge';
    b.textContent = v.block;
    attachTooltip(b, () => `<div class="tt-title">Block ${v.block}</div>Absorbs attack damage. Expires at the start of the owner's turn.`);
    return b;
  }

  function renderPlayer() {
    const zone = $('.player-zone');
    zone.innerHTML = '';
    const p = combat.player;
    const box = document.createElement('div');
    box.className = `combatant player${selfArm ? ' armed' : ''}`;
    box.dataset.eid = 'player';
    // When a self/buff card is armed, the player is a confirmable target.
    if (selfArm) {
      box.dataset.focusable = '';
      box.style.cursor = 'pointer';
      box.addEventListener('click', () => {
        if (selfArm) playCard(selfArm, null);
      });
    }
    const sprite = document.createElement('div');
    sprite.className = 'sprite';
    sprite.appendChild(playerSprite(run.customization || {}, run.class));
    const badge = blockBadge(p);
    if (badge) sprite.appendChild(badge);
    box.appendChild(sprite);
    box.appendChild(meterBars(p));
    if (p.stanceId) {
      const st = registries.stances.get(p.stanceId);
      const chip = document.createElement('div');
      chip.className = `stance-chip ${p.stanceId}`;
      chip.innerHTML = `${esc(st.icon || '')} ${esc(st.name)}`;
      attachTooltip(chip, () => `<div class="tt-title">${esc(st.name)}</div>${esc(st.tooltip || '')}`);
      box.appendChild(chip);
    }
    box.appendChild(statusRow(p));
    zone.appendChild(box);
  }

  function intentEl(enemy) {
    const iv = previewIntent(combat, enemy.id);
    const el = document.createElement('div');
    const badge = intentBadge(iv);
    el.className = `intent ${badge.cls}`;
    el.innerHTML = badge.html;
    attachTooltip(el, () => intentTooltip(iv)); // solo → 'you'
    return el;
  }

  function renderEnemies() {
    const row = $('.enemy-row');
    row.innerHTML = '';
    const targeting = selected || selectedFlask != null;
    const living = combat.enemies.filter((e) => e.alive);
    for (const enemy of combat.enemies) {
      const def = registries.enemies.get(enemy.enemyId);
      const box = document.createElement('div');
      box.className = `combatant enemy${dv(enemy).alive ? '' : ' dead'}${targeting ? ' targetable' : ''}`;
      box.dataset.eid = enemy.id;
      if (enemy.alive) box.appendChild(intentEl(enemy));
      // Target-number badge for keyboard targeting (SPEC §7.3).
      if (enemy.alive && targeting) {
        const idx = living.indexOf(enemy);
        if (idx < 9) {
          const kh = document.createElement('span');
          kh.className = 'enemy-key';
          kh.textContent = idx + 1;
          box.appendChild(kh);
        }
      }
      const sprite = document.createElement('div');
      sprite.className = 'sprite';
      sprite.appendChild(enemySprite(def));
      const badge = blockBadge(enemy);
      if (badge) sprite.appendChild(badge);
      box.appendChild(sprite);
      const nm = document.createElement('div');
      nm.className = 'nm';
      nm.textContent = def.name;
      box.appendChild(nm);
      box.appendChild(meterBars(enemy));
      box.appendChild(statusRow(enemy));
      if (enemy.alive) {
        box.addEventListener('click', () => {
          if (selected) playCard(selected, enemy.id);
          else if (selectedFlask != null) useFlask(selectedFlask, enemy.id);
        });
        box.addEventListener('pointerenter', () => (selected || selectedFlask != null) && box.classList.add('hover-target'));
        box.addEventListener('pointerleave', () => box.classList.remove('hover-target'));
      }
