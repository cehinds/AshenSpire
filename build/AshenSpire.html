// ---------------------------------------------------------------------------
// Schema walker
// ---------------------------------------------------------------------------

function walkSchema(value, node, path, vctx) {
  const { err } = vctx;
  if (!node) {
    err(path, 'Internal: missing schema node');
    return;
  }
  switch (node.k) {
    case 'any':
      return;
    case 'str':
      if (typeof value !== 'string') err(path, `Expected string, got ${describe(value)}`);
      return;
    case 'num':
      if (typeof value !== 'number' || Number.isNaN(value)) {
        err(path, `Expected number, got ${describe(value)}`);
      } else if (node.int && !Number.isInteger(value)) {
        err(path, `Expected integer, got ${value}`);
      }
      return;
    case 'bool':
      if (typeof value !== 'boolean') err(path, `Expected boolean, got ${describe(value)}`);
      return;
    case 'enum':
      if (!node.values.includes(value)) {
        err(path, `Expected one of [${node.values.join(', ')}], got ${describe(value)}`);
      }
      return;
    case 'arr':
      if (!Array.isArray(value)) {
        err(path, `Expected array, got ${describe(value)}`);
        return;
      }
      if (node.len != null && value.length !== node.len) {
        err(path, `Expected array of length ${node.len}, got ${value.length}`);
      }
      value.forEach((v, i) => walkSchema(v, node.of, `${path}[${i}]`, vctx));
      return;
    case 'map':
      if (!isPlainObject(value)) {
        err(path, `Expected object map, got ${describe(value)}`);
        return;
      }
      for (const key of Object.keys(value)) walkSchema(value[key], node.of, `${path}.${key}`, vctx);
      return;
    case 'obj': {
      if (!isPlainObject(value)) {
        err(path, `Expected object, got ${describe(value)}`);
        return;
      }
      for (const key of Object.keys(value)) {
        if (!(key in node.fields)) err(`${path}.${key}`, `Unknown field '${key}'`);
      }
      for (const [key, fieldNode] of Object.entries(node.fields)) {
        if (value[key] === undefined) {
          if (!fieldNode.opt) err(`${path}.${key}`, `Missing required field '${key}'`);
          continue;
        }
        walkSchema(value[key], fieldNode, `${path}.${key}`, vctx);
      }
      return;
    }
    case 'union': {
      // Accept if any branch matches without producing errors.
      for (const branch of node.anyOf) {
        const probeErrors = [];
        const probe = { ids: vctx.ids, err: (p, m) => probeErrors.push({ p, m }) };
        walkSchema(value, branch, path, probe);
        if (probeErrors.length === 0) return;
      }
      err(path, `Value ${describe(value)} matched no allowed variant`);
      return;
    }
    case 'ref':
      if (typeof value !== 'string') {
        err(path, `Expected ${node.reg} id string, got ${describe(value)}`);
      } else if (!vctx.ids[node.reg] || !vctx.ids[node.reg].has(value)) {
        err(path, `Dangling reference: unknown ${node.reg} id '${value}'`);
      }
      return;
    case 'effects':
      validateEffects(value, path, vctx);
      return;
    case 'triggers':
      validateTriggers(value, path, vctx);
      return;
    case 'predicate':
      validatePredicate(value, path, vctx);
      return;
    case 'formulaOrNum':
      validateFormula(value, path, vctx);
      return;
    default:
      err(path, `Internal: unknown schema kind '${node.k}'`);
  }
}

function describe(v) {
  if (v === null) return 'null';
  if (Array.isArray(v)) return 'array';
  return typeof v === 'object' ? 'object' : `${typeof v} ${JSON.stringify(v)}`;
}

function isPlainObject(v) {
  return v !== null && typeof v === 'object' && !Array.isArray(v);
}

// Effects / triggers / predicates / formulas (closed-set checks)
// ---------------------------------------------------------------------------

const COMMON_EFFECT_FIELDS = ['op', 'target', 'amount', 'if', 'repeat'];

function validateEffects(effects, path, vctx) {
  const { err } = vctx;
  if (!Array.isArray(effects)) {
    err(path, `Expected effects array, got ${describe(effects)}`);
    return;
  }
  effects.forEach((eff, i) => {
    const p = `${path}[${i}]`;
    if (!isPlainObject(eff)) {
      err(p, `Effect must be an object, got ${describe(eff)}`);
      return;
    }
    // Budgeted escape hatch: { script: 'name', ...args } (SPEC §3.1(6)).
    if (typeof eff.script === 'string') {

      return;
    }
    if (typeof eff.op !== 'string') {

      return;
    }

      return;
    }

    for (const key of Object.keys(eff)) {
      if (!allowed.has(key)) err(`${p}.${key}`, `Unknown field '${key}' on opcode '${eff.op}'`);
    }
    for (const req of spec.required) {

    }
    if (eff.target !== undefined && !TARGETS.includes(eff.target)) {
      err(`${p}.target`, `Unknown target '${eff.target}' (closed set: ${TARGETS.join(', ')})`);
    }

      if (eff[numeric] !== undefined) validateFormula(eff[numeric], `${p}.${numeric}`, vctx);
    }
    if (eff.if !== undefined) validatePredicate(eff.if, `${p}.if`, vctx);
    for (const [field, reg] of Object.entries(spec.refs)) {
      const v = eff[field];
      if (typeof v === 'string' && !vctx.ids[reg].has(v)) {
        err(`${p}.${field}`, `Dangling reference: unknown ${reg} id '${v}'`);
      }
    }
    if (eff.op === 'addCard') {
      if (eff.pile !== undefined && !['draw', 'hand', 'discard', 'exhaust'].includes(eff.pile)) {
        err(`${p}.pile`, `Unknown pile '${eff.pile}'`);
      }
      if (eff.position !== undefined && !['top', 'bottom', 'random'].includes(eff.position)) {
        err(`${p}.position`, `Unknown position '${eff.position}'`);
      }
    }
  });
}

const TRIGGER_FIELDS = new Set(['on', 'if', 'do', 'once', 'limitPerTurn']);

function validateTriggers(triggers, path, vctx) {

  if (!Array.isArray(triggers)) {
    err(path, `Expected triggers array, got ${describe(triggers)}`);
    return;
  }
  triggers.forEach((trig, i) => {
    const p = `${path}[${i}]`;
    if (!isPlainObject(trig)) {
      err(p, `Trigger must be an object, got ${describe(trig)}`);
      return;
    }
    for (const key of Object.keys(trig)) {
      if (!TRIGGER_FIELDS.has(key)) err(`${p}.${key}`, `Unknown trigger field '${key}'`);
    }
    if (!TRIGGER_EVENTS.includes(trig.on)) {
      err(`${p}.on`, `Unknown trigger event '${trig.on}' (closed set, SPEC §3.10)`);
    }
    if (trig.if !== undefined) validatePredicate(trig.if, `${p}.if`, vctx);
    if (trig.once !== undefined && typeof trig.once !== 'boolean') err(`${p}.once`, 'once must be boolean');

const PREDICATE_FIELDS = {
  inStance: ['stance'],
  hasStatus: ['of', 'status', 'atLeast'],
  hasBlock: ['of'],
  hpBelowPct: ['of', 'pct'],
  firstCardThisTurn: [],
  firstAttackThisCombat: [],
  cardTypeIs: ['type'],
  everyNthCardThisCombat: ['n'],
  random: ['pct'],
  eventIsAttack: [],
  eventSourceIsOwner: [],
  eventTargetIsOwner: [],
  eventStatusIs: ['status'],
  all: ['preds'],
  any: ['preds'],
  not: ['pred'],
};

function validatePredicate(pred, path, vctx) {
  const { err } = vctx;
  if (!isPlainObject(pred) || typeof pred.p !== 'string') {
    err(path, `Predicate must be an object with a 'p' field, got ${describe(pred)}`);
    return;
  }
  if (!PREDICATES.includes(pred.p)) {
    err(path, `Unknown predicate '${pred.p}' (closed set, SPEC §3.6)`);
    return;
  }
  const allowed = new Set(['p', ...PREDICATE_FIELDS[pred.p]]);
  for (const key of Object.keys(pred)) {
    if (!allowed.has(key)) err(`${path}.${key}`, `Unknown field '${key}' on predicate '${pred.p}'`);
  }
  const PRED_OF = ['self', 'owner', 'player', 'enemy', 'target'];
  if (pred.of !== undefined && !PRED_OF.includes(pred.of)) {
    err(`${path}.of`, `Unknown entity ref '${pred.of}' (allowed: ${PRED_OF.join(', ')})`);
  }
  switch (pred.p) {
    case 'inStance':
      if (typeof pred.stance !== 'string' || !vctx.ids.stances.has(pred.stance)) {
        err(`${path}.stance`, `Dangling reference: unknown stance id '${pred.stance}'`);
      }
      break;
    case 'hasStatus':
    case 'eventStatusIs':
      if (typeof pred.status !== 'string' || !vctx.ids.statuses.has(pred.status)) {
        err(`${path}.status`, `Dangling reference: unknown status id '${pred.status}'`);
      }
      break;
    case 'cardTypeIs':
      if (!CARD_TYPES.includes(pred.type)) err(`${path}.type`, `Unknown card type '${pred.type}'`);
      break;
    case 'everyNthCardThisCombat':
      if (!Number.isInteger(pred.n) || pred.n < 1) err(`${path}.n`, 'n must be a positive integer');
      break;
    case 'random':
      if (typeof pred.pct !== 'number') err(`${path}.pct`, 'pct must be a number');
      break;
    case 'all':

      if (!Array.isArray(pred.preds)) err(`${path}.preds`, `'${pred.p}' requires a preds array`);
      else pred.preds.forEach((sub, i) => validatePredicate(sub, `${path}.preds[${i}]`, vctx));
      break;
    case 'not':
      validatePredicate(pred.pred, `${path}.pred`, vctx);
      break;
    default:
      break;
  }
}

const FORMULA_FIELDS = {
  add: ['args'],
  mul: ['args'],
  percentMaxHp: ['of', 'pct', 'min', 'max'],
  missingHp: ['of', 'min', 'max'],

    return;
  }
  if (!isFormula(value)) {
    err(path, `Expected number or formula object, got ${describe(value)}`);
    return;
  }
  if (!FORMULA_OPS.includes(value.f)) {
    err(path, `Unknown formula op '${value.f}' (closed set, SPEC §3.5)`);
    return;
  }
  const allowed = new Set(['f', ...FORMULA_FIELDS[value.f]]);
  for (const key of Object.keys(value)) {
    if (!allowed.has(key)) err(`${path}.${key}`, `Unknown field '${key}' on formula '${value.f}'`);
  }
  if (value.of !== undefined && !FORMULA_OF.includes(value.of)) {
    err(`${path}.of`, `Unknown entity ref '${value.of}' (allowed: ${FORMULA_OF.join(', ')})`);
  }
  if (value.f === 'add' || value.f === 'mul') {
    if (!Array.isArray(value.args)) err(`${path}.args`, `'${value.f}' requires an args array`);

    err(`${path}.of`, `'${value.f}' requires 'of'`);
  }

// ---------------------------------------------------------------------------
// Text templating (SPEC §3.13)
// ---------------------------------------------------------------------------

function checkTemplate(template, effects, path, err) {

const mapOf = (of) => ({ k: 'map', of });
const obj = (fields) => ({ k: 'obj', fields });
const ref = (reg) => ({ k: 'ref', reg });
const union = (...anyOf) => ({ k: 'union', anyOf });
const opt = (node) => ({ ...node, opt: true });

const costNode = union(int, en('X'));

const modifiersSchema = obj({
  damageDealtMult: opt(num),
  damageTakenMult: opt(num),
  blockGainedMult: opt(num),
  attackDamageAdd: opt(num),
  blockAdd: opt(num),
  skipTurn: opt(bool),
  retainBlock: opt(bool),
  blockCap: opt(num),
  meterMaxGrowthDisabled: opt(bool),
});

const enemyMoveSchema = obj({
  intent: en(...INTENT_KINDS),
  damage: opt(int),
  hits: opt(int),
  block: opt(int),
  weight: num,
  maxConsecutive: opt(int),
  effects: opt(effects),
  locked: opt(bool),
  delay: opt(
    obj({
      turns: int,
      whileCharging: opt(
        obj({
          block: opt(int),
          effects: opt(effects),
          intent: opt(en(...INTENT_KINDS)),
        })
      ),
    })
  ),
});

const enemyPhaseSchema = obj({
  on: en(...TRIGGER_EVENTS),
  pct: opt(num),
  once: opt(bool),
  if: opt({ k: 'predicate' }),
  do: effects,
  unlockMoves: opt(arr(str)), // checked against the enemy's own moves in validate.js
});

// ---------------------------------------------------------------------------
// Entity schemas (SPEC §3.3 table)
// ---------------------------------------------------------------------------

const SCHEMAS = Object.freeze({
  card: obj({
    id: str,
    name: str,
    class: str, // a class id or 'colorless' (checked in validate.js)
    rarity: en(...CARD_RARITIES),
    cost: costNode,
    type: en(...CARD_TYPES),
    keywords: arr(ref('keywords')),
    effects,
    textTemplate: str,
    upgrade: opt(
      obj({
        name: opt(str),
        cost: opt(costNode),
        effects: opt(effects),
        keywords: opt(arr(ref('keywords'))),
        textTemplate: opt(str),
      })
    ),
    icon: opt(str),
    flavor: opt(str),
    script: opt(ref('scripts')),
  }),

  relic: obj({
    id: str,
    name: str,
    rarity: en(...RELIC_RARITIES),
    textTemplate: str,
    triggers: triggersNode,
    passives: opt(
      obj({
        runeGainMult: opt(num),
        eliteExtraCardReward: opt(bool),
        flaskPowerMult: opt(num),
        revealUnknown: opt(bool),
        shrineHealMult: opt(num),
        shrineNoRest: opt(bool),
        powerCostReduction: opt(num),
      })
    ),
    icon: opt(str),
    flavor: opt(str),
    script: opt(ref('scripts')),
  }),

  status: obj({
    id: str,
    name: str,
    icon: opt(str),
    tint: opt(str), // status-pip accent CSS color (display)
    stackMode: en(...STACK_MODES),
    decay: union(en('none', 'perTurnEnd', 'onConsume'), obj({ duration: int })),
    meter: opt(obj({ max: int, growthMult: num, onFill: effects })),
    modifiers: opt(modifiersSchema),
    hooks: opt(triggersNode),
    tooltip: opt(str),
    script: opt(ref('scripts')),
  }),

  stance: obj({
    id: str,
    name: str,
    icon: opt(str),
    onEnter: opt(effects),
    modifiers: opt(modifiersSchema),
    hooks: opt(triggersNode),
    tooltip: opt(str),
    script: opt(ref('scripts')),
  }),

  keyword: obj({
    id: str,
    name: str,
    tooltip: str,
  }),

  enemy: obj({
    id: str,
    name: str,
    hp: arr(int, 2), // [min, max], rolled on stream 'enemyHP'
    poiseMax: int,
    moves: mapOf(enemyMoveSchema),
    firstMove: opt(str), // checked against own moves in validate.js
    phases: opt(arr(enemyPhaseSchema)),
    art: opt(str),
    size: opt(en('small', 'medium', 'large')), // sprite size tier (display)
    tint: opt(str), // border/accent CSS color (display)
    script: opt(ref('scripts')),
  }),

  encounter: obj({
    id: str,
    enemies: arr(ref('enemies')),
    weight: num,
    minFloor: opt(int),
    pool: en(...ENCOUNTER_POOLS),
    act: opt(int), // defaults to 1
  }),

  event: obj({
    id: str,
    name: str,
    art: opt(str),
    text: str,
    choices: arr(
      obj({
        label: str,
        requires: opt(any),
        effects,
        resultText: str,
      })
    ),
  }),

  flask: obj({
    id: str,
    name: str,
    rarity: en(...FLASK_RARITIES),
    targeted: opt(bool),
    effects,
    icon: opt(str),
    textTemplate: opt(str),
    script: opt(ref('scripts')),
  }),

  class: obj({
    id: str,
    name: str,
    maxHp: int,
    glyph: opt(str), // class sigil glyph (display)
    cardTint: opt(str), // card motif hue (display; see styles/ui.css .card)
    startingRelic: ref('relics'),
    startingDeck: arr(ref('cards')),
    cardPool: arr(ref('cards')),
    description: opt(str),
  }),

  mapConfig: obj({
    floors: int,
    columns: int,
    pathCount: int,
    typeWeights: mapOf(num),
    floorRules: opt(any),
  }),

  balance: any, // flat constants object; shape is content's concern (SPEC §3.3)
});


Object.assign(module.exports, { COMBAT_OPCODES, RUN_OPCODES, OPCODES, TARGETS, EVENTS, TRIGGER_EVENTS, PREDICATES, PASSIVE_KEYS, MODIFIER_KEYS, STACK_MODES, CARD_TYPES, CARD_RARITIES, RELIC_RARITIES, FLASK_RARITIES, INTENT_KINDS, ENCOUNTER_POOLS, PILES, PILE_POSITIONS, ENGINE_KEYWORDS, REGISTRY_TYPES, EFFECT_SPECS, SCHEMAS });

},
"src/model/formulas.js": function (module, exports, require) {
// src/model/formulas.js — structured formula evaluator (SPEC §3.5)
//
// Every dynamic number in content is either a plain number or a formula
// object { f: '<op>', ... }. No string parsing — formulas are validatable
// data. The closed op set below is contractual; extending it is an engine PR.
//
// Flooring: every evaluation floors its FINAL result once (StS integer math).
// The single deliberate exception is `stacks` with `per`, which floors the
// division immediately so "per N stacks" means whole chunks of N.
//
// The same evaluator computes card-preview numbers for the UI (SPEC §3.13, §4.2).
//
// Headless: no document/window/localStorage/timers.

const FORMULA_OPS = Object.freeze([
  'add',
  'mul',
  'percentMaxHp',
  'missingHp',
  'stacks',
  'energySpent',
  'blockOf',
  'hpOf',
  'cardsPlayedThisTurn',
]);

// Entity references usable in a formula's `of` field.
const FORMULA_OF = Object.freeze([
  'self',
  'owner',
  'target',
  'enemy',
  'player',
  'allEnemies',
]);

function isFormula(v) {
  return v !== null && typeof v === 'object' && typeof v.f === 'string';
}

/**
 * evaluate(formula, ctx) → integer.
 *
 * ctx = {
 *   entities: { self, owner, target, enemy, player, allEnemies: [] },
 *              // each entity: { hp, maxHp, block, statuses: {} } or null
 *   energySpent: number,         // for X-cost scaling
 *   cardsPlayedThisTurn: number,
 * }
 *
 * `formula` may be a plain number (returned floored) or a formula object.
 * Optional `min` / `max` clamps are honored on any node (applied before the
 * final floor). Throws on unknown ops, unresolvable `of` refs, or NaN.
 */
function evaluate(formula, ctx = {}) {
  const raw = evalNode(formula, ctx);
  if (typeof raw !== 'number' || Number.isNaN(raw)) {
    throw new Error(`Formula evaluated to a non-number: ${JSON.stringify(formula)}`);
  }
  return Math.floor(raw);
}

function evalNode(node, ctx) {
  if (typeof node === 'number') return node;
  if (!isFormula(node)) {
    throw new Error(`Not a number or formula: ${JSON.stringify(node)}`);
  }
  let v;
  switch (node.f) {
    case 'add': {
      v = argsOf(node).reduce((acc, a) => acc + evalNode(a, ctx), 0);
      break;
    }
    case 'mul': {
      v = argsOf(node).reduce((acc, a) => acc * evalNode(a, ctx), 1);
      break;
    }
    case 'percentMaxHp': {
      const ent = resolveOne(ctx, node.of, node.f);
      v = (ent.maxHp * numField(node, 'pct')) / 100;
      break;
    }
    case 'missingHp': {
      const ent = resolveOne(ctx, node.of, node.f);
      v = Math.max(0, ent.maxHp - ent.hp);
      break;
    }
    case 'stacks': {
      const ents = resolveMany(ctx, node.of, node.f);
      let total = 0;
      for (const ent of ents) total += stacksOf(ent, node.status);
      v = node.per != null ? Math.floor(total / node.per) : total;
      break;
    }
    case 'energySpent': {
      const spent = ctx.energySpent != null ? ctx.energySpent : 0;
      v = spent * (node.per != null ? node.per : 1);
      break;
    }
    case 'blockOf': {
      const ent = resolveOne(ctx, node.of, node.f);
      v = ent.block;
      break;
    }
    case 'hpOf': {
      const ent = resolveOne(ctx, node.of, node.f);
      v = ent.hp;
      break;
    }
    case 'cardsPlayedThisTurn': {
      const n = ctx.cardsPlayedThisTurn != null ? ctx.cardsPlayedThisTurn : 0;
      v = n * (node.per != null ? node.per : 1);
      break;
    }
    default:
      throw new Error(`Unknown formula op '${node.f}'`);
  }
  if (node.min != null && v < node.min) v = node.min;
  if (node.max != null && v > node.max) v = node.max;
  return v;
}

function argsOf(node) {
  if (!Array.isArray(node.args)) {
    throw new Error(`Formula '${node.f}' requires an args array`);
  }
  return node.args;
}

function numField(node, field) {
  const v = node[field];
  if (typeof v !== 'number') {
    throw new Error(`Formula '${node.f}' requires numeric field '${field}'`);
  }
  return v;
}

function resolveRef(ctx, of, op) {
  if (of == null) throw new Error(`Formula '${op}' requires an 'of' entity ref`);
  const entities = ctx.entities || {};
  const ent = entities[of];
  if (ent == null) {
    throw new Error(`Formula '${op}': entity ref '${of}' did not resolve in this context`);
  }
  return ent;
}

function resolveOne(ctx, of, op) {
  const ent = resolveRef(ctx, of, op);
  if (Array.isArray(ent)) {
    throw new Error(`Formula '${op}' cannot target '${of}' (a group); use a single entity ref`);
  }
  return ent;
}

function resolveMany(ctx, of, op) {
  const ent = resolveRef(ctx, of, op);
  return Array.isArray(ent) ? ent : [ent];
}

// Status stacks of an entity; meter statuses report their meter value
// (their build-up points) as their "stacks" (SPEC §3.5, §3.7).
function stacksOf(entity, statusId) {
  if (typeof statusId !== 'string') {
    throw new Error("Formula 'stacks' requires a 'status' id");
  }
  const inst = entity && entity.statuses ? entity.statuses[statusId] : null;
  if (!inst) return 0;
  return inst.meter ? inst.meter.value : inst.stacks || 0;
}


Object.assign(module.exports, { FORMULA_OPS, FORMULA_OF, isFormula, evaluate });

},
"src/model/registries.js": function (module, exports, require) {
// src/model/registries.js — typed id → definition registries, deep-frozen (SPEC §3.3)
//
// createRegistries(contentBundle) loads all content into typed, deep-frozen
// registries keyed by id. Cross-references are by id only; getters THROW on
// unknown ids (dangling ids are caught earlier by model/validate.js).
//
// Headless: no document/window/localStorage/timers.

const { REGISTRY_TYPES } = require("src/model/schemas.js");
const { applyCardMods } = require("src/model/loadout.js");

/** Recursively freeze a value in place (functions and frozen values skipped). */
function deepFreeze(value) {
  if (value === null || typeof value !== 'object') return value;
  if (Object.isFrozen(value)) return value;
  Object.freeze(value);
  for (const key of Object.keys(value)) deepFreeze(value[key]);
  return value;
}

function makeRegistry(typeName, defs) {
  const byId = new Map();
  for (const def of defs || []) {
    if (!def || typeof def.id !== 'string') {
      throw new Error(`Every ${typeName} def must have a string id (got ${JSON.stringify(def && def.id)})`);
    }
    if (byId.has(def.id)) {
      throw new Error(`Duplicate ${typeName} id '${def.id}'`);
    }
    byId.set(def.id, deepFreeze(def));
  }
  return Object.freeze({
    type: typeName,
    size: byId.size,
    get(id) {
      const d = byId.get(id);
      if (!d) throw new Error(`Unknown ${typeName} id '${id}'`);
      return d;
    },
    has(id) {
      return byId.has(id);
    },
    ids() {
      return [...byId.keys()];
    },
    all() {
      return [...byId.values()];
    },
  });
}

// Bundle key → registry property + singular type name for error messages.
const TYPE_SINGULAR = {
  cards: 'card',
  relics: 'relic',
  statuses: 'status',
  stances: 'stance',
  keywords: 'keyword',
  enemies: 'enemy',
  encounters: 'encounter',
  events: 'event',
  flasks: 'flask',
  classes: 'class',
};

/**
 * createRegistries(contentBundle) → frozen registries object.
 *
 * contentBundle = {
 *   version?: string,                    // contentVersion (SPEC §3.12)
 *   cards?: [], relics?: [], statuses?: [], stances?: [], keywords?: [],
 *   enemies?: [], encounters?: [], events?: [], flasks?: [], classes?: [],
 *   balance?: {},                        // flat constants (SPEC §3.3)
 *   mapConfigs?: { [actNumber]: {...} },
 *   scripts?: { [name]: function },      // budgeted escape hatch (SPEC §3.1(6))
 * }
 *
 * Missing collections default to empty. Duplicate ids throw.
 *
 * Result shape:
 *   registries.cards.get(id) / .has(id) / .ids() / .all() / .size
 *   ... same for relics, statuses, stances, keywords, enemies, encounters,
 *       events, flasks, classes
 *   registries.balance              — deep-frozen constants object
 *   registries.mapConfig(act)       — throws on unknown act
 *   registries.scripts              — frozen { name: fn }
 *   registries.contentVersion       — string
 */
function createRegistries(contentBundle) {
  const bundle = contentBundle || {};
  const registries = {};

  for (const type of REGISTRY_TYPES) {
    registries[type] = makeRegistry(TYPE_SINGULAR[type], bundle[type]);
  }

  registries.balance = deepFreeze({ ...(bundle.balance || {}) });

  const mapConfigs = deepFreeze({ ...(bundle.mapConfigs || {}) });
  registries.mapConfigs = mapConfigs;
  registries.mapConfig = (act) => {
    const cfg = mapConfigs[act];
    if (!cfg) throw new Error(`Unknown mapConfig for act '${act}'`);
    return cfg;
  };

  // Armaments/armour are tables, not id→def registries: pieces are looked up
  // by (slot, class) far more often than by bare id, and armour ids repeat
  // across classes on purpose. They ride along frozen, like balance.
  registries.equipment = deepFreeze({ ...(bundle.equipment || {}) });

  registries.scripts = Object.freeze({ ...(bundle.scripts || {}) });
  registries.contentVersion = String(bundle.version || bundle.contentVersion || '0');

  return Object.freeze(registries);
}

// ---------------------------------------------------------------------------
// Relic passives (SPEC PASSIVE_KEYS) — data lookups over owned relic defs.
// ---------------------------------------------------------------------------

/** Product of a multiplicative passive across owned relics (default 1). */
function passiveMult(registries, relicIds, key) {
  let m = 1;
  for (const id of relicIds || []) {
    const p = registries.relics.get(id).passives;
    if (p && typeof p[key] === 'number') m *= p[key];
  }
  return m;
}

/** Sum of an additive passive across owned relics (default 0). */
function passiveSum(registries, relicIds, key) {
  let s = 0;
  for (const id of relicIds || []) {
    const p = registries.relics.get(id).passives;
    if (p && typeof p[key] === 'number') s += p[key];
  }
  return s;
}

/** True if any owned relic sets the boolean passive. */
function passiveFlag(registries, relicIds, key) {
  for (const id of relicIds || []) {
    const p = registries.relics.get(id).passives;
    if (p && p[key] === true) return true;
  }
  return false;
}

// ---------------------------------------------------------------------------
// Card resolution — definitions vs instances (SPEC §3.3, §4.3)
// ---------------------------------------------------------------------------

// Cache resolved upgrade merges per registries object.
const resolveCache = new WeakMap();

/**
 * resolveCard(registries, cardInstanceOrRef) → effective (frozen) card def.
 *
 * Accepts anything with { cardId, upgraded? }. For upgraded cards the
 * `upgrade` partial override is merged over the base def:
 *   - scalar fields (cost, textTemplate, ...) replace the base value
 *   - `effects` REPLACES the base effects array entirely when present
 *   - `keywords` REPLACES the base keywords entirely when present (list the
 *     full upgraded set — this is what lets an upgrade remove Exhaust)
 *   - `name` defaults to base name + '+'
 */
function resolveCard(registries, instanceOrRef) {
  const cardId = instanceOrRef.cardId;
  const base = registries.cards.get(cardId);
  const mods = instanceOrRef.mods;
  if (!instanceOrRef.upgraded && !(mods && mods.length)) return base;

  let cache = resolveCache.get(registries);
  if (!cache) {
    cache = new Map();
    resolveCache.set(registries, cache);
  }
  // Equipment numbers live on the INSTANCE (see model/loadout.js), so the key
  // has to include them — two Strikes can differ if one was drawn before a
  // mid-combat weapon swap and the other after.
  const key = `${cardId}|${instanceOrRef.upgraded ? 1 : 0}|${mods ? mods.join(',') : ''}`;
  const hit = cache.get(key);
  if (hit) return hit;

  let result = base;
  if (instanceOrRef.upgraded) result = mergeUpgrade(base);
  if (mods && mods.length) {
    const eq = registries.equipment || {};
    result = deepFreeze(
      applyCardMods(result, mods, {
        modFields: eq.modFields || {},
        limits: (registries.balance.equipment || {}).limits || {},
      })
    );
  }
  cache.set(key, result);
  return result;
}

/** The upgrade half of resolveCard, split out so mods can layer on top. */
function mergeUpgrade(base) {
  const up = base.upgrade || {};
  return deepFreeze({
    ...base,
    ...up,
    name: up.name != null ? up.name : `${base.name}+`,
    keywords: up.keywords != null ? up.keywords : base.keywords || [],
    effects: up.effects != null ? up.effects : base.effects,
    textTemplate: up.textTemplate != null ? up.textTemplate : base.textTemplate,
    upgraded: true,
  });
}


Object.assign(module.exports, { deepFreeze, createRegistries, passiveMult, passiveSum, passiveFlag, resolveCard });

},
"src/model/loadout.js": function (module, exports, require) {
// src/model/loadout.js — what you carry, and what it does to your cards.
//
// The design rule (SPEC §3.1(2)) is that equipment may not add behaviour the
// engine doesn't already have. So a piece never ships an effect: it ships
// NUMBERS aimed at the cards you already start with. A dagger doesn't give you
// a dagger card — it turns Strike into 3 damage twice. A greatsword turns the
// same Strike into one heavy, expensive swing. The deck size never changes,
// and the engine never learns the word "dagger".
//
// Three tables do all the deciding, none of them in this file:
//   equipSlots.csv    what slots exist, how many sets each carries, swap rules
//   equipMods.csv     which fields a mod may name and how each one applies
//   equipTargets.csv  which card each mod prefix rewrites, per class
//
// Everything here is headless and pure: no document, no timers, no randomness.

// ---------------------------------------------------------------------------
// Mod strings
// ---------------------------------------------------------------------------

/**
 * parseMod('strike.damage=+4') → { prefix, field, mode: 'add'|'set', value }
 * Returns null on anything malformed; validateEquipment() reports those.
 */
function parseMod(str) {
  const m = /^([A-Za-z]\w*)\.([A-Za-z]\w*)=([+-]?)(\d+(?:\.\d+)?)$/.exec(String(str).trim());
  if (!m) return null;
  const [, prefix, field, sign, num] = m;
  return {
    prefix,
    field,
    mode: sign ? 'add' : 'set',
    value: sign === '-' ? -Number(num) : Number(num),
  };
}

/**
 * validateEquipment(registries) → [] when sound, else human-readable problems.
 * Catches the mistakes CSV authoring actually makes: a misspelled field, a mod
 * aimed at a prefix no class maps to a card, a slot whose `kinds` gate matches
 * nothing, and armour that leaves a class with no starting set (or two).
 */
function validateEquipment(registries) {
  const eq = registries.equipment || {};
  const fields = eq.modFields || {};
  const problems = [];
  const pieces = [...(eq.armaments || []), ...(eq.armour || [])];

  for (const piece of pieces) {
    for (const raw of piece.mods || []) {
      const mod = parseMod(raw);
      if (!mod) {
        problems.push(`${piece.id}: unparseable mod '${raw}'`);
        continue;
      }
      const spec = fields[mod.field];
      if (!spec) {
        problems.push(`${piece.id}: unknown mod field '${mod.field}' (register it in equipMods.csv)`);
        continue;
      }
      if (spec.scope === 'run' && mod.prefix !== 'self') {
        problems.push(`${piece.id}: '${mod.field}' is a run mod and must be written as 'self.${mod.field}'`);
      }
      if (spec.scope === 'card' && !(eq.cardTargets || []).includes(mod.prefix)) {
        problems.push(`${piece.id}: '${mod.prefix}' is not a card target (add it to equipTargets.csv)`);
      }
      if (spec.status && !registries.statuses.has(spec.status)) {
        problems.push(`equipMods.csv: field '${mod.field}' names unknown status '${spec.status}'`);
      }
    }
  }

  const kinds = new Set(pieces.map((p) => p.kind));
  for (const slot of eq.slots || []) {
    if (slot.kinds.length === 0) problems.push(`slot '${slot.id}' gates on no kinds`);
  }
  for (const kind of kinds) {
    const fits = (eq.slots || []).some((s) => s.kinds.includes(kind));
    if (!fits) problems.push(`no slot accepts pieces of kind '${kind}'`);
  }

  for (const classId of registries.classes.ids()) {
    const sets = (eq.armour || []).filter((o) => o.classId === classId);
    const starting = sets.filter((o) => o.unlock === '');
    if (starting.length !== 1) {
      problems.push(`class '${classId}' has ${starting.length} starting armour sets (need exactly 1)`);
    }
  }
  return problems;
}

// ---------------------------------------------------------------------------
// Loadout shape
// ---------------------------------------------------------------------------

/**
 * createLoadout(registries, classId) → a fresh loadout.
 *
 *   { sets: { slotId: [itemId|null × slot.sets] },
 *     active: { slotId: index },
 *     storage: [itemId] }
 *
 * Slots come from the table, so adding a row to equipSlots.csv adds a slot to
 * every new run with no change here. You start bare-handed in your class's one
 * unlocked armour set — the run is meant to arm you.
 */
function createLoadout(registries, classId) {
  const eq = registries.equipment || {};
  const sets = {};
  const active = {};
  for (const slot of eq.slots || []) {
    sets[slot.id] = new Array(Math.max(1, slot.sets)).fill(null);
    active[slot.id] = 0;
  }
  const starting = (eq.armour || []).find((o) => o.classId === classId && o.unlock === '');
  if (starting && sets.armor) sets.armor[0] = starting.id;
  return { sets, active, storage: [] };
}

/** The piece in a slot's active set, or null. Armour resolves per class. */
function equippedIn(registries, loadout, classId, slotId) {
  const ids = (loadout.sets || {})[slotId] || [];
  const id = ids[(loadout.active || {})[slotId] || 0];
  if (!id) return null;
  const eq = registries.equipment || {};
  const slot = (eq.slots || []).find((s) => s.id === slotId);
  if (slot && slot.kinds.includes('armor')) {
    return (eq.armour || []).find((o) => o.classId === classId && o.id === id) || null;
  }
  return (eq.armaments || []).find((a) => a.id === id) || null;
}

/** Every currently-worn piece, in slot order — the order mods apply in. */
function equippedPieces(registries, loadout, classId) {
  if (!loadout) return [];
  const out = [];
  for (const slot of (registries.equipment || {}).slots || []) {
    const piece = equippedIn(registries, loadout, classId, slot.id);
    if (piece) out.push(piece);
  }
  return out;
}

/** Tags granted by what you're wearing (deduplicated, slot order). */
function loadoutTags(registries, loadout, classId) {
  const seen = [];
  for (const p of equippedPieces(registries, loadout, classId)) {
    for (const t of p.tags || []) if (!seen.includes(t)) seen.push(t);
  }
  return seen;
}

/** A short string that changes whenever the worn set does — for cache keys. */
function loadoutSignature(loadout) {
  if (!loadout) return '';
  return Object.keys(loadout.sets || {})
    .sort()
    .map((k) => `${k}:${(loadout.sets[k] || [])[(loadout.active || {})[k] || 0] || '-'}`)
    .join('|');

// ---------------------------------------------------------------------------
// Collecting mods
// ---------------------------------------------------------------------------

/**
 * cardMods(registries, loadout, classId) → Map(cardId → ['damage=+4', ...]).
 * The prefix is dropped because it has already done its job (choosing the
 * card); order is slot order, and the applier honours it.
 */
function cardMods(registries, loadout, classId) {
  const eq = registries.equipment || {};
  const fields = eq.modFields || {};
  const out = new Map();
  for (const piece of equippedPieces(registries, loadout, classId)) {
    for (const raw of piece.mods || []) {
      const mod = parseMod(raw);
      const spec = mod && fields[mod.field];
      if (!spec || spec.scope !== 'card') continue;
      const cardId = cardForTarget(eq, mod.prefix, classId);
      if (!cardId) continue;
      const list = out.get(cardId) || [];
      list.push(`${mod.field}=${mod.mode === 'add' ? (mod.value >= 0 ? '+' : '') : ''}${mod.value}`);
      out.set(cardId, list);
    }
  }
  return out;
}

function cardForTarget(eq, target, classId) {
  const rows = eq.targets || [];
  const exact = rows.find((t) => t.target === target && t.classId === classId);
  if (exact) return exact.cardId;
  const any = rows.find((t) => t.target === target && t.classId === '*');
  return any ? any.cardId : null;
}

/**
 * runMods(registries, loadout, classId) → { maxHp, startStatuses: [{status, stacks}] }
 * The `self.*` half of the vocabulary: things a piece does to you rather than
 * to a card. startStatuses are handed straight to createCombat's existing
 * playerStatuses hook, so the engine needs no equipment code to honour them.
 */
function runMods(registries, loadout, classId) {
  const fields = (registries.equipment || {}).modFields || {};
  const stacks = new Map();
  let maxHp = 0;
  for (const piece of equippedPieces(registries, loadout, classId)) {
    for (const raw of piece.mods || []) {
      const mod = parseMod(raw);
      const spec = mod && fields[mod.field];
      if (!spec || spec.scope !== 'run') continue;
      if (spec.apply === 'maxHp') {
        maxHp = mod.mode === 'add' ? maxHp + mod.value : mod.value;
      } else if (spec.apply === 'startStatus') {
        const prev = stacks.get(spec.status) || 0;
        stacks.set(spec.status, mod.mode === 'add' ? prev + mod.value : mod.value);
      }
    }
  }
  return {
    maxHp,
    startStatuses: [...stacks].filter(([, n]) => n > 0).map(([status, n]) => ({ status, stacks: n })),

}

// ---------------------------------------------------------------------------
// Applying mods to a card
// ---------------------------------------------------------------------------

const TOKEN_RE = /\{([A-Za-z][\w.]*)\}/g;

function firstIndexOfOp(effects, op) {
  return effects.findIndex((e) => e && e.op === op);
}

function adjust(current, mod, floor) {
  const next = mod.mode === 'add' ? (typeof current === 'number' ? current : 0) + mod.value : mod.value;
  return floor == null ? next : Math.max(floor, next);
}

/**
 * applyCardMods(def, mods, opts) → a new card def, or `def` unchanged.
 *
 *   mods = ['damage=+4', 'hits=2', 'cost=+1']   (prefix already stripped)
 *   opts = { modFields, limits }
 *
 * Mods apply in order, so a later `=N` genuinely replaces an earlier `+N` —
 * that's what lets a Tower Shield's flat block override a smaller bonus rather
 * than stacking with it. Formula-valued amounts are left alone: a piece may
 * change a number, never the shape of an effect.
 */
function applyCardMods(def, mods, opts = {}) {
  if (!mods || !mods.length) return def;
  const fields = opts.modFields || {};
  const limits = opts.limits || {};
  const effects = (def.effects || []).map((e) => ({ ...e }));
  let cost = def.cost;
  const touched = [];

  for (const raw of mods) {
    const mod = parseMod(`x.${raw}`);
    const spec = mod && fields[mod.field];
    if (!spec) continue;
    touched.push(spec);

    if (spec.apply === 'cost') {
      cost = adjust(cost, mod, limits.minCost != null ? limits.minCost : 0);
      continue;
    }
    if (spec.apply === 'scale') {
      for (const e of effects) {
        if (typeof e.amount === 'number') e.amount = Math.max(0, e.amount + mod.value);
        if (typeof e.stacks === 'number') e.stacks = Math.max(0, e.stacks + mod.value);
      }
      continue;
    }
    if (spec.apply === 'amount') {
      const i = firstIndexOfOp(effects, spec.op);
      const floor = spec.op === 'damage' ? limits.minDamage : spec.op === 'block' ? limits.minBlock : 0;
      if (i === -1) {
        if (mod.value > 0) effects.push({ op: spec.op, target: spec.effTarget, amount: mod.value });
      } else if (typeof effects[i].amount === 'number') {
        effects[i].amount = adjust(effects[i].amount, mod, floor != null ? floor : 0);
      }
      continue;
    }
    if (spec.apply === 'hits') {
      const i = firstIndexOfOp(effects, spec.op);
      if (i === -1) continue;
      const max = limits.maxHits != null ? limits.maxHits : 99;
      const n = adjust(effects[i].hits != null ? effects[i].hits : 1, mod, 1);
      effects[i].hits = Math.min(max, n);
      continue;
    }
    if (spec.apply === 'status') {
      const i = effects.findIndex((e) => e && e.op === 'applyStatus' && e.status === spec.status);
      if (i === -1) {
        if (mod.value > 0) {
          effects.push({ op: 'applyStatus', target: spec.effTarget, status: spec.status, stacks: mod.value });
        }
      } else if (typeof effects[i].stacks === 'number') {
        effects[i].stacks = adjust(effects[i].stacks, mod, 0);
      }
    }
  }

  // Rules text: numbers already in the template re-bind on their own (the UI
  // reads tokens off the effects). A mod that introduced something the text
  // never mentioned gets its clause appended, so a burning Strike says so.
  let textTemplate = def.textTemplate;
  const present = new Set();
  let m;
  TOKEN_RE.lastIndex = 0;
  while ((m = TOKEN_RE.exec(textTemplate || '')) !== null) present.add(m[1]);
  for (const spec of touched) {
    if (!spec.clause) continue;
    TOKEN_RE.lastIndex = 0;
    const tok = TOKEN_RE.exec(spec.clause);
    if (!tok || present.has(tok[1])) continue;
    present.add(tok[1]);
    textTemplate = `${textTemplate} ${spec.clause}`.trim();
  }

  return { ...def, cost, effects, textTemplate, equipMods: mods };
}

// ---------------------------------------------------------------------------
// Stamping the deck
// ---------------------------------------------------------------------------

/**
 * stampDeck(registries, run, cards) → number of instances re-stamped.
 *
 * Card instances carry their equipment numbers as `inst.mods`, which is what
 * makes the whole system fall out of the existing architecture: resolveCard
 * already turns an instance into a def, saves already serialize instances, and
 * co-op already ships instances between seats. Nothing else had to learn about
 * equipment.
 *
 * Re-stamping is idempotent, so calling it after every swap is safe. Pass
 * `cards` to stamp a hand mid-combat; it defaults to the run deck.
 */
function stampDeck(registries, run, cards) {
  const list = cards || run.deck || [];
  const mods = cardMods(registries, run.loadout, run.class);
  let n = 0;
  for (const inst of list) {
    const next = mods.get(inst.cardId) || [];
    const prev = inst.mods || [];
    if (next.length === prev.length && next.every((v, i) => v === prev[i])) continue;
    if (next.length) inst.mods = next;
    else delete inst.mods;
    n += 1;
  }
  return n;
}

// ---------------------------------------------------------------------------
// Swapping
// ---------------------------------------------------------------------------

/**
 * canSwap(registries, slotId, { inCombat }) → { ok, reason }.
 * The rule lives in equipSlots.csv (`swap`): hands may be changed mid-fight at
 * a price, armour and talismans may not. Storage is sealed in combat too — you
 * cycle between the sets you brought, you don't rummage.
 */

  if (inCombat && slot.swap !== 'combat') {
    return { ok: false, reason: `${slot.label} can only be changed outside combat.` };
  }
  return { ok: true, reason: '' };
}

/** canDrawFromStorage — storage is sealed once a fight starts. */
function canUseStorage({ inCombat = false } = {}) {
  return !inCombat;
}

/**
 * cycleSet(loadout, slotId, index) → mutates the active set index.
 * Returns false when the slot or index doesn't exist.
 */
function cycleSet(loadout, slotId, index) {
  const ids = (loadout.sets || {})[slotId];
  if (!ids || index < 0 || index >= ids.length) return false;
  loadout.active[slotId] = index;
  return true;
}

function equipPiece(loadout, slotId, setIndex, itemId) {
  const ids = (loadout.sets || {})[slotId];
  if (!ids || setIndex < 0 || setIndex >= ids.length) return false;
  ids[setIndex] = itemId || null;
  return true;
}

"src/model/state.js": function (module, exports, require) {
// src/model/state.js — run/combat state factories + (de)serialization (SPEC §3.3, §3.12)
//
// State stores INSTANCE data referencing definitions by id only:
//   deck card  = { instanceId, cardId, upgraded }
//   enemy      = { instanceId→id, enemyId, hp, block, statuses{}, poiseMeter, movesHistory[] }
// Saves serialize instances + RNG counters, never definitions.
//
// Headless: no document/window/localStorage/timers.

const { createLoadout, runMods, stampDeck } = require("src/model/loadout.js");

const RUN_SCHEMA_VERSION = 1;

/** Deterministic instance-id generator ('p1', 'p2', ... for prefix 'p'). */
function createIdGen(prefix = 'i') {
  let n = 0;
  return () => `${prefix}${++n}`;
}

function createCardInstance(cardId, upgraded = false, idGen) {
  return { instanceId: idGen ? idGen() : `c_${cardId}_${Math.floor(Math.random() * 1e9)}`, cardId, upgraded: !!upgraded };
}

/** Build a deck of card instances from an array of card ids. */
function createDeck(cardIds, idGen = createIdGen('d')) {
  return cardIds.map((cardId) => createCardInstance(cardId, false, idGen));
}

// ---------------------------------------------------------------------------
// Run state (SPEC §3.12 save shape)
// ---------------------------------------------------------------------------

/**
 * createRunState({ seed, classId, registries }) → new run at floor 0, act 1.
 * Starting deck/relic/HP come from the class def; cinders from
 * balance.startingCinders (default 0).
 */
function createRunState({ seed, classId, registries }) {
  const classDef = registries.classes.get(classId);
  const idGen = createIdGen('rc');
  const loadout = createLoadout(registries, classId);
  // Armour can carry `self.maxHp`, so the pool it sets has to be known before
  // hp is filled — the run starts at full, in whatever it starts wearing.
  const maxHp = classDef.maxHp + runMods(registries, loadout, classId).maxHp;
  const run = {
    schemaVersion: RUN_SCHEMA_VERSION,
    contentVersion: registries.contentVersion,
    seed: seed >>> 0,
    streamCounters: {},
    class: classId,
    floor: 0,
    actNumber: 1,
    mapNodeId: null,
    hp: maxHp,
    maxHp,
    cinders: registries.balance.startingCinders || 0,
    deck: createDeck(classDef.startingDeck, idGen),
    loadout,
    relics: [classDef.startingRelic],
    flasks: [], // [{ flaskId }] — max slots from balance.flaskSlots (default 3)
    seedString: null, // set by the orchestrator right after creation (display/replay)
    mapGraph: null,
    combatEntered: null,
    history: [],
    modifiers: [], // ascension-style seam (SPEC §10); always empty in v1
  };
  // Stamp the starting deck with whatever the loadout says. Bare-handed this
  // is a no-op; in an armour set with `defend.block=+2` it is already true of
  // the very first Defend you draw.
  stampDeck(registries, run);
  return run;
}

/**
 * The persisted run shape, declared once (SPEC §3.12). Keeps the save contract
 * data-driven instead of implied by whatever createRunState happens to set, and
 * gives deserializeRun something to check so a parseable-but-malformed save is
 * refused at load (→ save.js archives it) rather than crashing mid-run.
 *
 * `nullable` fields are legitimately null before their first use. Unlisted keys
 * are allowed through untouched — this is a floor, not a whitelist.
 */
const RUN_SHAPE = [
  { key: 'contentVersion', type: 'string' },
  { key: 'seed', type: 'number' },
  { key: 'streamCounters', type: 'object' },
  { key: 'class', type: 'string' },
  { key: 'floor', type: 'number' },
  { key: 'actNumber', type: 'number' },
  { key: 'hp', type: 'number' },
  { key: 'maxHp', type: 'number' },
  { key: 'cinders', type: 'number' },
  { key: 'deck', type: 'array' },
  { key: 'relics', type: 'array' },
  { key: 'flasks', type: 'array' },
  { key: 'history', type: 'array' },
  { key: 'modifiers', type: 'array' },
  // Optional so a run saved before equipment existed still loads; save.js
  // heals it with a fresh loadout rather than refusing the save.
  { key: 'loadout', type: 'object', optional: true },
  { key: 'seedString', type: 'string', nullable: true },
  { key: 'mapNodeId', type: 'string', nullable: true },
  { key: 'mapGraph', type: 'object', nullable: true },
  { key: 'combatEntered', type: 'object', nullable: true },
];

function typeOk(value, type) {
  if (type === 'array') return Array.isArray(value);
  if (type === 'object') return value !== null && typeof value === 'object' && !Array.isArray(value);
  return typeof value === type; // 'string' | 'number'
}

/** validateRunShape(run) → [] when sound, else a list of human-readable problems. */
function validateRunShape(run) {
  const problems = [];
  for (const f of RUN_SHAPE) {
    const v = run[f.key];
    if (v === undefined) {
      if (!f.optional) problems.push(`missing '${f.key}'`);
      continue;
    }
    if (v === null) {
      if (!f.nullable) problems.push(`'${f.key}' is null`);
      continue;
    }
    if (!typeOk(v, f.type)) problems.push(`'${f.key}' should be ${f.type}`);
  }
  // Deck entries are the ids the run is rebuilt from — the one nested shape
  // worth checking, since a bad entry breaks combat rather than the load.
  if (Array.isArray(run.deck)) {
    const bad = run.deck.findIndex((c) => !c || typeof c.cardId !== 'string' || typeof c.instanceId !== 'string');
    if (bad !== -1) problems.push(`deck[${bad}] is not { instanceId, cardId }`);
  }
  if (Number.isFinite(run.hp) && Number.isFinite(run.maxHp) && run.maxHp <= 0) {
    problems.push('maxHp must be > 0');
  }
  return problems;
}

function serializeRun(run) {
  return JSON.stringify(run);
}

/**
 * deserializeRun(json) → run object. Throws on parse failure, unknown
 * schemaVersion, or a run that doesn't match RUN_SHAPE (save.js turns any
 * throw here into an archive-and-refuse, so a bad save is never silently lost).
 */
function deserializeRun(json) {
  const run = JSON.parse(json);
  if (!run || typeof run !== 'object') throw new Error('Corrupt run save');
  if (run.schemaVersion !== RUN_SCHEMA_VERSION) {
    throw new Error(`Unknown run schemaVersion ${run.schemaVersion} (expected ${RUN_SCHEMA_VERSION})`);
  }
  const problems = validateRunShape(run);
  if (problems.length) throw new Error(`Malformed run save: ${problems.join('; ')}`);
  return run;
}

// ---------------------------------------------------------------------------
// Combat entities (instances reference defs by id — SPEC §3.3)
// ---------------------------------------------------------------------------

/**
 * Player combat entity. statuses: { [statusId]: { stacks, duration?, meter? } }.
 */
function createPlayerCombatEntity({ classId, maxHp, hp, relicIds = [], flasks = [], energyMax = 3 }) {
  return {
    id: 'player',
    kind: 'player',
    classId,
    hp: hp != null ? hp : maxHp,
    maxHp,
    block: 0,
    energy: 0,
    energyMax,
    statuses: {},
    stanceId: null,
    relicIds: [...relicIds],
    flasks: flasks.map((f) => ({ ...f })),
    counters: {
      cardsPlayedThisTurn: 0,
      cardsPlayedThisCombat: 0,
      attacksPlayedThisCombat: 0,
    },
    alive: true,
  };
}

/**
 * Enemy combat entity. `poiseMeter` is the engine-level build-up meter fed by
 * the poiseDamage opcode (SPEC §3.7, §4.4); everything else about Stagger is
 * content data.
 */
function createEnemyCombatEntity({ instanceId, enemyId, hp, poiseMax }) {
  return {
    id: instanceId,
    kind: 'enemy',
    enemyId,
    hp,
    maxHp: hp,
    block: 0,
    statuses: {},
    poiseMeter: { value: 0, max: poiseMax },
    movesHistory: [],
    intent: null,
    pendingMove: null, // delayed-move commitment: { moveId, resolveOnTurn }
    skipNextTurn: false, // set by a poise-meter fill; consumed by the enemy turn
    unlockedMoves: [],
    alive: true,
  };
}


Object.assign(module.exports, { RUN_SCHEMA_VERSION, createIdGen, createCardInstance, createDeck, createRunState, RUN_SHAPE, validateRunShape, serializeRun, deserializeRun, createPlayerCombatEntity, createEnemyCombatEntity });

},
"src/content/customMods.js": function (module, exports, require) {
// src/content/customMods.js — Custom Climb modifiers (data only).
//
// Tuning magnitudes live in balance.js (balance.endless / balance.customMods);
// the endless constants below re-export from there so there is one source.
//
// A tailored take on Slay the Spire 2's custom mode. Three groups:
//   • DIFFICULTY — harder rules; the Ascension ladder just enables the first N
//     of these in ASCENSION_ORDER, so "Ascension 4" == the four hardest-first
//     rules, and every rule is also individually toggleable.
//   • CHAOS — flavourful run-warping toggles, independent of difficulty.
//   • DECK_MODES — how your starting deck is built.
// The orchestrator (main.js) reads run.custom.mods[id] at the relevant hook;
// nothing here is engine-specific.

const { balance } = require("src/content/balance.js");

const DIFFICULTY_MODS = [
  { id: 'toughElites', label: 'Tough Elites', desc: 'Elites and bosses have +30% HP.' },
  { id: 'lessHealing', label: 'Scarce Embers', desc: 'Shrine rest and between-act healing are halved.' },
  { id: 'deadlyEnemies', label: 'Deadly Foes', desc: 'Every enemy begins combat with +1 Strength.' },
  { id: 'cursedStart', label: 'Cursed Start', desc: 'Begin the run with a Guilt curse shuffled into your deck.' },
  { id: 'expensiveShops', label: 'Greedy Merchants', desc: 'Shop prices are 50% higher.' },
  { id: 'bigBosses', label: 'Dread Bosses', desc: 'Act bosses have +50% HP.' },
];

const CHAOS_MODS = [
  { id: 'allElite', label: 'Elite Gauntlet', desc: 'Every monster node is an Elite fight.' },
  { id: 'hoarder', label: 'Hoarder', desc: 'Start with +250 cinders — but every shop price doubles.' },
  { id: 'chaosRewards', label: 'Chaos Rewards', desc: 'Card rewards ignore rarity: rares everywhere.' },
  { id: 'glassCannon', label: 'Glass Cannon', desc: 'You deal +25% damage, but take +25% damage.' },
  { id: 'endless', label: 'Endless Spire', desc: 'After Act 3 the spire loops — each cycle, foes gain HP and Strength. Only death ends the climb.' },
];

const DECK_MODES = [
  { id: 'standard', label: 'Standard', desc: "Your class's normal starting deck." },
  { id: 'sealed', label: 'Sealed', desc: 'A random starting deck drawn from your class pool.' },
  { id: 'draft', label: 'Draft', desc: 'Draft your starting deck card by card.' },
];

// Ascension enables the first N difficulty rules (hardest impact first).
const ASCENSION_ORDER = [
  'toughElites',
  'deadlyEnemies',
  'lessHealing',
  'bigBosses',
  'cursedStart',
  'expensiveShops',
];
const MAX_ASCENSION = ASCENSION_ORDER.length;

const ALL_MODS = [...DIFFICULTY_MODS, ...CHAOS_MODS];

// True when a run carries any non-default rule (so it is flagged + excluded
// from win-rate telemetry).
function isCustomRun(custom) {
  if (!custom) return false;
  if (custom.ascension > 0) return true;
  if (custom.deckMode && custom.deckMode !== 'standard') return true;
  return !!(custom.mods && Object.values(custom.mods).some(Boolean));
}

// Acts beyond 3 reuse the content of act ((n-1) % 3) + 1; `loop` counts
// completed 3-act cycles (0 on the first pass) and drives per-cycle scaling.
// Pure math so main.js, runsim, and tests all agree on the same numbers.
const ENDLESS_HP_PER_LOOP = balance.endless.hpPerLoop;
const ENDLESS_STR_PER_LOOP = balance.endless.strPerLoop;

function endlessActInfo(actNumber) {
  const per = balance.endless.actsPerCycle;
  return { contentAct: ((actNumber - 1) % per) + 1, loop: Math.floor((actNumber - 1) / per) };
}

// Resolve the effective active-mod set: explicit toggles OR ascension-enabled.
function activeMods(custom) {
  const out = { ...((custom && custom.mods) || {}) };
  const asc = (custom && custom.ascension) || 0;
  for (let i = 0; i < asc && i < ASCENSION_ORDER.length; i++) out[ASCENSION_ORDER[i]] = true;
  return out;
}


Object.assign(module.exports, { DIFFICULTY_MODS, CHAOS_MODS, DECK_MODES, ASCENSION_ORDER, MAX_ASCENSION, ALL_MODS, isCustomRun, ENDLESS_HP_PER_LOOP, ENDLESS_STR_PER_LOOP, endlessActInfo, activeMods });

},
"src/engine/rng.js": function (module, exports, require) {
// src/engine/rng.js — mulberry32 PRNG + named streams with saved counters (SPEC §3.11)
//
// Every stream is independently derived from (run seed, stream salt, counter).
// mulberry32's internal state advances by a fixed constant per draw, so the
// value at counter i is computable in O(1): restoring a saved counter is exact
// and cheap. Counters are serialized with the run (SPEC §3.12).
//
// Headless: no document/window/localStorage/timers.

const STREAM_NAMES = Object.freeze([
  'map',
  'shuffle',
  'cardRewards',
  'relicRewards',
  'flaskRewards',
  'enemyAI',
  'enemyHP',
  'events',
  'shop',
  'misc',
]);

const MULBERRY_INC = 0x6d2b79f5;

/**
 * Classic mulberry32 (public domain). Returns a () => float in [0, 1).
 */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function next() {
    a = (a + MULBERRY_INC) | 0;
    return scramble(a);
  };
}

// The mulberry32 output scramble applied to an accumulator value.
function scramble(a) {
  let t = a | 0;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

// FNV-1a string hash → uint32 (used as the per-stream salt).
function hashString(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}

// Value of stream (base) at draw index i (1-based), identical to calling
// mulberry32(base) i times.
function valueAt(base, i) {
  return scramble((base + Math.imul(i, MULBERRY_INC)) | 0);
}

/**
 * createRng(seed, counters?) → named-stream RNG (SPEC §3.11).
 *
 * - seed: uint32 run seed.
 * - counters: optional { streamName: drawCount } restored from a save.
 *
 * API (all `stream` arguments must be one of STREAM_NAMES, else throws):
 *   float(stream)              → number in [0, 1)
 *   int(stream, min, max)      → integer in [min, max] inclusive
 *   pick(stream, array)        → element
 *   shuffle(stream, array)     → NEW shuffled array (Fisher–Yates)
 *   chance(stream, pct)        → boolean, true with pct% probability
 *   getCounters()              → plain { streamName: count } snapshot (save this)
 *   seed                       → the uint32 seed
 */
function createRng(seed, counters = {}) {
  const s = seed >>> 0;

  const bases = {};
  for (const name of STREAM_NAMES) {
    state[name] = (counters[name] || 0) >>> 0;
    bases[name] = (s ^ hashString(name)) >>> 0;
  }

  function assertStream(name) {
    if (!(name in state)) {
      throw new Error(`Unknown RNG stream '${name}'. Valid streams: ${STREAM_NAMES.join(', ')}`);
    }
  }

    seed: s,
    float(stream) {
      assertStream(stream);
      state[stream] = (state[stream] + 1) >>> 0;
      return valueAt(bases[stream], state[stream]);
    },
    int(stream, min, max) {
      if (max < min) throw new Error(`rng.int: max (${max}) < min (${min})`);
      const r = rng.float(stream);
      return min + Math.floor(r * (max - min + 1));
    },
    pick(stream, array) {

      }
      return array[Math.floor(rng.float(stream) * array.length)];
    },
    shuffle(stream, array) {
      const out = array.slice();
      for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(rng.float(stream) * (i + 1));
        const tmp = out[i];
        out[i] = out[j];
        out[j] = tmp;
      }
      return out;
    },
    chance(stream, pct) {
      return rng.float(stream) * 100 < pct;
    },
    getCounters() {
      const out = {};
      for (const name of STREAM_NAMES) out[name] = state[name];
      return out;
    },
  };
  return rng;
}

// ---------------------------------------------------------------------------
// Seed display — base-35 like StS (alphabet omits 'O' to avoid 0/O confusion).
// ---------------------------------------------------------------------------

const SEED_ALPHABET = '0123456789ABCDEFGHIJKLMNPQRSTUVWXYZ'; // 35 chars, no O

function seedToString(seed) {
  let n = seed >>> 0;
  if (n === 0) return '0';
  let out = '';
  while (n > 0) {
    out = SEED_ALPHABET[n % 35] + out;
    n = Math.floor(n / 35);
  }
  return out;
}

function seedFromString(str) {
  const cleaned = String(str).trim().toUpperCase().replace(/O/g, '0');
  let n = 0;
  for (const ch of cleaned) {
    const v = SEED_ALPHABET.indexOf(ch);
    if (v < 0) throw new Error(`Invalid seed character '${ch}'`);
    n = (n * 35 + v) >>> 0;
  }
  return n >>> 0;
}

"src/engine/combat.js": function (module, exports, require) {
// src/engine/combat.js — action queue + turn loop (generic interpreter)
// (SPEC §3.9, §4.1–§4.3, §4.6)
//
// Public API (see docs/ENGINE-API.md):
//   createCombat({ registries, rng, player, enemyIds })  → combat state
//   dispatch(combat, intent)                             → { events }
//   previewCard(combat, cardInstanceId, targetId?)       → resolved numbers
//   previewIntent(combat, enemyInstanceId)               → live intent numbers
//   getEntity(combat, id)                                → entity or null
//
// The engine contains no entity-specific code: all behavior is content data
// composed of the closed primitive sets (design law §3.1(2)).
//
// Headless: no document/window/localStorage/timers.

const A = require("src/engine/actions.js");
const { emitEvent, fireOwnerHooks, findEntity } = require("src/engine/triggers.js");
const S = require("src/engine/statuses.js");
const { resolveCard, passiveSum, passiveMult } = require("src/model/registries.js");
const { evaluate } = require("src/model/formulas.js");
const { computeTokenBindings } = require("src/model/validate.js");
const { createPlayerCombatEntity, createEnemyCombatEntity } = require("src/model/state.js");
const { canSwap, cycleSet, stampDeck } = require("src/model/loadout.js");

const QUEUE_GUARD = 10000;

// ---------------------------------------------------------------------------
// createCombat
// ---------------------------------------------------------------------------

/**
 * createCombat({ registries, rng, player, enemyIds }) → combat state.
 *
 *   player = { classId, maxHp, hp, deck: [{ instanceId, cardId, upgraded }],
 *              relicIds: [], flasks?: [{ flaskId }] }
 *   enemyIds = [enemy def ids in row order] (instances get ids 'e1', 'e2', ...)
 *
 * Runs the full combat-start sequence (SPEC §4.1(1–2)): enemy HP rolled on
 * stream 'enemyHP', deck shuffled on 'shuffle' with Innate cards on top,
 * combatStart triggers fired, initial intents rolled ('enemyAI'), then the
 * first player turn starts (energy set, 5 drawn, playerTurnStart triggers).
 * Setup events are in combat.eventLog.
 */
function createCombat({ registries, rng, player, enemyIds, hpMult = 1, enemyStatuses = [], playerStatuses = [] }) {
  const bal = registries.balance || {};
  const combat = {
    registries,
    rng,
    turn: 0,
    phase: 'setup', // 'player' | 'enemy' | 'ended'
    result: null, // null | 'victory' | 'defeat'
    handMax: bal.handMax != null ? bal.handMax : 10,
    drawPerTurn: bal.draw != null ? bal.draw : 5,
    player: createPlayerCombatEntity({
      classId: player.classId,
      maxHp: player.maxHp,
      hp: player.hp,
      relicIds: player.relicIds || [],
      flasks: player.flasks || [],
      energyMax: bal.energy != null ? bal.energy : 3,
    }),
    enemies: [],
    // The SAME object the run holds, not a copy: a weapon swapped mid-fight is
    // still swapped when the fight ends.
    loadout: player.loadout || null,
    swapsLeft: 0,
    piles: { draw: [], hand: [], discard: [], exhaust: [] },
    queue: [],
    eventLog: [],
    _buffer: null,
    triggerState: new Map(),
    _idCounter: 0,
    _emitDepth: 0,
  };
  combat.emit = (type, payload) => emitEvent(combat, type, payload);
  combat.enqueue = (action) => combat.queue.push(action);
  combat.nextInstanceId = () => `gen${++combat._idCounter}`;

  // Enemies — HP rolled on stream 'enemyHP' (SPEC §3.11, §4.6). An optional
  // hpMult (Custom Climb difficulty rules) scales the rolled HP after the roll,
  // so the same seed rolls the same base then scales — determinism preserved.
  enemyIds.forEach((enemyId, i) => {
    const def = registries.enemies.get(enemyId);
    let hp = rng.int('enemyHP', def.hp[0], def.hp[1]);
    if (hpMult !== 1) hp = Math.max(1, Math.round(hp * hpMult));
    combat.enemies.push(
      createEnemyCombatEntity({ instanceId: `e${i + 1}`, enemyId, hp, poiseMax: def.poiseMax })
    );
    combat.emit('enemySpawned', { targetId: `e${i + 1}`, enemyId });
  });

  // Deck → draw pile: shuffle (stream 'shuffle'), Innate cards to top (§4.1(1)).
  const deck = player.deck.map((c) => ({
    instanceId: c.instanceId,
    cardId: c.cardId,
    upgraded: !!c.upgraded,
    // Equipment numbers ride on the instance (model/loadout.js) — copy them in
    // or every card would come back to its bare-handed self at combat start.
    ...(c.mods && c.mods.length ? { mods: [...c.mods] } : {}),
  }));
  const shuffled = rng.shuffle('shuffle', deck);
  const innate = [];
  const rest = [];
  for (const card of shuffled) {
    const def = resolveCard(registries, card);
    ((def.keywords || []).includes('innate') ? innate : rest).push(card);
  }
  combat.piles.draw = [...innate, ...rest];

  combat.emit('combatStart', {});
  // Optional Custom Climb buffs (generic — statuses are content ids, applied via
  // the same applyStatus opcode content uses, so no entity-specific engine code).
  for (const s of playerStatuses) {
    combat.enqueue({ effect: { op: 'applyStatus', target: 'self', status: s.status, stacks: s.stacks }, source: combat.player, owner: combat.player, target: combat.player, meta: {} });
  }
  for (const enemy of combat.enemies) {
    for (const s of enemyStatuses) {
      combat.enqueue({ effect: { op: 'applyStatus', target: 'self', status: s.status, stacks: s.stacks }, source: enemy, owner: enemy, target: enemy, meta: {} });
    }
  }
  drainQueue(combat);
  rollIntents(combat, true);
  if (!combat.result) startPlayerTurn(combat);
  return combat;
}

// ---------------------------------------------------------------------------
// Queue draining + end check (SPEC §3.9: queue drains fully before control
// returns to the UI)
// ---------------------------------------------------------------------------

function drainQueue(combat) {
  let guard = 0;
  while (combat.queue.length) {
    if (++guard > QUEUE_GUARD) {
      throw new Error('Action queue did not drain (possible infinite trigger loop)');
    }
    const action = combat.queue.shift();
    A.executeAction(combat, action);
    endCheck(combat);
    if (combat.result) {
      combat.queue.length = 0;
      return;
    }
  }
  endCheck(combat);
}

function endCheck(combat) {
  if (combat.result) return;
  if (!combat.player.alive || combat.player.hp <= 0) {
    finishCombat(combat, 'defeat');
  } else if (combat.enemies.length > 0 && combat.enemies.every((e) => !e.alive)) {
    finishCombat(combat, 'victory');
  }
}

function finishCombat(combat, result) {
  combat.result = result;
  combat.phase = 'ended';
  combat.queue.length = 0;
  combat.emit('combatEnd', { victory: result === 'victory' });
  combat.queue.length = 0; // combatEnd triggers cannot enqueue combat actions
}

// ---------------------------------------------------------------------------
// Turn loop (SPEC §4.1 — order contractual)
// ---------------------------------------------------------------------------

function startPlayerTurn(combat) {
  combat.turn += 1;
  combat.phase = 'player';
  const p = combat.player;
  p.counters.cardsPlayedThisTurn = 0;
  const eqcfg = combat.registries.balance.equipment || {};
  combat.swapsLeft = eqcfg.swapCostKind === 'allowance' ? eqcfg.swapAllowancePerTurn || 0 : 0;

  // (2) Lose all block — unless modified (generic 'retainBlock' modifier;
  // a 'blockCap' modifier clamps what is kept).
  if (!S.getFlag(combat, p, 'retainBlock')) {
    p.block = 0;
  } else {
    const cap = S.getCap(combat, p, 'blockCap');
    if (cap != null) p.block = Math.min(p.block, cap);
  }

  // Set energy to base (relics that add energy hook playerTurnStart).
  p.energy = p.energyMax;

  // Draw.
  A.drawCards(combat, combat.drawPerTurn);

  // playerTurnStart triggers + owner-relative status/stance hooks.
  combat.emit('playerTurnStart', { turn: combat.turn });
  fireOwnerHooks(combat, p, 'ownerTurnStart');
  drainQueue(combat);
}

function endPlayerTurn(combat) {
  const p = combat.player;

  // (4) playerTurnEnd triggers first…
  combat.emit('playerTurnEnd', { turn: combat.turn });
  fireOwnerHooks(combat, p, 'ownerTurnEnd');
  drainQueue(combat);
  if (combat.result) return;

  // …then player status decay (perTurnEnd statuses −1 stack at owner's turn end)…
  S.decayAtTurnEnd(combat, p);

  // …then discard hand except Retain; Ethereal cards exhaust instead.
  const keep = [];
  const toDiscard = [];
  const toExhaust = [];
  for (const card of combat.piles.hand) {
    const def = resolveCard(combat.registries, card);
    const kws = def.keywords || [];
    if (kws.includes('retain')) keep.push(card);
    else if (kws.includes('ethereal')) toExhaust.push(card);
    else toDiscard.push(card);
  }
  combat.piles.hand = keep;
  for (const card of toExhaust) {
    combat.piles.exhaust.push(card);
    combat.emit('cardExhausted', { cardInstanceId: card.instanceId, cardId: card.cardId, reason: 'ethereal' });
  }
  for (const card of toDiscard) {
    combat.piles.discard.push(card);
    combat.emit('cardDiscarded', { cardInstanceId: card.instanceId, cardId: card.cardId, reason: 'turnEnd' });
  }

  // Unspent energy is lost.
  p.energy = 0;
  drainQueue(combat);
}

function enemyPhase(combat) {
  combat.phase = 'enemy';
  combat.emit('enemyTurnStart', { turn: combat.turn });

  // (5) Enemies lose their block at the start of THEIR turn.
  for (const e of combat.enemies) {
    if (!e.alive) continue;
    if (!S.getFlag(combat, e, 'retainBlock')) e.block = 0;
  }
  drainQueue(combat);
  if (combat.result) return;

  for (const enemy of combat.enemies) {
    if (combat.result) return;
    if (!enemy.alive) continue;

    // Owner-relative turn-start hooks (DoT ticks etc.).
    fireOwnerHooks(combat, enemy, 'ownerTurnStart');
    drainQueue(combat);
    if (combat.result) return;
    if (!enemy.alive) continue;

    if (enemy.skipNextTurn || S.getFlag(combat, enemy, 'skipTurn')) {
      // Staggered / skip: the telegraphed move does not happen.
      enemy.skipNextTurn = false;
    } else if (enemy.pendingMove) {
      if (combat.turn >= enemy.pendingMove.resolveOnTurn) {
        // Delayed move resolving: the committed attack lands regardless of
        // newly rolled intents (SPEC §5.3 'Held Blade' pattern, generic data).
        const def = combat.registries.enemies.get(enemy.enemyId);
        const moveId = enemy.pendingMove.moveId;
        const move = def.moves[moveId];
        enemy.pendingMove = null;
        executeMovePayload(combat, enemy, move, moveId);
      }
      // else: still charging (delay.turns > 1) — the enemy does nothing.
    } else if (enemy.intent && enemy.intent.moveId) {
      const def = combat.registries.enemies.get(enemy.enemyId);
      const move = def.moves[enemy.intent.moveId];
      if (move.delay) {
        // Commit turn: telegraph stays, do the whileCharging part now,
        // resolve the real payload on a later enemy turn.
        const wc = (move.delay && move.delay.whileCharging) || {};
        if (wc.block != null) {
          combat.enqueue({
            effect: { op: 'block', target: 'self', amount: wc.block },
            source: enemy,
            owner: enemy,
            target: combat.player,
            meta: {},
          });
        }
        for (const eff of wc.effects || []) {
          combat.enqueue({ effect: eff, source: enemy, owner: enemy, target: combat.player, meta: {} });
        }
        enemy.pendingMove = {
          moveId: enemy.intent.moveId,
          resolveOnTurn: combat.turn + (move.delay.turns != null ? move.delay.turns : 1),
        };
        enemy.intent = { ...enemy.intent, pending: true };
      } else {
        executeMovePayload(combat, enemy, move, enemy.intent.moveId);
      }
    }
    drainQueue(combat);
    if (combat.result) return;

    // Owner-relative turn-end hooks, then decay (perTurnEnd statuses the
    // player applied to an enemy tick down at the ENEMY's turn end).
    if (enemy.alive) {
      fireOwnerHooks(combat, enemy, 'ownerTurnEnd');
      drainQueue(combat);
      if (combat.result) return;
      if (enemy.alive) S.decayAtTurnEnd(combat, enemy);
    }
  }

  combat.emit('enemyTurnEnd', { turn: combat.turn });
  drainQueue(combat);
}

// Enqueue a move's payload as ordinary actions (SPEC §3.9: only executed
// actions mutate). Order: damage hits, block, then effects.
// 'enemyMoveStarted' marks the acting enemy so the UI can pace playback
// one actor at a time (SPEC §7.4); content triggers may also key off it.
function executeMovePayload(combat, enemy, move, moveId) {
  combat.emit('enemyMoveStarted', { sourceId: enemy.id, enemyId: enemy.enemyId, moveId, kind: move.intent });
  if (move.damage != null) {
    combat.enqueue({
      effect: { op: 'damage', target: 'player', amount: move.damage, hits: move.hits != null ? move.hits : 1 },
      source: enemy,
      owner: enemy,
      target: combat.player,
      meta: { moveId },
    });
  }
  if (move.block != null) {
    combat.enqueue({
      effect: { op: 'block', target: 'self', amount: move.block },
      source: enemy,
      owner: enemy,
      target: combat.player,
      meta: { moveId },
    });
  }
  for (const eff of move.effects || []) {
    combat.enqueue({ effect: eff, source: enemy, owner: enemy, target: combat.player, meta: { moveId } });
  }
}

// ---------------------------------------------------------------------------
// Enemy move selection — weighted state machine + maxConsecutive (SPEC §4.6)
// ---------------------------------------------------------------------------

function rollIntents(combat, isFirstTurn = false) {
  for (const enemy of combat.enemies) {
    if (!enemy.alive) continue;
    if (enemy.pendingMove) {
      // A committed delayed move stays telegraphed until it resolves.
      if (enemy.intent) enemy.intent = { ...enemy.intent, pending: true };
      continue;
    }
    if (enemy.skipNextTurn || S.getFlag(combat, enemy, 'skipTurn')) {
      enemy.intent = { kind: 'staggered', moveId: null };
      continue;
    }
    const def = combat.registries.enemies.get(enemy.enemyId);
    let moveId;
    if (isFirstTurn && def.firstMove) {
      moveId = def.firstMove; // optional scripted opener
    } else {
      moveId = weightedMovePick(combat, enemy, def);
    }
    if (moveId == null) {
      enemy.intent = { kind: 'unknown', moveId: null };
      continue;
    }
    enemy.movesHistory.push(moveId);
    enemy.intent = buildIntent(def.moves[moveId], moveId);
  }
}

function weightedMovePick(combat, enemy, def) {
  const entries = Object.entries(def.moves).filter(
    ([id, mv]) => !mv.locked || enemy.unlockedMoves.includes(id)
  );
  if (entries.length === 0) return null;

  const eligible = entries.filter(([id, mv]) => {
    if (mv.maxConsecutive == null) return true;
    // Count the consecutive run of `id` at the tail of movesHistory.
    let run = 0;
    for (let i = enemy.movesHistory.length - 1; i >= 0; i--) {
      if (enemy.movesHistory[i] === id) run++;
      else break;
    }
    return run < mv.maxConsecutive;
  });
  const pool = eligible.length > 0 ? eligible : entries;

  const total = pool.reduce((acc, [, mv]) => acc + mv.weight, 0);
  if (total <= 0) return pool[0][0];
  let r = combat.rng.float('enemyAI') * total;
  for (const [id, mv] of pool) {
    r -= mv.weight;
    if (r < 0) return id;
  }
  return pool[pool.length - 1][0];
}

function buildIntent(move, moveId) {
  return {
    kind: move.intent,
    moveId,
    damage: move.damage != null ? move.damage : null,
    hits: move.damage != null ? (move.hits != null ? move.hits : 1) : null,
    block: move.block != null ? move.block : null,
    delayed: !!move.delay,
    pending: false,
  };
}

// ---------------------------------------------------------------------------
// dispatch — player intents (closed set for combat: playCard / endTurn / useFlask)
// ---------------------------------------------------------------------------

/**
 * dispatch(combat, intent) → { events } (the events emitted by this intent).
 *
 *   { type: 'playCard', cardInstanceId, targetId? }
 *   { type: 'endTurn' }
 *   { type: 'useFlask', slot, targetId? }
 *
 * Throws on illegal intents (wrong phase, unaffordable card, unknown ids).
 * The action queue drains fully before this returns (SPEC §3.9).
 */
function dispatch(combat, intent) {
  if (combat.result) throw new Error('Combat is over');
  combat._buffer = [];
  try {
    switch (intent.type) {
      case 'playCard':
        doPlayCard(combat, intent);
        break;
      case 'endTurn':
        doEndTurn(combat);
        break;
      case 'useFlask':
        doUseFlask(combat, intent);
        break;
      case 'swapArmament':
        doSwapArmament(combat, intent);
        break;
      default:
        throw new Error(`Unknown combat intent '${intent.type}'`);
    }
    return { events: combat._buffer };
  } finally {
    combat._buffer = null;
  }
}

/**
 * doSwapArmament — cycle a hand to another of its sets, mid-fight.
 *
 * Everything about the price is data (balance.equipment): what it costs, what
 * currency it costs in, whether the turn ends, and whether the cards already
 * in your hand are rewritten or only the ones you draw next. The engine's part
 * is small on purpose — it charges the price and re-stamps piles.
 */
function doSwapArmament(combat, { slotId, setIndex }) {
  if (combat.phase !== 'player') throw new Error('Armaments can only be swapped on your turn');
  const cfg = combat.registries.balance.equipment || {};
  if (!cfg.enabled) throw new Error('Equipment is disabled');
  if (!combat.loadout) throw new Error('This combat has no loadout');

  const allowed = canSwap(combat.registries, slotId, { inCombat: true });
  if (!allowed.ok) throw new Error(allowed.reason);

  const p = combat.player;
  if (cfg.swapCostKind === 'allowance') {
    if ((combat.swapsLeft || 0) < 1) throw new Error('No swaps left this turn');
  } else if (p.energy < cfg.swapCost) {
    throw new Error(`Swapping costs ${cfg.swapCost} Energy`);
  }

  if (!cycleSet(combat.loadout, slotId, setIndex)) throw new Error(`No set ${setIndex} on '${slotId}'`);

  if (cfg.swapCostKind === 'allowance') combat.swapsLeft -= 1;
  else p.energy -= cfg.swapCost;

  // The new numbers reach the draw and discard piles always; the hand only if
  // the config says a swap re-arms what you are already holding.
  const piles = [combat.piles.draw, combat.piles.discard];
  if (cfg.restampHand) piles.push(combat.piles.hand);
  const run = { deck: [], loadout: combat.loadout, class: p.classId };
  for (const pile of piles) stampDeck(combat.registries, run, pile);

  combat.emit('armamentSwapped', { slotId, setIndex });
  if (cfg.swapEndsTurn) doEndTurn(combat);
}

function needsEnemyTarget(def) {
  return (def.effects || []).some((eff) => eff.target === 'enemy');
}

// Effective numeric cost after relic passives (powerCostReduction, min 0).
// X-cost is unaffected (it always consumes all energy).
function effectiveCost(combat, def) {
  if (def.cost === 'X') return 'X';
  let cost = def.cost;
  if (def.type === 'power') {
    cost = Math.max(0, cost - passiveSum(combat.registries, combat.player.relicIds, 'powerCostReduction'));
  }
  return cost;
}

function doPlayCard(combat, { cardInstanceId, targetId }) {
  if (combat.phase !== 'player') throw new Error('Cards can only be played on the player turn');
  const p = combat.player;
  const idx = combat.piles.hand.findIndex((c) => c.instanceId === cardInstanceId);
  if (idx < 0) throw new Error(`Card '${cardInstanceId}' is not in hand`);
  const inst = combat.piles.hand[idx];
