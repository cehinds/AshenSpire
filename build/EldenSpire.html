    attachTooltip(b, () => `<div class="tt-title">Block ${v.block}</div>Absorbs attack damage. Expires at the start of the owner's turn.`);
    return b;
  }

  function renderPlayer() {
    const zone = $('.player-zone');
    zone.innerHTML = '';
    const p = combat.player;
    const box = document.createElement('div');
    box.className = 'combatant player';
    box.dataset.eid = 'player';
    const sprite = document.createElement('div');
    sprite.className = 'sprite';
    sprite.appendChild(playerSprite(run.customization || {}, run.class));
    const badge = blockBadge(p);
    if (badge) sprite.appendChild(badge);
    box.appendChild(sprite);
    box.appendChild(meterBars(p));
    if (p.stanceId) {
      const st = registries.stances.get(p.stanceId);
      const chip = document.createElement('div');
      chip.className = `stance-chip ${p.stanceId}`;
      chip.innerHTML = `${esc(st.icon || '')} ${esc(st.name)}`;
      attachTooltip(chip, () => `<div class="tt-title">${esc(st.name)}</div>${esc(st.tooltip || '')}`);
      box.appendChild(chip);
    }
    box.appendChild(statusRow(p));
    zone.appendChild(box);
  }

  function intentEl(enemy) {
    const iv = previewIntent(combat, enemy.id);
    const el = document.createElement('div');
    let cls = iv.kind;
    let inner = '';
    if (iv.kind === 'staggered') {
      inner = '✦ STAGGERED';
    } else if (iv.kind === 'attack') {
      inner = `<span class="ic">⚔</span>${iv.hits > 1 ? `${iv.damage}×${iv.hits}` : iv.damage}`;
      if (iv.delayed) inner += ' ⌛';
      cls = `attack${iv.delayed ? ' delayed' : ''}`;
    } else if (iv.kind === 'block') {
      inner = '<span class="ic">🛡</span>';
    } else if (iv.kind === 'buff') {
      inner = '<span class="ic">↑</span>';
    } else if (iv.kind === 'debuff') {
      inner = '<span class="ic">☾</span>';
    } else {
      inner = '?';
    }
    el.className = `intent ${cls}`;
    el.innerHTML = inner;
    attachTooltip(el, () => intentTooltip(iv, enemy));
    return el;
  }

  function intentTooltip(iv, enemy) {
    if (iv.kind === 'staggered') return `<div class="tt-title">Staggered</div>Poise broken — this enemy's turn is skipped and it takes +50% damage.`;
    if (iv.kind === 'attack') {
      let t = `<div class="tt-title">Intent: Attack</div>Attacking for <b>${iv.damage}${iv.hits > 1 ? ` × ${iv.hits} (${iv.totalDamage} total)` : ''}</b> damage (modifiers included).`;
      if (iv.pending) t += '<br><b>Committed:</b> this delayed attack lands this coming turn — Stagger cancels it.';
      else if (iv.delayed) t += '<br><b>Delayed:</b> it will hold this turn and strike the next. Stagger cancels it.';
      return t;
    }
    if (iv.kind === 'block') return `<div class="tt-title">Intent: Defend</div>Gaining Block.`;
    if (iv.kind === 'buff') return `<div class="tt-title">Intent: Buff</div>Strengthening itself.`;
    if (iv.kind === 'debuff') return `<div class="tt-title">Intent: Debuff</div>Hindering you.`;
    return `<div class="tt-title">Intent: Unknown</div>`;
  }

  function renderEnemies() {
    const row = $('.enemy-row');
    row.innerHTML = '';
    const targeting = selected || selectedFlask != null;
    const living = combat.enemies.filter((e) => e.alive);
    for (const enemy of combat.enemies) {
      const def = registries.enemies.get(enemy.enemyId);
      const box = document.createElement('div');
      box.className = `combatant enemy${dv(enemy).alive ? '' : ' dead'}${targeting ? ' targetable' : ''}`;
      box.dataset.eid = enemy.id;
      if (enemy.alive) box.appendChild(intentEl(enemy));
      // Target-number badge for keyboard targeting (SPEC §7.3).
      if (enemy.alive && targeting) {
        const idx = living.indexOf(enemy);
        if (idx < 9) {
          const kh = document.createElement('span');
          kh.className = 'enemy-key';
          kh.textContent = idx + 1;
          box.appendChild(kh);
        }
      }
      const sprite = document.createElement('div');
      sprite.className = 'sprite';
      sprite.appendChild(enemySprite(def));
      const badge = blockBadge(enemy);
      if (badge) sprite.appendChild(badge);
      box.appendChild(sprite);
      const nm = document.createElement('div');
      nm.className = 'nm';
      nm.textContent = def.name;
      box.appendChild(nm);
      box.appendChild(meterBars(enemy));
      box.appendChild(statusRow(enemy));
      if (enemy.alive) {
        box.addEventListener('click', () => {
          if (selected) playCard(selected, enemy.id);
          else if (selectedFlask != null) useFlask(selectedFlask, enemy.id);
        });
        box.addEventListener('pointerenter', () => (selected || selectedFlask != null) && box.classList.add('hover-target'));
        box.addEventListener('pointerleave', () => box.classList.remove('hover-target'));
      }
      row.appendChild(box);
    }
  }

  function renderHand() {
    const hand = $('.hand');
    hand.innerHTML = '';
    const handList = disp ? disp.hand : combat.piles.hand;
    const n = handList.length;
    handList.forEach((inst, i) => {
      const pv = previewCard(combat, inst.instanceId);
      const affordable = combat.player.energy >= (pv.costIsX ? 0 : pv.cost) && !isUnplayable(inst);
      const el = renderCard(registries, inst, { preview: pv, affordable });
      const spread = Math.min(6, n) * 1.2;
      el.style.transform = `rotate(${(i - (n - 1) / 2) * (spread / Math.max(n - 1, 1))}deg) translateY(${Math.abs(i - (n - 1) / 2) * 6}px)`;
      el.style.zIndex = i;
      if (inst.instanceId === selected) el.classList.add('selected');
      if (i < 9) {
        const hint = document.createElement('span');
        hint.className = 'key-hint';
        hint.textContent = i + 1;
        el.appendChild(hint);
      }
      wireCardInput(el, inst, pv, affordable);
      hand.appendChild(el);
    });
  }

  function isUnplayable(inst) {
    return (resolveCard(registries, inst).keywords || []).includes('unplayable');
  }

  function renderControls() {
    $('.energy-orb').textContent = `${combat.player.energy}/${combat.player.energyMax}`;
    const anyPlayable = combat.piles.hand.some((inst) => {
      const def = resolveCard(registries, inst);
      if ((def.keywords || []).includes('unplayable')) return false;
      return combat.player.energy >= (def.cost === 'X' ? 0 : def.cost);
    });
    $('.end-turn').classList.toggle('pulse', combat.player.energy > 0 && anyPlayable);
    $('.pile.draw .n').textContent = combat.piles.draw.length;
    $('.pile.discard .n').textContent = combat.piles.discard.length;
    const ex = $('.pile.exhaust');
    ex.style.display = combat.piles.exhaust.length ? '' : 'none';
    ex.querySelector('.n').textContent = combat.piles.exhaust.length;
  }

  // ---------- input: click-to-target + drag (SPEC §7.3, both modes) ----------
  function wireCardInput(el, inst, pv, affordable) {
    let dragGhost = null;
    let dragging = false;
    let suppressClick = false; // a finished drag must not double-fire as a click
    let startX = 0;
    let startY = 0;

    el.addEventListener('pointerdown', (ev) => {
      if (busy || !affordable || ev.button !== 0) return;
      startX = ev.clientX;
      startY = ev.clientY;
      const onMove = (mv) => {
        if (!dragging && Math.hypot(mv.clientX - startX, mv.clientY - startY) > 12) {
          dragging = true;
          hideTooltip();
          dragGhost = el.cloneNode(true);
          dragGhost.style.cssText += 'position:fixed;z-index:600;pointer-events:none;opacity:.9;transform:scale(1.1);';
          document.body.appendChild(dragGhost);
        }
        if (dragging && dragGhost) {
          dragGhost.style.left = `${mv.clientX - 70}px`;
          dragGhost.style.top = `${mv.clientY - 100}px`;
        }
      };
      const onUp = (up) => {
        removeEventListener('pointermove', onMove);
        removeEventListener('pointerup', onUp);
        if (dragGhost) dragGhost.remove();
        if (!dragging) return; // plain click handled by 'click'
        dragging = false;
        suppressClick = true; // whatever happens next, this drag is not a click
        const under = document.elementFromPoint(up.clientX, up.clientY);
        const enemyBox = under && under.closest ? under.closest('.enemy:not(.dead)') : null;
        if (pv.needsTarget) {
          if (enemyBox) playCard(inst.instanceId, enemyBox.dataset.eid);
        } else if (under && under.closest && under.closest('.field')) {
          playCard(inst.instanceId, null);
        }
      };
      addEventListener('pointermove', onMove);
      addEventListener('pointerup', onUp);
    });

    el.addEventListener('click', () => {
      if (suppressClick) {
        suppressClick = false;
        return;
      }
      if (busy || !affordable || dragging) return;
      if (pv.needsTarget) {
        selected = selected === inst.instanceId ? null : inst.instanceId;
        render();
        if (selected) focusTargeting();
      } else {
        playCard(inst.instanceId, null);
      }
    });
  }

  // Cancel targeting with right-click / Esc.
  combatEl.addEventListener('contextmenu', (ev) => {
    if (selected || selectedFlask != null) {
      ev.preventDefault();
      selected = null;
      selectedFlask = null;
      render();
    }
  });
  // Keyboard shortcuts (SPEC §7.3): Esc cancels targeting; 1–9 select/play the
  // Nth card (or, while targeting, pick the Nth living enemy); E ends the turn.
  const keyHandler = (ev) => {
    // Self-clean if the combat screen was torn down (e.g. Save & Quit mid-fight)
    // — the listener lives on window, so it must detach when its DOM is gone.
    if (!app.querySelector('.combat')) {
      removeEventListener('keydown', keyHandler);
      return;
    }
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const tag = (ev.target && ev.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (overlayIsOpen()) return; // the overlay owns input while open

    // Dedicated (rebindable) overlay keys: Menu → Deck, plus jump-to-tab keys.
    for (const [id, tab] of [['menu', 'deck'], ['deck', 'deck'], ['relics', 'relics'], ['stats', 'stats']]) {
      if (matchAction(ev, id)) {
        ev.preventDefault();
        if (onMenu) onMenu(tab);
        return;
      }
    }

    if (ev.key === 'Escape') {
      if (selected || selectedFlask != null) {
        selected = null;
        selectedFlask = null;
        hideTooltip();
        render();
      }
      return;
    }
    if (busy || combat.result || combat.phase !== 'player') return;

    if (matchAction(ev, 'endTurn')) {
      ev.preventDefault();
      $('.end-turn').click();
      return;
    }

    if (/^[1-9]$/.test(ev.key)) {
      ev.preventDefault();
      const n = Number(ev.key) - 1;
      // Targeting mode: the number picks the Nth living enemy.
      if (selected || selectedFlask != null) {
        const enemy = combat.enemies.filter((e) => e.alive)[n];
        if (!enemy) return;
        if (selected) playCard(selected, enemy.id);
        else useFlask(selectedFlask, enemy.id);
        return;
      }
      // Selection mode: play the Nth hand card (auto-target a lone enemy).
      const inst = combat.piles.hand[n];
      if (!inst) return;
      const pv = previewCard(combat, inst.instanceId);
      const affordable = combat.player.energy >= (pv.costIsX ? 0 : pv.cost) && !isUnplayable(inst);
      if (!affordable) return;
      if (pv.needsTarget) {
        const living = combat.enemies.filter((e) => e.alive);
        if (living.length === 1) playCard(inst.instanceId, living[0].id);
        else {
          selected = inst.instanceId;
          selectedFlask = null;
          render();
          focusTargeting();
        }
      } else {
        playCard(inst.instanceId, null);
      }
    }
  };
  addEventListener('keydown', keyHandler);

  // ---------- actions ----------
  function trackStats(events) {
    for (const e of events) {
      if (e.type === 'damageDealt' && e.sourceId === 'player') run.stats.damageDealt += e.amount;
      if (e.type === 'hpLost' && e.targetId === 'player') run.stats.damageTaken += e.amount;
    }
  }

  function useFlask(slot, targetId) {
    if (busy || combat.result) return;
    selectedFlask = null;
    selected = null;
    hideTooltip();
    disp = takeSnapshot();
    let out;
    try {
      out = dispatch(combat, { type: 'useFlask', slot, targetId: targetId || undefined });
    } catch (err) {
      disp = null;
      render();
      return;
    }
    sfx.play('flask');
    busy = true;
    afterDispatch(out.events);
  }

  function afterDispatch(events) {
    trackStats(events);
    render(); // hand/energy react now; bars render from the pre-dispatch snapshot
    playTimeline(
      events,
      {
        ...fxCtx,
        onBeatApplied: (beat) => {
          applyBeatToDisp(beat);
          renderTopbar();
          renderPlayer();
          renderEnemies();
          renderHand();
          renderControls();
        },
        onFlush: () => {
          disp = null;
          render();
        },
      },
      () => {
        disp = null;
        render();
        busy = false;
        if (combat.result) {
          removeEventListener('keydown', keyHandler);
          setTimeout(() => onEnd(combat.result, combat), 350);
        }
      }
    );
  }

  // Ghost the played card flying toward its target (≤220 ms, purely cosmetic).
  function flyCard(instanceId, targetId) {
    const cardEl = app.querySelector(`.hand .card[data-instance-id="${instanceId}"]`);
    if (!cardEl) return;
    const dest = (targetId && fxCtx.anchorFor(targetId)) || fxCtx.anchorFor('player');
    const from = cardEl.getBoundingClientRect();
    const to = dest ? dest.getBoundingClientRect() : from;
    const ghost = cardEl.cloneNode(true);
    ghost.className = `${cardEl.className} card-ghost`;
    ghost.style.left = `${from.left}px`;
    ghost.style.top = `${from.top}px`;
    ghost.style.width = `${from.width}px`;
    ghost.style.margin = '0';
    document.body.appendChild(ghost);
    requestAnimationFrame(() => {
      const dx = to.left + to.width / 2 - (from.left + from.width / 2);
      const dy = to.top + to.height / 2 - (from.top + from.height / 2);
      ghost.style.transform = `translate(${dx}px, ${dy}px) scale(0.35) rotate(6deg)`;
      ghost.style.opacity = '0';
    });
    setTimeout(() => ghost.remove(), 260);
  }

  function playCard(instanceId, targetId) {
    if (busy || combat.result) return;
    if (targetId) lastTargetId = targetId; // remembered for the next card's aim
    selected = null;
    selectedFlask = null;
    hideTooltip();
    flyCard(instanceId, targetId);
    disp = takeSnapshot();
    let out;
    try {
      out = dispatch(combat, { type: 'playCard', cardInstanceId: instanceId, targetId: targetId || undefined });
    } catch (err) {
      disp = null;
      render(); // illegal input: show nothing, just resync (ENGINE-API §12)
      return;
    }
    sfx.play('cardPlay');
    busy = true;
    afterDispatch(out.events);
  }

  $('.end-turn').addEventListener('click', () => {
    if (busy || combat.result || combat.phase !== 'player') return;
    selected = null;
    selectedFlask = null;
    hideTooltip();
    disp = takeSnapshot();
    let out;
    try {
      out = dispatch(combat, { type: 'endTurn' });
    } catch (err) {
      disp = null;
      return;
    }
    busy = true;
    afterDispatch(out.events);
  });

  $('.pile.draw').addEventListener('click', () => openPileModal(registries, 'Draw pile', combat.piles.draw, { shuffleForDisplay: true }));
  $('.pile.discard').addEventListener('click', () => openPileModal(registries, 'Discard pile', combat.piles.discard));
  $('.pile.exhaust').addEventListener('click', () => openPileModal(registries, 'Exhaust pile', combat.piles.exhaust));
  if (onSettings) $('#combat-settings').addEventListener('click', onSettings);
  if (onMenu) $('#combat-menu').addEventListener('click', () => onMenu('deck'));

  render();
  // Combat-start events (relic triggers, opening draw) get a quick pass too.
  animateEvents(combat.eventLog.filter((e) => e.type === 'relicTriggered'), fxCtx, () => {});

  // First-run guided callouts (SPEC §9 M4) — once per player, over a live board.
  if (showTutorial) mountTutorial(app, { onDone: () => onTutorialDone && onTutorialDone() });
}


Object.assign(module.exports, { mountCombat });

},
"src/ui/components/piles.js": function (module, exports, require) {
// src/ui/components/piles.js — pile viewer modal (SPEC §7.2)
//
// Draw-pile views are display-shuffled (Math.random is fine here — pure
// presentation, never game state) so pile inspection leaks no order info,
// like StS.

const { renderCard } = require("src/ui/components/card.js");

function openPileModal(registries, title, cards, { shuffleForDisplay = false } = {}) {
  const veil = document.createElement('div');
  veil.className = 'modal-veil';
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `<h2>${title} (${cards.length})</h2>`;
  const grid = document.createElement('div');
  grid.className = 'grid';

  let list = [...cards];
  if (shuffleForDisplay) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
  }
  for (const inst of list) {
    grid.appendChild(renderCard(registries, inst, { small: true }));
  }
  if (!list.length) {
    const empty = document.createElement('div');
    empty.style.cssText = 'color:var(--muted);padding:20px;';
    empty.textContent = 'Empty.';
    grid.appendChild(empty);
  }
  modal.appendChild(grid);
  veil.appendChild(modal);
  veil.addEventListener('click', (ev) => {
    if (ev.target === veil) veil.remove();
  });
  document.body.appendChild(veil);
  return veil;
}


Object.assign(module.exports, { openPileModal });

},
"src/ui/fx.js": function (module, exports, require) {
// src/ui/fx.js — feedback effects (SPEC §7.4)
//
// Rules: every animation ≤300 ms; queued events play ≤80 ms apart; a click
// skips to end-state; shake ≤4 px only for hits ≥15; Bleed bursts and
// Staggers get the loud treatment (they're the theme).

const { sfx } = require("src/ui/sfx.js");

const STEP_MS = 80;

// ---------------------------------------------------------------------------
// Animation speed (settings-driven; 'instant' collapses paced playback to the
// classic fast-float behavior — also forced by reducedMotion).
// ---------------------------------------------------------------------------

const ANIM_SPEEDS = {
  slow: { beatMs: 700, stepMs: 140, lungeMs: 340 },
  normal: { beatMs: 400, stepMs: 90, lungeMs: 260 },
  fast: { beatMs: 180, stepMs: 45, lungeMs: 160 },
  instant: null,
};

let animSpeed = 'normal';
function setAnimSpeed(v) {
  animSpeed = ANIM_SPEEDS[v] === undefined ? 'normal' : v;
}
function getAnimSpeed() {
  return animSpeed;
}

let pending = [];
let flushRequested = false;

/** Spawn a floating number over an anchor element. */
function floatNum(layer, anchor, text, cls) {
  if (!layer || !anchor) return;
  const lr = layer.getBoundingClientRect();
  const ar = anchor.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = `float-num ${cls}`;
  el.textContent = text;
  el.style.left = `${ar.left - lr.left + ar.width / 2 - 14 + (Math.random() * 26 - 13)}px`;
  el.style.top = `${ar.top - lr.top + ar.height * 0.25}px`;
  layer.appendChild(el);
  setTimeout(() => el.remove(), 300);
}

function banner(layer, text, cls = '') {
  if (!layer) return;
  const el = document.createElement('div');
  el.className = `fx-banner ${cls}`;
  el.textContent = text;
  layer.appendChild(el);
  setTimeout(() => el.remove(), 320);
}

function shake(combatEl) {
  if (!combatEl) return;
  // Honor the Screen shake setting (and reduced motion, which also drops it).
  if (document.body.classList.contains('no-shake') || document.body.classList.contains('reduced-motion')) return;
  combatEl.classList.remove('shake');
  void combatEl.offsetWidth; // restart animation
  combatEl.classList.add('shake');
}

// Add a short-lived CSS class (restarting its animation if already present).
function flash(el, cls, ms = 300) {
  if (!el) return;
  // Photosensitivity: suppress bright impact/proc flashes when asked. Damage
  // numbers and HUD updates (which carry the actual info) are unaffected.
  if (document.body.classList.contains('reduce-flashes')) return;
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), ms);
}

// Radial flare over an anchor (stance entries, big procs).
function flare(layer, anchor, color) {
  if (!layer || !anchor) return;
  const lr = layer.getBoundingClientRect();
  const ar = anchor.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'stance-flare';
  el.style.left = `${ar.left - lr.left + ar.width / 2 - 90}px`;
  el.style.top = `${ar.top - lr.top + ar.height / 2 - 90}px`;
  el.style.background = `radial-gradient(circle, ${color} 0%, transparent 65%)`;
  layer.appendChild(el);
  setTimeout(() => el.remove(), 320);
}

/**
 * animateEvents(events, ctx, done)
 *   ctx = { layer, combatEl, anchorFor(entityId) → element|null }
 * Events are staggered STEP_MS apart; clicking anywhere flushes instantly.
 */
function animateEvents(events, ctx, done) {
  flushRequested = false;
  pending = events.filter((e) => visualFor(e) !== null);
  const skip = () => {
    flushRequested = true;
  };
  addEventListener('pointerdown', skip, { once: true, capture: true });

  let i = 0;
  const step = () => {
    while (flushRequested && i < pending.length) {
      // Flushed: fire remaining sounds silently-fast, no visuals backlog.
      i++;
    }
    if (i >= pending.length) {
      removeEventListener('pointerdown', skip, { capture: true });
      if (done) done();
      return;
    }
    const fn = visualFor(pending[i]);
    if (fn) fn(ctx);
    i++;
    setTimeout(step, STEP_MS);
  };
  step();
}

// ---------------------------------------------------------------------------
// Paced playback — one actor at a time (SPEC §7.4 extension).
//
// Groups a dispatch's event log into "beats": each card play, flask use, and
// enemy move is its own beat, played as actor animation → effect visuals →
// numbers → HUD update (ctx.onBeatApplied), before the next actor moves.
// Turn boundaries become banner beats. Click skips to the end state.
// ---------------------------------------------------------------------------

function groupBeats(events) {
  const beats = [];
  let cur = { actorId: null, banner: null, kind: null, events: [] };
  const push = () => {
    if (cur.events.length || cur.banner || cur.actorId) beats.push(cur);
  };
  for (const e of events) {
    switch (e.type) {
      case 'cardPlayed':
        push();
        cur = { actorId: 'player', banner: null, kind: e.cardType === 'attack' ? 'attack' : 'act', events: [e] };
        break;
      case 'flaskUsed':
        push();
        cur = { actorId: 'player', banner: null, kind: 'act', events: [e] };
        break;
      case 'enemyMoveStarted':
        push();
        cur = { actorId: e.sourceId, banner: null, kind: e.kind === 'attack' ? 'attack' : 'act', events: [e] };
        break;
      case 'enemyTurnStart':
        push();
        cur = { actorId: null, banner: 'ENEMY TURN', kind: 'banner', events: [e] };
        break;
      case 'playerTurnStart':
        push();
        cur = { actorId: null, banner: 'YOUR TURN', kind: 'banner', events: [e] };
        break;
      case 'cardDrawn':
        // Draws fire just before 'playerTurnStart' — split them out of the
        // last enemy beat so the hand refills as its own step.
        if (cur.actorId && cur.actorId !== 'player' && cur.kind !== 'draw') {
          push();
          cur = { actorId: null, banner: null, kind: 'draw', events: [] };
        }
        cur.events.push(e);
        break;
      default:
        cur.events.push(e);
    }
  }
  push();
  return beats;
}

/**
 * playTimeline(events, ctx, done)
 *   ctx = animateEvents ctx + {
 *     onBeatApplied(beat)  — apply this beat's events to the display state
 *                            (HP/block bars, hand, statuses) AFTER its visuals,
 *     onFlush()            — skip: jump display to true final state,
 *   }
 * Uses the module anim speed; 'instant' (or reducedMotion) falls back to
 * animateEvents' classic behavior (final state + fast floats).
 */
function playTimeline(events, ctx, done) {
  const speed = ANIM_SPEEDS[animSpeed];
  const reduced = document.body.classList.contains('reduced-motion');
  if (!speed || reduced) {
    if (ctx.onFlush) ctx.onFlush();
    animateEvents(events, ctx, done);
    return;
  }

  const beats = groupBeats(events);
  let flushed = false;
  let finished = false;
  const skip = () => {
    flushed = true;
  };
  addEventListener('pointerdown', skip, { once: true, capture: true });
  const finish = () => {
    if (finished) return;
    finished = true;
    clearTimeout(watchdog);
    removeEventListener('pointerdown', skip, { capture: true });
    if (done) done();
  };
  // Safety net: however playback ends (or a re-render throws mid-beat), never
  // leave the caller's `busy` flag stuck — force completion after a bounded
  // wall-clock budget. This is what prevents the "cards stop responding" hang.
  const budget = 2000 + beats.length * (speed.beatMs + speed.lungeMs + 4 * speed.stepMs);
  const watchdog = setTimeout(() => {
    try {
      if (ctx.onFlush) ctx.onFlush();
    } catch (e) {
      /* ignore */
    }
    finish();
  }, budget);

  const safe = (fn) => {
    try {
      if (fn) fn();
    } catch (e) {
      /* a render/visual error must not break the chain */
    }
  };

  let bi = 0;
  const nextBeat = () => {
    if (finished) return;
    if (flushed) {
      safe(() => ctx.onFlush && ctx.onFlush());
      finish();
      return;
    }
    if (bi >= beats.length) {
      finish();
      return;
    }
    const beat = beats[bi++];

    if (beat.banner) {
      safe(() => banner(ctx.layer, beat.banner, 'turn'));
      safe(() => ctx.onBeatApplied && ctx.onBeatApplied(beat));
      setTimeout(nextBeat, Math.max(260, speed.beatMs));
      return;
    }

    // 1) actor animation (lunge for attacks, glow-step otherwise)
    const actorEl = beat.actorId ? ctx.anchorFor(beat.actorId) : null;
    if (actorEl) safe(() => flash(actorEl, beat.kind === 'attack' ? 'act-attack' : 'act-move', speed.lungeMs));

    // 2) after the wind-up, the beat's effect visuals + numbers, staggered
    const visuals = beat.events.map(visualFor).filter(Boolean);
    const windup = actorEl ? Math.round(speed.lungeMs * 0.55) : 0;
    setTimeout(() => {
      let vi = 0;
      const stepV = () => {
        if (finished) return;
        if (flushed) {
          nextBeat();
          return;
        }
        if (vi < visuals.length) {
          const v = visuals[vi++];
          safe(() => v(ctx));
          setTimeout(stepV, speed.stepMs);
          return;
        }
        // 3) HUD updates for this beat, 4) inter-beat breath
        safe(() => ctx.onBeatApplied && ctx.onBeatApplied(beat));
        setTimeout(nextBeat, speed.beatMs);
      };
      stepV();
    }, windup);
  };
  nextBeat();
}

function visualFor(e) {
  switch (e.type) {
    case 'damageDealt':
      return (ctx) => {
        sfx.play('hit');
        const anchor = ctx.anchorFor(e.targetId);
        floatNum(ctx.layer, anchor, `-${e.amount}`, e.amount >= 15 ? 'dmg heavy' : 'dmg');
        flash(anchor, 'hitflash', 220);
        if (e.amount >= 15) shake(ctx.combatEl);
      };
    case 'blockGained':
      return e.amount > 0
        ? (ctx) => {
            sfx.play('block');
            floatNum(ctx.layer, ctx.anchorFor(e.targetId), `+${e.amount}`, 'blk');
          }
        : null;
    case 'hpLost':
      return e.cause === 'effect'
        ? (ctx) => floatNum(ctx.layer, ctx.anchorFor(e.targetId), `-${e.amount}`, 'burst')
        : null; // attack damage already shown by damageDealt
    case 'healed':
      return e.amount > 0
        ? (ctx) => {
            sfx.play('heal');
            floatNum(ctx.layer, ctx.anchorFor(e.targetId), `+${e.amount}`, 'heal');
          }
        : null;
    case 'meterFilled':
      return e.status === 'bleed'
        ? (ctx) => {
            sfx.play('bleedBurst');
            banner(ctx.layer, 'BLEED BURST', 'blood');
          }
        : null;
    case 'enemyStaggered':
      return (ctx) => {
        sfx.play('stagger');
        banner(ctx.layer, 'STAGGERED');
        shake(ctx.combatEl);
      };
    case 'enemyDied':
      return (ctx) => {
        sfx.play('enemyDeath');
        const anchor = ctx.anchorFor(e.targetId);
        floatNum(ctx.layer, anchor, '✝', 'dmg heavy');
        if (anchor) anchor.classList.add('crumble');
      };
    case 'stanceEntered':
      return (ctx) => {
        sfx.play('stance');
        const color = e.stance === 'bulwark' ? 'rgba(127,168,201,.55)' : 'rgba(201,80,46,.55)';
        flare(ctx.layer, ctx.anchorFor('player'), color);
      };
    case 'relicTriggered':
      return (ctx) => {
        sfx.play('relic');
        if (ctx.relicAnchor) flash(ctx.relicAnchor(e.relicId), 'proc', 320);
      };
    case 'energySpent':
    case 'energyGained':
      return (ctx) => {
        if (ctx.orb) flash(ctx.orb(), 'pulse', 260);
      };
    default:
      return null;
  }
}


Object.assign(module.exports, { ANIM_SPEEDS, setAnimSpeed, getAnimSpeed, animateEvents, playTimeline });

},
"src/ui/sfx.js": function (module, exports, require) {
// src/ui/sfx.js — sound hooks (SPEC §7.4; §11: audio assets are a v1 non-goal)
//
// Every feedback moment calls sfx.play(id). v1 ships NO audio, so play() makes
// no sound — but the hooks already exist at every call site (cardPlay, hit,
// block, bleedBurst, stagger, enemyDeath, heal, stance, relic, flask, shrine,
// buy, victory, youDied). That means an audio layer plugs in with zero call-site
// changes: assign `sfx.sink = (id) => ...` (a WebAudio synth or sample bank).
//
// `recent` is a small ring buffer of the ids fired — it lets tests and QA verify
// the wiring is live without shipping any audio.

const sfx = {
  sink: null, // future audio layer plugs in here; null = silent (v1)
  recent: [], // last fired hook ids (bounded), for verification
  play(id) {
    this.recent.push(id);
    if (this.recent.length > 32) this.recent.shift();
    if (this.sink) this.sink(id);
  },
};


Object.assign(module.exports, { sfx });

},
"src/ui/components/tutorial.js": function (module, exports, require) {
// src/ui/components/tutorial.js — first-run combat callouts (SPEC §7.4, §9 M4)
//
// A one-time guided overlay (≤4 dismissible callouts) shown on the player's
// first combat. Spotlights each key element and explains it; the "seen" flag is
// persisted in meta settings (main.js) so it never shows twice. Steps whose
// target isn't on screen (e.g. a Staggered enemy has no intent) are skipped.

const STEPS = [
  { sel: '.energy-orb', title: 'Energy', text: 'Three energy each turn. Cards cost energy to play — spend it wisely.' },
  { sel: '.enemy-row .intent', title: 'Enemy intent', text: 'Enemies telegraph their next move. The number is the exact damage they will deal to you.' },
  { sel: '.hand .card', title: 'Play cards', text: 'Click a card or press 1–9. Attacks need a target — click an enemy, or drag the card onto it.' },
  { sel: '.end-turn', title: 'End your turn', text: 'Done? End Turn (or press E). Unspent energy and most Block are lost at your next turn.' },
];

function mountTutorial(root, { onDone }) {
  const steps = STEPS.filter((s) => root.querySelector(s.sel));
  if (!steps.length) return onDone();

  const veil = document.createElement('div');
  veil.className = 'tut-veil';
  veil.innerHTML = `
    <div class="tut-spot"></div>
    <div class="tut-bubble">
      <div class="tut-title"></div>
      <p class="tut-text"></p>
      <div class="tut-row">
        <button class="subtle tut-skip">Skip</button>
        <button class="tut-next"></button>
      </div>
    </div>`;
  root.appendChild(veil);

  const spot = veil.querySelector('.tut-spot');
  const bubble = veil.querySelector('.tut-bubble');
  let i = 0;

  function show() {
    const step = steps[i];
    const target = root.querySelector(step.sel);
    if (!target) return next(); // vanished between filter and show
    const r = target.getBoundingClientRect();
    const pad = 8;
    spot.style.left = `${r.left - pad}px`;
    spot.style.top = `${r.top - pad}px`;
    spot.style.width = `${r.width + pad * 2}px`;
    spot.style.height = `${r.height + pad * 2}px`;
    veil.querySelector('.tut-title').textContent = step.title;
    veil.querySelector('.tut-text').textContent = step.text;
    veil.querySelector('.tut-next').textContent = i === steps.length - 1 ? 'Got it' : `Next (${i + 1}/${steps.length})`;

    const bubbleW = 300;
    const bubbleH = 160;
    bubble.style.left = `${Math.max(12, Math.min(r.left, window.innerWidth - bubbleW - 12))}px`;
    bubble.style.top =
      r.bottom + 20 + bubbleH < window.innerHeight ? `${r.bottom + 20}px` : `${Math.max(12, r.top - bubbleH - 12)}px`;
  }

  function next() {
    i += 1;
    if (i >= steps.length) finish();
    else show();
  }

  function finish() {
    veil.remove();
    onDone();
  }

  veil.querySelector('.tut-next').addEventListener('click', next);
  veil.querySelector('.tut-skip').addEventListener('click', finish);
  show();
}


Object.assign(module.exports, { mountTutorial });

},
"src/ui/screens/reward.js": function (module, exports, require) {
// src/ui/screens/reward.js — post-combat / treasure rewards (SPEC §6, §7.1)
//
// Rewards arrive pre-rolled by engine/encounters.js (deterministic streams);
// this screen only presents them. Skipping the card is a visible affordance
// (deck discipline, GDD §5). Runes/relic/flask apply immediately; the flask
// is lost with a note if all slots are full.

const { renderCard } = require("src/ui/components/card.js");
const { esc } = require("src/ui/components/tooltip.js");
const { sfx } = require("src/ui/sfx.js");

function mountRewards(app, { registries, run, rewards, onDone }) {
  const lines = [];
  if (rewards.runes) {
    run.runes += rewards.runes;
    lines.push(`<span style="color:var(--gold)">+${rewards.runes} runes</span> (${run.runes} total)`);
  }
  if (rewards.relicId) {
    run.relics.push(rewards.relicId);
    const def = registries.relics.get(rewards.relicId);
    lines.push(`Relic: <b>${esc(def.icon || '◆')} ${esc(def.name)}</b> — ${esc(def.textTemplate.replace(/[{}]/g, ''))}`);
  }
  if (rewards.flaskId) {
    const def = registries.flasks.get(rewards.flaskId);
    if (run.flasks.length < (registries.balance.flaskSlots || 3)) {
      run.flasks.push({ flaskId: rewards.flaskId });
      lines.push(`Flask: <b>${esc(def.icon || '🧪')} ${esc(def.name)}</b>`);
    } else {
      lines.push(`<span style="color:var(--muted)">A ${esc(def.name)} — but your flask slots are full. It stays in the mud.</span>`);
    }
  }

  sfx.play('victory');
  app.innerHTML = `
    <div class="screen">
      <h2 style="color:var(--gold);font-size:26px">${esc(rewards.title || 'VICTORY')}</h2>
      ${lines.map((l) => `<p style="font-size:14px">${l}</p>`).join('')}
      ${rewards.cardIds && rewards.cardIds.length ? '<p class="subtitle">CHOOSE A CARD</p><div class="reward-row"></div>' : ''}
      <button class="subtle" id="reward-continue">${rewards.cardIds && rewards.cardIds.length ? 'Skip the card' : 'CONTINUE'}</button>
    </div>`;

  const row = app.querySelector('.reward-row');
  if (row) {
    for (const cardId of rewards.cardIds) {
      const el = renderCard(registries, { cardId, upgraded: false }, {});
      el.addEventListener('click', () => {
        run.deck.push({ instanceId: `r${run.deck.length}_${cardId}`, cardId, upgraded: false });
        onDone(cardId);
      });
      row.appendChild(el);
    }
  }
  app.querySelector('#reward-continue').addEventListener('click', () => onDone(null));
}


Object.assign(module.exports, { mountRewards });

},
"src/ui/screens/rest.js": function (module, exports, require) {
// src/ui/screens/rest.js — Shrine of Grace: Rest (heal) or Smith (upgrade)
// (SPEC §7.1; heal math from engine/encounters.js shrineHealAmount)

const { shrineHealAmount } = require("src/engine/encounters.js");
const { passiveFlag, resolveCard } = require("src/model/registries.js");
const { renderCard } = require("src/ui/components/card.js");
const { esc } = require("src/ui/components/tooltip.js");
const { sfx } = require("src/ui/sfx.js");

function mountRest(app, { registries, run, onDone, healMult = 1 }) {
  const heal = Math.floor(shrineHealAmount(registries, run) * healMult);
  const noRest = passiveFlag(registries, run.relics, 'shrineNoRest');
  const upgradable = run.deck.filter((c) => !c.upgraded && registries.cards.get(c.cardId).upgrade);

  app.innerHTML = `
    <div class="screen">
      <h2 style="color:var(--gold);font-size:26px">SHRINE OF GRACE</h2>
      <p class="subtitle">THE GOLD LIGHT HOLDS, FOR NOW</p>
      <div class="class-row">
        <div class="class-pick${noRest ? ' locked' : ''}" id="rest-opt">
          <div class="glyph">♨</div>
          <h3>Rest</h3>
          <p>${noRest ? 'The Dragon Heart will not let you rest.' : `Heal ${heal} HP (${run.hp} → ${Math.min(run.maxHp, run.hp + heal)}/${run.maxHp}).`}</p>
        </div>
        <div class="class-pick${upgradable.length ? '' : ' locked'}" id="smith-opt">
          <div class="glyph">⚒</div>
          <h3>Smith</h3>
          <p>${upgradable.length ? 'Upgrade a card, permanently.' : 'Nothing left to upgrade.'}</p>
        </div>
      </div>
      <div id="smith-grid" class="deck-strip" style="display:none;max-width:900px"></div>
    </div>`;

  if (!noRest) {
    app.querySelector('#rest-opt').addEventListener('click', () => {
      run.hp = Math.min(run.maxHp, run.hp + heal);
      sfx.play('shrine');
      onDone(`Rested: +${heal} HP.`);
    });
  }
  if (upgradable.length) {
    app.querySelector('#smith-opt').addEventListener('click', () => {
      const grid = app.querySelector('#smith-grid');
      if (grid.style.display !== 'none') return;
      grid.style.display = 'flex';
      grid.style.gap = '14px';
      grid.style.flexWrap = 'wrap';
      grid.style.justifyContent = 'center';
      for (const inst of upgradable) {
        const el = renderCard(registries, inst, { small: true });
        el.addEventListener('click', () => {
          inst.upgraded = true;
          sfx.play('shrine');
          onDone(`Smithed: ${esc(resolveCard(registries, inst).name)}.`);
        });
        grid.appendChild(el);
      }
    });
  }
}


Object.assign(module.exports, { mountRest });

},
"src/ui/screens/shop.js": function (module, exports, require) {
// src/ui/screens/shop.js — the wandering merchant (SPEC §7.1; prices from
// balance.shop via engine/encounters.js buildShopStock)
//
// The stock lives on run.shopStock (rolled once on first entry and saved),
// so a reload restores the exact same shelves — SPEC §3.11 determinism.

const { renderCard } = require("src/ui/components/card.js");
const { attachTooltip, esc } = require("src/ui/components/tooltip.js");
const { sfx } = require("src/ui/sfx.js");

function mountShop(app, { registries, run, onLeave, onChanged }) {
  const stock = run.shopStock;
  const slotsFree = () => run.flasks.length < (registries.balance.flaskSlots || 3);

  function render() {
    app.innerHTML = `
      <div class="screen" style="justify-content:flex-start;overflow-y:auto;gap:14px;padding-top:28px">
        <h2 style="color:var(--gold);font-size:24px">THE WANDERING MERCHANT</h2>
        <p class="subtitle">"I'VE CLIMBED HIGHER THAN YOU. I CAME BACK. DRAW YOUR OWN CONCLUSIONS."</p>
        <p style="color:var(--gold)">Runes: <b>${run.runes}</b> · HP ${run.hp}/${run.maxHp}</p>
        <div class="reward-row" id="shop-cards"></div>
        <div class="class-row" id="shop-items"></div>
        <div class="class-row">
          <div class="class-pick${run.runes >= stock.removeCost && run.deck.length > 1 ? '' : ' locked'}" id="remove-opt">
            <div class="glyph">✂</div><h3>Remove a card</h3><p>${stock.removeCost} runes. The deck remembers what you cut.</p>
          </div>
        </div>
        <div id="remove-grid" class="deck-strip" style="display:none;max-width:900px"></div>
        <button id="leave-shop">LEAVE</button>
      </div>`;

    const cardsRow = app.querySelector('#shop-cards');
    stock.cards.forEach((item, i) => {
      const wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:6px';
      const el = renderCard(registries, { cardId: item.id, upgraded: false }, { small: true });
      const tag = document.createElement('span');
      tag.className = 'mini';
      tag.textContent = `${item.cost} runes`;
      tag.style.color = run.runes >= item.cost ? 'var(--gold)' : 'var(--muted)';
      if (run.runes >= item.cost) {
        el.addEventListener('click', () => {
          run.runes -= item.cost;
          run.deck.push({ instanceId: `s${run.deck.length}_${item.id}`, cardId: item.id, upgraded: false });
          stock.cards.splice(i, 1);
          sfx.play('buy');
          onChanged();
          render();
        });
      } else {
        el.classList.add('unaffordable');
      }
      wrap.appendChild(el);
      wrap.appendChild(tag);
      cardsRow.appendChild(wrap);
    });

    const items = app.querySelector('#shop-items');
    stock.relics.forEach((item, i) => {
      const def = registries.relics.get(item.id);
      items.appendChild(shopItem(`${def.icon || '◆'} ${def.name}`, def.textTemplate.replace(/[{}]/g, ''), item.cost, run.runes >= item.cost, () => {
        run.runes -= item.cost;
        run.relics.push(item.id);
        stock.relics.splice(i, 1);
        sfx.play('buy');
        onChanged();
        render();
      }));
    });
    stock.flasks.forEach((item, i) => {
      const def = registries.flasks.get(item.id);
      const can = run.runes >= item.cost && slotsFree();
      items.appendChild(shopItem(`${def.icon || '🧪'} ${def.name}`, slotsFree() ? def.textTemplate : 'Flask slots full.', item.cost, can, () => {
        run.runes -= item.cost;
        run.flasks.push({ flaskId: item.id });
        stock.flasks.splice(i, 1);
        sfx.play('buy');
        onChanged();
        render();
      }));
    });

    if (run.runes >= stock.removeCost && run.deck.length > 1) {
      app.querySelector('#remove-opt').addEventListener('click', () => {
        const grid = app.querySelector('#remove-grid');
        if (grid.style.display !== 'none') return;
        grid.style.display = 'flex';
        grid.style.flexWrap = 'wrap';
        grid.style.gap = '14px';
        grid.style.justifyContent = 'center';
        run.deck.forEach((inst, idx) => {
          const el = renderCard(registries, inst, { small: true });
          el.addEventListener('click', () => {
            run.runes -= stock.removeCost;
            run.deck.splice(idx, 1);
            run.removesPurchased = (run.removesPurchased || 0) + 1;
            stock.removeCost = registries.balance.shop.removeBase + registries.balance.shop.removeStep * run.removesPurchased;
            sfx.play('buy');
            onChanged();
            render();
          });
          grid.appendChild(el);
        });
      });
    }

    app.querySelector('#leave-shop').addEventListener('click', onLeave);
  }

  function shopItem(title, desc, cost, affordable, onBuy) {
    const el = document.createElement('div');
    el.className = `class-pick${affordable ? '' : ' locked'}`;
    el.innerHTML = `<h3 style="font-size:13px">${esc(title)}</h3><p>${esc(desc)}</p><span class="chip" style="color:${affordable ? 'var(--gold)' : 'var(--muted)'}">${cost} runes</span>`;
    if (affordable) el.addEventListener('click', onBuy);
    return el;
  }

  render();
}


Object.assign(module.exports, { mountShop });

},
"src/ui/screens/event.js": function (module, exports, require) {
// src/ui/screens/event.js — Unknown-node events (SPEC §5.6, §7.1)
//
// Choices run through executeRunEffects (the same DSL as everything else).
// A startCombat effect sets run.combatEntered; the orchestrator (main.js)
// launches it after the result text.

const { executeRunEffects } = require("src/engine/actions.js");
const { esc } = require("src/ui/components/tooltip.js");

function mountEvent(app, { registries, run, rng, eventId, onDone }) {
  const def = registries.events.get(eventId);

  function meets(requires) {
    if (!requires) return true;
    if (typeof requires.runes === 'number' && run.runes < requires.runes) return false;
    return true;
  }

  app.innerHTML = `
    <div class="screen" style="gap:20px">
      <div class="event-art" style="font-size:56px">${esc(def.art || '❖')}</div>
      <h2 style="color:var(--gold);font-size:24px">${esc(def.name).toUpperCase()}</h2>
      <p style="max-width:560px;text-align:center;line-height:1.7;color:var(--parchment)">${esc(def.text)}</p>
      <div id="choices" style="display:flex;flex-direction:column;gap:10px;min-width:420px"></div>
    </div>`;

  const box = app.querySelector('#choices');
  def.choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'subtle';
    btn.style.fontSize = '13px';
    btn.style.animationDelay = `${i * 70}ms`; // staggered entrance
    btn.textContent = choice.label;
    if (!meets(choice.requires)) {
      btn.disabled = true;
      btn.textContent += ' (cannot afford)';
    } else {
      btn.addEventListener('click', () => {
        executeRunEffects({ run, registries, rng }, choice.effects);
        showResult(choice.resultText);
      });
    }
    box.appendChild(btn);
  });

  function showResult(text) {
    box.innerHTML = '';
    const p = document.createElement('p');
    p.style.cssText = 'max-width:560px;text-align:center;line-height:1.7;color:var(--muted);font-style:italic';
    p.textContent = text;
    const cont = document.createElement('button');
    cont.textContent = run.combatEntered ? 'STEEL YOURSELF' : 'CONTINUE';
    cont.addEventListener('click', onDone);
    box.appendChild(p);
    box.appendChild(cont);
  }
}


Object.assign(module.exports, { mountEvent });

},
"src/ui/screens/gameover.js": function (module, exports, require) {
// src/ui/screens/gameover.js — YOU DIED / GREAT RUNE RESTORED (SPEC §7.4)

const { resolveCard } = require("src/model/registries.js");
const { esc } = require("src/ui/components/tooltip.js");
const { sfx } = require("src/ui/sfx.js");

function mountGameOver(app, { registries, game, victory, onTitle, onHistory }) {
  sfx.play(victory ? 'victory' : 'youDied');
  const title = victory ? 'GREAT RUNE RESTORED' : 'YOU DIED';
  const color = victory ? 'var(--gold)' : 'var(--blood)';

  app.innerHTML = `
    <div class="screen" style="gap:22px">
      <h1 class="title-big" style="color:${color}">${title}</h1>
      <table class="stats-table">
        <tr><td>Tarnished</td><td>${esc((game.customization && game.customization.name) || 'Tarnished')} ${esc((game.customization && game.customization.glyph) || '')}</td></tr>
        <tr><td>Seed</td><td style="font-family:monospace">${esc(game.seedString)}</td></tr>
        <tr><td>Floor reached</td><td>${game.floor}${game.mapGraph ? ` / ${game.mapGraph.floors}` : ''}</td></tr>
        <tr><td>Fights won</td><td>${game.stats.fightsWon}</td></tr>
        <tr><td>Damage dealt</td><td>${game.stats.damageDealt}</td></tr>
        <tr><td>Damage taken</td><td>${game.stats.damageTaken}</td></tr>
        <tr><td>Runes held</td><td>${game.runes}</td></tr>
        <tr><td>Final HP</td><td>${victory ? game.hp : 0} / ${game.maxHp}</td></tr>
      </table>
      <div>
        <p class="subtitle" style="text-align:center;margin-bottom:8px">FINAL DECK (${game.deck.length})</p>
        <div class="deck-strip"></div>
      </div>
      <div class="go-actions">
        <button id="to-title">RETURN TO TITLE</button>
        <button class="subtle" id="to-history">RUN HISTORY</button>

  const strip = app.querySelector('.deck-strip');
  for (const inst of game.deck) {

"src/ui/screens/history.js": function (module, exports, require) {
// src/ui/screens/history.js — run history + aggregate win rates (SPEC §3.12, §9 M4)
//
// Reads the last 20 run results recorded by save.recordResult (sote_meta_v1)
// and shown most-recent-first. Also surfaces the win-rate telemetry the M3
// balance notes call for: overall and per-class win %.

const { esc } = require("src/ui/components/tooltip.js");

function mountHistory(app, { meta, onBack }) {
  const results = (meta.results || []).slice().reverse(); // most recent first
  // Win-rate telemetry counts STANDARD runs only — custom climbs are excluded
  // so their modifiers can't skew the balance numbers (SPEC §10).
  const standard = results.filter((r) => !r.custom);
  const customCount = results.length - standard.length;
  const total = standard.length;
  const wins = standard.filter((r) => r.victory).length;
  const pct = total ? Math.round((wins / total) * 100) : 0;

  // Per-class win/run tallies (the balance telemetry payoff) — standard only.
  const byClass = {};
  for (const r of standard) {
    const k = r.className || r.class || '—';
    const b = (byClass[k] = byClass[k] || { runs: 0, wins: 0 });
    b.runs += 1;
    if (r.victory) b.wins += 1;
  }
  const classLine = Object.entries(byClass)
    .map(([k, b]) => `${esc(k)} ${b.wins}/${b.runs}`)
    .join('  ·  ');

  const rows = results
    .map((r) => {
      const outcome = r.victory
        ? '<span class="hx-win">RUNE RESTORED</span>'
        : '<span class="hx-loss">YOU DIED</span>';
      const reached = r.victory
        ? `Act ${r.act || 3} cleared`
        : `Act ${r.act || 1} · Floor ${r.floor != null ? r.floor : '—'}`;
      const tag = r.custom
        ? `<span class="hx-custom" title="Custom Climb — excluded from win rate">CUSTOM${r.ascension ? ` A${r.ascension}` : ''}</span>`
        : '';
      return `<tr>
        <td>${outcome}</td>
        <td>${esc(r.className || r.class || '—')}${tag}</td>
        <td>${reached}</td>
        <td class="hx-num">${r.fightsWon != null ? r.fightsWon : '—'}</td>
        <td class="hx-seed">${esc(r.seed || '')}</td>
      </tr>`;
    })
    .join('');

  const customNote = customCount ? ` · ${customCount} CUSTOM (not counted)` : '';
  const body = results.length
    ? `<p class="subtitle">${total} STANDARD RUN${total === 1 ? '' : 'S'} · ${wins} WON · ${pct}% WIN RATE${customNote}</p>
       <p class="hx-byclass">${classLine}</p>
       <div class="hx-wrap">
         <table class="hx-table">
           <thead><tr><th>Outcome</th><th>Class</th><th>Reached</th><th>Fights</th><th>Seed</th></tr></thead>
           <tbody>${rows}</tbody>
         </table>
       </div>`
    : `<p class="subtitle" style="margin-top:24px">NO RUNS RECORDED YET</p>
       <p style="color:var(--muted);font-size:12px">The spire remembers those who climb it.</p>`;

  app.innerHTML = `
    <div class="screen" style="justify-content:flex-start;gap:14px;padding-top:44px">
      <h1 class="title-big" style="font-size:32px">RUN HISTORY</h1>
      ${body}
      <button id="hx-back">BACK</button>
    </div>`;

  app.querySelector('#hx-back').addEventListener('click', onBack);
}


Object.assign(module.exports, { mountHistory });

},
"src/ui/audio.js": function (module, exports, require) {
// src/ui/audio.js — procedural WebAudio engine (SPEC §7.4 audio).
//
// Hybrid design (per product decision): every sound and music bed is SYNTHESIZED
// in code today (zero assets, zero licensing), but each id also has a slot in a
// manifest so a real .ogg/.mp3 can replace it later with no call-site change —
// if `MANIFEST[id]` names a URL that loads, the sample plays instead of the synth.
//
// Wiring: `initAudio()` returns an engine; main.js sets `sfx.sink = engine.sfx`
// and calls `engine.music(context)` as screens mount. The AudioContext starts
// suspended (autoplay policy) and resumes on the first user gesture.

// A real build can point these at files; missing/failed loads fall back to synth.
const SFX_MANIFEST = {
  // cardPlay: 'assets/sfx/card.ogg',  ← example: drop a file here to override
};
const MUSIC_MANIFEST = {
  // combat: 'assets/music/combat.ogg',
};

// Minor / phrygian-ish scales (semitone offsets from the root) per mood.
const SCALES = {
  calm: [0, 3, 5, 7, 10, 12, 15],
  tense: [0, 1, 5, 6, 7, 10, 12],
  dread: [0, 2, 3, 7, 8, 10, 12],
  hymn: [0, 2, 4, 7, 9, 12, 16], // warmer major-pentatonic-ish (shop/rest/victory)
  veiled: [0, 3, 5, 6, 10, 12, 15], // dorian-flavored, wistful
  wrath: [0, 1, 4, 5, 8, 11, 12], // jagged, aggressive (elite/boss)
};

// Music beds per context. Each context has a `gain`, a `drone` flag, and a set
// of procedural VARIANTS (root frequency, scale, note cadence in ms) — one is
// picked at random each time the context starts, so the score varies between a
// handful of "tracks" even with zero audio files. Shop and Rest have their own
// calmer sets; Boss/Elite their own darker ones.
// Each variant may also set `wave` (oscillator timbre) and `lift` (melodic
// stride through the scale) so variants differ in colour and contour, not just
// key/tempo — more perceived variety from the same synth.
const BEDS = {
  title: { drone: true, gain: 0.5, variants: [
    { root: 146.83, scale: 'calm', cadence: 2600, wave: 'triangle', lift: 3 },
    { root: 130.81, scale: 'dread', cadence: 3000, wave: 'sine', lift: 2 },
    { root: 164.81, scale: 'calm', cadence: 2400, wave: 'triangle', lift: 4 },
    { root: 155.56, scale: 'veiled', cadence: 2800, wave: 'sine', lift: 3 },
  ] },
  map: { drone: true, gain: 0.42, variants: [
    { root: 164.81, scale: 'calm', cadence: 2200, wave: 'triangle', lift: 3 },
    { root: 155.56, scale: 'calm', cadence: 2500, wave: 'sine', lift: 4 },
    { root: 174.61, scale: 'dread', cadence: 2000, wave: 'triangle', lift: 2 },
    { root: 146.83, scale: 'veiled', cadence: 2350, wave: 'sine', lift: 3 },
  ] },
  combat: { drone: true, gain: 0.5, pulse: true, variants: [
    { root: 130.81, scale: 'tense', cadence: 1500, wave: 'triangle', lift: 3 },
    { root: 123.47, scale: 'dread', cadence: 1300, wave: 'square', lift: 2 },
    { root: 146.83, scale: 'tense', cadence: 1400, wave: 'triangle', lift: 4 },
    { root: 138.59, scale: 'tense', cadence: 1250, wave: 'sawtooth', lift: 3 },
    { root: 130.81, scale: 'veiled', cadence: 1350, wave: 'triangle', lift: 5 },
    { root: 155.56, scale: 'dread', cadence: 1200, wave: 'square', lift: 2 },
  ] },
  elite: { drone: true, gain: 0.55, pulse: true, variants: [
    { root: 110.0, scale: 'tense', cadence: 1150, wave: 'sawtooth', lift: 3 },
    { root: 103.83, scale: 'dread', cadence: 1050, wave: 'square', lift: 2 },
    { root: 116.54, scale: 'wrath', cadence: 1100, wave: 'sawtooth', lift: 4 },
    { root: 98.0, scale: 'wrath', cadence: 1000, wave: 'square', lift: 3 },
  ] },
  boss: { drone: true, gain: 0.6, pulse: true, variants: [
    { root: 98.0, scale: 'dread', cadence: 1000, wave: 'sawtooth', lift: 2 },
    { root: 92.5, scale: 'wrath', cadence: 900, wave: 'square', lift: 3 },
    { root: 87.31, scale: 'wrath', cadence: 950, wave: 'sawtooth', lift: 4 },
    { root: 82.41, scale: 'dread', cadence: 860, wave: 'square', lift: 2 },
    { root: 103.83, scale: 'wrath', cadence: 920, wave: 'sawtooth', lift: 3 },
  ] },
  shop: { drone: true, gain: 0.4, variants: [
    { root: 196.0, scale: 'hymn', cadence: 2200, wave: 'triangle', lift: 3 },
    { root: 174.61, scale: 'calm', cadence: 2000, wave: 'sine', lift: 4 },
    { root: 220.0, scale: 'hymn', cadence: 2400, wave: 'triangle', lift: 2 },
  ] },
  rest: { drone: true, gain: 0.34, variants: [
    { root: 130.81, scale: 'calm', cadence: 3200, wave: 'sine', lift: 3 },
    { root: 146.83, scale: 'hymn', cadence: 3000, wave: 'sine', lift: 2 },
    { root: 123.47, scale: 'veiled', cadence: 3400, wave: 'triangle', lift: 3 },
  ] },
  victory: { drone: false, gain: 0.5, variants: [
    { root: 196.0, scale: 'hymn', cadence: 1400, wave: 'triangle', lift: 3 },
    { root: 220.0, scale: 'hymn', cadence: 1200, wave: 'triangle', lift: 4 },
    { root: 246.94, scale: 'calm', cadence: 1300, wave: 'sine', lift: 2 },
  ] },
};

// Contexts that can be backed by external audio files. A manifest maps each to
// a list of file paths (see configureMusic); missing/failed loads fall back to
// the procedural bed above.
const MUSIC_CONTEXTS = Object.keys(BEDS);

function initAudio(settings = {}) {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return silentEngine();

  const ctx = new Ctx();
  const master = ctx.createGain();
  const musicBus = ctx.createGain();
  const sfxBus = ctx.createGain();
  musicBus.connect(master);
  sfxBus.connect(master);
  master.connect(ctx.destination);

  const state = {
    musicVol: clampVol(settings.musicVolume, 55),
    sfxVol: clampVol(settings.sfxVolume, 75),
    muted: settings.muteAudio === true,
    context: null, // current music bed key
    nodes: [], // live music nodes to tear down on switch
    timer: null,
    pulseTimer: null, // rhythmic low-thump layer (battle beds)
    sampleCache: new Map(),
    folder: '', // external music folder/URL
    tracks: {}, // context → [track urls] from the folder manifest
    mediaEl: null, // currently-playing external <audio>, if any
    mediaSources: new WeakMap(), // <audio> → MediaElementSource (one per element)
  };
  applyGains();

  function applyGains() {
    const m = state.muted ? 0 : 1;
    master.gain.value = 0.9 * m;
    musicBus.gain.value = state.musicVol / 100;
    sfxBus.gain.value = state.sfxVol / 100;
  }

  // The context begins suspended; the first gesture resumes it.
  function resume() {
    if (ctx.state === 'suspended') ctx.resume();
  }
  ['pointerdown', 'keydown'].forEach((ev) =>
    addEventListener(ev, resume, { once: false, capture: true })
  );

  // ---- SFX -----------------------------------------------------------------
  function sfx(id) {
    if (state.muted || state.sfxVol <= 0) return;
    resume();
    if (SFX_MANIFEST[id]) {
      playSample(SFX_MANIFEST[id], sfxBus);
      return;
    }
    synthSfx(id);
  }

  const now = () => ctx.currentTime;

  function tone({ type = 'sine', freq, to, t0 = 0, dur, peak = 0.6, bus = sfxBus }) {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    const start = now() + t0;
    o.frequency.setValueAtTime(freq, start);
    if (to != null) o.frequency.exponentialRampToValueAtTime(Math.max(1, to), start + dur);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(peak, start + Math.min(0.02, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g).connect(bus);
    o.start(start);
    o.stop(start + dur + 0.02);
  }

  function noise({ dur, peak = 0.5, t0 = 0, hp = 400, lp = 6000, bus = sfxBus }) {
    const frames = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, frames, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < frames; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / frames);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const hpF = ctx.createBiquadFilter();
    hpF.type = 'highpass';
    hpF.frequency.value = hp;
    const lpF = ctx.createBiquadFilter();
    lpF.type = 'lowpass';
    lpF.frequency.value = lp;
    const g = ctx.createGain();
    const start = now() + t0;
    g.gain.setValueAtTime(peak, start);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    src.connect(hpF).connect(lpF).connect(g).connect(bus);
    src.start(start);
    src.stop(start + dur + 0.02);
  }

  // One recipe per feedback hook. Kept short and characterful (dark fantasy).
  function synthSfx(id) {
    switch (id) {
      case 'cardPlay':
        tone({ type: 'triangle', freq: 520, to: 380, dur: 0.12, peak: 0.35 });
        break;
      case 'hit':
        noise({ dur: 0.16, peak: 0.5, hp: 300, lp: 4200 });
        tone({ type: 'square', freq: 150, to: 60, dur: 0.14, peak: 0.35 });
        break;
      case 'block':
        tone({ type: 'sine', freq: 320, to: 520, dur: 0.14, peak: 0.4 });
        noise({ dur: 0.08, peak: 0.2, hp: 2000 });
        break;
      case 'bleedBurst':
        tone({ type: 'sawtooth', freq: 220, to: 70, dur: 0.5, peak: 0.5 });
        noise({ dur: 0.4, peak: 0.35, hp: 200, lp: 2600 });
        break;
      case 'stagger':
        tone({ type: 'square', freq: 90, to: 40, dur: 0.35, peak: 0.5 });
        noise({ dur: 0.22, peak: 0.4, hp: 120, lp: 1800 });
        break;
      case 'enemyDeath':
        tone({ type: 'sawtooth', freq: 240, to: 30, dur: 0.6, peak: 0.45 });
        break;
      case 'heal':
        tone({ type: 'sine', freq: 480, to: 720, dur: 0.4, peak: 0.35 });
        tone({ type: 'sine', freq: 720, to: 960, dur: 0.4, peak: 0.2, t0: 0.06 });
        break;
      case 'stance':
        tone({ type: 'triangle', freq: 300, to: 600, dur: 0.3, peak: 0.4 });
        break;
      case 'relic':
        tone({ type: 'sine', freq: 880, to: 1320, dur: 0.25, peak: 0.3 });
        break;
      case 'flask':
        tone({ type: 'sine', freq: 640, to: 400, dur: 0.18, peak: 0.3 });
        break;
      case 'shrine':
        tone({ type: 'sine', freq: 392, to: 588, dur: 0.6, peak: 0.3 });
        break;
      case 'buy':
        tone({ type: 'triangle', freq: 700, to: 1050, dur: 0.16, peak: 0.35 });
        break;
      case 'nodeTravel':
        tone({ type: 'triangle', freq: 300, to: 460, dur: 0.14, peak: 0.3 });
        break;
      case 'uiClick':
        tone({ type: 'square', freq: 420, to: 420, dur: 0.04, peak: 0.18 });
        break;
      case 'victory':
        [392, 494, 587, 784].forEach((f, i) => tone({ type: 'triangle', freq: f, dur: 0.5, peak: 0.32, t0: i * 0.12 }));
        break;
      case 'youDied':
        tone({ type: 'sawtooth', freq: 160, to: 40, dur: 1.2, peak: 0.5 });
        break;
      default:
        tone({ type: 'sine', freq: 440, to: 440, dur: 0.05, peak: 0.15 });
    }
  }

  // ---- Music ---------------------------------------------------------------
  function stopMusic(fade = 0.6) {
    if (state.timer) {
      clearInterval(state.timer);
      state.timer = null;
    }
    if (state.pulseTimer) {
      clearInterval(state.pulseTimer);
      state.pulseTimer = null;
    }
    // Stop an external track if one is playing.
    if (state.mediaEl) {
      const el = state.mediaEl;
      state.mediaEl = null;
      try {
        el.onended = null;
        el.onerror = null;
        el.pause();
      } catch (e) {
        /* ignore */
      }
    }
    const t = now();
    for (const n of state.nodes) {
      try {
        n.gain.gain.cancelScheduledValues(t);
        n.gain.gain.setValueAtTime(n.gain.gain.value, t);
        n.gain.gain.exponentialRampToValueAtTime(0.0001, t + fade);
        n.osc.stop(t + fade + 0.05);
      } catch (e) {
        /* already stopped */
      }
    }
    state.nodes = [];
  }

  const pickRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];

  function drone(freq, gain) {
    const o = ctx.createOscillator();
    const o2 = ctx.createOscillator();
    const g = ctx.createGain();
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 700;
    o.type = 'sawtooth';
    o2.type = 'sawtooth';
    o.frequency.value = freq;
    o2.frequency.value = freq * 1.005; // slight detune = movement
    g.gain.setValueAtTime(0.0001, now());
    g.gain.exponentialRampToValueAtTime(gain, now() + 1.5);
    // slow filter LFO for an evolving pad
    const lfo = ctx.createOscillator();
    const lfoG = ctx.createGain();
    lfo.frequency.value = 0.07;
    lfoG.gain.value = 260;
    lfo.connect(lfoG).connect(lp.frequency);
    o.connect(lp);
    o2.connect(lp);
    lp.connect(g).connect(musicBus);
    o.start();
    o2.start();
    lfo.start();
    state.nodes.push({ osc: o, gain: g }, { osc: o2, gain: g }, { osc: lfo, gain: g });
  }

  function music(context) {
    if (state.context === context) return;
    state.context = context;
    stopMusic();
    const bed = BEDS[context];
    if (!bed || state.muted) return;
    resume();
    // Prefer an external track for this context if the folder provided any;
    // fall back to a procedural variant on missing/unplayable files.
    const ext = state.tracks[context];
    if (ext && ext.length) {
      playExternal(context, ext);
      return;
    }
    playProcedural(context, bed);
  }

  // Stream a random track from the context's list; when it ends, play another
  // (fresh random pick → variety). Any load/decode error → procedural bed.
  function playExternal(context, urls) {
    const url = pickRandom(urls);
    let el;
    try {
      el = new Audio(url);
      el.crossOrigin = 'anonymous';
      el.preload = 'auto';
      if (!state.mediaSources.has(el)) {
        const src = ctx.createMediaElementSource(el);
        src.connect(musicBus);
        state.mediaSources.set(el, src);
      }
    } catch (e) {
      return playProcedural(context, BEDS[context]);
    }
    el.addEventListener('ended', () => {
      if (state.context === context) playExternal(context, urls);
    });
    el.addEventListener('error', () => {
      if (state.context === context) {
        state.mediaEl = null;
        playProcedural(context, BEDS[context]);
      }
    });
    const p = el.play();
    if (p && p.catch) p.catch(() => {}); // autoplay-block is handled by resume()
    state.mediaEl = el;
  }

  function playProcedural(context, bed) {
    const variant = pickRandom(bed.variants);
    if (bed.drone) drone(variant.root / 2, 0.12 * bed.gain);
    const scale = SCALES[variant.scale];
    const lift = variant.lift || 3;
    let step = 0;
    const playNote = () => {
      const deg = scale[(step * lift + (step % 2 ? 2 : 0)) % scale.length];
      const oct = step % 4 === 0 ? 2 : 1;
      const freq = variant.root * oct * Math.pow(2, deg / 12);
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = variant.wave || 'triangle';
      o.frequency.value = freq;
      const t = now();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16 * bed.gain, t + 0.08);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
      o.connect(g).connect(musicBus);
      o.start(t);
      o.stop(t + 1.9);
      // Every few notes, lay a soft harmony a perfect fifth above — adds body
      // and variety without a second melodic line to manage.
      if (step % 3 === 1) {
        const h = ctx.createOscillator();
        const hg = ctx.createGain();
        h.type = 'sine';
        h.frequency.value = freq * 1.4983; // ~perfect fifth
        hg.gain.setValueAtTime(0.0001, t);
        hg.gain.exponentialRampToValueAtTime(0.07 * bed.gain, t + 0.12);
        hg.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
        h.connect(hg).connect(musicBus);
        h.start(t);
        h.stop(t + 1.7);
      }
      step++;
    };
    playNote();
    state.timer = setInterval(playNote, variant.cadence);

    // Battle beds get a rhythmic low thump — a heartbeat under the melody. It
    // pulses at roughly two beats per melodic note, so tenser (faster-cadence)
    // variants throb harder. Tears down with the rest via state.pulseTimer.
    if (bed.pulse) {
      const thump = () => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        const t = now();
        o.frequency.setValueAtTime(variant.root / 2, t);
        o.frequency.exponentialRampToValueAtTime(variant.root / 3, t + 0.18);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.22 * bed.gain, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);

      state.context = null;
