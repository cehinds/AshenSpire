  <title>Spire of the Erdtree</title>
  <style data-src="styles/base.css">
/* styles/base.css — palette, reset, typography (GDD §7, sprite style guide) */

:root {
  --bg: #0d0b08;
  --bg-raise: #171310;
  --panel: #241d15;
  --line: #3a3226;
  --line-soft: #4a4034;
  --parchment: #e8dcc0;
  --muted: #7a6f5a;
  --gold: #c9a227;
  --accent-rgb: 201, 162, 39; /* --gold as rgb, for glow/halo alpha (swapped by accent theme) */
  --blood: #8a1a1a;
  --rot: #b5541c;
  --frost: #7fa8c9;
  --grace: #9fc3e8;
  --ember: #c9502e;
  --green: #7fd97f;
  --font-display: 'Cinzel', Georgia, 'Times New Roman', serif;
  --font-body: Inter, 'Segoe UI', system-ui, sans-serif;
}

/* Accessibility: high contrast raises text/line contrast by swapping tokens. */
body.hi-contrast {
  --parchment: #fdf6e6;
  --muted: #a89571;
  --line: #6a5b43;
  --line-soft: #85714f;
}
body.hi-contrast .set-note, body.hi-contrast .card .ctext, body.hi-contrast .cz-keepsake p { color: #cdbf9e; }

/* Accessibility: larger text bumps body/tooltip up a notch (compounds with zoom). */
body.large-text { font-size: 15.5px; }
body.large-text #tooltip { font-size: 13px; }

/* Accessibility: colorblind-friendly semantic remap (Okabe-Ito hues chosen to
   stay distinguishable under deuteranopia/protanopia — danger→vermillion,
   heal→bluish-green, frost→sky, rot→orange, bleed→reddish-purple). */
body.cb-safe {
  --blood: #d55e00;
  --ember: #d55e00;
  --green: #009e73;
  --frost: #56b4e9;
  --grace: #56b4e9;
  --rot: #e69f00;
}
body.cb-safe .card .ctext .st-bleed { color: #cc79a7; }

/* Accessibility: readable headings swap the decorative serif for the UI sans. */
body.readable-ui { --font-display: var(--font-body); }

/* Ambient effects: 'off' also stills the title glow pulse; 'high' brightens it. */
:root[data-ambient='off'] .title-glow { animation: none; text-shadow: 0 0 20px rgba(var(--accent-rgb), 0.2); }
:root[data-ambient='high'] .title-glow { animation-duration: 2.2s; }

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }

body {
  background: radial-gradient(ellipse 60% 40% at 70% 10%, rgba(201, 162, 39, 0.06), transparent),
    linear-gradient(#16110c, var(--bg));
  color: var(--parchment);
  font-family: var(--font-body);
  font-size: 14px;
  overflow: hidden;
  user-select: none;
}

#app { height: 100vh; display: flex; flex-direction: column; }

h1, h2, h3, .display { font-family: var(--font-display); letter-spacing: 0.08em; }

button {
  font-family: var(--font-display);
  letter-spacing: 0.1em;
  background: var(--panel);
  color: var(--gold);
  border: 2px solid var(--gold);
  border-radius: 10px;
  padding: 10px 26px;
  font-size: 15px;
  cursor: pointer;
  transition: background 120ms, transform 120ms;
}
button:hover { background: #2e2517; }
button:disabled { border-color: var(--line); color: var(--muted); cursor: default; }
button.subtle { border-color: var(--line-soft); color: var(--parchment); font-size: 12px; padding: 6px 14px; }

.bar {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow: hidden;
}
.bar > .fill { position: absolute; inset: 0; right: auto; transition: width 200ms; }
.bar > .label {
  position: relative; z-index: 1; text-align: center; font-size: 10px;
  line-height: 1; padding: 2px 0; color: var(--parchment); text-shadow: 0 1px 2px #000;
}

/* ---------- screen transitions (every mount fades in) ---------- */
#app > * { animation: screenIn 240ms ease-out; }
@keyframes screenIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

/* Accessibility: honor reduced-motion for ALL animation (GDD §6). */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* Manual override from Settings — applies regardless of the OS preference. */
.reduced-motion, .reduced-motion *, .reduced-motion *::before, .reduced-motion *::after {
  animation-duration: 0.01ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: 0.01ms !important;
}

  </style>
  <style data-src="styles/ui.css">
/* styles/ui.css — tooltips, cards, modals, screens shared chrome */

/* ---------- tooltip ---------- */
#tooltip {
  position: fixed; z-index: 1000; max-width: 280px; pointer-events: none;
  background: #14100c; border: 1px solid var(--gold); border-radius: 8px;
  padding: 10px 12px; font-size: 12px; line-height: 1.5; color: var(--parchment);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.7); display: none;
}
#tooltip .tt-title { color: var(--gold); font-family: var(--font-display); font-size: 13px; margin-bottom: 4px; }
#tooltip .tt-kw { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; color: var(--muted); }
#tooltip .tt-kw b { color: var(--parchment); }

/* ---------- card ---------- */
.card {
  position: relative; width: 140px; height: 196px; border-radius: 10px;
  background: linear-gradient(#241e15, #1a1510);
  border: 2px solid #5a5040; color: var(--parchment);
  display: flex; flex-direction: column; align-items: center;
  padding: 26px 8px 8px; cursor: pointer; flex-shrink: 0;
  transition: transform 140ms, box-shadow 140ms, border-color 140ms;
}
.card.rarity-uncommon { border-color: var(--frost); }
.card.rarity-rare { border-color: var(--gold); }
.card.rarity-special { border-color: #6a3a7a; }
.card .cost {
  position: absolute; top: -10px; left: -10px; width: 30px; height: 30px;
  border-radius: 50%; background: #1c1610; border: 2px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; color: var(--parchment);
}
.card.unaffordable { filter: grayscale(0.7) brightness(0.7); }
.card .cname { font-family: var(--font-display); font-size: 11.5px; text-align: center; line-height: 1.15; min-height: 26px; }
.card.upgraded .cname { color: var(--green); }
.card .art {
  width: 116px; height: 66px; margin: 3px 0; border-radius: 6px;
  background: #14100c; border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center; font-size: 34px;
}
.card .ctype {
  width: 116px; border-radius: 4px; background: #2a241c; color: var(--gold);
  font-size: 9px; letter-spacing: 3px; text-align: center; padding: 3px 0;
  font-family: var(--font-display);
}
.card .ctext { font-size: 11px; text-align: center; line-height: 1.4; margin-top: 6px; }
.card .ctext .kw { color: var(--gold); }
.card .ctext .st-bleed { color: var(--ember); font-weight: 600; }
.card .ctext .val { font-weight: 700; }
.card .ctext .val.up { color: var(--green); }
.card .ctext .val.down { color: var(--ember); }

/* ---------- modal / pile viewer ---------- */
.modal-veil {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); z-index: 500;
  display: flex; align-items: center; justify-content: center;
}
.modal {
  background: var(--bg-raise); border: 1px solid var(--gold); border-radius: 12px;
  max-width: 900px; max-height: 80vh; padding: 22px; overflow: auto;
}
.modal h2 { color: var(--gold); font-size: 16px; margin-bottom: 14px; }
.modal .grid { display: flex; flex-wrap: wrap; gap: 14px; }

/* ---------- in-run tabbed overlay ---------- */
.overlay-modal { width: 760px; max-width: 92vw; height: 74vh; display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.overlay-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.overlay-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.overlay-tabs .ov-tab {
  padding: 7px 14px; border-radius: 8px 8px 0 0; font-size: 12px; letter-spacing: 0.05em;
  background: transparent; border: 1px solid transparent; color: var(--muted); cursor: pointer;
}
.overlay-tabs .ov-tab:hover { color: var(--parchment); }
.overlay-tabs .ov-tab.on { color: var(--gold); border-color: var(--line); border-bottom-color: transparent; background: var(--bg-raise); }
.overlay-actions { display: flex; gap: 8px; align-items: center; }
.overlay-body { flex: 1; overflow: auto; padding: 18px; }
.overlay-body .grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.ov-relic-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.ov-relic { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line-soft); border-radius: 8px; }
.ov-relic-ic { font-size: 20px; flex-shrink: 0; }
.ov-relic b { color: var(--parchment); font-size: 13px; }
.ov-relic p { color: var(--muted); font-size: 11px; margin-top: 2px; line-height: 1.4; }
.ov-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 22px; max-width: 520px; }
.ov-stat { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line-soft); padding: 6px 0; }
.ov-stat span { color: var(--muted); font-size: 12px; }
.ov-stat b { color: var(--parchment); font-size: 12px; }
.set-cat { color: var(--gold); font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; margin: 14px 0 4px; }
.set-cat:first-child { margin-top: 0; }
.subtle.danger { border-color: var(--blood); color: var(--ember); }
.subtle.danger:hover { background: rgba(140, 30, 30, 0.25); border-color: var(--ember); }

/* ---------- keyboard / gamepad focus cursor ---------- */
.gp-focus {
  outline: 3px solid var(--gold) !important; outline-offset: 2px;
  box-shadow: 0 0 16px rgba(var(--accent-rgb), 0.6) !important; border-radius: 6px;
}
.map-node.gp-focus circle { stroke: var(--gold) !important; stroke-width: 4 !important; }
.reduced-motion .gp-focus { box-shadow: none !important; }

/* ---------- controls / rebinds ---------- */
.rebind-list { display: flex; flex-direction: column; }
.rebind-row .rebind-ctl { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.pad-btn {
  min-width: 62px; text-align: center; padding: 4px 8px; border-radius: 6px;
  background: var(--panel); border: 1px solid var(--gold); color: var(--gold);
  font-size: 12px; font-variant-numeric: tabular-nums;
}
.rebind-btn.listening { border-color: var(--ember); color: var(--ember); animation: pulse-gold 0.7s ease-in-out infinite alternate; }
.pad-live { color: var(--green); font-size: 11px; }
.pad-off { color: var(--muted); font-size: 11px; }

/* ---------- custom climb ---------- */
.mod-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.mod-chip {
  text-align: left; padding: 8px 12px; border-radius: 8px; cursor: pointer;
  background: var(--panel); border: 1px solid var(--line-soft); color: var(--parchment);
  display: flex; flex-direction: column; gap: 2px; transition: border-color 140ms, background 140ms;
}
.mod-chip b { font-size: 12px; }
.mod-chip span { font-size: 10.5px; color: var(--muted); line-height: 1.35; }
.mod-chip:hover { border-color: var(--gold); }
.mod-chip.on { background: rgba(201, 162, 39, 0.16); border-color: var(--gold); }
.mod-chip.on b { color: var(--gold); }
.mod-chip.forced { cursor: not-allowed; opacity: 0.85; }
.mod-chip.forced::after { content: 'ASCENSION'; font-size: 8px; letter-spacing: 0.12em; color: var(--ember); margin-top: 2px; }
.customrun .cz-label { color: var(--muted); font-size: 11px; letter-spacing: 0.18em; margin-bottom: 6px; }
.draft-grid { gap: 16px; }
.hx-custom { display: inline-block; margin-left: 6px; padding: 1px 5px; border-radius: 4px; font-size: 9px; letter-spacing: 0.08em; background: rgba(201, 162, 39, 0.18); border: 1px solid var(--gold); color: var(--gold); }
.farewell { gap: 22px; }
.farewell .title-big { opacity: 0.9; }

/* ---------- generic screens ---------- */
.screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; }
.screen .title-big { font-size: 44px; color: var(--gold); text-align: center; text-shadow: 0 0 40px rgba(201, 162, 39, 0.35); }
.screen .subtitle { color: var(--muted); letter-spacing: 0.3em; font-size: 12px; }
.seed-line { color: var(--muted); font-size: 12px; }
.seed-line input {
  background: var(--panel); border: 1px solid var(--line); color: var(--parchment);
  border-radius: 6px; padding: 4px 8px; width: 110px; font-family: monospace; text-align: center;
}

.class-row { display: flex; gap: 18px; }
.class-pick {
  width: 190px; padding: 16px; border: 2px solid var(--line-soft); border-radius: 12px;
  background: var(--panel); cursor: pointer; text-align: center; transition: border-color 150ms, transform 150ms;
}
.class-pick:hover { border-color: var(--gold); transform: translateY(-3px); }
.class-pick.locked { opacity: 0.45; cursor: default; }
.class-pick.locked:hover { border-color: var(--line-soft); transform: none; }
.class-pick .glyph { font-size: 44px; margin-bottom: 8px; }
.class-pick h3 { color: var(--gold); font-size: 15px; margin-bottom: 6px; }
.class-pick p { font-size: 11px; color: var(--muted); line-height: 1.5; }
.class-pick .chip { display: inline-block; margin-top: 8px; font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; }

.stats-table { border-collapse: collapse; font-size: 13px; }
.stats-table td { padding: 4px 14px; }
.stats-table td:first-child { color: var(--muted); text-align: right; }

.deck-strip { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 860px; }
.deck-strip .mini {
  font-size: 11px; border: 1px solid var(--line-soft); border-radius: 6px;
  background: var(--panel); padding: 3px 8px;
}
.deck-strip .mini.upgraded { color: var(--green); }

.validation-banner {
  background: #3a1010; border-bottom: 2px solid #ff6b6b; color: #ffb3b3;
  padding: 8px 16px; font-size: 12px; font-family: monospace; white-space: pre-wrap;
}

/* reward screen */
.reward-row { display: flex; gap: 22px; }
.reward-row .card:hover { transform: translateY(-8px) scale(1.06); box-shadow: 0 10px 30px rgba(201, 162, 39, 0.25); }
.heal-note { color: var(--green); font-size: 13px; }

/* ---------- save slots (title) ---------- */
.slot-list { display: flex; flex-direction: column; gap: 10px; width: 430px; max-width: 92vw; animation: screenIn 500ms ease-out; }
.slot {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 11px 16px; border: 1.5px solid var(--line-soft); border-radius: 12px;
  background: var(--panel); transition: border-color 150ms, transform 150ms;
}
.slot.occupied:hover { border-color: var(--gold); transform: translateY(-1px); }
.slot.empty { opacity: 0.9; }
.slot-info { display: flex; flex-direction: column; gap: 2px; text-align: left; }
.slot-tag { color: var(--muted); font-size: 9px; letter-spacing: 0.22em; }
.slot-title { color: var(--gold); font-family: var(--font-display); font-size: 15px; }
.slot-meta { color: var(--parchment); font-size: 11px; }
.slot-seed { color: var(--muted); font-size: 10px; font-family: monospace; }
.slot-empty-label { color: var(--muted); font-size: 13px; font-style: italic; }
.slot-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.slot-delete { min-width: 34px; padding: 6px 8px; }
.slot-delete.armed { color: var(--blood); border-color: var(--blood); }
.save-toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 60;
  background: var(--bg-raise); border: 1px solid var(--gold); color: var(--gold);
  padding: 8px 18px; border-radius: 8px; font-size: 12px; letter-spacing: 0.1em;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6); animation: screenIn 200ms ease-out;
}
.map-buttons { display: flex; gap: 8px; }

/* ---------- main menu ambience ---------- */
.title-screen { position: relative; overflow: hidden; }
.title-stack { animation: screenIn 700ms ease-out; }
.title-menu { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.title-glow { animation: titleGlow 3.2s ease-in-out infinite alternate; }
@keyframes titleGlow {
  from { text-shadow: 0 0 26px rgba(201, 162, 39, 0.25); }
  to { text-shadow: 0 0 60px rgba(201, 162, 39, 0.6); }
}
.ember {
  position: absolute; bottom: -10px; width: 4px; height: 4px; border-radius: 50%;
  background: var(--ember); box-shadow: 0 0 8px var(--ember); opacity: 0;
  animation: emberFloat 9s linear infinite;
}
@keyframes emberFloat {
  0% { transform: translate(0, 0); opacity: 0; }
  12% { opacity: 0.8; }
  60% { opacity: 0.5; }
  100% { transform: translate(26px, -92vh); opacity: 0; }
}

/* ---------- character customization ---------- */
.cz-portrait {
  width: 130px; height: 160px; border-radius: 12px; background: #2a2418;
  border: 3px solid var(--gold); display: flex; align-items: center; justify-content: center;
  font-size: 64px; transition: border-color 200ms, box-shadow 300ms;
}
.cz-label { color: var(--muted); font-size: 10px; letter-spacing: 0.3em; margin-bottom: 6px; }
.cz-opts { display: flex; gap: 8px; }
.cz-opt {
  width: 40px; height: 40px; border-radius: 9px; background: var(--panel);
  border: 2px solid var(--line-soft); display: flex; align-items: center; justify-content: center;
  font-size: 20px; cursor: pointer; transition: transform 120ms, border-color 120ms;
}
.cz-opt:hover { transform: translateY(-2px); }
.cz-opt.chosen { border-color: var(--parchment); }
.cz-opt.tint.chosen { outline: 2px solid var(--parchment); outline-offset: 2px; }
.cz-class.chosen { border-color: var(--gold); box-shadow: 0 0 18px rgba(201, 162, 39, 0.25); }
.cz-keepsakes { display: flex; flex-direction: column; gap: 8px; }
.cz-keepsake {
  display: flex; gap: 10px; align-items: center; background: var(--panel);
  border: 1.5px solid var(--line-soft); border-radius: 10px; padding: 8px 12px;
  cursor: pointer; transition: border-color 120ms;
}
.cz-keepsake:hover { border-color: var(--muted); }
.cz-keepsake.chosen { border-color: var(--gold); }
.cz-keepsake .ks-icon { font-size: 22px; }
.cz-keepsake p { font-size: 11px; color: var(--muted); }

/* ---------- run history ---------- */
.hx-byclass { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; }
.hx-wrap { width: 100%; max-width: 720px; overflow-y: auto; max-height: 58vh; margin-top: 4px; }
.hx-table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.hx-table th {
  color: var(--muted); text-align: left; font-weight: 400; font-size: 10px;
  letter-spacing: 0.15em; padding: 6px 12px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--bg);
}
.hx-table td { padding: 8px 12px; border-bottom: 1px solid var(--line-soft); }
.hx-table td.hx-num { text-align: right; color: var(--muted); }
.hx-table tbody tr:hover td { background: rgba(255, 255, 255, 0.03); }
.hx-win { color: var(--gold); font-family: var(--font-display); font-size: 11px; letter-spacing: 0.08em; }
.hx-loss { color: var(--blood); font-family: var(--font-display); font-size: 11px; letter-spacing: 0.08em; }
.hx-seed { font-family: monospace; color: var(--muted); }
.go-actions { display: flex; gap: 12px; align-items: center; }

/* ---------- settings modal ---------- */
.settings-modal { min-width: 360px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.set-row b { color: var(--parchment); font-size: 13px; }
.set-note { color: var(--muted); font-size: 11px; margin-top: 3px; max-width: 230px; line-height: 1.4; }
.set-actions { display: flex; justify-content: flex-end; margin-top: 16px; }
.toggle {
  flex-shrink: 0; width: 46px; height: 26px; border-radius: 13px; background: var(--panel);
  border: 1px solid var(--line-soft); position: relative; cursor: pointer; padding: 0;
  transition: background 160ms, border-color 160ms;
}
.toggle .knob {
  position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--muted); transition: left 160ms, background 160ms;
}
.toggle.on { background: rgba(201, 162, 39, 0.25); border-color: var(--gold); }
.toggle.on .knob { left: 22px; background: var(--gold); }
.choice-group { display: flex; gap: 4px; flex-shrink: 0; }
.choice-group .choice {
  padding: 5px 9px; font-size: 10px; letter-spacing: 0.08em; border-radius: 6px;
  background: var(--panel); border: 1px solid var(--line-soft); color: var(--muted);
  cursor: pointer; transition: color 160ms, border-color 160ms, background 160ms;
}
.choice-group .choice.on { background: rgba(201, 162, 39, 0.25); border-color: var(--gold); color: var(--gold); }
.range-wrap { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.range-wrap .range-val { color: var(--gold); font-size: 11px; width: 24px; text-align: right; font-variant-numeric: tabular-nums; }
input[type='range'].set-range { width: 120px; accent-color: var(--gold); cursor: pointer; }
.set-row-wide { flex-wrap: wrap; }
.set-text {
  flex: 1; min-width: 200px; background: var(--panel); border: 1px solid var(--line);
  color: var(--parchment); border-radius: 6px; padding: 6px 10px; font-size: 12px; font-family: monospace;
}
.set-text:focus { border-color: var(--gold); outline: none; }

/* ---------- first-run tutorial overlay ---------- */
.tut-veil { position: fixed; inset: 0; z-index: 800; }
.tut-spot {

applyDisplaySettings(saves.loadMeta().settings);

// ---- run state ----------------------------------------------------------------
let run = null;
let rng = null;
let activeSlot = 1; // which save slot the current run persists to (SPEC §3.12 + slots)

// Autosave the current run to its slot (after every committed choice).
function persist() {
  saves.saveRun(run, rng, activeSlot);
}

function randomSeedString() {
  return seedToString((Math.random() * 0xffffffff) >>> 0);
}

function newRun({ classId, seedString, customization, keepsakeId, custom, slot = 1 }) {
  activeSlot = slot;
  let seed;
  try {
    seed = seedFromString(seedString || randomSeedString());
  } catch (e) {
    seed = seedFromString(randomSeedString()); // invalid chars → fresh seed
  }
  run = createRunState({ seed, classId, registries });
  run.seedString = seedToString(seed);
  run.customization = customization || { name: 'Tarnished', glyph: '⚔', tint: 'gold' };
  run.custom = custom || { ascension: 0, mods: {}, deckMode: 'standard' };
  run.stats = { fightsWon: 0, damageDealt: 0, damageTaken: 0 };
  run.path = [];
  run.seenEvents = [];
  run.lastEncounters = [];
  rng = createRng(seed);

  // Keepsake: a one-time bundle of run-level effects (content/keepsakes.js).
  const keepsake = KEEPSAKES.find((k) => k.id === keepsakeId);
  if (keepsake && keepsake.effects.length) {
    executeRunEffects({ run, registries, rng }, keepsake.effects);
  }

  // Custom Climb: alternate starting decks + start-of-run rule effects.
  const deckMode = run.custom.deckMode || 'standard';
  const mods = activeMods(run.custom);
  if (deckMode === 'sealed') {
    run.deck = createDeck(sealedDeckIds(classId), createIdGen('rc'));
  } else if (deckMode === 'draft') {
    run.deck = createDeck(draftBaseIds(), createIdGen('rc'));
  }
  if (mods.cursedStart) run.deck.push(...createDeck(['guilt'], createIdGen('cx')));
  if (mods.hoarder) run.runes += 250;

  if (deckMode === 'draft') return showDraft(); // picks, then proceeds to the map
  startClimb();
}

// After the deck is finalized (incl. any draft), generate the map and go.
function startClimb() {
  buildActMap();
  persist();
  showMap();
}

// Sealed: keep a small basic core, fill the rest with random pool cards.
function sealedDeckIds(classId) {
  const pool = registries.classes.get(classId).cardPool.slice();
  const ids = ['strike', 'strike', 'strike', 'strike', 'defend', 'defend', 'defend'];
  for (let i = 0; i < 3 && pool.length; i++) {
    const id = rng.pick('misc', pool);
    pool.splice(pool.indexOf(id), 1);
    ids.push(id);
  }
  return ids;
}
function draftBaseIds() {
  return ['strike', 'strike', 'strike', 'strike', 'defend', 'defend', 'defend'];
}

// Generate the current act's map and pre-roll every '?' node (stream
// 'events') so outcomes are seed-determined and the Stonesword Key can
// reveal them (SPEC §6).
function buildActMap() {
  run.mapGraph = generateActMap({ config: registries.mapConfig(run.actNumber), rng });
  const assigned = [];
  for (const node of Object.values(run.mapGraph.nodes)) {
    if (node.type === 'event') {
      node.resolved = resolveUnknownNode(registries, rng, { seenEvents: assigned });
      if (node.resolved.kind === 'event') assigned.push(node.resolved.eventId);
    }
  }
}

// Between acts: grace holds the spire together a little longer.
function advanceAct() {
  run.actNumber += 1;
  run.floor = 0;
  run.mapNodeId = null;
  run.path = [];
  run.lastEncounters = [];
  // Full heal between acts — halved under the "Scarce Grace" custom rule.
  if (run.custom && activeMods(run.custom).lessHealing) {
    run.hp = Math.min(run.maxHp, run.hp + Math.floor((run.maxHp - run.hp) * 0.5));
  } else {
    run.hp = run.maxHp;
  }
  buildActMap();
  persist();
  showMap();
}

function resumeRun(slot = 1) {
  activeSlot = slot;
  run = saves.loadRun(registries, slot);
  if (!run) return showTitle();
  rng = createRng(run.seed, run.streamCounters);
  if (run.combatEntered && run.combatEntered.encounterId) {
    // Mid-combat save: restart that combat from its start (SPEC §3.12).
    enterCombat(run.combatEntered.nodeId, run.combatEntered.encounterId, { resuming: true });
  } else if (run.shopStock) {
    showShop();
  } else {
    showMap();
  }
}

// ---- screens --------------------------------------------------------------------
function showTitle() {
  audio.music('title');
  run = null;
  const slots = saves.listSlots().map(({ slot, summary }) => ({
    slot,
    summary: summary && {
      ...summary,
      className: registries.classes.has(summary.class) ? registries.classes.get(summary.class).name : summary.class,
    },
  }));
  mountTitle(app, {
    slots,
    onContinue: (slot) => resumeRun(slot),
    onNew: (slot) => showCustomize(slot),
    onDelete: (slot) => {
      saves.clearRun(slot);
      showTitle();
    },
    onHistory: showHistory,
    onSettings: showSettings,
    onQuit: quitGame,
    onCustom: () => {
      const empty = slots.find((s) => !s.summary);
      showCustomRun(empty ? empty.slot : 1);
    },
  });
}

function showSettings() {
  openSettings({
    meta: saves.loadMeta(),
    onChange: (changed) => {
      const meta = saves.loadMeta();
      Object.assign(meta.settings, changed);
      saves.saveMeta(meta);
      applyDisplaySettings(meta.settings);
    },
  });
}

function showHistory() {
  mountHistory(app, { meta: saves.loadMeta(), onBack: showTitle });
}

// Quit the game entirely. In a real browser tab window.close() is usually
// blocked (the tab wasn't script-opened), so we stop the game and show a
// graceful "safe to close" screen; in a standalone/launcher window the close
// succeeds. Any in-progress run is persisted first, so nothing is lost.
function quitGame() {
  if (run) persist();
  audio.stopMusic();
  run = null;
  app.innerHTML = `
    <div class="screen farewell">
      <h1 class="title-big">GRACE FADES</h1>
      <p class="subtitle" style="text-align:center">Your climb is saved. You may close this window.</p>
      <button class="subtle" id="farewell-back">Return to title</button>
    </div>`;
  const closeTimer = setTimeout(() => {
    try {
      window.close();
    } catch (e) {
      /* browser blocked it — the farewell screen stands in */
    }
  }, 120);
  const back = app.querySelector('#farewell-back');
  if (back) {
    back.addEventListener('click', () => {
      clearTimeout(closeTimer); // changed their mind before the window closed
      showTitle();
    });
  }
}

// The in-run tabbed overlay (Deck / Relics / Stats / Settings), shared by the
// map and combat screens via their onMenu callback.
function showOverlay(initialTab = 'deck') {
  if (!run) return;
  openOverlay({
    registries,
    run,
    meta: saves.loadMeta(),
    initialTab,
    onSettingsChange: (changed) => {
      const meta = saves.loadMeta();
      Object.assign(meta.settings, changed);
      saves.saveMeta(meta);
      applyDisplaySettings(meta.settings);
      if (changed.bindings) setBindings(changed.bindings);
      if (changed.keyBindings) setKeyBindings(changed.keyBindings);
    },
    onSave: () => {
      persist();
      return activeSlot;
    },
    onQuit: () => {
      persist(); // the run is resumable from its slot via Continue
      showTitle();
    },
    onExit: quitGame, // "Quit Game" — leave the app entirely
  });
}

// A run-history record (SPEC §3.12) — enriched so the history screen can show
// class, progress, and per-class win rates.
function runResult(victory) {
  return {
    victory,
    seed: run.seedString,
    class: run.class,
    className: registries.classes.get(run.class).name,
    act: run.actNumber,
    floor: run.floor,
    fightsWon: run.stats.fightsWon,
    damageDealt: run.stats.damageDealt,
    damageTaken: run.stats.damageTaken,
    name: run.customization && run.customization.name,
    custom: isCustomRun(run.custom),
    ascension: (run.custom && run.custom.ascension) || 0,
  };
}

function showCustomize(slot = 1) {
  mountCustomize(app, {
    registries,
    defaultSeedString: randomSeedString(),
    onBack: showTitle,
    onStart: (config) => newRun({ ...config, slot }),
  });
}

function showCustomRun(slot = 1) {
  mountCustomRun(app, {
    registries,
    defaultSeedString: randomSeedString(),
    onBack: showTitle,
    onStart: (config) => newRun({ ...config, slot }),
  });
}

// Draft deck builder (Custom Climb): pick cards, then start the climb.
function showDraft() {
  mountDraft(app, {
    registries,
    classId: run.class,
    rng,
    onDone: (picks) => {
      run.deck.push(...picks);
      startClimb();
    },
  });
}

function showMap() {
  audio.music('map');
  mountMap(app, {
    registries,
    run,
    meta: saves.loadMeta(),
    onPick: enterNode,
    onSettings: showSettings,
    onMenu: showOverlay,
    onSave: () => {
      persist();
      return activeSlot;
    },
  });
}

function enterNode(nodeId) {
  sfx.play('nodeTravel');
  const node = run.mapGraph.nodes[nodeId];
  run.mapNodeId = nodeId;
  run.path.push(nodeId);
  run.floor = node.floor;

  let kind = node.type;
  if (kind === 'event') {
    const res = node.resolved || { kind: 'fight' };
    if (res.kind === 'event') {
      run.seenEvents.push(res.eventId);
      persist();
      return showEvent(res.eventId);
    }
    kind = res.kind; // fight | shrine | treasure
  }

  switch (kind) {
    case 'monster':
    case 'fight':
      return startFight('normal', nodeId);
    case 'elite':
      return startFight('elite', nodeId);
    case 'boss':
      return startFight('boss', nodeId);
    case 'shrine':
      persist();
      return showRest();
    case 'merchant': {
      const stock = buildShopStock(registries, rng, run);
      const pm = shopPriceMult();
      if (pm !== 1) {
        for (const kind of ['cards', 'relics', 'flasks']) {
          for (const item of stock[kind]) item.cost = Math.ceil(item.cost * pm);
        }
        stock.removeCost = Math.ceil(stock.removeCost * pm);
      }
      run.shopStock = stock;
      persist();
      return showShop();
    }
    case 'treasure': {
      const relicId = rollRelicReward(registries, rng, run.relics);
      return mountRewards(app, {
        registries,
        run,
        rewards: { relicId, title: 'TREASURE' },
        onDone: () => {
          persist();
          showMap();
        },
      });
    }
    default:
      throw new Error(`Unknown node kind '${kind}'`);
  }
}

// ---- combat ------------------------------------------------------------------------
// Custom Climb combat rules → generic createCombat options for a given pool.
function combatMods(pool) {
  const mods = run.custom ? activeMods(run.custom) : {};
  let hpMult = 1;
  const enemyStatuses = [];
  const playerStatuses = [];
  if ((pool === 'elite' || pool === 'boss') && mods.toughElites) hpMult *= 1.3;
  if (pool === 'boss' && mods.bigBosses) hpMult *= 1.5;
  if (mods.deadlyEnemies) enemyStatuses.push({ status: 'strength', stacks: 1 });
  if (mods.glassCannon) playerStatuses.push({ status: 'glassCannon', stacks: 1 });
  return { hpMult, enemyStatuses, playerStatuses };
}

function startFight(pool, nodeId) {
  // "Elite Gauntlet" chaos rule promotes ordinary monster nodes to elites.
  if (pool === 'normal' && run.custom && activeMods(run.custom).allElite) pool = 'elite';
  const encounterId = rollEncounter(registries, rng, { pool, act: run.actNumber, exclude: run.lastEncounters });
  if (pool === 'normal') {
    run.lastEncounters.push(encounterId);
    if (run.lastEncounters.length > 2) run.lastEncounters.shift();
  }
  enterCombat(nodeId, encounterId);
}

function enterCombat(nodeId, encounterId, { resuming = false } = {}) {
  run.combatEntered = { nodeId, encounterId };
  if (!resuming) persist(); // counters BEFORE the combat → reload restarts it identically
  const enc = registries.encounters.get(encounterId);
  audio.music(enc.pool === 'boss' ? 'boss' : enc.pool === 'elite' ? 'elite' : 'combat');
  const cm = combatMods(enc.pool);
  const combat = createCombat({
    registries,
    rng,
    player: {
      classId: run.class,
      maxHp: run.maxHp,
      hp: run.hp,
      deck: run.deck,
      relicIds: run.relics,
      flasks: run.flasks,
    },
    enemyIds: enc.enemies,
    hpMult: cm.hpMult,
    enemyStatuses: cm.enemyStatuses,
    playerStatuses: cm.playerStatuses,
  });
  const label =
    enc.pool === 'boss'
      ? registries.enemies.get(enc.enemies[0]).name.toUpperCase()
      : enc.pool === 'elite'
        ? `ELITE · FLOOR ${run.floor}`
        : `ACT ${run.actNumber} · FLOOR ${run.floor}`;
  mountCombat(app, {
    registries,
    run,
    combat,
    label,
    onEnd: (result, endedCombat) => onCombatEnd(result, endedCombat, enc),
    onSettings: showSettings,
    onMenu: showOverlay,
    showTutorial: !saves.loadMeta().settings.seenTutorial,
    onTutorialDone: () => {
      const meta = saves.loadMeta();
      meta.settings.seenTutorial = true;
      saves.saveMeta(meta);
    },
  });
}

function onCombatEnd(result, combat, enc) {
  run.flasks = combat.player.flasks; // drunk flasks stay drunk

  if (result !== 'victory') {
    audio.stopMusic();
    sfx.play('youDied');
    saves.clearRun(activeSlot);
    saves.recordResult(runResult(false));
    return mountGameOver(app, { registries, game: run, victory: false, onTitle: showTitle, onHistory: showHistory });
  }

  run.hp = combat.player.hp;
  run.stats.fightsWon += 1;
  run.combatEntered = null;

  if (enc.pool === 'boss') {
    if (run.actNumber >= 3) {
      // The Rot Valkyrie falls: the Great Rune is restored.
      audio.music('victory');
      saves.clearRun(activeSlot);
      saves.recordResult(runResult(true));
      return mountGameOver(app, { registries, game: run, victory: true, onTitle: showTitle, onHistory: showHistory });
    }
    // Act boss down: boss rewards, then the climb continues.
    const bossRewards = {
      title: `${registries.enemies.get(enc.enemies[0]).name.toUpperCase()} FALLS`,
      runes: rollRuneReward(registries, rng, 'boss', run.relics),
      cardIds: rollCardRewardIds(registries, rng, { classId: run.class, pool: 'boss', relicIds: run.relics, flatRarity: chaosRewardsOn() }),
      relicId: rollRelicReward(registries, rng, run.relics, { rarities: ['boss'] }),
    };
    return mountRewards(app, {
      registries,
      run,
      rewards: bossRewards,
      onDone: () => advanceAct(),
    });
  }

  const rewards = {
    title: enc.pool === 'elite' ? 'ELITE VANQUISHED' : 'VICTORY',
    runes: rollRuneReward(registries, rng, enc.pool, run.relics),
    cardIds: rollCardRewardIds(registries, rng, { classId: run.class, pool: enc.pool, relicIds: run.relics, flatRarity: chaosRewardsOn() }),
    flaskId: rollFlaskDrop(registries, rng, run),
    relicId: enc.pool === 'elite' ? rollRelicReward(registries, rng, run.relics) : null,
  };
  mountRewards(app, {
    registries,
    run,
    rewards,
    onDone: () => {
      persist();
      showMap();
    },
  });
}

// Custom Climb helpers used across nodes.
function chaosRewardsOn() {
  return !!(run.custom && activeMods(run.custom).chaosRewards);
}
function shopPriceMult() {
  const mods = run.custom ? activeMods(run.custom) : {};
  let m = 1;
  if (mods.expensiveShops) m *= 1.5;
  if (mods.hoarder) m *= 2;
  return m;
}

// ---- non-combat nodes -----------------------------------------------------------------
function showRest() {
  audio.music('rest');
  const healMult = run.custom && activeMods(run.custom).lessHealing ? 0.5 : 1;
  mountRest(app, {
    registries,
    run,
    healMult,
    onDone: () => {
      persist();
      showMap();
    },
  });
}

function showShop() {
  audio.music('shop');
  mountShop(app, {
    registries,
    run,
    onChanged: () => persist(),
    onLeave: () => {
      run.shopStock = null;
      persist();
      showMap();
    },
  });
}

function showEvent(eventId) {
  mountEvent(app, {
    registries,
    run,
    rng,
    eventId,
    onDone: () => {
      if (run.combatEntered) {
        // A startCombat effect stored the encounter id (string form).
        const encounterId = typeof run.combatEntered === 'string' ? run.combatEntered : run.combatEntered.encounterId;
        run.combatEntered = null;
        return enterCombat(run.mapNodeId, encounterId);
      }
      persist();
      showMap();
    },
  });
}

showTitle();

},

// src/content/relics.js — the relic pool (SPEC §5.4 base set + M3 growth to 40)
//
// Combat behavior uses the trigger DSL (SPEC §3.6); run-system behavior
// (rewards, shops, shrines, map, costs) uses the closed passive-key set.
// One deliberate retune vs. the SPEC table: Bloodied Talisman deals a flat
// +5 on Bleed bursts instead of +25% (the burst amount isn't visible to a
// trigger; flat rider keeps it pure data — revisit in the M3 balance pass).
//
// M3 content pass: 20 → 40. New relics reuse only shipped statuses/opcodes and
// proven trigger shapes. One design note worth keeping: relics that GRANT BLOCK
// on turn 1 fire on `playerTurnStart` (once), never `combatStart` — combat-start
// block is wiped by the turn-1 block-expiry (SPEC §4.1). See Erdleaf Charm.

const relics = [
  // ---- starter ---------------------------------------------------------------
  {
    id: 'tarnishedMedallion',
    name: 'Tarnished Medallion',
    rarity: 'starter',
    icon: '🏅',
    triggers: [
      {
        on: 'damageDealt',
        once: true,
        if: { p: 'all', preds: [{ p: 'eventIsAttack' }, { p: 'eventSourceIsOwner' }] },
        do: [{ op: 'poiseDamage', amount: 4 }],

"src/content/scripts.js": function (module, exports, require) {
// src/content/scripts.js — budgeted escape hatch (SPEC §3.1(6))
//
// Registry of named custom behaviors for what the DSL cannot express.
// Budget: < 5% of content objects may reference a script, and every entry
// needs a comment justifying why the DSL couldn't do it. If a script pattern
// appears twice, promote it to a DSL primitive (engine PR).

const scripts = {
  /**
   * Wondrous Physick: "Gain the effects of two DIFFERENT random flasks."
   * Why a script: the DSL has no way to reference another entity's effect
   * list dynamically ("a random flask's effects") — that's meta-content
   * selection, not effect composition. Everything the picked flasks DO still
   * runs through the ordinary DSL/queue.
   */
  wondrousPhysick(ctx, action) {
    const pool = ctx.registries.flasks
      .all()
      .filter((f) => f.id !== 'wondrousPhysick' && !usesScript(f));
    if (pool.length === 0) return;
    const first = ctx.rng.pick('misc', pool);
    const rest = pool.filter((f) => f.id !== first.id);
    const picks = rest.length ? [first, ctx.rng.pick('misc', rest)] : [first];
    for (const flask of picks) {
      for (const eff of flask.effects || []) {
        ctx.enqueue({ effect: eff, source: action.source, owner: action.owner, target: action.target, meta: action.meta || {} });
      }
    }
  },
};

function usesScript(def) {
  return (def.effects || []).some((e) => typeof e.script === 'string');
}


Object.assign(module.exports, { scripts });

},
"src/model/validate.js": function (module, exports, require) {
// src/model/validate.js — content validation (SPEC §3.14)
//
// Runs at boot in dev mode and from the test page. Checks, across ALL content:
//   1. Schema conformance (fields, types, enums; unknown fields fail loudly).
//   2. Every id cross-reference resolves (no dangling ids).
//   3. Every opcode, formula op, trigger event, and predicate is in the
//      closed sets of SPEC §3.4–§3.6.
//   4. Every text-template token binds, and every player-visible literal
//      numeric effect has a token (SPEC §3.13) — enforced for cards + relics.
//   5. scripts.js budget report: script-using content stays < 5% of content.
//
// Headless: no document/window/localStorage/timers.

const { SCHEMAS, OPCODES, EFFECT_SPECS, TARGETS, TRIGGER_EVENTS, PREDICATES, CARD_TYPES, MODIFIER_KEYS, REGISTRY_TYPES } = require("src/model/schemas.js");
const { FORMULA_OPS, FORMULA_OF, isFormula } = require("src/model/formulas.js");

// Ops whose value binds to a text-template token; token name = op name,
// except applyStatus which binds under its status id (SPEC §3.13).
const TOKENIZABLE_OPS = Object.freeze([
  'damage',
  'block',
  'heal',
  'loseHp',
  'applyStatus',
  'poiseDamage',
  'draw',
  'gainEnergy',
  'addRunes',
  'loseMaxHpPct',
]);

// Ops whose LITERAL numeric value MUST have a bound token in the template
// (a player-visible number with no token is a validation error).
const REQUIRED_TOKEN_OPS = Object.freeze([
  'damage',
  'block',
  'heal',
  'loseHp',
  'applyStatus',
  'poiseDamage',
  'draw',
  'gainEnergy',
]);

const KNOWN_BUNDLE_KEYS = new Set([
  ...REGISTRY_TYPES,
  'version',
  'contentVersion',
  'balance',
  'mapConfigs',
  'scripts',
]);

/**
 * computeTokenBindings(effects) → [{ token, index, field, op, literal }]
 *
 * Deterministic binding of template tokens to opcode values, in effect order.
 * The first occurrence of a token base binds as `{base}`, repeats as
 * `{base.2}`, `{base.3}` ... (SPEC §3.13). `hits` on a damage op binds as
 * `{hits}` (then `{hits.2}` ...). Shared by validation, previewCard, and the UI.
 */
function computeTokenBindings(effects) {
  const counts = {};
  const out = [];
  const push = (base, index, field, op, literal) => {
    counts[base] = (counts[base] || 0) + 1;
    const token = counts[base] === 1 ? base : `${base}.${counts[base]}`;
    out.push({ token, index, field, op, literal });
  };
  (effects || []).forEach((eff, i) => {
    if (!eff || typeof eff !== 'object' || typeof eff.op !== 'string') return;
    if (!TOKENIZABLE_OPS.includes(eff.op)) return;
    const field = eff.op === 'applyStatus' ? 'stacks' : eff.op === 'loseMaxHpPct' ? 'pct' : 'amount';
    const base = eff.op === 'applyStatus' ? eff.status : eff.op;
    if (typeof base !== 'string') return; // malformed; schema pass reports it
    push(base, i, field, eff.op, typeof eff[field] === 'number');
    if (eff.op === 'damage' && eff.hits != null) {
      push('hits', i, 'hits', eff.op, typeof eff.hits === 'number');
    }
  });
  return out;
}

function extractTemplateTokens(template) {
  const tokens = [];
  const re = /\{([A-Za-z][\w.]*)\}/g;
  let m;
  while ((m = re.exec(template)) !== null) tokens.push(m[1]);
  return tokens;
}

/**
 * validateContent(bundle) → { ok, errors: [{ path, msg }], scriptReport }.
 * `bundle` is the raw content bundle (same shape createRegistries takes).
 */
function validateContent(bundle) {
  const errors = [];
  const err = (path, msg) => errors.push({ path, msg });
  const b = bundle || {};

  for (const key of Object.keys(b)) {
    if (!KNOWN_BUNDLE_KEYS.has(key)) err(key, `Unknown content bundle key '${key}'`);
  }

  // ---- collect id sets for cross-reference checks -------------------------
  const ids = { scripts: new Set(Object.keys(b.scripts || {})) };
  for (const type of REGISTRY_TYPES) {
    ids[type] = new Set();
    const defs = b[type] || [];
    if (!Array.isArray(defs)) {
      err(type, `Bundle key '${type}' must be an array of defs`);
      continue;
    }
    defs.forEach((def, i) => {
      if (!def || typeof def.id !== 'string') err(`${type}[${i}]`, 'Def missing string id');
      else if (ids[type].has(def.id)) err(`${type}.${def.id}`, `Duplicate id '${def.id}'`);
      else ids[type].add(def.id);
    });
  }

  const vctx = { ids, err };

  // ---- schema walks --------------------------------------------------------
  const typeToSchema = {
    cards: SCHEMAS.card,
    relics: SCHEMAS.relic,
    statuses: SCHEMAS.status,
    stances: SCHEMAS.stance,
    keywords: SCHEMAS.keyword,
    enemies: SCHEMAS.enemy,
    encounters: SCHEMAS.encounter,
    events: SCHEMAS.event,
    flasks: SCHEMAS.flask,
    classes: SCHEMAS.class,
  };
  for (const type of REGISTRY_TYPES) {
    const defs = Array.isArray(b[type]) ? b[type] : [];
    defs.forEach((def) => {
      const path = `${type}.${(def && def.id) || '?'}`;
      walkSchema(def, typeToSchema[type], path, vctx);
    });
  }

  if (b.balance != null && (typeof b.balance !== 'object' || Array.isArray(b.balance))) {
    err('balance', 'balance must be a plain object of constants');
  }
  // balance.poise is engine-consulted data: { growthMult?, onFill? } (see ENGINE-API.md)
  if (b.balance && b.balance.poise) {
    const p = b.balance.poise;
    if (p.growthMult != null && typeof p.growthMult !== 'number') err('balance.poise.growthMult', 'must be a number');
    if (p.onFill != null) validateEffects(p.onFill, 'balance.poise.onFill', vctx);
  }

  if (b.mapConfigs != null) {
    if (typeof b.mapConfigs !== 'object' || Array.isArray(b.mapConfigs)) {
      err('mapConfigs', 'mapConfigs must be an object keyed by act number');
    } else {
      for (const act of Object.keys(b.mapConfigs)) {
        walkSchema(b.mapConfigs[act], SCHEMAS.mapConfig, `mapConfigs.${act}`, vctx);
      }
    }
  }

  // ---- entity-specific cross checks ----------------------------------------
  for (const card of b.cards || []) {
    const path = `cards.${card.id}`;
    if (typeof card.class === 'string' && card.class !== 'colorless' && !ids.classes.has(card.class)) {
      err(`${path}.class`, `class '${card.class}' is neither a class id nor 'colorless'`);
    }
    validateCardTemplates(card, path, err);
  }

  for (const relic of b.relics || []) {
    validateRelicTemplate(relic, `relics.${relic.id}`, err);
  }

  for (const enemy of b.enemies || []) {
    const path = `enemies.${enemy.id}`;
    const moveIds = new Set(Object.keys(enemy.moves || {}));
    if (enemy.firstMove != null && !moveIds.has(enemy.firstMove)) {
      err(`${path}.firstMove`, `firstMove '${enemy.firstMove}' is not one of this enemy's moves`);
    }
    for (const [pi, phase] of (enemy.phases || []).entries()) {
      for (const mv of phase.unlockMoves || []) {
        if (!moveIds.has(mv)) err(`${path}.phases[${pi}].unlockMoves`, `unlockMoves '${mv}' is not one of this enemy's moves`);
      }
      if (phase.on === 'hpBelowPct' && typeof phase.pct !== 'number') {
        err(`${path}.phases[${pi}]`, "phases with on:'hpBelowPct' require a numeric pct");
      }
    }
  }

  // ---- scripts budget (SPEC §3.1(6), §3.14(5)) -----------------------------
  const scriptUsers = [];
  let totalObjects = 0;
  for (const type of REGISTRY_TYPES) {
    for (const def of b[type] || []) {
      totalObjects++;
      if (usesScript(def)) scriptUsers.push(`${type}.${def.id}`);
    }
  }
  const scriptPct = totalObjects === 0 ? 0 : (scriptUsers.length / totalObjects) * 100;
  if (scriptPct >= 5) {
    err('scripts', `scripts budget exceeded: ${scriptUsers.length}/${totalObjects} content objects (${scriptPct.toFixed(1)}%) use scripts (must stay < 5%). Users: ${scriptUsers.join(', ')}`);
  }
  const scriptReport = {
    count: scriptUsers.length,
    total: totalObjects,
    pct: scriptPct,
    users: scriptUsers,
  };

  return { ok: errors.length === 0, errors, scriptReport };
}

// ---------------------------------------------------------------------------
// Schema walker
// ---------------------------------------------------------------------------

function walkSchema(value, node, path, vctx) {
  const { err } = vctx;
  if (!node) {
    err(path, 'Internal: missing schema node');
    return;
  }
  switch (node.k) {
    case 'any':
      return;
    case 'str':
      if (typeof value !== 'string') err(path, `Expected string, got ${describe(value)}`);
      return;
    case 'num':
      if (typeof value !== 'number' || Number.isNaN(value)) {
        err(path, `Expected number, got ${describe(value)}`);
      } else if (node.int && !Number.isInteger(value)) {
        err(path, `Expected integer, got ${value}`);
      }
      return;
    case 'bool':
      if (typeof value !== 'boolean') err(path, `Expected boolean, got ${describe(value)}`);
      return;
    case 'enum':
      if (!node.values.includes(value)) {
        err(path, `Expected one of [${node.values.join(', ')}], got ${describe(value)}`);
      }
      return;
    case 'arr':
      if (!Array.isArray(value)) {
        err(path, `Expected array, got ${describe(value)}`);
        return;
      }
      if (node.len != null && value.length !== node.len) {
        err(path, `Expected array of length ${node.len}, got ${value.length}`);
      }
      value.forEach((v, i) => walkSchema(v, node.of, `${path}[${i}]`, vctx));
      return;
    case 'map':
      if (!isPlainObject(value)) {
        err(path, `Expected object map, got ${describe(value)}`);
        return;
      }
      for (const key of Object.keys(value)) walkSchema(value[key], node.of, `${path}.${key}`, vctx);
      return;
    case 'obj': {
      if (!isPlainObject(value)) {
        err(path, `Expected object, got ${describe(value)}`);
        return;
      }
      for (const key of Object.keys(value)) {
        if (!(key in node.fields)) err(`${path}.${key}`, `Unknown field '${key}'`);
      }
      for (const [key, fieldNode] of Object.entries(node.fields)) {
        if (value[key] === undefined) {
          if (!fieldNode.opt) err(`${path}.${key}`, `Missing required field '${key}'`);
          continue;
        }
        walkSchema(value[key], fieldNode, `${path}.${key}`, vctx);
      }
      return;
    }
    case 'union': {
      // Accept if any branch matches without producing errors.
      for (const branch of node.anyOf) {
        const probeErrors = [];
        const probe = { ids: vctx.ids, err: (p, m) => probeErrors.push({ p, m }) };
        walkSchema(value, branch, path, probe);
        if (probeErrors.length === 0) return;
      }
      err(path, `Value ${describe(value)} matched no allowed variant`);
      return;
    }
    case 'ref':
      if (typeof value !== 'string') {
        err(path, `Expected ${node.reg} id string, got ${describe(value)}`);
      } else if (!vctx.ids[node.reg] || !vctx.ids[node.reg].has(value)) {
        err(path, `Dangling reference: unknown ${node.reg} id '${value}'`);
      }
      return;
    case 'effects':
      validateEffects(value, path, vctx);
      return;
    case 'triggers':
      validateTriggers(value, path, vctx);
      return;
    case 'predicate':
      validatePredicate(value, path, vctx);
      return;
    case 'formulaOrNum':
      validateFormula(value, path, vctx);

  if (v === null) return 'null';
  if (Array.isArray(v)) return 'array';

  return v !== null && typeof v === 'object' && !Array.isArray(v);

// Effects / triggers / predicates / formulas (closed-set checks)

const COMMON_EFFECT_FIELDS = ['op', 'target', 'amount', 'if', 'repeat'];

  if (!Array.isArray(effects)) {

    if (!isPlainObject(eff)) {

      return;
    }

      return;

    for (const key of Object.keys(eff)) {
      if (!allowed.has(key)) err(`${p}.${key}`, `Unknown field '${key}' on opcode '${eff.op}'`);
    }
    for (const req of spec.required) {
      if (eff[req] === undefined) err(p, `Opcode '${eff.op}' missing required field '${req}'`);
    }
    if (eff.target !== undefined && !TARGETS.includes(eff.target)) {
      err(`${p}.target`, `Unknown target '${eff.target}' (closed set: ${TARGETS.join(', ')})`);

      if (eff[numeric] !== undefined) validateFormula(eff[numeric], `${p}.${numeric}`, vctx);
    }
    if (eff.if !== undefined) validatePredicate(eff.if, `${p}.if`, vctx);
    for (const [field, reg] of Object.entries(spec.refs)) {
      const v = eff[field];
      if (typeof v === 'string' && !vctx.ids[reg].has(v)) {
        err(`${p}.${field}`, `Dangling reference: unknown ${reg} id '${v}'`);
      }
    }
    if (eff.op === 'addCard') {
      if (eff.pile !== undefined && !['draw', 'hand', 'discard', 'exhaust'].includes(eff.pile)) {
        err(`${p}.pile`, `Unknown pile '${eff.pile}'`);
      }
      if (eff.position !== undefined && !['top', 'bottom', 'random'].includes(eff.position)) {
        err(`${p}.position`, `Unknown position '${eff.position}'`);
      }
    }

}

const TRIGGER_FIELDS = new Set(['on', 'if', 'do', 'once', 'limitPerTurn']);

function validateTriggers(triggers, path, vctx) {
  const { err } = vctx;
  if (!Array.isArray(triggers)) {
    err(path, `Expected triggers array, got ${describe(triggers)}`);
    return;
  }
  triggers.forEach((trig, i) => {
    const p = `${path}[${i}]`;
    if (!isPlainObject(trig)) {
      err(p, `Trigger must be an object, got ${describe(trig)}`);
      return;
    }
    for (const key of Object.keys(trig)) {
      if (!TRIGGER_FIELDS.has(key)) err(`${p}.${key}`, `Unknown trigger field '${key}'`);
    }
    if (!TRIGGER_EVENTS.includes(trig.on)) {
      err(`${p}.on`, `Unknown trigger event '${trig.on}' (closed set, SPEC §3.10)`);
    }
    if (trig.if !== undefined) validatePredicate(trig.if, `${p}.if`, vctx);
    if (trig.once !== undefined && typeof trig.once !== 'boolean') err(`${p}.once`, 'once must be boolean');
    if (trig.limitPerTurn !== undefined && !Number.isInteger(trig.limitPerTurn)) {
      err(`${p}.limitPerTurn`, 'limitPerTurn must be an integer');
    }
    validateEffects(trig.do, `${p}.do`, vctx);
  });
}

const PREDICATE_FIELDS = {
  inStance: ['stance'],
  hasStatus: ['of', 'status', 'atLeast'],
  hasBlock: ['of'],
  hpBelowPct: ['of', 'pct'],
  firstCardThisTurn: [],
  firstAttackThisCombat: [],
  cardTypeIs: ['type'],
  everyNthCardThisCombat: ['n'],
  random: ['pct'],
  eventIsAttack: [],
  eventSourceIsOwner: [],
  eventTargetIsOwner: [],
  eventStatusIs: ['status'],
  all: ['preds'],
  any: ['preds'],
  not: ['pred'],
};

function validatePredicate(pred, path, vctx) {
  const { err } = vctx;
  if (!isPlainObject(pred) || typeof pred.p !== 'string') {
    err(path, `Predicate must be an object with a 'p' field, got ${describe(pred)}`);
    return;
  }
  if (!PREDICATES.includes(pred.p)) {
    err(path, `Unknown predicate '${pred.p}' (closed set, SPEC §3.6)`);
    return;
  }
  const allowed = new Set(['p', ...PREDICATE_FIELDS[pred.p]]);
  for (const key of Object.keys(pred)) {
    if (!allowed.has(key)) err(`${path}.${key}`, `Unknown field '${key}' on predicate '${pred.p}'`);
  }
  const PRED_OF = ['self', 'owner', 'player', 'enemy', 'target'];
  if (pred.of !== undefined && !PRED_OF.includes(pred.of)) {
    err(`${path}.of`, `Unknown entity ref '${pred.of}' (allowed: ${PRED_OF.join(', ')})`);
  }
  switch (pred.p) {
    case 'inStance':
      if (typeof pred.stance !== 'string' || !vctx.ids.stances.has(pred.stance)) {
        err(`${path}.stance`, `Dangling reference: unknown stance id '${pred.stance}'`);
      }
      break;
    case 'hasStatus':
    case 'eventStatusIs':
      if (typeof pred.status !== 'string' || !vctx.ids.statuses.has(pred.status)) {
        err(`${path}.status`, `Dangling reference: unknown status id '${pred.status}'`);
      }
      break;
    case 'cardTypeIs':
      if (!CARD_TYPES.includes(pred.type)) err(`${path}.type`, `Unknown card type '${pred.type}'`);
      break;
    case 'everyNthCardThisCombat':
      if (!Number.isInteger(pred.n) || pred.n < 1) err(`${path}.n`, 'n must be a positive integer');
      break;
    case 'random':
      if (typeof pred.pct !== 'number') err(`${path}.pct`, 'pct must be a number');
      break;
    case 'all':
    case 'any':
      if (!Array.isArray(pred.preds)) err(`${path}.preds`, `'${pred.p}' requires a preds array`);
      else pred.preds.forEach((sub, i) => validatePredicate(sub, `${path}.preds[${i}]`, vctx));
      break;
    case 'not':
      validatePredicate(pred.pred, `${path}.pred`, vctx);
      break;
    default:
      break;
  }
}

const FORMULA_FIELDS = {
  add: ['args'],
  mul: ['args'],
  percentMaxHp: ['of', 'pct', 'min', 'max'],
  missingHp: ['of', 'min', 'max'],
  stacks: ['status', 'of', 'per', 'min', 'max'],

  blockOf: ['of', 'min', 'max'],
  hpOf: ['of', 'min', 'max'],
  cardsPlayedThisTurn: ['per', 'min', 'max'],

  const { err } = vctx;

    if (Number.isNaN(value)) err(path, 'Formula literal is NaN');
    return;
  }
  if (!isFormula(value)) {
    err(path, `Expected number or formula object, got ${describe(value)}`);
    return;
  }
  if (!FORMULA_OPS.includes(value.f)) {
    err(path, `Unknown formula op '${value.f}' (closed set, SPEC §3.5)`);
    return;
  }
  const allowed = new Set(['f', ...FORMULA_FIELDS[value.f]]);
  for (const key of Object.keys(value)) {
    if (!allowed.has(key)) err(`${path}.${key}`, `Unknown field '${key}' on formula '${value.f}'`);
  }
  if (value.of !== undefined && !FORMULA_OF.includes(value.of)) {
    err(`${path}.of`, `Unknown entity ref '${value.of}' (allowed: ${FORMULA_OF.join(', ')})`);
  }
  if (value.f === 'add' || value.f === 'mul') {
    if (!Array.isArray(value.args)) err(`${path}.args`, `'${value.f}' requires an args array`);
    else value.args.forEach((a, i) => validateFormula(a, `${path}.args[${i}]`, vctx));
  }
  if (value.f === 'stacks') {
    if (typeof value.status !== 'string' || !vctx.ids.statuses.has(value.status)) {
      err(`${path}.status`, `Dangling reference: unknown status id '${value.status}'`);
    }
    if (value.of === undefined) err(`${path}.of`, "'stacks' requires 'of'");
  }
  if (['percentMaxHp', 'missingHp', 'blockOf', 'hpOf'].includes(value.f) && value.of === undefined) {
    err(`${path}.of`, `'${value.f}' requires 'of'`);
  }
  if (value.f === 'percentMaxHp' && typeof value.pct !== 'number') {
    err(`${path}.pct`, "'percentMaxHp' requires a numeric pct");
  }
}

// ---------------------------------------------------------------------------
// Text templating (SPEC §3.13)
// ---------------------------------------------------------------------------

function checkTemplate(template, effects, path, err) {
  const bindings = computeTokenBindings(effects);
  const bound = new Set(bindings.map((bd) => bd.token));
  for (const token of extractTemplateTokens(template)) {
    if (!bound.has(token)) {
      err(path, `Template token '{${token}}' does not bind to any effect value`);
    }

  const used = new Set(extractTemplateTokens(template));
  for (const bd of bindings) {
    if (bd.literal && REQUIRED_TOKEN_OPS.includes(bd.op) && !used.has(bd.token)) {

  checkTemplate(card.textTemplate, card.effects, `${path}.textTemplate`, err);
  if (card.upgrade) {
    const upTemplate = card.upgrade.textTemplate != null ? card.upgrade.textTemplate : card.textTemplate;
    const upEffects = card.upgrade.effects != null ? card.upgrade.effects : card.effects;
    if (typeof upTemplate === 'string' && Array.isArray(upEffects)) {
      checkTemplate(upTemplate, upEffects, `${path}.upgrade.textTemplate`, err);
    }
  }
}

function validateRelicTemplate(relic, path, err) {
  if (typeof relic.textTemplate !== 'string' || !Array.isArray(relic.triggers)) return;
  const effects = [];
  for (const trig of relic.triggers) {
    if (trig && Array.isArray(trig.do)) effects.push(...trig.do);
  }
  checkTemplate(relic.textTemplate, effects, `${path}.textTemplate`, err);
}

// ---------------------------------------------------------------------------
// Scripts budget helpers
// ---------------------------------------------------------------------------

function usesScript(node) {
  if (Array.isArray(node)) return node.some(usesScript);
  if (node !== null && typeof node === 'object') {
    if (typeof node.script === 'string') return true;
    return Object.values(node).some(usesScript);
  }
  return false;
}
