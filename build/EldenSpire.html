    el.addEventListener('click', () => {
      state.classId = cls.id;
      classes.querySelectorAll('.cr-class').forEach((x) => x.classList.toggle('chosen', x === el));
    });
    classes.appendChild(el);
  }
  classes.querySelector('.cr-class').classList.add('chosen');

  // ---- ascension slider (enables the first N difficulty rules) ----
  const ascLabel = $('#cr-asc-val');
  const ascNote = $('#cr-asc-note');
  const asc = $('#cr-asc');
  asc.addEventListener('input', () => {
    state.ascension = Number(asc.value);
    ascLabel.textContent = state.ascension;
    const enabled = ASCENSION_ORDER.slice(0, state.ascension)
      .map((id) => DIFFICULTY_MODS.find((m) => m.id === id).label)
      .join(', ');
    ascNote.textContent = state.ascension ? `Enables: ${enabled}.` : 'No extra difficulty. Slide up to stack the rules below.';
    refreshModChips();
  });

  // ---- mod toggle grids ----
  function modChip(m) {
    const el = document.createElement('button');
    el.className = 'mod-chip';
    el.dataset.mod = m.id;
    el.innerHTML = `<b>${esc(m.label)}</b><span>${esc(m.desc)}</span>`;
    el.addEventListener('click', () => {
      if (el.classList.contains('forced')) return; // locked on by the ascension level
      state.mods[m.id] = !state.mods[m.id];
      refreshModChips();
    });
    return el;
  }
  const diffBox = $('#cr-diff');
  const chaosBox = $('#cr-chaos');
  DIFFICULTY_MODS.forEach((m) => diffBox.appendChild(modChip(m)));
  CHAOS_MODS.forEach((m) => chaosBox.appendChild(modChip(m)));

  // Reflect both explicit toggles and ascension-enabled rules; ascension-forced
  // rules show as "locked on" (can't be turned off below the slider level).
  function refreshModChips() {
    const eff = activeMods(state);
    const forced = new Set(ASCENSION_ORDER.slice(0, state.ascension));
    app.querySelectorAll('.mod-chip').forEach((el) => {
      const id = el.dataset.mod;
      el.classList.toggle('on', !!eff[id]);
      el.classList.toggle('forced', forced.has(id));
    });
  }

  // ---- deck mode ----
  const deckBox = $('#cr-deck');
  DECK_MODES.forEach((m, i) => {
    const el = document.createElement('button');
    el.className = `mod-chip${i === 0 ? ' on' : ''}`;
    el.dataset.deck = m.id;
    el.innerHTML = `<b>${esc(m.label)}</b><span>${esc(m.desc)}</span>`;
    el.addEventListener('click', () => {
      state.deckMode = m.id;
      deckBox.querySelectorAll('.mod-chip').forEach((x) => x.classList.toggle('on', x === el));
    });
    deckBox.appendChild(el);
  });

  $('#cr-back').addEventListener('click', onBack);
  $('#cr-start').addEventListener('click', () => {
    onStart({
      classId: state.classId,
      seedString: $('#cr-seed').value.trim(),
      custom: { ascension: state.ascension, mods: { ...state.mods }, deckMode: state.deckMode },
    });
  });

  refreshModChips();
}


Object.assign(module.exports, { mountCustomRun });

},
"src/ui/screens/draft.js": function (module, exports, require) {
// src/ui/screens/draft.js — Custom Climb "Draft" deck builder.
//
// Presents `rounds` rounds of `choices` cards from the class pool; the player
// picks one each round to add to their starting deck. Deterministic on the
// run's rng (stream 'cardRewards'), so a seed drafts the same offers.

const { renderCard } = require("src/ui/components/card.js");
const { createCardInstance, createIdGen } = require("src/model/state.js");

function mountDraft(app, { registries, classId, rng, rounds = 3, choices = 3, onDone }) {
  const pool = registries.classes.get(classId).cardPool.slice();
  const idGen = createIdGen('df');
  const picked = [];
  let round = 0;

  function renderRound() {
    // Offer `choices` distinct cards from the remaining pool.
    const offer = [];
    const local = pool.slice();
    for (let i = 0; i < choices && local.length; i++) {
      const id = rng.pick('cardRewards', local);
      local.splice(local.indexOf(id), 1);
      offer.push(id);
    }

    app.innerHTML = `
      <div class="screen" style="gap:18px">
        <h2 style="color:var(--gold);font-size:24px;letter-spacing:.15em">DRAFT YOUR DECK</h2>
        <p class="subtitle">PICK ${round + 1} OF ${rounds} — CHOOSE A CARD TO ADD</p>
        <div class="grid draft-grid" style="justify-content:center"></div>
        <p class="set-note">Drafted so far: <b id="draft-count">${picked.length}</b></p>
      </div>`;

    const grid = app.querySelector('.draft-grid');
    for (const id of offer) {
      const el = renderCard(registries, { instanceId: `preview_${id}`, cardId: id, upgraded: false }, {});
      el.addEventListener('click', () => {
        picked.push(createCardInstance(id, false, idGen));
        // Remove one copy from the pool so later rounds skew fresh.
        const idx = pool.indexOf(id);
        if (idx >= 0) pool.splice(idx, 1);
        round += 1;
        if (round >= rounds) onDone(picked);
        else renderRound();
      });
      grid.appendChild(el);
    }
  }

  renderRound();
}


Object.assign(module.exports, { mountDraft });

},
"src/ui/components/card.js": function (module, exports, require) {
// src/ui/components/card.js — DOM card renderer (mockup: card-anatomy.svg)
//
// All numbers shown come from the engine: in combat, previewCard tokens
// (live math, SPEC §3.13); outside combat, the card's own literal values via
// computeTokenBindings. No math happens here.

const { resolveCard } = require("src/model/registries.js");
const { computeTokenBindings } = require("src/model/validate.js");
const { attachTooltip, esc } = require("src/ui/components/tooltip.js");

/** Static token values straight off the def (for reward/pile/deck views). */
function staticTokens(def) {
  const tokens = {};
  for (const b of computeTokenBindings(def.effects || [])) {
    const v = (def.effects[b.index] || {})[b.field];
    if (typeof v === 'number') tokens[b.token] = v;
  }
  return tokens;
}

function fillTemplate(def, tokens, baseTokens) {
  let html = esc(def.textTemplate);
  html = html.replace(/\{([A-Za-z][\w.]*)\}/g, (m, tok) => {
    const v = tokens[tok];
    if (v == null) return m;
    let cls = 'val';
    if (baseTokens && typeof baseTokens[tok] === 'number') {
      if (v > baseTokens[tok]) cls += ' up';
      else if (v < baseTokens[tok]) cls += ' down';
    }
    return `<span class="${cls}">${v}</span>`;
  });
  // Light keyword coloring for readability.
  html = html
    .replace(/\b(Bleed|Scarlet Rot|Staggered|Poise)\b/g, '<span class="st-bleed">$1</span>')
    .replace(/\b(Exhaust|Ethereal|Innate|Retain|Unplayable)\b/g, '<span class="kw">$1</span>');
  return html;
}

/**
 * renderCard(registries, ref, opts) → element.
 *   ref  — { cardId, upgraded, instanceId? }
 *   opts — { preview?    (previewCard result → live numbers),
 *            affordable? (bool; greys out when false),
 *            small?      (scale for reward/pile grids) }
 */
function renderCard(registries, ref, opts = {}) {
  const def = resolveCard(registries, ref);
  const el = document.createElement('div');
  el.className = `card rarity-${def.rarity}${ref.upgraded ? ' upgraded' : ''}`;
  if (opts.affordable === false) el.classList.add('unaffordable');
  if (ref.instanceId) el.dataset.instanceId = ref.instanceId;
  el.dataset.cardId = def.id;

  const base = staticTokens(def);
  const tokens = opts.preview ? { ...base, ...opts.preview.tokens } : base;
  const cost = opts.preview ? (opts.preview.costIsX ? 'X' : opts.preview.cost) : def.cost;

  el.innerHTML =
    `<div class="cost">${esc(cost)}</div>` +
    `<div class="cname">${esc(def.name)}</div>` +
    `<div class="art">${esc(def.icon || '❖')}</div>` +
    `<div class="ctype">${esc(def.type.toUpperCase())}</div>` +
    `<div class="ctext">${fillTemplate(def, tokens, base)}</div>`;

  attachTooltip(el, () => cardTooltip(registries, def, tokens));
  if (opts.small) {
    el.style.transform = 'scale(0.92)';
  }
  return el;
}

function cardTooltip(registries, def, tokens) {
  let html = `<div class="tt-title">${esc(def.name)} — ${esc(def.type)}, cost ${esc(def.cost)}</div>`;
  html += `<div>${fillTemplate(def, tokens, null)}</div>`;
  // Nested keyword + status tooltips (SPEC §7.3).
  const lines = [];
  for (const kw of def.keywords || []) {
    if (registries.keywords.has(kw)) {
      const k = registries.keywords.get(kw);
      lines.push(`<b>${esc(k.name)}</b> — ${esc(k.tooltip)}`);
    }
  }
  for (const eff of def.effects || []) {
    if (eff.op === 'applyStatus' && registries.statuses.has(eff.status)) {
      const s = registries.statuses.get(eff.status);
      if (s.tooltip) lines.push(`<b>${esc(s.name)}</b> — ${esc(s.tooltip)}`);
    }
    if (eff.op === 'enterStance' && registries.stances.has(eff.stance)) {
      const s = registries.stances.get(eff.stance);
      if (s.tooltip) lines.push(`<b>${esc(s.name)}</b> — ${esc(s.tooltip)}`);
    }
  }
  if (def.flavor) lines.push(`<i>${esc(def.flavor)}</i>`);
  if (lines.length) html += `<div class="tt-kw">${lines.join('<br>')}</div>`;
  return html;
}


Object.assign(module.exports, { staticTokens, renderCard });

},
"src/ui/screens/map.js": function (module, exports, require) {
// src/ui/screens/map.js — the act map (SPEC §7.1, mockup: map-screen.svg)
//
// Full act visible; only edge-connected nodes from the current position are
// clickable; traveled path in gold. With the Stonesword Key passive, '?'
// nodes render their pre-rolled resolution (dashed ring marks a reveal).

const { passiveFlag } = require("src/model/registries.js");
const { attachTooltip, esc } = require("src/ui/components/tooltip.js");
const { overlayIsOpen } = require("src/ui/components/overlay.js");
const { matchAction } = require("src/ui/input.js");

const ICONS = {
  monster: '⚔',
  event: '?',
  elite: '☠',
  shrine: '♨',
  merchant: '⚖',
  treasure: '▣',
  boss: '👁',
  fight: '⚔',
};

const COL_X = 95;
const ROW_H = 46;

const ACT_NAMES = {
  1: 'ACT I — THE FALLOW MARCHES',
  2: 'ACT II — THE GRAFTED COURT',
  3: 'ACT III — THE ASHEN CROWN',
};

// Map zoom levels (%) selectable in-view and defaulted from settings.
const ZOOM_STEPS = [1, 1.15, 1.3, 1.5, 1.75, 2];
function defaultZoom(meta) {
  const pct = Number(((meta && meta.settings) || {}).mapZoom);
  const z = pct ? pct / 100 : 1.15;
  // Snap to the nearest step so +/- stays on the ladder.
  return ZOOM_STEPS.reduce((a, b) => (Math.abs(b - z) < Math.abs(a - z) ? b : a), 1.15);
}

function mountMap(app, { registries, run, meta, onPick, onSave, onSettings, onMenu }) {
  const map = run.mapGraph;
  const nodes = Object.values(map.nodes);
  const maxFloor = Math.max(...nodes.map((n) => n.floor));
  const width = 7 * COL_X + 60;
  const height = (maxFloor + 1) * ROW_H + 30;
  const x = (col) => 60 + col * COL_X;
  const y = (floor) => height - floor * ROW_H;
  let zoom = defaultZoom(meta);

  const reachable = new Set(run.mapNodeId ? map.nodes[run.mapNodeId].next : map.startIds);
  const traveled = new Set(run.path || []);
  const reveal = passiveFlag(registries, run.relics, 'revealUnknown');

  // ---- edges (a traveled edge = consecutive pair in run.path) ----
  let edgeSvg = '';
  const path = run.path || [];
  for (const n of nodes) {
    for (const toId of n.next) {
      const to = map.nodes[toId];
      const ia = path.indexOf(n.id);
      const isTraveled = ia >= 0 && path[ia + 1] === toId;
      edgeSvg += `<line class="map-edge${isTraveled ? ' traveled' : ''}" x1="${x(n.col)}" y1="${y(n.floor)}" x2="${x(to.col)}" y2="${y(to.floor)}"/>`;
    }
  }

  app.innerHTML = `
    <div class="mapscreen">
      <div class="map-scroll">
        <div class="map-canvas">
          <svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
            <text x="${width / 2}" y="24" text-anchor="middle" fill="var(--gold)" font-size="17" letter-spacing="4" font-family="Georgia,serif">${ACT_NAMES[run.actNumber] || `ACT ${run.actNumber}`}</text>
            ${edgeSvg}
            <g id="map-nodes"></g>
          </svg>
        </div>
        <div class="map-zoom">
          <button class="zbtn" id="zoom-out" title="Zoom out">−</button>
          <button class="zbtn" id="zoom-reset" title="Reset / center">⊙</button>
          <button class="zbtn" id="zoom-in" title="Zoom in">+</button>
        </div>
      </div>
      <aside class="map-side">
        <h2>THE CLIMB</h2>
        <div class="hud-line"><span>HP</span><b>${run.hp} / ${run.maxHp}</b></div>
        <div class="hud-line"><span>Runes</span><b style="color:var(--gold)">${run.runes}</b></div>
        <div class="hud-line"><span>Act</span><b>${run.actNumber} / 3</b></div>
        <div class="hud-line"><span>Floor</span><b>${run.floor} / ${map.floors}</b></div>
        <div class="hud-line"><span>Seed</span><b style="font-family:monospace">${esc(run.seedString)}</b></div>
        <div class="hud-line"><span>Flasks</span><b>${run.flasks.map((f) => registries.flasks.get(f.flaskId).icon).join(' ') || '—'}</b></div>
        <div class="relic-strip"></div>
        <div class="legend">
          <div><span class="ic">⚔</span>Monster</div>
          <div><span class="ic">?</span>Unknown</div>
          <div><span class="ic" style="color:var(--ember)">☠</span>Elite</div>
          <div><span class="ic" style="color:var(--gold)">♨</span>Shrine of Grace</div>
          <div><span class="ic" style="color:var(--grace)">⚖</span>Merchant</div>
          <div><span class="ic" style="color:var(--gold)">▣</span>Treasure</div>
        </div>
        <div class="map-buttons">
          <button class="deck-btn" id="open-menu">☰ Menu</button>
          <button class="subtle deck-btn" id="save-run">Save</button>
          <button class="subtle deck-btn" id="map-settings">Settings</button>
        </div>
      </aside>
    </div>`;

  const g = app.querySelector('#map-nodes');
  for (const n of nodes) {
    const isReachable = reachable.has(n.id);
    let shownType = n.type;
    let revealed = false;
    if (n.type === 'event' && reveal && n.resolved) {
      shownType = n.resolved.kind === 'event' ? 'event' : n.resolved.kind;
      revealed = n.resolved.kind !== 'event';
    }
    const cls = [
      'map-node',
      shownType,
      traveled.has(n.id) || n.id === run.mapNodeId ? 'visited' : '',
      n.id === run.mapNodeId ? 'current' : '',
      isReachable ? 'reachable' : '',
      revealed ? 'revealed' : '',
    ].filter(Boolean).join(' ');
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    el.setAttribute('class', cls);
    const r = n.type === 'boss' ? 20 : 15;
    // Reachable nodes get a rhythmic pulsing halo so the next choices read at
    // a glance; the halo is inert when reduced-motion is set (CSS handles it).
    const halo = isReachable ? `<circle class="node-halo" cx="${x(n.col)}" cy="${y(n.floor)}" r="${r + 6}"/>` : '';
    el.innerHTML = `${halo}<circle cx="${x(n.col)}" cy="${y(n.floor)}" r="${r}"/><text x="${x(n.col)}" y="${y(n.floor)}">${ICONS[shownType] || '?'}</text>`;
    if (isReachable) el.addEventListener('click', () => onPick(n.id));
    attachTooltip(el, () => nodeTooltip(shownType, n, revealed));
    g.appendChild(el);
  }

  const strip = app.querySelector('.relic-strip');
  for (const rid of run.relics) {
    const def = registries.relics.get(rid);
    const el = document.createElement('div');
    el.className = 'relic';
    el.textContent = def.icon || '◆';
    attachTooltip(el, () => `<div class="tt-title">${esc(def.name)}</div>${esc(def.textTemplate.replace(/[{}]/g, ''))}`);
    strip.appendChild(el);
  }

  if (onMenu) app.querySelector('#open-menu').addEventListener('click', () => onMenu('deck'));

  app.querySelector('#save-run').addEventListener('click', () => {
    const slot = onSave ? onSave() : null;
    const toast = document.createElement('div');
    toast.className = 'save-toast';
    toast.textContent = slot ? `Saved to Slot ${slot}` : 'Saved';
    app.appendChild(toast);
    setTimeout(() => toast.remove(), 1600);
  });

  if (onSettings) app.querySelector('#map-settings').addEventListener('click', onSettings);

  // ---- zoom + centering (SPEC §7.1 map UX) ----
  const scroll = app.querySelector('.map-scroll');
  const svgEl = app.querySelector('.map-scroll svg');

  // The svg scales by setting its pixel width/height (viewBox unchanged), so
  // the scroll container grows and native scrollbars appear.
  function applyZoom(center) {
    svgEl.style.width = `${width * zoom}px`;
    svgEl.style.height = `${height * zoom}px`;
    if (center) centerOnCurrent();
  }

  // Scroll so the current node sits in the middle of the viewport. At run
  // start there is no current node yet, so frame the reachable start nodes
  // (their centroid) — the requested default framing.
  function centerOnCurrent() {
    let fx;
    let fy;
    if (run.mapNodeId && map.nodes[run.mapNodeId]) {
      const f = map.nodes[run.mapNodeId];
      fx = x(f.col);
      fy = y(f.floor);
    } else {
      const rs = nodes.filter((n) => reachable.has(n.id));
      if (!rs.length) return;
      fx = rs.reduce((a, n) => a + x(n.col), 0) / rs.length;
      fy = rs.reduce((a, n) => a + y(n.floor), 0) / rs.length;
    }
    scroll.scrollTop = Math.max(0, fy * zoom - scroll.clientHeight / 2);
    scroll.scrollLeft = Math.max(0, fx * zoom - scroll.clientWidth / 2);
  }

  function setZoom(next, keepCenter = true) {
    zoom = Math.min(ZOOM_STEPS[ZOOM_STEPS.length - 1], Math.max(ZOOM_STEPS[0], next));
    applyZoom(keepCenter);
  }
  const stepZoom = (dir) => {
    const i = ZOOM_STEPS.findIndex((z) => Math.abs(z - zoom) < 0.001);
    const ni = Math.min(ZOOM_STEPS.length - 1, Math.max(0, (i < 0 ? 1 : i) + dir));
    setZoom(ZOOM_STEPS[ni]);
  };
  app.querySelector('#zoom-in').addEventListener('click', () => stepZoom(1));
  app.querySelector('#zoom-out').addEventListener('click', () => stepZoom(-1));
  app.querySelector('#zoom-reset').addEventListener('click', () => centerOnCurrent());

  // Ctrl/⌘ + wheel zooms toward the pointer-ish center; plain wheel scrolls.
  scroll.addEventListener(
    'wheel',
    (ev) => {
      if (!(ev.ctrlKey || ev.metaKey)) return;
      ev.preventDefault();
      stepZoom(ev.deltaY < 0 ? 1 : -1);
    },
    { passive: false }
  );

  // Drag-to-pan (in addition to scrollbars).
  let panning = false;
  let sx = 0;
  let sy = 0;
  let sl = 0;
  let st = 0;
  scroll.addEventListener('pointerdown', (ev) => {
    if (ev.target.closest('.map-node.reachable') || ev.target.closest('.map-zoom')) return;
    panning = true;
    sx = ev.clientX;
    sy = ev.clientY;
    sl = scroll.scrollLeft;
    st = scroll.scrollTop;
    scroll.classList.add('grabbing');
  });
  addEventListener('pointermove', (ev) => {
    if (!panning) return;
    scroll.scrollLeft = sl - (ev.clientX - sx);
    scroll.scrollTop = st - (ev.clientY - sy);
  });
  addEventListener('pointerup', () => {
    panning = false;
    scroll.classList.remove('grabbing');
  });

  // Keyboard: M opens the menu overlay; + / − / 0 zoom; the overlay owns Esc
  // while open. Removed when the screen is torn down (app.innerHTML replaced).
  const mapKeys = (ev) => {
    if (!app.querySelector('.mapscreen')) {
      removeEventListener('keydown', mapKeys);
      return;
    }
    if (overlayIsOpen()) return;
    const tag = (ev.target && ev.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (matchAction(ev, 'menu') || matchAction(ev, 'deck')) {
      if (onMenu) onMenu('deck');
    } else if (matchAction(ev, 'relics')) {
      if (onMenu) onMenu('relics');
    } else if (matchAction(ev, 'stats')) {
      if (onMenu) onMenu('stats');
    } else if (ev.key === '+' || ev.key === '=') {
      stepZoom(1);
    } else if (ev.key === '-' || ev.key === '_') {
      stepZoom(-1);
    } else if (ev.key === '0') {
      centerOnCurrent();
    }
  };
  addEventListener('keydown', mapKeys);

  applyZoom(false);
  // Center once the flex container actually has a measured height. A rAF can
  // fire before layout settles (clientHeight 0), so observe the box and center
  // on its first non-zero size, then stop.
  if (scroll.clientHeight > 0) {
    centerOnCurrent();
  } else if (typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(() => {
      if (scroll.clientHeight > 0) {
        centerOnCurrent();
        ro.disconnect();
      }
    });
    ro.observe(scroll);
  } else {
    setTimeout(centerOnCurrent, 60);
  }
}

function nodeTooltip(type, node, revealed) {
  const names = {
    monster: 'Monster — a fight, runes, and a card reward.',
    event: 'Unknown — an event, a fight, a shrine… who can say.',
    elite: 'Elite — dangerous. Drops a relic.',
    shrine: 'Shrine of Grace — rest (heal) or smith (upgrade a card).',
    merchant: 'Merchant — cards, relics, flasks, card removal.',
    treasure: 'Treasure — a relic, free.',
    boss: 'The Watchful Omen. He has been waiting.',
    fight: 'An ambush revealed by the Stonesword Key.',
  };
  let t = `<div class="tt-title">Floor ${node.floor}</div>${names[type] || ''}`;
  if (revealed) t += '<br><i>Revealed by the Stonesword Key.</i>';
  return t;
}


Object.assign(module.exports, { mountMap });

},
"src/ui/components/overlay.js": function (module, exports, require) {
// src/ui/components/overlay.js — the in-run tabbed overlay menu (SPEC §7.2).
//
// One overlay hosts every in-run menu as a tab: Deck, Relics & Flasks, Stats
// (run telemetry), and Settings. Opened from a button or hotkey on the map and
// in combat; combat is turn-based, so it needs no real "pause". Esc / the ✕ /
// clicking the veil closes it.

const { renderCard } = require("src/ui/components/card.js");
const { renderSettings } = require("src/ui/screens/settings.js");
const { renderControls } = require("src/ui/screens/controls.js");
const { attachTooltip, esc } = require("src/ui/components/tooltip.js");

let openVeil = null;
let escHandler = null;

/** True if the overlay is currently open (so callers can route Esc/hotkeys). */
function overlayIsOpen() {
  return !!openVeil;
}

function closeOverlay() {
  if (openVeil) {
    openVeil.remove();
    openVeil = null;
  }
  if (escHandler) {
    removeEventListener('keydown', escHandler, true);
    escHandler = null;
  }
}

/**
 * openOverlay({ registries, run, meta, onSettingsChange, onSave, initialTab })
 * onSave (optional) → returns the slot number saved to (adds a Save action).
 */
function openOverlay({ registries, run, meta, onSettingsChange, onSave, onQuit, onExit, initialTab = 'deck' }) {
  closeOverlay();
  const settings = meta.settings || (meta.settings = {});

  const TABS = [
    { id: 'deck', label: `Deck (${run.deck.length})` },
    { id: 'relics', label: 'Relics & Flasks' },
    { id: 'stats', label: 'Stats' },
    { id: 'settings', label: 'Settings' },
    { id: 'controls', label: 'Controls' },
  ];

  const veil = document.createElement('div');
  veil.className = 'modal-veil';
  veil.innerHTML = `
    <div class="modal overlay-modal">
      <div class="overlay-head">
        <div class="overlay-tabs">
          ${TABS.map((t) => `<button class="ov-tab" data-tab="${t.id}">${t.label}</button>`).join('')}
        </div>
        <div class="overlay-actions">
          ${onSave ? '<button class="subtle" id="ov-save">Save</button>' : ''}
          ${onQuit ? '<button class="subtle" id="ov-quit">Save &amp; Quit</button>' : ''}
          ${onExit ? '<button class="subtle danger" id="ov-exit">Quit Game</button>' : ''}
          <button class="subtle" id="ov-close" title="Close (Esc)">✕</button>
        </div>
      </div>
      <div class="overlay-body"></div>
    </div>`;
  document.body.appendChild(veil);
  openVeil = veil;

  const body = veil.querySelector('.overlay-body');

  function selectTab(id) {
    veil.querySelectorAll('.ov-tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === id));
    body.innerHTML = '';
    if (id === 'deck') renderDeck(body);
    else if (id === 'relics') renderRelics(body);
    else if (id === 'stats') renderStats(body);
    else if (id === 'settings') renderSettings(body, { settings, onChange: onSettingsChange || (() => {}) });
    else if (id === 'controls') renderControls(body, { settings, onChange: onSettingsChange || (() => {}) });
  }

  function renderDeck(container) {
    const grid = document.createElement('div');
    grid.className = 'grid';
    if (!run.deck.length) {
      grid.innerHTML = '<div style="color:var(--muted);padding:20px">Empty.</div>';
    } else {
      for (const inst of run.deck) grid.appendChild(renderCard(registries, inst, { small: true }));
    }
    container.appendChild(grid);
  }

  function renderRelics(container) {
    const wrap = document.createElement('div');
    wrap.className = 'ov-relics';
    const rTitle = document.createElement('h3');
    rTitle.className = 'set-cat';
    rTitle.textContent = `Relics (${run.relics.length})`;
    wrap.appendChild(rTitle);
    const rGrid = document.createElement('div');
    rGrid.className = 'ov-relic-grid';
    for (const rid of run.relics) {
      const def = registries.relics.get(rid);
      const el = document.createElement('div');
      el.className = 'ov-relic';
      el.innerHTML = `<span class="ov-relic-ic">${esc(def.icon || '◆')}</span><div><b>${esc(def.name)}</b><p>${esc((def.textTemplate || '').replace(/[{}]/g, ''))}</p></div>`;
      rGrid.appendChild(el);
    }
    if (!run.relics.length) rGrid.innerHTML = '<div style="color:var(--muted)">None yet.</div>';
    wrap.appendChild(rGrid);

    const fTitle = document.createElement('h3');
    fTitle.className = 'set-cat';
    fTitle.textContent = `Flasks (${run.flasks.length})`;
    wrap.appendChild(fTitle);
    const fGrid = document.createElement('div');
    fGrid.className = 'ov-relic-grid';
    for (const f of run.flasks) {
      const def = registries.flasks.get(f.flaskId);
      const el = document.createElement('div');
      el.className = 'ov-relic';
      el.innerHTML = `<span class="ov-relic-ic">${esc(def.icon || '🧪')}</span><div><b>${esc(def.name)}</b><p>${esc(def.textTemplate || '')}</p></div>`;
      fGrid.appendChild(el);
    }
    if (!run.flasks.length) fGrid.innerHTML = '<div style="color:var(--muted)">None.</div>';
    wrap.appendChild(fGrid);
    container.appendChild(wrap);
  }

  function renderStats(container) {
    const s = run.stats || {};
    const cls = registries.classes.get(run.class);
    const rows = [
      ['Tarnished', (run.customization && run.customization.name) || cls.name],
      ['Class', cls.name],
      ['Seed', run.seedString],
      ['Act', `${run.actNumber} / 3`],
      ['Floor', run.floor],
      ['HP', `${run.hp} / ${run.maxHp}`],
      ['Runes', run.runes],
      ['Fights won', s.fightsWon || 0],
      ['Damage dealt', s.damageDealt || 0],
      ['Damage taken', s.damageTaken || 0],
      ['Deck size', run.deck.length],
      ['Relics', run.relics.length],
    ];
    const el = document.createElement('div');
    el.className = 'ov-stats';
    el.innerHTML = rows
      .map(([k, v]) => `<div class="ov-stat"><span>${esc(String(k))}</span><b>${esc(String(v))}</b></div>`)
      .join('');
    container.appendChild(el);
  }

  veil.querySelectorAll('.ov-tab').forEach((b) => b.addEventListener('click', () => selectTab(b.dataset.tab)));
  veil.querySelector('#ov-close').addEventListener('click', closeOverlay);
  veil.addEventListener('click', (e) => {
    if (e.target === veil) closeOverlay();
  });
  const saveBtn = veil.querySelector('#ov-save');
  if (saveBtn && onSave) {
    saveBtn.addEventListener('click', () => {
      const slot = onSave();
      saveBtn.textContent = slot ? `Saved · Slot ${slot}` : 'Saved';
      setTimeout(() => (saveBtn.textContent = 'Save'), 1500);
    });
  }
  const quitBtn = veil.querySelector('#ov-quit');
  if (quitBtn && onQuit) {
    quitBtn.addEventListener('click', () => {
      closeOverlay();
      onQuit(); // save the run to its slot, then return to the title screen
    });
  }
  const exitBtn = veil.querySelector('#ov-exit');
  if (exitBtn && onExit) {
    exitBtn.addEventListener('click', () => {
      closeOverlay();
      onExit(); // leave the app entirely (persists first)
    });
  }

  // Esc closes the overlay, captured before screen-level key handlers see it.
  escHandler = (ev) => {
    if (ev.key === 'Escape') {
      ev.preventDefault();
      ev.stopPropagation();
      closeOverlay();
    }
  };
  addEventListener('keydown', escHandler, true);

  selectTab(TABS.some((t) => t.id === initialTab) ? initialTab : 'deck');
  return veil;
}


Object.assign(module.exports, { overlayIsOpen, closeOverlay, openOverlay });

},
"src/ui/screens/settings.js": function (module, exports, require) {
// src/ui/screens/settings.js — settings controls (SPEC §7)
//
// Rows are declarative and grouped into categories. `renderSettings` builds the
// controls into any container and wires change events, so the same controls
// back both the standalone modal (openSettings) and the in-run overlay's
// Settings tab. Each row declares its default so stored settings stay sparse.
// `onChange({key:value})` lets the orchestrator persist + apply immediately.

const ROWS = [
  { cat: 'Display', key: 'useSprites', def: true, label: 'Character sprites',
    note: 'Show a drawn class figure in combat instead of your chosen sigil.' },
  { cat: 'Display', key: 'animSpeed', type: 'choice', def: 'normal',
    choices: ['slow', 'normal', 'fast', 'instant'], label: 'Combat pacing',
    note: 'How deliberately actions play out — one actor at a time, or instant.' },
  { cat: 'Display', key: 'mapZoom', type: 'choice', def: '115',
    choices: ['100', '115', '130', '150'], label: 'Map zoom %',
    note: 'Default zoom when the act map opens. In-map + / − buttons override per view.' },
  { cat: 'Display', key: 'accent', type: 'choice', def: 'gold',
    choices: ['gold', 'crimson', 'frost', 'verdant', 'violet'], label: 'Accent color',
    note: 'Tint the interface — highlights, borders, focus ring, and glow.' },
  { cat: 'Display', key: 'uiScale', type: 'choice', def: '100',
    choices: ['90', '100', '110', '125'], label: 'Interface scale',
    note: 'Zoom the whole interface — smaller for more room, larger for readability.' },
  { cat: 'Display', key: 'screenShake', def: true, label: 'Screen shake',
    note: 'Camera kick on heavy hits and staggers. Off keeps combat steady.' },
  { cat: 'Display', key: 'ambient', type: 'choice', def: 'normal',
    choices: ['off', 'low', 'normal', 'high'], label: 'Ambient effects',
    note: 'Drifting embers and the title-screen glow. Off is the calmest.' },
  { cat: 'Display', key: 'fullscreen', type: 'action', def: false, label: 'Fullscreen',
    note: 'Fill the screen (also toggles with F11 in most browsers).' },

  { cat: 'Audio', key: 'muteAudio', def: false, label: 'Mute all audio',
    note: 'Silence music and sound effects.' },
  { cat: 'Audio', key: 'musicVolume', type: 'range', def: 55, label: 'Music volume',
    note: 'Ambient score for the title, map, and battles.' },
  { cat: 'Audio', key: 'sfxVolume', type: 'range', def: 75, label: 'Sound effects',
    note: 'Hits, blocks, bleed bursts, UI.' },
  { cat: 'Audio', key: 'musicFolder', type: 'text', def: '', label: 'Music folder',
    placeholder: 'e.g. music/ or https://…',
    note: 'Folder/URL with a manifest.json mapping combat/boss/shop/rest/… to track files. Empty = built-in generated score.' },

  { cat: 'Accessibility', key: 'reducedMotion', def: false, label: 'Reduced motion',
    note: 'Calm ambient effects, drop the map pulse, and shorten animations.' },
  { cat: 'Accessibility', key: 'highContrast', def: false, label: 'High contrast',
    note: 'Brighter text and stronger borders throughout for readability.' },
  { cat: 'Accessibility', key: 'largeText', def: false, label: 'Larger text',
    note: 'Bump body and tooltip text up a notch.' },
  { cat: 'Accessibility', key: 'colorblindSafe', def: false, label: 'Colorblind-friendly',
    note: 'Shift danger/heal/rot/frost colors to a more distinguishable palette.' },
  { cat: 'Accessibility', key: 'reduceFlashes', def: false, label: 'Reduce flashes',
    note: 'Suppress bright impact and proc flashes (photosensitivity). Damage numbers stay.' },
  { cat: 'Accessibility', key: 'readableHeadings', def: false, label: 'Readable headings',
    note: 'Use the plain UI font for titles instead of the decorative serif.' },
];

const CATEGORIES = ['Display', 'Audio', 'Accessibility'];

// Resolve a stored value against its default (defaults keep settings sparse).
function valueOf(settings, row) {
  return row.def ? settings[row.key] !== false : settings[row.key] === true;
}

function rowHtml(settings, r) {
  if (r.type === 'text') {
    const val = typeof settings[r.key] === 'string' ? settings[r.key] : r.def;
    return `<div class="set-row set-row-wide">
        <div><b>${r.label}</b><p class="set-note">${r.note}</p></div>
        <input type="text" class="set-text" spellcheck="false" data-key="${r.key}" value="${(val || '').replace(/"/g, '&quot;')}" placeholder="${r.placeholder || ''}">
      </div>`;
  }
  if (r.type === 'range') {
    const val = typeof settings[r.key] === 'number' ? settings[r.key] : r.def;
    return `<div class="set-row">
        <div><b>${r.label}</b><p class="set-note">${r.note}</p></div>
        <div class="range-wrap">
          <input type="range" class="set-range" min="0" max="100" step="5" value="${val}" data-key="${r.key}">
          <span class="range-val" data-for="${r.key}">${val}</span>
        </div>
      </div>`;
  }
  if (r.type === 'choice') {
    const cur = r.choices.includes(settings[r.key]) ? settings[r.key] : r.def;
    const opts = r.choices
      .map((c) => `<button class="choice${c === cur ? ' on' : ''}" data-key="${r.key}" data-val="${c}">${c.toUpperCase()}</button>`)
      .join('');
    return `<div class="set-row">
        <div><b>${r.label}</b><p class="set-note">${r.note}</p></div>
        <div class="choice-group">${opts}</div>
      </div>`;
  }
  // 'action' rows (e.g. fullscreen) render as a live toggle reflecting state.
  const on = r.type === 'action' ? isFullscreen() : valueOf(settings, r);
  return `<div class="set-row">
      <div><b>${r.label}</b><p class="set-note">${r.note}</p></div>
      <button class="toggle ${on ? 'on' : ''}" data-key="${r.key}"${r.type === 'action' ? ' data-action="1"' : ''} role="switch" aria-checked="${on}">
        <span class="knob"></span>
      </button>
    </div>`;
}

function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}

function toggleFullscreen() {
  const el = document.documentElement;
  if (isFullscreen()) {
    (document.exitFullscreen || document.webkitExitFullscreen || (() => {})).call(document);
  } else {
    (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
  }
}

/**
 * renderSettings(container, { settings, onChange, grouped })
 * Fills `container` with the settings controls and wires change events.
 * grouped=true adds category headers.
 */
function renderSettings(container, { settings, onChange, grouped = true }) {
  let html = '';
  if (grouped) {
    for (const cat of CATEGORIES) {
      const rows = ROWS.filter((r) => r.cat === cat);
      html += `<h3 class="set-cat">${cat}</h3>` + rows.map((r) => rowHtml(settings, r)).join('');
    }
  } else {
    html = ROWS.map((r) => rowHtml(settings, r)).join('');
  }
  container.innerHTML = html;

  container.querySelectorAll('.set-text').forEach((input) => {
    // Commit on change/blur (not each keystroke) so we don't re-fetch a manifest
    // mid-type.
    const commit = () => {
      settings[input.dataset.key] = input.value.trim();
      onChange({ [input.dataset.key]: input.value.trim() });
    };
    input.addEventListener('change', commit);
    input.addEventListener('blur', commit);
  });

  container.querySelectorAll('.set-range').forEach((slider) => {
    slider.addEventListener('input', () => {
      const val = Number(slider.value);
      const out = container.querySelector(`.range-val[data-for="${slider.dataset.key}"]`);
      if (out) out.textContent = val;
      settings[slider.dataset.key] = val;
      onChange({ [slider.dataset.key]: val });
    });
  });

  container.querySelectorAll('.choice').forEach((btn) => {
    btn.addEventListener('click', () => {
      btn.parentElement.querySelectorAll('.choice').forEach((b) => b.classList.toggle('on', b === btn));
      settings[btn.dataset.key] = btn.dataset.val;
      onChange({ [btn.dataset.key]: btn.dataset.val });
    });
  });

  container.querySelectorAll('.toggle').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (btn.dataset.action) {
        toggleFullscreen();
        // Reflect the new state shortly after the API resolves.
        setTimeout(() => {
          const on = isFullscreen();
          btn.classList.toggle('on', on);
          btn.setAttribute('aria-checked', String(on));
        }, 60);
        return;
      }
      const now = !btn.classList.contains('on');
      btn.classList.toggle('on', now);
      btn.setAttribute('aria-checked', String(now));
      settings[btn.dataset.key] = now;
      onChange({ [btn.dataset.key]: now });
    });
  });
}

function openSettings({ meta, onChange }) {
  const settings = meta.settings || (meta.settings = {});
  const veil = document.createElement('div');
  veil.className = 'modal-veil';
  veil.innerHTML = `
    <div class="modal settings-modal">
      <h2>Settings</h2>
      <div class="set-body"></div>
      <div class="set-actions"><button id="set-close">Done</button></div>
    </div>`;
  document.body.appendChild(veil);
  renderSettings(veil.querySelector('.set-body'), { settings, onChange });

  const close = () => veil.remove();
  veil.addEventListener('click', (e) => {
    if (e.target === veil) close();
  });
  veil.querySelector('#set-close').addEventListener('click', close);
}


Object.assign(module.exports, { renderSettings, openSettings });

},
"src/ui/screens/controls.js": function (module, exports, require) {
// src/ui/screens/controls.js — the Controls tab: rebind each action's keyboard
// key AND gamepad button (SPEC §7.3).
//
// Every rebindable action shows two chips: its keyboard key and its gamepad
// button. Click a "Rebind" to arm it, then press a key / pad button. Bindings
// persist in settings.keyBindings + settings.bindings and apply live via
// onChange({ keyBindings } / { bindings }). Confirm's keyboard key is fixed
// (Enter always activates the cursor); everything else is rebindable.

const { ACTIONS, getBindings, getKeyBindings, keyLabel, captureNextButton, cancelCapture, captureNextKey, cancelKeyCapture } = require("src/ui/input.js");

// Standard-mapping button labels (navigator gamepad "standard" layout).
const BUTTON_NAMES = {
  0: 'A', 1: 'B', 2: 'X', 3: 'Y', 4: 'LB', 5: 'RB', 6: 'LT', 7: 'RT',
  8: 'Back', 9: 'Start', 10: 'L3', 11: 'R3', 12: 'D-Up', 13: 'D-Down',
  14: 'D-Left', 15: 'D-Right', 16: 'Guide',
};
const btnName = (i) => (i == null ? '—' : BUTTON_NAMES[i] || `Btn ${i}`);

function renderControls(container, { settings, onChange }) {
  const padConnected =
    typeof navigator !== 'undefined' && navigator.getGamepads
      ? Array.from(navigator.getGamepads()).some(Boolean)
      : false;

  container.innerHTML = `
    <h3 class="set-cat">Navigation</h3>
    <p class="set-note" style="max-width:520px">
      Move the focus cursor with the <b>arrow keys</b>, <b>D-pad</b>, or <b>left stick</b>;
      activate with <b>Enter</b> / <b>A</b>. In combat, number keys <b>1–9</b> select cards and targets.
    </p>
    <h3 class="set-cat">Bindings ${padConnected ? '<span class="pad-live">● pad connected</span>' : '<span class="pad-off">(no pad detected)</span>'}</h3>
    <div class="rebind-list"></div>
    <p class="set-note" style="margin-top:10px">Click a <b>Rebind</b>, then press a key or controller button. Arrow keys / D-pad always navigate.</p>`;

  const list = container.querySelector('.rebind-list');
  const bindings = getBindings();
  const keyBindings = getKeyBindings();

  for (const a of ACTIONS) {
    const rebindableKey = !!a.defKey; // Confirm's key (Enter) is fixed
    const row = document.createElement('div');
    row.className = 'set-row rebind-row';
    row.innerHTML = `
      <div><b>${a.label}</b></div>
      <div class="rebind-ctl">
        ${
          rebindableKey
            ? `<span class="pad-btn key-btn" data-keyfor="${a.id}">${keyLabel(a.id)}</span>
               <button class="subtle rebind-btn rebind-key" data-action="${a.id}">Key</button>`
            : `<span class="pad-btn">${a.keyHint || '—'}</span>`
        }
        <span class="pad-btn" data-for="${a.id}">${btnName(bindings[a.id])}</span>
        <button class="subtle rebind-btn rebind-pad" data-action="${a.id}">Pad</button>
      </div>`;
    list.appendChild(row);
  }

  let capturing = null; // the armed <button>, or null
  const reset = (btn, label) => {
    btn.textContent = label;
    btn.classList.remove('listening');
  };

  // Gamepad rebinds.
  list.querySelectorAll('.rebind-pad').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (capturing) {
        cancelCapture();
        cancelKeyCapture();
        reset(capturing, capturing.classList.contains('rebind-key') ? 'Key' : 'Pad');
        if (capturing === btn) {
          capturing = null;
          return;
        }
      }
      capturing = btn;
      btn.textContent = 'Press…';
      btn.classList.add('listening');
      captureNextButton((buttonIndex) => {
        const id = btn.dataset.action;
        const next = { ...getBindings(), [id]: buttonIndex };
        settings.bindings = next;
        onChange({ bindings: next });
        const badge = container.querySelector(`.pad-btn[data-for="${id}"]`);
        if (badge) badge.textContent = btnName(buttonIndex);
        reset(btn, 'Pad');
        capturing = null;
      });
    });
  });

  // Keyboard rebinds.
  list.querySelectorAll('.rebind-key').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (capturing) {
        cancelCapture();
        cancelKeyCapture();
        reset(capturing, capturing.classList.contains('rebind-key') ? 'Key' : 'Pad');
        if (capturing === btn) {
          capturing = null;
          return;
        }
      }
      capturing = btn;
      btn.textContent = 'Press…';
      btn.classList.add('listening');
      captureNextKey((key) => {
        const id = btn.dataset.action;
        const next = { ...getKeyBindings(), [id]: key };
        settings.keyBindings = next;
        onChange({ keyBindings: next });
        const badge = container.querySelector(`.key-btn[data-keyfor="${id}"]`);
        if (badge) badge.textContent = keyLabel(id);
        reset(btn, 'Key');
        capturing = null;
      });
    });
  });
}


Object.assign(module.exports, { renderControls });

},
"src/ui/input.js": function (module, exports, require) {
// src/ui/input.js — unified keyboard + gamepad navigation (SPEC §7.3).
//
// Two layers that make every screen playable without a mouse:
//   1. A focus cursor over interactive elements (buttons, cards, reachable map
//      nodes, tabs, toggles, targetable enemies…). Arrow keys / D-pad / left
//      stick move it spatially; Enter / A activates the focused element.
//   2. A gamepad poller (started only while a pad is connected — no idle loop)
//      that maps buttons to actions. Confirm activates the cursor; Cancel /
//      Menu / End-turn dispatch the same synthetic keys the screens already
//      listen for, so the existing keyboard handlers work with a controller
//      too. Which pad BUTTON drives each action is rebindable (Controls tab).
//
// The number keys (1–9) and letter hotkeys stay owned by the screens; this
// module adds navigation + controller parity on top without touching them.

const FOCUS_SELECTOR = [
  'button:not([disabled])',
  '.card',
  '.map-node.reachable',
  '.combatant.enemy.targetable',
  '.ov-tab',
  '.choice',
  '.toggle',
  '.slot-continue',
  '.slot-new',
  '.class-pick:not(.locked)', // character creation + custom-run class picks
  '.cz-opt',
  '.cz-keepsake',
  '.cr-class',
  '.mod-chip',
  'input[type="range"]',
  'input[type="text"]',
  '[data-focusable]',
].join(',');

// "Chrome" the focus cursor skips during normal play — the top bar, piles, map
// side panel, zoom, and end-turn/energy. These are reached by their dedicated
// (rebindable) keys / the Menu overlay instead of by wandering into them
// (StS2-style: navigation stays on cards, targets, and map nodes). Ignored when
// a modal/overlay is open, where its own contents ARE the scope.
const CHROME = '.topbar, .pile, .map-buttons, .map-zoom, .map-side, .end-turn, .energy-orb';

// Rebindable actions. Each carries BOTH a keyboard key (defKey) and a gamepad
// button (defBtn), and both are rebindable (Controls tab). Delivery:
//   'cursor' — handled here (activates the focus cursor).
//   'key'    — the canonical binding is the keyboard key; screens match it via
//              matchAction(ev, id). A pad press dispatches that same key, so the
//              screens' own handlers run for controller + keyboard alike.
// The deck/relics/stats actions jump the in-run overlay straight to that tab
// (StS2-style dedicated zone keys) instead of only the generic Menu.
const ACTIONS = [
  // confirm (Enter) and cancel (Esc) keep FIXED keyboard keys so cursor-activate
  // and overlay-close always work; only their pad button is rebindable.
  { id: 'confirm', label: 'Confirm / Play', kind: 'cursor', keyHint: 'Enter', defBtn: 0 },
  { id: 'cancel', label: 'Cancel / Back', kind: 'key', key: 'Escape', keyHint: 'Esc', defBtn: 1 },
  { id: 'endTurn', label: 'End Turn', kind: 'key', defKey: 'e', defBtn: 2 },
  { id: 'menu', label: 'Open Menu', kind: 'key', defKey: 'm', defBtn: 9 },
  { id: 'deck', label: 'Open Deck', kind: 'key', defKey: 'd', defBtn: 3 },
  { id: 'relics', label: 'Open Relics', kind: 'key', defKey: 'r', defBtn: 4 },
  { id: 'stats', label: 'Open Stats', kind: 'key', defKey: 't', defBtn: 5 },
];

const DEADZONE = 0.5;
const REPEAT_MS = 180;
const POLL_MS = 16; // ~60 Hz input polling (only while a pad is connected)

let bindings = {}; // action id → gamepad button index
