"src/model/formulas.js": function (module, exports, require) {
// src/model/formulas.js — structured formula evaluator (SPEC §3.5)
//
// Every dynamic number in content is either a plain number or a formula
// object { f: '<op>', ... }. No string parsing — formulas are validatable
// data. The closed op set below is contractual; extending it is an engine PR.
//
// Flooring: every evaluation floors its FINAL result once (StS integer math).
// The single deliberate exception is `stacks` with `per`, which floors the
// division immediately so "per N stacks" means whole chunks of N.
//
// The same evaluator computes card-preview numbers for the UI (SPEC §3.13, §4.2).
//
// Headless: no document/window/localStorage/timers.

const FORMULA_OPS = Object.freeze([
  'add',
  'mul',
  'percentMaxHp',
  'missingHp',
  'stacks',
  'energySpent',
  'blockOf',
  'hpOf',
  'cardsPlayedThisTurn',
]);

// Entity references usable in a formula's `of` field.
const FORMULA_OF = Object.freeze([
  'self',
  'owner',
  'target',
  'enemy',
  'player',
  'allEnemies',
]);

function isFormula(v) {
  return v !== null && typeof v === 'object' && typeof v.f === 'string';
}

/**
 * evaluate(formula, ctx) → integer.
 *
 * ctx = {
 *   entities: { self, owner, target, enemy, player, allEnemies: [] },
 *              // each entity: { hp, maxHp, block, statuses: {} } or null
 *   energySpent: number,         // for X-cost scaling
 *   cardsPlayedThisTurn: number,
 * }
 *
 * `formula` may be a plain number (returned floored) or a formula object.
 * Optional `min` / `max` clamps are honored on any node (applied before the
 * final floor). Throws on unknown ops, unresolvable `of` refs, or NaN.
 */
function evaluate(formula, ctx = {}) {
  const raw = evalNode(formula, ctx);
  if (typeof raw !== 'number' || Number.isNaN(raw)) {
    throw new Error(`Formula evaluated to a non-number: ${JSON.stringify(formula)}`);
  }
  return Math.floor(raw);
}

function evalNode(node, ctx) {
  if (typeof node === 'number') return node;
  if (!isFormula(node)) {
    throw new Error(`Not a number or formula: ${JSON.stringify(node)}`);
  }
  let v;
  switch (node.f) {
    case 'add': {
      v = argsOf(node).reduce((acc, a) => acc + evalNode(a, ctx), 0);
      break;
    }
    case 'mul': {
      v = argsOf(node).reduce((acc, a) => acc * evalNode(a, ctx), 1);
      break;
    }
    case 'percentMaxHp': {
      const ent = resolveOne(ctx, node.of, node.f);
      v = (ent.maxHp * numField(node, 'pct')) / 100;
      break;
    }
    case 'missingHp': {
      const ent = resolveOne(ctx, node.of, node.f);
      v = Math.max(0, ent.maxHp - ent.hp);
      break;
    }
    case 'stacks': {
      const ents = resolveMany(ctx, node.of, node.f);
      let total = 0;
      for (const ent of ents) total += stacksOf(ent, node.status);
      v = node.per != null ? Math.floor(total / node.per) : total;
      break;
    }
    case 'energySpent': {
      const spent = ctx.energySpent != null ? ctx.energySpent : 0;
      v = spent * (node.per != null ? node.per : 1);
      break;
    }
    case 'blockOf': {
      const ent = resolveOne(ctx, node.of, node.f);
      v = ent.block;
      break;
    }
    case 'hpOf': {
      const ent = resolveOne(ctx, node.of, node.f);
      v = ent.hp;
      break;
    }
    case 'cardsPlayedThisTurn': {
      const n = ctx.cardsPlayedThisTurn != null ? ctx.cardsPlayedThisTurn : 0;
      v = n * (node.per != null ? node.per : 1);
      break;
    }
    default:
      throw new Error(`Unknown formula op '${node.f}'`);
  }
  if (node.min != null && v < node.min) v = node.min;
  if (node.max != null && v > node.max) v = node.max;
  return v;
}

function argsOf(node) {
  if (!Array.isArray(node.args)) {
    throw new Error(`Formula '${node.f}' requires an args array`);
  }
  return node.args;
}

function numField(node, field) {
  const v = node[field];
  if (typeof v !== 'number') {
    throw new Error(`Formula '${node.f}' requires numeric field '${field}'`);
  }
  return v;
}

function resolveRef(ctx, of, op) {
  if (of == null) throw new Error(`Formula '${op}' requires an 'of' entity ref`);
  const entities = ctx.entities || {};
  const ent = entities[of];
  if (ent == null) {
    throw new Error(`Formula '${op}': entity ref '${of}' did not resolve in this context`);
  }
  return ent;
}

function resolveOne(ctx, of, op) {
  const ent = resolveRef(ctx, of, op);
  if (Array.isArray(ent)) {
    throw new Error(`Formula '${op}' cannot target '${of}' (a group); use a single entity ref`);
  }
  return ent;
}

function resolveMany(ctx, of, op) {
  const ent = resolveRef(ctx, of, op);
  return Array.isArray(ent) ? ent : [ent];
}

// Status stacks of an entity; meter statuses report their meter value
// (their build-up points) as their "stacks" (SPEC §3.5, §3.7).
function stacksOf(entity, statusId) {
  if (typeof statusId !== 'string') {
    throw new Error("Formula 'stacks' requires a 'status' id");
  }
  const inst = entity && entity.statuses ? entity.statuses[statusId] : null;
  if (!inst) return 0;
  return inst.meter ? inst.meter.value : inst.stacks || 0;
}


Object.assign(module.exports, { FORMULA_OPS, FORMULA_OF, isFormula, evaluate });

},
"src/model/registries.js": function (module, exports, require) {
// src/model/registries.js — typed id → definition registries, deep-frozen (SPEC §3.3)
//
// createRegistries(contentBundle) loads all content into typed, deep-frozen
// registries keyed by id. Cross-references are by id only; getters THROW on
// unknown ids (dangling ids are caught earlier by model/validate.js).
//
// Headless: no document/window/localStorage/timers.

const { REGISTRY_TYPES } = require("src/model/schemas.js");

/** Recursively freeze a value in place (functions and frozen values skipped). */
function deepFreeze(value) {
  if (value === null || typeof value !== 'object') return value;
  if (Object.isFrozen(value)) return value;
  Object.freeze(value);
  for (const key of Object.keys(value)) deepFreeze(value[key]);
  return value;
}

function makeRegistry(typeName, defs) {
  const byId = new Map();
  for (const def of defs || []) {
    if (!def || typeof def.id !== 'string') {
      throw new Error(`Every ${typeName} def must have a string id (got ${JSON.stringify(def && def.id)})`);
    }
    if (byId.has(def.id)) {
      throw new Error(`Duplicate ${typeName} id '${def.id}'`);
    }
    byId.set(def.id, deepFreeze(def));
  }
  return Object.freeze({
    type: typeName,
    size: byId.size,
    get(id) {
      const d = byId.get(id);
      if (!d) throw new Error(`Unknown ${typeName} id '${id}'`);
      return d;
    },
    has(id) {
      return byId.has(id);
    },
    ids() {
      return [...byId.keys()];
    },
    all() {
      return [...byId.values()];
    },
  });
}

// Bundle key → registry property + singular type name for error messages.
const TYPE_SINGULAR = {
  cards: 'card',
  relics: 'relic',
  statuses: 'status',
  stances: 'stance',
  keywords: 'keyword',
  enemies: 'enemy',
  encounters: 'encounter',
  events: 'event',
  flasks: 'flask',
  classes: 'class',
};

/**
 * createRegistries(contentBundle) → frozen registries object.
 *
 * contentBundle = {
 *   version?: string,                    // contentVersion (SPEC §3.12)
 *   cards?: [], relics?: [], statuses?: [], stances?: [], keywords?: [],
 *   enemies?: [], encounters?: [], events?: [], flasks?: [], classes?: [],
 *   balance?: {},                        // flat constants (SPEC §3.3)
 *   mapConfigs?: { [actNumber]: {...} },
 *   scripts?: { [name]: function },      // budgeted escape hatch (SPEC §3.1(6))
 * }
 *
 * Missing collections default to empty. Duplicate ids throw.
 *
 * Result shape:
 *   registries.cards.get(id) / .has(id) / .ids() / .all() / .size
 *   ... same for relics, statuses, stances, keywords, enemies, encounters,
 *       events, flasks, classes
 *   registries.balance              — deep-frozen constants object
 *   registries.mapConfig(act)       — throws on unknown act
 *   registries.scripts              — frozen { name: fn }
 *   registries.contentVersion       — string
 */
function createRegistries(contentBundle) {
  const bundle = contentBundle || {};
  const registries = {};

  for (const type of REGISTRY_TYPES) {
    registries[type] = makeRegistry(TYPE_SINGULAR[type], bundle[type]);
  }

  registries.balance = deepFreeze({ ...(bundle.balance || {}) });

  const mapConfigs = deepFreeze({ ...(bundle.mapConfigs || {}) });
  registries.mapConfigs = mapConfigs;
  registries.mapConfig = (act) => {
    const cfg = mapConfigs[act];
    if (!cfg) throw new Error(`Unknown mapConfig for act '${act}'`);
    return cfg;
  };

  registries.scripts = Object.freeze({ ...(bundle.scripts || {}) });
  registries.contentVersion = String(bundle.version || bundle.contentVersion || '0');

  return Object.freeze(registries);
}

// ---------------------------------------------------------------------------
// Relic passives (SPEC PASSIVE_KEYS) — data lookups over owned relic defs.
// ---------------------------------------------------------------------------

/** Product of a multiplicative passive across owned relics (default 1). */
function passiveMult(registries, relicIds, key) {
  let m = 1;
  for (const id of relicIds || []) {
    const p = registries.relics.get(id).passives;
    if (p && typeof p[key] === 'number') m *= p[key];
  }
  return m;
}

/** Sum of an additive passive across owned relics (default 0). */
function passiveSum(registries, relicIds, key) {
  let s = 0;
  for (const id of relicIds || []) {
    const p = registries.relics.get(id).passives;
    if (p && typeof p[key] === 'number') s += p[key];
  }
  return s;
}

/** True if any owned relic sets the boolean passive. */
function passiveFlag(registries, relicIds, key) {
  for (const id of relicIds || []) {
    const p = registries.relics.get(id).passives;
    if (p && p[key] === true) return true;
  }
  return false;
}

// ---------------------------------------------------------------------------
// Card resolution — definitions vs instances (SPEC §3.3, §4.3)
// ---------------------------------------------------------------------------

// Cache resolved upgrade merges per registries object.
const resolveCache = new WeakMap();

/**
 * resolveCard(registries, cardInstanceOrRef) → effective (frozen) card def.
 *
 * Accepts anything with { cardId, upgraded? }. For upgraded cards the
 * `upgrade` partial override is merged over the base def:
 *   - scalar fields (cost, textTemplate, ...) replace the base value
 *   - `effects` REPLACES the base effects array entirely when present
 *   - `keywords` REPLACES the base keywords entirely when present (list the
 *     full upgraded set — this is what lets an upgrade remove Exhaust)
 *   - `name` defaults to base name + '+'
 */
function resolveCard(registries, instanceOrRef) {
  const cardId = instanceOrRef.cardId;
  const base = registries.cards.get(cardId);
  if (!instanceOrRef.upgraded) return base;

  let cache = resolveCache.get(registries);
  if (!cache) {
    cache = new Map();
    resolveCache.set(registries, cache);
  }
  let merged = cache.get(cardId);
  if (merged) return merged;

  const up = base.upgrade || {};
  merged = {
    ...base,
    ...up,
    name: up.name != null ? up.name : `${base.name}+`,
    keywords: up.keywords != null ? up.keywords : base.keywords || [],
    effects: up.effects != null ? up.effects : base.effects,
    textTemplate: up.textTemplate != null ? up.textTemplate : base.textTemplate,
    upgraded: true,
  };
  deepFreeze(merged);
  cache.set(cardId, merged);
  return merged;
}


Object.assign(module.exports, { deepFreeze, createRegistries, passiveMult, passiveSum, passiveFlag, resolveCard });

},
"src/model/state.js": function (module, exports, require) {
// src/model/state.js — run/combat state factories + (de)serialization (SPEC §3.3, §3.12)
//
// State stores INSTANCE data referencing definitions by id only:
//   deck card  = { instanceId, cardId, upgraded }
//   enemy      = { instanceId→id, enemyId, hp, block, statuses{}, poiseMeter, movesHistory[] }
// Saves serialize instances + RNG counters, never definitions.
//
// Headless: no document/window/localStorage/timers.

const RUN_SCHEMA_VERSION = 1;

/** Deterministic instance-id generator ('p1', 'p2', ... for prefix 'p'). */
function createIdGen(prefix = 'i') {
  let n = 0;
  return () => `${prefix}${++n}`;
}

function createCardInstance(cardId, upgraded = false, idGen) {
  return { instanceId: idGen ? idGen() : `c_${cardId}_${Math.floor(Math.random() * 1e9)}`, cardId, upgraded: !!upgraded };
}

/** Build a deck of card instances from an array of card ids. */
function createDeck(cardIds, idGen = createIdGen('d')) {
  return cardIds.map((cardId) => createCardInstance(cardId, false, idGen));
}

// ---------------------------------------------------------------------------
// Run state (SPEC §3.12 save shape)
// ---------------------------------------------------------------------------

/**
 * createRunState({ seed, classId, registries }) → new run at floor 0, act 1.
 * Starting deck/relic/HP come from the class def; runes from
 * balance.startingRunes (default 0).
 */
function createRunState({ seed, classId, registries }) {
  const classDef = registries.classes.get(classId);
  const idGen = createIdGen('rc');
  return {
    schemaVersion: RUN_SCHEMA_VERSION,
    contentVersion: registries.contentVersion,
    seed: seed >>> 0,
    streamCounters: {},
    class: classId,
    floor: 0,
    actNumber: 1,
    mapNodeId: null,
    hp: classDef.maxHp,
    maxHp: classDef.maxHp,
    runes: registries.balance.startingRunes || 0,
    deck: createDeck(classDef.startingDeck, idGen),
    relics: [classDef.startingRelic],
    flasks: [], // [{ flaskId }] — max slots from balance.flaskSlots (default 3)
    mapGraph: null,
    combatEntered: null,
    history: [],
    modifiers: [], // ascension-style seam (SPEC §10); always empty in v1
  };
}

function serializeRun(run) {
  return JSON.stringify(run);
}

/**
 * deserializeRun(json) → run object. Throws on parse failure or unknown
 * schemaVersion (save.js in M2 adds archiving + contentVersion checks).
 */
function deserializeRun(json) {
  const run = JSON.parse(json);
  if (!run || typeof run !== 'object') throw new Error('Corrupt run save');
  if (run.schemaVersion !== RUN_SCHEMA_VERSION) {
    throw new Error(`Unknown run schemaVersion ${run.schemaVersion} (expected ${RUN_SCHEMA_VERSION})`);
  }
  return run;
}

// ---------------------------------------------------------------------------
// Combat entities (instances reference defs by id — SPEC §3.3)
// ---------------------------------------------------------------------------

/**
 * Player combat entity. statuses: { [statusId]: { stacks, duration?, meter? } }.
 */
function createPlayerCombatEntity({ classId, maxHp, hp, relicIds = [], flasks = [], energyMax = 3 }) {
  return {
    id: 'player',
    kind: 'player',
    classId,
    hp: hp != null ? hp : maxHp,
    maxHp,
    block: 0,
    energy: 0,
    energyMax,
    statuses: {},
    stanceId: null,
    relicIds: [...relicIds],
    flasks: flasks.map((f) => ({ ...f })),
    counters: {
      cardsPlayedThisTurn: 0,
      cardsPlayedThisCombat: 0,
      attacksPlayedThisCombat: 0,
    },
    alive: true,
  };
}

/**
 * Enemy combat entity. `poiseMeter` is the engine-level build-up meter fed by
 * the poiseDamage opcode (SPEC §3.7, §4.4); everything else about Stagger is
 * content data.
 */
function createEnemyCombatEntity({ instanceId, enemyId, hp, poiseMax }) {
  return {
    id: instanceId,
    kind: 'enemy',
    enemyId,
    hp,
    maxHp: hp,
    block: 0,
    statuses: {},
    poiseMeter: { value: 0, max: poiseMax },
    movesHistory: [],
    intent: null,
    pendingMove: null, // delayed-move commitment: { moveId, resolveOnTurn }
    skipNextTurn: false, // set by a poise-meter fill; consumed by the enemy turn
    unlockedMoves: [],
    alive: true,
  };
}


Object.assign(module.exports, { RUN_SCHEMA_VERSION, createIdGen, createCardInstance, createDeck, createRunState, serializeRun, deserializeRun, createPlayerCombatEntity, createEnemyCombatEntity });

},
"src/content/customMods.js": function (module, exports, require) {
// src/content/customMods.js — Custom Climb modifiers (data only).
//
// A tailored take on Slay the Spire 2's custom mode. Three groups:
//   • DIFFICULTY — harder rules; the Ascension ladder just enables the first N
//     of these in ASCENSION_ORDER, so "Ascension 4" == the four hardest-first
//     rules, and every rule is also individually toggleable.
//   • CHAOS — flavourful run-warping toggles, independent of difficulty.
//   • DECK_MODES — how your starting deck is built.
// The orchestrator (main.js) reads run.custom.mods[id] at the relevant hook;
// nothing here is engine-specific.

const DIFFICULTY_MODS = [
  { id: 'toughElites', label: 'Tough Elites', desc: 'Elites and bosses have +30% HP.' },
  { id: 'lessHealing', label: 'Scarce Grace', desc: 'Shrine rest and between-act healing are halved.' },
  { id: 'deadlyEnemies', label: 'Deadly Foes', desc: 'Every enemy begins combat with +1 Strength.' },
  { id: 'cursedStart', label: 'Cursed Start', desc: 'Begin the run with a Guilt curse shuffled into your deck.' },
  { id: 'expensiveShops', label: 'Greedy Merchants', desc: 'Shop prices are 50% higher.' },
  { id: 'bigBosses', label: 'Dread Bosses', desc: 'Act bosses have +50% HP.' },
];

const CHAOS_MODS = [
  { id: 'allElite', label: 'Elite Gauntlet', desc: 'Every monster node is an Elite fight.' },
  { id: 'hoarder', label: 'Hoarder', desc: 'Start with +250 runes — but every shop price doubles.' },
  { id: 'chaosRewards', label: 'Chaos Rewards', desc: 'Card rewards ignore rarity: rares everywhere.' },
  { id: 'glassCannon', label: 'Glass Cannon', desc: 'You deal +25% damage, but take +25% damage.' },
];

const DECK_MODES = [
  { id: 'standard', label: 'Standard', desc: "Your class's normal starting deck." },
  { id: 'sealed', label: 'Sealed', desc: 'A random starting deck drawn from your class pool.' },
  { id: 'draft', label: 'Draft', desc: 'Draft your starting deck card by card.' },
];

// Ascension enables the first N difficulty rules (hardest impact first).
const ASCENSION_ORDER = [
  'toughElites',
  'deadlyEnemies',
  'lessHealing',
  'bigBosses',
  'cursedStart',
  'expensiveShops',
];
const MAX_ASCENSION = ASCENSION_ORDER.length;

const ALL_MODS = [...DIFFICULTY_MODS, ...CHAOS_MODS];

// True when a run carries any non-default rule (so it is flagged + excluded
// from win-rate telemetry).
function isCustomRun(custom) {
  if (!custom) return false;
  if (custom.ascension > 0) return true;
  if (custom.deckMode && custom.deckMode !== 'standard') return true;
  return !!(custom.mods && Object.values(custom.mods).some(Boolean));
}

// Resolve the effective active-mod set: explicit toggles OR ascension-enabled.
function activeMods(custom) {
  const out = { ...((custom && custom.mods) || {}) };
  const asc = (custom && custom.ascension) || 0;
  for (let i = 0; i < asc && i < ASCENSION_ORDER.length; i++) out[ASCENSION_ORDER[i]] = true;
  return out;
}


Object.assign(module.exports, { DIFFICULTY_MODS, CHAOS_MODS, DECK_MODES, ASCENSION_ORDER, MAX_ASCENSION, ALL_MODS, isCustomRun, activeMods });

},
"src/engine/rng.js": function (module, exports, require) {
// src/engine/rng.js — mulberry32 PRNG + named streams with saved counters (SPEC §3.11)
//
// Every stream is independently derived from (run seed, stream salt, counter).
// mulberry32's internal state advances by a fixed constant per draw, so the
// value at counter i is computable in O(1): restoring a saved counter is exact
// and cheap. Counters are serialized with the run (SPEC §3.12).
//
// Headless: no document/window/localStorage/timers.

const STREAM_NAMES = Object.freeze([
  'map',
  'shuffle',
  'cardRewards',
  'relicRewards',
  'flaskRewards',
  'enemyAI',
  'enemyHP',
  'events',
  'shop',
  'misc',
]);

const MULBERRY_INC = 0x6d2b79f5;

/**
 * Classic mulberry32 (public domain). Returns a () => float in [0, 1).
 */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function next() {
    a = (a + MULBERRY_INC) | 0;
    return scramble(a);
  };
}

// The mulberry32 output scramble applied to an accumulator value.
function scramble(a) {
  let t = a | 0;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

// FNV-1a string hash → uint32 (used as the per-stream salt).
function hashString(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}

// Value of stream (base) at draw index i (1-based), identical to calling
// mulberry32(base) i times.
function valueAt(base, i) {
  return scramble((base + Math.imul(i, MULBERRY_INC)) | 0);
}

/**
 * createRng(seed, counters?) → named-stream RNG (SPEC §3.11).
 *
 * - seed: uint32 run seed.
 * - counters: optional { streamName: drawCount } restored from a save.
 *
 * API (all `stream` arguments must be one of STREAM_NAMES, else throws):
 *   float(stream)              → number in [0, 1)
 *   int(stream, min, max)      → integer in [min, max] inclusive
 *   pick(stream, array)        → element
 *   shuffle(stream, array)     → NEW shuffled array (Fisher–Yates)
 *   chance(stream, pct)        → boolean, true with pct% probability
 *   getCounters()              → plain { streamName: count } snapshot (save this)
 *   seed                       → the uint32 seed
 */
function createRng(seed, counters = {}) {
  const s = seed >>> 0;
  const state = {};
  const bases = {};
  for (const name of STREAM_NAMES) {
    state[name] = (counters[name] || 0) >>> 0;
    bases[name] = (s ^ hashString(name)) >>> 0;
  }

  function assertStream(name) {
    if (!(name in state)) {
      throw new Error(`Unknown RNG stream '${name}'. Valid streams: ${STREAM_NAMES.join(', ')}`);
    }
  }

  const rng = {
    seed: s,
    float(stream) {
      assertStream(stream);
      state[stream] = (state[stream] + 1) >>> 0;
      return valueAt(bases[stream], state[stream]);
    },
    int(stream, min, max) {
      if (max < min) throw new Error(`rng.int: max (${max}) < min (${min})`);
      const r = rng.float(stream);
      return min + Math.floor(r * (max - min + 1));
    },
    pick(stream, array) {
      if (!Array.isArray(array) || array.length === 0) {
        throw new Error('rng.pick: empty or non-array input');
      }
      return array[Math.floor(rng.float(stream) * array.length)];
    },
    shuffle(stream, array) {
      const out = array.slice();
      for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(rng.float(stream) * (i + 1));
        const tmp = out[i];
        out[i] = out[j];
        out[j] = tmp;
      }
      return out;
    },
    chance(stream, pct) {
      return rng.float(stream) * 100 < pct;
    },
    getCounters() {
      const out = {};
      for (const name of STREAM_NAMES) out[name] = state[name];
      return out;
    },
  };
  return rng;
}

// ---------------------------------------------------------------------------
// Seed display — base-35 like StS (alphabet omits 'O' to avoid 0/O confusion).
// ---------------------------------------------------------------------------

const SEED_ALPHABET = '0123456789ABCDEFGHIJKLMNPQRSTUVWXYZ'; // 35 chars, no O

function seedToString(seed) {
  let n = seed >>> 0;
  if (n === 0) return '0';
  let out = '';
  while (n > 0) {
    out = SEED_ALPHABET[n % 35] + out;
    n = Math.floor(n / 35);
  }
  return out;
}

function seedFromString(str) {
  const cleaned = String(str).trim().toUpperCase().replace(/O/g, '0');
  let n = 0;
  for (const ch of cleaned) {
    const v = SEED_ALPHABET.indexOf(ch);
    if (v < 0) throw new Error(`Invalid seed character '${ch}'`);
    n = (n * 35 + v) >>> 0;
  }
  return n >>> 0;
}


Object.assign(module.exports, { STREAM_NAMES, mulberry32, createRng, seedToString, seedFromString });

"src/engine/combat.js": function (module, exports, require) {
// src/engine/combat.js — action queue + turn loop (generic interpreter)
// (SPEC §3.9, §4.1–§4.3, §4.6)
//
// Public API (see docs/ENGINE-API.md):
//   createCombat({ registries, rng, player, enemyIds })  → combat state
//   dispatch(combat, intent)                             → { events }
//   previewCard(combat, cardInstanceId, targetId?)       → resolved numbers
//   previewIntent(combat, enemyInstanceId)               → live intent numbers
//   getEntity(combat, id)                                → entity or null
//
// The engine contains no entity-specific code: all behavior is content data
// composed of the closed primitive sets (design law §3.1(2)).
//
// Headless: no document/window/localStorage/timers.

const A = require("src/engine/actions.js");
const { emitEvent, fireOwnerHooks, findEntity } = require("src/engine/triggers.js");
const S = require("src/engine/statuses.js");
const { resolveCard, passiveSum, passiveMult } = require("src/model/registries.js");
const { evaluate } = require("src/model/formulas.js");
const { computeTokenBindings } = require("src/model/validate.js");
const { createPlayerCombatEntity, createEnemyCombatEntity } = require("src/model/state.js");

const QUEUE_GUARD = 10000;

// ---------------------------------------------------------------------------
// createCombat
// ---------------------------------------------------------------------------

/**
 * createCombat({ registries, rng, player, enemyIds }) → combat state.
 *
 *   player = { classId, maxHp, hp, deck: [{ instanceId, cardId, upgraded }],
 *              relicIds: [], flasks?: [{ flaskId }] }
 *   enemyIds = [enemy def ids in row order] (instances get ids 'e1', 'e2', ...)
 *
 * Runs the full combat-start sequence (SPEC §4.1(1–2)): enemy HP rolled on
 * stream 'enemyHP', deck shuffled on 'shuffle' with Innate cards on top,
 * combatStart triggers fired, initial intents rolled ('enemyAI'), then the
 * first player turn starts (energy set, 5 drawn, playerTurnStart triggers).
 * Setup events are in combat.eventLog.
 */
function createCombat({ registries, rng, player, enemyIds, hpMult = 1, enemyStatuses = [], playerStatuses = [] }) {
  const bal = registries.balance || {};
  const combat = {
    registries,
    rng,
    turn: 0,
    phase: 'setup', // 'player' | 'enemy' | 'ended'
    result: null, // null | 'victory' | 'defeat'
    handMax: bal.handMax != null ? bal.handMax : 10,
    drawPerTurn: bal.draw != null ? bal.draw : 5,
    player: createPlayerCombatEntity({
      classId: player.classId,
      maxHp: player.maxHp,
      hp: player.hp,
      relicIds: player.relicIds || [],
      flasks: player.flasks || [],
      energyMax: bal.energy != null ? bal.energy : 3,
    }),
    enemies: [],
    piles: { draw: [], hand: [], discard: [], exhaust: [] },
    queue: [],
    eventLog: [],
    _buffer: null,
    triggerState: new Map(),
    _idCounter: 0,
    _emitDepth: 0,
  };
  combat.emit = (type, payload) => emitEvent(combat, type, payload);
  combat.enqueue = (action) => combat.queue.push(action);
  combat.nextInstanceId = () => `gen${++combat._idCounter}`;

  // Enemies — HP rolled on stream 'enemyHP' (SPEC §3.11, §4.6). An optional
  // hpMult (Custom Climb difficulty rules) scales the rolled HP after the roll,
  // so the same seed rolls the same base then scales — determinism preserved.
  enemyIds.forEach((enemyId, i) => {
    const def = registries.enemies.get(enemyId);
    let hp = rng.int('enemyHP', def.hp[0], def.hp[1]);
    if (hpMult !== 1) hp = Math.max(1, Math.round(hp * hpMult));
    combat.enemies.push(
      createEnemyCombatEntity({ instanceId: `e${i + 1}`, enemyId, hp, poiseMax: def.poiseMax })
    );
    combat.emit('enemySpawned', { targetId: `e${i + 1}`, enemyId });
  });

  // Deck → draw pile: shuffle (stream 'shuffle'), Innate cards to top (§4.1(1)).
  const deck = player.deck.map((c) => ({
    instanceId: c.instanceId,
    cardId: c.cardId,
    upgraded: !!c.upgraded,
  }));
  const shuffled = rng.shuffle('shuffle', deck);
  const innate = [];
  const rest = [];
  for (const card of shuffled) {
    const def = resolveCard(registries, card);
    ((def.keywords || []).includes('innate') ? innate : rest).push(card);
  }
  combat.piles.draw = [...innate, ...rest];

  combat.emit('combatStart', {});
  // Optional Custom Climb buffs (generic — statuses are content ids, applied via
  // the same applyStatus opcode content uses, so no entity-specific engine code).
  for (const s of playerStatuses) {
    combat.enqueue({ effect: { op: 'applyStatus', target: 'self', status: s.status, stacks: s.stacks }, source: combat.player, owner: combat.player, target: combat.player, meta: {} });
  }
  for (const enemy of combat.enemies) {
    for (const s of enemyStatuses) {
      combat.enqueue({ effect: { op: 'applyStatus', target: 'self', status: s.status, stacks: s.stacks }, source: enemy, owner: enemy, target: enemy, meta: {} });
    }
  }
  drainQueue(combat);
  rollIntents(combat, true);
  if (!combat.result) startPlayerTurn(combat);
  return combat;
}

// ---------------------------------------------------------------------------
// Queue draining + end check (SPEC §3.9: queue drains fully before control
// returns to the UI)
// ---------------------------------------------------------------------------

function drainQueue(combat) {
  let guard = 0;
  while (combat.queue.length) {
    if (++guard > QUEUE_GUARD) {
      throw new Error('Action queue did not drain (possible infinite trigger loop)');
    }
    const action = combat.queue.shift();
    A.executeAction(combat, action);
    endCheck(combat);
    if (combat.result) {
      combat.queue.length = 0;
      return;
    }
  }
  endCheck(combat);
}

function endCheck(combat) {
  if (combat.result) return;
  if (!combat.player.alive || combat.player.hp <= 0) {
    finishCombat(combat, 'defeat');
  } else if (combat.enemies.length > 0 && combat.enemies.every((e) => !e.alive)) {
    finishCombat(combat, 'victory');
  }
}

function finishCombat(combat, result) {
  combat.result = result;
  combat.phase = 'ended';
  combat.queue.length = 0;
  combat.emit('combatEnd', { victory: result === 'victory' });
  combat.queue.length = 0; // combatEnd triggers cannot enqueue combat actions
}

// ---------------------------------------------------------------------------
// Turn loop (SPEC §4.1 — order contractual)
// ---------------------------------------------------------------------------

function startPlayerTurn(combat) {
  combat.turn += 1;
  combat.phase = 'player';
  const p = combat.player;
  p.counters.cardsPlayedThisTurn = 0;

  // (2) Lose all block — unless modified (generic 'retainBlock' modifier;
  // a 'blockCap' modifier clamps what is kept).
  if (!S.getFlag(combat, p, 'retainBlock')) {
    p.block = 0;
  } else {
    const cap = S.getCap(combat, p, 'blockCap');
    if (cap != null) p.block = Math.min(p.block, cap);
  }

  // Set energy to base (relics that add energy hook playerTurnStart).
  p.energy = p.energyMax;

  // Draw.
  A.drawCards(combat, combat.drawPerTurn);

  // playerTurnStart triggers + owner-relative status/stance hooks.
  combat.emit('playerTurnStart', { turn: combat.turn });
  fireOwnerHooks(combat, p, 'ownerTurnStart');
  drainQueue(combat);
}

function endPlayerTurn(combat) {
  const p = combat.player;

  // (4) playerTurnEnd triggers first…
  combat.emit('playerTurnEnd', { turn: combat.turn });
  fireOwnerHooks(combat, p, 'ownerTurnEnd');
  drainQueue(combat);
  if (combat.result) return;

  // …then player status decay (perTurnEnd statuses −1 stack at owner's turn end)…
  S.decayAtTurnEnd(combat, p);

  // …then discard hand except Retain; Ethereal cards exhaust instead.
  const keep = [];
  const toDiscard = [];
  const toExhaust = [];
  for (const card of combat.piles.hand) {
    const def = resolveCard(combat.registries, card);
    const kws = def.keywords || [];
    if (kws.includes('retain')) keep.push(card);
    else if (kws.includes('ethereal')) toExhaust.push(card);
    else toDiscard.push(card);
  }
  combat.piles.hand = keep;
  for (const card of toExhaust) {
    combat.piles.exhaust.push(card);
    combat.emit('cardExhausted', { cardInstanceId: card.instanceId, cardId: card.cardId, reason: 'ethereal' });
  }
  for (const card of toDiscard) {
    combat.piles.discard.push(card);
    combat.emit('cardDiscarded', { cardInstanceId: card.instanceId, cardId: card.cardId, reason: 'turnEnd' });
  }

  // Unspent energy is lost.
  p.energy = 0;
  drainQueue(combat);
}

function enemyPhase(combat) {
  combat.phase = 'enemy';
  combat.emit('enemyTurnStart', { turn: combat.turn });

  // (5) Enemies lose their block at the start of THEIR turn.
  for (const e of combat.enemies) {
    if (!e.alive) continue;
    if (!S.getFlag(combat, e, 'retainBlock')) e.block = 0;
  }

  if (combat.result) return;

  for (const enemy of combat.enemies) {
    if (combat.result) return;
    if (!enemy.alive) continue;

    // Owner-relative turn-start hooks (DoT ticks etc.).
    fireOwnerHooks(combat, enemy, 'ownerTurnStart');
    drainQueue(combat);
    if (combat.result) return;
    if (!enemy.alive) continue;

    if (enemy.skipNextTurn || S.getFlag(combat, enemy, 'skipTurn')) {
      // Staggered / skip: the telegraphed move does not happen.
      enemy.skipNextTurn = false;
    } else if (enemy.pendingMove) {
      if (combat.turn >= enemy.pendingMove.resolveOnTurn) {
        // Delayed move resolving: the committed attack lands regardless of
        // newly rolled intents (SPEC §5.3 'Held Blade' pattern, generic data).
        const def = combat.registries.enemies.get(enemy.enemyId);
        const moveId = enemy.pendingMove.moveId;
        const move = def.moves[moveId];
        enemy.pendingMove = null;
        executeMovePayload(combat, enemy, move, moveId);
      }
      // else: still charging (delay.turns > 1) — the enemy does nothing.
    } else if (enemy.intent && enemy.intent.moveId) {
      const def = combat.registries.enemies.get(enemy.enemyId);
      const move = def.moves[enemy.intent.moveId];
      if (move.delay) {
        // Commit turn: telegraph stays, do the whileCharging part now,
        // resolve the real payload on a later enemy turn.
        const wc = (move.delay && move.delay.whileCharging) || {};
        if (wc.block != null) {
          combat.enqueue({
            effect: { op: 'block', target: 'self', amount: wc.block },
            source: enemy,
            owner: enemy,
            target: combat.player,
            meta: {},
          });
        }
        for (const eff of wc.effects || []) {
          combat.enqueue({ effect: eff, source: enemy, owner: enemy, target: combat.player, meta: {} });
        }
        enemy.pendingMove = {
          moveId: enemy.intent.moveId,
          resolveOnTurn: combat.turn + (move.delay.turns != null ? move.delay.turns : 1),
        };
        enemy.intent = { ...enemy.intent, pending: true };
      } else {
        executeMovePayload(combat, enemy, move, enemy.intent.moveId);
      }
    }
    drainQueue(combat);
    if (combat.result) return;

    // Owner-relative turn-end hooks, then decay (perTurnEnd statuses the
    // player applied to an enemy tick down at the ENEMY's turn end).
    if (enemy.alive) {
      fireOwnerHooks(combat, enemy, 'ownerTurnEnd');
      drainQueue(combat);
      if (combat.result) return;
      if (enemy.alive) S.decayAtTurnEnd(combat, enemy);
    }
  }

  combat.emit('enemyTurnEnd', { turn: combat.turn });
  drainQueue(combat);
}

// Enqueue a move's payload as ordinary actions (SPEC §3.9: only executed
// actions mutate). Order: damage hits, block, then effects.
// 'enemyMoveStarted' marks the acting enemy so the UI can pace playback
// one actor at a time (SPEC §7.4); content triggers may also key off it.
function executeMovePayload(combat, enemy, move, moveId) {
  combat.emit('enemyMoveStarted', { sourceId: enemy.id, enemyId: enemy.enemyId, moveId, kind: move.intent });
  if (move.damage != null) {
    combat.enqueue({
      effect: { op: 'damage', target: 'player', amount: move.damage, hits: move.hits != null ? move.hits : 1 },
      source: enemy,
      owner: enemy,
      target: combat.player,
      meta: { moveId },
    });
  }
  if (move.block != null) {
    combat.enqueue({
      effect: { op: 'block', target: 'self', amount: move.block },
      source: enemy,
      owner: enemy,
      target: combat.player,
      meta: { moveId },
    });
  }
  for (const eff of move.effects || []) {
    combat.enqueue({ effect: eff, source: enemy, owner: enemy, target: combat.player, meta: { moveId } });
  }

// ---------------------------------------------------------------------------
// Enemy move selection — weighted state machine + maxConsecutive (SPEC §4.6)
// ---------------------------------------------------------------------------

function rollIntents(combat, isFirstTurn = false) {
  for (const enemy of combat.enemies) {
    if (!enemy.alive) continue;
    if (enemy.pendingMove) {
      // A committed delayed move stays telegraphed until it resolves.
      if (enemy.intent) enemy.intent = { ...enemy.intent, pending: true };
      continue;
    }
    if (enemy.skipNextTurn || S.getFlag(combat, enemy, 'skipTurn')) {
      enemy.intent = { kind: 'staggered', moveId: null };
      continue;
    }
    const def = combat.registries.enemies.get(enemy.enemyId);
    let moveId;
    if (isFirstTurn && def.firstMove) {
      moveId = def.firstMove; // optional scripted opener
    } else {
      moveId = weightedMovePick(combat, enemy, def);
    }
    if (moveId == null) {
      enemy.intent = { kind: 'unknown', moveId: null };
      continue;
    }
    enemy.movesHistory.push(moveId);
    enemy.intent = buildIntent(def.moves[moveId], moveId);
  }
}

function weightedMovePick(combat, enemy, def) {
  const entries = Object.entries(def.moves).filter(
    ([id, mv]) => !mv.locked || enemy.unlockedMoves.includes(id)
  );
  if (entries.length === 0) return null;

  const eligible = entries.filter(([id, mv]) => {
    if (mv.maxConsecutive == null) return true;
    // Count the consecutive run of `id` at the tail of movesHistory.
    let run = 0;
    for (let i = enemy.movesHistory.length - 1; i >= 0; i--) {
      if (enemy.movesHistory[i] === id) run++;
      else break;
    }
    return run < mv.maxConsecutive;
  });
  const pool = eligible.length > 0 ? eligible : entries;

  const total = pool.reduce((acc, [, mv]) => acc + mv.weight, 0);
  if (total <= 0) return pool[0][0];
  let r = combat.rng.float('enemyAI') * total;
  for (const [id, mv] of pool) {
    r -= mv.weight;
    if (r < 0) return id;
  }
  return pool[pool.length - 1][0];
}

function buildIntent(move, moveId) {
  return {
    kind: move.intent,
    moveId,
    damage: move.damage != null ? move.damage : null,
    hits: move.damage != null ? (move.hits != null ? move.hits : 1) : null,
    block: move.block != null ? move.block : null,
    delayed: !!move.delay,
    pending: false,
  };
}

// ---------------------------------------------------------------------------
// dispatch — player intents (closed set for combat: playCard / endTurn / useFlask)
// ---------------------------------------------------------------------------

/**
 * dispatch(combat, intent) → { events } (the events emitted by this intent).
 *
 *   { type: 'playCard', cardInstanceId, targetId? }
 *   { type: 'endTurn' }
 *   { type: 'useFlask', slot, targetId? }
 *
 * Throws on illegal intents (wrong phase, unaffordable card, unknown ids).
 * The action queue drains fully before this returns (SPEC §3.9).
 */
function dispatch(combat, intent) {
  if (combat.result) throw new Error('Combat is over');
  combat._buffer = [];
  try {
    switch (intent.type) {
      case 'playCard':
        doPlayCard(combat, intent);
        break;
      case 'endTurn':
        doEndTurn(combat);
        break;
      case 'useFlask':
        doUseFlask(combat, intent);
        break;
      default:
        throw new Error(`Unknown combat intent '${intent.type}'`);
    }
    return { events: combat._buffer };
  } finally {
    combat._buffer = null;
  }
}

function needsEnemyTarget(def) {
  return (def.effects || []).some((eff) => eff.target === 'enemy');
}

// Effective numeric cost after relic passives (powerCostReduction, min 0).
// X-cost is unaffected (it always consumes all energy).
function effectiveCost(combat, def) {
  if (def.cost === 'X') return 'X';
  let cost = def.cost;
  if (def.type === 'power') {
    cost = Math.max(0, cost - passiveSum(combat.registries, combat.player.relicIds, 'powerCostReduction'));
  }
  return cost;
}

function doPlayCard(combat, { cardInstanceId, targetId }) {
  if (combat.phase !== 'player') throw new Error('Cards can only be played on the player turn');
  const p = combat.player;
  const idx = combat.piles.hand.findIndex((c) => c.instanceId === cardInstanceId);
  if (idx < 0) throw new Error(`Card '${cardInstanceId}' is not in hand`);
  const inst = combat.piles.hand[idx];
  const def = resolveCard(combat.registries, inst);
  const kws = def.keywords || [];

  if (kws.includes('unplayable')) throw new Error(`'${def.name}' is unplayable`);

  const isX = def.cost === 'X';
  const cost = isX ? p.energy : effectiveCost(combat, def);
  if (p.energy < cost) throw new Error(`Not enough energy (need ${cost}, have ${p.energy})`);

  let target = null;
  if (targetId != null) {
    target = findEntity(combat, targetId);
    if (!target || !target.alive) throw new Error(`Invalid target '${targetId}'`);
  } else if (needsEnemyTarget(def)) {
    target = combat.enemies.find((e) => e.alive) || null;
    if (!target) throw new Error('No living enemy to target');
  }

  // Pay cost (X-cost consumes ALL energy — SPEC §4.3).
  p.energy -= cost;
  if (cost > 0 || isX) combat.emit('energySpent', { amount: cost });

  // Remove from hand; bump counters (used by predicates + formulas).
  combat.piles.hand.splice(idx, 1);
  p.counters.cardsPlayedThisTurn += 1;
  p.counters.cardsPlayedThisCombat += 1;
  const meta = {
    energySpent: cost,
    ordinalThisTurn: p.counters.cardsPlayedThisTurn,
    ordinalThisCombat: p.counters.cardsPlayedThisCombat,
    attackOrdinal: null,
  };
  if (def.type === 'attack') {
    p.counters.attacksPlayedThisCombat += 1;
    meta.attackOrdinal = p.counters.attacksPlayedThisCombat;
  }
  const cardRef = { instanceId: inst.instanceId, cardId: inst.cardId, upgraded: inst.upgraded, type: def.type };

  // Enqueue the card's own effects first, then announce the play — triggers
  // reacting to cardPlayed enqueue after the card's effects (FIFO).
  for (const eff of def.effects || []) {
    combat.enqueue({ effect: eff, source: p, owner: p, target, card: cardRef, meta });
  }
  combat.emit('cardPlayed', {
    cardInstanceId: inst.instanceId,
    cardId: inst.cardId,
    cardType: def.type,
    targetId: target ? target.id : null,
    ordinalThisTurn: meta.ordinalThisTurn,
    ordinalThisCombat: meta.ordinalThisCombat,
    energySpent: cost,
  });
  drainQueue(combat);

  // Placement after resolution (SPEC §4.3): Exhaust → exhaust pile;
  // Powers are removed from play (NOT exhausted); everything else → discard.
  if (!combat.result) {
    if (kws.includes('exhaust')) {
      combat.piles.exhaust.push(inst);
      combat.emit('cardExhausted', { cardInstanceId: inst.instanceId, cardId: inst.cardId, reason: 'played' });
    } else if (def.type !== 'power') {
      combat.piles.discard.push(inst);
    }
    drainQueue(combat);
  }
}

function doEndTurn(combat) {
  if (combat.phase !== 'player') throw new Error('Not the player turn');
  endPlayerTurn(combat);
  if (combat.result) return;
  enemyPhase(combat);
  if (combat.result) return;
  rollIntents(combat); // (6) new intents rolled, then back to (2)
  startPlayerTurn(combat);
}

function doUseFlask(combat, { slot, targetId }) {
  if (combat.phase !== 'player') throw new Error('Flasks can only be used on the player turn');
  const p = combat.player;
  const flask = p.flasks[slot];
  if (!flask) throw new Error(`No flask in slot ${slot}`);
  const def = combat.registries.flasks.get(flask.flaskId);
  let target = null;
  if (targetId != null) {
    target = findEntity(combat, targetId);
    if (!target || !target.alive) throw new Error(`Invalid target '${targetId}'`);
  } else if (def.targeted) {
    target = combat.enemies.find((e) => e.alive) || null;
  }
  p.flasks.splice(slot, 1);

//
// Statuses are CONTENT, not code: this module interprets stackMode, decay
// (none / perTurnEnd / {duration} / onConsume), build-up meters (growthMult +
// onFill), and modifiers consulted by the damage/block math (SPEC §4.2).
// It contains no entity-specific code and never names a status id
// (design law §3.1(2)).
//
// Status instance shape on an entity:
//   entity.statuses[statusId] = { stacks, duration?, meter?: { value, max } }
// Meter statuses keep their build-up points in meter.value; their "stacks"
// (for formulas, predicates, tooltips) IS the meter value.

// ctx is the combat context (see engine/combat.js): must provide
// ctx.registries, ctx.emit(type, payload), ctx.enqueue(action),
// ctx.player, ctx.enemies.
//
// Headless: no document/window/localStorage/timers.

function getStatusInstance(entity, statusId) {
  return (entity && entity.statuses && entity.statuses[statusId]) || null;
}

function getStacks(entity, statusId) {
  const inst = getStatusInstance(entity, statusId);
  if (!inst) return 0;
  return inst.meter ? inst.meter.value : inst.stacks || 0;
}

function hasStatus(entity, statusId) {

      else inst.stacks += amount;

    case 'refresh':

      else inst.stacks = Math.max(inst.stacks, amount);

      else inst.stacks = 1;
      break;

//
// Sources: every status on the entity, plus (for the player) the active
// stance's modifiers. Semantics:
//   *Mult   — flat per status (NOT scaled by stacks); values multiply.
//   *Add    — value × stacks; values sum.

//   blockCap— max of declared caps (the most generous wins).

  'boss',
]);

const TYPING_RETRIES = 40;

/**
 * generateActMap({ config, rng }) → {
 *   nodes: { [id]: { id, floor, col, type, next: [ids] } },
 *   startIds: [ids on floor 1],
 *   shrineId,                        // the single floor-N shrine (SPEC §6)
 *   bossId,                          // boss node above the shrine
 * }
 *
 * config = { floors, columns, pathCount, typeWeights, floorRules } — see
 * content/mapconfig.js. floorRules = { fixed: {floor: type},
 * noEliteOrShrineBefore, noShrineOn, minReachableElites, minReachableMerchants }.
 */
function generateActMap({ config, rng }) {
  const floors = config.floors;
  const cols = config.columns;
  const rules = config.floorRules || {};
  const nodeId = (floor, col) => `n${floor}_${col}`;

  // ---- 1. Path walk (floors 1..floors-1); floor `floors` is the lone shrine.
  // edges[floor] = Map(fromCol → Set(toCol)) — used for the no-cross rule.
  const pathFloors = floors - 1;
  const edges = Array.from({ length: pathFloors }, () => new Map());
  const usedCols = Array.from({ length: pathFloors + 1 }, () => new Set()); // 1-based floors

  const starts = [];
  for (let p = 0; p < config.pathCount; p++) {
    let col = rng.int('map', 0, cols - 1);
    if (p === 1) {
      let guard = 0;
      while (col === starts[0] && ++guard < 50) col = rng.int('map', 0, cols - 1);
    }
    starts.push(col);
    usedCols[1].add(col);

    for (let floor = 1; floor < pathFloors; floor++) {
      let next = clamp(col + rng.int('map', -1, 1), 0, cols - 1);
      // No-cross rule (StS): if an existing edge from this floor would cross
      // ours, adopt its destination instead (paths merge rather than cross).
      for (const [fromCol, tos] of edges[floor]) {
        for (const toCol of tos) {
          const crosses =
            (fromCol < col && toCol > next) || (fromCol > col && toCol < next);
          if (crosses) next = toCol;
        }
      }
      if (!edges[floor].has(col)) edges[floor].set(col, new Set());
      edges[floor].get(col).add(next);
      col = next;
      usedCols[floor + 1].add(col);
    }
  }

  // ---- 2. Materialize nodes + wire edges.
  const nodes = {};
  const addNode = (floor, col) => {
    const id = nodeId(floor, col);
    if (!nodes[id]) nodes[id] = { id, floor, col, type: null, next: [] };
    return nodes[id];
  };
  for (let floor = 1; floor <= pathFloors; floor++) {
    for (const col of usedCols[floor]) addNode(floor, col);
  }
  for (let floor = 1; floor < pathFloors; floor++) {
    for (const [fromCol, tos] of edges[floor]) {
      const from = nodes[nodeId(floor, fromCol)];
      for (const toCol of tos) {
        const toId = nodeId(floor + 1, toCol);
        if (!from.next.includes(toId)) from.next.push(toId);
      }
    }
  }

  // Single pre-boss shrine row + boss (SPEC §6: floor `floors` is always a
  // lone Shrine; the Boss sits above it).
  const shrine = addNode(floors, Math.floor(cols / 2));
  shrine.type = 'shrine';
  for (const col of usedCols[pathFloors]) {
    nodes[nodeId(pathFloors, col)].next.push(shrine.id);
  }
  const boss = addNode(floors + 1, Math.floor(cols / 2));
  boss.type = 'boss';
  shrine.next.push(boss.id);

  // ---- 3. Node typing under constraints, bounded retries then relax.
  const rollable = Object.values(nodes).filter((n) => n.type === null);
  const fixed = rules.fixed || {};
  for (let attempt = 0; attempt < TYPING_RETRIES; attempt++) {
    for (const node of rollable) node.type = null;
    typeOnce(nodes, rollable, fixed, rules, config.typeWeights, rng, floors);
    if (countType(nodes, 'elite') >= (rules.minReachableElites || 0) &&
        countType(nodes, 'merchant') >= (rules.minReachableMerchants || 0)) {
      return finish(nodes, starts, shrine.id, boss.id, floors);
    }
  }
  // Relax (SPEC §6): force-place what the rolls never produced, on eligible
  // monster nodes (weakest constraint gives way; counts are a hard promise).
  relaxPlace(nodes, 'elite', rules.minReachableElites || 0, rules, rng);
  relaxPlace(nodes, 'merchant', rules.minReachableMerchants || 0, rules, rng);
  return finish(nodes, starts, shrine.id, boss.id, floors);
}

function typeOnce(nodes, rollable, fixed, rules, weights, rng, floors) {
  // Roll floor-by-floor so the adjacency rule can see typed parents.
  const byFloor = [...rollable].sort((a, b) => a.floor - b.floor);
  for (const node of byFloor) {
    if (fixed[node.floor]) {
      node.type = fixed[node.floor];
      continue;
    }
    const parents = Object.values(nodes).filter((p) => p.next.includes(node.id) && p.type);
    node.type = rollType(node, parents, rules, weights, rng);
  }
}

// Weighted roll with per-node hard filters (floor rules + no same non-monster
// type adjacent along an edge — SPEC §6).
function rollType(node, typedParents, rules, weights, rng) {
  const banned = new Set(typedParents.map((p) => p.type).filter((t) => t !== 'monster'));
  const entries = Object.entries(weights).filter(([type, w]) => {
    if (w <= 0) return false;
    if (banned.has(type)) return false;
    if ((type === 'elite' || type === 'shrine') && node.floor < (rules.noEliteOrShrineBefore || 0)) return false;
    if (type === 'shrine' && node.floor === rules.noShrineOn) return false;
    return true;
  });
  if (entries.length === 0) return 'monster';
  const total = entries.reduce((a, [, w]) => a + w, 0);
  let r = rng.float('map') * total;
  for (const [type, w] of entries) {
    r -= w;
    if (r < 0) return type;
  }
  return 'monster';
}

function relaxPlace(nodes, type, min, rules, rng) {
  let have = countType(nodes, type);
  const eligible = Object.values(nodes).filter(
    (n) => n.type === 'monster' &&
      !(type === 'elite' && n.floor < (rules.noEliteOrShrineBefore || 0))
  );
  while (have < min && eligible.length > 0) {
    const idx = Math.floor(rng.float('map') * eligible.length);
    eligible.splice(idx, 1)[0].type = type;
    have++;
  }
}

function countType(nodes, type) {
  return Object.values(nodes).filter((n) => n.type === type).length;
}

function finish(nodes, startCols, shrineId, bossId, floors) {
  const startIds = [...new Set(startCols)].map((col) => `n1_${col}`);
  return { nodes, startIds, shrineId, bossId, floors };
}

function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}


Object.assign(module.exports, { NODE_TYPES, generateActMap });

},
"src/engine/save.js": function (module, exports, require) {
// src/engine/save.js — run persistence with schema + content versioning
// (SPEC §3.12)
//
// Storage is injected so the module stays headless: the UI passes
// window.localStorage; tests pass a plain in-memory stub with the same
// getItem/setItem/removeItem shape. Saves that can't be trusted (unknown
// schemaVersion, corrupt JSON, dangling content ids after a content change)
// are ARCHIVED — moved aside, never silently deleted — and load returns null.

const { serializeRun, deserializeRun } = require("src/model/state.js");

const RUN_KEY = 'sote_run_v1';
const RUN_ARCHIVE_KEY = 'sote_run_archived';
const META_KEY = 'sote_meta_v1';
const SLOTS = 3; // save slots, one run each
const HISTORY_LIMIT = 20;

// Slot 1 keeps the legacy key (backward compatible: existing saves are slot 1);
// slots 2..N use suffixed keys. All slot-taking methods default to slot 1.
function runKey(slot = 1) {
  return slot === 1 ? RUN_KEY : `${RUN_KEY}_s${slot}`;
}

/**
 * createSaveManager(storage) → { saveRun, loadRun, clearRun, hasRun, slotSummary,
 *                                listSlots, loadMeta, saveMeta, recordResult }
 */
function createSaveManager(storage) {
  if (!storage || typeof storage.getItem !== 'function') {
    throw new Error('createSaveManager requires a storage with getItem/setItem/removeItem');
  }

  function archive(json, reason, slot = 1) {
    storage.setItem(RUN_ARCHIVE_KEY, JSON.stringify({ reason, save: json }));
    storage.removeItem(runKey(slot));
  }

  return {
    /** Persist after every committed choice (SPEC §3.12). Stamps RNG counters. */
    saveRun(run, rng, slot = 1) {
      if (rng) run.streamCounters = rng.getCounters();
      storage.setItem(runKey(slot), serializeRun(run));
    },

    /**
     * loadRun(registries, slot?) → run | null. Refuses and archives: corrupt
     * JSON, unknown schemaVersion, or (on contentVersion mismatch) any deck/
     * relic/flask id that no longer resolves against the current registries.
     */
    loadRun(registries, slot = 1) {
      const json = storage.getItem(runKey(slot));
      if (!json) return null;
      let run;
      try {
        run = deserializeRun(json);
      } catch (e) {
        archive(json, e && e.message ? e.message : 'corrupt save', slot);
        return null;
      }
      if (run.contentVersion !== registries.contentVersion) {
        const dangling =
          (run.deck || []).find((c) => !registries.cards.has(c.cardId)) ||
          (run.relics || []).find((id) => !registries.relics.has(id)) ||
          (run.flasks || []).find((f) => !registries.flasks.has(f.flaskId));
        if (dangling) {
          archive(json, `contentVersion ${run.contentVersion} → ${registries.contentVersion}: dangling id`, slot);
          return null;
        }
        // Ids all still resolve: the run survives the content patch.
        run.contentVersion = registries.contentVersion;
      }
      return run;
    },

    hasRun(slot = 1) {
      return storage.getItem(runKey(slot)) != null;
    },

    clearRun(slot = 1) {
      storage.removeItem(runKey(slot));
    },

    /**
     * slotSummary(slot?) → a cheap descriptor for the slot picker (no content
     * validation), or null if empty/corrupt. Full validation happens on loadRun.
     */
    slotSummary(slot = 1) {
      const json = storage.getItem(runKey(slot));
      if (!json) return null;
      try {
        const r = JSON.parse(json);
        return {
          slot,
          class: r.class,
          actNumber: r.actNumber,
          floor: r.floor,
          seedString: r.seedString,
          hp: r.hp,
          maxHp: r.maxHp,
          customization: r.customization,
        };
      } catch (e) {
        return null;
      }
    },

    /** listSlots() → [{ slot, summary|null }] for every slot. */
    listSlots() {
      const out = [];
      for (let s = 1; s <= SLOTS; s++) out.push({ slot: s, summary: this.slotSummary(s) });
      return out;
    },

    // ---- meta: settings + last N run results (SPEC §3.12) -------------------
    loadMeta() {
      try {
        const meta = JSON.parse(storage.getItem(META_KEY) || 'null');
        if (meta && typeof meta === 'object') return meta;
      } catch (e) {
        /* fall through to fresh meta */
      }
      return { settings: {}, results: [] };
    },

    saveMeta(meta) {
      storage.setItem(META_KEY, JSON.stringify(meta));
    },

    /** Append a run result (victory, floor, seed, class, …), capped at 20. */
    recordResult(result) {
      const meta = this.loadMeta();
      meta.results.push(result);
      if (meta.results.length > HISTORY_LIMIT) {
        meta.results.splice(0, meta.results.length - HISTORY_LIMIT);
      }
      this.saveMeta(meta);
      return meta;
    },
  };
}

/** Plain in-memory storage stub (tests, or environments without localStorage). */
function createMemoryStorage() {
  const map = new Map();
  return {
    getItem: (k) => (map.has(k) ? map.get(k) : null),
    setItem: (k, v) => map.set(k, String(v)),
    removeItem: (k) => map.delete(k),
  };
}


Object.assign(module.exports, { RUN_KEY, RUN_ARCHIVE_KEY, META_KEY, SLOTS, createSaveManager, createMemoryStorage });

},
"src/engine/encounters.js": function (module, exports, require) {
// src/engine/encounters.js — encounter + reward rolls, shop stock, unknown
// nodes, shrine math (SPEC §3.8, §6)
//
// Procedural systems: seeded algorithms whose every knob comes from content
// (balance.js, encounters/*.js). Pure functions of (registries, rng, args) —
// run mutation is limited to explicitly documented counters (flask pity,
// removal price). Stream usage: encounters → 'enemyAI', card rewards →
// 'cardRewards', relics → 'relicRewards', flasks → 'flaskRewards',
// unknown nodes + events → 'events', shop stock → 'shop', runes → 'misc'.
//
// Headless: no document/window/localStorage/timers.

const { passiveMult, passiveFlag } = require("src/model/registries.js");

// ---------------------------------------------------------------------------
// Encounters
// ---------------------------------------------------------------------------

/**
 * rollEncounter(registries, rng, { pool, act, exclude }) → encounter id.
 * Weighted pick from the act's pool; `exclude` is the no-repeat window
 * (pass the last 1–2 fought encounter ids). Encounters default to act 1.
 */
function rollEncounter(registries, rng, { pool, act = 1, exclude = [] } = {}) {
  const inActPool = (e) => e.pool === pool && (e.act || 1) === act;
  let candidates = registries.encounters.all().filter((e) => inActPool(e) && !exclude.includes(e.id));
  if (candidates.length === 0) {
    candidates = registries.encounters.all().filter(inActPool);
  }
  if (candidates.length === 0) throw new Error(`No encounters in pool '${pool}' for act ${act}`);
  const total = candidates.reduce((a, e) => a + e.weight, 0);
  let r = rng.float('enemyAI') * total;
  for (const e of candidates) {
    r -= e.weight;
    if (r < 0) return e.id;
  }
  return candidates[candidates.length - 1].id;
}

// ---------------------------------------------------------------------------
// Combat rewards (SPEC §6)
// ---------------------------------------------------------------------------

/** Rune reward for a combat pool, scaled by runeGainMult passives (floored). */
function rollRuneReward(registries, rng, pool, relicIds) {
  const range = registries.balance.rewards.runes[pool];
  const base = rng.int('misc', range[0], range[1]);
  return Math.floor(base * passiveMult(registries, relicIds, 'runeGainMult'));
}

/**
 * rollCardRewardIds(registries, rng, { classId, pool, relicIds }) → distinct
 * card ids (rarity-weighted per pool; elites offer +1 with Beast Eye).
 */
function rollCardRewardIds(registries, rng, { classId, pool, relicIds = [], flatRarity = false }) {
  const bal = registries.balance.rewards;
  let count = bal.cardChoices;
  if (pool === 'elite' && passiveFlag(registries, relicIds, 'eliteExtraCardReward')) count += 1;

  const cardPool = registries.classes.get(classId).cardPool;
  // flatRarity (Custom Climb "Chaos Rewards") ignores the pool weighting and
  // gives every rarity equal odds — far more rares than normal.
  const weights = flatRarity
    ? { common: 1, uncommon: 1, rare: 1 }
    : bal.rarityWeights[pool] || bal.rarityWeights.normal;
  const byRarity = {};
  for (const id of cardPool) {
    const def = registries.cards.get(id);
    (byRarity[def.rarity] = byRarity[def.rarity] || []).push(id);
  }
  const rarities = Object.keys(weights).filter((r) => byRarity[r] && byRarity[r].length);
  const total = rarities.reduce((a, r) => a + weights[r], 0);

  const picks = [];
  let guard = 0;
  while (picks.length < count && guard++ < 100) {
    let roll = rng.float('cardRewards') * total;
    let rarity = rarities[rarities.length - 1];
    for (const r of rarities) {
      roll -= weights[r];
      if (roll < 0) {
        rarity = r;
        break;
      }
    }
    const options = byRarity[rarity].filter((id) => !picks.includes(id));
    if (!options.length) continue;
    picks.push(rng.pick('cardRewards', options));
  }
  return picks;
}

/**
 * rollFlaskDrop(registries, rng, run) → flask id | null.
 * StS-style decaying chance: −step on a drop, +step on a miss (clamped),
 * persisted on run.flaskChancePct.
 */
function rollFlaskDrop(registries, rng, run) {
  const bal = registries.balance.rewards;
  if (run.flaskChancePct == null) run.flaskChancePct = bal.flaskDropBasePct;
  const hit = rng.float('flaskRewards') * 100 < run.flaskChancePct;
  if (hit) {
    run.flaskChancePct = Math.max(0, run.flaskChancePct - bal.flaskDropStepPct);
    const pool = registries.flasks.ids();
    return pool.length ? rng.pick('flaskRewards', pool) : null;
  }
  run.flaskChancePct = Math.min(100, run.flaskChancePct + bal.flaskDropStepPct);
  return null;
}

/**
 * rollRelicReward(registries, rng, ownedIds, { rarities }) → relic id | null.
 * Excludes owned relics; default pool is common/uncommon/rare (elite drops);
 * pass ['boss'] for boss rewards.
 */
function rollRelicReward(registries, rng, ownedIds, { rarities = ['common', 'uncommon', 'rare'] } = {}) {
  const pool = registries.relics
    .all()
    .filter((r) => rarities.includes(r.rarity) && !ownedIds.includes(r.id))
    .map((r) => r.id);
  return pool.length ? rng.pick('relicRewards', pool) : null;
}

// ---------------------------------------------------------------------------
// Shop (SPEC §6 prices — all from balance.shop)
// ---------------------------------------------------------------------------

/**
 * buildShopStock(registries, rng, run) → { cards, relics, flasks, removeCost }.
 * cards/relics/flasks: [{ id, cost }]. Deterministic on stream 'shop'.
 */
function buildShopStock(registries, rng, run) {
  const bal = registries.balance.shop;
  const classId = run.class;

  const cardIds = rollShopCards(registries, rng, classId, bal.cardStock);
  const cards = cardIds.map((id) => ({
    id,
    cost: rng.int('shop', ...bal.cardCost[registries.cards.get(id).rarity]),
  }));

  const relicPool = registries.relics
    .all()
    .filter((r) => ['common', 'uncommon', 'rare'].includes(r.rarity) && !run.relics.includes(r.id))
    .map((r) => r.id);
  const relics = [];
  for (let i = 0; i < bal.relicStock && relicPool.length; i++) {
    const id = rng.pick('shop', relicPool);
    relicPool.splice(relicPool.indexOf(id), 1);
    relics.push({ id, cost: rng.int('shop', ...bal.relicCost[registries.relics.get(id).rarity]) });
  }

  const flaskIds = registries.flasks.ids();
  const flasks = [];
  for (let i = 0; i < bal.flaskStock && flaskIds.length; i++) {
    const id = rng.pick('shop', flaskIds);
    flasks.push({ id, cost: rng.int('shop', bal.flaskCost[0], bal.flaskCost[1]) });
  }

  const removeCost = bal.removeBase + bal.removeStep * (run.removesPurchased || 0);
  return { cards, relics, flasks, removeCost };
}

// Shop card pool = the class pool + neutral colorless cards (StS-faithful:
// colorless is sold at Merchants, not offered in standard combat rewards).
// The status/curse colorless are rarity 'special' and excluded here.
const SHOP_RARITIES = ['common', 'uncommon', 'rare'];
function rollShopCards(registries, rng, classId, count) {
  const colorless = registries.cards
    .all()
    .filter((c) => c.class === 'colorless' && SHOP_RARITIES.includes(c.rarity))
    .map((c) => c.id);
  const pool = [...registries.classes.get(classId).cardPool, ...colorless];
  const out = [];
  while (out.length < count && pool.length) {
    const id = rng.pick('shop', pool);
    pool.splice(pool.indexOf(id), 1);
    out.push(id);
  }
  return out;
}

// ---------------------------------------------------------------------------
// Unknown nodes + shrine math
// ---------------------------------------------------------------------------

/**
 * resolveUnknownNode(registries, rng, { seenEvents }) →
 *   { kind: 'event', eventId } | { kind: 'fight'|'shrine'|'treasure' }
 * Odds from balance.unknownNode; events avoid repeats within a run while
 * unseen ones remain. Stream 'events' (SPEC §5.6).
 */
function resolveUnknownNode(registries, rng, { seenEvents = [] } = {}) {
  const odds = registries.balance.unknownNode;
  const total = Object.values(odds).reduce((a, b) => a + b, 0);
  let r = rng.float('events') * total;
  let kind = 'event';
  for (const [k, w] of Object.entries(odds)) {
    r -= w;
    if (r < 0) {
      kind = k;
      break;
    }
  }
  if (kind !== 'event') return { kind };
  let pool = registries.events.ids().filter((id) => !seenEvents.includes(id));
  if (!pool.length) pool = registries.events.ids();
  if (!pool.length) return { kind: 'fight' }; // no events shipped: fall back
  return { kind: 'event', eventId: rng.pick('events', pool) };
}

/** Shrine rest heal (SPEC shrine.healPct × shrineHealMult passives, floored). */
function shrineHealAmount(registries, run) {
  const pct = registries.balance.shrine.healPct;
  const mult = passiveMult(registries, run.relics, 'shrineHealMult');
  return Math.min(run.maxHp - run.hp, Math.floor((run.maxHp * pct * mult) / 100));
}


Object.assign(module.exports, { rollEncounter, rollRuneReward, rollCardRewardIds, rollFlaskDrop, rollRelicReward, buildShopStock, resolveUnknownNode, shrineHealAmount });

},
"src/ui/screens/title.js": function (module, exports, require) {
// src/ui/screens/title.js — animated main menu + save slots (SPEC §7.1, §3.12)
//
// Ambient animation only (gold-glow pulse, drifting embers) — feedback
// animations stay ≤300 ms elsewhere; ambient loops respect
// prefers-reduced-motion (styles/ui.css). The menu is a list of save slots
// (one run each): Continue an occupied slot, or Begin a climb in an empty one.

const { esc } = require("src/ui/components/tooltip.js");

function mountTitle(app, { slots, onContinue, onNew, onDelete, onHistory, onSettings, onQuit, onCustom }) {
  // Ember density follows the "Ambient effects" setting (data-ambient on <html>).
  const EMBER_COUNT = { off: 0, low: 3, normal: 7, high: 14 };
  const emberN = EMBER_COUNT[document.documentElement.dataset.ambient] ?? 7;
  const embers = Array.from({ length: emberN }, (_, i) => {
    const left = 8 + ((i * 13.7) % 84);
    const delay = (i * 1.7) % 9;
    const dur = 7 + (i % 4) * 2;
    return `<span class="ember" style="left:${left}%;animation-delay:${delay}s;animation-duration:${dur}s"></span>`;
  }).join('');

  const slotCards = slots
    .map(({ slot, summary }) =>
      summary
        ? `<div class="slot occupied">
             <div class="slot-info">
               <span class="slot-tag">SLOT ${slot}</span>
               <span class="slot-title">${esc(summary.className)}</span>
               <span class="slot-meta">Act ${summary.actNumber} · Floor ${summary.floor} · ${summary.hp}/${summary.maxHp} HP</span>
               <span class="slot-seed">SEED ${esc(summary.seedString)}</span>
             </div>
             <div class="slot-actions">
               <button class="slot-continue" data-slot="${slot}">CONTINUE</button>
               <button class="subtle slot-delete" data-slot="${slot}" title="Delete this run">✕</button>
             </div>
           </div>`
        : `<div class="slot empty">
             <div class="slot-info"><span class="slot-tag">SLOT ${slot}</span><span class="slot-empty-label">Empty</span></div>
             <button class="slot-new" data-slot="${slot}">BEGIN A CLIMB</button>
           </div>`
    )
    .join('');

  app.innerHTML = `
    <div class="screen title-screen">
      ${embers}
      <div class="title-stack">
        <h1 class="title-big title-glow">SPIRE OF THE ERDTREE</h1>
        <p class="subtitle" style="text-align:center">A ROGUELIKE DECKBUILDER</p>
      </div>
      <div class="slot-list">${slotCards}</div>
      <div class="title-menu">
        <button class="subtle" id="custom-climb">CUSTOM CLIMB</button>
        <button class="subtle" id="run-history">RUN HISTORY</button>
        <button class="subtle" id="settings">SETTINGS</button>
        <button class="subtle" id="quit-game">QUIT</button>
      </div>

  if (onCustom) app.querySelector('#custom-climb').addEventListener('click', onCustom);
  app.querySelectorAll('.slot-continue').forEach((b) => b.addEventListener('click', () => onContinue(+b.dataset.slot)));
  app.querySelectorAll('.slot-new').forEach((b) => b.addEventListener('click', () => onNew(+b.dataset.slot)));
  // Delete is a two-click, self-resetting confirm (no blocking dialog).
  app.querySelectorAll('.slot-delete').forEach((b) =>
    b.addEventListener('click', () => {
      if (b.dataset.armed === '1') return onDelete(+b.dataset.slot);
      b.dataset.armed = '1';

      b.classList.add('armed');
      setTimeout(() => {
        if (b.isConnected) {
          b.dataset.armed = '0';

  );

"src/ui/components/tooltip.js": function (module, exports, require) {
// src/ui/components/tooltip.js — one shared tooltip, ≤150 ms hover (SPEC §7.3)

let tipEl = null;
let showTimer = null;

function ensure() {
  if (!tipEl) {
    tipEl = document.createElement('div');
    tipEl.id = 'tooltip';
    document.body.appendChild(tipEl);
  }
  return tipEl;
}

function position(x, y) {
  const el = ensure();
  const pad = 14;
  const r = el.getBoundingClientRect();
  let left = x + pad;
  let top = y + pad;
  if (left + r.width > innerWidth - 8) left = x - r.width - pad;
  if (top + r.height > innerHeight - 8) top = y - r.height - pad;
  el.style.left = `${Math.max(4, left)}px`;
  el.style.top = `${Math.max(4, top)}px`;
}

/**
 * attachTooltip(el, contentFn) — contentFn() → HTML string (computed at show
 * time so numbers are always live).
 */
function attachTooltip(el, contentFn) {
  el.addEventListener('pointerenter', (ev) => {
    clearTimeout(showTimer);
    showTimer = setTimeout(() => {
      const html = contentFn();
      if (!html) return;
      const t = ensure();
      t.innerHTML = html;
      t.style.display = 'block';
      position(ev.clientX, ev.clientY);
    }, 140);
  });
  el.addEventListener('pointermove', (ev) => {
    if (tipEl && tipEl.style.display === 'block') position(ev.clientX, ev.clientY);
  });
  el.addEventListener('pointerleave', () => {
    clearTimeout(showTimer);
    if (tipEl) tipEl.style.display = 'none';
  });
}

function hideTooltip() {
  clearTimeout(showTimer);
  if (tipEl) tipEl.style.display = 'none';
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
}


Object.assign(module.exports, { attachTooltip, hideTooltip, esc });

},

"src/ui/assets.js": function (module, exports, require) {
// src/ui/assets.js — asset lookup + placeholder generator (SPEC §2.4)

const SIZE_TIERS = {

  large: { w: 150, h: 160, font: 60 },
};

// Enemy id → size tier (display only; defaults to medium). Bosses & the biggest
// bruisers read 'large'; fast/fragile minions 'small'. All three acts tuned so
// no enemy falls back to the generic default.
const ENEMY_TIER = {
  // Act 1
  rotHound: 'small', graveWisp: 'small', wanderingSoldier: 'medium', demiBrute: 'medium',
  crucibleAspirant: 'large', watchfulOmen: 'large',
  // Act 2 — The Grafted Court
  courtMarionette: 'small', graftedHound: 'small', courtSurgeon: 'medium',
  gildedKnight: 'medium', livingArmor: 'medium', courtDuelist: 'large', graftedKing: 'large',
  // Act 3 — The Ashen Crown
  graceStarvedPilgrim: 'small', valkyrieShade: 'medium', ashRevenant: 'medium',
  charredColossus: 'large', crucibleLord: 'large', rotValkyrie: 'large',
};

// Enemy id → border tint (thematic: blood=Bleed, rot=Scarlet Rot, gold=elite/boss
// radiance, frost=armor, grace=spectral, ember=ash). Defaults to var(--line-soft).
const ENEMY_TINT = {
  // Act 1
  graveWisp: 'var(--grace)', rotHound: 'var(--rot)', crucibleAspirant: 'var(--gold)', watchfulOmen: 'var(--blood)',
  // Act 2
  gildedKnight: 'var(--gold)', courtSurgeon: 'var(--grace)', graftedHound: 'var(--blood)',
  courtMarionette: 'var(--rot)', livingArmor: 'var(--frost)', courtDuelist: 'var(--frost)', graftedKing: 'var(--gold)',
  // Act 3
  ashRevenant: 'var(--ember)', graceStarvedPilgrim: 'var(--grace)', valkyrieShade: 'var(--blood)',
  charredColossus: 'var(--ember)', crucibleLord: 'var(--gold)', rotValkyrie: 'var(--rot)',
};

/** Placeholder sprite: tinted rounded rect + glyph (+shadow), per style guide. */
function enemySprite(enemyDef) {
  const tier = SIZE_TIERS[ENEMY_TIER[enemyDef.id] || 'medium'];
  const tint = ENEMY_TINT[enemyDef.id] || 'var(--line-soft)';
  const el = document.createElement('div');
  el.style.cssText = `width:${tier.w}px;height:${tier.h}px;border-radius:10px;` +
    `background:var(--panel);border:2px solid ${tint};display:flex;align-items:center;` +
    `justify-content:center;font-size:${tier.font}px;position:relative;` +
    `box-shadow:0 ${Math.round(tier.h * 0.08)}px 10px rgba(0,0,0,.5);`;
  el.textContent = enemyDef.art || '☠';
  return el;
}

// Character customization options (cosmetic — stored on run.customization).
const PORTRAIT_GLYPHS = ['⚔', '🛡', '🔥', '🌙', '☀', '🐺'];
const PORTRAIT_TINTS = [
  { id: 'gold', css: 'var(--gold)', name: 'Erdtree gold' },
  { id: 'ember', css: 'var(--ember)', name: 'Bloodflame ember' },
  { id: 'frost', css: 'var(--frost)', name: 'Carian frost' },

function setSpritesEnabled(on) {

}
function spritesAreEnabled() {

}

const CLASS_SVG = {

        <path d="M74 58 Q79 48 68 46 L64 62Z"/>

      <path d="M40 56 Q55 49 70 56" fill="none" stroke="${t}" stroke-width="1.5"/>

  // Astrologer — robed mage, wide pointed hat, star-topped staff, sparkles.
  astrologer: (t) => `
    <svg viewBox="0 0 110 140" xmlns="http://www.w3.org/2000/svg" width="110" height="140">
      <ellipse cx="55" cy="133" rx="26" ry="5" fill="rgba(0,0,0,.45)"/>

      <path d="M40 60 L30 130 L80 130 L70 60 Q55 54 40 60Z" fill="#2b2547"/>

      <circle cx="40" cy="96" r="1.5" fill="${t}"/>
    </svg>`,
  // Prophet — hooded pilgrim, halo, prayer beads at the waist.
  prophet: (t) => `
    <svg viewBox="0 0 110 140" xmlns="http://www.w3.org/2000/svg" width="110" height="140">
      <ellipse cx="55" cy="133" rx="26" ry="5" fill="rgba(0,0,0,.45)"/>

      <path d="M40 44 Q55 20 70 44 L70 72 Q55 80 40 72Z" fill="#241413"/>

    </svg>`,
};

/** A tinted inline-SVG class sprite, or null if the class has none. */
function classSprite(classId, tint) {
  const build = CLASS_SVG[classId];
  if (!build) return null;
  const el = document.createElement('div');
  el.className = 'class-sprite';
  el.style.cssText = 'width:110px;height:140px;display:flex;align-items:flex-end;justify-content:center;';
  el.innerHTML = build(tint);
  return el;
}

/**
 * The player's combat figure: the class sprite when sprites are enabled (and the
 * class has one), else the chosen sigil glyph in a tinted panel.
 */
function playerSprite(customization = {}, classId) {
  const tint = tintCss(customization.tint);
  if (spritesEnabled && CLASS_SVG[classId]) {
    return classSprite(classId, tint);

  el.style.cssText =
    `width:110px;height:140px;border-radius:10px;background:#2a2418;border:2px solid ${tint};` +

  return el;

  const t = PORTRAIT_TINTS.find((x) => x.id === tintId);
  return t ? t.css : 'var(--gold)';
}

  return { vagabond: '⚔', astrologer: '☄', prophet: '☀' }[classId] || '❖';
}
