<!doctype html>
<html>
<head>
<style>
  html { --ui-zoom: 1.5; }
  body { margin: 0; zoom: var(--ui-zoom, 1); width: 2000px; height: 2000px; }
  #fixedChild  { position: fixed;    width: 10px; height: 10px; background: red; }
  #absChild    { position: absolute; width: 10px; height: 10px; background: blue; }
  #layer       { position: absolute; inset: 0; }
  #layerChild  { position: absolute; width: 10px; height: 10px; background: green; }
</style>
</head>
<body>
<div id="fixedChild"></div>
<div id="absChild"></div>
<div id="layer"><div id="layerChild"></div></div>
<pre id="out"></pre>
<script>
  // Write 100 LOCAL px into each element's inline left, then ask the browser
  // where it ended up in VISUAL px. 150 => zoom scaled it (the two spaces
  // differ). 100 => this element escaped the zoom (the two spaces agree).
  const WROTE = 100;
  const r = [];
  for (const id of ['fixedChild', 'absChild', 'layerChild']) {
    const el = document.getElementById(id);
    el.style.left = WROTE + 'px';
    el.style.top = WROTE + 'px';
    const b = el.getBoundingClientRect();
    r.push(id + ' wrote_local=' + WROTE + ' visual_left=' + b.left + ' visual_width=' + b.width
      + ' => scaled_by_zoom=' + (Math.abs(b.left - WROTE * 1.5) < 0.5));
  }
  // And the reverse direction: the mistake itself. Read a rect (visual), write it
  // straight back as local, re-read. Drift proves the round trip is not identity.
  const t = document.getElementById('fixedChild');
  const before = t.getBoundingClientRect().left;
  t.style.left = before + 'px';
  const after = t.getBoundingClientRect().left;
  r.push('roundtrip fixed: read_visual=' + before + ' wrote_it_back_as_local => now_visual=' + after
    + ' => drift=' + (after - before));
  document.getElementById('out').textContent = r.join('\n');
</script>
</body>
</html>
