<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ashen Spire — library logo</title>
<link rel="stylesheet" href="store.css">
<style>
/* Library logo (1280x720): the logotype alone on a TRANSPARENT background —
   Steam composites this over the hero. No field, no veil, no other words.
   The generator captures with the browser backdrop cleared to alpha 0; the
   html/body backgrounds are cleared here so nothing paints behind the type. */
html, body { background: transparent; }
.stack { gap: 0.5em; }
.wordmark { font-size: 168px; text-shadow: 0 0 46px rgba(var(--accent-rgb), 0.4), 0 3px 16px rgba(0, 0, 0, 0.8); }
</style>
</head>
<body>
<div class="stack">
  <div class="wordmark">ASHEN SPIRE</div>
</div>
<script type="module">
  import { TASTE } from './taste.js';
  if (TASTE.palette === 'hi-contrast') document.body.classList.add('hi-contrast');
</script>
</body>
</html>
