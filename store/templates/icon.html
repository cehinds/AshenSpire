<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ashen Spire — icon</title>
<link rel="stylesheet" href="store.css">
<style>
/* Community icon (184x184) and client icon (32x32): one mark, no letters —
   a spire peak with its ember, ringed the way a map node is ringed. Vector,
   so both sizes come from the same drawing; at 32px the ring thickens via
   ?tiny=1 so the mark survives (a hairline ring at 32px is under a pixel).
   All ink is tokens — the same palette the game resolves. */
html, body { background: transparent; }
.mark { position: absolute; inset: 0; }
.mark svg { width: 100%; height: 100%; display: block; }
.i-field { fill: var(--bg); }
.i-ring { fill: none; stroke: var(--gold); stroke-width: 3; }
body.tiny .i-ring { stroke-width: 6; }
.i-spire-far { fill: var(--panel); }
.i-spire-near { fill: var(--bg-raise); }
.i-ember { fill: var(--gold); }
.i-halo { fill: none; stroke: var(--gold); stroke-opacity: 0.35; }
body.tiny .i-halo { display: none; }
</style>
</head>
<body class="hi-contrast">
<div class="mark">
  <svg viewBox="0 0 100 100">
    <rect class="i-field" x="2" y="2" width="96" height="96" rx="18"/>
    <rect class="i-ring" x="2" y="2" width="96" height="96" rx="18"/>
    <!-- the spire: same silhouette family as store.css's clip-path, reduced -->
    <polygon class="i-spire-far" points="18,84 34,52 42,60 52,26 60,44 68,38 82,84"/>
    <polygon class="i-spire-near" points="38,84 50,58 58,66 66,50 78,84"/>
    <!-- the ember above the peak -->
    <circle class="i-ember" cx="52" cy="16" r="4.5"/>
    <circle class="i-halo" cx="52" cy="16" r="8"/>
  </svg>
</div>
<script>
  if (new URLSearchParams(location.search).get('tiny') === '1') document.body.classList.add('tiny');
</script>
</body>
</html>
